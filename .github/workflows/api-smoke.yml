# 공공 API 실측 진단 — 열쇠가 있는 자리에서 부르고 **원자료는 아티팩트로 보존**한다.
#
# 왜 이 방식인가 (docs/운영지침-공공API-활용.md §0):
#   Actions Secrets 는 다시 읽을 수 없다. 그래서 열쇠를 꺼내는 대신
#   열쇠를 쓸 수 있는 이 자리에서 대신 부르고, 사람이 읽는 요약만 남긴다.
#   열쇠는 저장소 밖으로 안 나가고 로그에도 안 남는다.
#
# 이 저장소는 공개다 — 그래서 커밋 전에 api-report.js 가 결과에 열쇠가
# 섞였는지 직접 세고, 걸리면 파일을 안 쓰고 빨갛게 끝난다 (§10 · CLAUDE.md §2).

name: 공공 API 실측 진단

on:
  workflow_dispatch:
  # 실행 권한이 없는 수집 환경에서도 이 별도 브랜치에 새 커밋이 오면 새 실행을 만든다.
  # main 에는 이 줄을 합치지 않는다.
  push:
    branches:
      - codex/data-buyeo-mansu-25-12-20260910
    paths:
      - .github/workflows/api-smoke.yml
      - im-agent/tools/collect-parcel-source.js
      - im-agent/connectors/reb.js
      - package.json
  schedule:
    - cron: '0 21 * * 1'          # 매주 월요일 06:00 KST (UTC 표기 — CLAUDE.md §2)

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # 이 수집 브랜치에서는 한 필지의 원문 응답을 먼저 보존한다.
      # main 의 정기 진단은 바꾸지 않는다 — 이 워크플로는 선택한 브랜치의 파일로 돈다.
      - name: 만수리 25-12 원자료를 실제로 수집한다
        env:
          VWORLD_KEY:        ${{ secrets.VWORLD_KEY }}
          VWORLD_DOMAIN:     ${{ secrets.VWORLD_DOMAIN }}
          DATA_GO_KR_KEY:    ${{ secrets.DATA_GO_KR_KEY }}
          DART_API_KEY:      ${{ secrets.DART_API_KEY }}
          REB_API_KEY:       ${{ secrets.REB_API_KEY }}
          KOSIS_API_KEY:     ${{ secrets.KOSIS_API_KEY }}
          ECOS_API_KEY:      ${{ secrets.ECOS_API_KEY }}
          ECOS_BOK_KEY:      ${{ secrets.ECOS_BOK_KEY }}
          KEPCO_BIGDATA_KEY: ${{ secrets.KEPCO_BIGDATA_KEY }}
          KMA_APIHUB_KEY:    ${{ secrets.KMA_APIHUB_KEY }}
          LAW_OC:            ${{ secrets.LAW_OC }}
          LAW_OPEN_DATA:     ${{ secrets.LAW_OPEN_DATA }}
          KICT_API_KEY:      ${{ secrets.KICT_API_KEY }}
          KICT_API_BASE:     ${{ secrets.KICT_API_BASE }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
          KRX_API_KEY:       ${{ secrets.KRX_API_KEY }}
        run: |
          mkdir -p data/parcel/buyeo-mansu-25-12/raw
          npm run im:collect-parcel -- \
            --address "충청남도 부여군 외산면 만수리 25-12" \
            --region "부여군" \
            --pnu "4476033030100250012" \
            --out data/parcel/buyeo-mansu-25-12

      # 공개 저장소 커밋 전에 사람이 원문을 확인할 수 있도록 아티팩트로만 보관한다.
      - name: 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: buyeo-mansu-25-12-source
          path: data/parcel/buyeo-mansu-25-12
          if-no-files-found: warn
