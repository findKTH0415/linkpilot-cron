# 공공 API 실측 진단 — 열쇠가 있는 자리에서 부르고 **결과만 커밋**한다.
#
# 왜 이 방식인가 (docs/운영지침-공공API-활용.md §0):
#   Actions Secrets 는 다시 읽을 수 없다. 그래서 열쇠를 꺼내는 대신
#   열쇠를 쓸 수 있는 이 자리에서 대신 부르고, 사람이 읽는 요약만 남긴다.
#   열쇠는 저장소 밖으로 안 나가고 로그에도 안 남는다.
#
# 이 저장소는 공개다 — 그래서 커밋 전에 api-report.js 가 결과에 열쇠가
# 섞였는지 직접 세고, 걸리면 파일을 안 쓰고 빨갛게 끝난다 (§10 · CLAUDE.md §2).

name: 공공 API 실측 진단

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * 1'          # 매주 월요일 06:00 KST (UTC 표기 — CLAUDE.md §2)

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # 진단이 실패해도 다음 단계로 간다 — 실패한 항목이 곧 우리가 알고 싶은 것이다
      - name: 26개 커넥터를 실제로 불러 본다
        continue-on-error: true
        env:
          VWORLD_KEY:        ${{ secrets.VWORLD_KEY }}
          VWORLD_DOMAIN:     ${{ secrets.VWORLD_DOMAIN }}
          LINKPILOT_VWORLD_REPORT_KEY: ${{ secrets.LINKPILOT_VWORLD_REPORT_KEY }}
          LINKPILOT_VWORLD_WEB_KEY:    ${{ secrets.LINKPILOT_VWORLD_WEB_KEY }}
          DATA_GO_KR_KEY:    ${{ secrets.DATA_GO_KR_KEY }}
          APIS_DATA:         ${{ secrets.APIS_DATA }}
          SPECIAL_DAY_INFO:  ${{ secrets.SPECIAL_DAY_INFO }}
          WEATHER_GO:        ${{ secrets.WEATHER_GO }}
          DART_API_KEY:      ${{ secrets.DART_API_KEY }}
          REB_API_KEY:       ${{ secrets.REB_API_KEY }}
          KOSIS_API_KEY:     ${{ secrets.KOSIS_API_KEY }}
          ECOS_API_KEY:      ${{ secrets.ECOS_API_KEY }}
          ECOS_BOK_KEY:      ${{ secrets.ECOS_BOK_KEY }}
          KEPCO_BIGDATA_KEY: ${{ secrets.KEPCO_BIGDATA_KEY }}
          KMA_APIHUB_KEY:    ${{ secrets.KMA_APIHUB_KEY }}
          LAW_OC:            ${{ secrets.LAW_OC }}
          LAW_OPEN_DATA:     ${{ secrets.LAW_OPEN_DATA }}
          KICT_API_KEY:      ${{ secrets.KICT_API_KEY }}
          # ★ 길찾기 소요시간 〈2026-09-15 사장님 승인: 「둘 다」〉 — 이름이 둘씩이다
          KAKAO_MOBILITY_KEY: ${{ secrets.KAKAO_MOBILITY_KEY }}
          KAKAOMOBILITY_KEY:  ${{ secrets.KAKAOMOBILITY_KEY }}
          KAKAO_MOBILITY_REST_API: ${{ secrets.KAKAO_MOBILITY_REST_API }}
          ODSAY_API_KEY:      ${{ secrets.ODSAY_API_KEY }}
          ODSAY_KEY:          ${{ secrets.ODSAY_KEY }}
          KICT_API_BASE:     ${{ secrets.KICT_API_BASE }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
          KRX_API_KEY:       ${{ secrets.KRX_API_KEY }}
        run: |
          node im-agent/tools/smoke-public-data.js \
            --address "강원특별자치도 원주시 신림면 송계리 695-4" \
            > "${RUNNER_TEMP}/smoke.txt" 2>&1

      # ★ 요약을 만든다. 결과에 열쇠가 섞였으면 여기서 멈춘다(파일을 안 쓴다).
      - name: 사람이 읽는 요약으로 접는다
        env:
          VWORLD_KEY:        ${{ secrets.VWORLD_KEY }}
          VWORLD_DOMAIN:     ${{ secrets.VWORLD_DOMAIN }}
          LINKPILOT_VWORLD_REPORT_KEY: ${{ secrets.LINKPILOT_VWORLD_REPORT_KEY }}
          LINKPILOT_VWORLD_WEB_KEY:    ${{ secrets.LINKPILOT_VWORLD_WEB_KEY }}
          DATA_GO_KR_KEY:    ${{ secrets.DATA_GO_KR_KEY }}
          APIS_DATA:         ${{ secrets.APIS_DATA }}
          SPECIAL_DAY_INFO:  ${{ secrets.SPECIAL_DAY_INFO }}
          WEATHER_GO:        ${{ secrets.WEATHER_GO }}
          DART_API_KEY:      ${{ secrets.DART_API_KEY }}
          REB_API_KEY:       ${{ secrets.REB_API_KEY }}
          KOSIS_API_KEY:     ${{ secrets.KOSIS_API_KEY }}
          ECOS_API_KEY:      ${{ secrets.ECOS_API_KEY }}
          ECOS_BOK_KEY:      ${{ secrets.ECOS_BOK_KEY }}
          KEPCO_BIGDATA_KEY: ${{ secrets.KEPCO_BIGDATA_KEY }}
          KMA_APIHUB_KEY:    ${{ secrets.KMA_APIHUB_KEY }}
          LAW_OC:            ${{ secrets.LAW_OC }}
          LAW_OPEN_DATA:     ${{ secrets.LAW_OPEN_DATA }}
          KICT_API_KEY:      ${{ secrets.KICT_API_KEY }}
          # ★ 길찾기 소요시간 〈2026-09-15 사장님 승인: 「둘 다」〉 — 이름이 둘씩이다
          KAKAO_MOBILITY_KEY: ${{ secrets.KAKAO_MOBILITY_KEY }}
          KAKAOMOBILITY_KEY:  ${{ secrets.KAKAOMOBILITY_KEY }}
          KAKAO_MOBILITY_REST_API: ${{ secrets.KAKAO_MOBILITY_REST_API }}
          ODSAY_API_KEY:      ${{ secrets.ODSAY_API_KEY }}
          ODSAY_KEY:          ${{ secrets.ODSAY_KEY }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
          KRX_API_KEY:       ${{ secrets.KRX_API_KEY }}
        run: node im-agent/tools/api-report.js "${RUNNER_TEMP}/smoke.txt" --out data/_api

      # ★★★ 길찾기 소요시간 — **진단** 〈2026-09-19 · D-227〉.
      #   규격(베이스 URL·인증)을 모르므로 후보를 걸어 **무엇이 오는지부터** 본다 (§4).
      #   ★ 걸린 것이 곧 알고 싶은 것이라 continue-on-error 다 — 다만 **판정 줄을
      #     실행 요약 첫 화면으로 나른다.** 요약 파일 안에만 두면 아무도 안 본다 (§12-19).
      - name: 길찾기 소요시간을 실제로 불러 본다
        continue-on-error: true
        env:
          KAKAO_MOBILITY_KEY: ${{ secrets.KAKAO_MOBILITY_KEY }}
          KAKAOMOBILITY_KEY:  ${{ secrets.KAKAOMOBILITY_KEY }}
          KAKAO_MOBILITY_REST_API: ${{ secrets.KAKAO_MOBILITY_REST_API }}
          ODSAY_API_KEY:      ${{ secrets.ODSAY_API_KEY }}
          ODSAY_KEY:          ${{ secrets.ODSAY_KEY }}
        run: |
          node scripts/routing-probe.mjs || true
          {
            echo '### 길찾기 소요시간 진단'
            # 판정 줄만 뽑는다 — 최악 세 줄(전체 + 자동차 + 대중교통)이다
            grep -E '^> ' data/_api/routing-probe.md || echo '(판정 줄을 못 읽었다)'
          } >> "$GITHUB_STEP_SUMMARY"

      # ★★★ `WEATHER_GO` 가 **어느 기관 것인가** — 진단 〈2026-09-20 · D-247〉.
      #   2026-09-13 에 넣으신 뒤 **어느 기관인지 아직 안 쟀다.** 이름이 `weather.go.kr`
      #   을 가리키는 듯하지만 그것은 짐작이고, 기상청만 해도 열쇠를 받는 자리가 둘이다
      #   (API허브 `authKey` · 공공데이터포털 `serviceKey`). 추측으로 배선하면 그것이
      #   곧 거짓이 된다 (§4.3). 후보를 걸어 **무엇이 오는지부터** 본다.
      #   ★ 판정 줄을 **실행 요약 첫 화면**으로 나른다 — 파일 안에만 두면 아무도 안 본다 (§12-19).
      - name: WEATHER_GO 가 어느 기관 것인지 불러 본다
        continue-on-error: true
        env:
          WEATHER_GO: ${{ secrets.WEATHER_GO }}
        run: |
          node scripts/weather-probe.mjs || true
          {
            echo '### WEATHER_GO 기관 진단'
            # 판정 줄만 뽑는다 — 최악 세 줄(전체 + API허브 + 포털)이다
            grep -E '^> \*\*판정|^> 판정' data/_api/weather-probe.md || echo '(판정 줄을 못 읽었다)'
          } >> "$GITHUB_STEP_SUMMARY"

      # ★★★ 네이버 클라우드 Maps — **진단** 〈2026-09-25 · D-314〉.
      #   사장님이 Client ID · Secret 을 넣으셨는데 **넣으신 이름**과 **호스트(옛·새)** 를
      #   아직 안 쟀다. 이름 넷씩을 짝으로 읽고 두 호스트를 걸어 **무엇이 오는지부터** 본다 (§4.3).
      #   ★ 아래 env 에서 `***` 로 찍히는 이름이 실제로 들어 있는 이름이다 (§4.6 의 갈라 보는 법).
      - name: 네이버 Maps 열쇠가 먹는지 불러 본다
        continue-on-error: true
        env:
          NCP_MAPS_CLIENT_ID:       ${{ secrets.NCP_MAPS_CLIENT_ID }}
          NCP_MAPS_CLIENT_SECRET:   ${{ secrets.NCP_MAPS_CLIENT_SECRET }}
          NAVER_MAPS_CLIENT_ID:     ${{ secrets.NAVER_MAPS_CLIENT_ID }}
          NAVER_MAPS_CLIENT_SECRET: ${{ secrets.NAVER_MAPS_CLIENT_SECRET }}
          NAVER_MAP_CLIENT_ID:      ${{ secrets.NAVER_MAP_CLIENT_ID }}
          NAVER_MAP_CLIENT_SECRET:  ${{ secrets.NAVER_MAP_CLIENT_SECRET }}
          NAVER_CLIENT_ID:          ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:      ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          node scripts/naver-maps-probe.mjs || true
          {
            echo '### 네이버 Maps 진단'
            # 판정 줄만 뽑는다 — 최악 세 줄(전체 + Geocoding + Directions)이다
            grep -E '^> \*\*판정|^> 판정' data/_api/naver-maps-probe.md || echo '(판정 줄을 못 읽었다)'
          } >> "$GITHUB_STEP_SUMMARY"

      # ★★★ 기본 가지에서만 커밋한다 〈2026-09-20 · D-246 · `vworld.yml` 과 같은 규칙〉.
      #   [왜] 작업 가지에서 돌리면 봇이 민 커밋이 **열린 PR 의 머리를 움직여**,
      #   초록이던 검사가 다시 서고 `action_required`(사람이 눌러야 도는 상태)가 된다.
      #   실제로 §12-24 에서 그렇게 깨졌고, 그때 고친 것을 **이 칸에는 안 댔다** (S-53).
      # ★★ 조용히 건너뛰지 않는다 — 왜 안 남겼는지와 어디서 받는지를 적는다 (§8).
      # ★★★ 아티팩트는 이 아래에서 **어느 가지에서든** 그대로 돈다.
      - name: 결과 커밋
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -u
          if [ -z "${DEFAULT_BRANCH:-}" ]; then
            echo "::warning::기본 가지 이름을 못 받았다 — 커밋하지 않는다. 결과는 아래 아티팩트에 있다"
            exit 0
          fi
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "가지 '$REF_NAME' 에서 돌았다 — **결과를 커밋하지 않는다.**"
            echo "  까닭: 열려 있는 PR 의 머리가 움직이면 검사가 다시 서고, 봇이 민 커밋은"
            echo "        사람이 눌러 줘야 도는 상태(action_required)가 된다."
            echo "  받을 곳: 아래 «아티팩트 업로드» (api-smoke) — 진단 요약까지 그대로 들어 있다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_api
          git diff --staged --quiet || git commit -m "공공 API 실측 진단 ($(date -u +%Y-%m-%d))"
          git push

      # 커밋이 막혀도(브랜치 보호 등) 결과를 회수할 수 있게 (지침서 §8)
      - name: 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-smoke
          path: data/_api
          if-no-files-found: warn
