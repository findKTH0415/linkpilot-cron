name: alert-ci

# 실패 알림 회귀 테스트. 네트워크·시크릿·node_modules 불필요.
# 검증 대상은 "실패했을 때의 행동"이다 — 지금 이 경로를 쓰는 것은 deploy-nas 다.
# 배포가 실패했는데 알림이 안 오면 NAS 에 무엇이 올라갔는지 모르는 채로 지나간다.
on:
  push:
    paths:
      - 'alert-failure.js'
      - 'test/**'
      - '.github/workflows/alert-ci.yml'
      - '.github/workflows/alert-failure.yml'
  pull_request:
    paths:
      - 'alert-failure.js'
      - 'test/**'
      - '.github/workflows/alert-ci.yml'
      - '.github/workflows/alert-failure.yml'
  workflow_dispatch:

concurrency:
  group: alert-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 따옴표를 씌우지 않는다: node --test 의 자체 glob 확장은 Node 22+ 기능이라
      # Node 20 에서는 리터럴 경로로 처리되어 "Could not find" 로 죽는다. 셸이 확장하게 둔다.
      - name: Run alert tests
        run: node --test test/*.test.js
      # 알림 스크립트가 실제로 실행 가능한 상태인지 확인한다 (네트워크 호출 없음).
      - name: Alert dry-run
        run: npm run alert:dry
