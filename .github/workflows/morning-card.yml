name: morning-card

# 매일 무인 발송 (GitHub Actions cron은 UTC 기준)
#   ★ 친구톡은 08:00~20:50 에만 발송 가능 → 08시 이전 금지!
#   08:10 KST = 23:10 UTC (전날)
# ※ GitHub cron은 부하에 따라 수 분 지연될 수 있음(정상). 정확히 정시 보장은 아님.
on:
  schedule:
    - cron: '10 23 * * *'   # 매일 08:10 KST (친구톡 발송 가능시간 08:00~20:50 준수)
  workflow_dispatch:        # 수동 실행(테스트) 버튼

concurrency:
  group: morning-card
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Send morning card (친구톡)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOLAPI_API_KEY: ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_API_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
          SOLAPI_PFID: ${{ secrets.SOLAPI_PFID }}
          ONLY_TO: ${{ secrets.ONLY_TO }}
          FRIENDS_URL: ${{ secrets.FRIENDS_URL }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
          CARD_NAME: ${{ secrets.CARD_NAME }}
          CARD_COMPANY: ${{ secrets.CARD_COMPANY }}
          NAS_BASE_URL: ${{ secrets.NAS_BASE_URL }}
        run: node send-morning-card.js
