# NAS 러너 — linkpilot-platform 의 Actions 를 사무실 NAS 에서 돌리게 깔고 켠다 〈2026-10-21 사장님: 「너가 직접해」〉
#
# 왜 여기(cron · 공개)에서 도는가 — 이 저장소의 러너는 무료이고, 사설망(TS_*)·SSH(NAS_SSH_*) 비밀이 이미 있다(deploy-nas 와 같은 길).
#   platform 의 Actions 분이 바닥나 그쪽에서는 아무것도 못 돌린다. 안내문 원본: platform 가지 claude/nas-runner 의 nas-runner/README.md.
# ★ 이 저장소에 러너를 «붙이지» 않는다 — 여기서는 NAS 에 platform 용 러너를 «깔기»만 한다(README 「안 하는 것」 그대로).
# ★ 두 갈래 — probe(기본 · 아무것도 안 바꾼다 · 예/아니오만 찍는다) · install(NAS_RUNNER_PAT 가 있을 때만).
# ★ 로그·요약에 주소·경로·토큰을 찍지 않는다(공개 저장소 · CLAUDE.md §2). runner.env 는 ssh 의 표준입력으로만 넘기고 권한 600.
# ★ NAS_RUNNER_PAT — fine-grained · linkpilot-platform 하나 · Administration: Read and write · Contents: Read · Variables: Read and write.
#   사람이 GitHub 화면에서 만들어 **이 저장소의 Actions 비밀**에 넣는다. 채팅에 붙여 넣지 않는다.
# 판정: 0 다 됐다 · 1 설치했는데 러너가 안 붙었다 · 2 못 쟀다(사설망·SSH) · 3 NAS 계정이 도커를 못 쓴다 · 4 토큰이 없거나 권한이 모자라다
name: nas-runner

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = 재기만 · install = 깔고 켜기'
        type: choice
        options: [probe, install]
        default: probe

concurrency:
  group: nas-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Only on the default branch
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -u
          if [ -z "${DEFAULT_BRANCH:-}" ] || [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::기본 가지에서만 돈다 — 가지 '$REF_NAME' 에서는 NAS 를 건드리지 않는다"
            echo "  까닭: 이 작업은 운영 NAS 에 컨테이너를 띄운다. 검토 안 된 가지의 스크립트로 그 일을 하지 않는다."
            echo "  아티팩트: 없음 — 아무것도 안 했다."
            exit 2
          fi

      - name: Do we have the keys
        id: keys
        env:
          OAUTH_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          OAUTH_SEC: ${{ secrets.TS_OAUTH_SECRET }}
          AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
          NAS_KEY: ${{ secrets.NAS_SSH_KEY }}
          PAT: ${{ secrets.NAS_RUNNER_PAT }}
        run: |
          set -u
          MODE=""
          if [ -n "${OAUTH_ID:-}" ] && [ -n "${OAUTH_SEC:-}" ]; then MODE=oauth
          elif [ -n "${AUTHKEY:-}" ]; then MODE=authkey; fi
          if [ -z "$MODE" ] || [ -z "${NAS_HOST:-}" ] || [ -z "${NAS_USER:-}" ] || [ -z "${NAS_KEY:-}" ]; then
            echo "::error::사설망(TS_*) 또는 NAS 접속(NAS_SSH_*) 비밀이 없다 — 아무것도 못 쟀다"; exit 2
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          [ -n "${PAT:-}" ] && echo "pat=1" >> "$GITHUB_OUTPUT" || echo "pat=0" >> "$GITHUB_OUTPUT"

      - name: Join the tailnet (OAuth)
        if: steps.keys.outputs.mode == 'oauth'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Join the tailnet (auth key)
        if: steps.keys.outputs.mode == 'authkey'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Set up ssh
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
          NAS_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$NAS_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if ! ssh-keyscan -H "$NAS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::NAS 호스트키를 못 받았다 — 기계가 지금 안 붙는다(전원·Tailscale). NAS 는 아무것도 안 건드렸다"; exit 2
          fi
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_deploy "$NAS_USER@$NAS_HOST" 'echo ok' >/dev/null || {
            echo "::error::NAS 에 ssh 로 못 붙었다 — NAS 는 아무것도 안 건드렸다"; exit 2; }

      # ★ 재기만 한다. 경로·주소는 안 찍고 «예/아니오»와 수만 찍는다.
      - name: Probe — can this account run containers
        id: probe
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
        run: |
          set -u
          OUT=$(ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_deploy "$NAS_USER@$NAS_HOST" 'sh -s' <<'EOF'
          PATH="$PATH:/usr/local/bin:/usr/bin:/var/packages/ContainerManager/target/usr/bin:/var/packages/Docker/target/usr/bin"
          yn() { if eval "$1" >/dev/null 2>&1; then echo "$2=yes"; else echo "$2=no"; fi; }
          yn 'command -v docker' docker_bin
          yn 'docker ps' docker_plain
          yn 'sudo -n docker ps' docker_sudo
          yn 'docker compose version || docker-compose version' compose_plain
          yn 'sudo -n docker compose version || sudo -n docker-compose version' compose_sudo
          yn '[ -d /volume1/docker ] && [ -w /volume1/docker ]' docker_share_writable
          yn '[ -f /volume1/docker/github-runner/docker-compose.yml ]' runner_files
          yn '[ -f /volume1/docker/github-runner/runner.env ]' runner_env
          echo "mem_mb=$(awk '/MemTotal/{print int($2/1024)}' /proc/meminfo 2>/dev/null)"
          echo "mem_avail_mb=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo 2>/dev/null)"
          echo "arch=$(uname -m)"
          EOF
          ) || true
          echo "$OUT" | grep -E '^[a-z_]+=[A-Za-z0-9_]*$' | tee -a "$GITHUB_OUTPUT"
          {
            echo "## NAS 러너 — 재기"
            echo '```'; echo "$OUT" | grep -E '^[a-z_]+=[A-Za-z0-9_]*$'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          D=no
          echo "$OUT" | grep -qE '^(docker_plain|docker_sudo)=yes$' && D=yes
          echo "docker_ok=$D" >> "$GITHUB_OUTPUT"
          if [ "$D" != yes ]; then
            echo "::error::판정 3 — 이 NAS 계정은 컨테이너를 못 띄운다(docker 도 sudo docker 도 안 됨). 설치는 사람이 Container Manager 화면에서 한다(README 4번)"
            echo "> 판정 3 — NAS 계정이 도커를 못 쓴다 · 설치는 Container Manager 화면에서" >> "$GITHUB_STEP_SUMMARY"
            exit 3
          fi
          echo "> 도커 쓸 수 있음" >> "$GITHUB_STEP_SUMMARY"

      - name: Token present and strong enough
        if: inputs.mode == 'install'
        id: pat
        env:
          PAT: ${{ secrets.NAS_RUNNER_PAT }}
          HAS: ${{ steps.keys.outputs.pat }}
        run: |
          set -u
          if [ "$HAS" != 1 ]; then
            echo "::error::판정 4 — NAS_RUNNER_PAT 비밀이 없다. 이 저장소 [Settings] → [Secrets and variables] → [Actions] 에 넣는다"
            echo "> 판정 4 — 토큰 없음" >> "$GITHUB_STEP_SUMMARY"; exit 4
          fi
          api() { curl -s -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer $PAT" -H 'Accept: application/vnd.github+json' "$@"; }
          C=$(api -X POST https://api.github.com/repos/findKTH0415/linkpilot-platform/actions/runners/registration-token)
          F=$(api 'https://api.github.com/repos/findKTH0415/linkpilot-platform/contents/nas-runner/README.md?ref=claude/nas-runner')
          V=$(api https://api.github.com/repos/findKTH0415/linkpilot-platform/actions/variables)
          rm -f /tmp/r.json
          echo "등록 토큰 HTTP $C · 파일 읽기 HTTP $F · 변수 읽기 HTTP $V"
          if [ "$C" != 201 ] || [ "$F" != 200 ] || [ "$V" != 200 ]; then
            echo "::error::판정 4 — 토큰 권한이 모자라다(Administration RW · Contents R · Variables RW 가 필요)"
            echo "> 판정 4 — 토큰 권한 부족 (등록 $C · 파일 $F · 변수 $V)" >> "$GITHUB_STEP_SUMMARY"; exit 4
          fi

      - name: Install — files, token file, container
        if: inputs.mode == 'install'
        env:
          PAT: ${{ secrets.NAS_RUNNER_PAT }}
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
          PLAIN: ${{ steps.probe.outputs.docker_plain }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nr
          for f in Dockerfile docker-compose.yml runner.env.example; do
            curl -sf -H "Authorization: Bearer $PAT" -H 'Accept: application/vnd.github.raw' \
              -o "/tmp/nr/$f" "https://api.github.com/repos/findKTH0415/linkpilot-platform/contents/nas-runner/$f?ref=claude/nas-runner"
          done
          grep -q '여기에_토큰' /tmp/nr/runner.env.example || { echo "::error::runner.env.example 모양이 안내문과 다르다 — 바꿔 넣을 자리를 못 찾았다"; exit 1; }
          S="ssh -o BatchMode=yes -o ConnectTimeout=20 -i $HOME/.ssh/id_deploy $NAS_USER@$NAS_HOST"
          $S 'mkdir -p /volume1/docker/github-runner'
          for f in Dockerfile docker-compose.yml runner.env.example; do
            $S "cat > /volume1/docker/github-runner/$f" < "/tmp/nr/$f"
          done
          # 토큰은 표준입력으로만 · 권한 600 · 로그에 안 나온다
          python3 - <<'PY' | $S 'umask 077; cat > /volume1/docker/github-runner/runner.env; chmod 600 /volume1/docker/github-runner/runner.env'
          import os,sys
          sys.stdout.write(open('/tmp/nr/runner.env.example').read().replace('여기에_토큰', os.environ['PAT']))
          PY
          rm -rf /tmp/nr
          SUDO="sudo -n"; [ "$PLAIN" = yes ] && SUDO=""
          $S "PATH=\$PATH:/usr/local/bin:/var/packages/ContainerManager/target/usr/bin:/var/packages/Docker/target/usr/bin; cd /volume1/docker/github-runner && ( $SUDO docker compose up -d --build || $SUDO docker-compose up -d --build )" 2>&1 \
            | grep -vE 'github_pat_|ghp_' | tail -40

      - name: Is the runner online — then turn LP_RUNNER on
        if: inputs.mode == 'install'
        env:
          PAT: ${{ secrets.NAS_RUNNER_PAT }}
        run: |
          set -u
          R=https://api.github.com/repos/findKTH0415/linkpilot-platform/actions
          H=(-H "Authorization: Bearer $PAT" -H 'Accept: application/vnd.github+json')
          ON=""
          for i in $(seq 1 30); do
            ON=$(curl -s "${H[@]}" "$R/runners" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(" ".join(r["name"]+":"+r["status"] for r in d.get("runners",[])))' 2>/dev/null || true)
            echo "$ON" | grep -q 'nas-platform:online' && break
            sleep 20
          done
          echo "러너: ${ON:-없음}"
          if ! echo "$ON" | grep -q 'nas-platform:online'; then
            echo "::error::판정 1 — 컨테이너는 띄웠는데 러너가 10분 안에 안 붙었다. LP_RUNNER 는 안 켰다(켜면 platform 작업이 줄만 선다)"
            echo "> 판정 1 — 러너가 안 붙었다 · LP_RUNNER 는 안 켰다" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          C=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH "${H[@]}" "$R/variables/LP_RUNNER" -d '{"name":"LP_RUNNER","value":"nas"}')
          [ "$C" = 204 ] || C=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${H[@]}" "$R/variables" -d '{"name":"LP_RUNNER","value":"nas"}')
          echo "LP_RUNNER 쓰기 HTTP $C"
          if [ "$C" != 204 ] && [ "$C" != 201 ]; then
            echo "::error::러너는 붙었는데 LP_RUNNER 를 못 켰다(HTTP $C) — platform [Settings] → [Variables] 에서 LP_RUNNER=nas"; exit 4
          fi
          echo "> 판정 0 — 러너 nas-platform 붙음 · LP_RUNNER=nas 켬 (배포 LP_DEPLOY_RUNNER 는 안 켰다 · README 7번)" >> "$GITHUB_STEP_SUMMARY"
