name: deploy-nas

# NAS 배포 — 화면 파일을 Synology 웹 루트로 올린다.
#
# 왜 Actions 인가: NAS 는 Tailscale 사설망에 있어 외부에서 직접 닿지 않고,
# 접속정보는 CLAUDE.md §2 에 따라 코드·로그에 남길 수 없다.
# 러너가 tailnet 에 임시로 붙고, 자격증명은 GitHub Secrets 에만 둔다.
#
# ★ 자동 실행하지 않는다 (workflow_dispatch 전용).
#   운영 중인 화면을 아무도 안 보는 사이에 덮어쓰지 않기 위해서다.
#   충분히 검증된 뒤 push 트리거로 바꾸는 것은 사람이 판단한다.
#
# ★ linkpilot-platform.html 은 배포 목록에 넣지 않는다.
#   실제 앱 본체 파일이고, 이 저장소에는 그 원본이 없다. 덮어쓰면 되돌릴 수 없다.

on:
  workflow_dispatch:
    inputs:
      files:
        description: '올릴 파일 (저장소 기준 경로, 공백 구분)'
        type: string
        required: true
        default: 'im-agent/ui/platform/myinfo.html'
      dest:
        description: 'NAS 대상 디렉터리'
        type: string
        required: true
        default: '/volume1/web'
      dry_run:
        description: '실제로 올리지 않고 무엇이 올라갈지만 확인'
        type: boolean
        default: true

concurrency:
  group: deploy-nas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 배포 대상을 먼저 검증한다. 경로 조작·금지 파일을 여기서 막는다.
      - name: Check files
        env:
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          for f in $FILES; do
            case "$f" in
              /*|*..*) echo "::error::절대경로·상위경로는 허용하지 않는다: $f"; exit 1 ;;
            esac
            if [ "$(basename "$f")" = "linkpilot-platform.html" ]; then
              echo "::error::linkpilot-platform.html 은 앱 본체 파일이라 이 워크플로로 덮어쓸 수 없다"
              exit 1
            fi
            [ -f "$f" ] || { echo "::error::파일 없음: $f"; exit 1; }
            echo "올릴 파일: $f  ($(wc -c < "$f") bytes)"
          done

      # ★★ **둘 중 아무거나 있으면 붙는다** 〈2026-08-21 · 실제로 막혀서 고침〉.
      #   콘솔이 새로 바뀌면서 `Settings › Keys` 에는 **auth key 밖에 없는** 경우가
      #   있다(OAuth client 는 다른 자리로 옮겨졌거나 요금제에 따라 안 보인다).
      #   그때 「OAuth 만 받는다」로 두면 **만들 수 있는 열쇠가 있는데도 못 쓴다.**
      #
      #   ★ 어느 쪽이 나은가: OAuth 는 **만료가 없다.** auth key 는 최대 90일이라
      #     때가 되면 다시 만들어야 한다. 그래서 OAuth 를 **먼저** 본다.
      #   ★ auth key 를 쓸 때는 만들 때 **Ephemeral · Reusable · Tag(tag:ci)** 를
      #     켠다. 하나라도 빠지면 붙어도 권한이 없거나 기기 목록이 지저분해진다.
      # ★ **`if:` 에서 secrets 를 보지 않는다.** GitHub 이 그 자리에서 secrets 를
      #   읽게 해 주는지 확실치 않고, 안 되면 **조용히 빈 값으로 평가되어**
      #   두 단계가 다 건너뛰어진다 — 그러면 「붙지도 않고 오류도 없는」 판이 된다.
      #   그래서 여기서 **한 번 판정해 출력으로 넘긴다.**
      - name: Check tailnet credentials
        id: ts
        if: ${{ !inputs.dry_run }}
        env:
          OAUTH_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euo pipefail
          # ★ 없는 것을 「있다」로 넘기지 않는다. 무엇을 넣어야 하는지 이름으로 말한다
          if [ -n "${OAUTH_ID:-}" ]; then
            echo "mode=oauth" >> "$GITHUB_OUTPUT"
            echo "OAuth 클라이언트로 붙는다 (만료 없음)"
          elif [ -n "${AUTHKEY:-}" ]; then
            echo "mode=authkey" >> "$GITHUB_OUTPUT"
            echo "auth key 로 붙는다 — **만료가 있다.** 때가 되면 다시 만든다"
          else
            echo "::error::tailnet 열쇠가 없다 — TS_OAUTH_CLIENT_ID + TS_OAUTH_SECRET 이나 TS_AUTHKEY 중 하나를 Secrets 에 넣는다"
            exit 1
          fi

      - name: Connect to tailnet (OAuth)
        if: ${{ steps.ts.outputs.mode == 'oauth' }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # ★ auth key 에는 `tags` 를 주지 않는다 — 태그는 **열쇠를 만들 때** 정해지고,
      #   여기서 또 주면 「이미 태그가 있다」로 거부된다
      - name: Connect to tailnet (auth key)
        if: ${{ steps.ts.outputs.mode == 'authkey' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # ★★ **붙었는지 재 본다.** 위 두 단계가 다 건너뛰어져도 워크플로는
      #   초록으로 계속 간다 — 그러면 다음 단계에서 「연결 안 됨」이 아니라
      #   엉뚱한 오류로 죽는다. 여기서 먼저 잡는다
      - name: Verify tailnet
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          tailscale status --json >/dev/null 2>&1 \
            || { echo "::error::tailnet 에 안 붙었다 — 위 단계가 건너뛰어졌는지 본다"; exit 1; }
          echo "tailnet 연결 확인"

      - name: Upload
        if: ${{ !inputs.dry_run }}
        env:
          FILES: ${{ inputs.files }}
          DEST: ${{ inputs.dest }}
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
          NAS_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          set -euo pipefail
          for v in NAS_HOST NAS_USER NAS_KEY; do
            [ -n "${!v}" ] || { echo "::error::Secret 미설정: $v"; exit 1; }
          done

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$NAS_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 호스트키를 미리 받아둔다. StrictHostKeyChecking 을 끄지 않는다
          ssh-keyscan -H "$NAS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # 기존 파일은 날짜를 붙여 백업한 뒤 덮는다 (되돌릴 수 있게)
          STAMP=$(TZ=Asia/Seoul date +%Y%m%d-%H%M)
          for f in $FILES; do
            BASE=$(basename "$f")
            ssh -i ~/.ssh/id_deploy "$NAS_USER@$NAS_HOST" \
              "test -f '$DEST/$BASE' && cp '$DEST/$BASE' '$DEST/$BASE.$STAMP.bak' || true"
            scp -i ~/.ssh/id_deploy "$f" "$NAS_USER@$NAS_HOST:$DEST/$BASE"
            echo "배포 완료: $BASE → $DEST/$BASE (백업: $BASE.$STAMP.bak)"
          done

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::DRY RUN — 실제로 올리지 않았다. 파일 검증만 수행했다."
          echo "실제 배포하려면 dry_run 을 끄고 다시 실행한다."

  # 배포가 실패하면 알린다 (CLAUDE.md §2 — 조용히 죽지 않는다)
  alert:
    needs: deploy
    if: failure()
    uses: ./.github/workflows/alert-failure.yml
    permissions:
      issues: write
      contents: read
    secrets: inherit
    with:
      workflow: deploy-nas
