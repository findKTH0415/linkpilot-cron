name: deploy-nas

# NAS 배포 — 화면 파일을 Synology 웹 루트로 올린다.
#
# 왜 Actions 인가: NAS 는 Tailscale 사설망에 있어 외부에서 직접 닿지 않고,
# 접속정보는 CLAUDE.md §2 에 따라 코드·로그에 남길 수 없다.
# 러너가 tailnet 에 임시로 붙고, 자격증명은 GitHub Secrets 에만 둔다.
#
# ★ 자동 실행하지 않는다 (workflow_dispatch 전용).
#   운영 중인 화면을 아무도 안 보는 사이에 덮어쓰지 않기 위해서다.
#   충분히 검증된 뒤 push 트리거로 바꾸는 것은 사람이 판단한다.
#
# ★ linkpilot-platform.html 은 배포 목록에 넣지 않는다.
#   실제 앱 본체 파일이고, 이 저장소에는 그 원본이 없다. 덮어쓰면 되돌릴 수 없다.

on:
  workflow_dispatch:
    inputs:
      files:
        description: '올릴 파일 (저장소 기준 경로, 공백 구분)'
        type: string
        required: true
        # ★★ **여기 적힌 파일은 실제로 있어야 한다** 〈2026-08-21〉. 앞 판은
        #   `myinfo.html` 이었는데 그런 파일이 저장소에 없었다 — 이름을 바꾼 뒤
        #   여기만 따라오지 않은 것이다. 그래서 **아무것도 안 고치고 그냥 띄우면**
        #   `Check files` 에서 죽었다. 기본값은 「아무 값이나」가 아니라
        #   **손대지 않고 눌러도 도는 값**이어야 한다.
        #   `embed-default.test.js` 가 이 값이 실재하는지 지킨다.
        # ★★ **한 파일만 올리면 안 된다** 〈2026-08-22 · 실제로 당했다〉.
        #   앞 기본값은 `report-flow.html` 하나였다. 그래서 손대지 않고 누르면
        #   **그 파일만 새것이 되고 옆의 15개는 옛것**으로 남았다.
        #   화면은 서로를 부른다(`report-flow.html` 만 해도 코어 7개 + tokens.css).
        #   짝이 안 맞으면 **빈 화면**이 뜨고 오류는 안 난다 — 실제로 「새 보고서
        #   생성」이 통째로 비어서 나왔다.
        #   ★ 목록을 손으로 적지 않는다. `build-embed.js` 의 `required()` 가
        #     단일 출처이고, `workflow-default.test.js` 가 둘이 같은지 지킨다.
        default: 'im-agent/ui/platform/catalog.js im-agent/ui/platform/embed-bridge.js im-agent/ui/platform/fields-core.js im-agent/ui/platform/fields.html im-agent/ui/platform/files.html im-agent/ui/platform/flow-core.js im-agent/ui/platform/gate-core.js im-agent/ui/platform/inapp.js im-agent/ui/platform/intake.html im-agent/ui/platform/live-core.js im-agent/ui/platform/outputs.html im-agent/ui/platform/report-flow.html im-agent/ui/platform/reports.html im-agent/ui/platform/tokens.css im-agent/ui/platform/upload-core.js im-agent/ui/platform/versions-core.js'
      dest:
        # ★★ **화면 사본은 `im-flow` 로 간다** 〈2026-08-21 · 실제로 헛돌았다〉.
        #   기본값이 웹 루트(`/volume1/web`)여서 화면을 여섯 번 올렸는데
        #   **앱에는 하나도 반영되지 않았다.** 앱이 읽는 자리가 아니었기 때문이다.
        #
        #   ★ 이 종류가 가장 비싸다: 배포는 **초록**이고, 지문도 **맞고**,
        #     파일도 **거기 있었다.** 틀린 것은 「어디에」 하나뿐인데 그 하나는
        #     어느 화면에도 안 나온다. 사용자는 「반영이 안 된다」만 말할 수 있고,
        #     나는 「올렸다」만 말할 수 있다 — 둘 다 맞는 말이라 겉돈다.
        #
        #   웹 루트에 올릴 일이 생기면 그때 손으로 바꾼다. **기본은 도는 값이다.**
        description: 'NAS 대상 디렉터리 (화면 사본은 im-flow)'
        type: string
        required: true
        default: '/volume1/web/im-flow'
      dry_run:
        description: '올리지 않는다 — Secret 이 들어왔는지만 잰다 (NAS 에 손대지 않음)'
        type: boolean
        default: true
      # ★★ 〈2026-08-21 추가〉 앞 판은 「재기」와 「올리기」 둘뿐이었다. 그래서
      #   **열쇠가 통하는지 확인하는 첫 방법이 곧 운영 화면을 덮는 것**이었다 —
      #   dry run 에서 고친 것과 똑같은 잘못이 한 단 아래에 또 있었다.
      #   이 판은 tailnet 에 붙고 ssh 로 `echo ok` 까지만 한다. **읽기만 한다.**
      #   넷(TS_AUTHKEY · HOST · USER · KEY)이 전부 맞아야 통과하므로,
      #   여기가 초록이면 실제 배포도 된다.
      probe:
        description: '닿는지만 확인한다 — tailnet + ssh 까지 가고 올리지는 않는다 (dry_run 을 꺼야 뜻이 있다)'
        type: boolean
        default: false

concurrency:
  group: deploy-nas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ★★ **dry run 에서도 이 단계는 돈다** 〈2026-08-21〉. 앞 판은 여기에
      #   `if: !inputs.dry_run` 이 붙어 있어서, **안전한 판으로는 열쇠가
      #   들어왔는지 알 방법이 없었다.** 그래서 「확인하려면 실제로 올려
      #   보는 수밖에 없다」가 되었다 — 확인하려고 운영 화면을 덮는 것은
      #   순서가 거꾸로다. 이제 dry run 은 **어느 Secret 이 있고 없는지 이름으로**
      #   알려 준다 — NAS 를 건드리지 않고.
      #   ★ 값은 절대 찍지 않는다. **있다/없다만** 말한다 (CLAUDE.md §2).
      - name: Check secrets
        id: ts
        env:
          DRY: ${{ inputs.dry_run }}
          OAUTH_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          OAUTH_SEC: ${{ secrets.TS_OAUTH_SECRET }}
          AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
          NAS_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          set -uo pipefail
          MISSING=""
          say() {
            if [ -n "${!1:-}" ]; then
              echo "  있음 — $2"
            else
              echo "  없음 — $2"
              MISSING="$MISSING $2"
            fi
          }
          echo "── tailnet 열쇠 (둘 중 한 길만 있으면 된다) ──"
          say OAUTH_ID  TS_OAUTH_CLIENT_ID
          say OAUTH_SEC TS_OAUTH_SECRET
          say AUTHKEY   TS_AUTHKEY
          echo "── NAS 접속 (셋 다 있어야 한다) ──"
          say NAS_HOST  NAS_SSH_HOST
          say NAS_USER  NAS_SSH_USER
          say NAS_KEY   NAS_SSH_KEY

          # ★ OAuth 는 **둘 다** 있어야 한다. ID 만 보고 고르면 붙는 단계까지
          #   가서야 죽고, 그 오류는 「열쇠가 틀렸다」와 구분되지 않는다
          MODE=""
          if [ -n "${OAUTH_ID:-}" ] && [ -n "${OAUTH_SEC:-}" ]; then
            MODE=oauth
          elif [ -n "${AUTHKEY:-}" ]; then
            MODE=authkey
          elif [ -n "${OAUTH_ID:-}" ] || [ -n "${OAUTH_SEC:-}" ]; then
            echo "::warning::OAuth 는 TS_OAUTH_CLIENT_ID 와 TS_OAUTH_SECRET 이 **둘 다** 있어야 한다 — 한쪽만 있다"
          fi

          NAS_OK=1
          for v in NAS_HOST NAS_USER NAS_KEY; do
            [ -n "${!v:-}" ] || NAS_OK=0
          done

          if [ "${DRY:-}" = "true" ]; then
            # ★ dry run 에서는 **판정만 하고 mode 를 넘기지 않는다.**
            #   넘기면 아래 접속 단계가 실제로 돌아 「올리지 않는다」가 깨진다
            if [ -n "$MODE" ] && [ "$NAS_OK" = "1" ]; then
              echo "::notice::여섯 자리가 다 찼다 — dry_run 을 끄면 실제로 배포된다"
            else
              echo "::warning::아직 못 넣은 Secret:${MISSING:- 없음} — 넣기 전에는 실제 배포가 여기서 멈춘다"
            fi
            exit 0
          fi

          if [ -z "$MODE" ]; then
            echo "::error::tailnet 열쇠가 없다 — TS_OAUTH_CLIENT_ID + TS_OAUTH_SECRET 이나 TS_AUTHKEY 중 하나를 Secrets 에 넣는다"
            exit 1
          fi
          # ★ NAS 자격증명이 없으면 **tailnet 에 붙기 전에** 멈춘다.
          #   붙고 나서 죽으면 원인이 둘로 보인다
          if [ "$NAS_OK" != "1" ]; then
            echo "::error::NAS 접속 Secret 이 없다 — NAS_SSH_HOST · NAS_SSH_USER · NAS_SSH_KEY 를 넣는다"
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = oauth ]; then
            echo "OAuth 클라이언트로 붙는다 (만료 없음)"
          else
            echo "auth key 로 붙는다 — **만료가 있다.** 때가 되면 다시 만든다"
          fi

      # 배포 대상을 먼저 검증한다. 경로 조작·금지 파일을 여기서 막는다.
      - name: Check files
        env:
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          for f in $FILES; do
            case "$f" in
              /*|*..*) echo "::error::절대경로·상위경로는 허용하지 않는다: $f"; exit 1 ;;
            esac
            if [ "$(basename "$f")" = "linkpilot-platform.html" ]; then
              echo "::error::linkpilot-platform.html 은 앱 본체 파일이라 이 워크플로로 덮어쓸 수 없다"
              exit 1
            fi
            [ -f "$f" ] || { echo "::error::파일 없음: $f"; exit 1; }
            echo "올릴 파일: $f  ($(wc -c < "$f") bytes)"
          done

      # ★★ **둘 중 아무거나 있으면 붙는다** 〈2026-08-21 · 실제로 막혀서 고침〉.
      #   콘솔이 새로 바뀌면서 `Settings › Keys` 에는 **auth key 밖에 없는** 경우가
      #   있다(OAuth client 는 다른 자리로 옮겨졌거나 요금제에 따라 안 보인다).
      #   그때 「OAuth 만 받는다」로 두면 **만들 수 있는 열쇠가 있는데도 못 쓴다.**
      #
      #   ★ 어느 쪽이 나은가: OAuth 는 **만료가 없다.** auth key 는 최대 90일이라
      #     때가 되면 다시 만들어야 한다. 그래서 OAuth 를 **먼저** 본다.
      #   ★ auth key 를 쓸 때는 만들 때 **Ephemeral · Reusable · Tag(tag:ci)** 를
      #     켠다. 하나라도 빠지면 붙어도 권한이 없거나 기기 목록이 지저분해진다.
      # ★ **`if:` 에서 secrets 를 보지 않는다.** GitHub 이 그 자리에서 secrets 를
      #   읽게 해 주는지 확실치 않고, 안 되면 **조용히 빈 값으로 평가되어**
      #   두 단계가 다 건너뛰어진다 — 그러면 「붙지도 않고 오류도 없는」 판이 된다.
      #   그래서 여기서 **한 번 판정해 출력으로 넘긴다.**
      - name: Connect to tailnet (OAuth)
        if: ${{ steps.ts.outputs.mode == 'oauth' }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # ★ auth key 에는 `tags` 를 주지 않는다 — 태그는 **열쇠를 만들 때** 정해지고,
      #   여기서 또 주면 「이미 태그가 있다」로 거부된다
      - name: Connect to tailnet (auth key)
        if: ${{ steps.ts.outputs.mode == 'authkey' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # ★★ **붙었는지 재 본다.** 위 두 단계가 다 건너뛰어져도 워크플로는
      #   초록으로 계속 간다 — 그러면 다음 단계에서 「연결 안 됨」이 아니라
      #   엉뚱한 오류로 죽는다. 여기서 먼저 잡는다
      - name: Verify tailnet
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          tailscale status --json >/dev/null 2>&1 \
            || { echo "::error::tailnet 에 안 붙었다 — 위 단계가 건너뛰어졌는지 본다"; exit 1; }
          echo "tailnet 연결 확인"

      # ★ ssh 준비와 **닿는지 확인**은 올리든 안 올리든 똑같이 한다.
      #   여기서 `echo ok` 까지 해 두면 실패했을 때 원인이 하나로 좁혀진다 —
      #   「붙었는데 못 올렸다」와 「애초에 못 붙었다」가 섞이지 않는다.
      - name: Set up ssh
        if: ${{ !inputs.dry_run }}
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
          NAS_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$NAS_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 호스트키를 미리 받아둔다. StrictHostKeyChecking 을 끄지 않는다
          ssh-keyscan -H "$NAS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # ★ 읽기만 하는 확인. 여기서 죽으면 **아무것도 안 건드린 상태**다
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_deploy \
            "$NAS_USER@$NAS_HOST" 'echo ok' >/dev/null || {
            echo "::error::NAS 에 ssh 로 못 붙었다 — NAS_SSH_HOST 가 tailnet 주소인지(사무실 안 주소·DDNS 는 안 된다), 공개키가 NAS 에 들어갔는지, ~/.ssh 권한이 700/600 인지 본다"
            exit 1
          }
          echo "NAS ssh 연결 확인"

      # ★★ **목적지를 올리기 전에 본다** 〈2026-08-21 · 실제로 여기서 죽었다〉.
      #   앞 판은 곧장 scp 를 했고 이렇게 죽었다:
      #
      #     scp: dest open "/volume1/web/report-flow.html": No such file or directory
      #
      #   **연결도 열쇠도 다 맞는데 「어디에 놓을지」가 틀린 것**인데, 오류가
      #   scp 안에서 나와 그 둘이 섞여 보인다. 그리고 파일이 여럿이면 **앞의 몇
      #   개만 올라간 반쯤 된 상태**로 멈춘다 — 그 상태가 제일 나쁘다.
      #   여기서 먼저 재고, 안 되면 **무엇을 봐야 하는지 말하고** 멈춘다.
      - name: Check destination
        if: ${{ !inputs.dry_run }}
        env:
          DEST: ${{ inputs.dest }}
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
        run: |
          set -uo pipefail
          OUT=$(ssh -o BatchMode=yes -i ~/.ssh/id_deploy "$NAS_USER@$NAS_HOST" \
            "test -d '$DEST' && { test -w '$DEST' && echo OK || echo NOWRITE; } || echo NODIR" 2>&1)
          case "$OUT" in
            *OK*)
              echo "목적지 확인: 있고 쓸 수 있다" ;;
            *NOWRITE*)
              echo "::error::목적지는 있는데 **쓸 수가 없다** — 그 계정에 쓰기 권한이 없다. DSM 제어판 › 공유 폴더 › 권한 에서 확인한다"
              exit 1 ;;
            *NODIR*)
              echo "::error::목적지 폴더가 없다(또는 그 계정에서 안 보인다). 실제 경로를 확인한다 — ssh 로 붙어 ls /volume1 을 쳐 보면 무엇이 있는지 나온다 (별표를 쓰면 내 컴퓨터가 먼저 풀어 보려다 거부한다)"
              exit 1 ;;
            *)
              echo "::error::목적지를 확인하지 못했다: $OUT"
              exit 1 ;;
          esac

      # ★★ **올린 것이 「어떻게 서빙되는지」까지 잰다** 〈2026-08-21〉.
      #   파일이 제자리에 있는 것과, 받는 쪽이 그것을 **어떤 모습으로** 받는지는
      #   다른 이야기다. 특히 압축은 **켜져 있는지 밖에서는 보이지 않는데**
      #   체감 속도를 세 배로 가른다 (122KB → 약 35KB).
      #
      #   ★ 사람에게 「터미널에서 curl 해 보세요」라고 시키지 않는다. 러너는
      #     이미 tailnet 안에 있다 — **잴 수 있는 쪽이 잰다.**
      #   ★ 읽기만 한다. 헤더만 받고(-I) 아무것도 바꾸지 않는다.
      #   ★ 포트를 모른다. 흔한 것부터 차례로 두드리고, **어디서 답이 왔는지**를
      #     함께 적는다 — 「안 된다」만 남기면 다음 사람이 또 처음부터 찾는다.
      - name: Check serving
        if: ${{ !inputs.dry_run && inputs.probe }}
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          DEST: ${{ inputs.dest }}
        run: |
          # ★★ **`set +e` 를 반드시 켠다** 〈2026-08-21 · 여기서 한 번 죽었다〉.
          #   GitHub 의 기본 셸은 `bash -e {0}` 다 — 즉 **`-e` 가 이미 켜진 채로**
          #   들어온다. `set -uo pipefail` 은 그것을 끄지 않는다(끄려면 `+e`).
          #   그래서 **`grep` 이 못 찾은 순간 단계가 통째로 죽었다.**
          #   ★ 하필 「못 찾음」이 여기서는 **정상 결과**다 — 압축 헤더가 없다는
          #     뜻이니까. 답을 찾은 그 순간에 죽은 셈이다. 여기서는 오류를 손으로
          #     다루므로 `-e` 를 끈다.
          set -u
          set +e
          # 웹 루트 아래 경로로 바꾼다 (/volume1/web/im-flow → /im-flow)
          WEBPATH=$(printf '%s' "$DEST" | sed 's|^/volume1/web||')
          FILE="${WEBPATH}/files.html"
          echo "재는 대상: ${FILE}"

          FOUND=0
          for PORT in 80 5000 8080 8181; do
            H=$(curl -sS -I -m 8 -H 'Accept-Encoding: gzip' "http://${NAS_HOST}:${PORT}${FILE}" 2>/dev/null)
            [ -z "$H" ] && { echo "  ${PORT} — 응답 없음"; continue; }
            CODE=$(printf '%s' "$H" | head -1 | awk '{print $2}')
            echo "  ${PORT} — HTTP ${CODE}"
            [ "$CODE" = "200" ] || continue
            FOUND=1
            # ★ 없으면 grep 이 1 을 돌려준다 — **없는 것도 답**이므로 그냥 받는다
            ENC=$(printf '%s' "$H" | grep -i '^content-encoding:' | tr -d '\r' | cut -d' ' -f2- || true)
            LEN=$(printf '%s' "$H" | grep -i '^content-length:' | tr -d '\r' | cut -d' ' -f2- || true)
            echo "    Content-Encoding: ${ENC:-(없음)}"
            echo "    Content-Length:   ${LEN:-(없음)}"
            if printf '%s' "$ENC" | grep -qi gzip; then
              echo "::notice::압축 켜져 있다 (${PORT} · gzip · ${LEN:-?} bytes) — 더 할 일 없다"
            else
              echo "::warning::압축이 **꺼져 있다** (${PORT} · ${LEN:-?} bytes 를 그대로 보낸다). DSM 웹 서비스에서 HTTP 압축을 켜면 받는 양이 약 1/3 로 준다"
            fi
            break
          done
          [ "$FOUND" = "1" ] || echo "::warning::어느 포트에서도 200 이 안 왔다 — 이 주소로는 웹으로 안 열리는 것이다. 앱이 실제로 어느 주소에서 화면을 읽는지 확인이 필요하다"

      # ★★★ **내려주는 판이 방금 올린 판인가** 〈2026-08-22 · 세 번 헤맸다〉.
      #
      #   같은 신고가 반복될 때마다 「새로고침해 보십시오」로 넘겼는데, 그건
      #   **재지 않고 말한 것**이다. 실제로는 세 가지가 다 가능했다:
      #     ① 안 올라갔다  ② 올라갔는데 캐시가 옛것을 준다  ③ 코드가 틀렸다
      #   셋은 화면에서 **똑같이 보인다.** 그래서 러너가 직접 받아 본다.
      #
      #   ★ **읽기만 한다.** curl 로 받아서 표식을 찾고 캐시 머리말을 적는다.
      #   ★ 표식은 손으로 적지 않는다 — 저장소 파일에서 뽑아 **같은 글자**를 찾는다.
      #     손으로 적으면 다음에 이름이 바뀐 날 검사만 옛말을 한다.
      - name: Check served build
        if: ${{ !inputs.dry_run && inputs.probe }}
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
          DEST: ${{ inputs.dest }}
        run: |
          set -u
          set +e
          WEBPATH=$(printf '%s' "$DEST" | sed 's|^/volume1/web||')

          # ★★★ **표식이 아니라 지문을 댄다** 〈2026-08-22 · 표식으로는 못 갈랐다〉.
          #   앞 판은 「이 글자가 있나」만 봤다. 그러면 「새 판이다」라고 말해 놓고
          #   실제로는 **두 판 전** 파일일 수 있다 — 그 글자가 두 판 전에도 있었으면
          #   그렇다. 실제로 그렇게 속았다.
          #
          # ★★ 그리고 **세 자리를 각각 잰다.** 셋이 다르면 원인이 다르다:
          #     저장소 ≠ 디스크  → 올리기가 실제로 안 됐다
          #     디스크 ≠ HTTP    → 웹서버·앞단이 옛것을 내려준다 (캐시)
          #     셋이 같다        → 브라우저가 들고 있는 것이다
          #   이 셋은 화면에서 **똑같이 보인다.** 갈라 주는 것이 이 단계의 일이다.
          for NAME in embed-bridge.js files.html report-flow.html; do
            LOCAL=$(sha256sum "im-agent/ui/platform/$NAME" 2>/dev/null | cut -c1-12)
            DISK=$(ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_deploy \
              "$NAS_USER@$NAS_HOST" "sha256sum '$DEST/$NAME' 2>/dev/null | cut -c1-12" 2>/dev/null | tr -d '\r')
            HTTPH=""
            SERVED=""
            for PORT in 80 5000 8080; do
              B=$(curl -sS -m 20 "http://${NAS_HOST}:${PORT}${WEBPATH}/${NAME}" 2>/dev/null)
              [ -z "$B" ] && continue
              SERVED=$(printf '%s' "$B" | sha256sum | cut -c1-12)
              HTTPH=$(curl -sS -I -m 10 "http://${NAS_HOST}:${PORT}${WEBPATH}/${NAME}" 2>/dev/null)
              break
            done
            CC=$(printf '%s' "$HTTPH" | grep -i '^cache-control:' | tr -d '\r' | cut -d' ' -f2-)
            LM=$(printf '%s' "$HTTPH" | grep -i '^last-modified:' | tr -d '\r' | cut -d' ' -f2-)

            echo "── ${NAME}"
            echo "   저장소 ${LOCAL:-?} · 디스크 ${DISK:-?} · HTTP ${SERVED:-?}"
            echo "   Cache-Control: ${CC:-(없음)} · Last-Modified: ${LM:-(없음)}"

            if [ -z "$DISK" ]; then
              echo "::warning::${NAME} — NAS 디스크에서 못 읽었다 (경로나 권한을 본다)"
            elif [ "$LOCAL" != "$DISK" ]; then
              echo "::error::${NAME} — **올리기가 실제로 안 됐다.** 저장소와 디스크가 다르다. 초록으로 끝난 배포가 파일을 안 바꾼 것이다"
            elif [ -n "$SERVED" ] && [ "$SERVED" != "$DISK" ]; then
              echo "::error::${NAME} — **디스크는 새것인데 HTTP 가 옛것을 준다.** 웹서버나 앞단이 캐시하고 있다. 브라우저를 아무리 새로고침해도 안 바뀐다"
            elif [ -n "$SERVED" ]; then
              echo "   ✓ 저장소 = 디스크 = HTTP — 남은 것은 브라우저 캐시뿐이다"
            fi
            if [ -z "$CC" ]; then
              echo "::warning::${NAME} 에 Cache-Control 이 없다 — 브라우저가 제 마음대로 오래 들고 있을 수 있다"
            fi
          done

      # ★★ **업로드 본문 한도가 실제로 올라갔는지 잰다** 〈2026-08-22〉.
      #   엔진은 파일 30MB · 한 번에 100MB 를 받도록 되어 있다. 그런데 그
      #   검사에 닿기도 전에 **본문 파서**가 먼저 끊는다 — express 기본값은
      #   100KB 다. 그때 증상은 「전송이 끊겼습니다」나 엉뚱한 401 이라서,
      #   **화면만 봐서는 어디서 끊겼는지 알 수 없다.**
      #
      #   ★ 사람에게 「ssh 로 붙어 grep 해 보세요」라고 시키지 않는다. 러너는
      #     이미 tailnet 안에 있다 — **잴 수 있는 쪽이 잰다** (Check serving 과 같다).
      #   ★ **읽기만 한다.** grep 만 돌리고 아무것도 바꾸지 않는다.
      #   ★ 파일을 못 찾는 것도 **답**이다. 「엔진 루트가 다른 곳이다」를 뜻하므로
      #     조용히 넘기지 않고 무엇을 봐야 하는지 적는다.
      - name: Check upload body limit
        if: ${{ !inputs.dry_run && inputs.probe }}
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
        run: |
          # Check serving 과 같은 이유로 -e 를 끈다 — 「못 찾음」이 정상 결과다
          set -u
          set +e
          # ★★ 문서가 적어 둔 자리(`/volume1/docker/linkpilot`)에 **없었다**
          #   〈2026-08-22 실측〉. 그래서 「없다」로 끝내지 않고 **찾는다** —
          #   「엔진 루트가 다른 곳이다」만 남기면 다음 사람이 또 처음부터 찾는다.
          SRV=$(ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_deploy \
            "$NAS_USER@$NAS_HOST" \
            "for p in /volume1/docker/linkpilot /volume1/linkpilot /volume1/web/linkpilot; do
               [ -f \$p/im-engine-server.cjs ] && { echo \$p/im-engine-server.cjs; exit 0; }
             done
             find /volume1 -maxdepth 4 -name 'im-engine-server*.cjs' -not -path '*/node_modules/*' 2>/dev/null | head -1" 2>&1 | tail -1)

          if [ -z "$SRV" ]; then
            echo "엔진 서버 파일을 못 찾았다. /volume1 아래에 무엇이 있는지 적어 둔다:"
            ssh -o BatchMode=yes -i ~/.ssh/id_deploy "$NAS_USER@$NAS_HOST" \
              "ls -1 /volume1 2>/dev/null; echo '--- /volume1/docker'; ls -1 /volume1/docker 2>/dev/null" 2>&1 | sed 's/^/  /'
            echo "::warning::엔진 서버 파일(im-engine-server*.cjs)이 /volume1 아래 4단 안에 없다 — 다른 볼륨이거나, 배포 계정에서 안 보이는 자리다. 위 목록을 보고 실제 경로를 정한다"
            exit 0
          fi

          echo "엔진 서버: $SRV"
          # ★★ **한 줄에 `test -f … && grep … || echo __NOFILE__` 로 묶지 않는다**
          #   〈2026-08-22 · 여기서 한 번 속았다〉. grep 이 **못 찾으면 1** 을
          #   돌려주므로 `||` 가 걸려 「파일이 없다」가 찍힌다. 파일은 멀쩡히
          #   있었는데 「엔진 루트가 다른 곳」이라고 보고했다 — 찾는 곳을
          #   통째로 잘못 잡게 만드는 거짓말이다. 있는지와 무엇이 들었는지는
          #   **따로** 묻는다.
          #
          # ★ express 계열이 안 나올 수 있다. 그때는 직접 모으는 판이므로
          #   `req.on('data')` 쪽을 봐야 한다 — 둘 다 한 번에 긁는다.
          OUT=$(ssh -o BatchMode=yes -i ~/.ssh/id_deploy "$NAS_USER@$NAS_HOST" \
            "grep -nE \"express\\.json|bodyParser|MIN_BODY_BYTES|maxBody|payload|req\\.on\\('data'|Buffer\\.concat|content-length|1024 ?\\* ?1024|limit\" '$SRV' | head -40" 2>&1)
          [ -z "$OUT" ] && OUT="(일치하는 줄 없음)"

          echo "본문 파서 자리:"
          printf '%s\n' "$OUT"

          if printf '%s' "$OUT" | grep -q 'MIN_BODY_BYTES'; then
            echo "::notice::본문 한도가 엔진 값(MIN_BODY_BYTES · 약 141MB)으로 잡혀 있다 — 큰 파일 업로드가 열려 있다"
          elif printf '%s' "$OUT" | grep -qE 'express\.json|bodyParser'; then
            echo "::warning::본문 파서는 있는데 **한도가 엔진 값이 아니다.** 위 줄의 limit 을 본다 — 없으면 기본 100KB 라 8MB 도 못 올린다 (deploy/앱-업로드-한도.md)"
          elif printf '%s' "$OUT" | grep -qE "req\\.on\\('data'|Buffer\\.concat"; then
            echo "::warning::express 를 안 쓰고 **직접 모으는 판**이다. 위 줄의 길이 검사를 본다 — 검사가 아예 없으면 큰 본문에서 메모리로 터진다 (deploy/앱-업로드-한도.md ①-(나))"
          else
            echo "::warning::본문을 어디서 받는지 못 찾았다 — 라우터를 다른 파일에서 붙이는 판일 수 있다. 위 목록과 함께 그 파일을 찾는다"
          fi

      # ★★ **어디서 끊기는지 크기를 키워 가며 잰다** 〈2026-08-22〉.
      #   앞 단계는 **파일에 적힌 한도**를 읽었다 (64MB). 그런데 사용자는
      #   **8.7MB 에서** 멈췄다 — 파일이 말하는 것과 실제로 지나가는 것이
      #   다르다는 뜻이다. 앞단(리버스 프록시·Funnel)이 더 낮게 잡고 있을 수 있다.
      #
      #   ★ **아무것도 바꾸지 않는다.** 없는 프로젝트(LP-NOPE-0000-000)로 보낸다 —
      #     문지기와 존재 검사에서 되돌아오므로 저장도 삭제도 일어나지 않는다.
      #   ★ 재는 것은 **본문이 끝까지 갔는가** 하나다. 401·404 여도 **응답이
      #     왔다는 것**이 곧 본문이 통과했다는 뜻이다. 끊기면 응답이 아예 없다.
      #   ★ 8181(엔진 직행)과 80(앞단 경유)을 **둘 다** 잰다. 둘이 갈리면
      #     범인이 앞단이라는 것이 그 자리에서 드러난다.
      - name: Probe body size ceiling
        if: ${{ !inputs.dry_run && inputs.probe }}
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
        run: |
          set -u
          set +e
          PATHS="/api/linkpilot/projects/LP-NOPE-0000-000/oneshot /projects/LP-NOPE-0000-000/oneshot"

          for PORT in 8181 80; do
            echo "── 포트 ${PORT} ──"
            HIT=""
            for P in $PATHS; do
              C=$(curl -sS -o /dev/null -w '%{http_code}' -m 15 -X POST \
                -H 'content-type: application/json' -d '{"files":[]}' \
                "http://${NAS_HOST}:${PORT}${P}" 2>/dev/null)
              echo "  ${P} → HTTP ${C:-(응답 없음)}"
              [ -n "$C" ] && [ "$C" != "000" ] && [ "$C" != "404" ] && { HIT="$P"; break; }
              [ -n "$C" ] && [ "$C" != "000" ] && [ -z "$HIT" ] && HIT="$P"
            done
            [ -z "$HIT" ] && { echo "  이 포트로는 API 가 안 열린다 — 크기 재기 건너뛴다"; continue; }

            for MB in 1 8 24 48 64; do
              BODY=/tmp/body_${MB}.json
              # {"files":[{"name":"probe","contentBase64":"AAAA…"}]} — 딱 MB 만큼
              { printf '{"files":[{"name":"probe","contentBase64":"'
                head -c $((MB * 1024 * 1024)) /dev/zero | tr '\0' 'A'
                printf '"}]}'; } > "$BODY"
              C=$(curl -sS -o /dev/null -w '%{http_code}' -m 60 -X POST \
                -H 'content-type: application/json' --data-binary "@$BODY" \
                "http://${NAS_HOST}:${PORT}${HIT}" 2>/dev/null)
              rm -f "$BODY"
              if [ -z "$C" ] || [ "$C" = "000" ]; then
                echo "::warning::포트 ${PORT} — ${MB}MB 에서 **응답이 끊겼다.** 여기가 한도다"
                break
              fi
              echo "  ${MB}MB → HTTP ${C} (본문은 끝까지 갔다)"
            done
          done

      - name: Probe summary
        if: ${{ !inputs.dry_run && inputs.probe }}
        run: |
          echo "::notice::닿는 것까지 확인했다 — **올리지 않았다.** 넷이 다 맞다는 뜻이다. 실제로 올리려면 probe 를 끄고 다시 실행한다."

      - name: Upload
        if: ${{ !inputs.dry_run && !inputs.probe }}
        env:
          FILES: ${{ inputs.files }}
          DEST: ${{ inputs.dest }}
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
        run: |
          set -euo pipefail
          # 기존 파일은 날짜를 붙여 백업한 뒤 덮는다 (되돌릴 수 있게)
          STAMP=$(TZ=Asia/Seoul date +%Y%m%d-%H%M)
          for f in $FILES; do
            BASE=$(basename "$f")
            ssh -i ~/.ssh/id_deploy "$NAS_USER@$NAS_HOST" \
              "test -f '$DEST/$BASE' && cp '$DEST/$BASE' '$DEST/$BASE.$STAMP.bak' || true"
            # ★★ **`-O` 를 뺄 수 없다** 〈2026-08-21 · 실제로 여기서 죽었다〉.
            #   OpenSSH 9 부터 scp 는 속으로 **SFTP** 를 쓴다. 그런데 Synology 에는
            #   「SFTP 사용자를 홈 폴더 안에만 가둔다」는 설정이 있어서, 그 상태면
            #   **SFTP 쪽에서는 /volume1/web 이 아예 없는 것처럼 보인다.**
            #
            #     ssh  ... ls -ld /volume1/web  →  drwxrwxrwx+ (보인다)
            #     scp  ...                      →  dest open: No such file or directory
            #
            #   둘 다 참이다 — **보는 창구가 다르다.** 그래서 오류가 「경로가
            #   틀렸다」로 읽히고, 멀쩡한 경로를 몇 번이고 다시 확인하게 된다.
            #   `-O` 는 옛 방식(셸 경유)으로 보낸다 — `ssh` 와 **같은 눈**이 된다.
            #   위 `Check destination` 도 ssh 로 재므로, 이래야 잰 것과 하는 것이 맞다.
            scp -O -i ~/.ssh/id_deploy "$f" "$NAS_USER@$NAS_HOST:$DEST/$BASE"
            echo "배포 완료: $BASE → $DEST/$BASE (백업: $BASE.$STAMP.bak)"
          done

      # ★★ **경고로 낸다. 알림(notice)이 아니다** 〈2026-08-22 · 실제로 당했다〉.
      #   `dry_run` 기본값이 `true` 라, 입력을 안 주고 실행하면 **아무것도 안
      #   올라간다.** 그런데 실행은 **초록**으로 끝난다. 그래서 두 번 연달아
      #   「배포 성공」이라고 보고했는데 NAS 는 세 판 전 화면을 그대로 들고
      #   있었다 — 사용자는 「반영이 안 된다」만 말할 수 있고 나는 「올렸다」만
      #   말할 수 있어 겉돈다 (`dest` 기본값 사고와 같은 종류다).
      #
      #   ★ 초록 옆의 회색 알림은 안 읽힌다. **노란 경고**여야 눈에 걸린다.
      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "::warning::**아무것도 올리지 않았다 (DRY RUN).** NAS 는 그대로다 — 이 실행이 초록이어도 배포된 것이 아니다. 실제로 올리려면 dry_run 을 끄고 다시 실행한다"
          echo "실제 배포하려면 dry_run 을 끄고 다시 실행한다."

  # 배포가 실패하면 알린다 (CLAUDE.md §2 — 조용히 죽지 않는다)
  alert:
    needs: deploy
    if: failure()
    uses: ./.github/workflows/alert-failure.yml
    permissions:
      issues: write
      contents: read
    secrets: inherit
    with:
      workflow: deploy-nas
