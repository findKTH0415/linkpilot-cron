name: deploy-nas

# NAS 배포 — 화면 16개를 `im-flow` 로, 엔진을 `im-agent` 로 올리고,
# **닿았는지 재고 끝난다.** `main` 에 닿으면 자동으로 돈다 (D-88).
#
# ★★★ **쓰기를 되살렸다** 〈2026-08-23 사장님 지시 — 「앞으로는 네가 배포해」〉.
#   전날 D-84 로 지웠던 것을 되돌렸다. **지웠던 이유는 아래에 그대로 남긴다** —
#   되살렸다고 그 이유가 사라지지는 않는다.
#
#   ★ 그래서 **쓰는 이는 여전히 하나여야 한다.** 이제 이 워크플로가 그 하나이고,
#     `deploy/screens.sh`(화면) · `deploy/nas.sh`(엔진)는 **이 길이 못 돌 때의
#     대비**다. 둘을 같은 날 같이 쓰지 않는다 — 그러면 D-84 가 말한 상태로
#     그대로 돌아간다.
#     ★★ 자동으로 돌게 된 뒤로는 **같이 쓸 일이 훨씬 잦아졌다** — 맥에서 손으로
#       올리는 사이에 `main` 푸시가 들어오면 둘이 겹친다. 급하면 워크플로를
#       먼저 보고, 그것이 못 돌 때만 손으로 간다.
#
# 〈아래는 D-84 로 지웠을 때의 기록 — 왜 한때 없앴는지〉
#
# ★★★ ~~쓰기(scp)를 지웠다~~ 〈2026-08-22 사용자 결정 · D-84〉.
#
#   `/volume1/web/im-flow` 에 쓰는 길이 둘이었다 — 본체의 `deploy/nas.sh` 와
#   이 워크플로. **쓰는 이가 둘이면 「올렸는데 다르다」의 원인을 못 가른다:**
#   재는 그 순간에도 다른 길이 덮을 수 있어서, 「다른 이가 덮었다」를 지울
#   방법이 영영 없다. 실제로 그 상태에서 「웹서버 캐시」로 잘못 짚었다 (M-25).
#
#   ★ 남겨 둔 명분은 「사장님 맥이 꺼졌을 때의 대비」였는데, 이 길은 **화면만**
#     올린다. 엔진(`report-api.cjs` 등)은 못 올리므로 판이 어긋난 **반쪽 배포**가
#     된다. 대비로서 값이 낮아 지웠다.
#
#   **배포는 본체 게이트 하나로 간다** — 사장님 맥에서 `deploy/nas.sh`.
#   이 워크플로가 남아서 하는 일은 **닿았는지 재는 것**뿐이다.
#
# 이름을 `deploy-nas` 로 둔 이유: 바꾸면 지금까지의 실행 기록이 끊긴다.
#
# 왜 Actions 인가: NAS 는 Tailscale 사설망에 있어 외부에서 직접 닿지 않고,
# 접속정보는 CLAUDE.md §2 에 따라 코드·로그에 남길 수 없다.
# 러너가 tailnet 에 임시로 붙고, 자격증명은 GitHub Secrets 에만 둔다.
#
# ★★★ **자동으로 돈다** 〈2026-08-23 사장님 지시 · D-88 — 「실시간 자동배포가 되도록」〉.
#
#   앞 판은 `workflow_dispatch` 전용이었다. 이유는 「아무도 안 보는 사이에 운영
#   화면을 덮지 않기 위해」였는데, 실제로 일어난 일은 그 반대였다 —
#   **눌러야 도니까 안 눌렀고, 그 사이 NAS 가 조용히 옛 판으로 남았다.**
#   D-86 이 그 이야기다(화면이 옛것이었던 이유는 캐시도 다른 폴더도 아니라
#   **아직 안 올라간 것**이었다).
#
#   ★ 그래서 **`main` 에 닿는 순간 올린다.** 작업선(`claude/**`)에서는 안 돈다 —
#     PR 이 병합되는 그 순간이 「올려도 되는 순간」이다. 검토를 거치지 않은
#     푸시가 곧바로 운영에 닿는 일은 만들지 않는다.
#   ★ 앞 판이 걱정한 것은 그대로 지킨다: `guard`(교차검증 전체)가 초록이 아니면
#     한 파일도 안 올라간다. **자동이 된 것이지 검사가 빠진 것이 아니다.**
#   ★ 손으로 띄우는 길(`workflow_dispatch`)은 그대로 둔다. 그쪽 기본값은
#     여전히 **dry run** 이다 — 사람이 누를 때는 「재기만」이 안전한 기본이다.
#
# ★★★ **엔진도 함께 올린다** 〈2026-08-23 · D-88〉.
#   앞 판은 화면 열여섯만 올렸다. 엔진(`im-agent/**`)은 **아무도 안 올렸고**,
#   그래서 화면은 새 판인데 서버가 옛 라우팅 표를 들고 있는 상태가 났다
#   (D-87 · `POST /projects` 404). 화면만 자동으로 올리면 그 어긋남을 **더 빨리
#   만들 뿐**이다.
#   ★ 엔진은 잘못되면 **서비스가 멈춘다.** 그래서 `deploy/engine.sh` 가
#     되돌릴 자리를 먼저 만들고, 안 살아나면 **스스로 되돌린다.**
#   ★ 엔진 파일이 안 바뀐 날에는 **재시작하지 않는다** — 화면만 고친 커밋마다
#     엔진을 내렸다 올리면, 그 몇 초에 걸린 보고서 생성이 죽는다.
#
# ★ linkpilot-platform.html 은 배포 목록에 넣지 않는다.
#   실제 앱 본체 파일이고, 이 저장소에는 그 원본이 없다. 덮어쓰면 되돌릴 수 없다.

on:
  # ★★★ **여기가 「실시간」이다.** `main` 에 닿으면 바로 돈다.
  #   ★ `paths` 로 좁힌다 — 문서만 고친 커밋에 NAS 를 건드릴 이유가 없다.
  #     대신 **좁히다가 빠뜨리면 조용히 안 올라가므로**, 올릴 것이 들어 있는
  #     자리는 전부 적는다: 화면·엔진(`im-agent/**`), 올리는 도구(`deploy/**`),
  #     그리고 이 파일 자신.
  push:
    branches: ['main']
    paths:
      - 'im-agent/**'
      - 'deploy/**'
      - '.github/workflows/deploy-nas.yml'
  workflow_dispatch:
    inputs:
      files:
        description: '올릴 파일 (저장소 기준 경로, 공백 구분)'
        type: string
        required: true
        # ★★ **여기 적힌 파일은 실제로 있어야 한다** 〈2026-08-21〉. 앞 판은
        #   `myinfo.html` 이었는데 그런 파일이 저장소에 없었다 — 이름을 바꾼 뒤
        #   여기만 따라오지 않은 것이다. 그래서 **아무것도 안 고치고 그냥 띄우면**
        #   `Check files` 에서 죽었다. 기본값은 「아무 값이나」가 아니라
        #   **손대지 않고 눌러도 도는 값**이어야 한다.
        #   `embed-default.test.js` 가 이 값이 실재하는지 지킨다.
        # ★★ **한 파일만 올리면 안 된다** 〈2026-08-22 · 실제로 당했다〉.
        #   앞 기본값은 `report-flow.html` 하나였다. 그래서 손대지 않고 누르면
        #   **그 파일만 새것이 되고 옆의 15개는 옛것**으로 남았다.
        #   화면은 서로를 부른다(`report-flow.html` 만 해도 코어 7개 + tokens.css).
        #   짝이 안 맞으면 **빈 화면**이 뜨고 오류는 안 난다 — 실제로 「새 보고서
        #   생성」이 통째로 비어서 나왔다.
        #   ★ 목록을 손으로 적지 않는다. `build-embed.js` 의 `required()` 가
        #     단일 출처이고, `workflow-default.test.js` 가 둘이 같은지 지킨다.
        default: 'im-agent/ui/platform/catalog.js im-agent/ui/platform/embed-bridge.js im-agent/ui/platform/fields-core.js im-agent/ui/platform/fields.html im-agent/ui/platform/files.html im-agent/ui/platform/flow-core.js im-agent/ui/platform/gate-core.js im-agent/ui/platform/inapp.js im-agent/ui/platform/intake.html im-agent/ui/platform/live-core.js im-agent/ui/platform/outputs.html im-agent/ui/platform/report-flow.html im-agent/ui/platform/reports.html im-agent/ui/platform/tokens.css im-agent/ui/platform/upload-core.js im-agent/ui/platform/versions-core.js'
      dest:
        # ★★ **화면 사본은 `im-flow` 로 간다** 〈2026-08-21 · 실제로 헛돌았다〉.
        #   기본값이 웹 루트(`/volume1/web`)여서 화면을 여섯 번 올렸는데
        #   **앱에는 하나도 반영되지 않았다.** 앱이 읽는 자리가 아니었기 때문이다.
        #
        #   ★ 이 종류가 가장 비싸다: 배포는 **초록**이고, 지문도 **맞고**,
        #     파일도 **거기 있었다.** 틀린 것은 「어디에」 하나뿐인데 그 하나는
        #     어느 화면에도 안 나온다. 사용자는 「반영이 안 된다」만 말할 수 있고,
        #     나는 「올렸다」만 말할 수 있다 — 둘 다 맞는 말이라 겉돈다.
        #
        #   웹 루트에 올릴 일이 생기면 그때 손으로 바꾼다. **기본은 도는 값이다.**
        description: 'NAS 대상 디렉터리 (화면 사본은 im-flow)'
        type: string
        required: true
        default: '/volume1/web/im-flow'
      dry_run:
        description: '올리지 않는다 — Secret 이 들어왔는지만 잰다 (NAS 에 손대지 않음)'
        type: boolean
        default: true
      engine:
        # ★★ **넷째 손잡이는 「쓸까 말까」가 아니라 「무엇까지」다** 〈2026-08-23 · D-88〉.
        #   앞 판은 입력이 셋이었고, 검사가 「넷째가 생기면 대개 쓸까 말까를 묻는
        #   손잡이다」라며 막고 있었다. **이것은 그 종류가 아니다** — 쓸지 말지는
        #   `dry_run` 하나가 그대로 쥔다.
        #   ★ `auto` 는 **바뀐 것을 보고 정한다**: `im-agent/` 아래에서
        #     `ui/platform/` 밖이 하나라도 바뀌었으면 엔진을 올린다.
        #   ★ 손으로 띄울 때는 「무엇이 바뀌었는지」가 없다. 그때 `auto` 는
        #     **안 올린다** — 사람이 누른 김에 서비스가 재시작되는 일은 없어야 한다.
        description: '엔진(im-agent)도 올릴까 — auto 는 바뀐 것을 보고 정한다'
        type: choice
        options: ['auto', 'yes', 'no']
        default: 'auto'

concurrency:
  group: deploy-nas
  cancel-in-progress: false

jobs:
  # ★★★ **무엇을 어디에 올릴지 한 곳에서 정한다** 〈2026-08-23 · D-88〉.
  #
  #   자동으로 돌게 되면서 문제가 하나 생겼다: `push` 로 들어오면
  #   **`inputs.*` 가 통째로 빈 값**이다. 아래 단계들은 전부 `inputs.files` 를
  #   읽고 있었으므로, 그대로 두면 **빈 목록을 빈 자리에 올리는** 판이 된다 —
  #   그리고 그것은 오류를 안 낸다. 초록으로 끝나고 아무것도 안 바뀐다.
  #
  #   ★ 그래서 **여기서 한 번 정하고 출력으로 넘긴다.** 아래에서 `inputs.` 를
  #     직접 읽는 자리가 남아 있으면 그 자리만 push 에서 빈다.
  #   ★ 목록은 **손으로 적지 않는다.** `build-embed.js` 의 `required()` 가
  #     단일 출처다 — 화면이 하나 늘면 여기도 저절로 는다.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.p.outputs.files }}
      dest: ${{ steps.p.outputs.dest }}
      dry_run: ${{ steps.p.outputs.dry_run }}
      engine: ${{ steps.p.outputs.engine }}
    steps:
      # ★ `fetch-depth: 0` 이 필요하다. 기본은 커밋 하나만 받아 와서
      #   `git diff <이전> <지금>` 이 「그런 커밋 없음」으로 죽는다 — 그러면
      #   엔진을 올릴지 말지를 **못 재고**, 못 잰 채로 넘어가게 된다
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Decide what to deploy
        id: p
        env:
          EV: ${{ github.event_name }}
          IN_FILES: ${{ inputs.files }}
          IN_DEST: ${{ inputs.dest }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_ENGINE: ${{ inputs.engine }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          set +e   # grep 이 「못 찾음」으로 1 을 돌려주는 자리가 있다 (bash -e 를 끈다)

          if [ "$EV" = "workflow_dispatch" ]; then
            FILES="$IN_FILES"; DEST="$IN_DEST"; DRY="$IN_DRY"; WANT="$IN_ENGINE"
            echo "손으로 띄운 판 — 입력을 그대로 쓴다"
          else
            # ★★ 화면 묶음은 `required()` 한 곳에서 나온다 (M-22 — 하나만
            #   올리면 짝이 깨져 **오류 없이 빈 화면**이 뜬다)
            FILES=$(node -e "process.stdout.write(require('./im-agent/ui/platform/build-embed.js').required().map(function(f){return 'im-agent/ui/platform/'+f}).join(' '))")
            DEST='/volume1/web/im-flow'
            DRY=false
            WANT=auto
            echo "자동으로 돈 판 — 화면 묶음을 required() 에서 받았다"
          fi

          if [ -z "$FILES" ]; then
            echo "::error::올릴 목록이 비었다 — 빈 목록으로 올리면 초록인데 아무것도 안 바뀐다"
            exit 1
          fi

          # ── 엔진을 올릴까 ────────────────────────────────────────────────
          case "$WANT" in
            yes) ENG=true;  WHY='손으로 yes 를 골랐다' ;;
            no)  ENG=false; WHY='손으로 no 를 골랐다' ;;
            *)
              if [ "$EV" != "push" ]; then
                ENG=false; WHY='손으로 띄운 판이라 바뀐 것을 알 수 없다 — 화면만 올린다'
              elif [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                # ★ 못 쟀으면 **올린다.** 조용히 건너뛰면 「올렸는데 서버는 옛
                #   판」이 되고, 그 상태는 화면에서 404 로만 보인다 (D-87)
                ENG=true; WHY='앞 커밋을 모른다(첫 푸시) — 못 쟀으므로 올린다'
              else
                CH=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null)
                if [ -z "$CH" ]; then
                  ENG=true; WHY='바뀐 목록을 못 읽었다 — 못 쟀으므로 올린다'
                elif printf '%s\n' "$CH" | grep '^im-agent/' | grep -qv '^im-agent/ui/platform/'; then
                  ENG=true; WHY='화면 폴더 밖의 엔진 파일이 바뀌었다'
                else
                  ENG=false; WHY='바뀐 것이 화면뿐이다 — 엔진을 내렸다 올리지 않는다'
                fi
              fi ;;
          esac

          N=$(printf '%s' "$FILES" | wc -w | tr -d ' ')
          echo "files=$FILES"   >> "$GITHUB_OUTPUT"
          echo "dest=$DEST"     >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY"   >> "$GITHUB_OUTPUT"
          echo "engine=$ENG"    >> "$GITHUB_OUTPUT"
          {
            echo "### 무엇을 올리나"
            echo ""
            echo "- 화면 **${N}개** → \`${DEST}\`"
            echo "- 엔진(im-agent) — **$([ "$ENG" = true ] && echo '올린다' || echo '안 올린다')** · ${WHY}"
            echo "- dry run — \`${DRY}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "화면 ${N}개 → ${DEST} · 엔진 ${ENG} (${WHY}) · dry ${DRY}"

  # ★★★ **교차검증을 통과한 것만 내보낸다** 〈2026-08-23 사장님 지시 · CLAUDE.md §7〉.
  #
  #   지금까지 이것을 **사람이 기억해서** 했다. 그래서 잊었다 — 하루에 두 번,
  #   검사가 빨간 채로 밀었다. 기억에 기대는 규칙은 바쁠 때 가장 먼저 빠진다.
  #
  #   ★ 그래서 **구조가 막는다.** 이 판이 초록이 아니면 `deploy` 는 아예 시작하지
  #     않는다(`needs`). dry run 이어도 돈다 — 「안 올릴 거니까 건너뛰자」가 곧
  #     「빨간 판으로 올리자」로 이어진다.
  #   ★ 이 판이 재는 것은 **배포될 그 커밋**이다. 내 손의 결과가 아니라
  #     러너가 다시 돌린 결과라야 뜻이 있다.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      IM_AGENT_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 한글 글꼴이 없으면 브라우저가 **말없이 다른 글꼴로** 그린다 (D-52)
      - name: Install Korean fonts (D-52)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      # ★ **`npm test` 를 쓴다 — 목록을 여기 옮겨 적지 않는다.** 손으로 적으면
      #   테스트 폴더가 하나 늘어난 날 이 판만 옛 목록을 돈다. 실제로 그럴 뻔했다:
      #   `test/alert.test.js`(실패 알림 경로)가 `im-agent/test/*` 밖에 있다 —
      #   하필 **조용히 죽지 않는지를 재는 검사**가 빠질 자리였다 (§2).
      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee "${RUNNER_TEMP}/tap.txt"

      - name: 실패한 것만 다시 (원인이 로그에 묻히지 않게)
        if: failure()
        run: |
          echo "───────── 실패한 테스트 ─────────"
          grep -n '^not ok' "${RUNNER_TEMP}/tap.txt" || echo "(not ok 줄이 없다 — 테스트 밖에서 죽었다)"

      # ★★ **산출물이 소스와 갈리지 않았는지** 본다. 화면 파일을 고치고 지문을
      #   다시 안 찍으면, 배포는 새 파일을 올리는데 **화면은 옛 판을 말한다** —
      #   그러면 「반영이 안 된다」를 지문으로 가릴 수가 없어진다 (M-25).
      - name: Check build stamp
        run: npm run im:stamp -- --check

  deploy:
    needs: [plan, guard]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # ★ 라우트 점검(`verify:nas`)이 node 로 돈다. 없으면 그 단계만 조용히
      #   죽는데, 하필 **조용히 죽으면 안 되는** 단계다
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ★★ **dry run 에서도 이 단계는 돈다** 〈2026-08-21〉. 앞 판은 여기에
      #   `if: !inputs.dry_run` 이 붙어 있어서, **안전한 판으로는 열쇠가
      #   들어왔는지 알 방법이 없었다.** 그래서 「확인하려면 실제로 올려
      #   보는 수밖에 없다」가 되었다 — 확인하려고 운영 화면을 덮는 것은
      #   순서가 거꾸로다. 이제 dry run 은 **어느 Secret 이 있고 없는지 이름으로**
      #   알려 준다 — NAS 를 건드리지 않고.
      #   ★ 값은 절대 찍지 않는다. **있다/없다만** 말한다 (CLAUDE.md §2).
      - name: Check secrets
        id: ts
        env:
          DRY: ${{ needs.plan.outputs.dry_run }}
          OAUTH_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          OAUTH_SEC: ${{ secrets.TS_OAUTH_SECRET }}
          AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
          NAS_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          set -uo pipefail
          MISSING=""
          say() {
            if [ -n "${!1:-}" ]; then
              echo "  있음 — $2"
            else
              echo "  없음 — $2"
              MISSING="$MISSING $2"
            fi
          }
          echo "── tailnet 열쇠 (둘 중 한 길만 있으면 된다) ──"
          say OAUTH_ID  TS_OAUTH_CLIENT_ID
          say OAUTH_SEC TS_OAUTH_SECRET
          say AUTHKEY   TS_AUTHKEY
          echo "── NAS 접속 (셋 다 있어야 한다) ──"
          say NAS_HOST  NAS_SSH_HOST
          say NAS_USER  NAS_SSH_USER
          say NAS_KEY   NAS_SSH_KEY

          # ★ OAuth 는 **둘 다** 있어야 한다. ID 만 보고 고르면 붙는 단계까지
          #   가서야 죽고, 그 오류는 「열쇠가 틀렸다」와 구분되지 않는다
          MODE=""
          if [ -n "${OAUTH_ID:-}" ] && [ -n "${OAUTH_SEC:-}" ]; then
            MODE=oauth
          elif [ -n "${AUTHKEY:-}" ]; then
            MODE=authkey
          elif [ -n "${OAUTH_ID:-}" ] || [ -n "${OAUTH_SEC:-}" ]; then
            echo "::warning::OAuth 는 TS_OAUTH_CLIENT_ID 와 TS_OAUTH_SECRET 이 **둘 다** 있어야 한다 — 한쪽만 있다"
          fi

          NAS_OK=1
          for v in NAS_HOST NAS_USER NAS_KEY; do
            [ -n "${!v:-}" ] || NAS_OK=0
          done

          if [ "${DRY:-}" = "true" ]; then
            # ★ dry run 에서는 **판정만 하고 mode 를 넘기지 않는다.**
            #   넘기면 아래 접속 단계가 실제로 돌아 「올리지 않는다」가 깨진다
            if [ -n "$MODE" ] && [ "$NAS_OK" = "1" ]; then
              echo "::notice::여섯 자리가 다 찼다 — dry_run 을 끄면 실제로 배포된다"
            else
              echo "::warning::아직 못 넣은 Secret:${MISSING:- 없음} — 넣기 전에는 실제 배포가 여기서 멈춘다"
            fi
            exit 0
          fi

          if [ -z "$MODE" ]; then
            echo "::error::tailnet 열쇠가 없다 — TS_OAUTH_CLIENT_ID + TS_OAUTH_SECRET 이나 TS_AUTHKEY 중 하나를 Secrets 에 넣는다"
            exit 1
          fi
          # ★ NAS 자격증명이 없으면 **tailnet 에 붙기 전에** 멈춘다.
          #   붙고 나서 죽으면 원인이 둘로 보인다
          if [ "$NAS_OK" != "1" ]; then
            echo "::error::NAS 접속 Secret 이 없다 — NAS_SSH_HOST · NAS_SSH_USER · NAS_SSH_KEY 를 넣는다"
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = oauth ]; then
            echo "OAuth 클라이언트로 붙는다 (만료 없음)"
          else
            echo "auth key 로 붙는다 — **만료가 있다.** 때가 되면 다시 만든다"
          fi

      # 배포 대상을 먼저 검증한다. 경로 조작·금지 파일을 여기서 막는다.
      - name: Check files
        env:
          FILES: ${{ needs.plan.outputs.files }}
        run: |
          set -euo pipefail
          for f in $FILES; do
            case "$f" in
              /*|*..*) echo "::error::절대경로·상위경로는 허용하지 않는다: $f"; exit 1 ;;
            esac
            if [ "$(basename "$f")" = "linkpilot-platform.html" ]; then
              echo "::error::linkpilot-platform.html 은 앱 본체 파일이라 이 워크플로로 덮어쓸 수 없다"
              exit 1
            fi
            [ -f "$f" ] || { echo "::error::파일 없음: $f"; exit 1; }
            echo "올릴 파일: $f  ($(wc -c < "$f") bytes)"
          done

      # ★★ **둘 중 아무거나 있으면 붙는다** 〈2026-08-21 · 실제로 막혀서 고침〉.
      #   콘솔이 새로 바뀌면서 `Settings › Keys` 에는 **auth key 밖에 없는** 경우가
      #   있다(OAuth client 는 다른 자리로 옮겨졌거나 요금제에 따라 안 보인다).
      #   그때 「OAuth 만 받는다」로 두면 **만들 수 있는 열쇠가 있는데도 못 쓴다.**
      #
      #   ★ 어느 쪽이 나은가: OAuth 는 **만료가 없다.** auth key 는 최대 90일이라
      #     때가 되면 다시 만들어야 한다. 그래서 OAuth 를 **먼저** 본다.
      #   ★ auth key 를 쓸 때는 만들 때 **Ephemeral · Reusable · Tag(tag:ci)** 를
      #     켠다. 하나라도 빠지면 붙어도 권한이 없거나 기기 목록이 지저분해진다.
      # ★ **`if:` 에서 secrets 를 보지 않는다.** GitHub 이 그 자리에서 secrets 를
      #   읽게 해 주는지 확실치 않고, 안 되면 **조용히 빈 값으로 평가되어**
      #   두 단계가 다 건너뛰어진다 — 그러면 「붙지도 않고 오류도 없는」 판이 된다.
      #   그래서 여기서 **한 번 판정해 출력으로 넘긴다.**
      - name: Connect to tailnet (OAuth)
        if: ${{ steps.ts.outputs.mode == 'oauth' }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # ★ auth key 에는 `tags` 를 주지 않는다 — 태그는 **열쇠를 만들 때** 정해지고,
      #   여기서 또 주면 「이미 태그가 있다」로 거부된다
      - name: Connect to tailnet (auth key)
        if: ${{ steps.ts.outputs.mode == 'authkey' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # ★★ **붙었는지 재 본다.** 위 두 단계가 다 건너뛰어져도 워크플로는
      #   초록으로 계속 간다 — 그러면 다음 단계에서 「연결 안 됨」이 아니라
      #   엉뚱한 오류로 죽는다. 여기서 먼저 잡는다
      - name: Verify tailnet
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          tailscale status --json >/dev/null 2>&1 \
            || { echo "::error::tailnet 에 안 붙었다 — 위 단계가 건너뛰어졌는지 본다"; exit 1; }
          echo "tailnet 연결 확인"

      # ★ ssh 준비와 **닿는지 확인**은 올리든 안 올리든 똑같이 한다.
      #   여기서 `echo ok` 까지 해 두면 실패했을 때 원인이 하나로 좁혀진다 —
      #   「붙었는데 못 올렸다」와 「애초에 못 붙었다」가 섞이지 않는다.
      - name: Set up ssh
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
          NAS_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$NAS_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 호스트키를 미리 받아둔다. StrictHostKeyChecking 을 끄지 않는다
          #
          # ★★★ **`|| { ... }` 를 반드시 붙인다** 〈2026-08-23 · 실제로 당했다〉.
          #   앞 판은 `ssh-keyscan … 2>/dev/null` 한 줄이었다. NAS 가 안 켜져
          #   있으면 keyscan 이 실패하고 **`set -e` 가 그 자리에서 스크립트를
          #   죽인다** — 아래 친절한 안내는 **한 글자도 안 나온다.**
          #   로그에 남는 것은 `Process completed with exit code 1` 뿐이었다.
          #   ★ 잘 적어 둔 안내가 **닿지 않는 자리에** 있었던 것이다.
          if ! ssh-keyscan -H "$NAS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::NAS 의 호스트키를 못 받았다 — **기계가 지금 안 붙는다.**"
            echo "  ① NAS 가 켜져 있는지 (절전으로 잠들면 tailnet 에서도 사라진다)"
            echo "  ② NAS 의 Tailscale 이 연결 상태인지 (제어판 → 패키지 센터)"
            echo "  ③ NAS_SSH_HOST 가 **tailnet 주소**인지 (사무실 안 주소·DDNS 는 안 된다)"
            echo "  ※ 배포는 여기서 멈췄다 — **NAS 는 아무것도 안 건드렸다.**"
            exit 1
          fi

          # ★ 읽기만 하는 확인. 여기서 죽으면 **아무것도 안 건드린 상태**다
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_deploy \
            "$NAS_USER@$NAS_HOST" 'echo ok' >/dev/null || {
            echo "::error::NAS 에 ssh 로 못 붙었다 — 호스트키는 받았으니 **기계는 켜져 있다.**"
            echo "  ① 공개키가 NAS 의 authorized_keys 에 들어갔는지"
            echo "  ② NAS 쪽 ~/.ssh 권한이 700, authorized_keys 가 600 인지"
            echo "  ③ NAS_SSH_USER 가 맞는지"
            echo "  ※ 배포는 여기서 멈췄다 — **NAS 는 아무것도 안 건드렸다.**"
            exit 1
          }
          echo "NAS ssh 연결 확인"

      # ★★ **목적지를 올리기 전에 본다** 〈2026-08-21 · 실제로 여기서 죽었다〉.
      #   앞 판은 곧장 scp 를 했고 이렇게 죽었다:
      #
      #     scp: dest open "/volume1/web/report-flow.html": No such file or directory
      #
      #   **연결도 열쇠도 다 맞는데 「어디에 놓을지」가 틀린 것**인데, 오류가
      #   scp 안에서 나와 그 둘이 섞여 보인다. 그리고 파일이 여럿이면 **앞의 몇
      #   개만 올라간 반쯤 된 상태**로 멈춘다 — 그 상태가 제일 나쁘다.
      #   여기서 먼저 재고, 안 되면 **무엇을 봐야 하는지 말하고** 멈춘다.
      - name: Check destination
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        env:
          DEST: ${{ needs.plan.outputs.dest }}
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
        run: |
          set -uo pipefail
          OUT=$(ssh -o BatchMode=yes -i ~/.ssh/id_deploy "$NAS_USER@$NAS_HOST" \
            "test -d '$DEST' && { test -w '$DEST' && echo OK || echo NOWRITE; } || echo NODIR" 2>&1)
          case "$OUT" in
            *OK*)
              echo "목적지 확인: 있고 쓸 수 있다" ;;
            *NOWRITE*)
              echo "::error::목적지는 있는데 **쓸 수가 없다** — 그 계정에 쓰기 권한이 없다. DSM 제어판 › 공유 폴더 › 권한 에서 확인한다"
              exit 1 ;;
            *NODIR*)
              echo "::error::목적지 폴더가 없다(또는 그 계정에서 안 보인다). 실제 경로를 확인한다 — ssh 로 붙어 ls /volume1 을 쳐 보면 무엇이 있는지 나온다 (별표를 쓰면 내 컴퓨터가 먼저 풀어 보려다 거부한다)"
              exit 1 ;;
            *)
              echo "::error::목적지를 확인하지 못했다: $OUT"
              exit 1 ;;
          esac

      # ★★ **올린 것이 「어떻게 서빙되는지」까지 잰다** 〈2026-08-21〉.
      #   파일이 제자리에 있는 것과, 받는 쪽이 그것을 **어떤 모습으로** 받는지는
      #   다른 이야기다. 특히 압축은 **켜져 있는지 밖에서는 보이지 않는데**
      #   체감 속도를 세 배로 가른다 (122KB → 약 35KB).
      #
      #   ★ 사람에게 「터미널에서 curl 해 보세요」라고 시키지 않는다. 러너는
      #     이미 tailnet 안에 있다 — **잴 수 있는 쪽이 잰다.**
      #   ★ 읽기만 한다. 헤더만 받고(-I) 아무것도 바꾸지 않는다.
      #   ★ 포트를 모른다. 흔한 것부터 차례로 두드리고, **어디서 답이 왔는지**를
      #     함께 적는다 — 「안 된다」만 남기면 다음 사람이 또 처음부터 찾는다.
      - name: Check serving
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          DEST: ${{ needs.plan.outputs.dest }}
        run: |
          # ★★ **`set +e` 를 반드시 켠다** 〈2026-08-21 · 여기서 한 번 죽었다〉.
          #   GitHub 의 기본 셸은 `bash -e {0}` 다 — 즉 **`-e` 가 이미 켜진 채로**
          #   들어온다. `set -uo pipefail` 은 그것을 끄지 않는다(끄려면 `+e`).
          #   그래서 **`grep` 이 못 찾은 순간 단계가 통째로 죽었다.**
          #   ★ 하필 「못 찾음」이 여기서는 **정상 결과**다 — 압축 헤더가 없다는
          #     뜻이니까. 답을 찾은 그 순간에 죽은 셈이다. 여기서는 오류를 손으로
          #     다루므로 `-e` 를 끈다.
          set -u
          set +e
          # 웹 루트 아래 경로로 바꾼다 (/volume1/web/im-flow → /im-flow)
          WEBPATH=$(printf '%s' "$DEST" | sed 's|^/volume1/web||')
          FILE="${WEBPATH}/files.html"
          echo "재는 대상: ${FILE}"

          FOUND=0
          for PORT in 80 5000 8080 8181; do
            H=$(curl -sS -I -m 8 -H 'Accept-Encoding: gzip' "http://${NAS_HOST}:${PORT}${FILE}" 2>/dev/null)
            [ -z "$H" ] && { echo "  ${PORT} — 응답 없음"; continue; }
            CODE=$(printf '%s' "$H" | head -1 | awk '{print $2}')
            echo "  ${PORT} — HTTP ${CODE}"
            [ "$CODE" = "200" ] || continue
            FOUND=1
            # ★ 없으면 grep 이 1 을 돌려준다 — **없는 것도 답**이므로 그냥 받는다
            ENC=$(printf '%s' "$H" | grep -i '^content-encoding:' | tr -d '\r' | cut -d' ' -f2- || true)
            LEN=$(printf '%s' "$H" | grep -i '^content-length:' | tr -d '\r' | cut -d' ' -f2- || true)
            echo "    Content-Encoding: ${ENC:-(없음)}"
            echo "    Content-Length:   ${LEN:-(없음)}"
            if printf '%s' "$ENC" | grep -qi gzip; then
              echo "::notice::압축 켜져 있다 (${PORT} · gzip · ${LEN:-?} bytes) — 더 할 일 없다"
            else
              echo "::warning::압축이 **꺼져 있다** (${PORT} · ${LEN:-?} bytes 를 그대로 보낸다). DSM 웹 서비스에서 HTTP 압축을 켜면 받는 양이 약 1/3 로 준다"
            fi
            break
          done
          [ "$FOUND" = "1" ] || echo "::warning::어느 포트에서도 200 이 안 왔다 — 이 주소로는 웹으로 안 열리는 것이다. 앱이 실제로 어느 주소에서 화면을 읽는지 확인이 필요하다"

      # ★★★ **내려주는 판이 방금 올린 판인가** 〈2026-08-22 · 세 번 헤맸다〉.
      #
      #   같은 신고가 반복될 때마다 「새로고침해 보십시오」로 넘겼는데, 그건
      #   **재지 않고 말한 것**이다. 실제로는 세 가지가 다 가능했다:
      #     ① 안 올라갔다  ② 올라갔는데 캐시가 옛것을 준다  ③ 코드가 틀렸다
      #   셋은 화면에서 **똑같이 보인다.** 그래서 러너가 직접 받아 본다.
      #
      #   ★ **읽기만 한다.** curl 로 받아서 표식을 찾고 캐시 머리말을 적는다.
      #   ★ 표식은 손으로 적지 않는다 — 저장소 파일에서 뽑아 **같은 글자**를 찾는다.
      #     손으로 적으면 다음에 이름이 바뀐 날 검사만 옛말을 한다.
      # ★★ **업로드 본문 한도가 실제로 올라갔는지 잰다** 〈2026-08-22〉.
      #   엔진은 파일 30MB · 한 번에 100MB 를 받도록 되어 있다. 그런데 그
      #   검사에 닿기도 전에 **본문 파서**가 먼저 끊는다 — express 기본값은
      #   100KB 다. 그때 증상은 「전송이 끊겼습니다」나 엉뚱한 401 이라서,
      #   **화면만 봐서는 어디서 끊겼는지 알 수 없다.**
      #
      #   ★ 사람에게 「ssh 로 붙어 grep 해 보세요」라고 시키지 않는다. 러너는
      #     이미 tailnet 안에 있다 — **잴 수 있는 쪽이 잰다** (Check serving 과 같다).
      #   ★ **읽기만 한다.** grep 만 돌리고 아무것도 바꾸지 않는다.
      #   ★ 파일을 못 찾는 것도 **답**이다. 「엔진 루트가 다른 곳이다」를 뜻하므로
      #     조용히 넘기지 않고 무엇을 봐야 하는지 적는다.
      - name: Check upload body limit
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
        run: |
          # Check serving 과 같은 이유로 -e 를 끈다 — 「못 찾음」이 정상 결과다
          set -u
          set +e
          # ★★ 문서가 적어 둔 자리(`/volume1/docker/linkpilot`)에 **없었다**
          #   〈2026-08-22 실측〉. 그래서 「없다」로 끝내지 않고 **찾는다** —
          #   「엔진 루트가 다른 곳이다」만 남기면 다음 사람이 또 처음부터 찾는다.
          SRV=$(ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_deploy \
            "$NAS_USER@$NAS_HOST" \
            "for p in /volume1/docker/linkpilot /volume1/linkpilot /volume1/web/linkpilot; do
               [ -f \$p/im-engine-server.cjs ] && { echo \$p/im-engine-server.cjs; exit 0; }
             done
             find /volume1 -maxdepth 4 -name 'im-engine-server*.cjs' -not -path '*/node_modules/*' 2>/dev/null | head -1" 2>&1 | tail -1)

          if [ -z "$SRV" ]; then
            echo "엔진 서버 파일을 못 찾았다. /volume1 아래에 무엇이 있는지 적어 둔다:"
            ssh -o BatchMode=yes -i ~/.ssh/id_deploy "$NAS_USER@$NAS_HOST" \
              "ls -1 /volume1 2>/dev/null; echo '--- /volume1/docker'; ls -1 /volume1/docker 2>/dev/null" 2>&1 | sed 's/^/  /'
            echo "::warning::엔진 서버 파일(im-engine-server*.cjs)이 /volume1 아래 4단 안에 없다 — 다른 볼륨이거나, 배포 계정에서 안 보이는 자리다. 위 목록을 보고 실제 경로를 정한다"
            exit 0
          fi

          echo "엔진 서버: $SRV"
          # ★★ **한 줄에 `test -f … && grep … || echo __NOFILE__` 로 묶지 않는다**
          #   〈2026-08-22 · 여기서 한 번 속았다〉. grep 이 **못 찾으면 1** 을
          #   돌려주므로 `||` 가 걸려 「파일이 없다」가 찍힌다. 파일은 멀쩡히
          #   있었는데 「엔진 루트가 다른 곳」이라고 보고했다 — 찾는 곳을
          #   통째로 잘못 잡게 만드는 거짓말이다. 있는지와 무엇이 들었는지는
          #   **따로** 묻는다.
          #
          # ★ express 계열이 안 나올 수 있다. 그때는 직접 모으는 판이므로
          #   `req.on('data')` 쪽을 봐야 한다 — 둘 다 한 번에 긁는다.
          OUT=$(ssh -o BatchMode=yes -i ~/.ssh/id_deploy "$NAS_USER@$NAS_HOST" \
            "grep -nE \"express\\.json|bodyParser|MIN_BODY_BYTES|maxBody|payload|req\\.on\\('data'|Buffer\\.concat|content-length|1024 ?\\* ?1024|limit\" '$SRV' | head -40" 2>&1)
          [ -z "$OUT" ] && OUT="(일치하는 줄 없음)"

          echo "본문 파서 자리:"
          printf '%s\n' "$OUT"

          if printf '%s' "$OUT" | grep -q 'MIN_BODY_BYTES'; then
            echo "::notice::본문 한도가 엔진 값(MIN_BODY_BYTES · 약 141MB)으로 잡혀 있다 — 큰 파일 업로드가 열려 있다"
          elif printf '%s' "$OUT" | grep -qE 'express\.json|bodyParser'; then
            echo "::warning::본문 파서는 있는데 **한도가 엔진 값이 아니다.** 위 줄의 limit 을 본다 — 없으면 기본 100KB 라 8MB 도 못 올린다 (deploy/앱-업로드-한도.md)"
          elif printf '%s' "$OUT" | grep -qE "req\\.on\\('data'|Buffer\\.concat"; then
            echo "::warning::express 를 안 쓰고 **직접 모으는 판**이다. 위 줄의 길이 검사를 본다 — 검사가 아예 없으면 큰 본문에서 메모리로 터진다 (deploy/앱-업로드-한도.md ①-(나))"
          else
            echo "::warning::본문을 어디서 받는지 못 찾았다 — 라우터를 다른 파일에서 붙이는 판일 수 있다. 위 목록과 함께 그 파일을 찾는다"
          fi

      # ★★ **어디서 끊기는지 크기를 키워 가며 잰다** 〈2026-08-22〉.
      #   앞 단계는 **파일에 적힌 한도**를 읽었다 (64MB). 그런데 사용자는
      #   **8.7MB 에서** 멈췄다 — 파일이 말하는 것과 실제로 지나가는 것이
      #   다르다는 뜻이다. 앞단(리버스 프록시·Funnel)이 더 낮게 잡고 있을 수 있다.
      #
      #   ★ **아무것도 바꾸지 않는다.** 없는 프로젝트(LP-NOPE-0000-000)로 보낸다 —
      #     문지기와 존재 검사에서 되돌아오므로 저장도 삭제도 일어나지 않는다.
      #   ★ 재는 것은 **본문이 끝까지 갔는가** 하나다. 401·404 여도 **응답이
      #     왔다는 것**이 곧 본문이 통과했다는 뜻이다. 끊기면 응답이 아예 없다.
      #   ★ 8181(엔진 직행)과 80(앞단 경유)을 **둘 다** 잰다. 둘이 갈리면
      #     범인이 앞단이라는 것이 그 자리에서 드러난다.
      - name: Probe body size ceiling
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
        run: |
          set -u
          set +e
          PATHS="/api/linkpilot/projects/LP-NOPE-0000-000/oneshot /projects/LP-NOPE-0000-000/oneshot"

          for PORT in 8181 80; do
            echo "── 포트 ${PORT} ──"
            HIT=""
            for P in $PATHS; do
              C=$(curl -sS -o /dev/null -w '%{http_code}' -m 15 -X POST \
                -H 'content-type: application/json' -d '{"files":[]}' \
                "http://${NAS_HOST}:${PORT}${P}" 2>/dev/null)
              echo "  ${P} → HTTP ${C:-(응답 없음)}"
              [ -n "$C" ] && [ "$C" != "000" ] && [ "$C" != "404" ] && { HIT="$P"; break; }
              [ -n "$C" ] && [ "$C" != "000" ] && [ -z "$HIT" ] && HIT="$P"
            done
            [ -z "$HIT" ] && { echo "  이 포트로는 API 가 안 열린다 — 크기 재기 건너뛴다"; continue; }

            for MB in 1 8 24 48 64; do
              BODY=/tmp/body_${MB}.json
              # {"files":[{"name":"probe","contentBase64":"AAAA…"}]} — 딱 MB 만큼
              { printf '{"files":[{"name":"probe","contentBase64":"'
                head -c $((MB * 1024 * 1024)) /dev/zero | tr '\0' 'A'
                printf '"}]}'; } > "$BODY"
              C=$(curl -sS -o /dev/null -w '%{http_code}' -m 60 -X POST \
                -H 'content-type: application/json' --data-binary "@$BODY" \
                "http://${NAS_HOST}:${PORT}${HIT}" 2>/dev/null)
              rm -f "$BODY"
              if [ -z "$C" ] || [ "$C" = "000" ]; then
                echo "::warning::포트 ${PORT} — ${MB}MB 에서 **응답이 끊겼다.** 여기가 한도다"
                break
              fi
              echo "  ${MB}MB → HTTP ${C} (본문은 끝까지 갔다)"
            done
          done

      # ★★★ **이 워크플로가 하는 일의 전부다** 〈2026-08-22 · D-84〉.
      #
      #   쓰기를 지웠으므로 **여기가 유일한 판정**이다. 그래서 실패를 삼키지
      #   않는다 — 앞 판은 `|| true` 가 붙어 있었다. 올리는 단계가 뒤에 있을
      #   때는 그것으로 충분했지만, 지금은 **삼키면 이 워크플로가 아무 말도
      #   안 하는 것**이 된다.
      #
      #   ★ 재는 목록을 `files` 에서 받는다. 앞 판은 스크립트 기본값 넷만 쟀다.
      #     화면 열여섯이 서로를 부르므로 **하나만 옛것이어도 빈 화면**이 뜨는데,
      #     넷만 재면 그 하나가 나머지 열둘 중에 있을 때 초록으로 지나간다 (M-22).
      # ★★★ **여기는 「올리기 전」이다 — 재기만 한다** 〈2026-08-23 · run #44 에서 잡혔다〉.
      #
      #   앞 판은 올린 뒤와 **똑같은 잣대**로 쟀다. 그래서 「저장소 ≠ 디스크」를
      #   치명으로 보고 배포를 세웠는데, 올리기 **전에** 그 둘이 다른 것은
      #   고장이 아니라 **올리는 이유 그 자체**다.
      #   → **바꿀 것이 있는 날에만 배포가 막히는** 장치가 되어 있었다.
      #     실제로 run #44 는 16개 중 4개에서 죽고 Upload 를 건너뛰었다.
      #
      #   ★ 잣대는 자리에 따라 다르다. **올린 뒤**(`Verify deployed`)에는 그대로 치명이다.
      - name: Check served build
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        env:
          LP_BEFORE: '1'
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
          DEST: ${{ needs.plan.outputs.dest }}
          FILES: ${{ needs.plan.outputs.files }}
        run: |
          set -uo pipefail
          # 스크립트는 **파일 이름**을 받는다 (경로는 저장소 쪽에서 붙인다)
          NAMES=""
          for f in $FILES; do NAMES="$NAMES $(basename "$f")"; done
          bash deploy/verify-served.sh "$NAS_HOST" "$NAS_USER" "$DEST" $NAMES

      # ★★★ **올린다** 〈2026-08-23 사장님 지시 — 「앞으로는 네가 배포해」〉.
      #   전날 D-84 로 지웠던 것을 되살렸다. 지웠던 이유는 이 파일 머리에 그대로
      #   남아 있다 — 되살렸다고 그 이유가 사라지지는 않는다.
      #
      #   ★ **`-O` 를 뺄 수 없다.** OpenSSH 9 부터 scp 는 속으로 SFTP 를 쓰는데,
      #     Synology 에 「SFTP 사용자를 홈 폴더에 가둔다」 설정이 켜져 있으면 그쪽에서
      #     `/volume1/web` 이 **아예 없는 것처럼** 보인다. 그러면 「그런 폴더 없음」이
      #     나오고, 멀쩡한 경로를 몇 번이고 다시 확인하게 된다.
      #   ★ 덮기 전에 백업을 뜬다 — 되돌릴 길을 먼저 만든다.
      - name: Upload
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        env:
          FILES: ${{ needs.plan.outputs.files }}
          DEST: ${{ needs.plan.outputs.dest }}
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
        run: |
          set -euo pipefail
          STAMP=$(TZ=Asia/Seoul date +%Y%m%d-%H%M)
          ssh -i ~/.ssh/id_deploy "$NAS_USER@$NAS_HOST" "mkdir -p '$DEST'"
          for f in $FILES; do
            BASE=$(basename "$f")
            ssh -i ~/.ssh/id_deploy "$NAS_USER@$NAS_HOST" \
              "test -f '$DEST/$BASE' && cp '$DEST/$BASE' '$DEST/$BASE.$STAMP.bak' || true"
            scp -O -i ~/.ssh/id_deploy "$f" "$NAS_USER@$NAS_HOST:$DEST/$BASE"
            echo "배포: $BASE"
          done

      # ★★★ **「올렸다」로 끝내지 않는다** (M-20 · M-22 · M-25).
      #   저장소 ≠ **디스크** 는 빨갛게 끝낸다 — 그건 올리기가 실제로 안 된 것이다.
      #   디스크 ≠ HTTP 는 **경고**다: 이 탐침은 tailnet 포트 80 으로 받는데 앱은
      #   Funnel 443 으로 들어와 문서 루트가 다를 수 있다(M-25). 그걸 치명으로 두면
      #   멀쩡한 배포가 늘 빨갛고, 그러면 빨간 것을 아무도 안 보게 된다.
      - name: Verify deployed
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
          DEST: ${{ needs.plan.outputs.dest }}
          FILES: ${{ needs.plan.outputs.files }}
        run: |
          set -uo pipefail
          NAMES=""
          for f in $FILES; do NAMES="$NAMES $(basename "$f")"; done
          bash deploy/verify-served.sh "$NAS_HOST" "$NAS_USER" "$DEST" $NAMES

      # ★★★ **앱이 실제로 쓰는 길로 한 번 더 잰다** 〈2026-08-23〉.
      #
      #   앞 단계는 tailnet 의 포트 80 으로 받는다. 그런데 앱은 **Funnel 443 → 80**
      #   으로 들어오고, DSM 은 `Host:` 로 가상 호스트를 고르므로 **문서 루트가
      #   다를 수 있다.** 그래서 「디스크 ≠ HTTP」가 나와도 그게 캐시인지 다른
      #   파일인지 그 자리에서는 갈리지 않았다 — M-25 가 통째로 그 이야기다.
      #
      #   ★ 여기서 같은 길로 재면 그 갈림이 **없어진다.** 사장님이 보시는 그 파일을
      #     그대로 받아서 지문을 대 보는 것이기 때문이다.
      #   ★ 주소가 없으면 **조용히 건너뛰지 않는다.** 「못 쟀다」가 안 보이면
      #     「쟀는데 맞았다」와 구분이 안 된다 (§2).
      - name: Check via app path
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        env:
          BASE: ${{ secrets.LP_PUBLIC_BASE }}
          FILES: ${{ needs.plan.outputs.files }}
        run: |
          set -uo pipefail
          if [ -z "${BASE:-}" ]; then
            echo "::warning::LP_PUBLIC_BASE 가 없어 **앱이 쓰는 길로는 못 쟀다.** 위의 「디스크 ≠ HTTP」 경고가 캐시인지 다른 파일인지 여기서는 갈리지 않는다 (M-25 ①). 저장소 Settings → Secrets and variables → Actions 에서 앱 화면 폴더의 공개 주소를 넣으면 이 자리에서 갈린다."
            echo "앱 경로 확인: 건너뜀 (주소 없음)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BASE="${BASE%/}"
          BAD=0; OK=0
          for f in $FILES; do
            NAME=$(basename "$f")
            WANT=$(sha256sum "$f" | cut -c1-12)
            GOT=$(curl -sS -m 25 "$BASE/$NAME" 2>/dev/null | sha256sum | cut -c1-12)
            if [ "$WANT" = "$GOT" ]; then
              OK=$((OK+1))
            else
              echo "::error::${NAME} — **앱이 쓰는 길로 받은 것이 저장소와 다르다** (저장소 ${WANT} · 앱 ${GOT}). 사장님 화면에 닿은 것은 이 파일이다."
              BAD=1
            fi
          done
          echo "앱 경로 확인: ${OK} 개 일치" >> "$GITHUB_STEP_SUMMARY"
          exit "$BAD"

      # ★★★ **엔진을 올린다** 〈2026-08-23 · D-88 — 「모든 파일과 구조를 정립해줘」〉.
      #
      #   여기가 이 저장소에 **없던 자리**다. 화면 열여섯은 위에서 올렸고,
      #   엔진(`im-agent/**`)은 **아무도 안 올렸다.** NAS 에 `im-agent.bak-*` 가
      #   스무 개 쌓여 있는 것이 그 증거다 — 사람이 손으로 tar 를 말아 왔다.
      #   그래서 화면은 새 판, 서버는 옛 라우팅 표인 상태가 났다 (D-87).
      #
      #   ★ **화면보다 뒤, 라우트 재기보다 앞**이다. 이 순서라야 바로 아래
      #     `Check routes` 가 **방금 올린 엔진**을 잰다. 앞에 두면 옛 엔진을 재고,
      #     뒤에 두면 라우트 결과가 한 판 늦은 이야기가 된다.
      #   ★ 되돌리기는 `deploy/engine.sh` 안에 있다 — **여기서 하지 않는다.**
      #     워크플로에 적으면 사장님 맥에서 돌릴 때는 되돌림이 없어진다.
      #   ★ **실패를 삼키지 않는다.** 되돌렸어도 빨갛게 끝나야 한다 — 되돌린 것은
      #     서비스를 살린 것이지 배포가 된 것이 아니다.
      - name: Deploy engine (D-87 · D-88)
        if: ${{ needs.plan.outputs.dry_run != 'true' && needs.plan.outputs.engine == 'true' }}
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
          LP_SSH_KEY: /home/runner/.ssh/id_deploy
        run: bash deploy/engine.sh "$NAS_HOST" "$NAS_USER"

      # ★ 안 올린 날에는 **안 올렸다고 말한다.** 아무 줄도 안 남기면 「올렸는데
      #   조용했다」와 구분이 안 된다 (§2 — 조용히 죽지 않는다)
      - name: Engine skipped
        if: ${{ needs.plan.outputs.dry_run != 'true' && needs.plan.outputs.engine != 'true' }}
        run: |
          echo "엔진: **안 올렸다** — 바뀐 것이 화면뿐이거나 손으로 no 를 골랐다" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::엔진(im-agent)은 이번에 안 올렸다. 서버는 지금 돌고 있는 판 그대로다"

      # ★★★ **404 가 엔진 탓인지 앞단 탓인지 갈라 놓는다** 〈2026-08-23 · D-87 정정〉.
      #
      #   실행 #56 에서 둘이 **동시에** 성립했다:
      #     · 엔진 배포 성공 — 새 판을 갈아 끼우고 **1초 만에 HTTP 200** (8181 직행)
      #     · 그런데 바깥(tailnet 포트 80)에서 `/api/linkpilot/intake` 는 **여전히 404**
      #
      #   ★ 그러면 「서버가 옛 라우팅 표를 들고 있다」는 **더 이상 유일한 설명이
      #     아니다.** 앞단(DSM 웹서비스·리버스 프록시)이 그 길을 8181 로 안
      #     넘기고 있을 수도 있다 — M-25 가 말한 「잰 길이 앱이 쓰는 길과 다르다」의
      #     API 판이다.
      #
      #   ★★ **둘은 화면에서 똑같이 404 로 보인다.** 그래서 갈라 놓고 말한다.
      #     여기서 갈라 두지 않으면 또 엉뚱한 곳(엔진)을 판다 — 오늘 그랬다.
      #   ★ **읽기만 한다.** 안팎에서 같은 주소를 두드려 응답 코드만 받는다.
      - name: Split inside vs outside (D-87 · M-25)
        id: split
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
        run: |
          set -u
          set +e   # 「못 받음」이 여기서는 정상 결과다 (bash -e 를 끈다)
          probe_in() {
            ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_deploy \
              "$NAS_USER@$NAS_HOST" \
              "curl -s -o /dev/null -w '%{http_code}' -m 8 'http://127.0.0.1:8181$1'" \
              2>/dev/null | tr -d '\r' | tail -1
          }
          IN_API=$(probe_in /api/linkpilot/intake)
          IN_BARE=$(probe_in /intake)
          IN_HEALTH=$(probe_in /healthz)
          OUT_API=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "http://${NAS_HOST}/api/linkpilot/intake" 2>/dev/null)

          echo "── 같은 주소를 안팎에서 두드렸다 ──"
          echo "  엔진 직행 8181  /healthz               → ${IN_HEALTH:-(못 받음)}"
          echo "  엔진 직행 8181  /api/linkpilot/intake  → ${IN_API:-(못 받음)}"
          echo "  엔진 직행 8181  /intake                → ${IN_BARE:-(못 받음)}"
          echo "  바깥 포트 80    /api/linkpilot/intake  → ${OUT_API:-(못 받음)}"

          # ★ 404 가 아니면 **길은 있는 것**이다 (401·400·405 는 통과 — verify:nas 와 같은 잣대)
          alive() { [ -n "$1" ] && [ "$1" != "000" ] && [ "$1" != "404" ]; }

          if alive "$IN_API" && [ "${OUT_API:-404}" = "404" ]; then
            echo "::warning::**엔진에는 길이 있는데 바깥에서는 404 다.** 엔진(8181)은 /api/linkpilot/intake 에 ${IN_API} 로 답하는데 포트 80 은 404 를 준다 → **앞단이 그 길을 8181 로 안 넘긴다.** 엔진을 더 올려도 안 바뀐다. ① 앱이 실제로 쓰는 주소를 LP_BASE 에 넣어 다시 재거나 ② DSM 웹서비스의 리버스 프록시 규칙을 본다"
            echo "404 의 자리: **앞단** — 엔진은 ${IN_API}, 포트 80 은 404" >> "$GITHUB_STEP_SUMMARY"
            echo "where=front" >> "$GITHUB_OUTPUT"
          elif [ "${IN_API:-404}" = "404" ] && alive "$IN_BARE"; then
            echo "::warning::**엔진이 접두사 없이 붙어 있다.** /intake 는 ${IN_BARE} 인데 /api/linkpilot/intake 는 404 다 → 앞단이 `/api/linkpilot` 을 떼고 넘겨야 하는 구조다. 지금은 그 규칙이 없거나 다르다"
            echo "404 의 자리: **접두사** — /intake 는 ${IN_BARE}, /api/linkpilot/intake 는 404" >> "$GITHUB_STEP_SUMMARY"
            echo "where=prefix" >> "$GITHUB_OUTPUT"
          elif [ "${IN_API:-404}" = "404" ] && [ "${IN_BARE:-404}" = "404" ]; then
            echo "::error::**엔진에 그 길이 정말 없다.** 방금 올린 판으로도 8181 직행이 두 주소 다 404 다 — 이건 저장소 쪽 일이다 (라우터를 안 걸고 있다)"
            echo "404 의 자리: **엔진** — 8181 직행도 404 다" >> "$GITHUB_STEP_SUMMARY"
            echo "where=engine" >> "$GITHUB_OUTPUT"
          elif alive "$OUT_API"; then
            echo "::notice::바깥에서도 길이 있다 (${OUT_API}) — 404 는 사라졌다"
            echo "404 없음 — 바깥 ${OUT_API}" >> "$GITHUB_STEP_SUMMARY"
            echo "where=ok" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::**갈라 내지 못했다** — 응답을 못 받은 자리가 있다. 위 네 줄을 그대로 본다"
            echo "404 의 자리: **못 갈랐다**" >> "$GITHUB_STEP_SUMMARY"
            echo "where=unknown" >> "$GITHUB_OUTPUT"
          fi

      # ★★★ **라우트가 앱을 거쳐 닿는지 잰다** 〈2026-08-23 · M-11 · M-12〉.
      #
      #   이 검사를 **만들어 두고 아무도 안 돌렸다.** 2026-08-18 에 본체가 라우팅
      #   표를 손으로 옮기다 **11개를 빠뜨려 404** 가 났고(M-11), 그것을 잡으라고
      #   `verify:nas` 를 만들었다(M-12). 그런데 사람이 손으로 쳐야 도는 것이라
      #   **아무도 안 쳤고**, 2026-08-23 에 같은 종류가 다시 났다 —
      #   「＋ 신규프로젝트 → 만들기」가 `POST /projects` 에서 404.
      #
      #   ★ 그래서 **배포 때마다 자동으로** 스물여덟을 전부 두드린다. 판정은
      #     「404 냐 아니냐」다 — 401·400 은 길이 있다는 뜻이므로 통과다.
      #   ★ **못 쟀으면 초록으로 끝내지 않는다** (종료코드 2). 「초록인데 안 잰
      #     것」이 이 저장소에서 가장 비싼 상태다.
      - name: Check routes (M-11 · M-12)
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        env:
          LP_BASE: ${{ secrets.LP_BASE }}
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          # ★★★ 앞 단계가 갈라 놓은 판정을 받는다 〈2026-08-23 · 실행 #57〉
          WHERE: ${{ steps.split.outputs.where }}
        run: |
          set -uo pipefail
          if [ -n "${LP_BASE:-}" ]; then
            BASE="$LP_BASE"; VIA="LP_BASE (앱이 쓰는 길)"
          else
            BASE="http://${NAS_HOST}"; VIA="tailnet 포트 80 — LP_BASE 가 없어 대신 쟀다"
          fi
          echo "라우트를 잰 길: ${VIA}"
          set +e
          npm run --silent verify:nas -- --base "$BASE"
          CODE=$?
          set -e
          if [ "$CODE" = "0" ]; then
            echo "라우트 확인: 스물여덟 모두 닿았다 (${VIA})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$CODE" = "2" ]; then
            echo "::warning::라우트를 **다 못 쟀다** — 위 표의 ⚠️ 줄을 본다. 잰 길: ${VIA}. LP_BASE 를 넣으면 앱이 쓰는 길로 잰다."
            echo "라우트 확인: 다 못 쟀다 (${VIA})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # ★★★ **잰 길이 앱이 쓰는 길이 아니면 빨갛게 끝내지 않는다** 〈2026-08-23 · 실행 #57〉.
          #
          #   앞 단계가 갈라 놓은 결과가 실측으로 이렇게 나왔다:
          #     엔진 직행 8181  /api/linkpilot/intake → **200**
          #     바깥 포트 80    /api/linkpilot/intake → 404
          #   즉 **엔진에는 길이 있다.** 404 는 앞단(포트 80 가상호스트)이 그 길을
          #   8181 로 안 넘겨서 나는 것이고, 앱은 Funnel 443 으로 들어온다.
          #
          #   ★ 그러면 여기서 빨갛게 끝내는 것은 **멀쩡한 배포를 늘 빨갛게 만드는
          #     것**이다. 그리고 늘 빨가면 **빨간 것을 아무도 안 보게 된다** —
          #     `verify-served.sh` 가 HTTP 경고를 두고 똑같이 적어 둔 그 이유다 (M-25).
          #   ★ **조용히 넘어가는 것이 아니다.** 경고로 크게 적고 요약에도 남긴다.
          #     그리고 **엔진 자리(`engine`)면 그대로 치명이다** — 거기서 무르면
          #     이 단계가 있으나 마나가 된다.
          if [ "${WHERE:-}" = "front" ] && [ -z "${LP_BASE:-}" ]; then
            echo "::warning::**라우트 404 는 앞단에서 난다 — 엔진이 아니다.** 바로 위 갈라 재기에서 엔진(8181)은 이 길에 정상으로 답했다. 잰 길(${VIA})이 앱이 쓰는 길(Funnel 443)과 달라서 나는 404 다. **LP_BASE 를 넣으면 앱이 쓰는 길로 재서 이 경고가 사라진다.** 여기서 빨갛게 끝내면 멀쩡한 배포가 늘 빨갛고, 그러면 진짜 사고가 났을 때도 안 보인다 (M-25)."
            echo "라우트 확인: **앞단에서 404** — 엔진은 정상. LP_BASE 를 넣으면 갈린다" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::**라우트가 404 다.** 화면은 올라갔고(위 Verify deployed 초록) 서버가 **옛 라우팅 표**를 들고 있다 — 화면에서는 「서버 오류 (404)」로만 보인다 (M-11 · D-87). ★ 바로 위 「Split inside vs outside」 가 **404 의 자리를 이름으로 적어 두었다** — 그것부터 본다. `엔진` 이면 저장소 쪽 일이고, `접두사` 면 앞단 규칙이 어긋난 것이다."
          echo "라우트 확인: 404 있음 (${VIA}) — **화면 올리기는 성공했다.** 404 의 자리는 위 갈라 재기를 본다" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # ★★ **라우트가 빨개도 이 줄은 남는다** 〈2026-08-23〉. 앞 판은 앞 단계가
      #   죽으면 이 요약이 건너뛰어져 **「올리기가 됐는지」가 통째로 사라졌다** —
      #   그러면 화면 배포까지 실패한 줄로 읽힌다. 둘은 다른 사실이다.
      # ★★★ **자료를 읽는 힘이 켜져 있는가** 〈2026-08-23 · 사장님 화면〉.
      #
      #   자료 11건 중 7건이 「못 읽었습니다 — GEMINI_API_KEY 가 필요합니다」로
      #   끝났다. 스캔 이미지와, 글자가 코드값으로만 든 PDF 둘이 거기 있었다 —
      #   **딜의 핵심 자료가 그쪽이었다.**
      #
      #   ★ 배포는 초록이고 화면도 멀쩡하다. 빠진 것은 **품질**뿐이라 아무도
      #     오류를 안 본다. 그래서 **배포할 때마다 이 자리에서 말한다.**
      #   ★ 키 값은 절대 찍지 않는다 (CLAUDE.md §2) — 켜졌는지만 본다.
      - name: Check reading power (OCR)
        if: ${{ always() && needs.plan.outputs.dry_run != 'true' }}
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
        run: |
          set -u
          set +e
          # ★★ **앞단이 아니라 엔진에 직접 묻는다** 〈2026-08-23 · 첫 판이 헛돌았다〉.
          #   tailnet 포트 80 은 `/api/linkpilot/*` 를 404 로 돌려준다(앞단이 안
          #   넘긴다 — D-87 에서 이미 확인한 것). 그래서 앞단으로 물으면
          #   **늘 「못 쟀다」**가 나오고, 이 확인은 있으나 마나가 된다.
          #   위 「Split inside vs outside」 가 쓰는 것과 **같은 길**을 쓴다.
          RAW=$(ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_deploy \
            "$NAS_USER@$NAS_HOST" \
            "curl -s -m 10 'http://127.0.0.1:8181/api/linkpilot/intake'" 2>/dev/null | tr -d '\r')
          case "$RAW" in
            *'"ocrReady":true'*)
              echo "OCR: 켜짐 — 스캔본·이미지·코드값 PDF 를 글자로 옮겨 읽는다" >> "$GITHUB_STEP_SUMMARY" ;;
            *'"ocrReady":false'*)
              echo "::warning::**OCR 이 꺼져 있다.** 스캔 이미지와 글자가 코드값으로만 든 PDF 는 **한 글자도 안 읽힌다** — 그 자료의 값은 보고서에 안 실리고, 재무 항목은 통상치로 대체된다. 엔진 루트의 .env 에 GEMINI_API_KEY 를 넣으면 켜진다."
              echo "OCR: **꺼짐** — 스캔본·이미지는 안 읽힌다" >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "OCR: 못 쟀다 (앞단이 /intake 를 안 넘겨준다 — 엔진 문제가 아니다)" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Probe summary
        if: ${{ always() && needs.plan.outputs.dry_run != 'true' }}
        run: |
          echo "::notice::**올리고 재는 것까지 끝났다.** 「Verify deployed」 의 저장소·디스크가 같아야 실제로 닿은 것이다. HTTP 가 다르다는 경고는 잰 길(포트 80)이 앱이 쓰는 길(Funnel 443)과 달라서일 수 있다 — 원인 후보 셋이 로그에 적혀 있다 (M-25)."

      - name: Dry run summary
        if: ${{ needs.plan.outputs.dry_run == 'true' }}
        run: |
          echo "::warning::**아무것도 재지 않았다 (DRY RUN).** Secret 이 들어왔는지만 봤다 — NAS 에는 닿지도 않았다. 실제로 재려면 dry_run 을 끄고 다시 실행한다"

  # 배포가 실패하면 알린다 (CLAUDE.md §2 — 조용히 죽지 않는다)
  # ★★ **guard 를 여기 적는 것이 핵심이다** 〈2026-08-23〉. `needs: deploy` 만
  #   두면, guard 가 빨간 날에는 deploy 가 **실패가 아니라 건너뜀**이 되고
  #   알림도 함께 조용히 사라진다 — 「검사가 막아 줬다」가 **아무한테도 안 간다**.
  #   실패 알림 경로는 언제나 살아 있어야 한다 (CLAUDE.md §2).
  alert:
    needs: [plan, guard, deploy]
    if: failure()
    uses: ./.github/workflows/alert-failure.yml
    permissions:
      issues: write
      contents: read
    secrets: inherit
    with:
      workflow: deploy-nas
