# 쇼츠 목소리·영상 진단 — Gemini 음성(무료 열쇠 묶음) · Typecast(STUDIO_TYPECAST_AI) + FFmpeg 9:16 묶기 〈2026-10-28 사장님: 「Gemini 음성으로」〉
#
# 열쇠가 있는 자리에서 부르고 «요약만 커밋»한다. 소리·영상 파일은 아티팩트로만 남긴다(저장소가 공개라 커지지 않게).
# 결과는 data/_shorts/probe/_summary.md 첫 줄의 판정이다. 스크립트가 결과에 열쇠 값이 섞였는지 세고, 걸리면 안 쓴다 (CLAUDE.md §2).

name: 쇼츠 목소리 진단 (Gemini 음성)

on:
  workflow_dispatch:
    inputs:
      text:
        description: 읽을 글 (비우면 시험 문장)
        required: false
      voice:
        description: 목소리 이름 (Gemini 기본 목소리 · 예 Kore)
        required: false
        default: Kore

permissions:
  contents: write

concurrency:
  group: shorts-voice
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: FFmpeg 를 갖춘다
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Gemini 음성으로 읽고 9:16 으로 묶는다
        id: voice
        continue-on-error: true
        env:
          IN_TEXT: ${{ inputs.text }}
          IN_VOICE: ${{ inputs.voice }}
          STUDIO_TYPECAST_AI: ${{ secrets.STUDIO_TYPECAST_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_KEY_01: ${{ secrets.GEMINI_KEY_01 }}
          GEMINI_KEY_02: ${{ secrets.GEMINI_KEY_02 }}
          GEMINI_KEY_03: ${{ secrets.GEMINI_KEY_03 }}
          GEMINI_KEY_04: ${{ secrets.GEMINI_KEY_04 }}
          GEMINI_KEY_05: ${{ secrets.GEMINI_KEY_05 }}
          GEMINI_KEY_06: ${{ secrets.GEMINI_KEY_06 }}
          GEMINI_KEY_07: ${{ secrets.GEMINI_KEY_07 }}
          GEMINI_KEY_08: ${{ secrets.GEMINI_KEY_08 }}
        run: |
          set -- --voice "${IN_VOICE:-Kore}"
          [ -n "$IN_TEXT" ] && set -- "$@" --text "$IN_TEXT"
          node scripts/shorts-voice.mjs "$@"
      - name: 요약만 커밋한다
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -u
          [ -f data/_shorts/probe/_summary.md ] || { echo "요약이 없다"; exit 0; }
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then echo "가지 '$REF_NAME' — 커밋하지 않는다(아티팩트로 받는다)"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_shorts/probe/_summary.md data/_shorts/probe/result.json
          git diff --staged --quiet || git commit -m "쇼츠 목소리 진단 ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            if git pull --rebase -q origin "$DEFAULT_BRANCH" && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep 5
          done
          echo "::error::세 번 다 main 에 못 올렸다 — 결과는 아래 아티팩트에 있다"; exit 1
      - name: 아티팩트 업로드 (소리·영상)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: shorts-voice
          path: data/_shorts/probe
          if-no-files-found: ignore
      - name: 판정
        if: always()
        run: |
          head -4 data/_shorts/probe/_summary.md 2>/dev/null || true
          [ "${{ steps.voice.outcome }}" = "success" ] || { echo "::error::목소리나 영상을 못 만들었다 — 위 _summary.md 의 판정 줄을 본다"; exit 1; }
