name: 해외 국가 개황 주간 수집

# 외교부 국가·지역별 정치현황 + KOTRA 국가정보를 받아 data/country/latest.json 으로 남긴다 (D-442).
# ★ 시각은 UTC 다 — 월 09:43 KST = 월 00:43 UTC (CLAUDE.md §2).
# ★ 데이터 열쇠만 넣는다 — 접속 자격증명은 안 넣는다 (규정집 2-8).

on:
  schedule:
    - cron: '43 0 1 * *'          # 매달 1일 09:43 KST · 2026-10-22 사장님: 한 달에 한 번
  workflow_dispatch:
    inputs:
      countries:
        description: '나라 ISO 2자리, 쉼표로 (비우면 기본 목록)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 국가 개황 조회
        id: fetch
        env:
          KOICA_GLOBAL_POLITICAL_DEVELOPMENTS: ${{ secrets.KOICA_GLOBAL_POLITICAL_DEVELOPMENTS }}
          KOICA_COUNTRY_INFORMATION: ${{ secrets.KOICA_COUNTRY_INFORMATION }}
          MOFA_RELATIONS_WITH_KOREA_BY_COUNTRY: ${{ secrets.MOFA_RELATIONS_WITH_KOREA_BY_COUNTRY }}
          KSURE_COUNTRY_LIST: ${{ secrets.KSURE_COUNTRY_LIST }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          COUNTRIES: ${{ github.event.inputs.countries || '' }}
        continue-on-error: true
        run: |
          set +e
          node scripts/country-fetch.mjs 2>&1 | tee /tmp/country.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          { echo '### 해외 국가 개황'; head -1 data/country/_summary.md 2>/dev/null || echo '(요약 없음)'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: 결과 커밋
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -u
          if [ -z "${DEFAULT_BRANCH:-}" ]; then
            echo "::warning::기본 가지 이름을 못 받았다 — 커밋하지 않는다. 결과는 아래 아티팩트에 있다"
            exit 0
          fi
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "가지 '$REF_NAME' 에서 돌았다 — **결과를 커밋하지 않는다.**"
            echo "  까닭: 열려 있는 PR 의 머리가 움직이면 검사가 다시 선다."
            echo "  받을 곳: 아래 «아티팩트 업로드» 아티팩트 (country) — 요약과 자료가 그대로 들어 있다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/country
          git diff --staged --quiet || git commit -m "해외 국가 개황 갱신 ($(date -u +%Y-%m-%d))"
          git pull --rebase -q origin "$DEFAULT_BRANCH" || true
          git push

      - name: 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: country
          path: data/country

      - name: 판정
        if: always()
        env:
          CODE: ${{ steps.fetch.outputs.code }}
        run: |
          echo "국가 개황 조회 값: ${CODE:-못 받음}"
          [ "${CODE:-2}" = "0" ] || exit 1
