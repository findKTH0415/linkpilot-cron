# Figma 가 막히면 구글 제미나이로 그림을 짓는다 — 열쇠가 있는 자리에서 부르고 **그림만 커밋**한다
# 〈2026-10-26 사장님: 「이미지, 도표, 조감도등등 위해 작업시 Figma 소진되면 자동으로 구글 제미나이로 변경해서 작업이 되도록」〉
#
# 도식·도표 = 제미나이 글 모델이 SVG 를 짓는다(무료 열쇠로 돈다) · 사진형·조감도 = 그림 모델(무료 한도 0 — 결제 연결 필요).
# 결과는 data/_figures/ 에 남고 _summary.md 첫 줄이 판정이다. 문서에 싣기 전에 사람이 눈으로 본다.
# 이 저장소는 공개다 — 스크립트가 결과에 열쇠 값이 섞였는지 세고, 걸리면 안 쓴다 (CLAUDE.md §2).

name: 제미나이 그림 (Figma 대신)

on:
  workflow_dispatch:
    inputs:
      name:
        description: 파일 이름 (영문·한글·숫자·_-)
        required: true
      kind:
        description: diagram(도식) · chart(도표) · image(사진형) · aerial(조감도)
        required: true
        default: diagram
      brief:
        description: 무엇을 그리나 — 숫자·이름은 여기 적은 것만 쓴다
        required: true
      size:
        description: 가로x세로 (예 1600x900)
        required: false
        default: 1600x900

permissions:
  contents: write

concurrency:
  group: figure-gemini
  cancel-in-progress: false

jobs:
  figure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 제미나이로 그린다
        id: draw
        continue-on-error: true
        env:
          IN_NAME: ${{ inputs.name }}
          IN_KIND: ${{ inputs.kind }}
          IN_BRIEF: ${{ inputs.brief }}
          IN_SIZE: ${{ inputs.size }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_KEY_01: ${{ secrets.GEMINI_KEY_01 }}
          GEMINI_KEY_02: ${{ secrets.GEMINI_KEY_02 }}
          GEMINI_KEY_03: ${{ secrets.GEMINI_KEY_03 }}
          GEMINI_KEY_04: ${{ secrets.GEMINI_KEY_04 }}
          GEMINI_KEY_05: ${{ secrets.GEMINI_KEY_05 }}
          GEMINI_KEY_06: ${{ secrets.GEMINI_KEY_06 }}
          GEMINI_KEY_07: ${{ secrets.GEMINI_KEY_07 }}
          GEMINI_KEY_08: ${{ secrets.GEMINI_KEY_08 }}
        run: |
          W="${IN_SIZE%x*}"; H="${IN_SIZE#*x}"
          node scripts/gemini-figure.mjs --name "$IN_NAME" --kind "$IN_KIND" --brief "$IN_BRIEF" --w "$W" --h "$H"
      - name: 그림만 커밋한다
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -u
          [ -d data/_figures ] || { echo "그린 것이 없다"; exit 0; }
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then echo "가지 '$REF_NAME' — 커밋하지 않는다(아티팩트로 받는다)"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_figures
          git diff --staged --quiet || git commit -m "제미나이 그림 — ${{ inputs.name }} ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            if git pull --rebase -q origin "$DEFAULT_BRANCH" && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep 5
          done
          echo "::error::세 번 다 main 에 못 올렸다 — 결과는 아래 아티팩트에 있다"; exit 1
      - name: 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: figure-gemini
          path: data/_figures
          if-no-files-found: ignore
      - name: 판정
        if: always()
        run: |
          head -6 data/_figures/_summary.md 2>/dev/null || true
          [ "${{ steps.draw.outcome }}" = "success" ] || { echo "::error::그림을 못 지었다 — 위 _summary.md 의 판정 줄을 본다"; exit 1; }
