name: 특일정보 수집 (음력 명절·24절기)

# 〈2026-09-12 사장님 지시: 「특일정보 API 를 붙여라」 · D-206 결정〉
#
# 한국천문연구원 특일정보(data.go.kr B090041)로 공휴일·24절기·잡절·기념일을 받아
# data/_calendar/ 에 커밋한다. **열쇠는 저장소 밖으로 나가지 않고 결과 파일만 남는다.**
#
# ★ 왜 이렇게 하나 — 설날·추석은 음력이라 양력 날짜가 해마다 다르다. 앞 판은 그것을
#   화면 안에 **손으로 적은 표**로 들고 있었고 세 해만 덮었다. 표에 없는 해가 오면
#   명절이 **아무 오류 없이 사라진다**.
#
# ★★ 이 잡에는 **접속 자격증명을 넣지 않는다** — 데이터 열쇠 하나뿐이다
#   (규정집 2-8 · CLAUDE.md §4). NAS SSH·터널 키는 배포 잡에만 넣는다.
#
# ★★★ **고친 뒤에 `Re-run` 을 누르지 않는다** (CLAUDE.md §4). GitHub 의 재실행은
#   그 실행이 썼던 커밋의 코드를 그대로 다시 돌린다 — 옛 코드로 돌아 같은 실패가
#   반복된다. `Actions` 목록에서 **[Run workflow]** 로 새로 건다.

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: "시작 연도 (비우면 올해)"
        required: false
      to_year:
        description: "끝 연도 (비우면 시작+4년)"
        required: false
  schedule:
    # 해가 바뀌기 전에 한 번 — 1월 2일 00:10 KST = 12월 31일 15:10 UTC
    # ★ UTC 로 적는다. KST/UTC 변환은 이 저장소의 1순위 사고 원인이다 (CLAUDE.md §2).
    - cron: '10 15 31 12 *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'   # NAS 가 v20 이다. 여기서만 새 것을 쓰지 않는다

      - name: 특일정보 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          FROM="${{ github.event.inputs.from_year }}"
          TO="${{ github.event.inputs.to_year }}"
          node im-agent/tools/calendar-fetch.js $FROM $TO
          echo "──────── 요약 ────────"
          cat data/_calendar/_summary.md || echo "(요약이 없다)"

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_calendar
          # ★ 바뀐 것이 없으면 빈 커밋을 만들지 않는다 — 빈 커밋은 배포를 헛돌린다
          git diff --cached --quiet && { echo "바뀐 것이 없다 — 커밋하지 않는다"; exit 0; }
          git commit -m "특일정보 수집 — data/_calendar 갱신

          한국천문연구원 특일정보(data.go.kr)에서 받았다. 손으로 고치지 않는다.
          경위는 CLAUDE.md §4 · D-206."
          git push

      # ★ 실패해도 올린다 — 진단 요약(_summary.md)이 **실패했을 때 가장 필요하다**.
      #   왜 못 받았는지가 그 파일에만 남는다 (승인 전인지·키 형식인지·한도인지).
      - name: 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: calendar-data
          path: data/_calendar
