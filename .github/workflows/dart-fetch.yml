name: DART 기업조회

on:
  workflow_dispatch:
    inputs:
      companies:
        description: '조회할 회사명 (쉼표 구분)'
        required: true
        default: '서영엔지니어링, 엔와이컴퓨터, 케이원정보통신, 키예노, 월드케이팝센터, 에듀포레, 솔리덴, 미주건설'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: DART 조회
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          IFS=',' read -ra ARR <<< "${{ inputs.companies }}"
          ARGS=()
          for c in "${ARR[@]}"; do ARGS+=("$(echo "$c" | xargs)"); done
          node scripts/dart-fetch.mjs "${ARGS[@]}"

      - name: 결과 커밋
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -u
          if [ -z "${DEFAULT_BRANCH:-}" ]; then
            echo "::warning::기본 가지 이름을 못 받았다 — 커밋하지 않는다. 결과는 아래 아티팩트에 있다"
            exit 0
          fi
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "가지 '$REF_NAME' 에서 돌았다 — **결과를 커밋하지 않는다.**"
            echo "  까닭: 열려 있는 PR 의 머리가 움직이면 검사가 다시 서고, 봇이 민 커밋은"
            echo "        사람이 눌러 줘야 도는 상태(action_required)가 된다."
            echo "  받을 곳: 아래 «아티팩트 업로드» 아티팩트 (dart-data) — 요약과 자료가 그대로 들어 있다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dart
          git diff --staged --quiet || git commit -m "DART 조회 결과 갱신 ($(date +%Y-%m-%d))"
          git push

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v5
        with:
          name: dart-data
          path: data/dart
