name: 여의동 893 공공데이터 수집

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 실거래·브이월드 수집
        id: fetch
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}        # 도메인 등록형 — 둘을 함께 주입
          VWORLD_DOMAIN: ${{ secrets.VWORLD_DOMAIN }}
          LINKPILOT_VWORLD_REPORT_KEY: ${{ secrets.LINKPILOT_VWORLD_REPORT_KEY }}   # 커넥터가 VWORLD_KEY 다음 순서로 읽는다
          LINKPILOT_VWORLD_WEB_KEY:    ${{ secrets.LINKPILOT_VWORLD_WEB_KEY }}
        run: |
          set -o pipefail
          set +e
          node scripts/yeoui893-fetch.mjs 2>&1 | tee "$RUNNER_TEMP/y.log"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          { echo "### 여의동 893 수집 판정"; tail -25 "$RUNNER_TEMP/y.log"; } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: 결과 커밋(기본 가지만)
        if: always() && github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yeoui893
          git diff --staged --quiet || git commit -m "여의동 893 수집 ($(date +%Y-%m-%d))"
          git push

      - name: 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: yeoui893
          path: data/yeoui893

      - name: 판정으로 끝내기
        if: always()
        run: |
          C="${{ steps.fetch.outputs.code }}"
          [ "$C" = "0" ] && exit 0
          echo "::warning::판정 $C — _summary.md 확인"; [ "$C" = "1" ] && exit 0 || exit 1
