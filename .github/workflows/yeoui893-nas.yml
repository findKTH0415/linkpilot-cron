name: 여의동 893 브이월드 수집 (NAS 경유)

# 왜 NAS 를 거치나 — GitHub 러너(해외 IP)에서 브이월드가 지오코더·이미지·WMS 전부를
# 「502 Bad Gateway」 한 줄로 끊는다(2026-09-18·19, 키·도메인 문제 아님 — vworld_diag.json).
# NAS 는 국내 IP 이고, 브이월드 콘솔 서비스URL 의 호스트다.
# 접속 방식은 deploy-nas.yml 과 같다: Tailscale(OAuth 또는 auth key) → ssh.
# NAS 에는 아무것도 설치·저장하지 않는다. NAS 의 curl 로 부르기만 한다.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 열쇠 확인 (값은 찍지 않는다)
        id: ts
        env:
          OAUTH_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          OAUTH_SEC: ${{ secrets.TS_OAUTH_SECRET }}
          AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
          NAS_KEY: ${{ secrets.NAS_SSH_KEY }}
          VW_KEY: ${{ secrets.LINKPILOT_VWORLD_WEB_KEY }}
          VW_DOMAIN: ${{ secrets.VWORLD_DOMAIN }}
        run: |
          set -uo pipefail
          for v in NAS_HOST NAS_USER NAS_KEY VW_KEY VW_DOMAIN; do
            [ -n "${!v:-}" ] && echo "  있음 — $v" || { echo "::error::없음 — $v"; exit 1; }
          done
          if [ -n "${OAUTH_ID:-}" ] && [ -n "${OAUTH_SEC:-}" ]; then echo "mode=oauth" >> "$GITHUB_OUTPUT"
          elif [ -n "${AUTHKEY:-}" ]; then echo "mode=authkey" >> "$GITHUB_OUTPUT"
          else echo "::error::tailnet 열쇠 없음 — TS_OAUTH_CLIENT_ID+TS_OAUTH_SECRET 또는 TS_AUTHKEY"; exit 1; fi

      - name: Tailscale 접속 (OAuth)
        if: ${{ steps.ts.outputs.mode == 'oauth' }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Tailscale 접속 (auth key)
        if: ${{ steps.ts.outputs.mode == 'authkey' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: NAS ssh 연결과 브이월드 도달 확인
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
          NAS_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          set -euo pipefail
          tailscale status --json >/dev/null 2>&1 || { echo "::error::tailnet 에 안 붙었다"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$NAS_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$NAS_HOST" >> ~/.ssh/known_hosts 2>/dev/null \
            || { echo "::error::NAS 호스트키를 못 받았다 — NAS 전원·Tailscale 연결·NAS_SSH_HOST(tailnet 주소) 확인"; exit 1; }
          OUT=$(ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_deploy "$NAS_USER@$NAS_HOST" \
            'command -v curl >/dev/null && echo CURL_OK || echo NO_CURL; curl -sS -o /dev/null -m 20 -w "VW=%{http_code}" https://api.vworld.kr/ 2>&1 || true')
          echo "NAS 응답: $OUT"
          case "$OUT" in *NO_CURL*) echo "::error::NAS 에 curl 이 없다"; exit 1 ;; esac
          case "$OUT" in *VW=000*) echo "::warning::NAS 에서도 api.vworld.kr 에 못 닿았다 — 아래 수집 결과로 확정" ;; esac
          echo "NAS_KEY_FILE=$HOME/.ssh/id_deploy" >> "$GITHUB_ENV"

      - name: 브이월드 수집 (NAS 경유)
        id: fetch
        env:
          SKIP_TRADE: '1'
          VW_VIA: nas
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
          VWORLD_KEY: ${{ secrets.LINKPILOT_VWORLD_WEB_KEY }}
          VWORLD_DOMAIN: ${{ secrets.VWORLD_DOMAIN }}
        run: |
          set -o pipefail
          set +e
          node scripts/yeoui893-fetch.mjs 2>&1 | tee "$RUNNER_TEMP/y.log"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          { echo "### 여의동 893 브이월드 (NAS 경유)"; tail -30 "$RUNNER_TEMP/y.log"; } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: 결과 커밋(기본 가지만)
        if: always() && github.ref_name == github.event.repository.default_branch
        run: |
          rm -f ~/.ssh/id_deploy
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yeoui893
          git diff --staged --quiet || git commit -m "여의동 893 브이월드 NAS 경유 수집 ($(date +%Y-%m-%d))"
          git pull --rebase -q && git push

      - name: 판정으로 끝내기
        if: always()
        run: |
          C="${{ steps.fetch.outputs.code }}"
          [ "$C" = "0" ] && exit 0
          echo "::warning::판정 $C — data/yeoui893/_summary.md 와 vworld_diag.json 확인"; [ "$C" = "1" ] && exit 0 || exit 1
