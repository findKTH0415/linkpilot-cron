<title>보고서 생성 · LINKPILOT</title>
<!--
  보고서 생성 — 사이드바 '유료 멤버십' 섹션. 유료 회원에게만 노출된다.

  ★ 순서를 강제한다: 출력 사양 확정(LOCK) → 생성
    사양을 먼저 못 박지 않으면 AI 가 페이지 수·형식·언어를 임의로 정한다.
    40페이지를 기대했는데 12페이지가 나오면 처음부터 다시 만들어야 한다.
    그래서 사양이 잠기기 전에는 생성 버튼이 눌리지 않는다.

  ★★ 이 화면은 무엇을 그릴지만 정한다. 권한을 강제하지 않는다.
    생성 API 가 서버에서 세션·플랜을 다시 확인해야 한다.
    화면만 열리고 생성은 거부되어야 정상이다.

  접근 판정은 gate-core.js 하나를 쓴다 (모든 유료 화면 공용, 테스트 있음).
-->
<link rel="stylesheet" href="tokens.css">
<style>
:root {
  --side: 248px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.55 var(--lp-font);
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
.app { display: flex; min-height: 100%; }

/* 사이드바 */
.side { width: var(--side); flex: none; background: var(--surface);
  border-right: 1px solid var(--line); padding: 18px 12px 24px;
  display: flex; flex-direction: column; gap: 4px; }
.side__brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 12px; }
.side__mark { width: 34px; height: 34px; border-radius: 50%; flex: none;
  border: 2.5px solid var(--ink); display: grid; place-items: center;
  color: var(--lime); font-size: 15px; }
.side__name { font-size: 15px; font-weight: 800; }
.side__user { font-size: 12px; color: var(--ink2); }
.side__group { margin: 14px 8px 6px; font-size: 12px; font-weight: 700; color: var(--ink2); }
.nav { display: flex; align-items: center; gap: 11px; padding: 10px 12px;
  border-radius: 12px; text-decoration: none; color: var(--ink); font-size: 14.5px; }
.nav:hover { background: var(--panel); }
.nav.on { background: var(--lime-soft); color: var(--lime-deep); font-weight: 700; }
.nav.lock { color: var(--ink2); }
.nav__ic { width: 20px; text-align: center; font-size: 15px; opacity: .8; }
.nav__lk { margin-left: auto; font-size: 11px; }

/* 본문 */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 16px 26px; display: flex; align-items: center; }
.logo { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 900; }
.logo em { font-style: normal; color: var(--lime); }
.logo__mark { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--ink);
  display: grid; place-items: center; color: var(--lime); font-size: 16px; }
.head { background: var(--surface); padding: 16px 26px 14px; }
.head__row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.head__ic { width: 40px; height: 40px; border-radius: 12px; background: var(--panel);
  display: grid; place-items: center; font-size: 18px; }
.head__t { font-size: 22px; font-weight: 800; }
.head__meta { margin-left: auto; text-align: right; font-size: 13px; color: var(--ink2); }
.head__meta b { display: block; color: var(--ink); font-weight: 700; margin-top: 2px; }
.rule { height: 3px; background: var(--lime); }
.body { padding: 20px 26px 96px; max-width: 1080px; }

/* 게이트 */
.gate { max-width: 560px; margin: 60px auto; background: var(--surface);
  border-radius: var(--r); padding: 40px 32px; text-align: center; }
.gate__ic { font-size: 40px; line-height: 1; }
.gate__t { font-size: 21px; font-weight: 800; margin-top: 18px; }
.gate__b { font-size: 14.5px; color: var(--ink2); margin-top: 12px; line-height: 1.7; }
.gate__cta { display: inline-block; margin-top: 24px; padding: 14px 32px;
  font-weight: 700; font-size: 15px; line-height: 1; font-family: inherit; border: 0; border-radius: 12px;
  background: var(--lime); color: var(--ink); cursor: pointer; }
.gate__cta:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.gate__fine { font-size: 12.5px; color: var(--ink2); margin-top: 16px; }

/* 단계 */
.steps { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; padding: 9px 14px;
  border-radius: 999px; background: var(--panel); color: var(--ink2); font-size: 13px; font-weight: 600; }
.step.on { background: var(--ink); color: #fff; }
.step.done { background: var(--lime-soft); color: var(--lime-deep); }
.step__n { width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(0,0,0,.09); font-size: 11px; font-weight: 800; }
.step.on .step__n { background: rgba(255,255,255,.22); }

.card { background: var(--surface); border-radius: var(--r); padding: 22px; margin-bottom: 16px; }
.card__t { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
.card__s { font-size: 13px; color: var(--ink2); margin: 0 0 16px; }

.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.f { display: flex; flex-direction: column; gap: 6px; }
.f label { font-size: 12.5px; font-weight: 700; color: var(--ink2); }
.f select, .f input { font-weight: 400; font-size: 14px; line-height: 1.5; font-family: inherit; padding: 11px 13px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
.f select:disabled, .f input:disabled { background: var(--panel); color: var(--ink2); }

/* 보고서 종류 */
.kinds { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.kind { text-align: left; background: var(--panel); border: 2px solid transparent;
  border-radius: 14px; padding: 15px; cursor: pointer; font: inherit; color: inherit; }
.kind:hover { border-color: var(--line); }
.kind.on { border-color: var(--lime); background: var(--lime-soft); }
.kind:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.kind__n { font-size: 14px; font-weight: 700; }
.kind__d { font-size: 12px; color: var(--ink2); margin-top: 5px; line-height: 1.5; }
.kind__m { font-size: 11.5px; color: var(--lime-deep); font-weight: 700; margin-top: 7px; }

/* 테마 */
.themes { display: flex; gap: 8px; flex-wrap: wrap; }
.theme { display: flex; align-items: center; gap: 8px; padding: 9px 13px; border-radius: 10px;
  border: 2px solid transparent; background: var(--panel); cursor: pointer; font-weight: 600; font-size: 13px; line-height: 1; font-family: inherit; }
.theme.on { border-color: var(--lime); background: var(--lime-soft); }
.theme__sw { width: 15px; height: 15px; border-radius: 4px; flex: none; }

.lockbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 18px;
  padding-top: 18px; border-top: 1px solid var(--line); }
.btn { padding: 13px 26px; font-weight: 700; font-size: 14.5px; line-height: 1; font-family: inherit; border: 0; border-radius: 12px;
  background: var(--lime); color: var(--ink); cursor: pointer; }
.btn:disabled { background: var(--panel); color: var(--ink2); cursor: not-allowed; }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn--ghost { background: var(--surface); border: 1px solid var(--line); color: var(--ink2); }
.why { font-size: 13px; color: var(--warn-ink); }

.locked { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-radius: 12px;
  background: var(--lime-soft); font-size: 13.5px; font-weight: 600; color: var(--lime-deep); }
/* 제작 진행 — 생성 클릭 뒤 그 자리에서 */
.live__h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.live__st { font-weight: 700; font-size: 12px; line-height: 1; font-family: inherit; padding: 6px 10px; border-radius: 999px;
  background: var(--panel); color: var(--ink2); }
.live__st--running { background: var(--lime-soft); color: var(--lime-deep); }
.live__st--queued { background: var(--panel); color: var(--ink2); }
.live__st--done { background: var(--lime); color: var(--ink); }
.live__st--failed, .live__st--unknown { background: var(--bad-soft); color: var(--bad-ink); }

.live__meter { display: flex; align-items: center; gap: 12px; margin: 12px 0 4px; }
.live__bar { flex: 1; height: 10px; border-radius: 999px; background: var(--panel); overflow: hidden; }
.live__fill { height: 100%; background: var(--lime); transition: width .3s; }
.live__pct { font-weight: 800; font-size: 14px; line-height: 1; font-family: inherit; font-variant-numeric: tabular-nums; }
.live__meta { font-size: 12.5px; color: var(--ink2); }

.live__ph { display: grid; gap: 7px; margin-top: 14px; }
.live__p { display: flex; align-items: flex-start; gap: 11px; padding: 11px 13px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.live__p.on { border-color: var(--lime); background: var(--lime-soft); }
.live__p--warn { border-color: #F0DEBE; background: var(--warn-soft); }
.live__p--bad { border-color: #F3D8D8; background: var(--bad-soft); }
.live__n { width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--ink);
  color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 11.5px; line-height: 1; font-family: inherit; }
.live__b { flex: 1; min-width: 0; }
.live__t { font-size: 13.5px; font-weight: 700; }
.live__w { font-size: 12.5px; color: var(--ink2); margin-top: 2px; line-height: 1.5; }
.live__c { font-weight: 700; font-size: 12px; line-height: 1.6; font-family: inherit; color: var(--ink2); white-space: nowrap; }

.live__log { margin-top: 14px; padding: 11px 13px; background: var(--panel);
  border-radius: 10px; display: grid; gap: 4px; max-height: 220px; overflow-y: auto; }
.live__ln { font: 400 12.5px/1.6 ui-monospace, Menlo, Consolas, monospace; color: var(--ink2);
  display: flex; gap: 9px; }
.live__ln.warn { color: var(--warn-ink); }
.live__ln.bad { color: var(--bad-ink); font-weight: 600; }
.live__at { flex: none; opacity: .7; }

.note { padding: 13px 16px; border-radius: 12px; font-size: 13.5px;
  background: var(--warn-soft); color: var(--warn-ink); margin-top: 14px; }
.note--bad { background: var(--bad-soft); color: var(--bad-ink); }

/* 산출물 */
.out { display: flex; align-items: center; gap: 12px; padding: 13px 0;
  border-top: 1px solid var(--line); }
.out:first-of-type { border-top: 0; }
.out__ic { width: 34px; height: 34px; border-radius: 9px; background: var(--panel);
  display: grid; place-items: center; font-size: 15px; flex: none; }
.out__n { font-size: 14px; font-weight: 600; }
.out__m { font-size: 12px; color: var(--ink2); margin-top: 2px; font-variant-numeric: tabular-nums; }
.out__a { margin-left: auto; font-weight: 600; font-size: 13px; line-height: 1; font-family: inherit; padding: 9px 15px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  text-decoration: none; }
.st { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.st--ok { background: var(--lime-soft); color: var(--lime-deep); }
.st--run { background: var(--warn-soft); color: var(--warn-ink); }
.st--blocked { background: var(--bad-soft); color: var(--bad-ink); }
.empty { font-size: 13.5px; color: var(--ink2); padding: 10px 0; }

/* 하단 탭 */
.bot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface);
  border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 9px 0 11px; }
.bot__i { text-align: center; font-size: 10.5px; color: var(--ink2); text-decoration: none; }
.bot__i b { display: block; font-size: 17px; line-height: 1.35; font-weight: 400; }
.bot__i.on { color: var(--lime-deep); font-weight: 700; }

@media (max-width: 900px) {
  .side { display: none; }
  .top, .head { padding-left: 16px; padding-right: 16px; }
  .body { padding: 16px 16px 96px; }
  .head__t { font-size: 19px; }
  .btn { width: 100%; }
  .lockbar { flex-direction: column; align-items: stretch; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* 시각자료 선택 */
.chk { display: inline-flex; align-items: center; gap: 9px; cursor: pointer;
  font-size: 14.5px; font-weight: 700; }
.chk input { width: 17px; height: 17px; accent-color: var(--lp-brand); cursor: pointer; }
.chk input:disabled { cursor: not-allowed; }
.chk__d { margin: 7px 0 0; font-size: 12.5px; color: var(--ink2); line-height: 1.65; max-width: 62ch; }
</style>
</head>

<!-- 부모(앱)가 채운 설정을 받아 병합한다. 단독으로 열면 아무 일도 하지 않는다 -->
<script src="embed-bridge.js" data-lp-global="LINKPILOT_REPORTS"></script>
<script>
/* ── 설정 ──────────────────────────────────────────────────────────
 * 서버가 로그인 세션을 보고 내려준다.
 *
 * ★★ session 은 화면 표시용이다. 실제 차단은 서버가 한다.
 *   생성 API 가 세션·플랜을 다시 확인하지 않으면, 사용자가 브라우저에서
 *   session.planId 를 고쳐 화면을 열 수 있다. 화면은 열려도 생성은 거부되어야 한다.
 * ───────────────────────────────────────────────────────────────── */
/**
 * ★ 앱이 미리 넣어 둔 설정이 **이깁니다.** 예전에는 이 블록이 그냥 덮어써서,
 *   호스트가 `window.LINKPILOT_REPORTS` 를 채워 놓아도 조용히 데모값으로
 *   되돌아갔다 — api 가 null 이 되어 "본체 API 에 연결하세요" 만 뜬다.
 *   아래는 **기본값**이고, 앱이 준 값이 그 위에 얹힌다.
 */
window.LINKPILOT_REPORTS = Object.assign({
  /* ★ 2026-08-16 표시용 이름 하드코딩 제거 — 앱 안에서 남의 이름이 보였다.
     부모가 세션을 넘길 때까지 비운다 */
  session: { authenticated: true, planId: 'pro', status: 'active', name: '' },
  requiredPlan: 'pro',
  planNames: { free: 'Free', basic: 'Basic', pro: 'Pro', business: 'Business' },

  api: null,   // 예: '/api/linkpilot'  — 없으면 아래 데모 데이터를 쓴다

  // 산출물 파일을 여는 주소를 만든다. 없으면 [인쇄 · PDF 저장]이 안내만 띄운다.
  // 예: function (projectId, rel) { return '/files/' + projectId + '/' + rel; }
  fileUrl: null,

  projects: [
    { id: 'LP-DC-2026-001', name: '인천 남동공단 6.5MW 데이터센터' },
    { id: 'LP-SL-2026-002', name: '새만금 태양광 120MW' },
  ],

  // 보고서 종류. minPlan 으로 종류별 플랜을 따로 걸 수 있다
  kinds: [
    { id: 'im', name: 'IM (투자설명서)', minPlan: 'pro',
      desc: '20개 절 · 모든 수치에 출처 표기 · 최종검증 8 GATE 통과 필요', pages: 40 },
    { id: 'teaser', name: 'Teaser', minPlan: 'pro',
      desc: '2~4페이지 요약본. 딜 개요와 핵심 지표만', pages: 3 },
    { id: 'summary', name: '요약 보고서', minPlan: 'pro',
      desc: '내부 검토용. 재무·리스크 요약', pages: 10 },
    // ★ 지침 §2 가 '보고서 생성 (Pro)' 이므로 검증 보고서만 위 등급으로 올리지 않는다
    { id: 'validation', name: '검증 보고서', minPlan: 'pro',
      desc: 'RED FLAG · 값 충돌 · 독립 재계산 결과', pages: 12 },
  ],

  themes: [
    { id: 'institutional', name: 'Institutional', color: '#16304F' },
    { id: 'modern', name: 'Modern', color: '#2E7D6B' },
    { id: 'pdi', name: 'PDI 하우스', color: '#C00000' },
  ],

  // ★ 만들 수 있는 형식만 고를 수 있다. 못 만드는 것은 이유와 함께 비활성으로 보여준다 —
  //   목록에서 아예 빼면 "왜 PDF가 없냐"고 묻고, 그냥 두면 골랐다가 안 나온다.

  function start(btn) {
    if (!C.api) {
      say('생성 요청은 본체 API 에 연결해야 합니다 (POST /projects/:id/reports). '
        + 'LINKPILOT_REPORTS.api 를 설정하면 이 버튼이 실제로 요청합니다.');
      return;
    }
    btn.disabled = true;
    btn.textContent = '요청 중…';
    call('POST', '/projects/' + encodeURIComponent(state.projectId) + '/reports', { docType: state.kindId })
      .then(function (j) {
        btn.textContent = '보고서 생성 시작';
        btn.disabled = false;
        // ★ 화면을 옮겨 가야 보이면 사람은 안 본다. 누른 자리에서 보여준다
        state.live = { run: j.run || null, snapshot: null, error: null, failures: 0, timer: null };
        draw();
        poll();
        loadReports();
      })
      .catch(function (e) {
        btn.textContent = '보고서 생성 시작';
        btn.disabled = false;
        say('생성 시작 실패 — ' + e.message, 'bad');
      });
  }

  /**
   * 서버에 이미 저장된 사양을 화면에 반영한다.
   * ★ 이걸 빼면 확정 후 새로고침했을 때 화면만 '미확정'으로 돌아간다.
   *   사용자는 다시 확정을 누르고, 서버는 이미 잠겨 있어 거절하거나 버전을 올린다.
   */
  function loadSpec() {
    if (!C.api || !state.projectId) return Promise.resolve();
    return call('GET', '/projects/' + encodeURIComponent(state.projectId) + '/spec')
      .then(function (j) {
        var s = j && j.spec;
        if (!s) { state.locked = false; draw(); return; }
        state.kindId = s.docType || state.kindId;
        state.pages = s.targetPages != null ? s.targetPages : state.pages;
        state.size = s.pageSize || state.size;
        state.lang = s.language || state.lang;
        state.format = (s.formats && s.formats[0]) || state.format;
        state.themeId = s.themeId || state.themeId;
        // ★ 서버 값이 있으면 그것이 이긴다. 없을 때만 화면 기본값을 쓴다 —
        //   `s.visuals.birdseye || true` 로 쓰면 false 가 true 로 되살아난다
        state.birdseye = (s.visuals && typeof s.visuals.birdseye === 'boolean')
          ? s.visuals.birdseye : state.birdseye;
        state.locked = !!s.locked;
        draw();
      })
      .catch(function (e) {
        // 사양을 못 읽었으면 잠긴 척하지 않는다. 미확정으로 두고 사실을 알린다
        state.locked = false;
        draw();
        say('출력 사양을 불러오지 못했습니다 — ' + e.message, 'bad');
      });
  }

  /** 산출물 목록을 서버에서 다시 받는다 (파일 존재 여부로 판정된 결과) */
  function loadReports() {
    if (!C.api || !state.projectId) return;
    call('GET', '/projects/' + encodeURIComponent(state.projectId) + '/reports')
      .then(function (j) {
        C.recent = (j.files || []).map(function (f) {
          var blocked = j.distribution && j.distribution.blocked;
          return {
            name: f.name, path: f.path, at: f.at,
            status: blocked ? 'blocked' : 'ok',
            note: blocked ? (j.distribution.reasons || []).join(' / ') : '',
          };
        });
        draw();
      })
      .catch(function (e) {
        // 목록을 못 받았다고 화면을 비우지 않는다. 못 받았다는 사실만 알린다
        say('산출물 목록을 불러오지 못했습니다 — ' + e.message, 'bad');
      });
  }

  // ── 최근 생성물 ──────────────────────────────────
  /**
   * A4 인쇄본을 새 창에 열고 인쇄창을 띄운다 (지침 §7-3).
   *
   * ★ 인앱 브라우저에서는 새 창이 열리지 않는다 — 조용히 실패하면 고장으로 오해하므로
   *   그 자리에서 이유를 적는다. (배너는 inapp.js 가 따로 띄운다)
   * @returns {boolean} 처리했으면 true
   */
  function openPrint(r) {
    var url = fileUrlFor(r.path);
    if (!url) return false;

    var ia = window.LinkPilotInApp && window.LinkPilotInApp.detect(navigator.userAgent);
    var w = ia && ia.inApp ? null : window.open(url, '_blank', 'noopener');
    if (!w) {
      var n = el('p', 'note note--bad',
        (ia && ia.inApp ? ia.name + ' 안에서는 새 창이 열리지 않습니다. ' : '팝업이 차단되었습니다. ')
        + '외부 브라우저(Chrome · Safari)에서 다시 열어 주세요. 주소: ' + url);
      n.id = 'out-note';
      view.appendChild(n);
      return true;
    }
    // 문서가 다 뜬 뒤 인쇄창을 띄운다. 실패해도 창은 열려 있으니 직접 인쇄할 수 있다
    try {
      w.addEventListener('load', function () { try { w.print(); } catch (e) { /* 사용자가 직접 */ } });
    } catch (e) { /* 교차출처면 접근이 막힌다 — 그때는 사용자가 직접 인쇄한다 */ }
    return true;
  }

  function recent() {
    var box = el('section', 'card');
    box.appendChild(el('h2', 'card__t', '최근 생성물'));
    var rows = C.recent || [];
    if (!rows.length) {
      box.appendChild(el('p', 'empty', '아직 생성한 보고서가 없습니다.'));
      return box;
    }
    rows.forEach(function (r) {
      var row = el('div', 'out');
      var mid = el('div');
      add(mid, el('div', 'out__n', r.name), el('div', 'out__m', r.path + ' · ' + r.at));
      // ★ 차단된 산출물을 정상처럼 보이게 하지 않는다. 이유까지 적는다
      if (r.status === 'blocked' && r.note) mid.appendChild(el('div', 'out__m', r.note));
      add(row, el('div', 'out__ic', r.status === 'blocked' ? '⛔' : '📄'), mid);

      var st = el('span', 'st st--' + (r.status === 'blocked' ? 'blocked' : r.status === 'running' ? 'run' : 'ok'),
        r.status === 'blocked' ? '배포 차단' : r.status === 'running' ? '생성 중' : '완료');
      st.style.marginLeft = 'auto';
      row.appendChild(st);

      // 지침 §7-3 은 '[인쇄 · PDF 저장]으로 저장하거나 인쇄'다.
      // PDF 를 서버에서 만들지 않으므로(형식 목록 참고) A4 인쇄본을 브라우저로 인쇄한다
      var printable = r.status !== 'blocked' && /\.html?$/i.test(r.path || '');
      var a = el('button', 'out__a',
        r.status === 'blocked' ? '사유 보기' : printable ? '인쇄 · PDF 저장' : '열기');
      a.type = 'button';
      a.addEventListener('click', function () {
        var old = document.getElementById('out-note');
        if (old) old.remove();
        if (printable && openPrint(r)) return;
        var n = el('p', 'note', r.status === 'blocked'
          ? (r.note || '검증을 통과하지 못했습니다.') + ' — 검증 화면에서 해소해야 배포할 수 있습니다.'
          : r.path + ' 를 열 수 없습니다. 서버(api) 연결을 확인하세요.');
        n.id = 'out-note';
        view.appendChild(n);
      });
      row.appendChild(a);
      box.appendChild(row);
    });
    return box;
  }

  // ── 렌더 ─────────────────────────────────────────
  /* ── 제작 진행 (생성 클릭 뒤 그 자리에서 보여준다) ─────────
   *
   * ★ 전에는 "진행 상황은 IM 제작현황 화면에서 확인하세요" 로 끝났다. 화면을
   *   옮겨 가야 보이면 사람은 안 본다 — 그리고 안 보는 동안 RED FLAG 가 떠도
   *   모른다. 누른 자리에서 보여준다.
   */
  function live() {
    var L = window.LinkPilotLive;
    if (!L || !state.live) return null;
    var v = L.viewFrom(state.live);

    var box = el('section', 'card');
    box.id = 'live';

    var head = el('div', 'live__h');
    head.appendChild(el('h2', 'card__t', '제작 진행'));
    var badge = el('span', 'live__st live__st--' + v.state, v.headline);
    head.appendChild(badge);
    box.appendChild(head);
    if (v.note) box.appendChild(el('p', 'card__s', v.note));

    // 진행률 — ★ 모를 때는 막대를 그리지 않는다. 0% 막대는 '멈춰 있다'로 읽힌다
    if (v.pct !== null) {
      var bar = el('div', 'live__bar');
      var fill = el('div', 'live__fill');
      fill.style.width = v.pct + '%';
      bar.appendChild(fill);
      var line = el('div', 'live__meter');
      line.appendChild(bar);
      line.appendChild(el('span', 'live__pct', v.pct + '%'));
      box.appendChild(line);
    }

    var meta = [];
    if (v.elapsed) meta.push('경과 ' + v.elapsed);
    if (v.remaining) meta.push('남은 예상 ' + v.remaining + ' (참고값)');
    if (meta.length) box.appendChild(el('div', 'live__meta', meta.join(' · ')));

    // 카테고리
    var list = el('div', 'live__ph');
    v.phases.forEach(function (p, i) {
      var row = el('div', 'live__p live__p--' + p.tone + (p.running ? ' on' : ''));
      row.appendChild(el('span', 'live__n', String(i + 1)));
      var mid = el('div', 'live__b');
      mid.appendChild(el('div', 'live__t', p.label));
      mid.appendChild(el('div', 'live__w', p.why));
      row.appendChild(mid);
      row.appendChild(el('span', 'live__c',
        p.done ? '완료' : (p.running ? '진행 중' : p.doneCount + '/' + p.total)));
      list.appendChild(row);
    });
    box.appendChild(list);

    // 활동 기록 — 무슨 일이 있었는지는 요약이 아니라 로그로 보여준다
    if (v.activity.length) {
      var log = el('div', 'live__log');
      v.activity.forEach(function (a) {
        var ln = el('div', 'live__ln' + (a.level === 'ERROR' ? ' bad' : (a.level === 'WARN' ? ' warn' : '')));
        ln.appendChild(el('span', 'live__at', String(a.at || '').slice(11, 19)));
        ln.appendChild(el('span', null, (a.agent ? a.agent + ' · ' : '') + a.message));
        log.appendChild(ln);
      });
      box.appendChild(log);
    }

    v.problems.forEach(function (t) {
      var n = el('p', 'note', t);
      n.style.background = 'var(--warn-soft)';
      n.style.color = 'var(--warn-ink)';
      box.appendChild(n);
    });

    return box;
  }

  /**
   * 진행 상황을 되풀이해 물어본다.
   *
   * ★ 끝나면 멈춘다. ★ 실패해도 조용히 멈추지 않는다 — 사유를 남기고 간격을
   *   늘려 다시 시도한다. 화면이 마지막 상태로 굳으면 사용자는 생성이 멈춘 줄 안다.
   */
  function poll() {
    var L = window.LinkPilotLive;
    if (!L || !state.live || !C.api || !state.projectId) return;

    call('GET', '/projects/' + encodeURIComponent(state.projectId) + '/control-tower')
      .then(function (snap) {
        state.live.snapshot = snap;
        state.live.error = null;
        state.live.failures = 0;
      })
      .catch(function (e) {
        // 404 = 아직 실행 기록이 없다. 오류가 아니라 '시작 전'이다
        if (/실행 기록이 없는/.test(e.message)) state.live.error = null;
        else state.live.error = e.message;
        state.live.failures = (state.live.failures || 0) + 1;
      })
      .then(function () {
        draw();
        var v = L.viewFrom(state.live);
        var wait = L.nextPollMs(v, state.live.failures);
        if (wait > 0) state.live.timer = setTimeout(poll, wait);
        else if (v.state === 'done') loadReports();     // 끝났으면 산출물을 다시 받는다
      });
  }

  function draw() {
    var a = G.access(C.session, C.requiredPlan);
    view.textContent = '';
    if (!a.allowed) { view.appendChild(gate(a)); return; }

    view.appendChild(steps());
    view.appendChild(pick());
    view.appendChild(spec());
    view.appendChild(run());
    var lv = live();
    if (lv) view.appendChild(lv);
    view.appendChild(recent());
    updateLockBar();
  }

  draw();
  loadSpec();
  loadReports();

  // ── 지침 반영 ────────────────────────────────────
  // §2 유료 메뉴는 무료 계정에서도 보이되 잠긴다
  if (window.LinkPilotCatalog) window.LinkPilotCatalog.applyLocks(document, C.session);
  // §1 인앱 브라우저에서는 산출물 다운로드가 조용히 실패한다 — 여기서는 특히 치명적이다
  if (window.LinkPilotInApp) window.LinkPilotInApp.auto();
}());
</script>
</body>
</html>
