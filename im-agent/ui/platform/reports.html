<!doctype html>
<html lang="ko" data-lp-build="83691cb1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보고서 생성 · LINKPILOT</title>
<!--
  보고서 생성 — 사이드바 '유료 멤버십' 섹션. 유료 회원에게만 노출된다.

  ★ 순서를 강제한다: 출력 사양 확정(LOCK) → 생성
    사양을 먼저 못 박지 않으면 AI 가 페이지 수·형식·언어를 임의로 정한다.
    40페이지를 기대했는데 12페이지가 나오면 처음부터 다시 만들어야 한다.
    그래서 사양이 잠기기 전에는 생성 버튼이 눌리지 않는다.

  ★★ 이 화면은 무엇을 그릴지만 정한다. 권한을 강제하지 않는다.
    생성 API 가 서버에서 세션·플랜을 다시 확인해야 한다.
    화면만 열리고 생성은 거부되어야 정상이다.

  접근 판정은 gate-core.js 하나를 쓴다 (모든 유료 화면 공용, 테스트 있음).
-->
<script>
/* ★★★ **빈 화면으로 끝나지 않는다** 〈2026-08-24 사장님: 데스크탑에서 흰 화면〉.
 *
 *   화면이 통째로 비어 뜬 일이 있었다. 소스는 멀쩡했고 헤드리스로 열면
 *   정상이었다 — 즉 **그 순간의 브라우저에서만** 무언가가 안 왔다.
 *
 *   ★ 가장 흔한 자리: 배포가 파일을 하나씩 갈아 끼우는 동안(70초쯤) 화면은
 *     새 판인데 형제 스크립트가 **아직 안 올라와 404** 인 순간이 있다.
 *     그러면 전역이 아예 안 생기고, 첫 줄에서 예외가 나고, **화면은 흰 채로
 *     아무 말도 안 한다.**
 *   ★ 아래쪽 **짝 확인 조각**은 옛 스크립트는 잡지만 **없는 스크립트**는
 *     못 잡는다 — 견줄 전역 자체가 없기 때문이다. 여기가 그 구멍이다.
 *     (그 조각의 표시 이름을 여기 글자로 적지 않는다. 그것을 찾는 검사가
 *      이 주석을 코드로 오해한다 — CLAUDE.md §8 에서 세 번째로 당한 자리다.)
 *
 * ★ 그래서 ① 파일이 안 온 것과 ② 코드가 던진 것을 **둘 다** 사람 말로 띄운다.
 * ★ 이 조각은 **형제 스크립트보다 먼저** 있어야 한다. 뒤에 두면 이미 난
 *   불러오기 실패를 못 듣는다.
 * ★ 검사 자신이 죽으면 안 된다 — 전부 try 로 감싼다. */
(function () {
  /* ★★★★ **자리를 「고치는」 것이 아니라 「틀리지 않게」 한다**
   *   〈2026-08-26 · 같은 고장 **네 번째** · M-56〉.
   *
   *   앱이 이 화면을 어디에 얹느냐에 따라 형제 파일 주소가 두 가지로 틀렸다 —
   *
   *     겹침    /im-flow/im-flow/embed-bridge.js   (앞을 두 번 붙인다)
   *     빠짐    /embed-bridge.js                   (앞을 아예 안 붙인다)
   *
   *   ★ 3판은 **겹침만** 고쳤다. 그래서 빠짐이 나자 또 빨간 띠가 떴다.
   *     **한 증상만 보고 고치면 남은 증상이 다음 주에 온다.**
   *
   * ★★ 그래서 「무엇이 틀렸나」를 고치지 않고 **「어디가 맞나」를 정한다.**
   *   형제 파일들은 늘 **한 폴더에 함께** 있다. 그 폴더를 세 가지로 찾는다 —
   *
   *     ① 앱이 알려 준 자리      `<meta name="lp:base">` 또는 window.LP_BASE
   *     ② 주소에 `im-flow` 가 있으면 **첫 번째** 것까지  (겹침이 여기서 풀린다)
   *     ③ 뿌리(`/`)에서 열렸으면 `/im-flow/`             (빠짐이 여기서 풀린다)
   *
   *   ①이 있는 이유: 앱이 다른 자리에 얹게 되는 날 **코드를 안 고치고**
   *   알려 줄 길을 남겨 둔다. 없으면 그날 또 이 파일을 고치게 된다.
   *
   * ★★★ **파일로 열었을 때(file:)는 손대지 않는다.** 미리보기가 그 길이다 —
   *   거기서 자리를 바꾸면 멀쩡한 화면이 깨진다 (늑대야).
   *
   * ★ 이 조각은 형제 파일들보다 **위**에 있으므로, 여기서 `<base>` 를 세우면
   *   아래 상대 경로들이 **처음부터 옳은 자리**를 본다 — 실패가 아예 안 난다.
   *   실패한 뒤에 다시 부르는 것으로는 부족했다(실측: 파일 17개를 다시 받았는데
   *   **버튼이 5개에서 0개**가 되었다 — 이미 초기화가 끝난 뒤였다).
   */
  try {
    var FOLDER = 'im-flow';                  /* 형제 파일들이 함께 사는 폴더 이름 */
    var base = null;
    var why = null;

    /* ① 앱이 알려 준 자리 */
    try {
      var meta = document.querySelector('meta[name="lp:base"]');
      var told = (meta && meta.getAttribute('content')) || window.LP_BASE || null;
      if (told) { base = String(told).replace(/\/*$/, '') + '/'; why = '앱이 알려 줌'; }
    } catch (_) { /* 무시 */ }

    if (!base && /^https?:$/.test(location.protocol)) {
      var pathname = String(location.pathname);
      var at = pathname.indexOf('/' + FOLDER + '/');
      if (at >= 0) {
        /* ② 첫 번째 `/im-flow/` 까지가 그 폴더다. 두 번 이어져 있어도 여기서 풀린다 */
        base = pathname.slice(0, at + FOLDER.length + 2);
        why = '주소에서 찾음';
      } else if (pathname.lastIndexOf('/') === 0) {
        /* ③ 뿌리에서 열렸다 — 형제 파일이 뿌리에 있을 리 없다 */
        base = '/' + FOLDER + '/';
        why = '뿌리에서 열려 폴더를 붙임';
      }
    }

    /* 지금 자리와 같으면 아무것도 하지 않는다 — 멀쩡한 화면을 건드리지 않는다 */
    var now = String(location.pathname).slice(0, String(location.pathname).lastIndexOf('/') + 1);
    if (base && base !== now && !document.querySelector('base[data-lp-base]')) {
      var b = document.createElement('base');
      b.setAttribute('data-lp-base', why);
      b.href = location.origin + base;
      (document.head || document.documentElement).insertBefore(
        b, (document.head || document.documentElement).firstChild);
      /* ★★ **조용히 넘어가지는 않는다.** 화면은 살렸지만 **근본은 앱 쪽**이다
       *   (앞을 붙이는 쪽). 사장님 화면에 빨간 띠를 띄우면 멀쩡히 도는 화면을
       *   고장으로 읽으시게 되므로, 개발자 콘솔과 표시로만 남긴다 —
       *   사람은 안 놀라고, 기계는 셀 수 있다. */
      try {
        console.warn('[LinkPilot] 형제 파일 자리를 바로잡았다 (' + why + '): '
          + now + ' → ' + base
          + ' — 화면은 정상이지만 **앞부분을 붙이는 앱 쪽**이 근본이다.');
      } catch (_) { /* 콘솔이 없어도 죽지 않는다 */ }
    }
  } catch (_) { /* 자리를 못 고쳐도 죽지 않는다 — 아래 띠가 받는다 */ }

  var shown = false;
  /**
   * ★★★ **고쳤다는 말과 못 고쳤다는 말을 같은 색으로 하지 않는다**
   *   〈2026-08-26 · 자가치유를 넣으면서〉.
   *
   *   빨강은 「화면이 안 뜬다」는 뜻이어야 한다. 스스로 고쳐서 화면이
   *   멀쩡히 뜬 경우까지 빨강으로 적으면, 사장님은 **멀쩡한 화면을 보며
   *   고장이라고 읽으신다** — 그러면 다음부터 빨간 띠를 안 믿게 된다.
   *
   * ★★ 그리고 **빗장(shown)을 경고에는 걸지 않는다.** 앞 판은 한 번 뜨면
   *   끝이라, 자가치유 알림이 먼저 뜨면 **뒤에 오는 진짜 실패가 통째로
   *   조용해졌다.** 조용한 실패가 이 저장소에서 가장 비쌌다.
   */
  function say(msg, kind) {
    var warn = kind === 'warn';
    if (shown) return;
    if (!warn) shown = true;          /* 치명만 빗장을 건다 */
    try {
      var n = document.createElement('div');
      n.setAttribute('data-lp-fail', warn ? 'warn' : '');
      n.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:99999;'
        + 'background:' + (warn ? '#8A6100' : '#C00000')
        + ';color:#fff;padding:14px 18px;font:700 14px/1.5 system-ui,sans-serif');
      n.textContent = msg;
      var put = function () { if (document.body) document.body.appendChild(n); };
      if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
    } catch (_) { /* 알리다 죽지 않는다 */ }
  }
  /* 불러오기 실패는 거품이 안 올라온다 — 잡기 단계(true)에서 들어야 한다 */
  window.addEventListener('error', function (e) {
    try {
      var t = e && e.target;
      if (!t || !t.tagName) return;
      var tag = String(t.tagName).toUpperCase();
      if (tag !== 'SCRIPT' && tag !== 'LINK') return;
      /* ★★★ **이름만으로는 갈라 낼 수 없다** 〈2026-08-25 · 실제로 못 갈랐다〉.
       *   앱 안에서 이 띠가 떴을 때 「그 파일이 NAS 에 없다」와 「앱이 엉뚱한
       *   자리에서 찾는다」가 **똑같이 파일 이름 하나로만** 보였다. 파일은
       *   NAS 에 있었고 HTTP 200 이었는데도 그랬다 — 갈랐어야 할 것은
       *   **어느 경로로 찾았나**이고, 그것이 이름을 자르면서 사라졌다.
       * ★ 호스트는 뗀다 (CLAUDE.md §2). 경로만 있으면 갈린다. */
      var raw = String(t.src || t.href || '');
      var where = raw;
      try { var u = new URL(raw, location.href); where = u.pathname + u.search; } catch (_) {}
      /* ★★★ **경로가 겹쳤으면 그렇다고 말한다** 〈2026-08-26 · 실제로 났다〉.
       *   앱 안에서 `/im-flow/im-flow/tokens.css` 로 찾다가 못 받았다.
       *   이 화면들의 링크는 **전부 상대 경로**(`tokens.css`)라 앞을 붙이지
       *   않는다 — 즉 앞부분을 **덧붙이는 쪽은 앱**이다.
       *
       *   ★ 그런데 띠는 「못 받았습니다」만 말했다. 그러면 「파일이 없다」와
       *     「엉뚱한 자리에서 찾는다」가 **같은 문장으로 보인다.** 사장님은
       *     새로고침을 하시고, 그래도 그대로면 그때부터 원인을 못 찾는다.
       *   ★ 같은 토막이 두 번 이어지는 것은 **새로고침으로 안 없어진다.**
       *     그것은 배포가 도는 중이라서가 아니라 **주소를 만드는 코드**의 일이다. */
      var dup = null;
      try {
        var segs = String(where).split('?')[0].split('/').filter(Boolean);
        for (var i = 0; i + 1 < segs.length; i++) {
          if (segs[i] === segs[i + 1]) { dup = segs[i]; break; }
        }
      } catch (_) { /* 무시 */ }
      if (dup) {
        /* ★★★ **띠는 진단만 했다 — 그래서 같은 일이 계속 났다** 〈2026-08-26 · 세 번째〉.
         *
         *   앞 판 둘은 **메시지를 좋게 만드는 일**이었다. 「못 받았습니다」에
         *   경로를 붙이고, 다시 「두 번 들어 있습니다」를 붙였다. 그런데
         *   **화면은 여전히 안 떴다.** 사장님이 보시는 것은 같은 빨간 띠다.
         *
         * ★ 잘 설명하는 고장은 **고장이다.** 여기서 스스로 고친다 —
         *   겹친 토막을 하나 지우고 **그 파일을 다시 부른다.**
         *
         * ★★ 앞을 덧붙이는 것은 앱 쪽이지만, **고치는 것은 이쪽이 할 수 있다.**
         *   저쪽 저장소에 쓰지 않기로 한 경계(§8-2)를 지키면서 화면은 살린다.
         *
         * ★★★ **한 번만 고친다.** 고친 주소가 또 실패하면 그때는 진짜로
         *   파일이 없는 것이다 — 무한히 다시 부르면 그 사실이 사라진다. */
        var fixed = null;
        try {
          var u2 = new URL(raw, location.href);
          var ss = u2.pathname.split('/');
          for (var k = 0; k + 1 < ss.length; k++) {
            if (ss[k] && ss[k] === ss[k + 1]) { ss.splice(k, 1); break; }
          }
          u2.pathname = ss.join('/');
          fixed = u2.href;
        } catch (_) { fixed = null; }

        if (fixed && fixed !== raw && !t.getAttribute('data-lp-healed')) {
          var el = tag === 'LINK'
            ? document.createElement('link')
            : document.createElement('script');
          el.setAttribute('data-lp-healed', '1');
          if (tag === 'LINK') { el.rel = 'stylesheet'; el.href = fixed; }
          else {
            el.src = fixed;
            /* 원래 태그가 지녔던 표시를 그대로 옮긴다 — 이것이 없으면
               `embed-bridge.js` 가 어느 전역에 붙을지 모른다 */
            var g = t.getAttribute('data-lp-global');
            if (g) el.setAttribute('data-lp-global', g);
            el.async = false;   /* 순서를 지킨다 — 뒤 파일이 앞 파일을 쓴다 */
          }
          t.setAttribute('data-lp-healed', '1');
          (document.head || document.documentElement).appendChild(el);
          say('경로에 「' + dup + '」가 두 번 들어 있어 **한 번 고쳐서 다시 불렀습니다** — '
            + where + ' → ' + (function () {
              try { var v = new URL(fixed); return v.pathname + v.search; } catch (_) { return fixed; }
            }()) + '. 화면이 뜨면 그대로 쓰셔도 됩니다. 앞부분을 덧붙이는 것은 **앱 쪽**이라 '
            + '근본은 그쪽에서 고쳐야 합니다 — 이 경로를 그대로 알려 주십시오.', 'warn');
          return;
        }
        say('화면에 필요한 파일을 못 받았습니다: ' + (where || '(이름 모름)')
          + ' — 경로에 「' + dup + '」가 **두 번** 들어 있습니다.'
          + ' 고쳐서 다시 불러 봤지만 그것도 실패했습니다 — 파일이 정말 없는 자리입니다.'
          + ' 위 경로를 그대로 알려 주십시오.');
      } else {
        say('화면에 필요한 파일을 못 받았습니다: ' + (where || '(이름 모름)')
          + ' — 배포가 도는 중이면 30초 뒤 새로고침(Mac ⌘⇧R · Windows Ctrl+Shift+R)으로 사라집니다.'
          + ' 한 번 하고도 그대로면 그것은 **다른 일**입니다 — 위 경로를 그대로 알려 주십시오.');
      }
    } catch (_) { /* 무시 */ }
  }, true);
  /* ★★★ **헛울음을 내지 않는다** 〈2026-08-24 · 실측에서 걸렸다〉.
   *   `report-flow.html` 은 창을 품고 있어서 브라우저가 막는 읽기가 하나 난다
   *   (`SecurityError: Location.pathname`). 화면은 **멀쩡히 뜬다.**
   *   그것까지 빨간 띠로 띄우면 **멀쩡한 화면에 고장 딱지**가 붙는다.
   * ★ 그래서 코드가 던진 것은 **화면이 실제로 비었을 때만** 알린다.
   *   빈 화면이 이 장치가 막으려는 것이고, 그 밖은 알릴 일이 아니다. */
  var lastErr = null;
  function noteErr(m) {
    lastErr = m;
    setTimeout(function () {
      try {
        var b = document.body;
        var n = b ? (b.innerText || '').trim().length : 0;
        if (n < 40) {
          say('화면을 그리다 멈췄습니다: ' + lastErr
            + ' — 이 글이 보이면 고장입니다. 이대로 알려 주십시오.');
        }
      } catch (_) { /* 무시 */ }
    }, 1200);
  }
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target.tagName) return;   // 위에서 이미 다뤘다
    noteErr((e && e.message) || '알 수 없는 오류');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    noteErr((r && r.message) || r || '알 수 없는 오류');
  });
}());
</script>

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.logo { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 900; }
/* ★ 워드마크 강조를 라임으로 두면 흰 바탕 대비 1.54 다 — 24px 굵은 글자
 *   기준(3.0)도 못 넘긴다. 밝은 바탕의 브랜드 글자 색은 딥(4.98)이다 */
.logo em { font-style: normal; color: var(--lp-brand-deep); }
.logo__mark { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--ink);
  /* ★ 라임은 **채움**으로 쓴다 — 밝은 바탕의 라임 글자는 대비 1.54 다 */
  display: grid; place-items: center; background: var(--lp-brand);
  color: var(--lp-brand-ink); font-size: 16px; }
.head { background: var(--surface); padding: 16px 26px 14px; }
.head__row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.head__ic { width: 40px; height: 40px; border-radius: 12px; background: var(--panel);

.head__t { font-size: 22px; font-weight: 800; }
.head__meta { margin-left: auto; text-align: right; font-size: 13px; color: var(--ink2); }
.head__meta b { display: block; color: var(--ink); font-weight: 700; margin-top: 2px; }
.rule { height: 3px; background: var(--lime); }
.body { padding: 20px 26px 96px; max-width: 1080px; }

/* 게이트 */
.gate { max-width: 560px; margin: 60px auto; background: var(--surface);
  border-radius: var(--r); padding: 40px 32px; text-align: center; }
.gate__ic { font-size: 40px; line-height: 1; }
.gate__t { font-size: 21px; font-weight: 800; margin-top: 18px; }
.gate__b { font-size: 14.5px; color: var(--ink2); margin-top: 12px; line-height: 1.7; }
.gate__cta { display: inline-block; margin-top: 24px; padding: 14px 32px;

  background: var(--lime); color: var(--ink); cursor: pointer; }
.gate__cta:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.gate__fine { font-size: 12.5px; color: var(--ink2); margin-top: 16px; }

/* 단계 */
.steps { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; padding: 9px 14px;
  border-radius: 999px; background: var(--panel); color: var(--ink2); font-size: 13px; font-weight: 600; }
.step.on { background: var(--ink); color: #fff; }
.step.done { background: var(--lime-soft); color: var(--lime-deep); }
.step__n { width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(0,0,0,.09); font-size: 11px; font-weight: 800; }
.step.on .step__n { background: rgba(255,255,255,.22); }

.card { background: var(--surface); border-radius: var(--r); padding: 22px; margin-bottom: 16px; }

.card__s { font-size: 13px; color: var(--ink2); margin: 0 0 16px; }

.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.f { display: flex; flex-direction: column; gap: 6px; }
.f label { font-size: 12.5px; font-weight: 700; color: var(--ink2); }
.f select, .f input { font-weight: 400; font-size: 14px; line-height: 1.5; font-family: inherit; padding: 11px 13px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
.f select:disabled, .f input:disabled { background: var(--panel); color: var(--ink2); }

/* 보고서 종류 */
.kinds { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.kind { text-align: left; background: var(--panel); border: 2px solid transparent;

.kind:hover { border-color: var(--line); }
.kind.on { border-color: var(--lime); background: var(--lime-soft); }
.kind:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.kind__n { font-size: 14px; font-weight: 700; }
.kind__d { font-size: 12px; color: var(--ink2); margin-top: 5px; line-height: 1.5; }
.kind__m { font-size: 11.5px; color: var(--lime-deep); font-weight: 700; margin-top: 7px; }

/* 테마 */
/* ── 출력 성격 네 축 + 교정 미리보기 〈2026-08-23〉 ───────────────── */
.style { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.style__h { font-size: 14px; font-weight: 800; }
.style__s { margin: 5px 0 14px; font-size: 12.5px; color: var(--ink2); line-height: 1.7; }
.style__r { margin-bottom: 13px; }
.style__l { font-size: 12.5px; font-weight: 700; color: var(--ink2); margin-bottom: 7px; }

.style__d { margin: 7px 0 0; font-size: 12px; color: var(--ink2); line-height: 1.6; }
.sopt { display: inline-flex; align-items: center; gap: 7px; cursor: pointer;

  padding: 9px 12px; border-radius: 10px;

.sopt:disabled { opacity: .55; cursor: default; }

/* 팝업 — 화면 위에 덮는다. 뒤를 눌러도 닫힌다 */
.modal { position: fixed; inset: 0; z-index: 200; background: rgba(16,18,20,.55);

  padding: 9px 14px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); }
.modal__note { margin: 13px 0 0; font-size: 12px; color: var(--ink2); line-height: 1.7; }

/* 견본 지면 — **실제 판형 비율을 지킨다.** 비율이 틀리면 볼 이유가 없다 */
.sheet { --acc: #C00000; aspect-ratio: 1 / 1.414; width: 100%; max-width: 420px;
  margin: 0 auto; background: #fff; color: #17191C; border: 1px solid var(--line);
  border-radius: 4px; padding: 22px 20px 16px; display: flex; flex-direction: column;

.sheet--land { aspect-ratio: 16 / 9; max-width: 100%; padding: 20px 24px 14px; }
.sheet__top { border-bottom: 3px solid var(--acc); padding-bottom: 9px; }
.sheet__eyebrow { font-size: 8px; letter-spacing: .14em; text-transform: uppercase; color: #8A9099; }
.sheet__t { margin: 6px 0 0; font-size: 16px; font-weight: 800; letter-spacing: -.02em; color: var(--acc); }
.sheet--land .sheet__t { font-size: 21px; }
.sheet__sub { margin-top: 3px; font-size: 9.5px; color: #6C737B; }
.sheet__b { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding-top: 11px; }
.sheet__b--2 { flex-direction: row; align-items: stretch; }
.sheet__b--2 > * { flex: 1 1 0; min-width: 0; }
.sheet__txt { display: flex; flex-direction: column; gap: 6px; }
.sheet__p { margin: 0; font-size: 9.5px; line-height: 1.7; color: #2B2F34; }

.sheet__p--dim { color: #8A9099; }
.sheet__fig { border: 1px dashed #C7CCD2; border-radius: 4px; background: #F6F7F9;
  display: grid; place-items: center; font-size: 9.5px; color: #8A9099; min-height: 44px; }
.sheet__foot { margin-top: 8px; padding-top: 7px; border-top: 1px solid #E6E9ED;
  font-size: 8.5px; color: #8A9099; }
@media (max-width: 560px) { .modal { padding: 12px; } .sheet { max-width: 100%; } }

.themes { display: flex; gap: 8px; flex-wrap: wrap; }
.theme { display: flex; align-items: center; gap: 8px; padding: 9px 13px; border-radius: 10px;
  border: 2px solid transparent; background: var(--panel); cursor: pointer; font-weight: 600; font-size: 13px; line-height: 1; font-family: inherit; }
.theme.on { border-color: var(--lime); background: var(--lime-soft); }

.lockbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 18px;

.btn { padding: 13px 26px; font-weight: 700; font-size: 14.5px; line-height: 1; font-family: inherit; border: 0; border-radius: 12px;

.btn--ghost { background: var(--surface); border: 1px solid var(--line); color: var(--ink2); }
.why { font-size: 13px; color: var(--warn-ink); }

.locked { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-radius: 12px;
  background: var(--lime-soft); font-size: 13.5px; font-weight: 600; color: var(--lime-deep); }
/* 제작 진행 — 생성 클릭 뒤 그 자리에서 */

    **캐시가 원인이라는 생각 자체가 안 든다.**

  ★ 그래서 여기서 **먼저 잡는다.** 표를 두지 않는다 — `window` 의 LinkPilot* 전역을
    훑어 자기 판을 말하는 것만 골라 문서 지문과 댄다. 스크립트가 늘어도 안 갈린다.
  ★ 이 조각은 **화면 안에** 있어야 한다. 따로 파일로 빼면 그 파일도 옛것일 수 있다.

<script>
(function () {
  var want = document.documentElement.getAttribute('data-lp-build');
  if (!want) return;                       /* 지문이 없는 판 — 잴 것이 없다 */
  var bad = [];
  try {
    Object.keys(window).forEach(function (k) {
      if (k.indexOf('LinkPilot') !== 0) return;
      var v = window[k];
      if (v && typeof v === 'object' && typeof v.BUILD === 'string'
        && v.BUILD !== want) bad.push(k + ' (' + v.BUILD + ')');
    });
  } catch (_) { return; }                  /* 훑다 막히면 조용히 — 검사가 화면을 죽이지 않는다 */
  if (!bad.length) return;

  /* ★★★ **한 번은 화면이 스스로 고친다** 〈2026-08-27 · D-149〉.
   *
   *   앞 판은 빨간 띠로 「새로고침해 주십시오」라고만 했다. 그 말은 맞지만
   *   **고치는 일을 사람에게 떠넘긴다** — 사장님이 폰에서 강제 새로고침을
   *   하시는 것은 쉬운 일이 아니다 (M-58 과 같은 결: 「잠깐 나는 고장을
   *   사람에게 떠넘기지 않는다」).
   *
   *   ★ 그래서 주소에 표를 하나 붙여 **다시 받는다.** 브라우저는 주소가 다르면
   *     캐시를 안 쓴다. 화면이 새로 오면 스크립트와 판이 맞는다.
   *   ★★ **세션당 한 번만.** 서버에 정말 두 판이 섞여 있으면 다시 받아도 같다 —
   *     그때 또 다시 받으면 **끝없이 돈다.** 한 번 해 보고 안 되면 띠를 띄운다.
   *   ★ 표는 다음 새로고침에서 사라지도록 `replace` 로 바꾼다 (뒤로가기에 안 쌓인다). */
  try {
    var KEY = 'lp-pair-retried';
    if (!sessionStorage.getItem(KEY)) {
      sessionStorage.setItem(KEY, want);
      var u = location.href.replace(/[?&]lpfix=\d+/, '');
      location.replace(u + (u.indexOf('?') < 0 ? '?' : '&') + 'lpfix=' + Date.now());
      return;
    }
  } catch (_) { /* 저장소가 막힌 자리도 있다 — 그때는 띠만 띄운다 */ }

  var n = document.createElement('div');
  n.setAttribute('data-lp-pair', '');
  n.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:99999;'
    + 'background:#C00000;color:#fff;padding:14px 18px;font:700 14px/1.5 system-ui,sans-serif');
  /* ★★★ **어느 쪽이 옛것인지 아는 척하지 않는다 — 다만 구조가 답을 준다**
   *   〈2026-08-27 · D-149 · 실제 화면에서 거꾸로 말했다〉.
   *
   *   앞 판은 「옛 판 <스크립트 이름들>」이라고 **스크립트를 옛것으로 지목**했다.
   *   그런데 사장님 화면은 반대였다 — 화면 479c745f(옛), 스크립트 64478fa1(새).
   *
   *   ★ 지문은 해시라 **그 자체로는 앞뒤가 없다.** 하지만 자리 관계가 답을 준다:
   *     · 배포는 **자산 먼저 · HTML 나중**으로 올린다 (deploy-nas 「Upload」).
   *     · 화면은 형제 파일을 **판 표시를 붙여** 부르는데, 서버는 그 표를
   *       무시하고 **지금 있는 파일**을 준다.
   *       (표 이름을 여기 글자로 적지 않는다 — 검사가 주석을 코드로 읽는다. §8)
   *   → 그래서 어긋나면 **거의 언제나 화면(HTML)이 옛것**이다. 스크립트는
   *     서버의 지금 판이다. 그 말을 그대로 적는다.
   *   ★ 그래도 단정하지 않는다 — 「대개」라고 적고, 새로고침해도 같으면
   *     **서버에 두 판이 섞인 것**이니 알려 달라고 한다. */
  n.textContent = '화면과 스크립트의 판이 다릅니다 — 화면(HTML)이 옛 판일 가능성이 큽니다. '
    + '한 번 다시 받아 봤는데도 그대로입니다. '
    + '화면 ' + want + ' · 스크립트 ' + bad.join(', ')

    + '그대로면 이 여덟 글자 두 개를 알려 주시면 저희가 봅니다.';

  /* ★★★ **「둘 중 하나」로 끝내지 않는다 — 물어봐서 가른다** 〈2026-08-27 · 사장님 화면〉.
   *
   *   앞 판은 「서버에 두 판이 섞여 있을 수 있습니다」로 끝났다. 그런데 그 말은
   *   **읽는 사람이 할 수 있는 일이 없다** — 캐시를 지워야 하는지, 배포가 안
   *   된 것인지 갈리지 않기 때문이다. 오늘 그 갈림에서 세 번 헤맸다.
   *
   *   ★ 가르는 법은 간단하다. **이 화면의 주소를 캐시를 쓰지 말고 다시 받아**
   *     거기 적힌 판을 본다. 받은 것이
   *       · 지금 그려진 것과 **같으면** → 서버가 정말 옛 화면을 준다
   *       · **다르면**               → 서버는 새 판이고 브라우저가 옛것을 들고 있다
   *   ★ 못 받으면 **못 쟀다고 적는다.** 「둘 중 하나」로 되돌아가지 않는다.
   *   ★ 판 표시는 문서 뿌리의 속성에 있다 — 받은 글에서 그 속성을 찾는다.
   */
  try {
    var url = location.href.replace(/[?&]lpcheck=\d+/, '');
    url += (url.indexOf('?') < 0 ? '?' : '&') + 'lpcheck=' + Date.now();
    fetch(url, { cache: 'no-store', credentials: 'same-origin' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var m = /data-lp-build="([0-9a-f]+)"/.exec(t);
        var fresh = m && m[1];
        if (!fresh) {
          n.textContent += ' — 다시 받아 봤지만 판을 읽지 못했습니다. 알려 주시면 저희가 봅니다.';
          return;
        }
        if (fresh === want) {
          n.textContent = '서버가 옛 화면을 주고 있습니다 — 브라우저 탓이 아닙니다. '
            + '화면 ' + want + ' · 스크립트 ' + bad.join(', ')
            + ' · 캐시를 지우셔도 그대로입니다. 이 두 글자묶음을 알려 주십시오.';
        } else {
          n.textContent = '브라우저가 옛 화면을 들고 있습니다 — 서버는 새 판(' + fresh + ')입니다. '
            + '앱을 완전히 껐다 켜시고, 그래도 그대로면 앱 설정에서 **캐시 삭제**를 하십시오. '
            + '(화면 ' + want + ' · 스크립트 ' + bad.join(', ') + ')';
        }
      })
      .catch(function () {
        n.textContent += ' — 다시 받아 보지 못했습니다(연결). 알려 주시면 저희가 봅니다.';
      });
  } catch (_) { /* fetch 가 없는 자리도 있다 — 그때는 위 문장으로 둔다 */ }
  var put = function () { if (document.body) document.body.appendChild(n); };
  if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
}());
</script>

   *   `urlFor`), 앱이 직접 열면 설정의 `projectId` 로 온다. **둘 다 안 보고
   *   데모 목록의 첫 항목을 쓰면**, 2단계에서 값을 넣은 프로젝트와 4단계에서
   *   생성하는 프로젝트가 달라진다 — 화면은 멀쩡해 보이고 산출물만 엉뚱해진다.
   *   (2026-08-16 발견: 3·4단계가 흐름을 따라오지 않고 있었다)
   */
  function pickProject() {
    try {
      var q = new URLSearchParams(location.search).get('project');
      if (q) return q;
    } catch (_) { /* 옛 브라우저 */ }
    return C.projectId || (C.projects[0] || {}).id || null;
  }

  var state = {
    projectId: pickProject(),
    kindId: 'im',
    pages: null,          // 종류를 고르면 기본값이 들어온다
    size: 'A4', format: 'html', lang: 'ko',
    themeId: 'institutional',
    /* 출력 성격 네 축 — 기본은 서버(`STYLE_DEFAULT`)와 같아야 한다 */
    layout: 'im_portrait', density: 'mixed', house: 'boutique', register: 'expert',
    proof: false,         // 교정 미리보기 팝업이 열려 있는가
    cadastral: true,      // 지적도면 — 서버 사양을 받으면 그것이 이긴다
    birdseye: true,       // 조감도 — 서버 사양을 받으면 그것이 이긴다
    locked: false,        // ★ 출력 사양 확정 여부
  };

  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (x !== undefined && x !== null && x !== '') n.textContent = String(x);
    return n;
  }
  function add(p) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) p.appendChild(arguments[i]); return p; }
  function kindOf(id) { return C.kinds.filter(function (k) { return k.id === id; })[0] || null; }

  // ── 서버 연결 ────────────────────────────────────
  // api 가 없으면 데모로 동작한다. 있으면 확정·생성이 실제로 서버를 거친다.
  // ★ 서버가 거부하면 그 사유를 그대로 보여준다. 화면이 임의로 성공처럼 꾸미지 않는다.

  function apiUrl(p) { return String(C.api).replace(/\/$/, '') + p; }

  /**
   * 산출물 파일 주소. 〈B-8〉
   *
   * ★ 본체가 fileUrl 을 주면 그것을 쓰고, 없으면 **API 가 직접 내려주는 경로**를 쓴다.
   *   예전에는 본체가 정적 경로를 붙여 줄 때까지 안내만 띄웠다 — 그런데 지침 §7-3 은
   *   [인쇄 · PDF 저장]을 이미 약속하고 있어서, 협력사 눈에는 고장으로 보인다.
   */
  /**
   * ★★★ **주소를 절대 주소로 만든다** 〈2026-08-24 사장님 화면: 팝업 차단〉.
   *
   *   못 열었을 때 화면이 「외부 브라우저에서 다시 열어 주세요. 주소:
   *   /api/linkpilot/projects/…」 라고 적고 있었다. **그 주소로는 못 간다** —
   *   앞에 도메인이 없다. 안내가 시키는 대로 해도 안 되는 안내였다.
   */
  function absUrl(u) {
    try { return new URL(String(u), window.location.href).href; }
    catch (_) { return String(u); }
  }

  /**
   * **어디에 갇혀 있는가**를 가른다. 셋이 서로 다른 원인이고 할 일도 다르다.
   *
   * ★ 앞 판은 인앱 브라우저 하나만 봤다. 그래서 **앱 화면(iframe) 안**에서
   *   막힌 것을 「팝업이 차단되었습니다」로 적었는데, 사장님은 사파리에 계셨다 —
   *   **원인을 잘못 단정한 안내**다 (M-24 · M-28 과 같은 결).
   */
  function whereAreWe() {
    var ia = window.LinkPilotInApp && window.LinkPilotInApp.detect(navigator.userAgent);
    if (ia && ia.inApp) return { kind: 'inapp', name: ia.name };
    var framed = false;
    try { framed = window.top !== window.self; } catch (_) { framed = true; }
    return { kind: framed ? 'framed' : 'top', name: null };
  }

  function fileUrlFor(rel) {
    if (typeof C.fileUrl === 'function') return C.fileUrl(state.projectId, rel) || null;
    if (!C.api || !state.projectId || !rel) return null;
    return apiUrl('/projects/' + encodeURIComponent(state.projectId)
      + '/file?rel=' + encodeURIComponent(rel));
  }

  function call(method, p, body) {
    return fetch(apiUrl(p), {
      method: method,
      credentials: 'same-origin',     // 세션 쿠키로 인증한다
      headers: body ? { 'content-type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  function say(text, kind) {
    var old = document.getElementById('api-note');
    if (old) old.remove();
    var n = el('p', 'note', text);
    n.id = 'api-note';
    if (kind === 'bad') { n.style.background = 'var(--bad-soft)'; n.style.color = 'var(--bad-ink)'; }
    view.appendChild(n);
    n.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  /** 현재 화면 값 → 서버 사양 형식 */
  function specBody() {
    return {
      docType: state.kindId,
      targetPages: state.pages,
      pageSize: state.size,
      language: state.lang,
      formats: [state.format],
      themeId: state.themeId,
      layout: state.layout, density: state.density,
      house: state.house, register: state.register,
      visuals: { cadastral: state.cadastral, birdseye: state.birdseye },
    };
  }

  document.getElementById('side-user').textContent = (C.session && C.session.name) || '';
  document.getElementById('head-user').textContent = (C.session && C.session.name) || '';
  document.getElementById('head-date').textContent = G.kstLabel();

  // ── 게이트 ───────────────────────────────────────
  function gate(a) {
    var m = G.accessMessage(a, C.planNames[a.requiredPlan], '보고서 생성');
    if (a.reason === 'plan') {
      m.body = 'IM · Teaser · 요약 보고서를 프로젝트 자료에서 자동으로 만듭니다. '
        + '모든 수치에 출처가 붙고, 검증을 통과하지 못하면 배포가 차단됩니다.';
    }
    if (a.reason === 'expired') {
      m.body = '갱신하면 다시 생성할 수 있습니다. 이미 만든 보고서는 그대로 보관됩니다.';
    }
    var box = el('div', 'gate');
    add(box, el('div', 'gate__ic', G.gateIcon(a.reason)),
      el('h2', 'gate__t', m.title), el('p', 'gate__b', m.body));

    var b = el('button', 'gate__cta', m.cta);
    b.type = 'button';
    b.addEventListener('click', function () {
      var old = document.getElementById('gate-note');
      if (old) old.remove();
      var where = a.reason === 'unauthenticated' ? '로그인 화면'
        : a.reason === 'expired' ? '멤버십 화면' : '업그레이드 탭';
      var n = el('p', 'note', where + '으로 이동해야 합니다 — 본체 라우팅에 연결하세요.');
      n.id = 'gate-note';
      view.appendChild(n);
    });
    box.appendChild(b);

    // 잠긴 상태에서 열리는 것처럼 보이면 안 된다
    var nav = document.getElementById('nav-rep');
    nav.className = 'nav lock';
    nav.appendChild(el('span', 'nav__lk', '🔒'));
    return box;
  }

  // ── 단계 표시 ────────────────────────────────────
  function steps() {
    var row = el('div', 'steps');
    /* ★★ **이름을 여기 적지 않는다** 〈2026-08-28 · D-157〉. 앞 판은 여섯을
       손으로 적어 두었고, 레일의 마지막 칸 이름이 「생성」에서 「완성 보고서」로
       바뀌자 **여기만 옛 이름을 말했다.** 정본은 `flow-core.js` 하나다. */
    var FL = window.LinkPilotFlow;
    (FL ? FL.STEPS.map(function (st) { return st.name; }) : []).forEach(function (label, i) {
      var cls = 'step';
      if (i <= 3) cls += ' done';
      else if (i === 4) cls += state.locked ? ' done' : ' on';
      else if (state.locked) cls += ' on';

      // 가이드 필드는 별도 화면이다. 여기서 바로 건너갈 수 있어야 한다 —
      // 값이 비어 있으면 생성해도 빈 칸투성이 보고서가 나온다
      var n = el(i === 3 ? 'a' : 'div', cls);
      if (i === 3) {
        var qs = [];
        if (state.projectId) qs.push('project=' + encodeURIComponent(state.projectId));
        if (state.kindId) qs.push('doc=' + encodeURIComponent(state.kindId));
        n.href = 'fields.html' + (qs.length ? '?' + qs.join('&') : '');
        n.style.textDecoration = 'none';
      }
      add(n, el('span', 'step__n', String(i + 1)), el('span', null, label));
      row.appendChild(n);
    });
    return row;
  }

  // ── 1단계: 대상·종류 ─────────────────────────────
  function pick() {
    var box = el('section', 'card');
    box.appendChild(el('h2', 'card__t', '무엇을 만들까요'));
    box.appendChild(el('p', 'card__s', '프로젝트와 보고서 종류를 고릅니다.'));

    var f = el('div', 'f');
    f.appendChild(el('label', null, '프로젝트'));
    var sel = el('select');
    C.projects.forEach(function (p) {
      var o = new Option(p.id + ' — ' + p.name, p.id);
      sel.appendChild(o);
    });
    sel.value = state.projectId || '';
    sel.disabled = state.locked;
    sel.addEventListener('change', function () { state.projectId = sel.value; draw(); });
    f.appendChild(sel);
    box.appendChild(f);

    var kinds = el('div', 'kinds');
    kinds.style.marginTop = '16px';
    C.kinds.forEach(function (k) {
      // 종류별로 요구 플랜이 다를 수 있다. 못 쓰는 종류는 잠금으로 보인다
      var ka = G.access(C.session, k.minPlan);
      var b = el('button', 'kind' + (state.kindId === k.id ? ' on' : ''));
      b.type = 'button';
      b.disabled = !ka.allowed || state.locked;
      add(b, el('div', 'kind__n', (ka.allowed ? '' : '🔒 ') + k.name), el('div', 'kind__d', k.desc));
      b.appendChild(el('div', 'kind__m', ka.allowed
        ? '기본 ' + k.pages + '페이지'
        : (C.planNames[k.minPlan] || k.minPlan) + ' 플랜부터'));
      b.addEventListener('click', function () {
        state.kindId = k.id;
        state.pages = k.pages;    // 종류를 바꾸면 기본 페이지 수를 다시 채운다
        draw();
      });
      kinds.appendChild(b);
    });
    box.appendChild(kinds);
    return box;
  }

  // ── 2단계: 출력 사양 ─────────────────────────────
  function spec() {
    var k = kindOf(state.kindId);
    if (state.pages === null && k) state.pages = k.pages;

    var box = el('section', 'card');
    box.appendChild(el('h2', 'card__t', '출력 사양'));
    box.appendChild(el('p', 'card__s',
      '생성 전에 확정합니다. 사양을 먼저 못 박지 않으면 페이지 수·형식·언어가 임의로 정해집니다.'));

    var grid = el('div', 'grid');
    function field(label, node) {
      var f = el('div', 'f');
      f.appendChild(el('label', null, label));
      f.appendChild(node);
      return f;
    }
    var pages = el('input');
    pages.type = 'number'; pages.min = '1'; pages.max = '200';
    pages.value = state.pages === null ? '' : state.pages;
    pages.disabled = state.locked;
    pages.addEventListener('input', function () {
      state.pages = pages.value === '' ? null : parseInt(pages.value, 10);
      updateLockBar();
    });

    function selOf(list, cur, set) {
      var s = el('select');
      list.forEach(function (v) {
        var o = new Option(typeof v === 'string' ? v : v.name, typeof v === 'string' ? v : v.id);
        // 만들 수 없는 형식은 이유를 붙여 비활성으로 남긴다
        if (typeof v === 'object' && v.supported === false) {
          o.disabled = true;
          o.text = v.name + ' — ' + v.via;
        }
        s.appendChild(o);
      });
      s.value = cur;
      s.disabled = state.locked;
      s.addEventListener('change', function () { set(s.value); updateLockBar(); });
      return s;
    }
    add(grid,
      field('페이지 수', pages),
      field('용지·비율', selOf(C.sizes, state.size, function (v) { state.size = v; })),
      field('파일 형식', selOf(C.formats, state.format, function (v) { state.format = v; })),
      field('언어', selOf(C.langs, state.lang, function (v) { state.lang = v; })));
    box.appendChild(grid);

    /* ── 시각자료 ────────────────────────────────────────
     * ★ 「무엇을 만들지」는 값 입력(2단계)이 아니라 **사양**에서 정한다.
     *   섞어 두면 「값」과 「산출물」이 한 화면에서 뒤엉킨다.
     * ★ 켠다고 반드시 나오는 것이 아니다 — 지적 필지 형상이 없으면
     *   09 Massing 이 사유를 남기고 건너뛴다. 그 사실을 여기 적어 둔다. */
    var vis = el('div');
    vis.style.marginTop = '16px';
    var vlab = el('label', null, '시각자료');
    vlab.style.cssText = 'font-size:12.5px;font-weight:700;color:var(--ink2);display:block;margin-bottom:8px';
    vis.appendChild(vlab);

    /* ★★★ **지적도면과 조감도는 다른 것이다** 〈2026-08-25 사장님 지시〉.
     *   조감도는 건물이 선 그림이고 지적도면은 **땅만** 그린 것이다. 하나로
     *   묶으면 「땅만 필요한데 건물까지 그려진」 문서가 나온다.
     * ★ 둘 다 **SketchUp 쪽에서 만들어 온다** — 엔진이 대신 그리면 두 벌이 되고,
     *   그때 어느 것이 문서에 실렸는지 알 수 없게 된다 (D-95 · 평면 A/B). */
    var cwrap = el('label', 'chk');
    var cchk = el('input');
    cchk.type = 'checkbox';
    cchk.checked = !!state.cadastral;
    cchk.disabled = state.locked;
    cchk.addEventListener('change', function () { state.cadastral = cchk.checked; updateLockBar(); });
    cwrap.appendChild(cchk);
    cwrap.appendChild(el('span', null, '지적도면 만들기'));
    vis.appendChild(cwrap);
    vis.appendChild(el('p', 'chk__d',
      '필지 경계·지번·면적만 그린 도면입니다 — 건물은 안 그립니다. '
      + '지적 필지 형상을 못 받으면 만들지 않고 그 사유를 남깁니다: '
      + '땅 모양을 지어내면 실제 지적도처럼 읽히기 때문입니다.'));

    var bwrap = el('label', 'chk');
    var bchk = el('input');
    bchk.type = 'checkbox';
    bchk.checked = !!state.birdseye;
    bchk.disabled = state.locked;
    bchk.addEventListener('change', function () { state.birdseye = bchk.checked; updateLockBar(); });
    bwrap.appendChild(bchk);
    bwrap.appendChild(el('span', null, '조감도 만들기'));
    vis.appendChild(bwrap);
    vis.appendChild(el('p', 'chk__d',
      '지적도 필지선과 건축개요로 그립니다 — AI 로 만든 이미지가 아니라 모든 선이 '
      + '지적도와 건축개요에서 나옵니다. 방위·축척과 「설계도면이 아님」 표시가 함께 들어갑니다. '
      + '지적 필지 형상을 못 받으면 그리지 않고 그 사유를 남깁니다 — 대지 모양을 '
      + '근사해서 그리면 실제 땅 모양으로 읽히기 때문입니다.'));
    box.appendChild(vis);

    // 디자인 테마 — 내용과 분리된 선택이다
    var th = el('div');
    th.style.marginTop = '16px';
    th.appendChild(el('label', null, '디자인 테마'));
    th.querySelector('label').style.cssText = 'font-size:12.5px;font-weight:700;color:var(--ink2);display:block;margin-bottom:8px';
    var list = el('div', 'themes');
    C.themes.forEach(function (t) {
      var b = el('button', 'theme' + (state.themeId === t.id ? ' on' : ''));
      b.type = 'button';
      b.disabled = state.locked;
      var sw = el('span', 'theme__sw');
      sw.style.background = t.color;
      add(b, sw, el('span', null, t.name));
      b.addEventListener('click', function () { state.themeId = t.id; draw(); });
      list.appendChild(b);
    });
    th.appendChild(list);
    box.appendChild(th);

    /* ── 출력 성격 네 축 〈2026-08-23 사장님 지시〉 ────────────────
     * ★ 「어떻게 생긴 문서인가」는 페이지 수·형식과 **다른 종류의 결정**이다.
     *   그래서 같은 격자에 끼우지 않고 아래에 따로 세운다.
     * ★ 조합이 60가지다. 조합마다 견본을 미리 그려 두지 않고
     *   **고른 하나를 그 자리에서** 그린다 — [교정 미리보기]. */
    var st = el('div', 'style');
    st.appendChild(el('div', 'style__h', '출력 성격'));
    st.appendChild(el('p', 'style__s',
      '판형과 어조가 바뀌면 같은 숫자라도 **읽는 사람이 다르게 읽습니다.** '
      + '고른 뒤 아래 [교정 미리보기] 로 실제 모양을 보고 정하십시오.'));

    [['layout', '판형'], ['density', '무게중심'], ['house', '기관 스타일'], ['register', '어조']]
      .forEach(function (pair) {
        var key = pair[0];
        var row = el('div', 'style__r');
        row.appendChild(el('div', 'style__l', pair[1]));
        var opts = el('div', 'style__o');
        (C.style[key] || []).forEach(function (o) {
          var b = el('button', 'sopt' + (state[key] === o.id ? ' on' : ''));
          b.type = 'button';
          b.disabled = state.locked;
          b.title = o.hint || '';
          if (o.color) {
            var sw = el('span', 'sopt__sw');
            sw.style.background = o.color;
            b.appendChild(sw);
          }
          b.appendChild(el('span', null, o.name));
          b.addEventListener('click', function () { state[key] = o.id; draw(); });
          opts.appendChild(b);
        });
        row.appendChild(opts);
        /* ★ 고른 것의 뜻을 **그 줄 아래**에 적는다. 툴팁만 두면 아무도 안 본다 */
        var cur = (C.style[key] || []).filter(function (o) { return o.id === state[key]; })[0];
        if (cur && cur.hint) row.appendChild(el('p', 'style__d', cur.hint));
        st.appendChild(row);
      });

    var proof = el('button', 'btn2 style__go', '교정 미리보기');
    proof.type = 'button';
    proof.addEventListener('click', function () { state.proof = true; draw(); });
    st.appendChild(proof);
    box.appendChild(st);

    var bar = el('div', 'lockbar');
    bar.id = 'lockbar';
    box.appendChild(bar);
    return box;
  }

  /**
   * ★★★ **교정 미리보기 팝업** 〈2026-08-23 사장님 지시:
   *   「출력조건 미리보기 팝업창을 띄워서 교정볼수 있도록」〉.
   *
   *   조합이 2 × 3 × 5 × 2 = **60가지**다. 조합마다 견본을 미리 그려 두면
   *   하나를 고칠 때 예순 개가 갈린다. 그래서 **고른 하나를 그 자리에서** 그린다.
   *
   * ★ **예시임을 화면에 박는다** (CLAUDE.md §8). 여기 숫자는 딜의 값이 아니라
   *   모양을 보기 위한 견본이다 — 실제 값으로 오해하면 그것으로 판단한다.
   * ★ 어조 문구는 **손으로 적지 않는다.** `C.style.register[].sample` 에서 온다 —
   *   그 표가 서버 `core/outputspec.js` 의 `REGISTER` 와 같은 값이고,
   *   검사가 둘을 대조한다. 갈리면 「미리보기와 다른 문서」가 나온다.
   */
  function proofModal() {
    var pick = function (key) {
      return (C.style[key] || []).filter(function (o) { return o.id === state[key]; })[0]
        || (C.style[key] || [])[0];
    };
    var L = pick('layout'), D = pick('density'), H = pick('house'), R = pick('register');
    var land = L.id === 'ppt_landscape';

    var back = el('div', 'modal');
    back.addEventListener('click', function (e) { if (e.target === back) { state.proof = false; draw(); } });

    var win = el('div', 'modal__w');
    var hd = el('div', 'modal__h');
    hd.appendChild(el('div', 'modal__t', '교정 미리보기'));
    hd.appendChild(el('div', 'modal__s',
      L.name + ' · ' + D.name + ' · ' + H.name + ' · ' + R.name));
    var x = el('button', 'modal__x', '닫기');
    x.type = 'button';
    x.addEventListener('click', function () { state.proof = false; draw(); });
    hd.appendChild(x);
    win.appendChild(hd);

    /* ★ 견본 지면. 실제 판형 비율을 지킨다 — 세로 A4(1:1.414) · 가로 16:9 */
    var page = el('div', 'sheet' + (land ? ' sheet--land' : ''));
    page.style.setProperty('--acc', H.color);

    var top = el('div', 'sheet__top');
    top.appendChild(el('div', 'sheet__eyebrow', 'Strictly Private and Confidential'));
    top.appendChild(el('h3', 'sheet__t', '인천 남동 데이터센터 개발사업'));
    top.appendChild(el('div', 'sheet__sub', 'Investment Memorandum · 20 Investment Conclusion'));
    page.appendChild(top);

    /* 무게중심 — **그림 자리의 크기가 실제로 달라진다.** 말로만 다르면 고를 이유가 없다 */
    var share = D.id === 'text' ? 15 : D.id === 'graphic' ? 60 : 35;
    var body = el('div', 'sheet__b' + (land ? ' sheet__b--2' : ''));

    var fig = el('div', 'sheet__fig');
    fig.style.height = (land ? 34 + share : 20 + share) + '%';
    fig.appendChild(el('span', null, '표 · 차트 자리 (' + share + '%)'));
    var txt = el('div', 'sheet__txt');
    txt.appendChild(el('p', 'sheet__p', R.sample));
    if (D.id !== 'graphic') {
      txt.appendChild(el('p', 'sheet__p sheet__p--dim',
        '위 문장은 어조 견본입니다. 같은 숫자를 ' + R.name + ' 으로 적으면 이렇게 나옵니다.'));
    }
    /* 그래픽 중심이면 그림이 먼저 온다 — 차례 자체가 무게중심이다 */
    if (D.id === 'graphic') { body.appendChild(fig); body.appendChild(txt); }
    else { body.appendChild(txt); body.appendChild(fig); }
    page.appendChild(body);

    page.appendChild(el('div', 'sheet__foot',
      H.name + ' 스타일 · ' + (land ? '16:9 가로' : 'A4 세로') + ' · 견본'));
    win.appendChild(page);

    win.appendChild(el('p', 'modal__note',
      '이 지면은 **모양을 보는 견본**입니다 — 숫자는 딜의 값이 아닙니다. '
      + '고른 성격은 [이 사양으로 확정] 을 눌러야 문서에 적용됩니다.'));
    back.appendChild(win);
    return back;
  }

  /** 확정 전에 무엇이 모자란지 알려준다 */
  function specProblems() {
    var p = [];
    if (!state.projectId) p.push('프로젝트');
    if (!state.kindId) p.push('보고서 종류');
    if (!state.pages || state.pages < 1) p.push('페이지 수');
    return p;
  }

  function updateLockBar() {
    var bar = document.getElementById('lockbar');
    if (!bar) return;
    bar.textContent = '';

    if (state.locked) {
      var k = kindOf(state.kindId);
      bar.appendChild(el('div', 'locked',
        '🔒 확정됨 — ' + (k ? k.name : '') + ' · ' + state.pages + '페이지 · '
        + state.size + ' · ' + state.format + ' · ' + state.lang));
      var un = el('button', 'btn btn--ghost', '사양 수정');
      un.type = 'button';
      un.addEventListener('click', function () { state.locked = false; draw(); });
      bar.appendChild(un);
      return;
    }

    var problems = specProblems();
    var b = el('button', 'btn', '이 사양으로 확정');
    b.type = 'button';
    b.disabled = problems.length > 0;
    b.addEventListener('click', function () {
      if (!C.api) { state.locked = true; draw(); return; }
      b.disabled = true;
      b.textContent = '확정 중…';
      // 저장 → 확정. 확정은 서버가 사람 이름으로만 받아준다
      call('POST', '/projects/' + encodeURIComponent(state.projectId) + '/spec', specBody())
        .then(function () {
          return call('POST', '/projects/' + encodeURIComponent(state.projectId) + '/spec/confirm', {});
        })
        .then(function (j) {
          state.locked = !!(j.spec && j.spec.locked);
          draw();
          if (!state.locked) say('서버가 확정을 반영하지 않았습니다. 다시 시도하세요.', 'bad');
        })
        .catch(function (e) {
          // ★ 실패했는데 잠긴 것처럼 보이면 안 된다. 화면 상태를 바꾸지 않는다
          draw();
          say('사양 확정 실패 — ' + e.message, 'bad');
        });
    });
    bar.appendChild(b);
    if (problems.length) bar.appendChild(el('span', 'why', problems.join(', ') + '을(를) 먼저 정하세요.'));
  }

  // ── 3단계: 생성 ──────────────────────────────────
  function run() {
    var box = el('section', 'card');
    box.appendChild(el('h2', 'card__t', '생성'));

    var b = el('button', 'btn', '보고서 생성 시작');
    b.type = 'button';
    // ★ 사양이 잠기기 전에는 누를 수 없다
    b.disabled = !state.locked;
    b.addEventListener('click', function () { start(b); });
    box.appendChild(b);

    if (!state.locked) {
      box.appendChild(el('p', 'note',
        '출력 사양을 먼저 확정하세요. 확정 전에는 생성할 수 없습니다 — '
        + '나중에 페이지 수가 달라지면 처음부터 다시 만들어야 합니다.'));
    }
    return box;
  }

  function start(btn) {
    if (!C.api) {
      say('생성 요청은 본체 API 에 연결해야 합니다 (POST /projects/:id/reports). '
        + 'LINKPILOT_REPORTS.api 를 설정하면 이 버튼이 실제로 요청합니다.');
      return;
    }
    btn.disabled = true;
    btn.textContent = '요청 중…';
    call('POST', '/projects/' + encodeURIComponent(state.projectId) + '/reports', { docType: state.kindId })
      .then(function (j) {
        btn.textContent = '보고서 생성 시작';
        btn.disabled = false;
        // ★ 화면을 옮겨 가야 보이면 사람은 안 본다. 누른 자리에서 보여준다
        state.live = { run: j.run || null, snapshot: null, error: null, failures: 0, timer: null };
        draw();
        poll();
        loadReports();
      })
      .catch(function (e) {
        btn.textContent = '보고서 생성 시작';
        btn.disabled = false;
        say('생성 시작 실패 — ' + e.message, 'bad');
      });
  }

  /**
   * 서버에 이미 저장된 사양을 화면에 반영한다.
   * ★ 이걸 빼면 확정 후 새로고침했을 때 화면만 '미확정'으로 돌아간다.
   *   사용자는 다시 확정을 누르고, 서버는 이미 잠겨 있어 거절하거나 버전을 올린다.
   */
  function loadSpec() {
    if (!C.api || !state.projectId) return Promise.resolve();
    return call('GET', '/projects/' + encodeURIComponent(state.projectId) + '/spec')
      .then(function (j) {
        var s = j && j.spec;
        if (!s) { state.locked = false; draw(); return; }
        state.kindId = s.docType || state.kindId;
        state.pages = s.targetPages != null ? s.targetPages : state.pages;
        state.size = s.pageSize || state.size;
        state.lang = s.language || state.lang;
        state.format = (s.formats && s.formats[0]) || state.format;
        state.themeId = s.themeId || state.themeId;
        /* ★ 서버가 준 것이 이긴다 — 화면 기본값이 사양을 덮으면
         *   「확정했는데 다른 성격」이 된다 */
        ['layout', 'density', 'house', 'register'].forEach(function (k) {
          if (s[k]) state[k] = s[k];
        });
        // ★ 서버 값이 있으면 그것이 이긴다. 없을 때만 화면 기본값을 쓴다 —
        //   `s.visuals.birdseye || true` 로 쓰면 false 가 true 로 되살아난다
        state.birdseye = (s.visuals && typeof s.visuals.birdseye === 'boolean')
          ? s.visuals.birdseye : state.birdseye;
        state.cadastral = (s.visuals && typeof s.visuals.cadastral === 'boolean')
          ? s.visuals.cadastral : state.cadastral;
        state.locked = !!s.locked;
        draw();
      })
      .catch(function (e) {
        // 사양을 못 읽었으면 잠긴 척하지 않는다. 미확정으로 두고 사실을 알린다
        state.locked = false;
        draw();
        say('출력 사양을 불러오지 못했습니다 — ' + e.message, 'bad');
      });
  }

  /** 산출물 목록을 서버에서 다시 받는다 (파일 존재 여부로 판정된 결과) */
  function loadReports() {
    if (!C.api || !state.projectId) return;
    call('GET', '/projects/' + encodeURIComponent(state.projectId) + '/reports')
      .then(function (j) {
        C.recent = (j.files || []).map(function (f) {
          var blocked = j.distribution && j.distribution.blocked;
          return {
            name: f.name, path: f.path, at: f.at,
            status: blocked ? 'blocked' : 'ok',
            note: blocked ? (j.distribution.reasons || []).join(' / ') : '',
          };
        });
        draw();
      })
      .catch(function (e) {
        // 목록을 못 받았다고 화면을 비우지 않는다. 못 받았다는 사실만 알린다
        say('산출물 목록을 불러오지 못했습니다 — ' + e.message, 'bad');
      });
  }

  // ── 최근 생성물 ──────────────────────────────────
  /**
   * ★★★ **「열기」가 아무것도 안 열고 있었다** 〈2026-08-23 사장님 화면〉.
   *
   *   보고서 일곱이 다 「완료」로 나왔는데 [열기] 를 누르면
   *   **「09_IM/im.md 를 열 수 없습니다. 서버(api) 연결을 확인하세요.」**
   *
   *   원인: 아래 클릭 처리가 `if (printable && openPrint(r)) return;` 이었다.
   *   `printable` 은 **`.html` 일 때만 참**이다. 그러니 `.md`·`.json` 은
   *   **여는 시도조차 없이** 곧장 오류 문구로 떨어졌다 — 서버는 멀쩡했다.
   *   ★ 게다가 문구가 **서버 탓으로 단정**했다. 우리가 안 부른 것을 서버 탓으로
   *     적으면 사람은 없는 고장을 찾으러 간다 (M-24 · M-28 과 같은 결).
   *
   * ★ 그래서 하나로 합쳤다. **여는 것은 똑같고, 인쇄창을 띄우느냐만 다르다.**
   *   〈2026-08-24: 그 다음 판에서 여는 일 자체를 브라우저에 넘겼다 — 아래.〉
   */
  /**
   * ★★★ **못 열었을 때 「누를 수 있는 것」을 준다** 〈2026-08-24〉.
   *
   *   앞 판은 주소를 **글자로** 적어 두고 「외부 브라우저에서 다시 열어 주세요」
   *   라고 했다. 그런데 그 주소는 상대 경로였고, 글자는 누를 수도 없다 —
   *   **시키는 대로 해도 안 되는 안내**였다.
   *
   * ★ 그래서 링크를 만든다. 링크는 **사용자가 직접 누르는 것**이라 팝업
   *   차단기가 막지 않는다. 주소는 절대 주소로 적는다.
   */
  function cantOpenNote(url, where) {
    var n = el('p', 'note note--bad');
    n.id = 'out-note';
    var head = where.kind === 'inapp'
      ? where.name + ' 안에서는 새 창이 안 열립니다. '
      : where.kind === 'framed'
        ? '앱 화면 안에서는 새 창이 막힐 수 있습니다. '
        : '브라우저가 새 창을 막았습니다. ';
    n.appendChild(document.createTextNode(head + '아래 주소를 눌러 여십시오.'));
    var a = el('a', null, url);
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.style.display = 'block';
    a.style.marginTop = '8px';
    a.style.wordBreak = 'break-all';
    n.appendChild(a);
    return n;
  }

  /**
   * ★★★ **여는 일을 브라우저에 맡긴다** 〈2026-08-24 사장님 화면〉.
   *
   *   앞 판은 `window.open` 을 불렀다. 이 화면은 앱 안의 **틀(iframe)** 에서
   *   도는데, 틀 안에서 스크립트가 부르는 새 창은 **브라우저가 막는다.**
   *   그러면 「팝업이 차단되었습니다」만 남고 **아무것도 안 열린다.**
   *
   * ★ 사람이 누른 링크는 안 막힌다. 그래서 단추를 **진짜 링크**로 만들고,
   *   여는 것은 브라우저가 하게 둔다 — 우리가 `window.open` 을 부르는 것은
   *   **인쇄창까지 띄워야 할 때뿐**이고, 그때도 막히면 **링크의 원래 동작이
   *   그대로 이어진다** (막지 않는다).
   *
   * @returns {boolean} 우리가 처리했으면 true (그러면 링크의 기본 동작을 막는다)
   */
  /**
   * ★★★ **새 탭에는 인증이 안 붙는다** 〈2026-08-25 사장님 화면:
   *   「로그인이 필요합니다」가 JSON 으로 그대로 떴다〉.
   *
   *   앞 판에서 단추를 링크로 바꿔 **열리기는 했다.** 그런데 열린 탭이
   *   서버에 거절당했다 — 이 화면은 앱이 넘긴 자격으로 API 를 부르는데
   *   **새 탭은 그 자격을 안 들고 간다.**
   *
   * ★ 그래서 **화면이 직접 받아 온다.** 화면 안에서 부르는 길은 이미 인증이
   *   되어 있다(값·목록이 그 길로 들어온다). 받아 온 것을 blob 으로 만들어
   *   열면 자격 문제가 아예 없어진다.
   * ★ 실패하면 **서버가 말한 까닭을 그대로 적는다.** 앞 판처럼 「팝업이
   *   차단됐다」로 단정하지 않는다 — 이번 것은 팝업이 아니라 인증이었다.
   */
  /**
   * ★★★ **글자가 깨져 나왔다** 〈2026-08-25 사장님 화면 · 내가 만든 회귀〉.
   *
   *   어제 「새 탭에 자격이 안 붙는다」(M-33)를 고치면서 `r.blob()` 으로
   *   바꿨다. 그런데 **blob 으로 열면 글자표(charset)가 사라진다** —
   *   서버는 `charset=utf-8` 을 보내는데, `text/markdown` 처럼 브라우저가
   *   렌더 규칙을 모르는 형식은 그 딱지를 **무시하고 기본 인코딩으로 그린다.**
   *   그래서 IM 본문이 통째로 `蹂묒뿭` 처럼 나왔다.
   *
   * ★★ **문서가 안 열리는 것보다 나쁘다.** 열리기는 하니 사람은 「생성이
   *   깨졌다」고 읽는다 — 실제로 사장님이 「결과물은 오류·버그 투성이」라고
   *   하셨다. 멀쩡한 문서인데 보는 길만 틀렸다.
   *
   * ★ 그래서 **글자 파일은 글자로 받아 다시 담는다.** `r.text()` 는 응답의
   *   charset 을 제대로 쓰고, `new Blob([문자열])` 은 **언제나 UTF-8 로** 넣는다.
   *   딱지도 브라우저가 확실히 아는 것으로 바꿔 단다.
   * ★ PDF 같은 이진 파일은 그대로 blob 으로 받는다 — 글자로 바꾸면 깨진다.
   */
  function textTypeFor(path) {
    var p = String(path || '').toLowerCase();
    if (/\.html?$/.test(p)) return 'text/html; charset=utf-8';
    if (/\.json$/.test(p)) return 'application/json; charset=utf-8';
    if (/\.(md|txt|csv|log|svg)$/.test(p)) return 'text/plain; charset=utf-8';
    return null;   // 이진 파일
  }

  function fetchAsBlob(url, relPath) {
    return fetch(url, { credentials: 'same-origin' }).then(function (r) {
      if (!r.ok) {
        return r.text().then(function (t) {
          var msg = '';
          try { msg = (JSON.parse(t) || {}).error || ''; } catch (_) { msg = ''; }
          throw new Error(msg || ('HTTP ' + r.status));
        });
      }
      var type = textTypeFor(relPath);
      if (!type) return r.blob();
      return r.text().then(function (t) { return new Blob([t], { type: type }); });
    });
  }

  /* ★ 〈2026-08-25〉 `openForPrint` 를 지웠다. 새 탭에 자격이 안 붙는 것이
   *   드러나(M-33 재발) **화면이 직접 받아 오는 길**로 바꿨고, 인쇄창도 그
   *   길에서 띄운다. 쓰지 않는 함수를 남겨 두면 다음 사람이 그쪽을 고친다. */


  /**
   * 못 연 이유를 **갈라서** 말한다. 「서버 연결을 확인하세요」 한 줄로 두면
   * 멀쩡한 서버를 뒤지게 된다 — 실제로 그렇게 만들었었다.
   */
  function whyCantOpen() {
    if (!state.projectId) return '프로젝트가 지정되지 않았습니다 — 위에서 프로젝트를 먼저 고르십시오.';
    if (typeof C.fileUrl !== 'function' && !C.api) {
      return '앱이 이 화면에 서버 주소를 넘기지 않았습니다 — 화면 밖에서 열면 파일을 받아올 곳이 없습니다.';
    }
    return '파일 주소를 만들지 못했습니다 (경로가 비어 있습니다).';
  }

  function recent() {
    var box = el('section', 'card');
    box.appendChild(el('h2', 'card__t', '최근 생성물'));
    var rows = C.recent || [];
    if (!rows.length) {
      box.appendChild(el('p', 'empty', '아직 생성한 보고서가 없습니다.'));
      return box;
    }
    rows.forEach(function (r) {
      var row = el('div', 'out');
      var mid = el('div');
      add(mid, el('div', 'out__n', r.name), el('div', 'out__m', r.path + ' · ' + r.at));
      // ★ 차단된 산출물을 정상처럼 보이게 하지 않는다. 이유까지 적는다
      if (r.status === 'blocked' && r.note) mid.appendChild(el('div', 'out__m', r.note));
      add(row, el('div', 'out__ic', r.status === 'blocked' ? '⛔' : '📄'), mid);

      var st = el('span', 'st st--' + (r.status === 'blocked' ? 'blocked' : r.status === 'running' ? 'run' : 'ok'),
        r.status === 'blocked' ? '배포 차단' : r.status === 'running' ? '생성 중' : '완료');
      st.style.marginLeft = 'auto';
      row.appendChild(st);

      // 지침 §7-3 은 '[인쇄 · PDF 저장]으로 저장하거나 인쇄'다.
      // PDF 를 서버에서 만들지 않으므로(형식 목록 참고) A4 인쇄본을 브라우저로 인쇄한다
      var printable = r.status !== 'blocked' && /\.html?$/i.test(r.path || '');
      /* ★ 주소가 없을 때 빈 문자열을 절대 주소로 바꾸면 **이 페이지 자신**이
       *   된다 — 누르면 화면이 새로고침되고 파일은 안 열린다. 없으면 없는 채로 둔다 */
      var raw = r.status === 'blocked' ? null : fileUrlFor(r.path);
      var url = raw ? absUrl(raw) : null;

      /* ★★★ **누를 것을 진짜 링크로 만든다** 〈2026-08-24〉.
       *   앱 화면은 틀(iframe) 안에서 돈다. 틀 안에서 스크립트가 여는 새 창은
       *   브라우저가 막지만, **사람이 누른 링크는 안 막는다.** 그래서 여는 일을
       *   브라우저에 맡기고, 우리는 인쇄창이 필요할 때만 끼어든다. */
      var isLink = r.status !== 'blocked' && !!url;
      var a = el(isLink ? 'a' : 'button', 'out__a',
        r.status === 'blocked' ? '사유 보기' : printable ? '인쇄 · PDF 저장' : '열기');
      if (isLink) {
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener';
      } else {
        a.type = 'button';
      }
      a.addEventListener('click', function (ev) {
        var old = document.getElementById('out-note');
        if (old) old.remove();

        if (r.status === 'blocked') {
          var b = el('p', 'note',
            (r.note || '검증을 통과하지 못했습니다.') + ' — 검증 화면에서 해소해야 배포할 수 있습니다.');
          b.id = 'out-note';
          view.appendChild(b);
          return;
        }

        /* ★ 주소를 못 만들면 **왜 못 만들었는지**를 갈라서 적는다.
         *   「서버 연결을 확인하세요」로 두면 멀쩡한 서버를 뒤지게 된다 */
        if (!url) {
          var n = el('p', 'note', r.path + ' 를 열 수 없습니다 — ' + whyCantOpen());
          n.id = 'out-note';
          view.appendChild(n);
          return;
        }

        /* ★★★ **우리가 받아서 연다** 〈2026-08-25 · M-33 의 재발〉.
         *   링크를 그대로 따라가면 새 탭에 자격이 안 붙어 서버가 거절한다.
         *   화면 안에서 부르는 길은 이미 인증돼 있으므로 그쪽으로 받아 온다. */
        if (ev && ev.preventDefault) ev.preventDefault();

        var busy = el('p', 'note', r.name + ' 을 받아오는 중입니다…');
        busy.id = 'out-note';
        view.appendChild(busy);

        fetchAsBlob(url, r.path).then(function (blob) {
          var b = URL.createObjectURL(blob);
          var w = null;
          try { w = window.open(b, '_blank', 'noopener'); } catch (_) { w = null; }
          if (w) {
            if (printable) {
              try {
                w.addEventListener('load', function () { try { w.print(); } catch (e) { /* 사용자가 직접 */ } });
              } catch (e) { /* 교차출처면 접근이 막힌다 */ }
            }
            var ok = document.getElementById('out-note');
            if (ok) ok.remove();
          } else {
            /* ★ 새 창이 막혔다 — 이제는 **자격이 붙은 주소**라 눌러서 열린다 */
            var n = document.getElementById('out-note');
            if (n) n.remove();
            view.appendChild(cantOpenNote(b, whereAreWe()));
          }
          /* ★ 바로 지우면 열리기 전에 사라진다. 넉넉히 두고 놓아 준다 */
          setTimeout(function () { try { URL.revokeObjectURL(b); } catch (_) {} }, 120000);
        }).catch(function (e) {
          var n = document.getElementById('out-note');
          if (n) n.remove();
          var bad = el('p', 'note note--bad',
            r.path + ' 을 못 받았습니다 — ' + e.message
            + (/로그인/.test(e.message) ? ' (앱에 다시 로그인하시면 열립니다)' : ''));
          bad.id = 'out-note';
          view.appendChild(bad);
        });
      });
      row.appendChild(a);
      box.appendChild(row);
    });
    return box;
  }

  // ── 렌더 ─────────────────────────────────────────
  /* ── 제작 진행 (생성 클릭 뒤 그 자리에서 보여준다) ─────────
   *
   * ★ 전에는 "진행 상황은 IM 제작현황 화면에서 확인하세요" 로 끝났다. 화면을
   *   옮겨 가야 보이면 사람은 안 본다 — 그리고 안 보는 동안 RED FLAG 가 떠도
   *   모른다. 누른 자리에서 보여준다.
   */
  function live() {
    var L = window.LinkPilotLive;
    if (!L || !state.live) return null;
    var v = L.viewFrom(state.live);

    var box = el('section', 'card');
    box.id = 'live';

    var head = el('div', 'live__h');
    head.appendChild(el('h2', 'card__t', '제작 진행'));
    var badge = el('span', 'live__st live__st--' + v.state, v.headline);
    head.appendChild(badge);
    box.appendChild(head);
    /* ★ 멈춘 까닭은 **빨갛게** 머리말 바로 밑에 놓는다. 회색 안내문으로 적으면
     *   「그냥 설명」으로 읽혀 넘어간다 (2026-08-24 · 까닭이 아예 없던 자리다). */
    if (v.note) {
      var nt = el('p', 'card__s', v.note);
      if (v.stopped && v.stopped.length) {
        nt.style.background = 'var(--bad-soft, #fdecec)';
        nt.style.color = 'var(--bad-ink, #C00000)';
        nt.style.padding = '10px 12px';
        nt.style.borderRadius = '8px';
        nt.style.fontWeight = '700';
      }
      box.appendChild(nt);
    }

    // 진행률 — ★ 모를 때는 막대를 그리지 않는다. 0% 막대는 '멈춰 있다'로 읽힌다
    if (v.pct !== null) {
      var bar = el('div', 'live__bar');
      var fill = el('div', 'live__fill');
      fill.style.width = v.pct + '%';
      bar.appendChild(fill);
      var line = el('div', 'live__meter');
      line.appendChild(bar);
      line.appendChild(el('span', 'live__pct', v.pct + '%'));
      box.appendChild(line);
    }

    var meta = [];
    if (v.elapsed) meta.push('경과 ' + v.elapsed);
    if (v.remaining) meta.push('남은 예상 ' + v.remaining + ' (참고값)');
    if (meta.length) box.appendChild(el('div', 'live__meta', meta.join(' · ')));

    // 카테고리
    var list = el('div', 'live__ph');
    v.phases.forEach(function (p, i) {
      var row = el('div', 'live__p live__p--' + p.tone + (p.running ? ' on' : ''));
      row.appendChild(el('span', 'live__n', String(i + 1)));
      var mid = el('div', 'live__b');
      mid.appendChild(el('div', 'live__t', p.label));
      mid.appendChild(el('div', 'live__w', p.why));
      row.appendChild(mid);
      row.appendChild(el('span', 'live__c',
        p.done ? '완료' : (p.running ? '진행 중' : p.doneCount + '/' + p.total)));
      list.appendChild(row);
    });
    box.appendChild(list);

    // 활동 기록 — 무슨 일이 있었는지는 요약이 아니라 로그로 보여준다
    if (v.activity.length) {
      var log = el('div', 'live__log');
      v.activity.forEach(function (a) {
        var ln = el('div', 'live__ln' + (a.level === 'ERROR' ? ' bad' : (a.level === 'WARN' ? ' warn' : '')));
        ln.appendChild(el('span', 'live__at', String(a.at || '').slice(11, 19)));
        ln.appendChild(el('span', null, (a.agent ? a.agent + ' · ' : '') + a.message));
        log.appendChild(ln);
      });
      box.appendChild(log);
    }

    v.problems.forEach(function (t) {
      var n = el('p', 'note', t);
      n.style.background = 'var(--warn-soft)';
      n.style.color = 'var(--warn-ink)';
      box.appendChild(n);
    });

    return box;
  }

  /**
   * 진행 상황을 되풀이해 물어본다.
   *
   * ★ 끝나면 멈춘다. ★ 실패해도 조용히 멈추지 않는다 — 사유를 남기고 간격을
   *   늘려 다시 시도한다. 화면이 마지막 상태로 굳으면 사용자는 생성이 멈춘 줄 안다.
   */
  function poll() {
    var L = window.LinkPilotLive;
    if (!L || !state.live || !C.api || !state.projectId) return;

    call('GET', '/projects/' + encodeURIComponent(state.projectId) + '/control-tower')
      .then(function (snap) {
        state.live.snapshot = snap;
        state.live.error = null;
        state.live.failures = 0;
      })
      .catch(function (e) {
        // 404 = 아직 실행 기록이 없다. 오류가 아니라 '시작 전'이다
        if (/실행 기록이 없는/.test(e.message)) state.live.error = null;
        else state.live.error = e.message;
        state.live.failures = (state.live.failures || 0) + 1;
      })
      .then(function () {
        draw();
        var v = L.viewFrom(state.live);
        var wait = L.nextPollMs(v, state.live.failures);
        if (wait > 0) state.live.timer = setTimeout(poll, wait);
        else if (v.state === 'done') loadReports();     // 끝났으면 산출물을 다시 받는다
      });
  }

  function draw() {
    var a = G.access(C.session, C.requiredPlan);
    view.textContent = '';
    if (!a.allowed) { view.appendChild(gate(a)); return; }

    view.appendChild(steps());
    view.appendChild(pick());
    view.appendChild(spec());
    view.appendChild(run());
    var lv = live();
    if (lv) view.appendChild(lv);
    view.appendChild(recent());
    /* ★ 팝업은 **맨 뒤에** 붙인다 — 앞에 붙이면 아래 카드들이 그 위에 그려진다 */
    if (state.proof) view.appendChild(proofModal());
    updateLockBar();
  }

  draw();

  /* ★ **홀로 떴으면 돌아갈 길을 준다** 〈2026-08-29 · D-170〉.
   *   이 화면은 사이드바를 스스로 그리므로 **플랫폼처럼 보인다** — 흐름 밖에서
   *   열리면 사용자는 「여기가 어디지」가 아니라 「플랫폼이 이상하다」로 읽는다.
   *   틀 안(앱·흐름)에서는 아무것도 안 그린다. */
  try {
    var LPF = window.LinkPilotFlow;
    if (LPF) {
      /* ★★★ **앱이 나를 갈아 끼웠으면 제 껍데기를 감춘다** 〈D-173〉.
       *   앱은 화면 HTML 을 최상위 문서에 통째로 넣는다 — 그러면 사이드바·로고·
       *   단계칩이 **앱 것과 두 벌**이 된다. 주소가 제 것이 아니면 감춘다. */
      if (LPF.hideOwnChrome) LPF.hideOwnChrome('reports.html');
      if (LPF.showStranded) {
        LPF.showStranded({
          file: 'reports.html',
          projectId: (typeof projectId === 'function' ? projectId() : null),
          step: 'spec',
        });
      }
    }
  } catch (_) { /* 이 한 줄 때문에 화면이 죽지 않는다 */ }
  loadSpec();
  loadReports();

  // ── 지침 반영 ────────────────────────────────────
  // §2 유료 메뉴는 무료 계정에서도 보이되 잠긴다
  if (window.LinkPilotCatalog) window.LinkPilotCatalog.applyLocks(document, C.session);
  // §1 인앱 브라우저에서는 산출물 다운로드가 조용히 실패한다 — 여기서는 특히 치명적이다
  if (window.LinkPilotInApp) window.LinkPilotInApp.auto();

  /* ★ **판 지문을 화면에 보이게 남긴다** (CLAUDE.md §8). 속성만 있으면
     사진에 안 찍히고, 그러면 「이것이 그 판인가」를 가릴 수가 없다 */
  if (window.LinkPilotFlow && window.LinkPilotFlow.stampInto) {
    try { window.LinkPilotFlow.stampInto(document); } catch (_) {}
  }
}());
</script>
</body>
</html>
