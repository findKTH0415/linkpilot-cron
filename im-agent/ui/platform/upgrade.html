.btn { display: block; width: 100%; margin-top: 18px; padding: 14px;

.modal__t { font-size: 18px; font-weight: 800; }
.modal__x { margin-left: auto; font-size: 18px; line-height: 1; padding: 6px 10px;

.modal__bd { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.sample { background: var(--panel); border-radius: 12px; padding: 16px;

  .modal { padding: 0; }
  .modal__box { border-radius: 0; min-height: 100vh; }

@media (prefers-reduced-motion: reduce) {

    { id: 'pro', name: 'Pro', price: 29000, recommended: true,
      features: ['Free 전체', '오늘의 한줄생각', '아침브리핑', '통화음성분석',
                 '프리미엄 투자소스 DB', '신재생에너지 분석', '보고서 생성'] },
  ],
};

(function () {
  'use strict';
  var C = window.LINKPILOT_UPGRADE;
  var view = document.getElementById('view');

  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (x !== undefined && x !== null && x !== '') n.textContent = String(x);
    return n;
  }
  function add(p) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) p.appendChild(arguments[i]); return p; }
  function planOf(id) { return C.plans.filter(function (p) { return p.id === id; })[0] || null; }

  /** 날짜는 Asia/Seoul 로 명시 계산한다 */
  function todayLabel() {
    var p = new Intl.DateTimeFormat('ko-KR', {
      timeZone: 'Asia/Seoul', year: 'numeric', month: 'numeric', day: 'numeric', weekday: 'short',
    }).formatToParts(new Date());
    var g = function (t) { return (p.filter(function (x) { return x.type === t; })[0] || {}).value || ''; };
    return g('year') + '.' + g('month') + '.' + g('day') + ' (' + g('weekday') + ')';
  }

  /** ★ 환율 환산을 하지 않는다. 설정 통화 그대로 보여준다 */
  function price(p) {
    if (p === null || p === undefined || p === '') return '문의';
    if (p === 0) return '무료';
    if (typeof p !== 'number') return String(p);
    var cur = C.currency || 'KRW';
    if (cur === 'KRW') return p.toLocaleString('ko-KR') + '원';
    try {
      return new Intl.NumberFormat('en-US', {
        style: 'currency', currency: cur, minimumFractionDigits: 0, maximumFractionDigits: 0,
      }).format(p);
    } catch (e) { return cur + ' ' + p.toLocaleString('en-US'); }
  }

  document.getElementById('side-user').textContent = C.me.name || '';
  document.getElementById('head-user').textContent = C.me.name || '';
  document.getElementById('head-date').textContent = todayLabel();

  // ── 체험 배너 ────────────────────────────────────
  function trialBanner() {
    var box = el('div', 'trial');
    var t = C.trial;
    if (!t) {
      // 체험이 없으면 있는 척하지 않는다
      box.appendChild(el('div', 'trial__t', '유료 기능을 사용해 보세요'));
      box.appendChild(el('div', 'trial__s',
        '아래에서 각 기능이 무엇을 만들어 주는지 미리 볼 수 있습니다.'));
      return box;
    }
    var tp = planOf(t.planId);
    box.appendChild(el('div', 'trial__t', (tp ? tp.name : '') + ' ' + t.days + '일 무료 체험'));
    box.appendChild(el('div', 'trial__s',
      '결제 없이 ' + t.days + '일 동안 유료 기능을 그대로 써볼 수 있습니다. '
      + '체험이 끝나면 자동으로 Free 로 돌아가며, 별도로 결제되지 않습니다.'));
    var b = el('button', 'trial__b', '무료로 시작하기');
    b.type = 'button';
    b.addEventListener('click', function () { go(tp || planOf('pro'), true); });
    box.appendChild(b);
    // 자동결제 여부는 사용자가 가장 궁금해하는 부분이라 버튼 옆에 바로 적는다
    box.appendChild(el('div', 'trial__f', '카드 등록 없이 시작 · 자동 결제 없음'));
    return box;
  }

  // ── 미리 사용해보기 ──────────────────────────────
  function previewSection() {
    var box = el('section', 'card');
    box.appendChild(el('h2', 'card__t', '미리 사용해보기'));
    box.appendChild(el('p', 'card__s', '눌러서 각 기능이 무엇을 만들어 주는지 확인하세요.'));
    var grid = el('div', 'pv');

    C.previews.forEach(function (f) {
      var need = planOf(f.from);
      var b = el('button', 'pv__i');
      b.type = 'button';
      add(b, el('div', 'pv__ic', f.icon), el('div', 'pv__n', f.name),
        el('div', 'pv__l', (need ? need.name : f.from) + ' 부터'),
        el('div', 'pv__go', '미리보기 →'));
      b.addEventListener('click', function () { openPreview(f); });
      grid.appendChild(b);
    });
    box.appendChild(grid);
    return box;
  }

  function openPreview(f) {
    var need = planOf(f.from);
    var ov = el('div', 'modal');
    ov.setAttribute('role', 'dialog');
    ov.setAttribute('aria-modal', 'true');
    ov.setAttribute('aria-label', f.name + ' 미리보기');

    var box = el('div', 'modal__box');
    var hd = el('div', 'modal__hd');
    add(hd, el('span', null, f.icon), el('h3', 'modal__t', f.name));
    var x = el('button', 'modal__x', '✕');
    x.type = 'button';
    x.setAttribute('aria-label', '닫기');
    hd.appendChild(x);
    box.appendChild(hd);

    var bd = el('div', 'modal__bd');
    bd.appendChild(el('p', null, f.what));
    // ★ 예시임을 반드시 밝힌다. 실제 내 데이터로 오해하면 안 된다
    bd.appendChild(el('span', 'badge', '예시 화면 — 실제 데이터가 아닙니다'));
    bd.appendChild(el('div', 'sample', f.sample));

    var b = el('button', 'btn', (need ? need.name : '유료') + ' 플랜으로 사용하기');
    b.type = 'button';
    b.addEventListener('click', function () { shut(); go(need); });
    bd.appendChild(b);
    box.appendChild(bd);
    ov.appendChild(box);

    function shut() { ov.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(e) { if (e.key === 'Escape') shut(); }
    x.addEventListener('click', shut);
    ov.addEventListener('click', function (e) { if (e.target === ov) shut(); });
    document.addEventListener('keydown', onKey);

    document.body.appendChild(ov);
    x.focus();
  }

  // ── 플랜 ─────────────────────────────────────────
  function plansSection() {
    var box = el('section', 'card');
    box.appendChild(el('h2', 'card__t', '플랜'));
    var list = el('div', 'plans');

    C.plans.forEach(function (p) {
      var cur = p.id === C.planId;
      var c = el('article', 'plan' + (p.recommended && !cur ? ' plan--rec' : '') + (cur ? ' plan--cur' : ''));
      if (cur) c.appendChild(el('span', 'plan__tag plan__tag--cur', '현재 플랜'));
      else if (p.recommended) c.appendChild(el('span', 'plan__tag', '추천'));

      c.appendChild(el('h3', 'plan__n', p.name));
      var pr = el('div', 'plan__p', price(p.price));
      if (typeof p.price === 'number' && p.price > 0) pr.appendChild(el('small', null, ' / 월'));
      c.appendChild(pr);

      var ul = el('ul', 'plan__l');
      p.features.forEach(function (x) { ul.appendChild(el('li', null, x)); });
      c.appendChild(ul);

      var b = el('button', 'btn' + (cur ? ' btn--off' : ''), cur ? '이용 중' : '이 플랜 선택');
      b.type = 'button';
      b.disabled = cur;
      b.addEventListener('click', function () { go(p); });
      c.appendChild(b);
      list.appendChild(c);
    });
    box.appendChild(list);
    box.appendChild(el('p', 'fine',
      '가격·구성은 서버 설정에서 내려옵니다. 결제는 결제 페이지에서 진행되며 이 화면에서는 카드정보를 받지 않습니다.'));
    return box;
  }

  /** ★ 카드정보를 받지 않는다. 결제 페이지로 보낸다 */
  function go(p, isTrial) {
    if (!p) return;
    if (C.billingUrl) {
      var q = '?plan=' + encodeURIComponent(p.id) + (isTrial ? '&trial=1' : '');
      window.open(C.billingUrl + (C.billingUrl.indexOf('?') > -1 ? '&' : '') + q.slice(1), '_blank', 'noopener');
      return;
    }
    var old = document.getElementById('pay-note');
    if (old) old.remove();
    var n = el('p', 'note', p.name + (isTrial ? ' 체험' : '') + ' 선택됨 — 결제 연동이 아직 없습니다. '
      + '설정의 billingUrl 에 결제 페이지 주소를 넣으면 이 버튼이 그리로 연결됩니다.');
    n.id = 'pay-note';
    view.appendChild(n);
    n.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  view.appendChild(trialBanner());
  view.appendChild(previewSection());
  view.appendChild(plansSection());

  // ── 지침 반영 ────────────────────────────────────
  // 이 화면은 무료 회원용이다. 사이드바 유료 항목은 이미 lock 으로 적혀 있지만
  // 손으로 붙인 것이라 갈릴 수 있어 카탈로그로 한 번 더 칠한다
  if (window.LinkPilotCatalog) {
    window.LinkPilotCatalog.applyLocks(document, { authenticated: true, planId: 'free' });
  }
  if (window.LinkPilotInApp) window.LinkPilotInApp.auto();
}());
</script>
</body>
</html>
