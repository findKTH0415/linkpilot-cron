<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkPilot</title>
<style>
/*
 * controlTower.css — Control Tower 스타일.
 *
 * ★ 색을 하드코딩하지 않는다. 전부 theme.css 가 정의하는 CSS 변수를 쓴다.
 *   프로젝트 테마를 바꾸면 이 화면도 같이 바뀌어야 한다 — '한 프로젝트 = 한 디자인'.
 *   theme.css 를 로드하지 않은 경우를 위해 institutional 값을 폴백으로 둔다.
 */

.lp-ct {
  --ct-primary: var(--lp-primary, #10233C);
  --ct-primary-mid: var(--lp-primary-mid, #35506F);
  --ct-accent: var(--lp-accent, #A6813C);
  --ct-accent-light: var(--lp-accent-light, #C9A15A);
  --ct-on-primary: var(--lp-on-primary, #F3E3C4);
  --ct-surface: var(--lp-surface, #FFFFFF);
  --ct-surface-alt: var(--lp-surface-alt, #F7F5F0);
  --ct-track: var(--lp-track, #EDE9E0);
  --ct-rule: var(--lp-rule-weak, #E4DFD4);
  --ct-rule-strong: var(--lp-rule-strong, #D8D2C6);
  --ct-body: var(--lp-body, #2E3949);
  --ct-muted: var(--lp-muted, #6E7A8C);
  --ct-faint: var(--lp-faint, #8A8578);
  --ct-bad: var(--lp-negative, #B4453A);

  font-family: var(--lp-font-sans, 'Noto Sans KR', system-ui, sans-serif);
  color: var(--ct-body);
  background: var(--ct-surface);
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 20px;
}

/* 상태 톤 — 컴포넌트는 tone 클래스만 붙이고 색은 여기서 정한다 */
.lp-ct__tone--ok { color: var(--ct-primary); }
.lp-ct__tone--active { color: var(--ct-accent); }
.lp-ct__tone--warn { color: var(--ct-accent); }
.lp-ct__tone--bad { color: var(--ct-bad); }
.lp-ct__tone--idle { color: var(--ct-faint); }

/* ── 헤더 ───────────────────────────────────────────── */
.lp-ct__header {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 20px; flex-wrap: wrap;
  border-top: 3px solid var(--ct-primary);
  border-bottom: 1px solid var(--ct-rule-strong);
  padding: 14px 0;
}
.lp-ct__eyebrow {
  margin: 0 0 6px; font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--ct-accent); font-weight: 600;
}
.lp-ct__title {
  margin: 0; font-family: var(--lp-font-serif, 'Noto Serif KR', serif);
  font-weight: 500; font-size: 26px; line-height: 1.2; color: var(--ct-primary);
}
.lp-ct__meta { margin: 6px 0 0; font-size: 12px; color: var(--ct-muted); }
.lp-ct__header-right { text-align: right; }
.lp-ct__health {
  display: inline-flex; flex-direction: column; align-items: flex-end;
  font-size: 13px; font-weight: 600;
}
.lp-ct__health small { font-weight: 400; font-size: 11px; color: var(--ct-muted); }
.lp-ct__timing { margin: 8px 0 0; font-size: 11.5px; color: var(--ct-muted); }
.lp-ct__stale { margin: 6px 0 0; font-size: 11px; color: var(--ct-bad); }

/* ── 패널 공통 ──────────────────────────────────────── */
.lp-ct__panel {
  border-top: 2px solid var(--ct-primary);
  background: var(--ct-surface);
  padding: 14px 0 18px;
}
.lp-ct__panel--blocked { border-top-color: var(--ct-bad); }
.lp-ct__panel--ok { border-top-color: var(--ct-primary); }
.lp-ct__panel-title {
  display: flex; align-items: baseline; gap: 10px;
  margin: 0 0 12px; font-family: var(--lp-font-serif, 'Noto Serif KR', serif);
  font-size: 15.5px; font-weight: 500; color: var(--ct-primary);
}
.lp-ct__panel-no {
  font-size: 10px; letter-spacing: .16em; color: var(--ct-accent); font-weight: 600;
}
.lp-ct__panel-sub { margin-left: auto; font-size: 11px; color: var(--ct-muted); font-family: var(--lp-font-sans, sans-serif); }
.lp-ct__muted { color: var(--ct-muted); font-size: 12.5px; margin: 0; }
.lp-ct__error { color: var(--ct-bad); font-size: 12.5px; margin: 0; }
.lp-ct__footnote { margin: 10px 0 0; font-size: 10.5px; line-height: 1.6; color: var(--ct-faint); }
.lp-ct__link {
  background: none; border: none; padding: 0 0 0 6px; cursor: pointer;
  color: var(--ct-accent); font-size: inherit; text-decoration: underline;
}

/* ── ① 전체 진행률 ──────────────────────────────────── */
.lp-ct__overall { display: flex; align-items: center; gap: 16px; }
.lp-ct__overall-value {
  font-family: var(--lp-font-serif, 'Noto Serif KR', serif);
  font-size: 42px; line-height: 1; color: var(--ct-primary);
  font-variant-numeric: tabular-nums;
}
.lp-ct__overall-value span { font-size: 18px; margin-left: 2px; }
.lp-ct__overall-bar { flex: 1; height: 14px; background: var(--ct-track); }
.lp-ct__overall-bar > span { display: block; height: 100%; background: var(--ct-primary); transition: width .4s ease; }

.lp-ct__tracks { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
.lp-ct__track-head { display: flex; align-items: baseline; gap: 8px; font-size: 11.5px; }
.lp-ct__track-label { color: var(--ct-primary); font-weight: 600; }
.lp-ct__track-weight { color: var(--ct-faint); font-size: 10.5px; }
.lp-ct__track-pct { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ct-body); font-weight: 600; }
.lp-ct__track-bar { height: 7px; background: var(--ct-track); margin-top: 4px; }
.lp-ct__track-bar > span { display: block; height: 100%; background: var(--ct-primary-mid); transition: width .4s ease; }
.lp-ct__track--validation .lp-ct__track-bar > span { background: var(--ct-accent); }
.lp-ct__track--approval .lp-ct__track-bar > span { background: var(--ct-accent-light); }
.lp-ct__track-detail { margin: 3px 0 0; font-size: 10.5px; color: var(--ct-muted); }

.lp-ct__notice {
  margin: 12px 0 0; padding: 8px 0 8px 12px;
  border-left: 2px solid var(--ct-accent);
  font-size: 11.5px; line-height: 1.7; color: var(--ct-body);
}
.lp-ct__notice--warn { border-left-color: var(--ct-accent); background: var(--ct-surface-alt); padding-right: 12px; }
.lp-ct__notice--bad { border-left-color: var(--ct-bad); color: var(--ct-bad); }
.lp-ct__notice strong { color: var(--ct-primary); margin-right: 6px; }
.lp-ct__notice--bad strong { color: var(--ct-bad); }

/* ── 그리드 ─────────────────────────────────────────── */
.lp-ct__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }

/* ── ② Agent ────────────────────────────────────────── */
.lp-ct__agents { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lp-ct__agent {
  display: grid;
  grid-template-columns: 16px minmax(120px, 1.4fr) 60px 82px 52px;
  align-items: center; gap: 8px; font-size: 11.5px;
  padding-bottom: 5px; border-bottom: .5px solid var(--ct-rule);
}
.lp-ct__agent-icon { text-align: center; }
.lp-ct__agent-name { display: flex; flex-direction: column; color: var(--ct-body); }
.lp-ct__agent-name small { font-size: 9.5px; color: var(--ct-faint); }
.lp-ct__agent-bar { height: 5px; background: var(--ct-track); display: block; }
.lp-ct__agent-bar > span { display: block; height: 100%; background: currentColor; }
.lp-ct__agent-status { font-size: 10px; letter-spacing: .06em; }
.lp-ct__agent-time { font-size: 10px; color: var(--ct-faint); text-align: right; font-variant-numeric: tabular-nums; }
.lp-ct__agent-activity {
  grid-column: 2 / -1; font-size: 10.5px; color: var(--ct-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ── ③ 검증 ─────────────────────────────────────────── */
.lp-ct__score { display: flex; align-items: baseline; gap: 8px; }
.lp-ct__score-value {
  font-family: var(--lp-font-serif, serif); font-size: 34px; color: var(--ct-primary);
  font-variant-numeric: tabular-nums;
}
.lp-ct__score-max { font-size: 13px; color: var(--ct-muted); }
.lp-ct__score-status { margin-left: auto; font-size: 11.5px; font-weight: 600; }
.lp-ct__severity {
  list-style: none; margin: 12px 0 0; padding: 0;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--ct-rule);
}
.lp-ct__severity li {
  background: var(--ct-surface); padding: 8px 6px; text-align: center; font-size: 10px;
  letter-spacing: .08em;
}
.lp-ct__severity b {
  display: block; font-family: var(--lp-font-serif, serif); font-size: 18px;
  font-variant-numeric: tabular-nums;
}

/* ── ④ 산출물 ───────────────────────────────────────── */
.lp-ct__files { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 11.5px; }
.lp-ct__files li { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; }
.lp-ct__file-label { color: var(--ct-body); }
.lp-ct__files code { font-size: 10px; color: var(--ct-faint); }

/* ── 활동 로그 ──────────────────────────────────────── */
.lp-ct__filters { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.lp-ct__filter {
  background: none; border: 1px solid var(--ct-rule-strong); padding: 3px 9px;
  font-size: 10.5px; color: var(--ct-muted); cursor: pointer;
}
.lp-ct__filter.is-active { border-color: var(--ct-primary); color: var(--ct-primary); font-weight: 600; }
.lp-ct__log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 260px; overflow-y: auto; }
.lp-ct__log li {
  display: grid; grid-template-columns: 58px 128px 1fr auto; gap: 8px;
  font-size: 11px; padding-bottom: 4px; border-bottom: .5px solid var(--ct-rule);
}
.lp-ct__log time { color: var(--ct-faint); font-variant-numeric: tabular-nums; }
.lp-ct__log-agent { color: var(--ct-primary); }
.lp-ct__log-msg { color: var(--ct-body); overflow: hidden; text-overflow: ellipsis; }
.lp-ct__log-records { color: var(--ct-faint); font-size: 10px; }

/* ── 사용자 조치 ────────────────────────────────────── */
.lp-ct__actions { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 6px; font-size: 11.5px; }
.lp-ct__actions li { display: grid; grid-template-columns: 34px 1fr; gap: 8px; color: var(--ct-bad); }
.lp-ct__actions span { color: var(--ct-faint); font-size: 10px; }
.lp-ct__approve {
  background: var(--ct-primary); color: var(--ct-on-primary); border: none;
  padding: 9px 20px; font-size: 12px; letter-spacing: .06em; cursor: pointer;
}
.lp-ct__approve:disabled { background: var(--ct-track); color: var(--ct-faint); cursor: not-allowed; }

/* ── 계보 모달 ──────────────────────────────────────── */
.lp-ct__modal {
  position: fixed; inset: 0; background: rgba(16, 35, 60, .45);
  display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
}
.lp-ct__modal-box {
  background: var(--ct-surface); max-width: 720px; width: 100%;
  max-height: 84vh; overflow-y: auto; padding: 20px;
  border-top: 3px solid var(--ct-primary);
}
.lp-ct__modal-head { display: flex; justify-content: space-between; align-items: center; }
.lp-ct__modal-head h2 {
  margin: 0; font-family: var(--lp-font-serif, serif); font-size: 18px; color: var(--ct-primary);
}
.lp-ct__close { background: none; border: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--ct-muted); }
.lp-ct__lineage-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font-size: 12px; margin: 14px 0; }
.lp-ct__lineage-head code { font-size: 10.5px; color: var(--ct-faint); }
.lp-ct__lineage-value { font-family: var(--lp-font-serif, serif); font-size: 18px; color: var(--ct-primary); }
.lp-ct__grade {
  border: 1px solid var(--ct-rule-strong); padding: 1px 6px; font-size: 10px; font-weight: 600;
}
.lp-ct__grade--A { border-color: var(--ct-primary); color: var(--ct-primary); }
.lp-ct__grade--E { border-color: var(--ct-bad); color: var(--ct-bad); }

.lp-ct__chain { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--ct-primary); }
.lp-ct__chain li { padding: 8px 0 8px 12px; font-size: 11.5px; position: relative; }
.lp-ct__chain li.is-rejected { border-left: 2px dashed var(--ct-rule-strong); margin-left: -14px; padding-left: 24px; color: var(--ct-faint); }
.lp-ct__chain-stage {
  display: inline-block; font-size: 9.5px; letter-spacing: .14em;
  color: var(--ct-accent); font-weight: 600; margin-right: 8px;
}
.lp-ct__chain-label { color: var(--ct-body); }
.lp-ct__chain-label em { color: var(--ct-bad); font-style: normal; font-size: 10.5px; }
.lp-ct__chain-detail { display: block; font-size: 10.5px; color: var(--ct-muted); margin-top: 2px; }
.lp-ct__chain-value { display: block; font-size: 11px; color: var(--ct-primary); font-variant-numeric: tabular-nums; }

.lp-ct__impact { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--ct-rule-strong); font-size: 11.5px; }
.lp-ct__impact h3 { margin: 0 0 8px; font-family: var(--lp-font-serif, serif); font-size: 14px; color: var(--ct-primary); }
.lp-ct__impact-order { color: var(--ct-accent); }
.lp-ct__impact-values { color: var(--ct-muted); line-height: 1.7; }
.lp-ct__impact-docs { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 3px; }
.lp-ct__impact-docs code { font-size: 10.5px; color: var(--ct-faint); }

.lp-ct__footer {
  display: flex; justify-content: space-between; align-items: center;
  border-top: .5px solid var(--ct-rule); padding-top: 10px;
  font-size: 10.5px; color: var(--ct-faint);
}

@media (max-width: 640px) {
  .lp-ct { padding: 14px; }
  .lp-ct__grid { grid-template-columns: 1fr; }
  .lp-ct__agent { grid-template-columns: 16px 1fr 50px; }
  .lp-ct__agent-status, .lp-ct__agent-time { display: none; }
  .lp-ct__log li { grid-template-columns: 52px 1fr; }
  .lp-ct__log-agent, .lp-ct__log-records { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .lp-ct__overall-bar > span, .lp-ct__track-bar > span { transition: none; }
}

/*
 * app.css — LinkPilot 플랫폼 화면.
 *
 * 색은 controlTower.css 가 정의한 테마 변수를 그대로 쓴다.
 * 여기서 색을 새로 만들면 대시보드와 플랫폼이 따로 논다.
 * 폰트는 CLAUDE.md §6 규칙(Arial / 맑은 고딕)을 따른다.
 */

.lp-app {
  font: 400 15px/1.6 Arial, 'Malgun Gothic', '맑은 고딕', sans-serif;
  color: var(--lp-body, #1d2b3a);
  background: var(--lp-bg, #f7f8fa);
  min-height: 100vh;
}

/* ── 헤더 ───────────────────────────────────────────────── */

.lp-header {
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  padding: 16px 24px;
  background: var(--lp-surface, #fff);
  border-bottom: 2px solid var(--lp-primary, #16304f);
  position: sticky; top: 0; z-index: 20;
}
.lp-brand { display: flex; align-items: baseline; gap: 14px; margin-right: auto; }
.lp-brand__name {
  font-size: 20px; font-weight: 700; letter-spacing: .02em;
  color: var(--lp-primary, #16304f);
}
.lp-brand__date { font-size: 13px; color: var(--lp-body2, #4a5a70); }

.lp-nav { display: flex; gap: 4px; flex-wrap: wrap; }
.lp-nav__btn {
  font: 600 14px/1 Arial, 'Malgun Gothic', sans-serif;
  padding: 9px 16px; border: 1px solid transparent; border-radius: 3px;
  background: none; color: var(--lp-body2, #4a5a70); cursor: pointer;
}
.lp-nav__btn:hover { background: var(--lp-bg, #f7f8fa); }
.lp-nav__btn.is-active {
  background: var(--lp-primary, #16304f); color: #fff;
}

.lp-mine {
  display: flex; align-items: center; gap: 8px;
  font: 600 13px/1 Arial, 'Malgun Gothic', sans-serif;
  padding: 9px 14px; border: 1px solid var(--lp-rule, #d7dde5); border-radius: 3px;
  background: var(--lp-surface, #fff); color: var(--lp-body, #1d2b3a); cursor: pointer;
}
.lp-mine:hover { border-color: var(--lp-primary, #16304f); }
.lp-mine__plan {
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  padding: 3px 7px; border-radius: 2px;
  background: var(--lp-primary, #16304f); color: #fff;
}
.lp-mine__plan--bad { background: var(--lp-bad, #c00000); }

/* ── 본문 ───────────────────────────────────────────────── */

.lp-main { max-width: 1400px; margin: 0 auto; padding: 24px 20px 72px; }

.lp-banner {
  margin: 0 0 18px; padding: 12px 16px;
  border-left: 4px solid var(--lp-warn, #8a6d1f);
  background: var(--lp-surface, #fff);
  font-size: 14px; color: var(--lp-body, #1d2b3a);
}
.lp-banner--bad { border-left-color: var(--lp-bad, #c00000); }

.lp-grid {
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  align-items: start;
}
.lp-grid--contacts { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

.lp-card {
  background: var(--lp-surface, #fff);
  border: 1px solid var(--lp-rule, #d7dde5);
  border-radius: 3px; padding: 18px 20px;
}
.lp-card--urgent { border-top: 3px solid var(--lp-bad, #c00000); }
.lp-card__title {
  display: flex; align-items: center; gap: 10px;
  margin: 0 0 14px; font-size: 13px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--lp-primary, #16304f);
}
.lp-card__count {
  font-size: 11px; padding: 2px 7px; border-radius: 10px;
  background: var(--lp-bg, #f7f8fa); color: var(--lp-body2, #4a5a70);
  letter-spacing: 0;
}

.lp-list { list-style: none; margin: 0; padding: 0; }
.lp-item { padding: 10px 0; border-top: 1px solid var(--lp-rule, #d7dde5); }
.lp-item:first-child { border-top: 0; padding-top: 0; }
.lp-item__head { display: flex; gap: 10px; align-items: baseline; }
.lp-item__title { font-weight: 600; }
.lp-item__sub { margin-top: 4px; font-size: 13px; color: var(--lp-body2, #4a5a70); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.lp-item__memo { color: var(--lp-body2, #4a5a70); }
.lp-time { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--lp-primary, #16304f); }
.lp-muted { color: var(--lp-body2, #4a5a70); }

.lp-empty { margin: 0; padding: 14px 0; font-size: 14px; color: var(--lp-body2, #4a5a70); }
/* ★ 비어 있음과 못 가져옴은 다르게 보여야 한다 */
.lp-empty--failed { color: var(--lp-bad, #c00000); font-weight: 600; }

.lp-chip {
  display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 2px;
  background: var(--lp-bg, #f7f8fa); color: var(--lp-body2, #4a5a70);
  border: 1px solid var(--lp-rule, #d7dde5);
}
.lp-chip--soft { background: transparent; }
.lp-chip--today { border-color: var(--lp-warn, #8a6d1f); color: var(--lp-warn, #8a6d1f); font-weight: 700; }
.lp-chip--over { border-color: var(--lp-bad, #c00000); color: var(--lp-bad, #c00000); font-weight: 700; }
.lp-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

.lp-link { color: var(--lp-primary, #16304f); text-decoration: none; border-bottom: 1px solid currentColor; }
.lp-link:hover { opacity: .75; }

.lp-btn {
  display: inline-block; margin-top: 12px;
  font: 600 13px/1 Arial, 'Malgun Gothic', sans-serif;
  padding: 9px 16px; border: 1px solid var(--lp-rule, #d7dde5); border-radius: 3px;
  background: var(--lp-surface, #fff); color: var(--lp-body, #1d2b3a);
  text-decoration: none; cursor: pointer;
}
.lp-btn--tel { border-color: var(--lp-primary, #16304f); color: var(--lp-primary, #16304f); }
.lp-btn--primary { background: var(--lp-primary, #16304f); color: #fff; border-color: var(--lp-primary, #16304f); width: 100%; }
.lp-btn--primary:disabled { background: var(--lp-bg, #f7f8fa); color: var(--lp-body2, #4a5a70); border-color: var(--lp-rule, #d7dde5); cursor: not-allowed; }

/* ── 도구줄 ─────────────────────────────────────────────── */

.lp-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.lp-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.lp-tab {
  font: 600 13px/1 Arial, 'Malgun Gothic', sans-serif;

window.LINKPILOT_CONFIG = {

  api: "/api/linkpilot",

  me: null,
  // me: { name: '홍길동', email: 'user@example.com', org: 'PDI GID', role: 'CEO' },

  membership: null,
  // membership: {

  //   usage: { '프로젝트': { used: 4, limit: 20 }, 'IM 생성': { used: 12, limit: null } },
  // },

  plans: null,        // 기본 3종(Free/Pro/Enterprise)을 쓰려면 null 로 둔다

<script>
/**
 * control-tower.js — Control Tower 대시보드, 순수 JS 판.
 *
 * 본체가 단일 HTML 파일(linkpilot-platform.html)일 때 쓴다.
 * React·빌드 도구·번들러가 필요 없다. 스크립트 태그 두 줄이면 끝이다.
 *
 *   controlTower.css 를 link 로 걸고
 *   <div id="ct"> 를 두고
 *   이 파일을 script src 로 불러온 뒤
 *   LinkPilotControlTower.mount(document.getElementById('ct'), {
 *     projectId: 'LP-DC-2026-001', baseUrl: '/api/linkpilot' })
 *
 * ★ 이 파일을 HTML 안에 통째로 붙여넣을 거라면 닫는 스크립트 태그 문자열이
 *   코드·주석에 들어가지 않게 한다. 브라우저는 그 지점에서 스크립트를 끝내버린다.
 *   (그래서 이 주석에도 태그를 직접 쓰지 않았다.)
 *
 * ★ 클래스명은 React 판과 똑같은 `lp-ct__*` 를 쓴다.
 *   controlTower.css 를 그대로 재사용하기 위해서다 — 스타일시트가 두 벌이 되면
 *   디자인 테마를 바꿨을 때 한쪽만 바뀐다.
 *
 * ★ 표시 로직도 React 판(`../lib.js`)과 같은 결과를 내야 한다.
 *   두 화면이 같은 스냅샷을 다르게 해석하면 어느 쪽이 맞는지 알 수 없다.
 *   `im-agent/test/ui-parity.test.js` 가 두 구현의 출력이 일치하는지 검사한다.
 *
 * ★ 값은 전부 textContent 로 넣는다. innerHTML 을 쓰지 않는다 —
 *   프로젝트명·활동로그는 사용자가 올린 문서에서 나온 문자열이다.
 *
 * ★ 데이터 계보 모달(Lineage.jsx)도 이 판에 있다. 이게 없으면 **숫자를 눌러 출처를
 *   확인하는 경로가 막힌다** — 출처 없는 숫자를 막는 것이 이 시스템의 전부인데,
 *   정작 화면에서 출처를 볼 수 없으면 그 규칙이 사람에게는 보이지 않는다.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.LinkPilotControlTower = factory();
}(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ── 표시 로직 (lib.js 와 동일해야 한다) ──────────────────────────

  var TRACK_ORDER = ['production', 'validation', 'output', 'approval'];

  var AGENT_STATUS_ICON = {
    COMPLETED: '●', WARNING: '▲', RUNNING: '▶', ERROR: '✕',
    WAITING: '○', SKIPPED: '·', BLOCKED: '■', QUEUED: '◇', APPROVED: '✓',
  };

  var AGENT_STATUS_TONE = {
    COMPLETED: 'ok', APPROVED: 'ok',
    RUNNING: 'active', QUEUED: 'active',
    WARNING: 'warn',
    ERROR: 'bad', BLOCKED: 'bad',
    WAITING: 'idle', SKIPPED: 'idle',
  };

  var HEALTH_TONE = { HEALTHY: 'ok', ATTENTION: 'warn', 'AT RISK': 'warn', BLOCKED: 'bad' };

  function formatDuration(ms) {
    if (ms === null || ms === undefined || !isFinite(ms)) return '-';
    var total = Math.max(0, Math.round(ms / 1000));
    var m = Math.floor(total / 60);
    var s = total % 60;
    return m ? m + 'm ' + String(s).padStart(2, '0') + 's' : s + 's';
  }

  function clockOf(stamp) {
    if (!stamp) return '';
    var m = String(stamp).match(/T(\d{2}:\d{2}:\d{2})/);
    return m ? m[1] : '';
  }

  function trackList(snapshot) {
    if (!snapshot || !snapshot.tracks) return [];
    var out = [];
    TRACK_ORDER.forEach(function (k) {
      if (!snapshot.tracks[k]) return;
      var t = { key: k };
      Object.keys(snapshot.tracks[k]).forEach(function (p) { t[p] = snapshot.tracks[k][p]; });
      out.push(t);
    });
    return out;
  }

  /**
   * ★ 이 시스템에서 가장 중요한 판정.
   * Agent 진행률이 전체보다 크게 앞서면 "거의 다 됐다"고 오해한다.
   * 그 격차를 화면에 명시한다.
   */
  function progressGapNotice(snapshot) {
    if (!snapshot || !snapshot.tracks) return null;
    var production = (snapshot.tracks.production && snapshot.tracks.production.pct) || 0;
    var overall = snapshot.overall || 0;
    var gap = production - overall;
    if (gap < 10) return null;

    var lagging = trackList(snapshot)
      .filter(function (t) { return t.key !== 'production' && t.pct < production; })
      .sort(function (a, b) { return a.pct - b.pct; })
      .slice(0, 2);

    return {
      show: true,
      gap: gap,
      message: 'Agent 작업은 ' + production + '% 진행됐지만 프로젝트 전체는 ' + overall + '%다. '
        + lagging.map(function (t) { return t.label + ' ' + t.pct + '%'; }).join(', ')
        + ' 가 남아 있어 아직 배포할 수 없다.',
    };
  }

  function agentSummary(snapshot) {
    var agents = (snapshot && snapshot.agents) || [];
    function count(s) { return agents.filter(function (a) { return a.status === s; }).length; }
    return {
      agents: agents,
      total: agents.length,
      completed: count('COMPLETED') + count('APPROVED'),
      running: count('RUNNING'),
      warning: count('WARNING'),
      error: count('ERROR') + count('BLOCKED'),
      waiting: count('WAITING') + count('QUEUED'),
      skipped: count('SKIPPED'),
    };
  }

  function riskSummary(snapshot) {
    var v = snapshot && snapshot.tracks && snapshot.tracks.validation;
    if (!v) return { available: false };
    return {
      available: v.score !== null && v.score !== undefined,
      score: v.score,
      status: v.status,
      critical: v.critical || 0,
      major: v.major || 0,
      minor: v.minor || 0,
      gatesPassed: v.gatesPassed || 0,
      gatesTotal: v.gatesTotal === undefined || v.gatesTotal === null ? 8 : v.gatesTotal,
      detail: v.detail,
      blocked: v.status === 'DISTRIBUTION BLOCKED',
    };
  }

  function outputSummary(snapshot) {
    var o = snapshot && snapshot.tracks && snapshot.tracks.output;
    if (!o) return { files: [], ready: 0, total: 0, specLocked: false };
    var files = o.files || [];
    return {
      files: files,
      ready: files.filter(function (f) { return f.exists; }).length,
      total: files.length,
      specLocked: !!o.specLocked,
      detail: o.detail,
      manifestStatus: o.manifestStatus || null,
    };
  }

  function userActions(snapshot) {
    var reasons = (snapshot && snapshot.tracks && snapshot.tracks.approval
      && snapshot.tracks.approval.reasons) || [];
    return reasons.map(function (r, i) { return { id: 'A' + (i + 1), message: r }; });
  }

  var ACTIVITY_FILTERS = [
    { id: 'ALL', label: '전체', match: function () { return true; } },
    { id: 'ERROR', label: '오류·경고', match: function (l) { return l.level === 'WARN' || l.level === 'ERROR'; } },
    { id: 'DATA', label: '데이터', match: function (l) { return /extraction|geo|project/.test(l.agent); } },
    { id: 'FINANCIAL', label: '재무', match: function (l) { return /financial|appraisal/.test(l.agent); } },
    { id: 'DOCUMENT', label: '문서', match: function (l) { return /writer|output_spec/.test(l.agent); } },
    { id: 'QA', label: '검증', match: function (l) { return /validation/.test(l.agent); } },
  ];

  function filterActivity(activity, filterId) {
    var f = null;
    ACTIVITY_FILTERS.forEach(function (x) { if (x.id === filterId) f = x; });
    if (!f) f = ACTIVITY_FILTERS[0];
    return (activity || []).filter(f.match);
  }

  function barWidth(pct) {
    return Math.max(0, Math.min(100, Number(pct) || 0)) + '%';
  }

  // ── DOM 헬퍼 ──────────────────────────────────────────────────────

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null && text !== '') n.textContent = String(text);
    return n;
  }

  function add(parent /*, children… */) {
    for (var i = 1; i < arguments.length; i++) {
      if (arguments[i]) parent.appendChild(arguments[i]);
    }
    return parent;
  }

  /** 진행바 — React 판과 같은 구조(<span style="width:…">) */
  function fillBar(cls, pct) {
    var wrap = el('div', cls);
    var span = el('span');
    span.style.width = barWidth(pct);
    wrap.appendChild(span);
    return wrap;
  }

  function panelTitle(no, text, sub) {
    var h = el('h2', 'lp-ct__panel-title');
    if (no) h.appendChild(el('span', 'lp-ct__panel-no', no));
    h.appendChild(document.createTextNode(no ? ' ' + text : text));
    if (sub) h.appendChild(el('span', 'lp-ct__panel-sub', sub));
    return h;
  }

  /** <strong>제목</strong> 본문 형태의 알림 문단 */
  function notice(cls, strongText, bodyText) {
    var p = el('p', cls);
    if (strongText) p.appendChild(el('strong', null, strongText));
    if (bodyText) p.appendChild(document.createTextNode(' ' + bodyText));
    return p;
  }

  // ── 렌더링 ────────────────────────────────────────────────────────

  function renderHeader(snap, state) {
    var t = snap.timing || {};
    var running = !t.finishedAt;
    var head = el('header', 'lp-ct__header');

    var left = el('div');
    add(left,
      el('p', 'lp-ct__eyebrow', 'LinkPilot Project Control Tower'),
      el('h1', 'lp-ct__title', (snap.project && (snap.project.name || snap.project.id)) || ''),
      el('p', 'lp-ct__meta', (snap.project && snap.project.id ? snap.project.id : '')
        + (snap.project && snap.project.assetType ? ' · ' + snap.project.assetType : '')));

    var right = el('div', 'lp-ct__header-right');
    if (snap.health) {
      var health = el('span', 'lp-ct__health lp-ct__tone--' + (HEALTH_TONE[snap.health.level] || 'idle'),
        snap.health.level);
      health.appendChild(el('small', null, snap.health.reason || ''));
      right.appendChild(health);
    }
    right.appendChild(el('p', 'lp-ct__timing',
      (running ? '실행 중' : '실행 완료') + ' · 경과 ' + formatDuration(t.elapsedMs)
      + (running && t.estimatedRemainingMs
        ? ' · 남은 예상 ' + formatDuration(t.estimatedRemainingMs) + ' (참고값)' : '')));

    // ★ 폴링이 실패해도 마지막 화면을 지우지 않는다. 대신 '언제 기준'인지 밝힌다.
    if (state.error) {
      var stale = el('p', 'lp-ct__stale',
        '갱신 실패 — 마지막 수신 ' + (clockOf(state.lastAt) || '알 수 없음') + ' 기준 화면입니다. ');
      var retry = el('button', 'lp-ct__link', '다시 시도');
      retry.type = 'button';
      retry.addEventListener('click', function () { state.refresh(); });
      stale.appendChild(retry);
      right.appendChild(stale);
    }

    return add(head, left, right);
  }

  function renderOverall(snap) {
    var box = el('section', 'lp-ct__panel');
    box.appendChild(panelTitle('01', 'Overall Progress'));

    var overall = el('div', 'lp-ct__overall');
    var value = el('div', 'lp-ct__overall-value', snap.overall);
    value.appendChild(el('span', null, '%'));
    var barWrap = fillBar('lp-ct__overall-bar', snap.overall);

    barWrap.setAttribute('aria-valuemin', '0');
    barWrap.setAttribute('aria-valuemax', '100');
    add(overall, value, barWrap);
    box.appendChild(overall);

    // ★ 격차 경고 — 이 문구가 없으면 Agent 100% 를 완료로 오해한다
    var gap = progressGapNotice(snap);
    if (gap) box.appendChild(notice('lp-ct__notice lp-ct__notice--warn', '진행률 해석 주의', gap.message));

    var ul = el('ul', 'lp-ct__tracks');
    trackList(snap).forEach(function (t) {
      var li = el('li', 'lp-ct__track lp-ct__track--' + t.key);
      var head = el('div', 'lp-ct__track-head');
      add(head,
        el('span', 'lp-ct__track-label', t.label),
        el('span', 'lp-ct__track-weight', '비중 ' + t.weight + '%'),
        el('span', 'lp-ct__track-pct', t.pct + '%'));
      add(li, head, fillBar('lp-ct__track-bar', t.pct),
        t.detail ? el('p', 'lp-ct__track-detail', t.detail) : null);
      ul.appendChild(li);
    });
    box.appendChild(ul);

    box.appendChild(el('p', 'lp-ct__footnote',
      '전체 진행률은 4개 트랙의 가중합입니다. Agent 작업이 모두 끝나도 검증·승인 전이면 100%가 되지 않습니다.'));
    return box;
  }

  function renderAgents(snap) {
    var s = agentSummary(snap);
    var box = el('section', 'lp-ct__panel');
    box.appendChild(panelTitle('02', 'Agent Activity', s.completed + '/' + s.total + ' 완료'));

    var ul = el('ul', 'lp-ct__agents');
    s.agents.forEach(function (a) {
      var li = el('li', 'lp-ct__agent lp-ct__tone--' + (AGENT_STATUS_TONE[a.status] || 'idle'));
      var icon = el('span', 'lp-ct__agent-icon', AGENT_STATUS_ICON[a.status] || '·');
      icon.setAttribute('aria-hidden', 'true');
      var name = el('span', 'lp-ct__agent-name', a.label);
      name.appendChild(el('small', null, a.id));
      var activity = null;
      if (a.activity) {
        activity = el('span', 'lp-ct__agent-activity', a.activity);
        activity.title = a.activity;
      }
      add(li, icon, name, fillBar('lp-ct__agent-bar', a.progress),
        el('span', 'lp-ct__agent-status', a.status),
        el('span', 'lp-ct__agent-time', a.elapsedMs ? formatDuration(a.elapsedMs) : ''),
        activity);
      ul.appendChild(li);
    });
    box.appendChild(ul);

    var b = snap.bottleneck;
    if (b) {
      box.appendChild(notice('lp-ct__notice', '병목',
        b.label + ' — ' + formatDuration(b.elapsedMs)
        + ' (전체의 ' + b.sharePct + '%, 후속 ' + b.dependents + '개, 영향 ' + b.impactLevel + ')'));
    }
    var waiting = snap.waiting || [];
    if (waiting.length) {
      box.appendChild(notice('lp-ct__notice', '선행 대기',
        waiting.map(function (w) { return w.id + ' ← ' + (w.waitingFor || []).join(', '); }).join(' / ')));
    }
    return box;
  }

  function renderRisk(snap) {
    var r = riskSummary(snap);
    var box = el('section', 'lp-ct__panel' + (r.blocked ? ' lp-ct__panel--blocked' : ''));
    box.appendChild(panelTitle('03', 'Validation / Risk'));

    if (!r.available) {
      box.appendChild(el('p', 'lp-ct__muted', r.detail || '검증이 아직 실행되지 않았습니다.'));
      return box;
    }

    var score = el('div', 'lp-ct__score');
    add(score,
      el('span', 'lp-ct__score-value', r.score),
      el('span', 'lp-ct__score-max', '/ 100'),
      el('span', 'lp-ct__score-status ' + (r.blocked ? 'lp-ct__tone--bad' : 'lp-ct__tone--ok'), r.status));
    box.appendChild(score);

    var sev = el('ul', 'lp-ct__severity');
    [['bad', r.critical, 'CRITICAL'], ['warn', r.major, 'MAJOR'], ['idle', r.minor, 'MINOR'],
      ['ok', r.gatesPassed + '/' + r.gatesTotal, 'GATE']].forEach(function (row) {
      var li = el('li', 'lp-ct__tone--' + row[0]);
      li.appendChild(el('b', null, row[1]));
      li.appendChild(document.createTextNode(' ' + row[2]));
      sev.appendChild(li);
    });
    box.appendChild(sev);

    if (r.blocked) {
      box.appendChild(notice('lp-ct__notice lp-ct__notice--bad', '배포 차단',
        'CRITICAL 항목이 해소되기 전에는 최종 배포할 수 없습니다.'));
    }
    return box;
  }

  function renderOutput(snap) {
    var o = outputSummary(snap);
    var box = el('section', 'lp-ct__panel');
    box.appendChild(panelTitle('04', 'Output Status', o.ready + '/' + o.total + ' 생성'));

    var ul = el('ul', 'lp-ct__files');
    o.files.forEach(function (f) {
      // ★ '생성됨' 표시가 아니라 파일 존재 여부로 판정한다
      var li = el('li', f.exists ? 'lp-ct__tone--ok' : 'lp-ct__tone--idle');
      var mark = el('span', null, f.exists ? '✓' : '○');
      mark.setAttribute('aria-hidden', 'true');
      add(li, mark, el('span', 'lp-ct__file-label', f.label), el('code', null, f.path));
      ul.appendChild(li);
    });
    box.appendChild(ul);

    box.appendChild(notice('lp-ct__notice' + (o.specLocked ? '' : ' lp-ct__notice--warn'), '출력 사양',
      (o.detail || '') + (o.manifestStatus ? ' · 매니페스트: ' + o.manifestStatus : '')));
    return box;
  }

  function renderActivity(snap, state) {
    var box = el('section', 'lp-ct__panel');
    box.appendChild(panelTitle('05', 'Live Activity'));

    var tabs = el('div', 'lp-ct__filters');
    tabs.setAttribute('role', 'tablist');
    ACTIVITY_FILTERS.forEach(function (f) {
      var b = el('button', 'lp-ct__filter' + (state.filter === f.id ? ' is-active' : ''), f.label);
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(state.filter === f.id));
      b.addEventListener('click', function () { state.filter = f.id; state.draw(); });
      tabs.appendChild(b);
    });
    box.appendChild(tabs);

    var rows = filterActivity(snap.activity, state.filter);
    if (!rows.length) {
      box.appendChild(el('p', 'lp-ct__muted', '기록된 활동이 없습니다.'));
      return box;
    }
    var ol = el('ol', 'lp-ct__log');
    rows.slice().reverse().forEach(function (l) {
      var li = el('li', l.level === 'WARN' ? 'lp-ct__tone--warn' : '');
      add(li, el('time', null, clockOf(l.at)),
        el('span', 'lp-ct__log-agent', l.agent),
        el('span', 'lp-ct__log-msg', l.message),
        l.records ? el('span', 'lp-ct__log-records', l.records + '건') : null);
      ol.appendChild(li);
    });
    box.appendChild(ol);
    return box;
  }

  function renderActions(snap, opts, state) {
    var actions = userActions(snap);
    var approval = snap.tracks && snap.tracks.approval;

    if (approval && approval.approved) {
      var done = el('section', 'lp-ct__panel lp-ct__panel--ok');
      add(done, panelTitle(null, 'Approval'), el('p', 'lp-ct__tone--ok', approval.detail || ''));
      return done;
    }

    var box = el('section', 'lp-ct__panel');
    box.appendChild(panelTitle(null, 'User Action Required'));

    if (!actions.length) {
      box.appendChild(el('p', 'lp-ct__muted', '해소해야 할 항목이 없습니다.'));
    } else {
      var ul = el('ul', 'lp-ct__actions');
      actions.forEach(function (a) {
        var li = el('li');
        li.appendChild(el('span', null, a.id));
        li.appendChild(document.createTextNode(a.message));
        ul.appendChild(li);
      });
      box.appendChild(ul);
    }

    // ★ 차단 사유가 하나라도 남아 있으면 누를 수 없다. 눌러서 실패하는 게 아니다.
    var canApprove = !!approval && actions.length === 0 && !approval.approved;
    var btn = el('button', 'lp-ct__approve', '최종 승인');
    btn.type = 'button';
    btn.disabled = !canApprove || !opts.onApprove;
    btn.title = canApprove ? '' : '차단 사유가 남아 있어 승인할 수 없습니다';
    btn.addEventListener('click', function () {
      if (!opts.onApprove) return;
      Promise.resolve(opts.onApprove(snap.project && snap.project.id)).then(function () { state.refresh(); });
    });
    box.appendChild(btn);

    if (!canApprove) {
      box.appendChild(el('p', 'lp-ct__footnote',
        '위 항목이 모두 해소되어야 승인할 수 있습니다. 승인은 사람만 할 수 있으며 기록이 남습니다.'));
    }
    return box;
  }

  // ── 데이터 계보 모달 (Lineage.jsx 이식) ───────────────────────────
  //
  // ★ 이게 없으면 **숫자를 눌러 출처를 확인하는 경로가 막힌다.** 출처 없는 숫자를
  //   막는 것이 이 시스템의 전부인데, 정작 화면에서 출처를 볼 수 없으면 그 규칙이
  //   사람에게는 보이지 않는다. React 판에만 있고 본체(단일 HTML)에는 없었다.
  //
  // ★ 채택되지 않은 후보도 보여준다. 어느 값이 버려졌는지 알아야 판단할 수 있다.
  // ★ 추적이 안 되면 '추적 불가'라고 쓴다. 그럴듯한 경로를 지어내지 않는다.

  function lineageHead(lg) {
    var p = el('p', 'lp-ct__lineage-head');
    p.appendChild(el('strong', null, lg.label || ''));
    p.appendChild(el('code', null, lg.key || ''));
    p.appendChild(el('span', 'lp-ct__lineage-value',
      String(lg.value) + (lg.unit ? ' ' + lg.unit : '')));
    p.appendChild(el('span', 'lp-ct__grade lp-ct__grade--' + lg.grade, String(lg.grade || '')));
    p.appendChild(lg.verified
      ? el('span', 'lp-ct__tone--ok', '검증됨')
      : el('span', 'lp-ct__tone--warn', '미검증'));
    return p;
  }

  function lineageChain(chain) {
    var ol = el('ol', 'lp-ct__chain');
    (chain || []).forEach(function (c) {
      // ★ 미채택 후보를 흐리게라도 남긴다. 지우면 "이 값밖에 없었다"로 읽힌다
      var li = el('li', c.adopted ? null : 'is-rejected');
      li.appendChild(el('span', 'lp-ct__chain-stage', String(c.stage || '')));

      var label = el('span', 'lp-ct__chain-label', String(c.label || ''));
      if (!c.adopted) label.appendChild(el('em', null, ' (미채택)'));
      li.appendChild(label);

      if (c.detail) li.appendChild(el('span', 'lp-ct__chain-detail', String(c.detail)));
      if (c.value !== null && c.value !== undefined) {
        li.appendChild(el('span', 'lp-ct__chain-value', String(c.value)));
      }
      ol.appendChild(li);
    });
    return ol;
  }

  function lineageImpact(im) {
    var box = el('section', 'lp-ct__impact');
    box.appendChild(el('h3', null, '변경 영향'));

    var p = el('p');
    p.appendChild(document.createTextNode('이 값을 바꾸면 '));
    p.appendChild(el('strong', null, String(im.totalAffected) + '개'));
    p.appendChild(document.createTextNode(' 결과물이 영향을 받습니다.'
      + (im.requiresNewVersion ? ' 이미 승인된 프로젝트이므로 새 버전이 필요합니다.' : '')));
    box.appendChild(p);

    box.appendChild(el('p', 'lp-ct__impact-order',
      '재실행 순서: ' + (im.rerunOrder || []).join(' → ')));

    var vals = im.affectedValues || [];
    if (vals.length) {
      box.appendChild(el('p', 'lp-ct__impact-values',
        '다시 계산되는 값 ' + vals.length + '건: '
        + vals.map(function (v) { return v.label; }).join(', ')));
    }

    var ul = el('ul', 'lp-ct__impact-docs');
    (im.affectedDocuments || []).forEach(function (dName) {
      ul.appendChild(add(el('li'), el('code', null, String(dName))));
    });
    box.appendChild(ul);
    return box;
  }

  function renderLineage(lineageState, onClose) {
    if (!lineageState || !lineageState.key) return null;

    var back = el('div', 'lp-ct__modal');
    back.setAttribute('role', 'dialog');
    back.setAttribute('aria-modal', 'true');
    back.setAttribute('aria-labelledby', 'lp-lineage-title');

    var box = el('div', 'lp-ct__modal-box');
    var head = el('header', 'lp-ct__modal-head');
    var h2 = el('h2', null, 'Data Lineage');
    h2.id = 'lp-lineage-title';
    var close = el('button', 'lp-ct__close', '×');
    close.type = 'button';
    close.setAttribute('aria-label', '닫기');
    close.addEventListener('click', onClose);
    add(head, h2, close);
    box.appendChild(head);

    if (lineageState.loading) box.appendChild(el('p', 'lp-ct__muted', '불러오는 중…'));
    if (lineageState.error) {
      box.appendChild(el('p', 'lp-ct__error', '불러오지 못했습니다: ' + lineageState.error));
    }

    var lg = lineageState.lineage;
    if (lg && !lg.found) {
      box.appendChild(notice('lp-ct__notice lp-ct__notice--warn', '추적 불가', lg.reason || ''));
    }
    if (lg && lg.found) {
      box.appendChild(lineageHead(lg));
      if (lg.conflicted) {
        box.appendChild(notice('lp-ct__notice lp-ct__notice--bad', '값 충돌',
          '서로 다른 출처가 다른 값을 제시합니다. 아래에서 채택/미채택을 확인하십시오.'));
      }
      box.appendChild(lineageChain(lg.chain));
    }
    if (lineageState.impact) box.appendChild(lineageImpact(lineageState.impact));

    back.appendChild(box);
    // 바깥을 눌러도 닫힌다. 상자 안 클릭은 통과시키지 않는다
    back.addEventListener('click', function (e) { if (e.target === back) onClose(); });
    return back;
  }

  // ── 마운트 ────────────────────────────────────────────────────────

  var RUNNING_MS = 2000;    // 실행 중
  var IDLE_MS = 15000;      // 완료 후

  function mount(container, opts) {
    if (!container) throw new Error('control-tower: 컨테이너 엘리먼트가 필요하다');
    opts = opts || {};
    var baseUrl = (opts.baseUrl || '/api/linkpilot').replace(/\/$/, '');
    var fetchImpl = opts.fetch || (typeof fetch === 'function' ? fetch.bind(null) : null);

    var state = {
      projectId: opts.projectId,
      snapshot: opts.snapshot || null,   // 폴링 없이 주입할 수도 있다
      filter: 'ALL',
      error: null,
      lastAt: null,
      timer: null,
      stopped: false,
      // 데이터 계보 모달 — 숫자를 눌렀을 때만 채워진다 (상시 폴링 대상이 아니다)
      lineage: { key: null, lineage: null, impact: null, loading: false, error: null },
    };

    function draw() {
      container.textContent = '';
      container.className = 'lp-ct' + (state.snapshot ? '' : ' lp-ct--empty');

      if (!state.snapshot) {
        container.appendChild(state.error
          ? el('p', 'lp-ct__error', '현황을 불러오지 못했습니다: ' + state.error)
          : el('p', 'lp-ct__muted', '현황을 불러오는 중…'));
        return;
      }

      var snap = state.snapshot;
      container.appendChild(renderHeader(snap, state));
      container.appendChild(renderOverall(snap));

      var grid = el('div', 'lp-ct__grid');
      add(grid, renderAgents(snap), renderRisk(snap), renderOutput(snap), renderActivity(snap, state));
      container.appendChild(grid);

      container.appendChild(renderActions(snap, opts, state));

      var footer = add(el('footer', 'lp-ct__footer'), el('span', null, snap.generatedAt || ''));
      // ★ 숫자에서 출처로 가는 입구. 본체가 개별 숫자에 붙일 수 있도록
      //   handle.openLineage(key) 도 함께 내보낸다
      var link = el('button', 'lp-ct__link', '데이터 계보 보기');
      link.type = 'button';
      link.addEventListener('click', function () { openLineage(opts.lineageKey || 'building.gfa_sqm'); });
      footer.appendChild(link);
      container.appendChild(footer);

      var modal = renderLineage(state.lineage, closeLineage);
      if (modal) container.appendChild(modal);
    }
    state.draw = draw;

    /** 계보·영향을 함께 부른다. 영향은 없어도 계보만으로 쓸모가 있으므로 실패를 흡수한다 */
    function openLineage(key) {
      if (!key || !state.projectId) return Promise.resolve();
      state.lineage = { key: key, lineage: null, impact: null, loading: true, error: null };
      draw();

      if (!fetchImpl) {
        state.lineage.loading = false;
        state.lineage.error = 'fetch 를 쓸 수 없다';
        draw();
        return Promise.resolve();
      }

      var url = baseUrl + '/projects/' + encodeURIComponent(state.projectId);
      var k = encodeURIComponent(key);
      return Promise.all([
        fetchImpl(url + '/lineage/' + k),
        fetchImpl(url + '/impact/' + k).catch(function () { return null; }),
      ]).then(function (rs) {
        if (!rs[0] || !rs[0].ok) throw new Error('HTTP ' + (rs[0] ? rs[0].status : '?'));
        return Promise.all([rs[0].json(), rs[1] && rs[1].ok ? rs[1].json() : null]);
      }).then(function (j) {
        state.lineage = { key: key, lineage: j[0], impact: j[1], loading: false, error: null };
        draw();
      }).catch(function (e) {
        state.lineage.loading = false;
        state.lineage.error = e.message;
        draw();
      });
    }

    function closeLineage() {
      state.lineage = { key: null, lineage: null, impact: null, loading: false, error: null };
      draw();
    }

    function nextDelay() {
      var agents = (state.snapshot && state.snapshot.agents) || [];
      var running = agents.some(function (a) { return a.status === 'RUNNING' || a.status === 'QUEUED'; });
      return running ? RUNNING_MS : IDLE_MS;
    }

    function schedule() {
      clearTimeout(state.timer);
      if (state.stopped || opts.snapshot) return;   // 주입 모드면 폴링하지 않는다
      state.timer = setTimeout(tick, nextDelay());
    }

    function tick() {
      // 탭이 백그라운드면 폴링하지 않는다 (NAS·API 부하를 아낀다)
      if (typeof document !== 'undefined' && document.hidden) return schedule();
      refresh().then(schedule);
    }

    function refresh() {
      if (opts.snapshot) { draw(); return Promise.resolve(); }
      if (!fetchImpl) {
        state.error = 'fetch 를 쓸 수 없다';
        draw();
        return Promise.resolve();
      }
      return fetchImpl(baseUrl + '/projects/' + encodeURIComponent(state.projectId) + '/control-tower')
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (j) {
          state.snapshot = j;
          state.lastAt = j.generatedAt || null;
          state.error = null;
          draw();
        })
        .catch(function (e) {
          state.error = e.message;   // 마지막 스냅샷은 유지한 채 경고만 띄운다
          draw();
        });
    }
    state.refresh = refresh;

    draw();
    if (!opts.snapshot) refresh().then(schedule);

    if (typeof document !== 'undefined') {
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && !state.stopped && !opts.snapshot) tick();
      });
    }

    // ESC 로 닫는다. 모달이 열려 있을 때만 가로챈다
    var onKey = function (e) {
      if ((e.key === 'Escape' || e.keyCode === 27) && state.lineage.key) closeLineage();
    };
    if (typeof document !== 'undefined') document.addEventListener('keydown', onKey);

    return {
      refresh: refresh,
      // 본체가 개별 숫자에 붙일 수 있게 열어 둔다 (예: 연면적 셀 클릭 → openLineage('building.gfa_sqm'))
      openLineage: openLineage,
      closeLineage: closeLineage,
      stop: function () {
        state.stopped = true;
        clearTimeout(state.timer);
        if (typeof document !== 'undefined') document.removeEventListener('keydown', onKey);
      },
      state: state,
    };
  }

  return {
    mount: mount,
    // 표시 로직 — 패리티 테스트가 이걸 React 판과 비교한다
    TRACK_ORDER: TRACK_ORDER,
    AGENT_STATUS_ICON: AGENT_STATUS_ICON,
    AGENT_STATUS_TONE: AGENT_STATUS_TONE,
    HEALTH_TONE: HEALTH_TONE,
    ACTIVITY_FILTERS: ACTIVITY_FILTERS,
    formatDuration: formatDuration,
    clockOf: clockOf,
    trackList: trackList,
    progressGapNotice: progressGapNotice,
    agentSummary: agentSummary,
    riskSummary: riskSummary,
    outputSummary: outputSummary,
    userActions: userActions,
    filterActivity: filterActivity,
    barWidth: barWidth,
    // 계보 모달 — 렌더 자체를 테스트가 확인한다
    renderLineage: renderLineage,
  };
}));

</script>
<script>
/**
 * app.js — LinkPilot 플랫폼 화면 로직.
 *
 * 데이터는 두 곳에서 온다.
 *   ① NAS sync.php        인맥·프로젝트·할일·일정  (아침 브리핑과 같은 소스)
 *   ② 본체 API /api/linkpilot   IM Agent 제작 현황
 *
 * ★ 한쪽이 죽어도 다른 쪽은 보여준다. 화면 전체를 죽이지 않는다.
 *   NAS 가 죽었는데 "일정 없음"이라고 쓰면 CEO 가 일정이 없는 날로 오해한다 —
 *   못 가져온 것과 없는 것을 반드시 구분해서 표시한다.
 *
 * ★ 날짜는 전부 Asia/Seoul 로 명시 계산한다. 브라우저 로컬타임에 의존하지 않는다
 *   (해외 출장 중 노트북 시간대가 바뀌면 '오늘'이 어긋난다).
 *
 * ★ 값은 전부 textContent 로 넣는다. innerHTML 을 쓰지 않는다 —

    // ① 계정
    var acc = el('section', 'lp-mysec');
    acc.appendChild(el('h3', 'lp-mysec__title', '계정'));
    var dl = el('dl', 'lp-kv');
    [['이름', me.name], ['이메일', me.email], ['소속', me.org], ['역할', me.role]].forEach(function (row) {
      dl.appendChild(el('dt', null, row[0]));
      dl.appendChild(el('dd', row[1] ? null : 'lp-muted', row[1] || '미설정'));
    });
    acc.appendChild(dl);
    body.appendChild(acc);

    // ② 멤버십 현황
    var cur = el('section', 'lp-mysec');
    cur.appendChild(el('h3', 'lp-mysec__title', '멤버십'));

    if (!m.linked) {
      cur.appendChild(el('p', 'lp-empty lp-empty--failed',
        '멤버십 정보가 연동되지 않았습니다 — 서버에서 LINKPILOT_CONFIG.membership 을 내려주면 표시됩니다.'));
    } else {
      var badge = el('div', 'lp-plan-badge lp-plan-badge--' + (m.status || 'active'));
      badge.appendChild(el('span', 'lp-plan-badge__name', m.planName));
      badge.appendChild(el('span', 'lp-plan-badge__status',
        m.status === 'expired' ? '만료됨' : m.status === 'trial' ? '체험' : '이용 중'));
      cur.appendChild(badge);

      var kv = el('dl', 'lp-kv');
      if (m.until) {
        kv.appendChild(el('dt', null, m.status === 'expired' ? '만료일' : '다음 갱신일'));
        kv.appendChild(el('dd', null, m.until.slice(0, 10) + (m.daysLeft !== null ? ' · ' + ddayLabel(m.daysLeft) : '')));
      }
      if (m.usage) {
        Object.keys(m.usage).forEach(function (k) {
          var u = m.usage[k];
          kv.appendChild(el('dt', null, k));
          kv.appendChild(el('dd', null, u.used + (u.limit === null || u.limit === undefined ? ' (무제한)' : ' / ' + u.limit)));
        });
      }
      if (kv.childNodes.length) cur.appendChild(kv);

      // 만료가 임박하면 눈에 띄게 알린다. 만료되면 IM 생성이 막힌다
      if (m.status === 'expired') {
        cur.appendChild(el('p', 'lp-banner lp-banner--bad', '멤버십이 만료되었습니다. 갱신 전까지 유료 기능을 쓸 수 없습니다.'));
      } else if (m.expiringSoon) {
        cur.appendChild(el('p', 'lp-banner', '갱신일이 ' + m.daysLeft + '일 남았습니다.'));
      }
    }
    body.appendChild(cur);

    // ③ 플랜
    var plansSec = el('section', 'lp-mysec');
    plansSec.appendChild(el('h3', 'lp-mysec__title', '플랜'));
    var grid = el('div', 'lp-plans');

    m.plans.forEach(function (p) {
      var isCurrent = m.linked && p.id === m.planId;
      var cardEl = el('article', 'lp-plan'
        + (p.recommended ? ' lp-plan--rec' : '')
        + (isCurrent ? ' lp-plan--current' : ''));

      if (p.recommended && !isCurrent) cardEl.appendChild(el('span', 'lp-plan__tag', '추천'));
      if (isCurrent) cardEl.appendChild(el('span', 'lp-plan__tag lp-plan__tag--cur', '현재 플랜'));

      cardEl.appendChild(el('h4', 'lp-plan__name', p.name));
      var price = el('div', 'lp-plan__price', formatPrice(p.price));
      if (p.price !== null && p.price !== undefined && p.price !== '') {
        price.appendChild(el('span', 'lp-plan__period', ' / ' + (p.period || '월')));
      }
      cardEl.appendChild(price);

      var ul = el('ul', 'lp-plan__features');
      (p.features || []).forEach(function (f) { ul.appendChild(el('li', null, f)); });
      cardEl.appendChild(ul);

      var btn = el('button', 'lp-btn lp-btn--primary', isCurrent ? '이용 중' : '이 플랜으로 변경');
      btn.type = 'button';
      btn.disabled = isCurrent;
      btn.addEventListener('click', function () { requestUpgrade(state, p, body); });
      cardEl.appendChild(btn);

      grid.appendChild(cardEl);
    });
    plansSec.appendChild(grid);
    plansSec.appendChild(el('p', 'lp-note',
      '가격·구성은 서버 설정(LINKPILOT_CONFIG.plans)에서 내려옵니다. 표시된 값이 실제와 다르면 설정을 확인하세요.'));
    body.appendChild(plansSec);

    box.appendChild(body);
    overlay.appendChild(box);

    function shut() {
      overlay.remove();
      document.removeEventListener('keydown', onKey);
    }
    function onKey(e) { if (e.key === 'Escape') shut(); }
    close.addEventListener('click', shut);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) shut(); });
    document.addEventListener('keydown', onKey);

    document.body.appendChild(overlay);
    close.focus();
  }

  /**
   * 플랜 변경 요청.
   * ★ 이 화면에서 카드번호를 받지 않는다. 결제대행사 페이지로 보낸다.
   *   결제 URL 이 설정되지 않았으면 지어내지 않고, 무엇이 필요한지 적는다.
   */
  function requestUpgrade(state, plan, body) {
    var url = state.cfg.billingUrl;
    if (url) {
      var sep = url.indexOf('?') > -1 ? '&' : '?';
      window.open(url + sep + 'plan=' + encodeURIComponent(plan.id), '_blank', 'noopener');
      return;
    }
    var old = body.querySelector('.lp-upgrade-note');
    if (old) old.remove();
    var note = el('div', 'lp-banner lp-upgrade-note');
    note.textContent = '결제 연동이 아직 없습니다 (' + plan.name + ' 선택됨). '
      + 'LINKPILOT_CONFIG.billingUrl 에 결제 페이지 주소를 넣으면 이 버튼이 그리로 연결됩니다.';
    body.appendChild(note);
    note.scrollIntoView({ block: 'nearest' });
  }

  // ── 앱 ────────────────────────────────────────────────────────────

  var VIEWS = [
    { id: 'today', label: '오늘', render: viewToday },
    { id: 'projects', label: '프로젝트', render: viewProjects },
    { id: 'contacts', label: '인맥', render: viewContacts },
    { id: 'tower', label: 'IM 제작현황', render: viewTower },
  ];

  function config() {
    var c = window.LINKPILOT_CONFIG || {};
    var q = new URLSearchParams(location.search);
    return {
      nas: (q.get('nas') || c.nas || '').replace(/\/$/, ''),
      api: (q.get('api') || c.api || '/api/linkpilot').replace(/\/$/, ''),
      me: c.me || null,
      membership: c.membership || null,
      plans: c.plans || null,
      billingUrl: c.billingUrl || null,
    };
  }

  function mount(container) {
    var cfg = config();
    var state = {
      cfg: cfg,
      view: (location.hash.replace(/^#/, '').split('/')[0]) || 'today',
      today: kstYmd(),
      data: null,
      nasError: null,
      apiBase: cfg.api,
      imProjects: null,
      imProjectId: null,
      stage: '전체',
      projectQuery: '',
      contactQuery: '',
      tower: null,
    };

    function drawInto(id, node) {
      var host = document.getElementById(id);
      if (!host) return;
      host.textContent = '';
      host.appendChild(node);
    }
    state.drawInto = drawInto;

    function draw() {
      container.textContent = '';
      container.className = 'lp-app';

      var header = el('header', 'lp-header');
      var brand = el('div', 'lp-brand');
      add(brand, el('span', 'lp-brand__name', 'LinkPilot'), el('span', 'lp-brand__date', kstLabel()));
      header.appendChild(brand);

      // 내 정보 — 별도 창(모달)으로 띄운다. 화면 전환이 아니라서 보던 내용이 유지된다
      var mineBtn = el('button', 'lp-mine', '내 정보');
      mineBtn.type = 'button';
      var mNow = membership(cfg, state.today);
      if (mNow.linked) {
        mineBtn.appendChild(el('span', 'lp-mine__plan'
          + (mNow.status === 'expired' ? ' lp-mine__plan--bad' : ''), mNow.planName));
      }
      mineBtn.addEventListener('click', function () { openMyInfo(state); });
      header.appendChild(mineBtn);

      var nav = el('nav', 'lp-nav');
      VIEWS.forEach(function (v) {
        var b = el('button', 'lp-nav__btn' + (state.view === v.id ? ' is-active' : ''), v.label);
        b.type = 'button';
        b.addEventListener('click', function () { location.hash = v.id; });
        nav.appendChild(b);
      });
      header.appendChild(nav);
      container.appendChild(header);

      // NAS 실패는 화면 맨 위에 한 번만 알린다. 각 카드에도 '확인되지 않음'이 뜬다.
      if (state.nasError && state.view !== 'tower') {
        container.appendChild(el('p', 'lp-banner',
          'NAS(' + (cfg.nas || '미설정') + ') 조회 실패 — 아래 정보는 확인되지 않았습니다. 사유: ' + state.nasError));
      }

      var main = el('main', 'lp-main');
      var view = VIEWS.find(function (v) { return v.id === state.view; }) || VIEWS[0];
      main.appendChild(view.render(state));
      container.appendChild(main);

      if (state.view === 'tower') mountTower(state);
    }
    state.draw = draw;

    window.addEventListener('hashchange', function () {
      var next = location.hash.replace(/^#/, '').split('/')[0] || 'today';
      if (next === state.view) return;
      if (state.tower) { state.tower.stop(); state.tower = null; }
      state.view = next;
      draw();
    });

    draw();

    // ① NAS — 없으면 조용히 건너뛴다 (IM 제작현황만 쓸 수도 있다)
    if (cfg.nas) {
      // ★ 커스텀 헤더를 붙이지 않는다.
      //   cache-control 같은 헤더를 넣으면 단순요청이 아니게 되어 CORS 프리플라이트(OPTIONS)가
      //   먼저 날아가고, NAS 가 Access-Control-Allow-Headers 를 안 주면 통째로 실패한다.
      //   캐시는 ?t= 로 이미 무력화되므로 헤더는 불필요하다.
      //   (페이지와 NAS 가 다른 출처면 NAS 응답에 Access-Control-Allow-Origin 이 필요하다.)
      fetch(cfg.nas + '/sync.php?t=' + Date.now())
        .then(function (r) { if (!r.ok) throw new Error('sync.php HTTP ' + r.status); return r.json(); })
        .then(function (j) { state.data = j && typeof j === 'object' ? j : {}; state.nasError = null; draw(); })
        .catch(function (e) { state.nasError = e.message; draw(); });
    } else {
      state.nasError = 'NAS 주소 미설정 (LINKPILOT_CONFIG.nas)';
      draw();
    }

    // ② IM Agent 목록
    fetch(cfg.api + '/projects')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        state.imProjects = (j && j.projects) || [];
        if (!state.imProjectId && state.imProjects.length) state.imProjectId = state.imProjects[0].id;
        if (state.view === 'tower') draw();
      })
      .catch(function () { state.imProjects = []; if (state.view === 'tower') draw(); });

    return state;
  }

  return {
    mount: mount,
    // 순수 로직 — 테스트 대상
    kstYmd: kstYmd, kstLabel: kstLabel, kstShift: kstShift, dday: dday, ddayLabel: ddayLabel,
    mapToStage: mapToStage, STAGES: STAGES, VIEWS: VIEWS,
    todayEvents: todayEvents, openTodos: openTodos, recentIntake: recentIntake,
    byStage: byStage, searchProjects: searchProjects, searchContacts: searchContacts,
    phoneOf: phoneOf, activityScore: activityScore,
    membership: membership, formatPrice: formatPrice, DEFAULT_PLANS: DEFAULT_PLANS,
  };
}));

</script>
<script>
/**
 * inapp.js — 메신저 인앱 브라우저 감지 및 탈출 배너. 「외부 업무지침」 §1.
 *
 * 왜 필요한가:
 *   지침은 "앱 상단에 [외부 브라우저로 열기] 배너가 나오면 그것을 눌러 주시고,
 *   배너가 없으면 주소를 복사해 붙여넣으라"고 안내한다. 그런데 그 배너가
 *   실제로는 없었다. 지침만 있고 기능이 없으면 지침이 거짓말이 된다.
 *
 * 인앱 브라우저에서 실제로 깨지는 것:
 *   - window.open / target=_blank 가 무시된다 (새 창이 안 열린다)
 *   - <a download> 와 Blob 다운로드가 조용히 실패한다
 *   - 파일 선택창이 사진첩만 열리거나 아예 안 열린다
 *   증상이 전부 '아무 일도 안 일어남'이라 사용자는 서버가 죽은 줄 안다.
 *
 * ★ 오탐이 더 나쁘다. 정상 브라우저에 "브라우저를 바꾸라"는 배너를 띄우면
 *   멀쩡한 사용자가 못 쓰는 줄 안다. 그래서 화이트리스트(정상 브라우저)를
 *   먼저 확인하고, 확실한 인앱 서명만 잡는다.
 *
 * 의존성 없음. 브라우저·Node 양쪽에서 동작한다(감지 함수는 순수함수).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.LinkPilotInApp = factory();
}(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /**
   * ★ **이 스크립트가 어느 판인가** 〈2026-08-23 · D-93 사고〉.
   *   `build-stamp.js` 가 채운다 — 손으로 고치지 않는다. 화면이 자기
   *   지문과 대 보고 다르면 「함수가 없다」로 죽기 전에 사람 말로 알린다.
   */
  var LP_BUILD = '0e8a8c26';

  /**
   * 확실한 인앱 서명만 넣는다. 애매한 것은 넣지 않는다 —
   * 못 잡으면 사용자가 불편한 정도지만, 잘못 잡으면 정상 사용자를 쫓아낸다.
   */
  var APPS = [
    { id: 'kakaotalk', name: '카카오톡', re: /KAKAOTALK/i },
    { id: 'kakaostory', name: '카카오스토리', re: /KAKAOSTORY/i },
    { id: 'line', name: '라인', re: /\bLine\//i },
    { id: 'facebook', name: '페이스북', re: /FBAN|FBAV|FB_IAB/i },
    { id: 'instagram', name: '인스타그램', re: /Instagram/i },
    { id: 'naver', name: '네이버 앱', re: /NAVER\(inapp/i },
    { id: 'daum', name: '다음 앱', re: /DaumApps/i },
    { id: 'band', name: '밴드', re: /\bBAND\//i },
    { id: 'wechat', name: '위챗', re: /MicroMessenger/i },
  ];

  /** 이 서명이 있으면 인앱이 아니다 (정상 브라우저) */
  var REAL = /SamsungBrowser|Whale|FxiOS|EdgiOS|CriOS|Edg\//i;

  /**
   * @param {string} ua navigator.userAgent
   * @returns {{inApp:boolean, app:string|null, name:string|null, os:'ios'|'android'|'other'}}

    var s = String(ua || '');
    var os = /iPhone|iPad|iPod/i.test(s) ? 'ios' : /Android/i.test(s) ? 'android' : 'other';
    if (REAL.test(s)) return { inApp: false, app: null, name: null, os: os };
    for (var i = 0; i < APPS.length; i++) {
      if (APPS[i].re.test(s)) return { inApp: true, app: APPS[i].id, name: APPS[i].name, os: os };
    }

  }

  /**
   * 탈출 방법. 앱마다 다르고, iOS 는 방법이 없다.
   *
   * @returns {{kind:'scheme'|'intent'|'copy', url:string|null, label:string, hint:string}}
   */
  function escapeRoute(d, url) {
    var u = String(url || '');
    if (d.app === 'kakaotalk') {
      // 카카오톡이 공식으로 여는 스킴. iOS·Android 모두 동작한다
      return { kind: 'scheme', url: 'kakaotalk://web/openExternal?url=' + encodeURIComponent(u),
        label: '외부 브라우저로 열기', hint: '기본 브라우저에서 다시 열립니다.' };
    }
    if (d.app === 'line') {
      return { kind: 'scheme', url: u + (u.indexOf('?') === -1 ? '?' : '&') + 'openExternalBrowser=1',
        label: '외부 브라우저로 열기', hint: '기본 브라우저에서 다시 열립니다.' };
    }
    if (d.os === 'android') {

      return { kind: 'intent', url: 'intent://' + u.replace(/^https?:\/\//, '')
          + '#Intent;scheme=https;package=com.android.chrome;end',
        label: 'Chrome 으로 열기', hint: 'Chrome 이 없으면 아래 주소를 복사해 주세요.' };
    }
    // ★ iOS 인앱은 외부 브라우저를 강제로 열 수 없다. 지침도 '주소 복사'로 안내한다
    return { kind: 'copy', url: null, label: '주소 복사',

  }

  /**
   * 배너를 띄운다. 인앱이 아니면 아무것도 하지 않고 null 을 돌려준다.

   * 닫아도 세션 동안만 숨긴다(sessionStorage). 영구 저장하지 않는 이유 —
   * 다음에 파일을 올리려다 또 막히는데, 그때 배너가 없으면 원인을 못 찾는다.
   *

   */
  function mount(opts) {
    var o = opts || {};

    var d = detect(ua);
    if (!d.inApp) return null;

    var store = o.storage || (typeof sessionStorage !== 'undefined' ? sessionStorage : null);
    try { if (store && store.getItem('lp-inapp-hide') === '1') return null; } catch (e) { /* 접근 차단 환경 */ }

    var url = o.url || (typeof location !== 'undefined' ? location.href : '');
    var r = escapeRoute(d, url);

    var bar = doc.createElement('div');
    bar.className = 'lp-inapp';
    bar.setAttribute('role', 'alert');

    var msg = doc.createElement('div');
    msg.className = 'lp-inapp__msg';
    var strong = doc.createElement('b');
    strong.textContent = d.name + ' 안에서 열렸습니다';
    msg.appendChild(strong);
    var p = doc.createElement('span');
    // 무엇이 안 되는지 먼저 말한다. '권장'만 하면 그냥 쓴다
    p.textContent = ' — 파일 내려받기와 새 창 열기가 되지 않습니다. ' + r.hint;
    msg.appendChild(p);

    var act = doc.createElement('div');
    act.className = 'lp-inapp__act';

    if (r.kind === 'copy') {
      act.appendChild(copyBtn(doc, url, r.label));
    } else {
      var a = doc.createElement('a');
      a.className = 'lp-inapp__btn';
      a.href = r.url;
      a.textContent = r.label;
      act.appendChild(a);
      // 스킴이 막혀 아무 일도 안 일어날 때를 대비해 복사도 같이 준다
      act.appendChild(copyBtn(doc, url, '주소 복사'));
    }

    var x = doc.createElement('button');
    x.type = 'button';
    x.className = 'lp-inapp__x';
    x.setAttribute('aria-label', '배너 닫기');
    x.textContent = '✕';
    x.onclick = function () {
      bar.remove();
      try { if (store) store.setItem('lp-inapp-hide', '1'); } catch (e) { /* 무시 */ }
    };

    bar.appendChild(msg);

  }

  /** 클립보드 API 는 인앱에서 막히는 경우가 있어 execCommand 로 되돌아간다 */
  function copyBtn(doc, url, label) {
    var b = doc.createElement('button');
    b.type = 'button';
    b.className = 'lp-inapp__btn';
    b.textContent = label;
    b.onclick = function () {
      var done = function () { b.textContent = '복사됨'; setTimeout(function () { b.textContent = label; }, 1600); };
      var nav = doc.defaultView && doc.defaultView.navigator;
      if (nav && nav.clipboard && nav.clipboard.writeText) {
        nav.clipboard.writeText(url).then(done, function () { legacy(doc, url, done); });
      } else {
        legacy(doc, url, done);
      }
    };
    return b;
  }

  function legacy(doc, url, done) {
    var ta = doc.createElement('textarea');
    ta.value = url;
    ta.setAttribute('readonly', 'readonly');
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    doc.body.appendChild(ta);
    ta.select();
    try { doc.execCommand('copy'); done(); } catch (e) { /* 마지막 수단도 막히면 그대로 둔다 */ }
    ta.remove();
  }

  /** 화면마다 style 을 복사해 붙이지 않도록 CSS 를 여기서 준다 */
  var CSS = [
    '.lp-inapp{position:sticky;top:0;z-index:200;display:flex;gap:10px;align-items:center;',
    'flex-wrap:wrap;padding:10px 14px;background:#17181A;color:#fff;font-size:13px;line-height:1.45}',
    '.lp-inapp__msg{flex:1 1 240px;min-width:0}',
    '.lp-inapp__msg b{color:#9ED700}',
    '.lp-inapp__act{display:flex;gap:8px;align-items:center;flex:none}',
    '.lp-inapp__btn{appearance:none;border:0;border-radius:9px;padding:7px 12px;cursor:pointer;',
    'background:#9ED700;color:#17181A;font-weight:800;font-size:12.5px;text-decoration:none;',
    'font-family:inherit;white-space:nowrap}',
    '.lp-inapp__x{appearance:none;border:0;background:transparent;color:#9AA0A6;',
    'font-size:15px;cursor:pointer;padding:4px 6px;line-height:1}',
    '@media print{.lp-inapp{display:none}}',
  ].join('');

  function injectCss(doc) {
    var d = doc || (typeof document !== 'undefined' ? document : null);
    if (!d || d.getElementById('lp-inapp-css')) return;
    var s = d.createElement('style');
    s.id = 'lp-inapp-css';
    s.textContent = CSS;
    (d.head || d.documentElement).appendChild(s);
  }

  /** 화면에서는 이것 한 줄만 부르면 된다 */
  function auto(opts) {
    var o = opts || {};
    injectCss(o.doc);
    return mount(o);
  }

  /* ── 링크 가드 — about:blank#blocked 근본 차단 (2026-08-20, 앱 inapp-guard.js 이식) ──
     [왜 여기인가] 이 화면들은 앱(iframe)과 카톡 [자세히 보기] 양쪽에서 열린다. 인앱 웹뷰는
     target="_blank" 새 탭을 못 열어 빈 화면(about:blank#blocked)이 뜬다 — 앱 저장소에서
     6회 재발한 사고다. 화면마다 인라인 주입하면 드리프트라 **이 모듈이 스스로 단다**.
     [원칙] ① 인터셉터는 무조건 등록(감지가 빗나가도 안전) — 감지는 새 탭 허용 판단에만
            ② download 앵커는 건드리지 않는다 ③ window.open 은 감싸되 원본을 보존한다. */
  function guard(doc) {
    var d = doc || (typeof document !== 'undefined' ? document : null);
    if (!d || !d.defaultView) return false;
    var w = d.defaultView;
    if (w.__lpInAppGuard) return true;
    w.__lpInAppGuard = true;
    var inApp = detect(w.navigator && w.navigator.userAgent || '').inApp;
    var route = function (url) {
      if (!inApp) return false;               // 일반 브라우저 — 네이티브 새 탭 허용
      var r = escapeRoute(detect(w.navigator && w.navigator.userAgent || ''), url);
      if (r.kind === 'scheme' || r.kind === 'intent') {
        try { w.location.href = r.url; } catch (_) {}
        // 스킴이 처리되지 않으면 화면이 그대로 남는다 → 같은 탭 이동 폴백 (앱 가드와 같은 규칙)
        setTimeout(function () { try { if (!w.document.hidden) w.location.href = url; } catch (_) {} }, 1200);
      } else {
        // iOS 인앱 — 외부 브라우저를 강제로 못 연다. 같은 탭으로 연다(빈 화면보다 낫다)
        try { w.location.href = url; } catch (_) {}
      }
      return true;
    };
    d.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a[target="_blank"]') : null;
      if (!a || a.hasAttribute('download')) return;
      var url = a.href; if (!url || /^javascript:/i.test(url)) return;
      if (route(url)) { e.preventDefault(); e.stopPropagation(); }
    }, true);
    var _open = w.open;
    w.open = function (url, name, feat) {
      if (url && route(String(url))) return null;
      try { return _open ? _open.call(w, url, name, feat) : null; } catch (_) { return null; }
    };
    return true;
  }
  if (typeof document !== 'undefined') { try { guard(document); } catch (_) { /* 화면이 아닌 곳(테스트)에서는 조용히 */ } }

  return { BUILD: LP_BUILD,
    guard: guard, detect: detect, escapeRoute: escapeRoute, mount: mount, auto: auto,
    injectCss: injectCss, CSS: CSS, APPS: APPS };
}));

</script>
<script>
LinkPilotApp.mount(document.getElementById('lp-root'));
/* 지침 §1 — 메신저 인앱 브라우저면 [외부 브라우저로 열기] 배너를 띄운다.
   인앱이 아니면 아무것도 하지 않는다 (오탐이 미탐보다 나쁘다) */
LinkPilotInApp.auto();
</script>
