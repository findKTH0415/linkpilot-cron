<style>/*
 * tokens.css — **LinkPilot Design System v1.1 의 토큰. 단일 출처.**
 *
 * 값은 디자인 시스템 문서(DESIGN_SYSTEM.md §2·§3·§4)에서 그대로 가져왔다.
 * **여기 없는 색을 화면에 직접 적지 않는다.**
 *
 * ★★ 왜 파일로 뺐는가 (2026-08-17):
 *   화면마다 `:root` 를 복붙하고 있었고 **이미 갈려 있었다** — `--lime-deep` 이
 *   `#5C7A00` · `#4F6900` · `#4F6A00` 세 값으로 흩어져 있었다(실측).
 *   그리고 셋 다 디자인 시스템의 `#7BA10F` 가 아니었다. 복붙은 「지금은 같다」일
 *   뿐이고, 갈리는 날 아무도 눈치채지 못한다.
 *
 * ★ 옛 이름을 지우지 않고 **새 값으로 잇는다.** 화면 다섯이 `--lime`·`--ink`·`--bg`
 *   같은 이름을 쓰고 있어서, 이름을 한꺼번에 바꾸면 한 화면만 놓쳐도 그 화면이
 *   **색 없이 뜨고 오류는 안 난다** — CSS 는 모르는 변수를 조용히 넘긴다.
 *   그래서 옛 이름을 `var(--lp-*)` 로 이어 두고, 새로 쓰는 곳은 `--lp-*` 를 쓴다.
 *
 * ★ 브랜드 라임은 **강조에만.** 큰 면을 채우지 않는다 (§11).
 * ★ 라임 위 글자는 **네이비**다. 흰 글자는 대비가 안 나온다 (§11).
 */

:root {
  /* ── Brand (DESIGN_SYSTEM §2) ─────────────────────────── */
  --lp-brand:        #AAE106;   /* 로고 라임 · 칩 · 브랜드 점 */
  --lp-brand-deep:   #7BA10F;   /* 흰 바탕 위 브랜드 글자 · 활성 탭 · 포커스 링 */
  --lp-brand-soft:   #F0FAD8;   /* 활성 탭 채움 · 호버 배경 */
  --lp-brand-ink:    #0A1419;   /* 라임 위의 글자/아이콘 — 흰색 금지 */
  --lp-navy:         #0A1419;

  /* ── System (iOS) — 의미로만 쓴다. 장식으로 쓰지 않는다 ─── */
  --lp-red:    #FF3B30;   /* 지남 · 오류 · 긴급 */
  --lp-orange: #FF9500;   /* 경고 · 마감 임박 */
  --lp-yellow: #FFCC00;
  --lp-green:  #34C759;   /* 완료 */
  --lp-blue:   #007AFF;   /* 링크 · 정보 · 진행 중 */
  --lp-purple: #AF52DE;

  /* ── Surfaces (3단계만. 넷째를 만들지 않는다 §6) ────────── */
  --lp-surface-grouped: #F2F2F7;
  --lp-surface-card:    #FFFFFF;
  --lp-surface-glass:   rgba(255,255,255,0.86);
  --lp-fill-3:          rgba(120,120,128,0.12);
  --lp-hairline:        rgba(60,60,67,0.16);

  /* ── Text ─────────────────────────────────────────────── */
  --lp-text-1: #0A1419;
  --lp-text-2: rgba(60,60,67,0.78);
  --lp-text-3: rgba(60,60,67,0.6);
  --lp-text-4: rgba(60,60,67,0.45);   /* 라벨 전용 — 본문에 쓰지 않는다 */

  /* ── Typography (§3) ──────────────────────────────────── */
  --lp-font: -apple-system, "SF Pro Text", "SF Pro Display",
             system-ui, "Apple SD Gothic Neo", sans-serif;
  /* ★ 한글 본문은 14px 아래로 내리지 않는다. 캡션 11px 은 부수 라벨만 */
  --lp-size-title1:   28px;
  --lp-size-title2:   22px;   /* 모바일 제목은 여기까지 */
  --lp-size-headline: 17px;
  --lp-size-body:     15px;
  --lp-size-footnote: 13px;
  --lp-size-caption:  11px;

  /* ── Spacing (8pt) · Radius (§4) ──────────────────────── */
  --lp-sp-xs: 4px;  --lp-sp-sm: 8px;  --lp-sp-md: 12px;
  --lp-sp-lg: 16px; --lp-sp-xl: 22px; --lp-sp-2xl: 32px; --lp-sp-3xl: 56px;
  --lp-r-sm: 6px;  --lp-r-md: 10px; --lp-r-lg: 14px;   /* 카드 기본 */
  --lp-r-xl: 18px; --lp-r-2xl: 28px; --lp-r-full: 9999px;

  /* ── 떠 있는 것에만 그림자. 카드는 헤어라인으로 가른다 (§6) ── */
  --lp-shadow-glass: 0 8px 24px rgba(0,0,0,0.08);

  /* ══════════════════════════════════════════════════════
   * 옛 이름 → 새 값. **화면을 한꺼번에 안 고쳐도 색이 맞는다.**
   * 새로 쓰는 곳은 위의 `--lp-*` 를 쓴다.
   * ══════════════════════════════════════════════════════ */
  --lime:      var(--lp-brand);
  --lime-deep: var(--lp-brand-deep);
  --lime-soft: var(--lp-brand-soft);
  --ink:       var(--lp-text-1);
  --ink2:      var(--lp-text-3);
  --line:      var(--lp-hairline);
  --panel:     var(--lp-fill-3);
  --bg:        var(--lp-surface-grouped);
  --surface:   var(--lp-surface-card);
  --bad:       var(--lp-red);
  --bad-soft:  #FFEDEC;
  --bad-ink:   #8F1D1D;
  --warn:      var(--lp-orange);
  --warn-soft: #FFF4E5;
  --warn-ink:  #8A5A10;
  --r:         var(--lp-r-xl);
}

/*
 * 포커스 — **보이는 상태가 있어야 한다** (§10 Step 5).
 * 화면마다 다른 색을 쓰고 있어서 여기서 한 번에 정한다.
 */
:where(a, button, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--lp-brand-deep);
  outline-offset: 2px;
}

/* 숫자가 줄을 맞춰야 하는 곳은 전부 tabular (§3 규칙 · §8.2) */
:where(.num, .pct, .cnt, table td, table th) { font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  :where(*) { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>
<style>
/* 색·간격·반경 토큰은 tokens.css 하나가 정한다 (LinkPilot Design System v1.1) */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.55 var(--lp-font);

}

select:focus-visible { outline: 2px solid var(--lime-deep); outline-offset: 2px; }

.prog__h { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 9px; }

.of { font-size: 12px; color: var(--ink2); }
.bar { height: 9px; border-radius: 999px; background: var(--line); overflow: hidden; }

.grp { font-weight: 700; font-size: 11.5px; line-height: 1; font-family: inherit; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink2); margin: 20px 0 9px; }
.doc { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;

.doc--out { background: #FCFDFD; }

/* ── 네 갈래 — 고른 문서로 무엇을 할지 〈2026-08-20 사용자 지시〉 ─────
   ★ 대상이 있어야 뜻이 있는 단추들이다. 그래서 **무엇을 고른 상태인지**를

.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

.act:focus-visible { outline: 2px solid var(--lime-deep); outline-offset: 2px; }
.acts__on { font-size: 12.5px; color: var(--ink2); margin: 10px 0 0; line-height: 1.7; }
.acts__on b { color: var(--ink); }
.acts__why { font-size: 12.5px; color: var(--warn-ink); background: var(--warn-soft);

/* 고른 줄을 눈에 띄게 — 어느 것에 대고 누르는지 보여야 한다 */
.doc { cursor: pointer; }
.doc--on { border-color: var(--lime); box-shadow: inset 0 0 0 1px var(--lime); background: var(--lime-soft); }

<script>
(function () {
  var b = document.getElementById('lp-block');
  var now = document.getElementById('lp-block-now');
  function say() {
    now.textContent = window.__lpBlocked ? '지금: 막힌 판' : '지금: 열린 판';
    b.textContent = window.__lpBlocked ? '열린 판으로 되돌리기' : '배포가 막힌 판으로 보기';
  }
  b.addEventListener('click', function () {
    window.__lpBlocked = !window.__lpBlocked;
    // ★ 저장해 두고 새로 고친다. 프로젝트가 미리 정해져 있으면 고르는 칸이 없어
    //   「다시 고르기」로는 목록을 못 다시 읽는다 — 그 길만 두면 눌러도 안 바뀐다
    try { sessionStorage.setItem('lp-demo-blocked', window.__lpBlocked ? '1' : '0'); }
    catch (e) { /* 저장이 막힌 브라우저 — 아래 「다시 고르기」로 간다 */ }
    say();
    var sel = document.querySelector('#view select');
    if (sel) { sel.dispatchEvent(new Event('change', { bubbles: true })); return; }
    location.reload();
  });
  say();
}());
</script>

   * @param {{projectId:string, section:string, step?:string, why?:string}} opts
   * @returns {{sent:boolean, reason:(string|null)}}
   */
  var OPEN_EVENT = 'lp-open-project';

  function openSection(opts) {
    var o = opts || {};
    if (typeof window === 'undefined' || typeof document === 'undefined') {
      return { sent: false, reason: '브라우저가 아닙니다' };
    }
    var detail = { projectId: o.projectId || null, section: o.section || null };
    if (o.step) detail.step = o.step;
    if (o.why) detail.why = o.why;

    var sent = false;
    try {
      if (window.parent !== window) {
        var msg = { type: OPEN_EVENT, projectId: detail.projectId, section: detail.section };
        if (detail.step) msg.step = detail.step;
        if (detail.why) msg.why = detail.why;
        window.parent.postMessage(msg, window.location.origin);
        sent = true;
      }
    } catch (_) { /* 막혀 있으면 아래 이벤트로 간다 */ }
    try {
      var ev = new CustomEvent(OPEN_EVENT, { detail: detail, cancelable: true });
      // 앱이 받아서 처리하면 `preventDefault()` 로 알려 준다 — 그게 「받았다」의 증거다
      if (!document.dispatchEvent(ev)) sent = true;
    } catch (_) {}

    return { sent: sent, reason: sent ? null : '받는 쪽이 없습니다' };
  }

  return {
    STEPS: STEPS, WHY: WHY, EMBED_CSS: EMBED_CSS,
    SECTIONS: SECTIONS, sectionState: sectionState, sectionOfStep: sectionOfStep,
    SECTION: SECTION, OUTPUTS_SECTION: OUTPUTS_SECTION,
    FILES_SECTION: FILES_SECTION, TABS: TABS,
    stepState: stepState, urlFor: urlFor, stepOfFile: stepOfFile,
    tokensLoaded: tokensLoaded, TOKENS_MISSING: TOKENS_MISSING,
    openSection: openSection, OPEN_EVENT: OPEN_EVENT,
  };
}));
</script>
<script>
(function () {
  'use strict';
  var C = window.LINKPILOT_OUTPUTS;
  var G = window.LinkPilotGate;
  var F = window.LinkPilotFlow;
  var view = document.getElementById('view');

  var state = {
    projects: null,       // null = 아직 안 불러옴
    projectId: C.projectId || null,
    data: null,           // GET /projects/:id/reports 응답 그대로
    error: null,
    loading: false,
    // ── 네 갈래 (2026-08-20) ────────────────────────────────────
    // 고른 문서 하나가 대상이다. 없으면 단추를 **누를 수 있게 두지 않는다** —
    // 대상 없이 눌리면 무엇에 대고 눌렀는지 아무도 모른다
    pickedPath: null,
    preview: null,   // 지금 펴 놓은 문서 { path, name }
    said: null,      // 방금 한 일을 한 줄로 (복사했다 · 앱이 안 받았다 …)
  };

  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (x !== undefined && x !== null && x !== '') n.textContent = String(x);
    return n;
  }
  function add(p) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) p.appendChild(arguments[i]); return p; }

  /** 바이트를 사람이 읽는 크기로. 0 은 '0 B' 로 — 빈칸으로 두면 못 잰 것과 구분이 안 된다 */
  function size(b) {
    if (!(b > 0)) return '0 B';
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
    return (b / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function get(url) {
    return fetch(url, { credentials: 'same-origin' }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) {
        if (!r.ok) throw new Error((b && b.error) || ('서버 오류 (' + r.status + ')'));
        return b;
      });
    });
  }

  /* ── 불러오기 ─────────────────────────────────────────── */

  function loadProjects() {
    if (C.preload && C.preload.projects) {
      state.projects = C.preload.projects;
      return Promise.resolve();
    }
    if (!C.api) { state.projects = []; return Promise.resolve(); }
    return get(C.api + '/projects').then(function (b) {
      state.projects = (b && b.projects) || [];
    }).catch(function (e) { state.error = e.message; state.projects = []; });
  }

  function loadReports() {
    if (!state.projectId) { state.data = null; return Promise.resolve(); }
    if (C.preload && C.preload.reports) {
      state.data = C.preload.reports;
      return Promise.resolve();
    }
    if (!C.api) { state.data = null; return Promise.resolve(); }
    state.loading = true;
    return get(C.api + '/projects/' + encodeURIComponent(state.projectId) + '/reports')
      .then(function (b) { state.data = b; state.error = null; })
      .catch(function (e) { state.error = e.message; state.data = null; })
      .then(function () { state.loading = false; });
  }

  /* ── 조각 ─────────────────────────────────────────────── */

  function picker() {
    var card = el('section', 'card');
    var row = el('div', 'pick');
    add(row, el('label', null, '프로젝트'));

    var sel = document.createElement('select');
    sel.setAttribute('aria-label', '프로젝트 고르기');
    var none = document.createElement('option');
    none.value = '';
    none.textContent = state.projects && state.projects.length ? '— 고르세요 —' : '프로젝트가 없습니다';
    sel.appendChild(none);
    (state.projects || []).forEach(function (p) {
      var o = document.createElement('option');
      o.value = p.id;
      o.textContent = p.name ? (p.name + ' · ' + p.id) : p.id;
      if (p.id === state.projectId) o.selected = true;
      sel.appendChild(o);
    });
    sel.disabled = !(state.projects && state.projects.length);
    sel.addEventListener('change', function () {
      state.projectId = sel.value || null;
      state.data = null;
      draw();
      loadReports().then(draw);
    });
    add(row, sel);
    card.appendChild(row);

    if (state.projects && !state.projects.length) {
      card.appendChild(el('p', 'card__d',
        '아직 만든 프로젝트가 없습니다. 「' + F.SECTION.tab + '」에서 시작하세요.'));
    }
    return card;
  }

  /**
   * 진행 — **서버가 준 분모를 그대로 쓴다.**
   * 여기서 다시 계산하면 산출물이 하나 늘 때 한쪽만 고치는 날 조용히 틀린다.
   */
  function progress(d) {
    var p = d.progress || {};
    var card = el('section', 'card');
    var head = el('div', 'prog__h');

    // ★ 분모가 없으면 % 를 만들지 않는다. 0/0 을 100% 로 적으면
    //   아무것도 안 만든 프로젝트가 「다 됐다」로 보인다
    var hasPct = p.percent !== null && p.percent !== undefined;
    add(head,
      el('b', 'pct', hasPct ? (p.percent + '%') : '—'),
      el('span', 'cnt', (p.done || 0) + ' / ' + (p.total || 0) + '종'),
      el('span', 'of', p.countsWhat || ''));
    card.appendChild(head);

    var bar = el('div', 'bar');
    var fill = el('span', 'bar__f' + (p.done ? '' : ' none'));
    fill.style.width = (hasPct ? p.percent : 0) + '%';
    bar.appendChild(fill);
    card.appendChild(bar);

    card.appendChild(say(d, p, hasPct));

    // 사양을 못 읽었으면 분모가 흔들린다 — 조용히 넘기지 않는다
    if (d.specKnown === false) {
      card.appendChild(el('p', 'card__d',
        '출력 사양을 읽지 못해 형식에 따라 갈리는 산출물(PDF 등)은 세지 않았습니다.'));
    }
    return card;
  }

  /** 진행율에 따라 다른 말을 한다. **100% 는 「보내도 된다」가 아니다** */
  function say(d, p, hasPct) {
    var n = el('p', 'say');
    var blocked = d.distribution && d.distribution.blocked;

    if (!p.total) {
      n.textContent = '아직 만들 것이 정해지지 않았습니다. 「' + F.SECTION.tab
        + '」에서 출력 사양을 확정하면 여기에 목록이 생깁니다.';
      return n;
    }
    if (!p.done) {
      n.textContent = '아직 나온 문서가 없습니다. 「' + F.SECTION.tab + '」 4단계에서 생성을 시작하세요.';
      return n;
    }
    if (p.done < p.total) {
      n.innerHTML = '<b>' + (p.total - p.done) + '종이 아직 안 나왔습니다.</b> '
        + '아래 목록에서 무엇이 남았는지와 그 이유를 볼 수 있습니다.';
      return n;
    }
    // 다 나왔다 — 여기서 「끝났다」로 끝내지 않는다
    n.innerHTML = blocked
      ? '<b>사양에 담은 것은 모두 나왔지만 배포가 막혀 있습니다.</b> 위의 사유를 해소해야 내보낼 수 있습니다.'
      : '<b>사양에 담은 것이 모두 나왔습니다.</b> 100% 는 「만들어졌다」이지 「보내도 된다」가 아닙니다 — '
        + '내보내기 전에 배포 전 교차검증을 지나세요.';
    return n;
  }

  /* ── 네 갈래 ─────────────────────────────────────────────
   *
   * [미리보기] [다운로드] [공유하기] [프로젝트 이동]  〈2026-08-20 사용자 지시〉
   *
   * ★★ 넷 다 **대상이 있어야 뜻이 있다.** 그래서 목록에서 고른 문서 하나를
   *   대고 누른다. 아무것도 안 골랐으면 **누를 수 있게 두지 않는다** — 눌리면
   *   무엇에 대고 눌렀는지 아무도 모르고, 그 상태로 파일이 나가면 되돌릴 수 없다.
   *
   * ★★ **배포가 막혔으면 셋이 다 잠긴다** (미리보기·다운로드·공유하기).
   *   목록에서는 「차단」인데 미리보기로는 열린다면 검증 게이트가 아무 의미도 없다.
   *   「프로젝트 이동」만 열어 둔다 — 그건 파일을 내보내는 일이 아니다.
   *
   * ★ **공유하기는 주소를 복사하는 것까지다.** 남에게 열어 주는 링크를 만들지
   *   않는다 — 그런 길이 서버에 없다. 없는 것을 있는 척하면 사용자는 보냈다고
   *   믿고, 받는 쪽은 열지 못한다. 그래서 무엇을 복사했는지 그대로 말한다.
   */

  /** 미리보기로 펼 수 있는 것 — **열어 보이지 못할 것을 열겠다고 하지 않는다** */
  function canPreview(path) {
    return /\.(html?|md|txt|json|csv|pdf|svg|png|jpe?g)$/i.test(String(path || ''));
  }

  function fileUrl(path) {
    if (!C.api || !state.projectId) return null;
    return C.api + '/projects/' + encodeURIComponent(state.projectId)
      + '/file?rel=' + encodeURIComponent(path);
  }

  /** 지금 고른 문서. 안 골랐으면 **나온 문서 중 첫 번째**를 기본으로 삼는다 */
  function pickedDoc(d) {
    var out = (d.all || d.files || []).filter(function (f) { return f.exists; });
    if (!out.length) return null;
    for (var i = 0; i < out.length; i++) if (out[i].path === state.pickedPath) return out[i];
    return out[0];
  }

  /**
   * 「프로젝트 이동」 — **앱이 옮긴다.** 이 화면은 탭 하나일 뿐이라 스스로
   * 다른 탭으로 갈 수 없다. 그래서 앱에 알리고, **앱이 안 받으면 그렇다고 말한다.**
   * 되는 척하면 사용자는 눌러 놓고 아무 일도 안 일어나는 것을 본다.
   */
  function goProject() {
    // ★ 옮기는 방법은 flow-core 한 곳에 있다 — 화면마다 복사하지 않는다 (2026-08-21)
    var sent = F.openSection({ projectId: state.projectId, section: F.SECTION.id }).sent;
    state.said = sent
      ? '「' + F.SECTION.tab + '」으로 넘겼습니다.'
      : '이 화면은 탭 하나라 스스로 옮길 수 없습니다 — 위 탭에서 「'
        + F.SECTION.tab + '」을 눌러 주십시오.';
    draw();
  }

  /** 「공유하기」 — 주소를 복사한다. **무엇을 복사했는지 그대로 말한다** */
  function share(f) {
    var url = fileUrl(f.path);
    if (!url) return;
    var abs = url;
    try { abs = new URL(url, window.location.href).href; } catch (_) {}
    var done = function (ok) {
      state.said = ok
        ? '주소를 복사했습니다 — 이 주소는 **로그인한 사람만** 열 수 있습니다. '
          + '바깥으로 보내려면 파일을 내려받아 보내십시오.'
        : '주소를 복사하지 못했습니다 (브라우저가 막았습니다). 「다운로드」로 받아 보내십시오.';
      draw();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(abs).then(function () { done(true); }, function () { done(false); });
    } else {
      done(false);
    }
  }

  /**
   * 네 갈래 줄. **설명 바로 아래**에 둔다 — 무엇을 할 수 있는지가 목록보다 먼저다.
   */
  function actions(d) {
    var blocked = !!(d.distribution && d.distribution.blocked);
    var f = pickedDoc(d);
    var box = el('section', 'card');

    var row = el('div', 'acts');

    // ① 미리보기 — 이 자리에서 편다 (새 창을 열면 인앱 브라우저에서 돌아오지 못한다)
    var open = state.preview && f && state.preview.path === f.path;
    var prev = el('button', 'act' + (open ? ' on' : ''), open ? '미리보기 닫기' : '미리보기');
    prev.type = 'button';
    prev.disabled = !f || blocked || !C.api || !canPreview(f && f.path);
    prev.addEventListener('click', function () {
      state.said = null;
      state.preview = open ? null : { path: f.path, name: f.name };
      draw();
    });
    row.appendChild(prev);

    // ② 다운로드 — 목록의 것과 **같은 주소**다. 두 벌로 만들지 않는다
    var dl = document.createElement('a');
    dl.className = 'act';
    dl.textContent = '다운로드';
    if (!f || blocked || !C.api) {
      dl.setAttribute('aria-disabled', 'true');
      dl.href = '#';
    } else {
      dl.href = fileUrl(f.path);
      dl.setAttribute('download', '');
    }
    row.appendChild(dl);

    // ③ 공유하기 — 주소 복사까지다 (§ 위 주석)
    var sh = el('button', 'act', '공유하기');
    sh.type = 'button';
    sh.disabled = !f || blocked || !C.api;
    sh.addEventListener('click', function () { share(f); });
    row.appendChild(sh);

    // ④ 프로젝트 이동 — **막혀 있어도 열어 둔다** (파일을 내보내는 일이 아니다)
    var go = el('button', 'act', '프로젝트 이동');
    go.type = 'button';
    go.disabled = !state.projectId;
    go.addEventListener('click', goProject);
    row.appendChild(go);

    box.appendChild(row);

    // ★ **무엇에 대고 누르는지**를 적는다. 안 적으면 어느 문서인지 모른 채 누른다
    if (f) {
      box.appendChild(add(el('p', 'acts__on'),
        document.createTextNode('고른 문서 '), el('b', null, f.name),
        document.createTextNode(' · ' + f.path)));
    } else {
      box.appendChild(el('p', 'acts__on', '아직 나온 문서가 없어 고를 것이 없습니다.'));
    }

    // ★ 잠근 이유를 **적는다.** 이유 없이 회색이면 고장으로 읽힌다
    var why = blocked ? '배포가 막혀 있어 미리보기·다운로드·공유가 잠겼습니다. 위의 사유를 먼저 해소하십시오.'
      : !C.api ? '서버가 연결되어 있지 않아 파일을 열 수 없습니다.'
      : (f && !canPreview(f.path)) ? ('이 형식(' + String(f.path).split('.').pop()
          + ')은 브라우저에서 펴 볼 수 없습니다 — 내려받아서 여십시오.')
      : null;
    if (why) box.appendChild(el('p', 'acts__why', why));
    if (state.said) box.appendChild(el('p', 'acts__on', state.said));

    var pv = previewBox(f, blocked);
    if (pv) box.appendChild(pv);
    return box;
  }

  /** 펴 놓은 문서. **새 창을 열지 않는다** — 인앱 브라우저에서는 돌아오지 못한다 */
  function previewBox(f, blocked) {
    if (!state.preview || !f || state.preview.path !== f.path) return null;
    if (blocked || !C.api) return null;
    var box = el('div', 'pv');
    var h = el('div', 'pv__h');
    h.appendChild(el('span', null, f.name));
    var x = el('button', 'pv__x', '닫기');
    x.type = 'button';
    x.addEventListener('click', function () { state.preview = null; draw(); });
    h.appendChild(x);
    box.appendChild(h);

    if (!canPreview(f.path)) {
      box.appendChild(el('p', 'pv__no', '이 형식은 브라우저에서 펴 볼 수 없습니다.'));
      return box;
    }
    var fr = document.createElement('iframe');
    fr.src = fileUrl(f.path);
    fr.setAttribute('title', f.name);
    // ★ 산출물 안의 스크립트를 이 화면 권한으로 돌리지 않는다
    fr.setAttribute('sandbox', '');
    box.appendChild(fr);
    return box;
  }

  /** 배포 차단 — **목록보다 위**에 둔다. 아래에 두면 파일만 보고 내보낸다 */
  function blocker(d) {
    if (!(d.distribution && d.distribution.blocked)) return null;
    var box = el('div', 'block');
    add(box, el('div', 'block__t', '배포가 막혀 있습니다'));
    box.appendChild(el('p', null,
      '파일은 만들어졌지만 검증을 통과하지 못했습니다. 내려받기도 열리지 않습니다.'));
    var ul = el('ul');
    (d.distribution.reasons || []).forEach(function (r) {
      ul.appendChild(el('li', null, typeof r === 'string' ? r : (r && (r.message || r.id)) || ''));
    });
    if (ul.childNodes.length) box.appendChild(ul);
    return box;
  }

  function docRow(f, blocked, picked) {
    var row = el('div', 'doc ' + (f.exists ? 'doc--out' : 'doc--wait')
      + (picked ? ' doc--on' : ''));
    if (f.exists) {
      // ★ 줄을 눌러 고른다. 위 네 갈래가 **이 문서**에 대고 동작한다
      row.setAttribute('role', 'button');
      row.tabIndex = 0;
      row.setAttribute('aria-pressed', picked ? 'true' : 'false');
      var pick = function (ev) {
        // 내려받기 링크를 누른 것은 고르기가 아니다 — 그대로 내려받게 둔다
        if (ev.target && ev.target.closest && ev.target.closest('a')) return;
        state.pickedPath = f.path;
        state.said = null;
        state.preview = null;   // 다른 문서를 골랐는데 앞 문서가 펴져 있으면 헷갈린다
        draw();
      };
      row.addEventListener('click', pick);
      row.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick(ev); }
      });
    }
    var b = el('div', 'doc__b');
    add(b, el('div', 'doc__n', f.name));

    if (f.exists) {
      add(b, el('div', 'doc__m', f.path + ' · ' + size(f.bytes) + (f.at ? ' · ' + f.at.slice(0, 16).replace('T', ' ') : '')));
    } else {
      add(b, el('div', 'doc__m', f.path));
      // ★ 이유 없이 회색이면 고장으로 읽힌다
      if (f.why) add(b, el('div', 'doc__w', f.why));
    }
    row.appendChild(b);

    if (!f.exists) {
      row.appendChild(el('span', 'tag ' + (f.expected ? 'tag--wait' : 'tag--maybe'),
        f.expected ? '아직' : '나올 수도'));
      return row;
    }

    var a = document.createElement('a');
    a.className = 'btn';
    a.textContent = '내려받기';
    if (blocked || !C.api) {
      // 목록에서는 「차단」인데 파일은 열린다면 검증 GATE 가 아무 의미도 없다
      a.setAttribute('aria-disabled', 'true');
      a.setAttribute('title', blocked ? '배포가 막혀 있습니다' : '서버가 연결되어 있지 않습니다');
      a.href = '#';
    } else {
      a.href = C.api + '/projects/' + encodeURIComponent(state.projectId)
        + '/file?rel=' + encodeURIComponent(f.path);
      a.setAttribute('download', '');
    }
    row.appendChild(a);
    return row;
  }

  function list(d) {
    var box = document.createDocumentFragment();
    var all = d.all || d.files || [];
    var blocked = !!(d.distribution && d.distribution.blocked);

    var out = all.filter(function (f) { return f.exists; });
    var wait = all.filter(function (f) { return !f.exists && f.expected; });
    var maybe = all.filter(function (f) { return !f.exists && !f.expected; });

    if (out.length) {
      var on = pickedDoc(d);
      box.appendChild(el('div', 'grp', '나온 문서 ' + out.length + '종'));
      out.forEach(function (f) {
        box.appendChild(docRow(f, blocked, !!(on && on.path === f.path)));
      });
    }
    if (wait.length) {
      box.appendChild(el('div', 'grp', '아직 안 나온 것 ' + wait.length + '종'));
      wait.forEach(function (f) { box.appendChild(docRow(f, blocked)); });
    }
    // ★ 조건부는 분모 밖이지만 **목록에서 빼지 않는다** — 빼면 「없는 기능」이 된다
    if (maybe.length) {
      box.appendChild(el('div', 'grp', '이 딜에서는 안 나오는 것 ' + maybe.length + '종'));
      maybe.forEach(function (f) { box.appendChild(docRow(f, blocked)); });
    }
    return box;
  }

  /* ── 그리기 ───────────────────────────────────────────── */

  function draw() {
    view.textContent = '';
    if (!C.inTab) view.appendChild(el('h1', null, '완성 보고서'));

    // ★ 토큰이 안 실리면 색·글꼴이 통째로 빠지는데 **오류는 안 난다.**
    //   「화면이 이상하다」로 끝나지 않게 원인을 화면이 말한다
    if (F.tokensLoaded() === false) {
      var tw = el('div', 'nostyle', F.TOKENS_MISSING);
      tw.setAttribute('role', 'alert');
      // 토큰이 없는 상황이므로 var() 를 쓰지 않는다 — 인라인으로 칠한다
      tw.setAttribute('style', 'margin:0 0 14px;padding:12px 14px;border-radius:10px;background:#FFF4E5;color:#8A5A10;border:1px solid #F0DEBE;font-size:13.5px;line-height:1.6');
      view.appendChild(tw);
    }

    var a = G.access(C.session, C.requiredPlan);
    if (!a.allowed) {
      var m = G.accessMessage(a, (C.planNames || {})[C.requiredPlan] || C.requiredPlan, '완성 보고서');
      var g = el('section', 'card');
      add(g, el('h2', 'card__t', (m && m.title) || '사용할 수 없습니다'),
        el('p', 'card__d', (m && m.body) || ''));
      view.appendChild(g);
      return;
    }

    if (!C.api && !C.preload) {
      var s = el('section', 'card');
      add(s, el('h2', 'card__t', '서버가 연결되어 있지 않습니다'),
        el('p', 'card__d', '산출물 목록은 서버에서 받아 옵니다. 화면만으로는 만들 수 없습니다 — '
          + '「생성됨」을 화면이 기억해 두면 파일이 없어져도 있다고 말하기 때문입니다.'));
      view.appendChild(s);
      return;
    }

    if (!C.projectId) view.appendChild(picker());

    if (state.error) {
      view.appendChild(add(el('section', 'card'), el('p', 'msg msg--bad', state.error)));
      return;
    }
    if (!state.projectId) {
      view.appendChild(add(el('section', 'card'),
        el('p', 'msg', '프로젝트를 고르면 그 프로젝트에서 나온 문서가 여기 뜹니다.')));
      return;
    }
    if (state.loading || !state.data) {
      view.appendChild(add(el('section', 'card'),
        el('p', 'msg', state.loading ? '목록을 불러오는 중입니다…' : '목록이 없습니다.')));
      return;
    }

    var d = state.data;
    var b = blocker(d);
    if (b) view.appendChild(b);          // ★ 목록보다 위 — 파일만 보고 내보내지 않게
    // ★ 네 갈래는 **차단 안내 다음, 목록보다 먼저**다 〈2026-08-20 사용자 지시〉.
    //   차단보다 위에 두면 잠긴 단추를 먼저 보고 왜 잠겼는지를 나중에 읽는다
    view.appendChild(actions(d));
    view.appendChild(progress(d));
    view.appendChild(list(d));

    view.appendChild(el('p', 'note',
      '목록은 파일이 실제로 있는지로 판정합니다 — 「생성됨」 표시를 믿지 않습니다. '
      + '내려받기는 검증을 통과한 산출물만 열립니다.'));
  }

  draw();
  loadProjects().then(function () {
    draw();
    return loadReports();
  }).then(draw);
})();
</script>
</div>
