<!doctype html>
<html lang="ko" data-lp-build="18aeb517">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보고서 생성 · LINKPILOT</title>
<!--
  report-flow.html — 앱의 [보고서 생성] 섹션에 그대로 끼우는 화면.

  ★ 무엇이 달라지는가:
    지금 앱의 [보고서 생성] 은 **기반정보를 내보내는 곳**이다 — 값 입력은
    바깥 AGENT 가 받는다. 그러면 「출처 없는 숫자는 들어올 수 없다」를 앱이
    강제할 수 없다. 출처 검사·계산 항목 차단·사양 확정이 전부 바깥에 있기 때문이다.
    이 화면은 **값 입력을 앱 안으로 들여온다.** 내보내기 경로는 지우지 않고 아래에 남긴다.

  ★ 4단계는 flow-core.js 하나가 정한다. 미리보기(build-preview.js)도 같은 파일을
    읽는다 — 목록이 두 벌이 되면 제품과 미리보기가 다른 흐름을 보여준다.

  ★ 단계 화면(intake·fields·reports)을 **복사하지 않는다.** 그 화면들을 그대로
    끼운다. 복사하면 출처 검사가 두 벌이 되고, 한쪽만 고치는 날 규칙이 갈린다.

  ★ 잠긴 단계는 회색으로만 두지 않고 **이유를 적는다.** 이유 없는 회색은
    고장으로 보이고, 사용자는 앱이 죽었다고 판단한다.

  앱에 붙이는 법 — 아래 window.LINKPILOT_REPORT_FLOW 만 채운다.
    api      본체 API 주소 (예: '/api/linkpilot')
    base     단계 화면들이 놓인 경로 (예: '/im/'). 같은 폴더면 빈 문자열
    session  로그인·플랜 (gate-core.js 가 판정한다)
-->
<script>
/* ★★ **오래 걸리면 말한다** 〈2026-08-21〉. 뼈대만 두고 끝나면 그것도 흰 화면과
 *   다를 바 없다 — 「채워지는 중」이 영원히 채워지지 않는 것을 사용자가 알
 *   방법이 없기 때문이다. 뼈대가 그대로 남아 있으면 무엇을 해야 하는지 적는다.
 *   ★ 화면이 떴으면 `#boot` 이 통째로 사라지므로 이 글은 나오지 않는다. */
(function () {
  setTimeout(function () {
    var w = document.getElementById('lp-boot-why');
    if (!w || !document.getElementById('lp-boot')) return;
    w.hidden = false;
    w.textContent = '아직 화면이 안 떴습니다. 연결이 느리거나 화면 파일을 못 받은 것입니다 — '
      + '새로고침해 보시고, 그래도 그대로면 알려 주십시오.';
  }, 8000);
})();
</script>
<script>
/* ★★★ **빈 화면으로 끝나지 않는다** 〈2026-08-24 사장님: 데스크탑에서 흰 화면〉.
 *
 *   화면이 통째로 비어 뜬 일이 있었다. 소스는 멀쩡했고 헤드리스로 열면
 *   정상이었다 — 즉 **그 순간의 브라우저에서만** 무언가가 안 왔다.
 *
 *   ★ 가장 흔한 자리: 배포가 파일을 하나씩 갈아 끼우는 동안(70초쯤) 화면은
 *     새 판인데 형제 스크립트가 **아직 안 올라와 404** 인 순간이 있다.
 *     그러면 전역이 아예 안 생기고, 첫 줄에서 예외가 나고, **화면은 흰 채로
 *     아무 말도 안 한다.**
 *   ★ 아래쪽 **짝 확인 조각**은 옛 스크립트는 잡지만 **없는 스크립트**는
 *     못 잡는다 — 견줄 전역 자체가 없기 때문이다. 여기가 그 구멍이다.
 *     (그 조각의 표시 이름을 여기 글자로 적지 않는다. 그것을 찾는 검사가
 *      이 주석을 코드로 오해한다 — CLAUDE.md §8 에서 세 번째로 당한 자리다.)
 *
 * ★ 그래서 ① 파일이 안 온 것과 ② 코드가 던진 것을 **둘 다** 사람 말로 띄운다.
 * ★ 이 조각은 **형제 스크립트보다 먼저** 있어야 한다. 뒤에 두면 이미 난
 *   불러오기 실패를 못 듣는다.
 * ★ 검사 자신이 죽으면 안 된다 — 전부 try 로 감싼다. */
(function () {
  /* ★★★★ **자리를 「고치는」 것이 아니라 「틀리지 않게」 한다**
   *   〈2026-08-26 · 같은 고장 **네 번째** · M-56〉.
   *
   *   앱이 이 화면을 어디에 얹느냐에 따라 형제 파일 주소가 두 가지로 틀렸다 —
   *
   *     겹침    /im-flow/im-flow/embed-bridge.js   (앞을 두 번 붙인다)
   *     빠짐    /embed-bridge.js                   (앞을 아예 안 붙인다)
   *
   *   ★ 3판은 **겹침만** 고쳤다. 그래서 빠짐이 나자 또 빨간 띠가 떴다.
   *     **한 증상만 보고 고치면 남은 증상이 다음 주에 온다.**
   *
   * ★★ 그래서 「무엇이 틀렸나」를 고치지 않고 **「어디가 맞나」를 정한다.**
   *   형제 파일들은 늘 **한 폴더에 함께** 있다. 그 폴더를 세 가지로 찾는다 —
   *
   *     ① 앱이 알려 준 자리      `<meta name="lp:base">` 또는 window.LP_BASE
   *     ② 주소에 `im-flow` 가 있으면 **첫 번째** 것까지  (겹침이 여기서 풀린다)
   *     ③ 뿌리(`/`)에서 열렸으면 `/im-flow/`             (빠짐이 여기서 풀린다)
   *
   *   ①이 있는 이유: 앱이 다른 자리에 얹게 되는 날 **코드를 안 고치고**
   *   알려 줄 길을 남겨 둔다. 없으면 그날 또 이 파일을 고치게 된다.
   *
   * ★★★ **파일로 열었을 때(file:)는 손대지 않는다.** 미리보기가 그 길이다 —
   *   거기서 자리를 바꾸면 멀쩡한 화면이 깨진다 (늑대야).
   *
   * ★ 이 조각은 형제 파일들보다 **위**에 있으므로, 여기서 `<base>` 를 세우면
   *   아래 상대 경로들이 **처음부터 옳은 자리**를 본다 — 실패가 아예 안 난다.
   *   실패한 뒤에 다시 부르는 것으로는 부족했다(실측: 파일 17개를 다시 받았는데
   *   **버튼이 5개에서 0개**가 되었다 — 이미 초기화가 끝난 뒤였다).
   */
  try {
    var FOLDER = 'im-flow';                  /* 형제 파일들이 함께 사는 폴더 이름 */
    var base = null;
    var why = null;

    /* ① 앱이 알려 준 자리 */
    try {
      var meta = document.querySelector('meta[name="lp:base"]');
      var told = (meta && meta.getAttribute('content')) || window.LP_BASE || null;
      if (told) { base = String(told).replace(/\/*$/, '') + '/'; why = '앱이 알려 줌'; }
    } catch (_) { /* 무시 */ }

    if (!base && /^https?:$/.test(location.protocol)) {
      var pathname = String(location.pathname);
      var at = pathname.indexOf('/' + FOLDER + '/');
      if (at >= 0) {
        /* ② 첫 번째 `/im-flow/` 까지가 그 폴더다. 두 번 이어져 있어도 여기서 풀린다 */
        base = pathname.slice(0, at + FOLDER.length + 2);
        why = '주소에서 찾음';
      } else if (pathname.lastIndexOf('/') === 0) {
        /* ③ 뿌리에서 열렸다 — 형제 파일이 뿌리에 있을 리 없다 */
        base = '/' + FOLDER + '/';
        why = '뿌리에서 열려 폴더를 붙임';
      }
    }

    /* 지금 자리와 같으면 아무것도 하지 않는다 — 멀쩡한 화면을 건드리지 않는다 */
    var now = String(location.pathname).slice(0, String(location.pathname).lastIndexOf('/') + 1);
    if (base && base !== now && !document.querySelector('base[data-lp-base]')) {
      var b = document.createElement('base');
      b.setAttribute('data-lp-base', why);
      b.href = location.origin + base;
      (document.head || document.documentElement).insertBefore(
        b, (document.head || document.documentElement).firstChild);
      /* ★★ **조용히 넘어가지는 않는다.** 화면은 살렸지만 **근본은 앱 쪽**이다
       *   (앞을 붙이는 쪽). 사장님 화면에 빨간 띠를 띄우면 멀쩡히 도는 화면을
       *   고장으로 읽으시게 되므로, 개발자 콘솔과 표시로만 남긴다 —
       *   사람은 안 놀라고, 기계는 셀 수 있다. */
      try {
        console.warn('[LinkPilot] 형제 파일 자리를 바로잡았다 (' + why + '): '
          + now + ' → ' + base
          + ' — 화면은 정상이지만 **앞부분을 붙이는 앱 쪽**이 근본이다.');
      } catch (_) { /* 콘솔이 없어도 죽지 않는다 */ }
    }
  } catch (_) { /* 자리를 못 고쳐도 죽지 않는다 — 아래 띠가 받는다 */ }

  var shown = false;
  /**
   * ★★★ **고쳤다는 말과 못 고쳤다는 말을 같은 색으로 하지 않는다**
   *   〈2026-08-26 · 자가치유를 넣으면서〉.
   *
   *   빨강은 「화면이 안 뜬다」는 뜻이어야 한다. 스스로 고쳐서 화면이
   *   멀쩡히 뜬 경우까지 빨강으로 적으면, 사장님은 **멀쩡한 화면을 보며
   *   고장이라고 읽으신다** — 그러면 다음부터 빨간 띠를 안 믿게 된다.
   *
   * ★★ 그리고 **빗장(shown)을 경고에는 걸지 않는다.** 앞 판은 한 번 뜨면
   *   끝이라, 자가치유 알림이 먼저 뜨면 **뒤에 오는 진짜 실패가 통째로
   *   조용해졌다.** 조용한 실패가 이 저장소에서 가장 비쌌다.
   */
  function say(msg, kind) {
    var warn = kind === 'warn';
    if (shown) return;
    if (!warn) shown = true;          /* 치명만 빗장을 건다 */
    try {
      var n = document.createElement('div');
      n.setAttribute('data-lp-fail', warn ? 'warn' : '');
      n.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:99999;'
        + 'background:' + (warn ? '#8A6100' : '#C00000')
        + ';color:#fff;padding:14px 18px;font:700 14px/1.5 system-ui,sans-serif');
      n.textContent = msg;
      var put = function () { if (document.body) document.body.appendChild(n); };
      if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
    } catch (_) { /* 알리다 죽지 않는다 */ }
  }
  /* 불러오기 실패는 거품이 안 올라온다 — 잡기 단계(true)에서 들어야 한다 */
  window.addEventListener('error', function (e) {
    try {
      var t = e && e.target;
      if (!t || !t.tagName) return;
      var tag = String(t.tagName).toUpperCase();
      if (tag !== 'SCRIPT' && tag !== 'LINK') return;
      /* ★★★ **이름만으로는 갈라 낼 수 없다** 〈2026-08-25 · 실제로 못 갈랐다〉.
       *   앱 안에서 이 띠가 떴을 때 「그 파일이 NAS 에 없다」와 「앱이 엉뚱한
       *   자리에서 찾는다」가 **똑같이 파일 이름 하나로만** 보였다. 파일은
       *   NAS 에 있었고 HTTP 200 이었는데도 그랬다 — 갈랐어야 할 것은
       *   **어느 경로로 찾았나**이고, 그것이 이름을 자르면서 사라졌다.
       * ★ 호스트는 뗀다 (CLAUDE.md §2). 경로만 있으면 갈린다. */
      var raw = String(t.src || t.href || '');
      var where = raw;
      try { var u = new URL(raw, location.href); where = u.pathname + u.search; } catch (_) {}
      /* ★★★ **경로가 겹쳤으면 그렇다고 말한다** 〈2026-08-26 · 실제로 났다〉.
       *   앱 안에서 `/im-flow/im-flow/tokens.css` 로 찾다가 못 받았다.
       *   이 화면들의 링크는 **전부 상대 경로**(`tokens.css`)라 앞을 붙이지
       *   않는다 — 즉 앞부분을 **덧붙이는 쪽은 앱**이다.
       *
       *   ★ 그런데 띠는 「못 받았습니다」만 말했다. 그러면 「파일이 없다」와
       *     「엉뚱한 자리에서 찾는다」가 **같은 문장으로 보인다.** 사장님은
       *     새로고침을 하시고, 그래도 그대로면 그때부터 원인을 못 찾는다.
       *   ★ 같은 토막이 두 번 이어지는 것은 **새로고침으로 안 없어진다.**
       *     그것은 배포가 도는 중이라서가 아니라 **주소를 만드는 코드**의 일이다. */
      var dup = null;
      try {
        var segs = String(where).split('?')[0].split('/').filter(Boolean);
        for (var i = 0; i + 1 < segs.length; i++) {
          if (segs[i] === segs[i + 1]) { dup = segs[i]; break; }
        }
      } catch (_) { /* 무시 */ }
      if (dup) {
        /* ★★★ **띠는 진단만 했다 — 그래서 같은 일이 계속 났다** 〈2026-08-26 · 세 번째〉.
         *
         *   앞 판 둘은 **메시지를 좋게 만드는 일**이었다. 「못 받았습니다」에
         *   경로를 붙이고, 다시 「두 번 들어 있습니다」를 붙였다. 그런데
         *   **화면은 여전히 안 떴다.** 사장님이 보시는 것은 같은 빨간 띠다.
         *
         * ★ 잘 설명하는 고장은 **고장이다.** 여기서 스스로 고친다 —
         *   겹친 토막을 하나 지우고 **그 파일을 다시 부른다.**
         *
         * ★★ 앞을 덧붙이는 것은 앱 쪽이지만, **고치는 것은 이쪽이 할 수 있다.**
         *   저쪽 저장소에 쓰지 않기로 한 경계(§8-2)를 지키면서 화면은 살린다.
         *
         * ★★★ **한 번만 고친다.** 고친 주소가 또 실패하면 그때는 진짜로
         *   파일이 없는 것이다 — 무한히 다시 부르면 그 사실이 사라진다. */
        var fixed = null;
        try {
          var u2 = new URL(raw, location.href);
          var ss = u2.pathname.split('/');
          for (var k = 0; k + 1 < ss.length; k++) {
            if (ss[k] && ss[k] === ss[k + 1]) { ss.splice(k, 1); break; }
          }
          u2.pathname = ss.join('/');
          fixed = u2.href;
        } catch (_) { fixed = null; }

        if (fixed && fixed !== raw && !t.getAttribute('data-lp-healed')) {
          var el = tag === 'LINK'
            ? document.createElement('link')
            : document.createElement('script');
          el.setAttribute('data-lp-healed', '1');
          if (tag === 'LINK') { el.rel = 'stylesheet'; el.href = fixed; }
          else {
            el.src = fixed;
            /* 원래 태그가 지녔던 표시를 그대로 옮긴다 — 이것이 없으면
               `embed-bridge.js` 가 어느 전역에 붙을지 모른다 */
            var g = t.getAttribute('data-lp-global');
            if (g) el.setAttribute('data-lp-global', g);
            el.async = false;   /* 순서를 지킨다 — 뒤 파일이 앞 파일을 쓴다 */
          }
          t.setAttribute('data-lp-healed', '1');
          (document.head || document.documentElement).appendChild(el);
          say('경로에 「' + dup + '」가 두 번 들어 있어 **한 번 고쳐서 다시 불렀습니다** — '
            + where + ' → ' + (function () {
              try { var v = new URL(fixed); return v.pathname + v.search; } catch (_) { return fixed; }
            }()) + '. 화면이 뜨면 그대로 쓰셔도 됩니다. 앞부분을 덧붙이는 것은 **앱 쪽**이라 '
            + '근본은 그쪽에서 고쳐야 합니다 — 이 경로를 그대로 알려 주십시오.', 'warn');
          return;
        }
        say('화면에 필요한 파일을 못 받았습니다: ' + (where || '(이름 모름)')
          + ' — 경로에 「' + dup + '」가 **두 번** 들어 있습니다.'
          + ' 고쳐서 다시 불러 봤지만 그것도 실패했습니다 — 파일이 정말 없는 자리입니다.'
          + ' 위 경로를 그대로 알려 주십시오.');
      } else {
        say('화면에 필요한 파일을 못 받았습니다: ' + (where || '(이름 모름)')
          + ' — 배포가 도는 중이면 30초 뒤 새로고침(Mac ⌘⇧R · Windows Ctrl+Shift+R)으로 사라집니다.'
          + ' 한 번 하고도 그대로면 그것은 **다른 일**입니다 — 위 경로를 그대로 알려 주십시오.');
      }
    } catch (_) { /* 무시 */ }
  }, true);
  /* ★★★ **헛울음을 내지 않는다** 〈2026-08-24 · 실측에서 걸렸다〉.
   *   `report-flow.html` 은 창을 품고 있어서 브라우저가 막는 읽기가 하나 난다
   *   (`SecurityError: Location.pathname`). 화면은 **멀쩡히 뜬다.**
   *   그것까지 빨간 띠로 띄우면 **멀쩡한 화면에 고장 딱지**가 붙는다.
   * ★ 그래서 코드가 던진 것은 **화면이 실제로 비었을 때만** 알린다.
   *   빈 화면이 이 장치가 막으려는 것이고, 그 밖은 알릴 일이 아니다. */
  var lastErr = null;
  function noteErr(m) {
    lastErr = m;
    setTimeout(function () {
      try {
        var b = document.body;
        var n = b ? (b.innerText || '').trim().length : 0;
        if (n < 40) {
          say('화면을 그리다 멈췄습니다: ' + lastErr
            + ' — 이 글이 보이면 고장입니다. 이대로 알려 주십시오.');
        }
      } catch (_) { /* 무시 */ }
    }, 1200);
  }
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target.tagName) return;   // 위에서 이미 다뤘다
    noteErr((e && e.message) || '알 수 없는 오류');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    noteErr((r && r.message) || r || '알 수 없는 오류');
  });
}());
</script>

<!--
  ★★★ 짝 확인 — **화면과 스크립트가 같은 판인가** 〈2026-08-23 · D-93 사고〉.

  사장님 화면이 「F.readEvidence is not a function」으로 죽었다. 배포는 초록이었고

  ★ 그래서 여기서 **먼저 잡는다.** 표를 두지 않는다 — `window` 의 LinkPilot* 전역을
    훑어 자기 판을 말하는 것만 골라 문서 지문과 댄다. 스크립트가 늘어도 안 갈린다.
  ★ 이 조각은 **화면 안에** 있어야 한다. 따로 파일로 빼면 그 파일도 옛것일 수 있다.
-->
<script>
(function () {
  var want = document.documentElement.getAttribute('data-lp-build');
  if (!want) return;                       /* 지문이 없는 판 — 잴 것이 없다 */
  var bad = [];
  try {
    Object.keys(window).forEach(function (k) {
      if (k.indexOf('LinkPilot') !== 0) return;
      var v = window[k];
      if (v && typeof v === 'object' && typeof v.BUILD === 'string'
        && v.BUILD !== want) bad.push(k + ' (' + v.BUILD + ')');
    });
  } catch (_) { return; }                  /* 훑다 막히면 조용히 — 검사가 화면을 죽이지 않는다 */
  if (!bad.length) return;

  /* ★★★ **한 번은 화면이 스스로 고친다** 〈2026-08-27 · D-149〉.
   *
   *   앞 판은 빨간 띠로 「새로고침해 주십시오」라고만 했다. 그 말은 맞지만
   *   **고치는 일을 사람에게 떠넘긴다** — 사장님이 폰에서 강제 새로고침을
   *   하시는 것은 쉬운 일이 아니다 (M-58 과 같은 결: 「잠깐 나는 고장을
   *   사람에게 떠넘기지 않는다」).
   *
   *   ★ 그래서 주소에 표를 하나 붙여 **다시 받는다.** 브라우저는 주소가 다르면
   *     캐시를 안 쓴다. 화면이 새로 오면 스크립트와 판이 맞는다.
   *   ★★ **세션당 한 번만.** 서버에 정말 두 판이 섞여 있으면 다시 받아도 같다 —
   *     그때 또 다시 받으면 **끝없이 돈다.** 한 번 해 보고 안 되면 띠를 띄운다.
   *   ★ 표는 다음 새로고침에서 사라지도록 `replace` 로 바꾼다 (뒤로가기에 안 쌓인다). */
  try {
    var KEY = 'lp-pair-retried';
    if (!sessionStorage.getItem(KEY)) {
      sessionStorage.setItem(KEY, want);
      var u = location.href.replace(/[?&]lpfix=\d+/, '');
      location.replace(u + (u.indexOf('?') < 0 ? '?' : '&') + 'lpfix=' + Date.now());
      return;
    }
  } catch (_) { /* 저장소가 막힌 자리도 있다 — 그때는 띠만 띄운다 */ }

  var n = document.createElement('div');
  n.setAttribute('data-lp-pair', '');
  n.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:99999;'
    + 'background:#C00000;color:#fff;padding:14px 18px;font:700 14px/1.5 system-ui,sans-serif');
  /* ★★★ **어느 쪽이 옛것인지 아는 척하지 않는다 — 다만 구조가 답을 준다**
   *   〈2026-08-27 · D-149 · 실제 화면에서 거꾸로 말했다〉.
   *
   *   앞 판은 「옛 판 <스크립트 이름들>」이라고 **스크립트를 옛것으로 지목**했다.
   *   그런데 사장님 화면은 반대였다 — 화면 479c745f(옛), 스크립트 64478fa1(새).
   *
   *   ★ 지문은 해시라 **그 자체로는 앞뒤가 없다.** 하지만 자리 관계가 답을 준다:
   *     · 배포는 **자산 먼저 · HTML 나중**으로 올린다 (deploy-nas 「Upload」).
   *     · 화면은 형제 파일을 **판 표시를 붙여** 부르는데, 서버는 그 표를
   *       무시하고 **지금 있는 파일**을 준다.
   *       (표 이름을 여기 글자로 적지 않는다 — 검사가 주석을 코드로 읽는다. §8)
   *   → 그래서 어긋나면 **거의 언제나 화면(HTML)이 옛것**이다. 스크립트는
   *     서버의 지금 판이다. 그 말을 그대로 적는다.
   *   ★ 그래도 단정하지 않는다 — 「대개」라고 적고, 새로고침해도 같으면
   *     **서버에 두 판이 섞인 것**이니 알려 달라고 한다. */
  n.textContent = '화면과 스크립트의 판이 다릅니다 — 화면(HTML)이 옛 판일 가능성이 큽니다. '
    + '한 번 다시 받아 봤는데도 그대로입니다. '
    + '화면 ' + want + ' · 스크립트 ' + bad.join(', ')
    + ' · 어느 쪽인지 지금 확인하고 있습니다 — 잠시 뒤 이 자리에 무엇을 하면 되는지 적힙니다. '
    + '그대로면 이 여덟 글자 두 개를 알려 주시면 저희가 봅니다.';

  /* ★★★ **「둘 중 하나」로 끝내지 않는다 — 물어봐서 가른다** 〈2026-08-27 · 사장님 화면〉.
   *
   *   앞 판은 「서버에 두 판이 섞여 있을 수 있습니다」로 끝났다. 그런데 그 말은
   *   **읽는 사람이 할 수 있는 일이 없다** — 캐시를 지워야 하는지, 배포가 안
   *   된 것인지 갈리지 않기 때문이다. 오늘 그 갈림에서 세 번 헤맸다.
   *
   *   ★ 가르는 법은 간단하다. **이 화면의 주소를 캐시를 쓰지 말고 다시 받아**
   *     거기 적힌 판을 본다. 받은 것이
   *       · 지금 그려진 것과 **같으면** → 서버가 정말 옛 화면을 준다
   *       · **다르면**               → 서버는 새 판이고 브라우저가 옛것을 들고 있다
   *   ★ 못 받으면 **못 쟀다고 적는다.** 「둘 중 하나」로 되돌아가지 않는다.
   *   ★ 판 표시는 문서 뿌리의 속성에 있다 — 받은 글에서 그 속성을 찾는다.
   */
  try {
    var url = location.href.replace(/[?&]lpcheck=\d+/, '');
    url += (url.indexOf('?') < 0 ? '?' : '&') + 'lpcheck=' + Date.now();
    fetch(url, { cache: 'no-store', credentials: 'same-origin' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var m = /data-lp-build="([0-9a-f]+)"/.exec(t);
        var fresh = m && m[1];
        if (!fresh) {
          n.textContent += ' — 다시 받아 봤지만 판을 읽지 못했습니다. 알려 주시면 저희가 봅니다.';
          return;
        }
        if (fresh === want) {
          n.textContent = '서버가 옛 화면을 주고 있습니다 — 브라우저 탓이 아닙니다. '
            + '화면 ' + want + ' · 스크립트 ' + bad.join(', ')
            + ' · 캐시를 지우셔도 그대로입니다. 이 두 글자묶음을 알려 주십시오.';
        } else {
          n.textContent = '브라우저가 옛 화면을 들고 있습니다 — 서버는 새 판(' + fresh + ')입니다. '
            + '앱을 완전히 껐다 켜시고, 그래도 그대로면 앱 설정에서 **캐시 삭제**를 하십시오. '
            + '(화면 ' + want + ' · 스크립트 ' + bad.join(', ') + ')';
        }
      })
      .catch(function () {
        n.textContent += ' — 다시 받아 보지 못했습니다(연결). 알려 주시면 저희가 봅니다.';
      });
  } catch (_) { /* fetch 가 없는 자리도 있다 — 그때는 위 문장으로 둔다 */ }
  var put = function () { if (document.body) document.body.appendChild(n); };
  if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
}());
</script>
<script>
(function () {
  'use strict';
  var C = window.LINKPILOT_REPORT_FLOW;
  var F = window.LinkPilotFlow;
  var G = window.LinkPilotGate;
  var view = document.getElementById('view');

  /* ★★★ **주소를 안 받았다고 다섯 단계를 통째로 잠그지 않는다** 〈2026-08-23 사장님 화면〉.
   *   앞 판은 `api` 가 비면 「서버가 연결되어 있지 않습니다」만 띄우고 끝났다.
   *   그런데 이 화면은 앱과 **같은 출처**에 얹혀 있어 `/api/linkpilot` 이 앱이
   *   부르는 바로 그 주소다 — 부르고 나서 결과를 말하는 쪽이 언제나 낫다.
   *   ★ 정하는 자리는 `flow-core.js` 한 곳이다 (files.html 과 같은 함수). */
  var APIR = F.resolveApi(C);
  C.api = APIR.api;

  /**
   * ★★★ **자기 주소의 `?project=`·`?step=` 을 읽는다** 〈2026-08-29 · D-165〉.
   *
   *   앞 판은 앱이 넘겨 준 설정(`C.projectId`)만 봤다. 그래서 다른 화면이
   *   **주소로 직접 보내면** 프로젝트가 없는 채로 열려 **단계가 전부 잠겼다** —
   *   보내는 쪽은 「보냈다」이고 받는 쪽은 「아무것도 못 받았다」가 된다.
   *
   *   ★ 앱이 넘긴 값이 **먼저**다. 주소는 그 다음이다 — 앱 안에서는 앱이 아는
   *     것이 더 정확하고, 주소는 단독으로 열렸을 때의 길이다.
   */
  function fromUrl(k) {
    try { return new URLSearchParams(window.location.search).get(k) || null; }
    catch (_) { return null; }
  }
  var state = {
    current: fromUrl('step'),
    projectId: C.projectId || fromUrl('project') || null,
    embedBlocked: false,
  };

  /**
   * 절마다의 「완료·진행율」에 쓰는 **잰 사실**.
   *
   * ★★★ **처음 값은 전부 `null` 이다 — 「아직 못 쟀다」는 뜻이다** 〈2026-08-23〉.
   *   `false` 나 `0` 으로 시작하면 서버 대답이 오기 전 한순간 「아무것도 안 했다」가
   *   화면에 뜨고, 다 해 놓은 사람이 그것을 본다. 모르는 것과 아닌 것은 다르다 (§4.9).
   */
  var facts = { issuerSet: null, request: null, sources: null, fields: null, specLocked: null,
    /* ★ 만들어진 문서 — `null` 은 **못 쟀다**, `[]` 는 **없다**. 둘은 다르다 (§4.9) */
    reports: null, reportsBlocked: null,
    /* ★ 접힌 줄에 **지금 값을 그대로** 적으려고 이름도 받아 둔다 〈D-163〉 —
       「정해져 있습니다」보다 회사 이름이 보이는 쪽이 확인이 된다 */
    issuerName: null };
  /* 「수정 요구」 패널이 펴져 있는가 — 절 안에서만 쓰는 상태다 */
  var fixOpen = false;
  var progress = null;

  /** 잰 것만으로 절 상태를 다시 센다. 판정 규칙은 `flow-core` 한 곳에 있다 */
  function recount() {
    progress = F.sectionProgress({
      issuerSet: facts.issuerSet, request: facts.request, projectId: state.projectId,
      sources: facts.sources, fields: facts.fields, specLocked: facts.specLocked,
    });
  }

  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (x !== undefined && x !== null && x !== '') n.textContent = String(x);
    return n;
  }
  function add(p) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) p.appendChild(arguments[i]); return p; }

  function ctx() {
    return { api: C.api, base: C.base || '', projectId: state.projectId, current: state.current };
  }

  /* ── 절 넷 ─────────────────────────────────────────────
   *
   * ★★ 목록은 `flow-core.js` 의 `SECTIONS` **한 곳**에서 나온다. 화면이 따로
   *   적으면 한쪽만 고치는 날 갈리고, 그때 아무도 눈치채지 못한다.
   *
   * ★ 절 머리는 **누르면 열리는 곳**이다. 잠긴 절은 눌리지 않고 **이유를 적는다** —
   *   회색이기만 하면 고장으로 보인다.
   *
   * ★ 「새보고서 진행률」은 품은 단계가 없다. 볼 수만 있는 곳이라 안 눌린다 —
   *   눌리는 것처럼 그리면 눌러 보고 아무 일도 안 일어나는 것을 본다.
   */
  function section(sec, body) {
    var box = el('section', 'sec'
      + (sec.current ? ' sec--on' : '')
      + (sec.steps.length ? '' : ' sec--flat'));

    var h = el('button', 'sec__h');
    h.type = 'button';
    h.disabled = sec.locked || !sec.steps.length;
    if (!sec.steps.length) h.setAttribute('aria-disabled', 'true');

    h.appendChild(el('span', 'sec__n', sec.no));
    var b = el('div', 'sec__b');
    b.appendChild(el('div', 'sec__t', sec.name));
    // 잠겼으면 **왜**를 적는다. 열려 있으면 무엇을 하는 곳인지 적는다
    b.appendChild(el('p', sec.locked ? 'sec__why' : 'sec__d',
      sec.locked ? sec.why : sec.note));
    h.appendChild(b);

    /* ★★★ **완료·진행율을 여기서 말한다** 〈2026-08-23 사장님 지시〉.
     *
     *   차례가 있다: **완료 → 진행율 → 지금 → 잠김 → 열기.**
     *   ★ 끝난 칸은 「지금」보다 「완료」가 먼저다 — 지금 보고 있어도 끝난 것은
     *     끝난 것이고, 지금 어디인지는 테두리(`sec--on`)가 이미 말한다.
     *   ★ **못 쟀으면 아무 숫자도 안 적는다** (`known:false`). 0% 로 적으면
     *     「아직 아무것도 안 했다」로 읽히는데 실제로는 「못 쟀다」다.
     */
    var pg = (progress && progress[sec.id]) || null;
    var open = isOpen(sec);
    var tag = '';
    if (sec.steps.length) {
      if (pg && pg.done) tag = '완료';
      else if (pg && pg.known && pg.pct !== null) tag = pg.pct + '%';
      else if (sec.locked) tag = '잠김';
      /* ★ 잠기지 않은 칸은 **누르면 열린다**는 것을 그대로 적는다 〈D-172〉.
       *   앞 판은 「지금」·「열기」였는데, 「지금」은 눌러도 되는지를 안 알려 주고
       *   「열기」는 **이미 펴진 칸에도** 붙어서 눌러도 안 닫히는 것처럼 보였다. */
      else tag = open ? '접기' : '펼치기';
    }
    if (tag) {
      var tg = el('span', 'sec__tag' + (tag === '완료' ? ' sec__tag--done' : '')
        + (/%$/.test(tag) ? ' sec__pct' : ''), tag);
      h.appendChild(tg);
    }

    /* 잰 사실을 **한 줄로** 덧붙인다. 「60%」만 있으면 무엇의 60% 인지 모른다 */
    if (pg && pg.known && pg.detail && !sec.locked) {
      b.appendChild(el('p', 'sec__d', pg.detail));
    }
    if (pg && pg.known && pg.pct !== null && !sec.locked) {
      var bar = el('div', 'sec__bar');
      var fill = document.createElement('i');
      fill.style.width = Math.max(0, Math.min(100, pg.pct)) + '%';
      bar.appendChild(fill);
      b.appendChild(bar);
    }

    /* ★★★ **누르면 펴고 접는다** 〈2026-08-29 · D-172〉.
     *   앞 판은 누르면 「지금 칸」을 그리로 옮겼다(`go`). 그래서 **지나온 칸을
     *   잠깐 보려고 눌렀는데 앞으로 가던 자리를 잃었다.**
     *   ★ 이제 펴고 접기만 한다. 「지금 칸」은 [완료] 를 누를 때만 움직인다 —
     *     보는 일과 나아가는 일을 가른다. */
    if (!sec.locked && sec.steps.length) {
      h.setAttribute('aria-expanded', open ? 'true' : 'false');
      h.addEventListener('click', function () {
        openBy[sec.id] = !open;
        /* 펴는 칸이 열린 단계를 품고 있으면 그 단계를 보고 있는 것으로 둔다 —
           안쪽 화면이 「지금 어느 칸인지」를 알아야 하는 자리가 있다 */
        if (!open && sec.opensTo) state.current = sec.opensTo;
        draw();
      });
    }
    box.appendChild(h);

    if (body) box.appendChild(add(el('div', 'sec__body'), body));
    return box;
  }

  function go(id) {
    state.current = id;
    draw();
  }

  /* ── 단계 화면 ────────────────────────────────────────── */

  /**
   * 화면을 내용 높이만큼 편다.
   *
   * ★ 못 재는 경우가 있다 (다른 출처에서 서빙되면 브라우저가 막는다).
   *   그때 조용히 400px 쯤으로 두면 잘린 화면을 정상으로 오해한다 — 사유를 띄운다.
   */
  function fit(fr) {
    var d;
    try { d = fr.contentDocument; } catch (e) { d = null; }
    if (!d || !d.documentElement) {
      if (!state.embedBlocked) { state.embedBlocked = true; draw(); }
      return;
    }
    if (!d.getElementById('lp-flow-embed')) {
      var st = d.createElement('style');
      st.id = 'lp-flow-embed';
      st.textContent = F.EMBED_CSS;
      (d.head || d.documentElement).appendChild(st);
    }
    var h = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0);
    if (!h) return;

    /* ★★ **같으면 안 쓴다** 〈2026-08-21 · 모바일이 느린 진짜 이유〉.
     *   앞 판은 잴 때마다 `style.height` 를 **무조건** 썼다. 그런데 높이를 쓰면
     *   ⓐ 바깥이 다시 배치되고 → ⓑ 안쪽 화면의 폭·높이가 바뀌고 → ⓒ 안쪽이
     *   다시 그려지면서 클래스·style 이 움직이고 → ⓓ 감시자가 그걸 잡아 **또
     *   재고 또 쓴다.** 값이 그대로여도 고리가 돈다.
     *
     *   데스크톱에서는 한 바퀴가 순식간이라 눈에 안 띈다. 휴대폰에서는 그 한
     *   바퀴가 비싸서 **화면이 뒤늦게 덜컥덜컥 자리를 잡는다** — 그것이
     *   「느리게 뜬다」로 보인다.
     *
     *   ★ 한 글자짜리 조건이 고리를 끊는다. 안 바뀌었으면 아무것도 안 한다. */
    if (h === fr._lpH) return;
    fr._lpH = h;
    fr.style.height = h + 'px';
  }

  /* ── 높이 따라가기 ─────────────────────────────────────
   *
   * ★★ **감시자는 언제나 하나다** 〈2026-08-21〉. 앞 판은 `watch()` 를 부를 때마다
   *   MutationObserver 와 setInterval 을 **새로 만들고 옛것을 끄지 않았다.**
   *   `watch()` 는 화면이 실릴 때마다·단계를 옮길 때마다 불린다 — 그래서 쓰는
   *   동안 감시자가 **쌓인다.** 열 번 오가면 열 벌이 같은 일을 한다.
   *   「쓸수록 느려진다」는 이 모양에서 나온다.
   *
   * ★ 그리고 재는 도구를 바꿨다. MutationObserver 로 **문서 전체의 속성까지**
   *   보고 있었는데(`attributes: true`), 안쪽 화면이 제 일을 하느라 클래스 하나만
   *   토글해도 그때마다 높이를 다시 쟀다. **높이가 궁금한 것이지 무엇이
   *   바뀌었는지가 궁금한 것이 아니다** — ResizeObserver 가 바로 그것만 본다.
   *   없는 브라우저에서는 MutationObserver 로 내려가되 범위를 좁힌다.
   *
   * ★ 재는 일은 **한 프레임에 한 번**으로 묶는다. 한 번 그리는 사이에 스무 번
   *   재 봐야 결과는 같고 값만 치른다.
   */
  /* ★★★ **지켜보는 틀은 여럿이다** 〈2026-08-28 · D-161 — D-157 이 남긴 둘째〉.
   *
   *   앞 판은 `watching` 이 **한 자리**였다. 새 틀을 지켜보기 시작하면 앞의
   *   것을 **놓아 버렸다**(`unwatch()`). 한 절에 틀이 하나뿐이던 시절에는
   *   그것이 맞았다.
   *
   *   D-157 부터 **한 절이 틀을 여럿 띄운다.** 그러자 마지막 틀만 지켜보게
   *   되고, 앞의 틀은 **처음 잰 높이에 그대로 굳는다.** 실측: `basics` 는
   *   320px(재기 전 임시값)에 굳고 `ask` 만 468px 로 맞았다.
   *
   *   ★★ 굳은 틀은 **내용이 잘린다.** 안쪽이 늦게 그려지면(서버 대답을 받은
   *     뒤) 그 뒤로는 아무도 다시 재지 않으므로 **하얀 칸**으로 남는다.
   *   ★★★ 여기서도 **오류가 안 난다.** 틀은 멀쩡히 실렸고 높이만 틀렸다.
   *
   *   ★ 그래서 **띄운 틀을 전부 지켜본다.** 다시 그릴 때 한꺼번에 놓는다.
   */
  var watching = [];   // [{ fr: <iframe>, stop: fn }, …]

  function unwatch() {
    var all = watching; watching = [];
    all.forEach(function (w) { try { w.stop(); } catch (e) {} });
  }

  function watch(fr) {
    /* ★ 이미 지켜보는 틀이면 다시 걸지 않는다 — 감시자가 두 벌이 된다 */
    for (var i = 0; i < watching.length; i++) {
      if (watching[i].fr === fr) { fit(fr); return; }
    }
    fit(fr);

    var d;
    try { d = fr.contentDocument; } catch (e) { return; }
    if (!d || !d.documentElement) return;

    var win = fr.contentWindow;
    var raf = 0;
    function soon() {
      if (raf) return;                       // 이미 이번 프레임에 예약돼 있다
      raf = window.requestAnimationFrame(function () { raf = 0; fit(fr); });
    }

    var obs = null;
    if (win && win.ResizeObserver) {
      obs = new win.ResizeObserver(soon);
      obs.observe(d.documentElement);
      if (d.body) obs.observe(d.body);
    } else if (win && win.MutationObserver) {
      // ★ 옛 브라우저용. 속성은 **높이에 영향을 주는 것만** 본다
      obs = new win.MutationObserver(soon);
      obs.observe(d.documentElement, {
        childList: true, subtree: true, characterData: true,
        attributes: true, attributeFilter: ['style', 'class', 'hidden', 'open'],
      });
    }

    /* ★ 그림·글꼴이 늦게 들어오면 아무 변화 없이 높이만 바뀌는 판이 있다.
     *   그래서 잠깐만 더 지켜본다. 이제 `fit()` 은 값이 같으면 아무것도 안
     *   하므로 이 지켜보기는 싸다. */
    var n = 0, t = setInterval(function () { soon(); if (++n > 8) clearInterval(t); }, 250);

    watching.push({ fr: fr, stop: function () {
      if (obs) obs.disconnect();
      clearInterval(t);
      if (raf) window.cancelAnimationFrame(raf);
    } });
  }

  /* ★ 2026-08-16 — 1단계 화면이 만든 프로젝트를 postMessage 로 받는다 (URL 감시의 짝).
     받으면 URL 로 알아챈 것과 같은 길(state.projectId → draw)을 탄다 — 두 길이 다르면 갈린다. */
  window.addEventListener('message', function (e) {
    if (e.origin !== window.location.origin) return;
    var d = e.data;
    if (!d) return;

    /* ★ 안쪽 화면이 「다음 칸으로 가자」고 알려 온다 〈2026-08-23〉. 안쪽이 주소만
       바꾸면 바깥 레일은 그대로여서 **지금 어느 단계인가가 둘로 갈린다.**
       ★ 모르는 단계 이름은 무시한다 — 지어내지 않는다 */
    if (d.type === 'lp-flow-step' && d.step) {
      var known = F.STEPS.filter(function (x) { return x.id === d.step; })[0];
      if (known && known.id !== state.current) go(known.id);
      return;
    }

    if (d.type !== 'lp-flow-project' || !d.projectId) return;
    if (d.projectId !== state.projectId) { state.projectId = d.projectId; draw(); }
  });

  /** 화면이 스스로 다음 단계로 넘어가면(예: 접수 → 가이드 필드) 레일도 따라간다 */
  function syncFromFrame(fr) {
    // 미리보기는 문서를 직접 심으므로 주소가 없다 — 높이만 맞춘다
    if (window.LINKPILOT_PREVIEW_DOCS) { watch(fr); return; }
    var loc;
    try { loc = fr.contentWindow.location; } catch (e) { return; }
    /* ★ **물음표 뒤까지 넘긴다** 〈2026-08-23〉. 앞의 셋은 같은 파일이고 `?part=`
       로만 갈린다. 경로만 주면 늘 첫째로 판정돼 2·3단계가 1단계로 튕긴다. */
    var step = F.stepOfFile(loc.pathname + (loc.search || ''));
    var pid = new URLSearchParams(loc.search).get('project');
    var changed = false;
    if (pid && pid !== state.projectId) { state.projectId = pid; changed = true; }
    /* ★★★ **같은 절 안의 형제 칸은 현재 단계를 바꾸지 않는다**
     *   〈2026-08-28 · D-160 — D-157 이 만든 되풀이〉.
     *
     *   D-157 부터 **한 절이 여러 단계를 함께 편다.** 1절은 `basics` 와 `ask`
     *   두 틀을 나란히 띄운다. 그런데 여기서는 틀이 실릴 때마다 그 틀의 단계를
     *   **현재 단계로 삼고 다시 그렸다.**
     *
     *     basics 실림 → 현재=basics → 그대로
     *     ask    실림 → 현재≠ask → 현재=ask → **다시 그린다**
     *     → 틀 둘이 새로 만들어지고 다시 실린다 → basics 가 현재를 되돌린다
     *     → **끝없이 되풀이한다**
     *
     *   ★★ 다시 그릴 때마다 틀이 부서지므로 **높이를 잴 겨를이 없다.**
     *     그래서 화면에는 **하얀 빈 칸**만 남는다 — 사장님이 보신 그 모습이다.
     *   ★★★ **오류가 하나도 안 난다.** 틀은 정상으로 실리고 내용도 멀쩡하다.
     *     보이는 것은 「빈 칸」뿐이라 원인을 짐작할 근거가 화면에 없다.
     *
     *   ★ 고침: 그 단계가 **지금 열린 절과 같은 절**이면 현재를 안 바꾼다.
     *     한 절의 단계는 어차피 함께 펴지므로 **그중 누가 현재인지는 뜻이 없다.**
     *     절이 다를 때만(진짜 이동일 때만) 바꾼다.
     */
    var sameSection = false;
    if (step && state.current && F.sectionOfStep) {
      var a = F.sectionOfStep(step.id), b = F.sectionOfStep(state.current);
      sameSection = !!(a && b && a.id === b.id);
    }
    // 3·4 는 같은 파일이라 파일명만으로는 못 가른다 — 현재 단계를 유지한다
    if (step && step.id !== state.current && !sameSection
        && !(step.file === 'reports.html' && state.current === 'make')) {
      state.current = step.id; changed = true;
    }
    if (changed) draw(); else watch(fr);
  }

  /**
   * **부르려는 주소가 이 칸의 단계로 되짚어지지 않으면 말한다**
   * 〈2026-08-27 · 사장님 신고: 「4번 가이드 필드에 3번 관련자료 업로드가 다시 나온다」〉.
   *
   * ★★ 이런 어긋남은 **오류를 안 낸다.** 칸 머리는 「4. 가이드 필드」라고 적혀
   *   있는데 안에는 다른 화면이 멀쩡히 그려지므로, 보는 사람은 **원래 그런 화면인
   *   줄** 안다. 그 상태로는 무엇을 고쳐야 하는지 단서가 한 글자도 안 남는다
   *   (M-56 과 같은 결 — 아는 척하지 않는 것과, 아무 말도 안 하는 것은 다르다).
   *
   * ★ 앞의 세 단계는 **같은 파일**을 `?part=` 로 나눠 쓴다. 그 표시가 빠진 주소는
   *   `stepOfFile()` 이 되짚지 못하고(`null`), 실제로 열면 **세 칸이 한꺼번에**
   *   뜬다 — 신고된 모습이 그것이다. 목록(`flow-core.js`)이 옛 판이면 이렇게 된다.
   *
   * ★ **안쪽 화면을 들여다보지 않는다.** 앱이든 파일이든 출처가 다르면 안쪽
   *   주소를 못 읽는다(보안). 여기서는 **우리가 부르려던 주소**만 본다 —
   *   그것만으로 「옛 목록」은 잡힌다.
   * ★ 어느 쪽이 옛 판인지 **단정하지 않는다** (M-24 · M-56). 부른 것과 되짚은
   *   결과를 나란히 적는 데까지가 이 자리가 아는 전부다.
   */
  function oddUrlNote(step, url) {
    var got = F.stepOfFile(url);
    if (got && got.id === step.id) return null;
    var shown = String(url).split('/').pop();
    return notice('note--bad', '이 칸이 부르는 주소가 이 단계로 되짚어지지 않습니다',
      '「' + step.no + '. ' + step.name + '」 자리에서 ' + shown + ' 를 부르려 합니다. '
      + (got ? '되짚으면 「' + got.no + '. ' + got.name + '」 가 나옵니다. '
             : '어느 단계인지 되짚을 수가 없습니다. ')
      + '앞의 세 단계는 같은 파일을 칸으로 나눠 쓰므로, 칸 표시가 빠지면 '
      + '**세 칸이 한꺼번에** 보입니다 — 지금 보고 계신 모습이 그것일 수 있습니다. '
      + '앱이 들고 있는 화면 사본이 옛 판일 때 이렇게 됩니다. 화면 맨 아래 여덟 '
      + '글자(판 표시)를 알려 주시면 어느 쪽이 옛것인지 갈립니다.');
  }

  /**
   * **절 맨 아래의 [확인]** 〈2026-08-28 사장님 지시 · D-157〉.
   *
   * ★ 사장님 지시: 「아코디언 펼치기 방식 … → [확인클릭]」. 한 칸을 끝냈다는
   *   것을 **사람이 말해 주는 자리**다. 없으면 어디까지 한 것인지 화면이 모른다.
   *
   * ★★ **다음 칸이 잠겨 있으면 단추를 그리지 않고 이유를 적는다.** 눌러도
   *   아무 일이 없는 단추가 가장 나쁘다 — 고장으로 읽힌다.
   * ★ 마지막 칸에는 단추가 없다. 갈 곳이 없는데 [확인] 을 두면 「한 칸이 더
   *   남았다」로 읽힌다 (D-149 · 「생성」 칸을 없앴을 때와 같은 이유).
   */
  function confirmRow(sec) {
    var all = F.sectionState(ctx());
    var at = -1;
    all.forEach(function (x, i) { if (x.id === sec.id) at = i; });
    var next = at >= 0 ? all[at + 1] : null;
    if (!next) return null;

    var row = el('div', 'okrow');
    if (next.locked) {
      row.appendChild(el('span', 'okrow__why',
        '다음 칸(' + next.no + '. ' + next.name + ')은 아직 잠겨 있습니다 — '
        + (next.why || '앞 칸을 먼저 끝냅니다') + '.'));
      return row;
    }
    /* ★★★ 단추 이름은 **[완료]** 다 〈2026-08-29 사장님 지시 · D-172〉.
     *   「확인 — 다음 칸으로」였는데, 그것은 **가는 일**을 말한다. 사장님이
     *   적으신 것은 **끝냈다는 표시**다 — 이 칸에서 할 일을 마쳤다는 뜻이고,
     *   다음 칸이 열리는 것은 그 결과다. 어디로 가는지는 옆에 작게 적는다. */
    var b = el('button', 'okrow__b', '완료');
    b.type = 'button';
    b.addEventListener('click', function () {
      openBy[sec.id] = false;          // 끝낸 칸은 접는다 — 다음 칸이 눈에 들어온다
      openBy[next.id] = true;          // 다음 칸을 편다
      go(next.opensTo);
    });
    row.appendChild(el('span', 'okrow__why',
      '다음: ' + next.no + '. ' + next.name));
    row.appendChild(b);
    return row;
  }

  /**
   * ══════════ **펼침을 사람이 정한다** 〈2026-08-29 사장님 지시 · D-172〉
   *
   * 사장님 지시: 「1.기본정보 입력 → 펼치기 [완료] … 6.완성결과물」.
   *
   * ★★★ 앞 판은 **「지금 칸」만** 펴졌다. 지나온 칸을 다시 보려면 되돌아가야
   *   했고, 되돌아가면 「지금 칸」이 바뀌어 **앞으로 가던 자리를 잃었다.**
   *   이제 잠기지 않은 칸은 **아무 때나 눌러서 편다.**
   *
   * ★ 아무것도 안 누르셨으면 **지금 칸 하나만** 펴 둔다 — 전부 펴 두면
   *   「어디부터 하면 되는지」가 화면에서 사라진다.
   * ★★ 눌러서 접은 것도 기억한다. `true`/`false` 를 모두 담는 이유다 —
   *   「안 눌렀다」와 「눌러서 접었다」는 다른 사실이다 (§4.9 와 같은 결).
   */
  var openBy = {};   // { 절id: true|false } — 없으면 「사람이 아직 안 눌렀다」

  function isOpen(sec) {
    if (sec.locked) return false;
    if (Object.prototype.hasOwnProperty.call(openBy, sec.id)) return !!openBy[sec.id];
    return !!sec.current;
  }

  /** 절이 품은 단계를 차례로 그린다 — 잠긴 것은 화면 대신 이유를 적는다 */
  function stepBody(st) {
    return st.locked
      ? notice('', st.name + ' 단계를 아직 열 수 없습니다', st.why)
      : stage(st);
  }

  /* ══════════ 절 도구줄 — 미리보기 · 수정 요구 · 다운로드 ══════════
   *
   * 〈2026-08-28 사장님 지시 · D-158〉 사장님이 그리신 넷째 칸까지의 그림은
   *   「3. …보고서 생성 · **미리보기 · 수정요구** → [확인클릭] / 4. 완성보고서
   *   → **[다운로드]**」 였다. 앞 판(D-157)은 칸만 넷으로 묶고 이 셋을 안 붙였다.
   *
   * ★★★ **없는 길을 만들지 않는다** (CLAUDE.md §6-3 「없는 데이터를 그럴듯하게
   *   그리지 않는다」). 서버에는 「수정 요구를 접수하는 창구」가 없다. 그래서
   *   [수정 요구] 는 **고칠 수 있는 자리로 데려다주는 단추**로 만든다 —
   *   값은 4단계, 쪽수·형식은 5단계다. 접수하는 척하면 사용자는 보냈다고 믿고
   *   아무도 받지 않는다. 그것이 가장 비싼 고장이다.
   *
   * ★ [미리보기]·[다운로드] 는 **실제로 있는 길**이다 — `GET /projects/:id/file?rel=`.
   *   `outputs.html` 이 쓰는 것과 **같은 주소**다. 두 벌로 만들지 않는다.
   */

  /** 문서 파일 주소 — `outputs.html` 과 같은 창구를 쓴다 */
  function fileUrl(rel) {
    if (!C.api || !state.projectId) return null;
    return C.api + '/projects/' + encodeURIComponent(state.projectId)
      + '/file?rel=' + encodeURIComponent(rel);
  }

  /** 지금 내려받을 수 있는 문서 — 실제로 **나온 것**만 센다 */
  function madeDocs() {
    if (facts.reports === null) return null;      // 못 쟀다
    return facts.reports.filter(function (f) { return f && f.exists && f.path; });
  }

  function toolBtn(label, primary) {
    var b = el('button', 'tools__b' + (primary ? ' tools__b--go' : ''), label);
    b.type = 'button';
    return b;
  }

  /** 눌렀는데 아무 일이 없는 대신 **왜인지 적는다** */
  function whyNoDoc() {
    if (!C.api) {
      return notice('', '서버가 연결되어 있지 않습니다',
        '이 화면은 앱 안에서 서버 주소를 받아 문서를 부릅니다. 지금은 그 주소가 없어 '
        + '만들어진 문서를 찾을 수가 없습니다.');
    }
    if (facts.reportsBlocked) {
      return notice('note--bad', '배포가 막혀 있어 문서를 열 수 없습니다',
        '검증이 통과하지 못한 문서는 미리보기·다운로드가 잠깁니다. 「완성 보고서」 칸에서 '
        + '무엇이 막고 있는지 확인하십시오.');
    }
    if (facts.reports === null) {
      return notice('', '만들어진 문서를 아직 못 물어봤습니다',
        '서버에 문서 목록을 묻는 중이거나, 물어보지 못했습니다. 잠시 뒤 다시 눌러 보십시오.');
    }
    return notice('', '아직 만들어진 문서가 없습니다',
      '위의 「출력조건」에서 사양을 확정하고 [보고서 생성 시작] 을 누르면 문서가 나옵니다. '
      + '나온 뒤에 이 단추가 그 문서를 엽니다.');
  }

  /**
   * 「수정 요구」 — **고칠 수 있는 자리로 데려다준다.**
   *
   * ★ 무엇을 고치느냐에 따라 갈 곳이 다르다. 그것을 사람이 고르게 한다 —
   *   자동으로 하나를 고르면 틀렸을 때 되돌릴 자리가 안 보인다 (§4.9 와 같은 결).
   */
  function fixPanel() {
    var box = el('div', 'note');
    box.appendChild(el('b', null, '무엇을 고칠까요?'));
    box.appendChild(document.createTextNode(
      '고친 뒤에 다시 만들면 됩니다. 이미 나온 문서는 지워지지 않고 그대로 남습니다. '
      + '★ 이 단추는 누구에게 요청을 보내지 않습니다 — 고치는 자리로 데려다줄 뿐입니다.'));
    var row = el('div', 'tools');
    [
      ['값을 고친다 — 4. 가이드 필드 로', 'fields'],
      ['쪽수·형식을 고친다 — 5. 출력조건 으로', 'spec'],
    ].forEach(function (pair) {
      var b = toolBtn(pair[0]);
      b.addEventListener('click', function () { fixOpen = false; go(pair[1]); });
      row.appendChild(b);
    });
    box.appendChild(row);
    return box;
  }

  /**
   * 절 맨 아래 도구줄. 붙는 절은 **둘**이다 — `make` 와 `done`.
   * 나머지 절에는 붙일 것이 없다(`null`) — 빈 줄을 그리면 뭔가 빠진 것처럼 보인다.
   */
  function toolRow(sec) {
    if (sec.id !== 'make' && sec.id !== 'done') return null;
    var wrap = el('div');
    var row = el('div', 'tools');
    /* 눌러도 안 되는 이유는 **한 번만** 적는다 — 누를 때마다 쌓으면 화면이 길어진다 */
    var said = null;
    function say(node) {
      if (said) wrap.removeChild(said);
      said = node; wrap.appendChild(said);
    }
    var docs = madeDocs();
    var have = docs && docs.length ? docs[0] : null;
    var open = !!(have && C.api && !facts.reportsBlocked);

    if (sec.id === 'make') {
      row.appendChild(el('span', 'tools__t', '만든 뒤에'));

      var pv = toolBtn('미리보기');
      pv.setAttribute('aria-disabled', open ? 'false' : 'true');
      pv.addEventListener('click', function () {
        if (!open) { say(whyNoDoc()); return; }
        window.open(fileUrl(have.path), '_blank', 'noopener');
      });
      row.appendChild(pv);

      var fx = toolBtn('수정 요구');
      fx.addEventListener('click', function () { fixOpen = !fixOpen; draw(); });
      row.appendChild(fx);
      wrap.appendChild(row);
      if (fixOpen) wrap.appendChild(fixPanel());
      return wrap;
    }

    /* done — 사장님 지시의 마지막 칸: [다운로드] */
    row.appendChild(el('span', 'tools__t', '완성본'));
    if (open) {
      var a = el('a', 'tools__b tools__b--go', '다운로드');
      a.href = fileUrl(have.path);
      a.setAttribute('download', '');
      row.appendChild(a);
      /* ★ 무엇을 받는지 적는다. 문서가 여럿이면 목록에서 골라야 한다는 것도 */
      row.appendChild(el('span', 'okrow__why',
        have.path + (docs.length > 1 ? ' · 문서 ' + docs.length + '건 중 첫째 — 나머지는 위 목록에서' : '')));
    } else {
      var d = toolBtn('다운로드', true);
      d.setAttribute('aria-disabled', 'true');
      d.addEventListener('click', function () { say(whyNoDoc()); });
      row.appendChild(d);
    }
    wrap.appendChild(row);
    return wrap;
  }

  function stage(step) {
    var box = el('div', 'stage');

    /* ★★★ **머리줄을 지웠다** 〈2026-08-23 사장님 지시〉.
     *   여기 「1. 제작 기본정보 입력 · 프로젝트 미지정」이 있었다. 그런데 **바로
     *   위 절 카드가 같은 말**을 하고 있어서, 같은 제목이 두 줄 연달아 나왔다.
     *   ★ 함께 사라진 것: 그 칸이 **어느 화면을 부르는지** 보여 주던 작은 표시.
     *     겹침을 잡는 빨간 안내는 그대로 남아 있고, 그 안내가 파일 이름을 적는다 —
     *     **어긋났을 때 볼 것은 그쪽**이다.
     */

    var fr = document.createElement('iframe');
    fr.name = 'lp-flow-' + step.id;
    fr.title = step.no + '. ' + step.name;
    fr.setAttribute('scrolling', 'no');   // 안쪽에서 또 끌지 않는다
    fr.style.height = '320px';            // 재기 전 임시값. 곧 내용 높이로 바뀐다

    // ★ 미리보기 전용 경로. 서버 없이 파일 하나로 열어 보려고 문서를 직접 심는다.
    //   제품에서는 이 전역이 없으므로 평소대로 화면 파일을 부른다 (CLAUDE.md §8)
    var docs = window.LINKPILOT_PREVIEW_DOCS;
    if (docs && docs[step.id]) {
      fr.srcdoc = docs[step.id];
    } else {
      var url = F.urlFor(step, ctx());

      /* ★★★ **자기 자신을 안에 또 띄우지 않는다** 〈2026-08-23 · 실제로 그렇게 떴다〉.
       *
       *   1단계 칸 안에 이 화면(`report-flow.html`) 통째가 들어가서, 절 목록이
       *   두 겹으로 겹쳐 보였다. 겹쳐 보이는 것만도 나쁘지만 **더 나쁜 것은
       *   원인이 안 보이는 것**이다 — 겹친 화면은 어느 쪽이 바깥인지조차 알 수
       *   없어서, 무엇을 고쳐야 하는지 판단할 근거가 화면에 남지 않는다.
       *
       *   ★ 그래서 **띄우지 않고, 무엇을 띄우려 했는지 글자로 적는다.** 이 칸은
       *     배선이 어긋났을 때 **딱 한 번 보고 원인을 아는 자리**여야 한다.
       *   ★ 파일 이름만 본다. 물음표 뒤(`?part=`·`?api=`)는 같은 파일이어도
       *     다르게 보이므로 경로로 가른다.
       */
      var mine = String(window.location.pathname || '').split('/').pop();
      var want = String(url).split('?')[0].split('/').pop();
      if (mine && want && mine === want) {
        box.appendChild(notice('note--bad', '이 단계 화면이 이 화면 자신을 가리킨다',
          '「' + step.no + '. ' + step.name + '」 의 화면으로 ' + want + ' 를 부르려 했는데, '
          + '그것은 지금 보고 계신 이 화면입니다. 그대로 띄우면 같은 화면이 안에 또 겹칩니다 — '
          + '그래서 띄우지 않았습니다. 단계 목록(flow-core.js)의 file 값이나 앱이 넘긴 base '
          + '설정을 봅니다.'));
        return box;
      }

      /* ★ 부르는 화면 이름은 **iframe 의 title 에** 남긴다. 화면에 늘 띄우면
         머리줄이 되살아나는 셈이라 지웠고(위), 어긋났을 때는 겹침 안내가
         파일 이름을 적어 준다. 물음표 뒤는 넣지 않는다 — 열쇠가 섞인다 (§2). */
      fr.title = step.no + '. ' + step.name + ' (' + want + ')';

      /* ★ 주소를 만든 그 자리에서 **되짚어 본다.** 어긋나면 화면이 말한다 */
      var odd = oddUrlNote(step, url);
      if (odd) box.appendChild(odd);

      fr.src = url;
    }

    fr.addEventListener('load', function () { syncFromFrame(fr); });
    box.appendChild(fr);

    if (state.embedBlocked) {
      box.appendChild(notice('note--bad', '화면 높이를 잴 수 없습니다',
        '단계 화면이 다른 출처에서 열렸습니다. 앱과 같은 주소에서 서빙해야 잘리지 않고 펴집니다.'));
    }
    return box;
  }

  function notice(cls, title, body) {
    var p = el('div', 'note ' + cls);
    p.appendChild(el('b', null, title));
    p.appendChild(document.createTextNode(body));
    return p;
  }

  /* ★★★ **「새보고서 진행률」 절을 뺐다** 〈2026-08-22 사용자 지시〉.
   *
   *   화면 맨 위 「값은 앱 안에서 받습니다」 카드와 함께 지웠다. 함께 사라진 것:
   *   단계별 진행 막대 · 자산군 · 계산 항목 개수 · 그것을 받아 오던 되풀이 조회
   *   (`loadDetail`/`schedule`). **기능이 옮겨 간 것이 아니라 없어진 것**이므로
   *   여기 적어 둔다 — 조용히 지우면 다음 사람이 「어디로 갔지」를 찾는다.
   *
   *   되살리려면 이 파일의 삭제 커밋을 `git revert` 한다. 그때는 절 번호가
   *   단계 번호와 다시 어긋나므로(진행률이 ①이 되면 1단계가 ②가 된다)
   *   **번호 없는 칸**으로 두어야 한다.
   */

  /* ★★★ **「외부 분석 환경」 카드를 지웠다** 〈2026-08-22 사용자 지시〉.
   *
   *   기반정보를 내려받아 바깥 AGENT 에 넘기는 두 버튼(LinkPilot AGENT 저장소 ·
   *   보고서 생성 AGENT 열기)이 여기 있었다. 단계 다섯 아래에 별개 카드로 놓여
   *   있어서 **여섯째 단계처럼 읽혔다** — 실제로는 위 흐름과 상관없는 다른 길이다.
   *
   *   ★ 없어진 것은 **이 화면의 카드**다. 같은 일을 하는 「외부 분석 AGENT 로
   *     만들기 — 기반정보 내보내기」 경로는 앱에 그대로 남아 있다.
   *   ★ 설정의 `external`(repoUrl · agentUrl)은 건드리지 않았다. 다시 띄우려면
   *     이 파일의 삭제 커밋을 `git revert` 한다.
   */

  /* ── 그리기 ───────────────────────────────────────────── */

  function draw() {
    /* ★★ 다시 그리면 **옛 화면(iframe)이 사라진다.** 그 화면을 보고 있던
     *   감시자를 여기서 끊지 않으면, 이미 없는 것을 계속 재는 감시자가
     *   남는다 — 그것이 쌓이는 것이 「쓸수록 느려진다」의 정체였다. */
    unwatch();
    view.textContent = '';
    // ★ 탭 안에 얹을 때는 **제목을 그리지 않는다.** 탭 바가 이미 이름을 말하므로
    //   그대로 두면 「새 보고서 생성」 아래에 「보고서 생성」이 또 나온다.
    //   기본은 false — 이 화면을 단독으로 열면 이름이 없으면 안 된다.
    if (!C.inTab) view.appendChild(el('h1', null, F.SECTION.title));

    // ★ 토큰이 안 실리면 색·글꼴이 통째로 빠지는데 **오류는 안 난다.**
    //   「화면이 이상하다」로 끝나지 않게 원인을 화면이 말한다
    if (F.tokensLoaded() === false) {
      var tw = el('div', 'nostyle', F.TOKENS_MISSING);
      tw.setAttribute('role', 'alert');
      // 토큰이 없는 상황이므로 var() 를 쓰지 않는다 — 인라인으로 칠한다
      tw.setAttribute('style', 'margin:0 0 14px;padding:12px 14px;border-radius:10px;background:#FFF4E5;color:#8A5A10;border:1px solid #F0DEBE;font-size:13.5px;line-height:1.6');
      view.appendChild(tw);
    }

    var a = G.access(C.session, C.requiredPlan);
    if (!a.allowed) {
      var m = G.accessMessage(a, (C.planNames || {})[C.requiredPlan] || C.requiredPlan, '보고서 생성');
      var g = el('section', 'card');
      add(g, el('h2', 'card__t', (m && m.title) || '사용할 수 없습니다'),
        el('p', 'card__d', (m && m.body) || ''));
      view.appendChild(g);
      return;
    }

    recount();

    var steps = F.stepState(ctx());
    if (!state.current) {
      var first = steps.filter(function (s) { return !s.locked; })[0] || steps[0];
      state.current = first.id;
      steps = F.stepState(ctx());
    }

    /* ── 절 다섯을 차례로 세운다 〈2026-08-22 사용자 지시〉 ────────
     *   ① 제작 기본정보 입력 ② 무엇을 만들까요? ③ 관련자료 업로드
     *   ④ 가이드 필드 (자동입력 + 직접입력) ⑤ 출력조건
     *   ★ 절 번호와 단계 번호가 **같다.** 진행률 절이 ①이던 앞 판은 둘이
     *     하나씩 어긋나 「1단계」라는 말이 어느 칸을 가리키는지 흐렸다.
     *
     * ★ 지금 단계의 화면만 절 안에 편다. 나머지는 머리만 두고 눌러서 연다 —
     *   전부 펴 두면 「앞 단계를 건너뛸 수 없다」가 화면에서 사라진다.
     */
    var docs = window.LINKPILOT_PREVIEW_DOCS;
    var shell = !!(docs && !Object.keys(docs).length);   // 껍데기 조각
    var byStep = {};
    steps.forEach(function (st) { byStep[st.id] = st; });

    F.sectionState(ctx()).forEach(function (sec) {
      /* ★ 이제 모든 절이 단계를 품는다. 「품은 단계가 없는 절」(진행률)은 없앴다 */
      // 껍데기 조각에서는 단계 화면을 안 심었다. 없는 주소를 부르면 빈 칸이 뜨고
      // 그 빈 칸을 고장으로 읽는다 — 그래서 부르러 가지 않고 그렇다고 적는다
      if (shell) {
        view.appendChild(section(sec, sec.current
          ? notice('', '단계 화면은 이 조각에 넣지 않았습니다',
            '여기서는 절 구성과 세부 진행률만 보여줍니다.')
          : null));
        return;
      }
      // 미리보기(문서를 심은 판)는 **한 번에 편다.** 눌러 가며 확인하면 빠뜨린다
      if (docs) {
        var frag0 = document.createDocumentFragment();
        sec.steps.forEach(function (st) { frag0.appendChild(stage(st)); });
        var tw0 = toolRow(sec);
        if (tw0) frag0.appendChild(tw0);
        view.appendChild(section(sec, frag0));
        return;
      }

      /* ★★★ **펴는 것을 사람이 정한다** 〈2026-08-29 사장님 지시 · D-172〉.
       *   앞 판은 「지금 칸」만 폈다 — 지나온 칸을 다시 보려면 되돌아가야 했고,
       *   되돌아가면 「지금 칸」이 바뀌어 앞으로 가던 자리를 잃었다. */
      if (!isOpen(sec)) { view.appendChild(section(sec, null)); return; }

      var frag = document.createDocumentFragment();
      sec.steps.forEach(function (st) { frag.appendChild(stepBody(st)); });
      /* ★ 도구줄이 [완료] **앞**에 온다 〈D-158〉. 미리보기·수정은 「이 칸을
         끝내기 전에」 하는 일이고, [완료] 는 끝냈다는 말이다 — 순서가 뜻이다 */
      var tw = toolRow(sec);
      if (tw) frag.appendChild(tw);
      var go = confirmRow(sec);
      if (go) frag.appendChild(go);
      view.appendChild(section(sec, frag));
    });

    /* ★★★ **앱이 앱 안에 겹쳐 있으면 말한다** 〈2026-08-28 · D-164〉.
     *   배너·탭이 두 벌로 보이는 상태다. 이 화면이 만든 것이 아니고 이
     *   저장소가 고칠 수도 없지만, **원인이 안 보이는 것이 더 나쁘다** —
     *   그러면 엉뚱한 곳을 고치게 된다. 세어서 그대로 적는다. */
    /* ★★★ **`direct: true` 를 준다** 〈2026-08-29 사장님 화면 「잘못된 케이스」 · D-179〉.
     *   이 화면은 앱이 **바로** 틀에 넣는 자리다. 그러므로 나와 맨 위 사이에
     *   문서가 하나라도 있으면 그것은 우리 것이 아니다 — 앱이 자기 페이지를
     *   한 겹 더 넣었다는 뜻이다.
     *   ★ 앞 판은 위쪽 창이 `LINKPILOT_EMBED` 를 들고 있는지로만 셌다. 그 전역은
     *     앱이 **우리 화면에 넣어 주는 것**이라, 사이에 낀 것이 앱 자신의
     *     페이지면 그 칸이 비어 있다 — 그래서 두 벌로 보이는 화면에서
     *     **경고가 한 줄도 안 떴다.** 세는 자가 그 모양을 못 쟀다. */
    var nest = F.nestedAppNote && F.nestedAppNote(null, { direct: true });
    if (nest) {
      view.appendChild(notice('note--bad', '배너와 탭이 두 벌로 보입니다', nest));
    }

    /* ★ 짐작으로 부른 판이면 **그 사실만 조용히 알린다.** 단계를 잠그지 않는다 —
       잠그면 「왜 안 되는지」를 확인할 길까지 함께 닫힌다 */
    if (APIR.guessed) {
      view.appendChild(notice('', '앱이 서버 주소를 넘기지 않았습니다',
        F.apiNote(APIR, '그래도 단계는 열어 둡니다 — 눌러 보시면 서버가 무엇이라고 답하는지 그 자리에 적힙니다.')));
    }

  }

  /* ═══════════ 잰다 — 완료·진행율은 **실제로 물어본 것**만 말한다 ═══════════
   *
   * ★★★ 여기서 아무것도 지어내지 않는다. 못 물어봤으면 `null` 로 두고 화면은
   *   아무 표시도 안 한다. **「0%」는 「못 쟀다」가 아니다** (§4.9).
   *
   * ★ 다섯 갈래를 **각각** 부른다. 하나가 닫혀 있어도 나머지는 그린다 —
   *   `Promise.all` 로 묶으면 하나가 죽을 때 다섯이 다 빈칸이 된다.
   * ★ 대답이 올 때마다 다시 그린다. 다 모아서 한 번에 그리면, 느린 하나 때문에
   *   빠른 넷이 함께 늦는다.
   */
  function call(path) {
    return fetch(C.api + path, { credentials: 'same-origin' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  /** 자료 목록에서 **올린 건수와 그중 읽은 건수**를 센다 (`readAt` 이 읽은 표시다) */
  function countSources(lists) {
    var total = 0, read = 0;
    lists.forEach(function (items) {
      (items || []).forEach(function (it) {
        total += 1;
        if (it && it.readAt) read += 1;
      });
    });
    return { total: total, read: read };
  }

  function measure() {
    /* 미리보기(서버 없이 심어 둔 판)에서는 심어 준 값을 쓴다 — 지어내지 않는다 */
    if (C.preload) {
      var pl = C.preload;
      if (pl.issuerSet !== undefined) facts.issuerSet = pl.issuerSet;
      if (pl.issuerName !== undefined) facts.issuerName = pl.issuerName;
      if (pl.sources) facts.sources = countSources([pl.sources]);
      if (pl.fields && pl.values && window.LinkPilotFields) {
        var c0 = window.LinkPilotFields.completeness(pl.fields, pl.values, C.docType || 'im', pl.classKeys || null);
        facts.fields = { filled: c0.filled, total: c0.total };
      }
      if (pl.spec) facts.specLocked = !!pl.spec.locked;
      /* ★ 심어 준 문서 목록이 있으면 쓴다. 없으면 `null` 그대로 — 미리보기에서
         「없다」로 그리면 실제로는 있는 것을 없다고 말하게 된다 */
      if (pl.reports) {
        facts.reports = pl.reports.files || pl.reports.all || [];
        facts.reportsBlocked = !!(pl.reports.distribution && pl.reports.distribution.blocked);
      }
      draw();
      return;
    }
    if (!C.api) return;   // 서버가 없다 — 못 쟀다고 두는 것이 맞다

    var pid = state.projectId;

    /* ① 발행 주체 — 프로젝트가 없어도 잰다 (이 값은 계정 설정이다) */
    call('/intake').then(function (j) {
      var iss = j && j.issuer;
      facts.issuerSet = !!(iss && !iss.unset && String(iss.en || '').trim());
      facts.issuerName = facts.issuerSet ? String(iss.en).trim() : null;
      draw();
    }, function () { /* 못 쟀다 — null 로 둔다 */ });

    if (!pid) return;

    /* ② 자료 — 두 갈래를 각각 부르고, 받은 것만 센다 */
    Promise.all([
      call('/projects/' + encodeURIComponent(pid) + '/linked').then(
        function (j) { return (j && j.items) || []; }, function () { return null; }),
      call('/projects/' + encodeURIComponent(pid) + '/oneshot').then(
        function (j) { return (j && j.items) || []; }, function () { return null; }),
    ]).then(function (rs) {
      /* 둘 다 못 받았으면 **0건이라고 말하지 않는다.** 0건과 못 쟀다는 다르다 */
      if (rs[0] === null && rs[1] === null) return;
      facts.sources = countSources(rs.filter(function (x) { return x !== null; }));
      draw();
    });

    /* ③ 가이드 필드 — 필수 항목 채움. 판정은 `fields-core` 가 한다 */
    if (window.LinkPilotFields) {
      Promise.all([
        call('/fields'),
        call('/projects/' + encodeURIComponent(pid) + '/facts'),
      ]).then(function (rs) {
        var def = rs[0] || {}, got = rs[1] || {};
        var c = window.LinkPilotFields.completeness(
          def.fields || def, got.values || got.facts || {},
          C.docType || 'im', got.classKeys || null);
        facts.fields = { filled: c.filled, total: c.total };
        draw();
      }, function () {});
    }

    /* ④ 출력조건 — 확정했나 */
    call('/projects/' + encodeURIComponent(pid) + '/spec').then(function (j) {
      var sp = j && j.spec;
      /* ★ 못 읽었으면 **잠긴 척도 안 잠긴 척도 하지 않는다.** `spec` 이 없다는
         대답을 받은 것은 「아직 확정 안 했다」가 맞다 */
      facts.specLocked = !!(sp && sp.locked);
      draw();
    }, function () {});

    /* ⑤ 만들어진 문서 — [미리보기]·[다운로드] 가 이것을 쓴다 〈D-158〉.
     *   ★ `outputs.html` 과 **같은 창구**다. 못 받으면 `null` 로 둔다 —
     *     「없다」가 아니라 「못 쟀다」이고, 화면이 그렇게 말한다. */
    call('/projects/' + encodeURIComponent(pid) + '/reports').then(function (j) {
      var d = j || {};
      facts.reports = d.all || d.files || [];
      facts.reportsBlocked = !!(d.distribution && d.distribution.blocked);
      draw();
    }, function () {});
  }

  draw();
  measure();

  // 지침 §2 유료 메뉴 잠금 · §1 인앱 브라우저 배너
  if (window.LinkPilotCatalog) window.LinkPilotCatalog.applyLocks(document, C.session);
  if (window.LinkPilotInApp) window.LinkPilotInApp.auto();

  /* ★ **판 지문을 화면에 보이게 남긴다** (CLAUDE.md §8). 속성만 있으면
     사진에 안 찍히고, 그러면 「이것이 그 판인가」를 가릴 수가 없다 */
  if (window.LinkPilotFlow && window.LinkPilotFlow.stampInto) {
    try { window.LinkPilotFlow.stampInto(document); } catch (_) {}
  }
}());
</script>
</body>
</html>
