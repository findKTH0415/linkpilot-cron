<!doctype html>
<html lang="ko" data-lp-build="63cb215a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보고서 생성 · LINKPILOT</title>
<!--
  report-flow.html — 앱의 [보고서 생성] 섹션에 그대로 끼우는 화면.

  ★ 무엇이 달라지는가:
    지금 앱의 [보고서 생성] 은 **기반정보를 내보내는 곳**이다 — 값 입력은
    바깥 AGENT 가 받는다. 그러면 「출처 없는 숫자는 들어올 수 없다」를 앱이
    강제할 수 없다. 출처 검사·계산 항목 차단·사양 확정이 전부 바깥에 있기 때문이다.
    이 화면은 **값 입력을 앱 안으로 들여온다.** 내보내기 경로는 지우지 않고 아래에 남긴다.

  ★ 4단계는 flow-core.js 하나가 정한다. 미리보기(build-preview.js)도 같은 파일을
    읽는다 — 목록이 두 벌이 되면 제품과 미리보기가 다른 흐름을 보여준다.

  ★ 단계 화면(intake·fields·reports)을 **복사하지 않는다.** 그 화면들을 그대로
    끼운다. 복사하면 출처 검사가 두 벌이 되고, 한쪽만 고치는 날 규칙이 갈린다.

  ★ 잠긴 단계는 회색으로만 두지 않고 **이유를 적는다.** 이유 없는 회색은
    고장으로 보이고, 사용자는 앱이 죽었다고 판단한다.

  앱에 붙이는 법 — 아래 window.LINKPILOT_REPORT_FLOW 만 채운다.
    api      본체 API 주소 (예: '/api/linkpilot')
    base     단계 화면들이 놓인 경로 (예: '/im/'). 같은 폴더면 빈 문자열
    session  로그인·플랜 (gate-core.js 가 판정한다)
-->
<script>
/* ★★ **오래 걸리면 말한다** 〈2026-08-21〉. 뼈대만 두고 끝나면 그것도 흰 화면과
 *   다를 바 없다 — 「채워지는 중」이 영원히 채워지지 않는 것을 사용자가 알
 *   방법이 없기 때문이다. 뼈대가 그대로 남아 있으면 무엇을 해야 하는지 적는다.
 *   ★ 화면이 떴으면 `#boot` 이 통째로 사라지므로 이 글은 나오지 않는다. */
(function () {
  setTimeout(function () {
    var w = document.getElementById('lp-boot-why');
    if (!w || !document.getElementById('lp-boot')) return;
    w.hidden = false;
    w.textContent = '아직 화면이 안 떴습니다. 연결이 느리거나 화면 파일을 못 받은 것입니다 — '
      + '새로고침해 보시고, 그래도 그대로면 알려 주십시오.';
  }, 8000);
})();
</script>
<script>
/* ★★★ **빈 화면으로 끝나지 않는다** 〈2026-08-24 사장님: 데스크탑에서 흰 화면〉.
 *
 *   화면이 통째로 비어 뜬 일이 있었다. 소스는 멀쩡했고 헤드리스로 열면
 *   정상이었다 — 즉 **그 순간의 브라우저에서만** 무언가가 안 왔다.
 *
 *   ★ 가장 흔한 자리: 배포가 파일을 하나씩 갈아 끼우는 동안(70초쯤) 화면은
 *     새 판인데 형제 스크립트가 **아직 안 올라와 404** 인 순간이 있다.
 *     그러면 전역이 아예 안 생기고, 첫 줄에서 예외가 나고, **화면은 흰 채로
 *     아무 말도 안 한다.**
 *   ★ 아래쪽 **짝 확인 조각**은 옛 스크립트는 잡지만 **없는 스크립트**는
 *     못 잡는다 — 견줄 전역 자체가 없기 때문이다. 여기가 그 구멍이다.
 *     (그 조각의 표시 이름을 여기 글자로 적지 않는다. 그것을 찾는 검사가
 *      이 주석을 코드로 오해한다 — CLAUDE.md §8 에서 세 번째로 당한 자리다.)
 *
 * ★ 그래서 ① 파일이 안 온 것과 ② 코드가 던진 것을 **둘 다** 사람 말로 띄운다.
 * ★ 이 조각은 **형제 스크립트보다 먼저** 있어야 한다. 뒤에 두면 이미 난
 *   불러오기 실패를 못 듣는다.
 * ★ 검사 자신이 죽으면 안 된다 — 전부 try 로 감싼다. */
(function () {
  /* ★★★★ **자리를 「고치는」 것이 아니라 「틀리지 않게」 한다**
   *   〈2026-08-26 · 같은 고장 **네 번째** · M-56〉.
   *
   *   앱이 이 화면을 어디에 얹느냐에 따라 형제 파일 주소가 두 가지로 틀렸다 —
   *
   *     겹침    /im-flow/im-flow/embed-bridge.js   (앞을 두 번 붙인다)
   *     빠짐    /embed-bridge.js                   (앞을 아예 안 붙인다)
   *
   *   ★ 3판은 **겹침만** 고쳤다. 그래서 빠짐이 나자 또 빨간 띠가 떴다.
   *     **한 증상만 보고 고치면 남은 증상이 다음 주에 온다.**
   *
   * ★★ 그래서 「무엇이 틀렸나」를 고치지 않고 **「어디가 맞나」를 정한다.**
   *   형제 파일들은 늘 **한 폴더에 함께** 있다. 그 폴더를 세 가지로 찾는다 —
   *
   *     ① 앱이 알려 준 자리      `<meta name="lp:base">` 또는 window.LP_BASE
   *     ② 주소에 `im-flow` 가 있으면 **첫 번째** 것까지  (겹침이 여기서 풀린다)
   *     ③ 뿌리(`/`)에서 열렸으면 `/im-flow/`             (빠짐이 여기서 풀린다)
   *
   *   ①이 있는 이유: 앱이 다른 자리에 얹게 되는 날 **코드를 안 고치고**
   *   알려 줄 길을 남겨 둔다. 없으면 그날 또 이 파일을 고치게 된다.
   *
   * ★★★ **파일로 열었을 때(file:)는 손대지 않는다.** 미리보기가 그 길이다 —
   *   거기서 자리를 바꾸면 멀쩡한 화면이 깨진다 (늑대야).
   *
   * ★ 이 조각은 형제 파일들보다 **위**에 있으므로, 여기서 `<base>` 를 세우면
   *   아래 상대 경로들이 **처음부터 옳은 자리**를 본다 — 실패가 아예 안 난다.
   *   실패한 뒤에 다시 부르는 것으로는 부족했다(실측: 파일 17개를 다시 받았는데
   *   **버튼이 5개에서 0개**가 되었다 — 이미 초기화가 끝난 뒤였다).
   */
  try {
    var FOLDER = 'im-flow';                  /* 형제 파일들이 함께 사는 폴더 이름 */
    var base = null;
    var why = null;

    /* ① 앱이 알려 준 자리 */
    try {
      var meta = document.querySelector('meta[name="lp:base"]');
      var told = (meta && meta.getAttribute('content')) || window.LP_BASE || null;
      if (told) { base = String(told).replace(/\/*$/, '') + '/'; why = '앱이 알려 줌'; }
    } catch (_) { /* 무시 */ }

    if (!base && /^https?:$/.test(location.protocol)) {
      var pathname = String(location.pathname);
      var at = pathname.indexOf('/' + FOLDER + '/');
      if (at >= 0) {
        /* ② 첫 번째 `/im-flow/` 까지가 그 폴더다. 두 번 이어져 있어도 여기서 풀린다 */
        base = pathname.slice(0, at + FOLDER.length + 2);
        why = '주소에서 찾음';
      } else if (pathname.lastIndexOf('/') === 0) {
        /* ③ 뿌리에서 열렸다 — 형제 파일이 뿌리에 있을 리 없다 */
        base = '/' + FOLDER + '/';
        why = '뿌리에서 열려 폴더를 붙임';
      }
    }

    /* 지금 자리와 같으면 아무것도 하지 않는다 — 멀쩡한 화면을 건드리지 않는다 */
    var now = String(location.pathname).slice(0, String(location.pathname).lastIndexOf('/') + 1);
    if (base && base !== now && !document.querySelector('base[data-lp-base]')) {
      var b = document.createElement('base');
      b.setAttribute('data-lp-base', why);
      b.href = location.origin + base;
      (document.head || document.documentElement).insertBefore(
        b, (document.head || document.documentElement).firstChild);
      /* ★★ **조용히 넘어가지는 않는다.** 화면은 살렸지만 **근본은 앱 쪽**이다
       *   (앞을 붙이는 쪽). 사장님 화면에 빨간 띠를 띄우면 멀쩡히 도는 화면을
       *   고장으로 읽으시게 되므로, 개발자 콘솔과 표시로만 남긴다 —
       *   사람은 안 놀라고, 기계는 셀 수 있다. */
      try {
        console.warn('[LinkPilot] 형제 파일 자리를 바로잡았다 (' + why + '): '
          + now + ' → ' + base
          + ' — 화면은 정상이지만 **앞부분을 붙이는 앱 쪽**이 근본이다.');
      } catch (_) { /* 콘솔이 없어도 죽지 않는다 */ }
    }
  } catch (_) { /* 자리를 못 고쳐도 죽지 않는다 — 아래 띠가 받는다 */ }

  var shown = false;
  /**
   * ★★★ **고쳤다는 말과 못 고쳤다는 말을 같은 색으로 하지 않는다**
   *   〈2026-08-26 · 자가치유를 넣으면서〉.
   *
   *   빨강은 「화면이 안 뜬다」는 뜻이어야 한다. 스스로 고쳐서 화면이
   *   멀쩡히 뜬 경우까지 빨강으로 적으면, 사장님은 **멀쩡한 화면을 보며
   *   고장이라고 읽으신다** — 그러면 다음부터 빨간 띠를 안 믿게 된다.
   *
   * ★★ 그리고 **빗장(shown)을 경고에는 걸지 않는다.** 앞 판은 한 번 뜨면
   *   끝이라, 자가치유 알림이 먼저 뜨면 **뒤에 오는 진짜 실패가 통째로
   *   조용해졌다.** 조용한 실패가 이 저장소에서 가장 비쌌다.
   */
  function say(msg, kind) {
    var warn = kind === 'warn';
    if (shown) return;
    if (!warn) shown = true;          /* 치명만 빗장을 건다 */
    try {
      var n = document.createElement('div');
      n.setAttribute('data-lp-fail', warn ? 'warn' : '');
      n.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:99999;'
        + 'background:' + (warn ? '#8A6100' : '#C00000')
        + ';color:#fff;padding:14px 18px;font:700 14px/1.5 system-ui,sans-serif');
      n.textContent = msg;
      var put = function () { if (document.body) document.body.appendChild(n); };
      if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
    } catch (_) { /* 알리다 죽지 않는다 */ }
  }
  /* 불러오기 실패는 거품이 안 올라온다 — 잡기 단계(true)에서 들어야 한다 */
  window.addEventListener('error', function (e) {
    try {
      var t = e && e.target;
      if (!t || !t.tagName) return;
      var tag = String(t.tagName).toUpperCase();
      if (tag !== 'SCRIPT' && tag !== 'LINK') return;
      /* ★★★ **이름만으로는 갈라 낼 수 없다** 〈2026-08-25 · 실제로 못 갈랐다〉.
       *   앱 안에서 이 띠가 떴을 때 「그 파일이 NAS 에 없다」와 「앱이 엉뚱한
       *   자리에서 찾는다」가 **똑같이 파일 이름 하나로만** 보였다. 파일은
       *   NAS 에 있었고 HTTP 200 이었는데도 그랬다 — 갈랐어야 할 것은
       *   **어느 경로로 찾았나**이고, 그것이 이름을 자르면서 사라졌다.
       * ★ 호스트는 뗀다 (CLAUDE.md §2). 경로만 있으면 갈린다. */
      var raw = String(t.src || t.href || '');
      var where = raw;
      try { var u = new URL(raw, location.href); where = u.pathname + u.search; } catch (_) {}
      /* ★★★ **경로가 겹쳤으면 그렇다고 말한다** 〈2026-08-26 · 실제로 났다〉.
       *   앱 안에서 `/im-flow/im-flow/tokens.css` 로 찾다가 못 받았다.
       *   이 화면들의 링크는 **전부 상대 경로**(`tokens.css`)라 앞을 붙이지
       *   않는다 — 즉 앞부분을 **덧붙이는 쪽은 앱**이다.
       *
       *   ★ 그런데 띠는 「못 받았습니다」만 말했다. 그러면 「파일이 없다」와
       *     「엉뚱한 자리에서 찾는다」가 **같은 문장으로 보인다.** 사장님은
       *     새로고침을 하시고, 그래도 그대로면 그때부터 원인을 못 찾는다.
       *   ★ 같은 토막이 두 번 이어지는 것은 **새로고침으로 안 없어진다.**
       *     그것은 배포가 도는 중이라서가 아니라 **주소를 만드는 코드**의 일이다. */
      var dup = null;
      try {
        var segs = String(where).split('?')[0].split('/').filter(Boolean);
        for (var i = 0; i + 1 < segs.length; i++) {
          if (segs[i] === segs[i + 1]) { dup = segs[i]; break; }
        }
      } catch (_) { /* 무시 */ }
      if (dup) {
        /* ★★★ **띠는 진단만 했다 — 그래서 같은 일이 계속 났다** 〈2026-08-26 · 세 번째〉.
         *
         *   앞 판 둘은 **메시지를 좋게 만드는 일**이었다. 「못 받았습니다」에
         *   경로를 붙이고, 다시 「두 번 들어 있습니다」를 붙였다. 그런데
         *   **화면은 여전히 안 떴다.** 사장님이 보시는 것은 같은 빨간 띠다.
         *
         * ★ 잘 설명하는 고장은 **고장이다.** 여기서 스스로 고친다 —
         *   겹친 토막을 하나 지우고 **그 파일을 다시 부른다.**
         *
         * ★★ 앞을 덧붙이는 것은 앱 쪽이지만, **고치는 것은 이쪽이 할 수 있다.**
         *   저쪽 저장소에 쓰지 않기로 한 경계(§8-2)를 지키면서 화면은 살린다.
         *
         * ★★★ **한 번만 고친다.** 고친 주소가 또 실패하면 그때는 진짜로
         *   파일이 없는 것이다 — 무한히 다시 부르면 그 사실이 사라진다. */
        var fixed = null;
        try {
          var u2 = new URL(raw, location.href);
          var ss = u2.pathname.split('/');
          for (var k = 0; k + 1 < ss.length; k++) {
            if (ss[k] && ss[k] === ss[k + 1]) { ss.splice(k, 1); break; }
          }
          u2.pathname = ss.join('/');
          fixed = u2.href;
        } catch (_) { fixed = null; }

        if (fixed && fixed !== raw && !t.getAttribute('data-lp-healed')) {
          var el = tag === 'LINK'
            ? document.createElement('link')
            : document.createElement('script');
          el.setAttribute('data-lp-healed', '1');
          if (tag === 'LINK') { el.rel = 'stylesheet'; el.href = fixed; }
          else {
            el.src = fixed;
            /* 원래 태그가 지녔던 표시를 그대로 옮긴다 — 이것이 없으면
               `embed-bridge.js` 가 어느 전역에 붙을지 모른다 */
            var g = t.getAttribute('data-lp-global');
            if (g) el.setAttribute('data-lp-global', g);
            el.async = false;   /* 순서를 지킨다 — 뒤 파일이 앞 파일을 쓴다 */
          }
          t.setAttribute('data-lp-healed', '1');
          (document.head || document.documentElement).appendChild(el);
          say('경로에 「' + dup + '」가 두 번 들어 있어 **한 번 고쳐서 다시 불렀습니다** — '
            + where + ' → ' + (function () {
              try { var v = new URL(fixed); return v.pathname + v.search; } catch (_) { return fixed; }
            }()) + '. 화면이 뜨면 그대로 쓰셔도 됩니다. 앞부분을 덧붙이는 것은 **앱 쪽**이라 '
            + '근본은 그쪽에서 고쳐야 합니다 — 이 경로를 그대로 알려 주십시오.', 'warn');
          return;
        }
        say('화면에 필요한 파일을 못 받았습니다: ' + (where || '(이름 모름)')
          + ' — 경로에 「' + dup + '」가 **두 번** 들어 있습니다.'
          + ' 고쳐서 다시 불러 봤지만 그것도 실패했습니다 — 파일이 정말 없는 자리입니다.'
          + ' 위 경로를 그대로 알려 주십시오.');
      } else {
        say('화면에 필요한 파일을 못 받았습니다: ' + (where || '(이름 모름)')
          + ' — 배포가 도는 중이면 30초 뒤 새로고침(Mac ⌘⇧R · Windows Ctrl+Shift+R)으로 사라집니다.'
          + ' 한 번 하고도 그대로면 그것은 **다른 일**입니다 — 위 경로를 그대로 알려 주십시오.');
      }
    } catch (_) { /* 무시 */ }
  }, true);
  /* ★★★ **헛울음을 내지 않는다** 〈2026-08-24 · 실측에서 걸렸다〉.
   *   `report-flow.html` 은 창을 품고 있어서 브라우저가 막는 읽기가 하나 난다
   *   (`SecurityError: Location.pathname`). 화면은 **멀쩡히 뜬다.**
   *   그것까지 빨간 띠로 띄우면 **멀쩡한 화면에 고장 딱지**가 붙는다.
   * ★ 그래서 코드가 던진 것은 **화면이 실제로 비었을 때만** 알린다.
   *   빈 화면이 이 장치가 막으려는 것이고, 그 밖은 알릴 일이 아니다. */
  var lastErr = null;
  function noteErr(m) {
    lastErr = m;
    setTimeout(function () {
      try {
        var b = document.body;
        var n = b ? (b.innerText || '').trim().length : 0;
        if (n < 40) {
          say('화면을 그리다 멈췄습니다: ' + lastErr
            + ' — 이 글이 보이면 고장입니다. 이대로 알려 주십시오.');
        }
      } catch (_) { /* 무시 */ }
    }, 1200);
  }
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target.tagName) return;   // 위에서 이미 다뤘다
    noteErr((e && e.message) || '알 수 없는 오류');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    noteErr((r && r.message) || r || '알 수 없는 오류');
  });
}());
</script>

<style>
/* 색·간격·반경 토큰은 tokens.css 하나가 정한다 (LinkPilot Design System v1.1) */

}

h1 { margin: 0 0 18px; font-size: 30px; letter-spacing: -.01em; }

/* ★★★ 화면 머리 — **앱 안에서도 그린다** 〈2026-08-30 사장님 지시 · D-200〉.
   앱의 사진 배너를 지웠으므로(저쪽 초안 PR 5번) 머리를 다는 자리는 여기 하나다.
   ★ 사진을 다시 넣지 않는다 — 자리를 많이 먹었고 두 벌 사고의 원인이었다.
   ★★ 이름을 `.top`·`.steps` 로 짓지 않는다. 그 둘은 앱이 얹을 때 감추는 이름이라
      (`flow-core.js` 의 EMBED_CSS) 그렇게 지으면 **앱 안에서만 조용히 사라진다.** */
/* ★★★ 앱의 «다른 섹션 배너»와 같은 몸집으로 맞춘다 〈2026-09-09 사장님 지시:
     「광고배너는 일관성있게 통일 다른섹션부분과 같게」〉.
   [무엇이 달랐나] 앱의 다른 배너(오늘의 브리핑 등)는 «높이 120px · 모서리 16 ·
     제목 한 줄 · 부제 한 줄»이다. 이 배너만 라임 딱지 한 줄이 더 있고 부제가 두 줄로
     접혀 **200px 넘게** 자리를 먹었다. 한 화면 안에서 배너 둘이 다른 크기로 서 있으면
     «다른 앱을 붙여 놓은 것»처럼 보인다.
   ★ 그림이 들어왔다 〈2026-09-14 사장님 지시: 「배너를 일관성있게 이미지넣어 만들어줘」〉.
     남의 사진이 아니라 **우리가 그린 그림**이고 자리마다 다르다 (`flow-core` 의 heroSvg) —
     남의 사진이면 §6-2-6 일곱에 걸리고, 바깥 주소를 물면 자체 완결이 깨진다 (§8).
     ★ 두 벌 사고는 앱 쪽 배너를 지워서 이미 풀렸다 (§8-2 · S-39). 여기서 재는 것은
       여전히 «몸집»이다 — 그림이 들어와도 높이는 안 늘어난다.
   ★★ 라임 딱지 줄을 안 그린다. 앱의 다른 섹션 배너에는 그 줄이 없다.
     설정값은 flow-core 의 kicker 에 남겨 둔다 — 지우면 다른 화면이 쓰던 것까지 없어진다.
   ★★★ 그 딱지의 «글자»를 여기 적지 않는다. `nested-app-notice.test.js` 가 이 파일에
     그 글자가 있으면 «우리가 그린 것»으로 읽고 빨개진다 — 방금 그렇게 한 번 걸렸다
     (CLAUDE.md §8 — 검사가 찾는 이름을 주석에 글자로 적지 않는다). */
/* ★★★ 배너 모양은 **`flow-core` 의 HEAD_CSS 한 벌**이다 〈2026-09-14〉 —
   `headEl` 이 심는다. 여기 적어 두면 화면이 늘 때마다 복사해야 하고 두 벌이 된다 (§8-1).
   ★ 되돌려 보려면 `flow-core.js` 의 HEAD_CSS 를 본다. */

/* ★★★ 탭 줄 — **앱이 아니라 이 화면이 단다** 〈2026-08-31 사장님 지시〉.
   [지시] 「Linkpilot 프레임 보고서생성 상단배너바를 삭제하고 Engine Agent 의
   보고서생성 상단배너바 상단으로 올려줘」 — 배너와 탭이 한 덩어리로 올라온다.
   ★ 이름을 `.tabs` 로 짓는다. `.top`·`.steps`·`.side` 는 앱이 감추는 이름이라
     그 셋을 피한다 (`flow-core.js` 의 EMBED_CSS) — 그렇게 지으면 앱 안에서만
     조용히 사라져 「혼자 뜬 판은 멀쩡한데 앱에서만 없다」가 된다. */
/* 〈2026-10-25 · v2 §8.4 탭 세그먼트〉 바탕 띠 위에 켜진 칸만 흰 카드로 선다 — 앞 판의 «잉크 채움»을 걷었다 */
.tabs { display: flex; gap: 4px; margin: 0 0 16px; padding: 4px; border-radius: 14px;
  background: var(--lp-seg-track); }
.tabs button {
  flex: 1; min-height: 36px; padding: 6px 14px; border-radius: 10px; cursor: pointer;
  font: 500 14.5px/1.3 var(--lp-font); border: 0;
  background: transparent; color: var(--lp-text-2);
}
.tabs button[aria-current="page"] {
  background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--lp-shadow-seg);
}
.tabs button:hover:not([aria-current="page"]) { background: var(--lp-hover); }
.tabs button:focus-visible { outline: 2px solid var(--lp-brand-deep); outline-offset: 2px; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 22px clamp(16px, 3vw, 28px); margin-bottom: 16px;   /* v2 §3.1 카드 공통 */
}
.card__t { margin: 0 0 6px; font-size: 17px; }
.card__d { margin: 0; color: var(--ink2); font-size: 14px; }

/* ── 절 넷 — 화면의 뼈대 〈2026-08-20〉 ────────────────────
   ① 제작 기본정보 입력 ② 무엇을 만들까요? ③ 관련자료 업로드
   ④ 가이드 필드 ⑤ 출력조건
   ★ 전에는 레일이 위에, 진행률이 그 아래에 따로 있어서 **어디까지 왔나**와
     **지금 무엇을 하나**가 서로 다른 곳에서 말했다. 한 줄기로 세운다. */
/* 왼쪽 «진행절차 목록» 〈2026-10-23 사장님 화면〉 — 900px 밑은 한 칸(목록 안 그림) */
/* 〈2026-10-25 · v2 §8.6 단계 목록〉 흰 카드 · 행 44 · 원 28 — 현재 = 연두 바탕 + 잉크 원 · 끝남 = 라임 원 + 체크 · 남음 = 회색 원 */
.rf-grid { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
.rf-main { min-width: 0; }
.rf-proc { position: sticky; top: 0; display: flex; flex-direction: column; gap: 2px; padding: 16px 10px 10px; border: 0; border-radius: var(--lp-r-card); background: var(--surface); }
.rf-proc__t { font: 600 13px/1.4 var(--lp-font); color: var(--lp-text-3); padding: 0 10px 8px; }
.rf-proc__i { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 10px; border: 0; border-radius: var(--lp-r-12); background: transparent; color: var(--ink); font: 500 15px/1.35 var(--lp-font); text-align: left; cursor: pointer; }
.rf-proc__i:hover:not(:disabled) { background: var(--lp-hover); }
.rf-proc__i:disabled { cursor: default; color: var(--lp-text-3); }
.rf-proc__i--on, .rf-proc__i--on:hover:not(:disabled) { background: var(--lp-brand-soft); color: var(--lp-brand-ink); font-weight: 700; }
.rf-proc__i:focus-visible { outline: 2px solid var(--lp-brand-deep); outline-offset: 1px; }
.rf-proc__n { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 700 13px/1 var(--lp-font); background: var(--lp-step-idle); color: var(--ink); font-variant-numeric: tabular-nums; }
.rf-proc__n svg { display: block; }
.rf-proc__i--done .rf-proc__n { background: var(--lp-brand); color: var(--lp-brand-ink); }
.rf-proc__i--on .rf-proc__n { background: var(--lp-brand-ink); color: var(--lp-white); }   /* 지금 칸이 이긴다 */
.rf-proc__name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rf-proc__st { font: 600 12px/1 var(--lp-font); color: var(--lp-text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rf-proc__i--done .rf-proc__st { color: var(--lp-brand-deep); }
@media (max-width: 900px) { .rf-grid { display: flex; flex-direction: column; align-items: stretch; gap: 0; } .rf-main { display: contents; } .rf-grid > *, .rf-main > * { min-width: 0; max-width: 100%; } .rf-main > [data-lp-rv2-part="head2"], .rf-main > [data-lp-rv2-part="docs"] { order: -1; } .rf-left { margin: 0 0 14px; } }   /* v2 §3.2 — 900 이하는 휴대폰 · 〈2026-10-25 · 1단계 배치〉 왼쪽 칸은 숨기지 않고 위로 쌓는다 */
.sec { margin: 0 0 14px; }
/* 〈2026-10-25 · v2 §8.9 시작 카드〉 모서리 16 · 켜짐 = 라임 2px + 옅은 라임 바탕 · 원은 단계 목록과 같은 세 상태 */
.sec__h { display: flex; align-items: flex-start; gap: 12px; width: 100%;
  text-align: left; font: inherit; cursor: pointer; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--lp-r-16); padding: 16px; }
.sec__h:hover:not(:disabled) { border-color: var(--lime); }
.sec__h:disabled { cursor: not-allowed; background: var(--lp-fill-1); }
.sec__h--fixed { cursor: default; }
[data-lp-rv2-soon] { cursor: not-allowed; color: var(--lp-text-3); border-style: dashed; }
.rv2-said { margin: 8px 0 0; font-size: 13px; line-height: 1.5; color: var(--lp-text-2, #3c3c43); }
.sec--on > .sec__h { border-color: var(--lime); background: var(--lp-lime-wash);
  box-shadow: inset 0 0 0 1px var(--lime); }
.sec--flat > .sec__h { cursor: default; }
.sec__n { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 50%; background: var(--lp-step-idle);
  color: var(--ink); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.sec--done .sec__n { background: var(--lime); color: var(--lp-brand-ink); }
.sec--on .sec__n { background: var(--lp-brand-ink); color: var(--lp-white); }   /* 지금 칸이 이긴다 */
.sec__h:disabled .sec__n { background: var(--lp-step-idle); color: var(--lp-text-3); }
.sec__b { min-width: 0; flex: 1 1 auto; }
.sec__t { font-weight: 700; font-size: 15px; line-height: 1.45; }
.sec__d { margin: 5px 0 0; font-size: 12.5px; color: var(--ink2); line-height: 1.5; }
.sec__why { margin: 5px 0 0; font-size: 12.5px; color: var(--warn-ink); line-height: 1.5; }
/* 〈2026-10-25 · v2 §8.12 상태 이름표〉 26px · 모서리 8 · 700 12px — 초안 회색 · 지금 라임 · 완료 = 연두 바탕 + 진한 라임 글자 */
.sec__tag { flex: 0 0 auto; margin-left: auto; align-self: center;
  display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: var(--lp-r-8);
  font-weight: 700; font-size: 12px; line-height: 1; font-family: inherit;
  background: var(--lp-tag); color: var(--lp-text-2); white-space: nowrap; }
.sec--on .sec__tag { background: var(--lime); color: var(--lp-brand-ink); }

/* ★★ **끝난 칸은 한눈에 갈린다** 〈2026-08-23 사장님 지시〉. 「열기」와 「완료」가
   같은 회색이면 목록을 위에서부터 다시 읽어야 어디까지 왔는지 안다.
   ★ 라임으로 **큰 면을 채우지 않는다** (§6-3) — 이름표만 연두 바탕이다 (v2 「열람」 이름표와 같은 쌍).
     채우면 「지금」 칸과 구분이 사라지고, 둘 다 죽는다 */
.sec__tag--done { background: var(--lp-brand-soft); color: var(--lp-lime-strong); }
.sec--on .sec__tag--done { background: var(--lime); color: var(--lp-brand-ink); }

/* 진행율 — **숫자를 문장에 숨기지 않는다** (§6-3 ②). 자릿수가 흔들리지 않게
   `tabular-nums` 로 세로를 맞춘다 · 〈2026-10-25〉 v2 §8.7 막대 5px · .4s */
.sec__pct { font-variant-numeric: tabular-nums; }
.sec__bar { margin: 8px 0 0; height: 5px; border-radius: 999px;
  background: var(--lp-line-3); overflow: hidden; }
.sec__bar > i { display: block; height: 100%; background: var(--lime);
  border-radius: 999px; transition: width .4s ease; }
@media (prefers-reduced-motion: reduce) { .sec__bar > i { transition: none; } }

.sec__body { margin-top: 10px; }

.st {
  text-align: left; font: inherit; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 13px 14px; display: block; width: 100%;
}
.st:hover:not(:disabled) { border-color: var(--lime); }
.st.on { border-color: var(--lime); background: var(--lime-soft); box-shadow: inset 0 0 0 1px var(--lime); }
.st:disabled { cursor: not-allowed; background: var(--panel); }
.st__n {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 50%; margin-right: 8px;
  background: var(--lime); color: #23300A; font-weight: 700; font-size: 13px;
}
.st:disabled .st__n { background: #D5D8DC; color: #8A9099; }
.st__name { font-weight: 700; font-size: 15px; vertical-align: middle; }
.st__why { display: block; margin-top: 6px; font-size: 12.5px; color: var(--warn-ink); }
.st__note { display: block; margin-top: 6px; font-size: 12.5px; color: var(--ink2); }

/* ── 세부 진행률 ──────────────────────────────────────────
   ★ 합계 막대를 만들지 않는다. 네 단계는 성격이 달라 하나로 뭉치면
     "80%" 가 무엇의 80% 인지 아무도 모른다. 단계마다 따로 그린다.
   ★ 모르는 것은 0% 막대가 아니라 빗금이다 — 0% 막대는 "다 안 됐다"로 읽힌다 */
/* 묶음 둘 — 「내가 채울 것(1·2·3)」과 「기다리면 되는 것(4)」.
   ★ 눈금과 그 단계들을 **한 테두리 안에** 둔다. 눈금만 위에 몰아 두면
     아래로 내려간 순간 어디까지가 한 덩어리인지 화면에서 사라진다 */
/* ★ 진행률 절을 빼면서 그 칸의 CSS 도 함께 지웠다 〈2026-08-22〉 —
   쓰지 않는 규칙을 남겨 두면 다음 사람이 「이게 어디에 붙나」를 찾는다 */

/* ── 단계 화면 — 내용 높이만큼 편다 (안쪽 스크롤 없음) ────── */
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }

.stage iframe { display: block; width: 100%; border: 0; }

/* 절 맨 아래의 [확인] — 한 칸을 끝냈다고 사람이 말해 주는 자리 (D-157) */
.okrow { display: flex; justify-content: flex-end; align-items: center; gap: 10px;
  margin: 14px 0 2px; flex-wrap: wrap; }
/* 〈2026-10-25 · v2 §8.1 강조 단추(라임)〉 46px · 모서리 12 · 700 15px · hover 진한 라임 */
.okrow__b { font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  min-height: 46px; padding: 0 20px; border-radius: var(--lp-r-12); border: 0;
  background: var(--lime); color: var(--lp-brand-ink); }
.okrow__b:hover { background: var(--lp-lime-hover); }
.okrow__why { font-size: 13px; color: var(--ink2); }

/* 절 도구줄 — [미리보기]·[수정 요구]·[다운로드] 〈2026-08-28 · D-158〉
   ★ [확인] 과 **줄을 나눈다.** 같은 줄에 두면 「확인」이 여럿 중 하나로 읽혀
     어디까지 한 것인지 말해 주는 자리라는 뜻이 사라진다. */
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
.tools__t { font-size: 13px; font-weight: 700; color: var(--ink2); margin-right: 2px; }
/* 〈2026-10-25 · v2 §8.1 보조 단추〉 34px · 0 14px · 테두리 .14 · 모서리 10 · 700 13px · hover 연두 */
.tools__b { font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  min-height: 34px; padding: 0 14px; border-radius: var(--lp-r-md); border: 1px solid var(--lp-line-2);
  background: var(--surface); color: var(--ink); text-decoration: none;
  display: inline-flex; align-items: center; }
.tools__b:hover { background: var(--lp-brand-soft); }
.tools__b[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.tools__b--go { border: 0; background: var(--lime); color: var(--lp-brand-ink); font-weight: 700; }
.tools__b--go:hover { background: var(--lp-lime-hover); }

/* 한 칸 안에 접어 두는 속칸 — 발행 주체처럼 **한 번 정하면 잘 안 바뀌는 것**
   〈2026-08-28 · D-163〉. 늘 펴 두면 정작 할 일(요청문)이 아래로 밀린다. */
.fold { border-top: 1px solid var(--line); }
.fold__h { display: flex; align-items: center; gap: 10px; width: 100%;
  font-family: inherit; text-align: left; cursor: pointer;
  padding: 13px 2px; border: 0; background: none; color: var(--ink); }
.fold__h:hover { color: var(--ink2); }
.fold__t { font-size: 14.5px; font-weight: 700; }
.fold__v { font-size: 13px; color: var(--ink2); flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fold__m { font-size: 12.5px; font-weight: 700; color: var(--ink2); flex-shrink: 0; }
.fold__b { padding-bottom: 2px; }
.note { margin: 12px 0 0; padding: 12px 14px; border-radius: 12px;
  background: var(--warn-soft); color: var(--warn-ink); font-size: 13.5px; }
.note--bad { background: var(--bad-soft); color: var(--bad-ink); }
.note b { display: block; margin-bottom: 3px; }

/* ★ 「외부 분석 환경」 카드를 지우면서 그 카드에만 쓰던 규칙도 함께 지웠다 */

/* ══════════ 보고서 만들기 v2 — 견본 12장 뼈대 〈2026-10-25 사장님: 「디자인 레이아웃 반영해줘」 · 「견본 그대로」 · 「전체 레이아웃 재구성」〉
   머리(배너 | 제목·탭·검색) → 번역 단추 → 분류 3칸 → 문서 양식 → 2단(단계·진행 카드 | 사업 파악 · 기능 옵션).
   ★ 값은 tokens.css 이름만 쓴다 (v2 CSS 실측 §3·§8). 이름을 `.top`·`.steps`·`.side`·`.bot` 으로 짓지 않는다 — 앱이 얹을 때 감추는 이름이다. */
.rv2-top { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: stretch; margin: 0 0 16px; }
.rv2-top > .head { flex: 1 1 520px; margin: 0; border-radius: var(--lp-r-card); }
.rv2-top__r { flex: 0 1 380px; min-width: 280px; display: flex; flex-direction: column; gap: 10px; justify-content: space-between; }
.rv2-top__t { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
.rv2-top__t h2 { margin: 0; font: 700 28px/1.2 var(--lp-font); letter-spacing: -.02em; }
.rv2-top__t span { font-size: 15px; color: var(--lp-text-3); font-variant-numeric: tabular-nums; }
.rv2-top__r .tabs { margin: 0; }
.rv2-top__s { display: flex; gap: 8px; }
.rv2-search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border-radius: var(--lp-r-12);
  border: 1px solid var(--lp-line-2); background: var(--surface); color: var(--lp-text-3); }
.rv2-search input { flex: 1; min-width: 0; border: 0; background: transparent; font: 400 14px/1 var(--lp-font); color: var(--ink); }
.rv2-search input::placeholder { color: var(--lp-text-3); }
.rv2-search__go { flex: none; width: 42px; height: 42px; border: 0; border-radius: var(--lp-r-12); background: var(--lime); color: var(--lp-brand-ink);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.rv2-search__go:hover { background: var(--lp-lime-hover); }
.rv2-new { flex: none; height: 42px; padding: 0 16px; border: 0; border-radius: var(--lp-r-12); background: var(--lp-brand-ink); color: var(--lp-white);
  font: 700 15px/1 var(--lp-font); cursor: pointer; white-space: nowrap; }
.rv2-new:hover { background: var(--lp-ink-hover); }

.rv2-lang { position: relative; margin: 0 0 14px; }
.rv2-lang__b { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 20px; border: 0; border-radius: 99px;
  background: var(--lp-brand-ink); color: var(--lp-white); font: 500 13px/1 var(--lp-font); cursor: pointer; }
.rv2-lang__b b { font-size: 17px; font-weight: 700; }
.rv2-lang__b span, .rv2-lang__b i { color: var(--lp-on-dark-2); font-style: normal; }
.rv2-lang__m { position: absolute; z-index: 5; top: 50px; left: 0; display: flex; gap: 8px; padding: 10px; border-radius: var(--lp-r-16);
  background: var(--surface); box-shadow: var(--lp-shadow-pop); }

.rv2-cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0 0 16px; }
.rv2-cat { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 60px; padding: 0 12px;
  border-radius: var(--lp-r-16); border: 2px solid var(--lp-line-3); background: var(--surface); color: var(--lp-text-2);
  font: 700 17px/1.2 var(--lp-font); cursor: pointer; }
.rv2-cat svg { flex: none; color: var(--lp-text-3); }
.rv2-cat:hover { background: var(--lp-lime-wash); }
.rv2-cat[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: var(--lp-brand-ink); }
.rv2-cat[aria-pressed="true"] svg { color: var(--lp-brand-ink); }
.rv2-cat[aria-pressed="true"]:hover { background: var(--lp-lime-hover); }

.rv2-card { background: var(--surface); border-radius: var(--lp-r-card); padding: 22px clamp(16px, 3vw, 28px); margin: 0 0 16px; }
.rv2-kicker { margin: 0; font: 700 14px/1.4 var(--lp-font); letter-spacing: .38em; color: var(--lp-brand-deep); }
.rv2-docs__h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin: 0 0 16px; }
.rv2-docs__d { margin: 0; font-size: 13px; color: var(--lp-text-3); }
.rv2-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.rv2-tile { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 14px; text-align: left;
  border-radius: var(--lp-r-lg); border: 1px solid var(--lp-line-2); background: var(--surface); color: var(--ink);
  font: inherit; cursor: pointer; min-height: 106px; }
.rv2-tile:hover { border-color: var(--lime); }
.rv2-tile[aria-pressed="true"] { border: 2px solid var(--lime); background: var(--lp-lime-wash); padding: 13px; }
.rv2-tile__ck { position: absolute; top: 14px; right: 14px; color: var(--lp-brand-deep); }
.rv2-tile__n { font: 700 16px/1.3 var(--lp-font); padding-right: 24px; }
.rv2-tile__d { font-size: 13px; line-height: 1.5; color: var(--lp-text-3); }
.rv2-tile__m { margin-top: auto; font-size: 13px; color: var(--lp-text-3); font-variant-numeric: tabular-nums; }
.rv2-tile[aria-pressed="true"] .rv2-tile__m { color: var(--lp-brand-deep); font-weight: 600; }
.rv2-kinds { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0 0; }
.rv2-kinds__t { font: 700 13px/1.4 var(--lp-font); color: var(--lp-text-2); margin-right: 2px; }

.rv2-chip { display: inline-flex; align-items: center; min-height: 34px; padding: 0 14px; border-radius: var(--lp-r-md);
  border: 1px solid var(--lp-line-2); background: var(--surface); color: var(--ink); font: 500 13.5px/1.2 var(--lp-font); cursor: pointer; }
.rv2-chip:hover { background: var(--lp-brand-soft); }
.rv2-chip[aria-pressed="true"] { background: var(--lp-brand-soft); border: 1.5px solid var(--lime); font-weight: 700; padding: 0 13.5px; }
.rv2-chip:disabled { cursor: not-allowed; color: var(--lp-text-3); }

/* 2단 — 왼쪽 단계·진행 카드 (§8.6 · §8.7) */
.rf-left { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; min-width: 0; }
.rf-left .rf-proc { position: static; }
.rf-proc__name { display: flex; flex-direction: column; }
.rf-proc__sub { font: 500 12px/1.35 var(--lp-font); color: var(--lp-brand-deep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rf-proc__dot { width: 10px; height: 10px; border-radius: 50%; background: var(--lp-orange); justify-self: end; }

.rv2-prog { background: var(--lp-brand-ink); color: var(--lp-white); border-radius: var(--lp-r-card); padding: 20px 16px;
  display: flex; flex-direction: column; gap: 16px; }
.rv2-prog__h { display: flex; gap: 12px; align-items: flex-start; }
.rv2-prog .rv2-prog__ic { flex: none; width: 48px; height: 48px; border-radius: var(--lp-r-12); background: var(--lp-on-dark-fill);
  display: inline-flex; align-items: center; justify-content: center; color: var(--lime); }
.rv2-prog__t { margin: 0; font: 700 17px/1.35 var(--lp-font); color: var(--lp-white); }
.rv2-prog__who { margin: 2px 0 0; font-size: 13px; line-height: 1.35; color: var(--lp-on-dark-3); overflow-wrap: anywhere; }
.rv2-prog__pct { display: flex; align-items: center; gap: 12px; }
.rv2-prog__num { font: 700 30px/1 var(--lp-font); font-variant-numeric: tabular-nums; color: var(--lp-white); letter-spacing: -.03em; }
.rv2-prog__num small { font-size: 15px; color: var(--lp-on-dark-3); margin-left: 1px; letter-spacing: 0; }
.rv2-meter { flex: 1; height: 5px; border-radius: 99px; background: var(--lp-on-dark-fill); overflow: hidden; }
.rv2-prog .rv2-meter > i { display: block; height: 100%; background: var(--lime); border-radius: 99px; transition: width .4s ease; }
.rv2-prog__next { border-radius: var(--lp-r-12); background: var(--lp-on-dark-fill); padding: 13px 14px; }
.rv2-prog__next span { display: block; font-size: 12.5px; color: var(--lp-on-dark-3); }
.rv2-prog__next b { display: block; margin-top: 4px; font-size: 15px; line-height: 1.45; color: var(--lp-white); }
.rv2-prog__tasks { margin: 0; padding: 0 0 14px; list-style: none; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--lp-on-dark-line); }
.rv2-prog__tt { font-size: 12.5px; color: var(--lp-on-dark-3); margin: 0 0 8px; }
.rv2-prog__task { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 14px; color: var(--lp-on-dark-2); }
.rv2-prog__task--wait { color: var(--lp-on-dark-3); }
.rv2-prog .rv2-prog__task svg { color: var(--lime); }
.rv2-prog__dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--lp-on-dark-3); display: inline-block; box-sizing: border-box; }
.rv2-prog .rv2-prog__dot--run { border-color: var(--lp-on-dark-fill); border-top-color: var(--lime); border-right-color: var(--lime); animation: rv2spin .8s linear infinite; }
@keyframes rv2spin { to { transform: rotate(360deg); } }
.rv2-ptabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 3px; border-radius: var(--lp-r-12); background: var(--lp-on-dark-fill); }
.rv2-ptab { min-height: 32px; border: 0; border-radius: var(--lp-r-md); background: transparent; color: var(--lp-on-dark-2); font: 600 13px/1 var(--lp-font); cursor: pointer; }
.rv2-ptab[aria-selected="true"] { background: var(--lp-white); color: var(--lp-brand-ink); font-weight: 700; }
.rv2-prog__foot { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 12px; }
.rv2-prog__chips { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; }
.rv2-prog__chip { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: var(--lp-r-8);
  background: var(--lp-on-dark-fill); color: var(--lp-on-dark-2); font-size: 12.5px; white-space: nowrap; }
.rv2-prog__big { margin-top: 8px; width: 100%; min-height: 38px; border-radius: var(--lp-r-md); border: 1px solid var(--lp-on-dark-line);
  background: transparent; color: var(--lp-white); font: 700 13.5px/1 var(--lp-font); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.rv2-prog__big:hover { background: var(--lp-on-dark-fill); }
.rv2-cover { width: 90px; height: 127px; border-radius: 4px; overflow: hidden; background: var(--lp-white); display: flex; flex-direction: column;
  box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.rv2-cover__top { flex: 0 0 62%; background: var(--lp-text-1); padding: 9px 8px; display: flex; flex-direction: column; gap: 5px; color: var(--lp-white); }
.rv2-cover__acc { width: 14px; height: 2px; background: var(--lime); }
.rv2-cover__k { font-size: 5.5px; letter-spacing: .06em; color: var(--lp-on-dark-2); text-transform: uppercase; }
.rv2-cover__n { font-size: 8.5px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; color: var(--lp-white); }
.rv2-cover__f { padding: 6px 8px; font-size: 5px; line-height: 1.3; color: var(--lp-text-1); font-weight: 700; text-transform: uppercase; overflow-wrap: anywhere; }
.rv2-pdesign { display: flex; flex-direction: column; gap: 4px; }
.rv2-pdesign .rv2-prog__tt { margin: 4px 0 2px; }
.rv2-dchip { display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: var(--lp-r-8); border: 1px solid var(--lp-on-dark-line);
  background: transparent; color: var(--lp-on-dark-2); font: 500 12.5px/1.2 var(--lp-font); cursor: pointer; text-align: left; }
.rv2-dchip:hover:not(:disabled) { background: var(--lp-on-dark-fill); }
.rv2-dchip[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: var(--lp-brand-ink); font-weight: 700; }
.rv2-dchip:disabled { cursor: not-allowed; }

/* 오른쪽 — 사업 파악 (§8.9) */
.rv2-ask__h { display: flex; align-items: center; gap: 12px; margin: 0 0 20px; }
.rv2-ask__no { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 6px;
  border-radius: var(--lp-r-8); background: var(--lp-brand-ink); color: var(--lp-white); font: 700 14px/1 var(--lp-font); }
.rv2-ask__name { font: 700 18px/1.3 var(--lp-font); }
.rv2-ask__cnt { margin-left: auto; font-size: 13px; color: var(--lp-text-3); font-variant-numeric: tabular-nums; }
.rv2-ask__q { margin: 0; font: 700 23px/1.35 var(--lp-font); letter-spacing: -.02em; }
.rv2-ask__d { margin: 8px 0 20px; font-size: 14px; color: var(--lp-text-3); }
.rv2-facts { margin: 0; padding: 0; list-style: none; }
.rv2-fact { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 53px;
  padding: 6px 0; border-bottom: 1px solid var(--lp-line-3); }
.rv2-fact__k { font: 700 14px/1.4 var(--lp-font); }
.rv2-fact__v { font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rv2-fact__v--empty { color: var(--lp-text-3); }
.rv2-tag { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: var(--lp-r-8);
  font: 700 12px/1 var(--lp-font); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.rv2-tag--doc { background: var(--lp-brand-soft); color: var(--lp-lime-strong); }
.rv2-tag--public { background: var(--lp-info-bg); color: var(--lp-info-text); }
.rv2-tag--need, .rv2-tag--split { background: var(--lp-warn-bg); color: var(--lp-warn-text); }
.rv2-tag--request, .rv2-tag--calc, .rv2-tag--manual, .rv2-tag--src { background: var(--lp-tag); color: var(--lp-text-2); }

.rv2-q { margin: 20px 0 0; padding: 16px; border-radius: var(--lp-r-16); background: var(--lp-ask-bg); border: 1px solid var(--lp-ask-line); }
.rv2-q__t { display: flex; align-items: center; gap: 10px; margin: 0; font: 700 15.5px/1.4 var(--lp-font); }
.rv2-q__t::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--lp-orange); flex: none; }
.rv2-q__why { margin: 6px 0 14px; font-size: 13.5px; line-height: 1.6; color: var(--lp-text-2); }
.rv2-q__opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 46px; margin: 0 0 8px; padding: 6px 12px 6px 8px;
  border-radius: var(--lp-r-12); border: 1px solid var(--lp-line-2); background: var(--surface); color: var(--ink);
  font: 500 14.5px/1.4 var(--lp-font); text-align: left; cursor: pointer; }
.rv2-q__opt:hover, .rv2-q__opt[aria-pressed="true"] { background: var(--lp-brand-soft); border-color: var(--lime); }
.rv2-q__opt[aria-pressed="true"] { font-weight: 700; }
.rv2-q__key { flex: none; width: 28px; height: 28px; border-radius: var(--lp-r-8); background: var(--lp-brand-ink); color: var(--lp-white);
  display: inline-flex; align-items: center; justify-content: center; font: 700 13px/1 var(--lp-font); }
.rv2-q__row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
.rv2-q__hint { font-size: 12.5px; color: var(--lp-text-3); }
.rv2-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; padding: 0 18px;
  border-radius: var(--lp-r-12); border: 1px solid var(--lp-line-2); background: var(--surface); color: var(--ink);
  font: 600 14px/1 var(--lp-font); cursor: pointer; text-decoration: none; }
.rv2-btn:hover:not(:disabled) { background: var(--lp-brand-soft); }
.rv2-btn:disabled { cursor: not-allowed; }
.rv2-btn--ink { border: 0; background: var(--lp-brand-ink); color: var(--lp-white); font-weight: 700; }
.rv2-btn--ink:hover:not(:disabled) { background: var(--lp-ink-hover); }
.rv2-btn--sm { min-height: 34px; padding: 0 14px; font-size: 13px; font-weight: 700; border-radius: var(--lp-r-md); }
.rv2-btn--lg { min-height: 44px; }
.rv2-btn--wide { width: 100%; min-height: 42px; font-size: 14.5px; }
.rv2-key { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: var(--lp-r-sm); background: var(--lp-on-dark-fill);
  font: 600 11px/1 var(--lp-font); color: var(--lp-on-dark-2); }
.rv2-nav { display: flex; gap: 10px; margin: 18px 0 0; padding-bottom: 20px; border-bottom: 1px solid var(--lp-line-3); }
.rv2-say { display: flex; gap: 10px; align-items: center; margin: 20px 0 0; padding: 4px 4px 4px 16px; border-radius: var(--lp-r-16); background: var(--lp-fill-1); }
.rv2-say input { flex: 1; min-width: 0; border: 0; background: transparent; font: 400 15px/1.5 var(--lp-font); color: var(--ink); padding: 10px 0; }
.rv2-say button { flex: none; width: 38px; height: 38px; border: 0; border-radius: var(--lp-r-md); background: var(--lp-brand-ink); color: var(--lp-white);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }

/* 기능 옵션 (§8.11 · 견본 395·399) */
.rv2-opts__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 26px 28px; margin-top: 18px; }
.rv2-opt { border-top: 2px solid var(--lp-brand-ink); padding-top: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.rv2-opt__t { margin: 0; font: 700 14px/1.4 var(--lp-font); letter-spacing: .14em; color: var(--lp-brand-deep); }
.rv2-opt__row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rv2-opt__lbl { margin: 0; font-size: 13px; color: var(--lp-text-3); }
.rv2-issuer { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; }
.rv2-logo { width: 64px; height: 64px; border-radius: var(--lp-r-12); border: 1.5px dashed var(--lp-line-2); background: var(--lp-fill-1);
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; line-height: 1.35; color: var(--lp-text-2); }
.rv2-issuer__n { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-width: 0; }
.rv2-issuer__n b { font-size: 16px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv2-issuer__d { margin: 4px 0 0; font-size: 13px; line-height: 1.55; color: var(--lp-text-3); }
.rv2-logo u { font-size: 10px; line-height: 1.2; }
.rv2-link { flex: none; border: 0; background: none; padding: 0; font: 700 14px/1.4 var(--lp-font); color: var(--lp-brand-deep); cursor: pointer; }
.rv2-files { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.rv2-files li { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv2-files:empty { display: none; }
.rv2-drop { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; border-radius: var(--lp-r-12);
  border: 1.5px dashed var(--lime); background: var(--lp-lime-wash); color: var(--ink); font: 700 14.5px/1 var(--lp-font); cursor: pointer; }
.rv2-tg { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 15px; min-height: 30px; }
.rv2-tg i { flex: none; width: 38px; height: 22px; border-radius: 99px; padding: 2px; background: var(--lp-line-2); display: inline-flex; justify-content: flex-start; box-sizing: content-box; }
.rv2-tg i::after { content: ''; width: 18px; height: 18px; border-radius: 50%; background: var(--lp-white); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.rv2-tg[aria-checked="true"] i { background: var(--lime); justify-content: flex-end; }
.rv2-picks { border: 1px solid var(--lp-line-2); border-radius: var(--lp-r-16); overflow: hidden; }

<script>

  var bad = [];

  if (!bad.length) return;

  /* ★★★ **한 번은 화면이 스스로 고친다** 〈2026-08-27 · D-149〉.
   *
   *   앞 판은 빨간 띠로 「새로고침해 주십시오」라고만 했다. 그 말은 맞지만

   *     캐시를 안 쓴다. 화면이 새로 오면 스크립트와 판이 맞는다.

   *   ★ 표는 다음 새로고침에서 사라지도록 `replace` 로 바꾼다 (뒤로가기에 안 쌓인다). */

    if (!sessionStorage.getItem(KEY)) {

   *   그런데 사장님 화면은 반대였다 — 화면 479c745f(옛), 스크립트 64478fa1(새).

  /** 절을 펴고 그 자리로 간다 — 왼쪽 단계 목록이 쓴다 */

  /* ══ 출력 조건 — 상태는 «하나»다 〈2026-10-25 사장님: [출력디자인]〉

  function v2Out() {

  /** 서버에 보낼 사양 — 문서 종류는 «고친 것 → 서버 사양 → 화면 기본» 차례. 쪽수·언어만 바꿀 때 사양의 문서 종류를 덮지 않는다 */

  /* ★★ 저장은 «한 줄로» 〈2026-10-25 · Codex P2 #571〉 — 앞 판은 바꿀 때마다 요청을 따로 보내, 늦게 온 옛 대답이
   *   facts.spec 을 덮고 고친 것(draft)을 지워 화면이 옛 쪽수로 돌아갔다. 이제 하나가 도는 동안 온 고침은 모아 두었다가
   *   그 대답 뒤에 한 번 더 보낸다. 고친 것은 «보낸 그대로일 때만» 지운다 — 그 사이 새 고침이 있으면 남긴다. */

  function v2StepList() {

  /** 끝난 칸 밑의 한 줄 (견본 396 의 «자료 올리기 · 파일 3개») — 디자인 파일의 문구 틀에 잰 값만 넣는다 */
  function v2StepSub(no) {
    var files = facts.files ? facts.files.length : (facts.sources ? facts.sources.total : null);
    if (no === 1) return files === null ? null : '자료 올리기 · 파일 ' + files + '개';
    if (no === 5) return facts.fields ? '빈칸 ' + facts.fields.filled + '/' + facts.fields.total + ' 채움' : null;
    if (no === 6) { var o = v2Out(); var dt = F.v2DsType(o.ds); return [dt && dt.name, v2LangName(o.lang)].filter(Boolean).join(' · ') || null; }

  /** 세부 작업 — 디자인 파일의 단계별 문구 그대로, 상태는 잰 사실에서 */
  function v2Tasks(stepNo) {
    var t = [];
    function put(text, st) { t.push({ text: text, st: st }); }
    var files = facts.files ? facts.files.length : (facts.sources ? facts.sources.total : null);
    if (stepNo === 1) {
      put('시작 방법 고르기', progress && progress.ask && progress.ask.done ? 'done' : 'run');
      put('자료 ' + (files === null ? 0 : files) + '건 받음', files ? 'done' : 'wait');
    } else if (stepNo === 2) {
      var s = facts.sources;
      put('올린 자료 ' + (files === null ? 0 : files) + '건 읽기', s && s.total > 0 && s.read >= s.total ? 'done' : (s ? 'run' : 'wait'));
      var pub = null;
      if (facts.values) Object.keys(facts.values).some(function (k) {
        var f = facts.values[k]; if (f && f.origin === 'public' && f.source) { pub = String(f.source).split(',')[0]; return true; } return false;
      });
      put(pub ? '공공자료 조회 · ' + pub : '공공자료 조회', pub ? 'done' : 'wait');
      var cf = F.v2Conflicts(facts.values, facts.def);

  /* ── 사업 파악 (견본 397·398) ── */

    inp.setAttribute('aria-label', '직접 입력하거나 질문해 주세요');
    var send = document.createElement('button');
    send.type = 'submit'; send.setAttribute('aria-label', '보내기');

      var v = String(inp.value || '').trim();

        : '지금 여쭐 것이 없습니다 — 글로 받은 답을 엔진에 넣는 칸은 준비 중입니다. 값을 직접 고치려면 왼쪽 «5 빈칸 채우기»로 갑니다.');
    });
    box.appendChild(form);
    return box;
  }

  function v2Pick(n) {
    var cf = F.v2Conflicts(facts.values, facts.def);
    var q = cf[v2.ask];
    if (!q) return;
    v2.ans[q.key] = n;
    v2Repaint();
  }
  function v2Next() {
    var cf = F.v2Conflicts(facts.values, facts.def);
    if (v2.ask < cf.length - 1) { v2.ask += 1; v2Repaint(); }
  }
  /* 숫자 키 1~3 · Enter — 되묻기 카드가 있을 때만. 입력칸·단추에 손이 있으면 건드리지 않는다 */
  document.addEventListener('keydown', function (ev) {
    var t = ev.target || {};
    var tag = String(t.tagName || '').toUpperCase();
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable) return;
    if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
    if (!view.querySelector('[data-lp-rv2-conflict]')) return;
    if (/^[1-3]$/.test(ev.key)) { ev.preventDefault(); v2Pick(Number(ev.key)); return; }
    if (ev.key === 'Enter' && tag !== 'BUTTON' && tag !== 'A') { ev.preventDefault(); v2Next(); }
  });

  /**

      return;
    }
    if (!d.getElementById('lp-flow-embed')) {

    /**
     * ★★★ **`scrollHeight` 로 재면 틀이 줄지 않는다** 〈2026-09-01 · 실측 · M-72〉.
     *
     *   사장님 신고: 「스크롤 하면 작동이 잘 안 됨」. 재 보니 안쪽 내용이
     *   1200px → 200px 로 줄었는데 `scrollHeight` 는 **1200 을 그대로 돌려줬다.**

     *   **화면 높이 아래로 내려가지 않기 때문**이다. 그래서 —
     *
     *     틀은 커지기만 하고 **한 번 커지면 안 줄어든다.**
     *     긴 단계에서 짧은 단계로 옮기면 **빈 칸이 그만큼 남고**,
     *     사장님은 그 빈 칸을 스크롤하시게 된다.
     *
     *   ★★ **똑같은 고장을 `embed-bridge.js` 가 2026-08-23 에 이미 고쳤다**
     *     (거기서는 여백이 붙어 영원히 자라는 쪽으로 났다). 그런데 고침이
     *     **그 파일에만** 들어가고 여기는 옛 방식으로 남았다 — M-69·M-70 과
     *     같은 병이다: 장치는 있는데 **한 자리에만 있다.**
     *
     *   ★ 고치는 법도 그때와 같다. `height:auto` 인 문서 뿌리의 테두리 상자는
     *     **내용만큼**이고 화면 높이에 눌리지 않는다. 바로 위에서 `EMBED_CSS`
     *     (`html,body{height:auto!important}`)를 넣어 두었으므로 조건이 맞다.
     *   ★ 못 재는 브라우저에서는 옛 방식으로 물러선다 — 줄지 않을 뿐, 잘리지는 않는다.

    if (!h) return;

    /* ★★ **같으면 안 쓴다** 〈2026-08-21 · 모바일이 느린 진짜 이유〉.
     *   앞 판은 잴 때마다 `style.height` 를 **무조건** 썼다. 그런데 높이를 쓰면
     *   ⓐ 바깥이 다시 배치되고 → ⓑ 안쪽 화면의 폭·높이가 바뀌고 → ⓒ 안쪽이
     *   다시 그려지면서 클래스·style 이 움직이고 → ⓓ 감시자가 그걸 잡아 **또
     *   재고 또 쓴다.** 값이 그대로여도 고리가 돈다.
     *
     *   데스크톱에서는 한 바퀴가 순식간이라 눈에 안 띈다. 휴대폰에서는 그 한
     *   바퀴가 비싸서 **화면이 뒤늦게 덜컥덜컥 자리를 잡는다** — 그것이
     *   「느리게 뜬다」로 보인다.
     *
     *   ★ 한 글자짜리 조건이 고리를 끊는다. 안 바뀌었으면 아무것도 안 한다. */
    if (h === fr._lpH) return;

    fr.style.height = h + 'px';
