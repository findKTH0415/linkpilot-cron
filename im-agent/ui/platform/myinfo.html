<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내정보 · LINKPILOT</title>
<!--
  내정보 — 유료 멤버십 화면 (모바일).

  실제 LinkPilot 앱 화면을 보고 맞춘 것이다: 라임 그린 포인트, 라운드 카드,
  하단 탭 6개. 유료 기능 목록도 앱의 '유료 멤버십' 섹션과 같은 5개를 쓴다.

  ★ 색·플랜·기능은 전부 아래 CONFIG 와 CSS 변수 한 곳에 모아 두었다.
    실제 브랜드 색이 다르면 --lp-lime 하나만 고치면 전부 따라온다.

  ★ 카드정보를 이 화면에서 받지 않는다. billingUrl 의 결제 페이지로 보낸다.
    직접 받으면 PCI 범위에 들어간다.

  ★ 멤버십 정보가 없으면 '무료'로 단정하지 않고 '확인 필요'로 표시한다.
    유료 회원인데 화면이 무료로 보이면 문의가 들어온다.
-->
<style>
:root {
  --lp-lime: #9ED700;          /* 브랜드 포인트 — 실제 값이 다르면 여기만 고친다 */
  --lp-lime-soft: #F2FADF;
  --lp-ink: #17181A;
  --lp-ink2: #8A9099;
  --lp-line: #E8EAEC;
  --lp-card: #F4F5F6;
  --lp-bg: #FFFFFF;
  --lp-bad: #E03131;
  --lp-warn: #E8A33D;
  --lp-radius: 16px;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font: 400 15px/1.55 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
        'Malgun Gothic', '맑은 고딕', Arial, sans-serif;
  color: var(--lp-ink);
  background: var(--lp-bg);
  padding-bottom: 88px;            /* 하단 탭 높이 */
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }

/* ── 헤더 ─────────────────────────────────────────── */
.hd {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px; border-bottom: 1px solid var(--lp-line);
  position: sticky; top: 0; background: var(--lp-bg); z-index: 10;
}
.hd__back {
  font-size: 22px; line-height: 1; background: none; border: 0;
  color: var(--lp-ink); cursor: pointer; padding: 4px 6px 4px 0;
}
.hd__title { font-size: 18px; font-weight: 700; }
.hd__brand { margin-left: auto; font-size: 13px; font-weight: 800; letter-spacing: .02em; }
.hd__brand em { font-style: normal; color: var(--lp-lime); }

.wrap { padding: 18px; max-width: 640px; margin: 0 auto; }
.sec { margin-bottom: 26px; }
.sec__title {
  font-size: 13px; font-weight: 700; color: var(--lp-ink2);
  margin-bottom: 10px; letter-spacing: .02em;
}

/* ── 카드 ─────────────────────────────────────────── */
.card { background: var(--lp-card); border-radius: var(--lp-radius); padding: 18px; }

.me { display: flex; align-items: center; gap: 14px; }
.me__avatar {
  width: 52px; height: 52px; border-radius: 50%; flex: none;
  background: var(--lp-lime); color: #17181A;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800;
}
.me__name { font-size: 17px; font-weight: 700; }
.me__sub { font-size: 13px; color: var(--lp-ink2); margin-top: 2px; }

/* ── 멤버십 현황 ──────────────────────────────────── */
.plan-now {
  background: var(--lp-ink); color: #fff; border-radius: var(--lp-radius);
  padding: 20px;
}
.plan-now--none { background: var(--lp-card); color: var(--lp-ink); }
.plan-now__row { display: flex; align-items: center; gap: 10px; }
.plan-now__name { font-size: 22px; font-weight: 800; }
.plan-now__badge {
  font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px;
  background: var(--lp-lime); color: #17181A;
}
.plan-now__badge--bad { background: var(--lp-bad); color: #fff; }
.plan-now__badge--warn { background: var(--lp-warn); color: #17181A; }
.plan-now__meta { font-size: 13px; opacity: .8; margin-top: 8px; }

.usage { margin-top: 16px; display: grid; gap: 12px; }
.usage__row { font-size: 13px; }
.usage__head { display: flex; justify-content: space-between; margin-bottom: 5px; }
.usage__bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.22); overflow: hidden; }
.plan-now--none .usage__bar { background: #E2E5E8; }
.usage__fill { height: 100%; background: var(--lp-lime); }
.usage__fill--over { background: var(--lp-bad); }

.notice {
  margin-top: 14px; padding: 12px 14px; border-radius: 12px;
  background: var(--lp-lime-soft); color: var(--lp-ink); font-size: 13px;
}
.notice--bad { background: #FDECEC; color: #8F1D1D; }

/* ── 유료 기능 ────────────────────────────────────── */
.feat { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.feat__item {
  background: var(--lp-card); border-radius: var(--lp-radius);
  padding: 16px 14px; text-align: center; border: 2px solid transparent;
}
.feat__item.on { border-color: var(--lp-lime); background: var(--lp-lime-soft); }
.feat__icon { font-size: 20px; line-height: 1; }
.feat__name { font-size: 13px; font-weight: 600; margin-top: 8px; }
.feat__lock { font-size: 11px; color: var(--lp-ink2); margin-top: 4px; }
.feat__item.on .feat__lock { color: #5C7A00; font-weight: 700; }

/* ── 플랜 ─────────────────────────────────────────── */
.plans { display: grid; gap: 12px; }
.plan {
  position: relative; background: var(--lp-bg);
  border: 1.5px solid var(--lp-line); border-radius: var(--lp-radius); padding: 20px 18px;
}
.plan--rec { border-color: var(--lp-lime); border-width: 2px; }
.plan--cur { background: var(--lp-card); }
.plan__tag {
  position: absolute; top: -10px; left: 16px;
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
  background: var(--lp-lime); color: #17181A;
}
.plan__tag--cur { background: var(--lp-ink2); color: #fff; }
.plan__name { font-size: 17px; font-weight: 800; }
.plan__price { font-size: 24px; font-weight: 800; margin-top: 6px; }
.plan__price small { font-size: 13px; font-weight: 400; color: var(--lp-ink2); }
.plan__list { margin-top: 12px; font-size: 13px; color: var(--lp-ink2); }
.plan__list li { padding: 4px 0 4px 16px; position: relative; }
.plan__list li::before {
  content: ''; position: absolute; left: 2px; top: 12px;
  width: 5px; height: 5px; border-radius: 50%; background: var(--lp-lime);
}
.btn {
  display: block; width: 100%; margin-top: 16px; padding: 13px;
  font: 700 14px/1 inherit; border: 0; border-radius: 12px;
  background: var(--lp-lime); color: #17181A; cursor: pointer; text-align: center;
}
.btn--ghost { background: var(--lp-card); color: var(--lp-ink2); cursor: default; }
.note { font-size: 12px; color: var(--lp-ink2); margin-top: 12px; }

/* ── 하단 탭 (실제 앱과 같은 6개) ──────────────────── */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(6, 1fr);
  background: var(--lp-bg); border-top: 1px solid var(--lp-line);
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
}
.tabs__i { text-align: center; font-size: 10px; color: var(--lp-ink2); text-decoration: none; }
.tabs__i span { display: block; font-size: 17px; line-height: 1.3; }
.tabs__i.on { color: var(--lp-lime); font-weight: 700; }
</style>
</head>
<body>

<header class="hd">
  <button class="hd__back" type="button" aria-label="뒤로">‹</button>
  <h1 class="hd__title">내정보</h1>
  <div class="hd__brand">LINK<em>PILOT</em></div>
</header>

<div class="wrap" id="app"></div>

<nav class="tabs">
  <a class="tabs__i" href="#"><span>⌂</span>대시보드</a>
  <a class="tabs__i" href="#"><span>✓</span>할일</a>
  <a class="tabs__i" href="#"><span>📞</span>통화분석</a>
  <a class="tabs__i" href="#"><span>🗂</span>프로젝트</a>
  <a class="tabs__i" href="#"><span>👥</span>연락처</a>
  <a class="tabs__i on" href="#"><span>☰</span>더보기</a>
</nav>

<script>
/* ── 설정 ──────────────────────────────────────────────────────────
 * 서버가 로그인 세션을 보고 이 값을 내려주는 것이 정석이다.
 * 파일에 박아두면 사람이 바뀔 때마다 고쳐야 하고, 브라우저에서 값을 바꿔
 * 유료 기능을 흉내 낼 수도 있다. 권한 검사는 반드시 서버에서 한 번 더 한다.
 * ───────────────────────────────────────────────────────────────── */
window.LINKPILOT_ME = {
  me: { name: '홍길동', email: 'user@example.com', org: 'PDI GID', role: 'CEO' },

  // null 이면 '확인 필요'로 표시된다 — 무료로 단정하지 않는다
  membership: {
    planId: 'pro',
    status: 'active',            // active | trial | expired
    until: '2026-09-10',
    usage: [
      { name: '프로젝트', used: 54, limit: 100 },
      { name: 'IM 생성', used: 3, limit: 10 },
      { name: '통화 분석', used: 128, limit: null },   // null = 무제한
    ],
  },

  // 앱 '유료 멤버십' 섹션의 기능들. 어느 플랜부터 열리는지 적는다
  features: [
    { icon: '☆', name: '오늘의 한줄생각', from: 'basic' },
    { icon: '☀', name: '아침브리핑', from: 'basic' },
    { icon: '📞', name: '통화음성분석', from: 'pro' },
    { icon: '★', name: '프리미엄 투자소스 DB', from: 'pro' },
    { icon: '🔆', name: '신재생에너지 분석', from: 'business' },
  ],

  // 가격을 비워두면 '문의'로 표시된다 — 지어내지 않는다
  plans: [
    { id: 'basic', name: 'Basic', price: null,
      features: ['오늘의 한줄생각', '아침브리핑', '프로젝트 30건'] },
    { id: 'pro', name: 'Pro', price: null, recommended: true,
      features: ['Basic 전체', '통화음성분석', '프리미엄 투자소스 DB', '프로젝트 100건'] },
    { id: 'business', name: 'Business', price: null,
      features: ['Pro 전체', '신재생에너지 분석', 'IM 자동생성', '프로젝트 무제한'] },
  ],

  billingUrl: null,   // 예: 'https://pay.example.com/checkout'
};

(function () {
  'use strict';
  var C = window.LINKPILOT_ME;
  var RANK = { basic: 1, pro: 2, business: 3 };

  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (x !== undefined && x !== null && x !== '') n.textContent = String(x);
    return n;
  }
  function add(p) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) p.appendChild(arguments[i]); return p; }

  /** KST 기준 오늘 */
  function today() {
    return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Seoul' }).format(new Date());
  }
  /** 날짜 문자열끼리 비교 — 시간대 영향 없음 */
  function dday(s) {
    if (!s || !/^\d{4}-\d{2}-\d{2}/.test(s)) return null;
    var t = today();
    var a = Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10));
    var b = Date.UTC(+t.slice(0,4), +t.slice(5,7)-1, +t.slice(8,10));
    return Math.round((a - b) / 86400000);
  }
  function price(p) {
    if (p === null || p === undefined || p === '') return '문의';
    return typeof p === 'number' ? p.toLocaleString('ko-KR') + '원' : String(p);
  }

  var m = C.membership;
  var plan = m && (C.plans.find(function (p) { return p.id === m.planId; }) || null);
  var left = m && m.until ? dday(m.until) : null;
  var status = m ? (m.status || (left !== null && left < 0 ? 'expired' : 'active')) : null;
  var app = document.getElementById('app');

  // ── 계정 ───────────────────────────────────────────
  var s1 = el('section', 'sec');
  s1.appendChild(el('h2', 'sec__title', '계정'));
  var box = el('div', 'card');
  var me = el('div', 'me');
  var av = el('div', 'me__avatar', (C.me.name || '?').slice(0, 1));
  var info = el('div');
  add(info, el('div', 'me__name', C.me.name || '이름 미설정'),
    el('div', 'me__sub', [C.me.org, C.me.role].filter(Boolean).join(' · ')),
    el('div', 'me__sub', C.me.email || ''));
  add(me, av, info);
  box.appendChild(me);
  s1.appendChild(box);
  app.appendChild(s1);

  // ── 멤버십 현황 ────────────────────────────────────
  var s2 = el('section', 'sec');
  s2.appendChild(el('h2', 'sec__title', '멤버십'));
  var pn = el('div', 'plan-now' + (m ? '' : ' plan-now--none'));

  if (!m) {
    // ★ 무료로 단정하지 않는다
    pn.appendChild(el('div', 'plan-now__name', '확인 필요'));
    pn.appendChild(el('div', 'plan-now__meta', '멤버십 정보를 불러오지 못했습니다. 서버 연동을 확인하세요.'));
  } else {
    var row = el('div', 'plan-now__row');
    row.appendChild(el('div', 'plan-now__name', (plan && plan.name) || m.planId || '알 수 없음'));
    row.appendChild(el('span', 'plan-now__badge'
      + (status === 'expired' ? ' plan-now__badge--bad' : status === 'trial' ? ' plan-now__badge--warn' : ''),
      status === 'expired' ? '만료됨' : status === 'trial' ? '체험 중' : '이용 중'));
    pn.appendChild(row);

    if (m.until) {
      pn.appendChild(el('div', 'plan-now__meta',
        (status === 'expired' ? '만료일 ' : '다음 결제일 ') + m.until
        + (left !== null ? '  ·  ' + (left === 0 ? '오늘' : left > 0 ? left + '일 남음' : (-left) + '일 지남') : '')));
    }

    if (m.usage && m.usage.length) {
      var u = el('div', 'usage');
      m.usage.forEach(function (x) {
        var r = el('div', 'usage__row');
        var h = el('div', 'usage__head');
        h.appendChild(el('span', null, x.name));
        h.appendChild(el('span', null, x.limit === null || x.limit === undefined
          ? x.used + ' · 무제한' : x.used + ' / ' + x.limit));
        r.appendChild(h);
        if (x.limit) {
          var pct = Math.min(100, Math.round(x.used / x.limit * 100));
          var bar = el('div', 'usage__bar');
          var fill = el('div', 'usage__fill' + (x.used > x.limit ? ' usage__fill--over' : ''));
          fill.style.width = pct + '%';
          bar.appendChild(fill);
          r.appendChild(bar);
        }
        u.appendChild(r);
      });
      pn.appendChild(u);
    }
  }
  s2.appendChild(pn);

  // 만료·임박은 눈에 띄게 — 만료되면 유료 기능이 막힌다
  if (status === 'expired') {
    s2.appendChild(el('p', 'notice notice--bad', '멤버십이 만료되었습니다. 갱신 전까지 유료 기능을 쓸 수 없습니다.'));
  } else if (left !== null && left >= 0 && left <= 14) {
    s2.appendChild(el('p', 'notice', '결제일이 ' + left + '일 남았습니다.'));
  }
  app.appendChild(s2);

  // ── 유료 기능 ──────────────────────────────────────
  var s3 = el('section', 'sec');
  s3.appendChild(el('h2', 'sec__title', '유료 기능'));
  var grid = el('div', 'feat');
  var myRank = m && status !== 'expired' ? (RANK[m.planId] || 0) : 0;

  C.features.forEach(function (f) {
    var on = myRank >= (RANK[f.from] || 99);
    var item = el('div', 'feat__item' + (on ? ' on' : ''));
    add(item, el('div', 'feat__icon', on ? f.icon : '🔒'),
      el('div', 'feat__name', f.name),
      el('div', 'feat__lock', on ? '사용 중'
        : (C.plans.find(function (p) { return p.id === f.from; }) || {}).name + ' 부터'));
    grid.appendChild(item);
  });
  s3.appendChild(grid);
  app.appendChild(s3);

  // ── 플랜 ───────────────────────────────────────────
  var s4 = el('section', 'sec');
  s4.appendChild(el('h2', 'sec__title', '플랜 변경'));
  var list = el('div', 'plans');

  C.plans.forEach(function (p) {
    var cur = m && p.id === m.planId && status !== 'expired';
    var c = el('article', 'plan' + (p.recommended && !cur ? ' plan--rec' : '') + (cur ? ' plan--cur' : ''));
    if (cur) c.appendChild(el('span', 'plan__tag plan__tag--cur', '현재 플랜'));
    else if (p.recommended) c.appendChild(el('span', 'plan__tag', '추천'));

    c.appendChild(el('h3', 'plan__name', p.name));
    var pr = el('div', 'plan__price', price(p.price));
    if (p.price !== null && p.price !== undefined && p.price !== '') pr.appendChild(el('small', null, ' / 월'));
    c.appendChild(pr);

    var ul = el('ul', 'plan__list');
    (p.features || []).forEach(function (f) { ul.appendChild(el('li', null, f)); });
    c.appendChild(ul);

    var b = el('button', 'btn' + (cur ? ' btn--ghost' : ''), cur ? '이용 중' : '이 플랜 선택');
    b.type = 'button';
    b.disabled = cur;
    b.addEventListener('click', function () { go(p); });
    c.appendChild(b);
    list.appendChild(c);
  });
  s4.appendChild(list);
  s4.appendChild(el('p', 'note',
    '가격·구성은 서버 설정에서 내려옵니다. 결제는 결제 페이지에서 진행되며 이 화면에서는 카드정보를 받지 않습니다.'));
  app.appendChild(s4);

  /** ★ 카드정보를 받지 않는다. 결제대행사 페이지로 보낸다 */
  function go(p) {
    if (C.billingUrl) {
      var sep = C.billingUrl.indexOf('?') > -1 ? '&' : '?';
      window.open(C.billingUrl + sep + 'plan=' + encodeURIComponent(p.id), '_blank', 'noopener');
      return;
    }
    var old = document.getElementById('lp-pay-note');
    if (old) old.remove();
    var n = el('p', 'notice', p.name + ' 선택됨 — 결제 연동이 아직 없습니다. '
      + 'LINKPILOT_ME.billingUrl 에 결제 페이지 주소를 넣으면 이 버튼이 그리로 연결됩니다.');
    n.id = 'lp-pay-note';
    s4.appendChild(n);
    n.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}());
</script>
</body>
</html>
