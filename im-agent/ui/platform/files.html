<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자료 업로드 · LINKPILOT</title>
<!--
  자료 업로드 — 보고서에 쓸 자료를 넣는 곳. 세 번째 탭 (2026-08-18).

  ★★ **탭 이름은 「자료 업로드」지만 하는 일은 셋이고, 그중 둘은 업로드가 아니다.**
    ① 올려서 보관    (Pro)  우리 서버에 둔다. 지우기·되살리기·대조가 있다
    ② 연결해서 쓰기  (무료) **사본을 안 만든다.** 읽을 때만 잠깐 가져와 버린다
    ③ 1회성으로 올리기(무료) 읽고 **바로 버린다.** 다시 못 쓴다
    ②를 업로드로 읽으면 사본이 우리 쪽에 남는 줄 안다 — 그 오해를 막으려고
    만든 것이 ② 다(D-65). 그래서 **화면이 셋의 차이를 먼저 말한다.**

  ★ 무엇이 붙어 있고 무엇이 아직인지는 **서버가 말한다.** 화면이 짐작하지 않는다.
    연결·1회성은 본체가 함수를 넘겨야 열리고, 안 넘어왔으면 서버가 501 과 함께
    **사람이 읽을 문장**을 준다 (플랫폼-연결-지시서 §2).

  ★★ **501 을 오류로 그리지 않는다.** 빨간 「서버 오류」로 뜨면 고장으로 읽혀
    문의가 온다. 「아직 안 붙었습니다」와 「무엇을 하면 열립니다」로 그린다 —
    닫혀 있는 것은 사실이고, 그 이유가 사용자 잘못이 아니기 때문이다.

  ★ 목록·한도·제공자는 **전부 서버 응답에서 온다.** 화면에 적어 두면
    한도가 바뀌는 날 화면만 옛말을 한다.

  붙이는 법은 window.LINKPILOT_FILES 만 채운다. 다른 곳에 값을 박지 않는다.
-->
<link rel="stylesheet" href="tokens.css">
<style>
/* 색·간격·반경 토큰은 tokens.css 하나가 정한다 (LinkPilot Design System v1.1) */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.55 var(--lp-font);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
.wrap { max-width: 900px; margin: 0 auto; padding: 22px 20px 60px; }
h1 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; margin-bottom: 14px; }

.card { background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 18px 20px; margin-bottom: 14px; }
.card__t { font-size: 16px; font-weight: 800; }
.card__d { font-size: 13px; color: var(--ink2); margin: 5px 0 0; line-height: 1.65; }

.pick { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pick label { font: 700 12px/1 inherit; color: var(--ink2); letter-spacing: .06em; text-transform: uppercase; }
select { font: 400 14px/1 inherit; padding: 9px 11px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 240px; }
select:focus-visible, button:focus-visible { outline: 2px solid var(--lime-deep); outline-offset: 2px; }

/* 세 갈래를 먼저 갈라 보여 준다 — 이름만 보고 다 같은 업로드로 읽지 않게 */
.ways { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin-bottom: 16px; }
.way { border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px; background: var(--surface); }
.way__t { font: 800 14px/1.4 inherit; }
.way__k { display: inline-block; font: 700 11px/1 inherit; border-radius: 999px;
  padding: 4px 8px; margin-left: 6px; vertical-align: middle; }
.way__k--free { background: var(--lime-soft); color: var(--lime-deep); }
.way__k--pro { background: var(--panel); color: var(--ink2); }
.way__d { font-size: 12.5px; color: var(--ink2); margin: 6px 0 0; line-height: 1.65; }
.way__d b { color: var(--ink); }

.grp { font: 700 11.5px/1 inherit; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink2); margin: 22px 0 9px; }

.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  margin-bottom: 8px; background: var(--surface); }
.row__b { flex: 1 1 220px; min-width: 0; }
.row__n { font: 700 14px/1.4 inherit; word-break: break-all; }
.row__m { font-size: 12px; color: var(--ink2); margin-top: 3px;
  font-variant-numeric: tabular-nums; word-break: break-all; }
.row--gone { background: var(--panel); border-style: dashed; }

.btn { font: 700 13px/1 inherit; padding: 10px 15px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn--go { background: var(--lime); border-color: var(--lime); color: var(--lp-brand-ink); }
.btn:disabled, .btn[aria-disabled="true"] { background: var(--panel); color: var(--ink2);
  border-color: var(--line); cursor: not-allowed; }

/* 아직 안 붙은 길 — 오류가 아니라 상태다 */
.wait { border: 1px solid #F0DEBE; background: var(--warn-soft); color: var(--warn-ink);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
.wait__t { font: 800 14px/1.45 inherit; margin-bottom: 5px; }
.wait__d { font-size: 13px; line-height: 1.7; }

.err { border: 1px solid #F3C6C6; background: var(--bad-soft); color: var(--bad-ink);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; font-size: 13.5px; line-height: 1.7; }
.empty { font-size: 13.5px; color: var(--ink2); padding: 6px 0; }
.note { font-size: 12.5px; color: var(--ink2); margin-top: 9px; line-height: 1.7; }
.note b { color: var(--ink); }

.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 22px 16px;
  text-align: center; background: var(--panel); cursor: pointer; }
.drop:focus-visible { outline: 2px solid var(--lime-deep); outline-offset: 2px; }
.drop__t { font: 700 14.5px/1.4 inherit; }
.drop__s { font-size: 12.5px; color: var(--ink2); margin-top: 6px; }
.drop input { display: none; }
.drop.over { border-color: var(--lime); background: var(--lime-soft); }

/* 갈래 고르기 — 세 장을 나란히 두고 **고를 수 있게** 한다 (전에는 설명만이었다) */
.pickway { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.pw { text-align: left; font: inherit; cursor: pointer; background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; }
.pw:hover:not(:disabled) { border-color: var(--lime); }
.pw.on { border-color: var(--lime); background: var(--lime-soft); box-shadow: inset 0 0 0 1px var(--lime); }
.pw:disabled { cursor: not-allowed; background: var(--panel); color: var(--ink2); }
.pw__t { font-weight: 800; font-size: 14.5px; }
.pw__d { font-size: 12.5px; color: var(--ink2); margin-top: 6px; line-height: 1.6; }

.up { margin-top: 12px; padding: 13px 15px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface); }
.up--done { border-color: var(--lime); background: var(--lime-soft); }
.up--error { border-color: var(--bad); background: var(--bad-soft); }
.up__h { display: flex; align-items: baseline; gap: 10px; }
.up__h b { font-size: 14.5px; }
.up__v { margin-left: auto; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.up__v--none { font-size: 13.5px; font-weight: 400; color: var(--ink2); }
.up__bar { height: 10px; border-radius: 999px; background: #E1E4E8; margin: 10px 0 8px; overflow: hidden; }
.up__bar i { display: block; height: 100%; background: var(--lime); border-radius: 999px; }
.up__bar--none { background: repeating-linear-gradient(135deg, #E1E4E8 0 5px, #F3F4F6 5px 10px); }
.up__d { margin: 0; font-size: 12.5px; color: var(--ink2); line-height: 1.65; }
.up--error .up__d { color: var(--bad-ink); }
.btn { padding: 12px 22px; font: 700 14px/1 inherit; border: 0; border-radius: 12px;
  background: var(--lime); color: var(--ink); cursor: pointer; margin-top: 12px; }
.btn:disabled { background: var(--panel); color: var(--ink2); cursor: not-allowed; }

/* 토큰이 안 실렸을 때의 경고는 토큰 없이도 보여야 한다 — 색을 직접 칠한다 */
.nostyle { border: 1px solid #F3C6C6; background: #FDECEC; color: #8F1D1D;
  border-radius: 12px; padding: 13px 15px; margin-bottom: 12px; font-size: 13.5px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap" id="view"></div>

<script src="gate-core.js"></script>
<script src="flow-core.js"></script>
<script src="upload-core.js"></script>
<script>
/**
 * 붙이는 쪽이 채우는 유일한 값.
 *   api      '/api/linkpilot'
 *   session  { name, planId, status }
 *   inTab    탭 안이면 true — 제목을 그리지 않는다 (탭 바가 이미 이름을 말한다)
 */
window.LINKPILOT_FILES = {
  api: null,
  session: null,
  projectId: null,
  inTab: false,
  preload: null,
  // 자료를 넣는 길은 **무료**다 — 유료면 Pro 를 살지 판단할 자료조차 못 넣는다
  requiredPlan: 'free',
  planNames: { free: 'Free', basic: 'Basic', pro: 'Pro', business: 'Business' },
};
</script>
<!-- 부모(앱)가 채운 설정을 받아 병합한다. 단독으로 열면 아무 일도 하지 않는다 -->
<script src="embed-bridge.js" data-lp-global="LINKPILOT_FILES"></script>
<script>
(function () {
  'use strict';
  var C = window.LINKPILOT_FILES;
  var F = window.LinkPilotFlow;
  var UP = window.LinkPilotUpload;
  var view = document.getElementById('view');

  var state = {
    projects: null,
    projectId: C.projectId || null,
    kept: null,        // 보관 목록 (GET /sources)
    linked: null,      // 연결 목록 (GET /linked)
    oneshot: null,     // 1회성 기록 (GET /oneshot)
    // 「아직 안 붙었다」를 길별로 따로 들고 있는다 — 하나가 닫혔다고 셋 다
    // 닫힌 것처럼 그리면 열려 있는 길까지 못 쓴다
    closed: { kept: null, linked: null, oneshot: null },
    error: null,
    // 서버가 「로그인이 필요합니다 / 플랜이 모자랍니다」라고 한 경우 — 오류와 구분한다
    gate: null,
    busy: false,
    // ── 첨부 (2026-08-20) ─────────────────────────────────────────────
    // 전에는 세 갈래가 **설명만**이었다. 무엇이 다른지는 알려 주는데 정작
    // 여기서 올릴 수는 없어서, 자료를 넣으려면 1단계로 되돌아가야 했다.
    way: 'kept',       // 'kept' | 'linked' | 'oneshot'
    picked: [],        // 고른 파일 — { name, size, data, error }
    upload: null,      // 올리는 중 상태 (upload-core 가 준 그대로)
    result: null,      // 서버 응답
    limits: null,      // GET /intake 가 준 한도 — 화면에 박아 두지 않는다
  };

  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (x !== undefined && x !== null && x !== '') n.textContent = String(x);
    return n;
  }
  function add(p) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) p.appendChild(arguments[i]); return p; }

  function size(b) {
    if (!(b > 0)) return '0 B';
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
    return (b / (1024 * 1024)).toFixed(1) + ' MB';
  }

  /**
   * ★★ **501 을 예외로 던지지 않는다.** 던지면 화면이 빨간 「서버 오류」를 그리는데,
   *   그건 고장이 아니라 **아직 안 붙은 상태**다. 상태와 고장을 같은 색으로
   *   칠하면 사용자는 고쳐 달라고 문의한다.
   * @returns {{ok:true, body}|{ok:false, closed:string}|throws}
   */
  function call(method, path, body) {
    var opt = { method: method, credentials: 'same-origin' };
    if (body) { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
    return fetch(C.api + path, opt).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) {
        if (r.status === 501) return { ok: false, closed: (b && b.error) || '아직 붙어 있지 않습니다' };
        // ★★ 401·403 도 **고장이 아니다.** 로그인하지 않았거나 등급이 모자란 것은
        //   상태이지 오류가 아닌데, 빨간 오류로 그리면 고장으로 읽혀 문의가 온다.
        //   (501 은 조심했는데 이건 놓쳤었다 — 2026-08-18)
        if (r.status === 401 || r.status === 403) {
          state.gate = (b && b.error) || '사용할 수 없습니다';
          return { ok: false, gated: true };
        }
        if (!r.ok) throw new Error((b && b.error) || ('서버 오류 (' + r.status + ')'));
        return { ok: true, body: b };
      });
    });
  }

  /* ── 불러오기 ─────────────────────────────────────────── */

  function loadProjects() {
    if (C.preload && C.preload.projects) { state.projects = C.preload.projects; return Promise.resolve(); }
    if (!C.api) { state.projects = []; return Promise.resolve(); }
    return call('GET', '/projects').then(function (r) {
      state.projects = (r.ok && r.body && r.body.projects) || [];
    }).catch(function (e) { state.error = e.message; state.projects = []; });
  }

  /** 세 갈래를 **각각** 부른다. 하나가 닫혀도 나머지는 그린다 */
  function loadOne(id) {
    if (!C.api || !id) return Promise.resolve();
    var base = '/projects/' + encodeURIComponent(id);
    var jobs = [
      call('GET', base + '/sources').then(function (r) {
        if (r.ok) { state.kept = r.body; state.closed.kept = null; }
        else { state.kept = null; state.closed.kept = r.closed; }
      }, function (e) { state.closed.kept = e.message; }),
      call('GET', base + '/linked').then(function (r) {
        if (r.ok) { state.linked = r.body; state.closed.linked = null; }
        else { state.linked = null; state.closed.linked = r.closed; }
      }, function (e) { state.closed.linked = e.message; }),
      call('GET', base + '/oneshot').then(function (r) {
        if (r.ok) { state.oneshot = r.body; state.closed.oneshot = null; }
        else { state.oneshot = null; state.closed.oneshot = r.closed; }
      }, function (e) { state.closed.oneshot = e.message; }),
    ];
    return Promise.all(jobs);
  }

  /**
   * 프로젝트를 고른다. **부모(앱)에게도 알린다.**
   *
   * ★★ 왜 알리나: 이 탭에는 앱이 얹는 것이 하나 더 있다 —
   *   「외부 분석 AGENT 로 만들기(기반정보 내보내기)」. 그쪽이 프로젝트를 따로
   *   고르게 하면 **같은 탭에 프로젝트 고르기가 둘**이 되고, 둘이 다른 것을
   *   가리키는 순간 사용자는 **어느 프로젝트의 기반정보를 받았는지 모른다.**
   *   그래서 고르는 곳은 여기 하나로 두고, 앱은 이 알림을 따라간다.
   *
   * ★ 같은 출처로만 보낸다. 다른 출처면 브라우저가 막고, 그건 정상이다.
   */
  function announce(id) {
    var detail = { projectId: id || null };
    // ① iframe 으로 얹혔을 때 — 부모 창에 보낸다 (같은 출처로만)
    try {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'lp-files-project', projectId: detail.projectId },
          window.location.origin);
      }
    } catch (_) { /* 막혀 있으면 그만 — 이 화면의 동작은 그대로다 */ }
    // ② iframe 없이 앱 안에 바로 얹혔을 때 — 부모가 곧 같은 문서다.
    //    창 너머로 보낼 것이 없으므로 **문서 이벤트**로 알린다. 두 방식 중
    //    어느 쪽으로 얹든 앱이 받는 이름은 하나다 — 둘로 갈리면 한쪽만 고쳐진다
    try {
      document.dispatchEvent(new CustomEvent('lp-files-project', { detail: detail }));
    } catch (_) { /* 오래된 브라우저 */ }
  }

  function pickProject(id) {
    state.projectId = id || null;
    state.kept = state.linked = state.oneshot = null;
    state.closed = { kept: null, linked: null, oneshot: null };
    announce(state.projectId);
    render();
    if (id) loadOne(id).then(render);
  }

  /* ── 그리기 ───────────────────────────────────────────── */

  /**
   * 세 갈래 — **설명이자 고르는 자리다.**
   *
   * ★ 이름만 보면 셋 다 「업로드」로 읽힌다. 무엇이 다른지를 **고르기 전에** 말한다.
   *   연결은 사본을 만들지 않고, 1회성은 읽고 버린다 — 올린 뒤에 알면 늦다.
   *
   * ★ 전에는 이 셋이 **설명만**이었다. 그래서 차이는 알려 주는데 정작 여기서
   *   올릴 수는 없었고, 자료를 넣으려면 1단계로 되돌아가야 했다. 지금은 고르면
   *   그 자리에서 붙인다.
   */
  var WAYS = [
    { id: 'kept', t: '올려서 보관', k: 'Pro', free: false, plan: 'pro',
      d: '우리 서버에 둡니다. 잘못 올리면 지우고 되살릴 수 있고, 원본이 그대로인지 대조합니다.' },
    { id: 'linked', t: '연결해서 쓰기', k: '무료', free: true, plan: 'free',
      d: 'Dropbox·Box·구글·원드라이브의 파일을 가리킵니다. 사본을 만들지 않습니다 — 읽을 때만 잠깐 가져와 버립니다.' },
    { id: 'oneshot', t: '1회성으로 올리기', k: '무료', free: true, plan: 'free',
      d: '읽고 바로 버립니다. 보관하지 않으므로 다시 쓸 수 없고, 원본이 그대로인지도 확인할 수 없습니다.' },
  ];

  function wayOf(id) {
    for (var i = 0; i < WAYS.length; i++) if (WAYS[i].id === id) return WAYS[i];
    return WAYS[0];
  }

  function ways() {
    var box = el('div', 'pickway');
    WAYS.forEach(function (w) {
      var b = el('button', 'pw' + (state.way === w.id ? ' on' : ''));
      b.type = 'button';
      var t = el('div', 'pw__t', w.t);
      t.appendChild(el('span', 'way__k way__k--' + (w.free ? 'free' : 'pro'), w.k));
      add(b, t, el('p', 'pw__d', w.d));
      b.addEventListener('click', function () {
        // 갈래를 바꾸면 고른 파일을 버린다 — 보관하려던 것이 1회성으로
        // 넘어가면 **되돌릴 수 없다.** 그 실수는 조용하고 되돌리기도 없다
        if (state.way !== w.id) { state.picked = []; state.upload = null; state.result = null; }
        state.way = w.id;
        render();
      });
      box.appendChild(b);
    });
    return box;
  }

  /** 고른 파일을 읽어 둔다. 읽기·보내기는 upload-core.js 한 곳에 있다 */
  function addFiles(list) {
    var max = (state.limits && state.limits.maxBytesPerFile) || 0;
    Array.prototype.forEach.call(list, function (f) {
      if (state.picked.some(function (x) { return x.name === f.name; })) return;
      var rec = { name: f.name, size: f.size, data: null, error: null,
        tooBig: UP.tooBig(f, max) };
      state.picked.push(rec);
      UP.readOne(f, function (err, data) {
        if (err) rec.error = err.message; else rec.data = data;
        render();
      });
    });
    render();
  }

  /** 파일을 고르는 자리. 끌어다 놓는 것도 받는다 */
  function dropZone() {
    var z = el('div', 'drop');
    z.tabIndex = 0;
    z.setAttribute('role', 'button');
    add(z, el('div', 'drop__t', '파일을 끌어다 놓거나 눌러서 고르세요'),
      el('div', 'drop__s', '여러 개를 한 번에 올릴 수 있습니다'));
    var inp = el('input');
    inp.type = 'file';
    inp.multiple = true;
    inp.addEventListener('change', function () { addFiles(inp.files); inp.value = ''; });
    z.appendChild(inp);
    z.addEventListener('click', function () { inp.click(); });
    z.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); inp.click(); }
    });
    z.addEventListener('dragover', function (ev) { ev.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', function () { z.classList.remove('over'); });
    z.addEventListener('drop', function (ev) {
      ev.preventDefault(); z.classList.remove('over');
      addFiles(ev.dataTransfer && ev.dataTransfer.files);
    });
    return z;
  }

  /** 고른 파일 목록. **못 올릴 것은 올리기 전에 그렇다고 적는다** */
  function pickedList() {
    var out = document.createDocumentFragment();
    state.picked.forEach(function (f, i) {
      var r = el('div', 'row');
      var left = el('div');
      left.appendChild(el('div', 'row__n', f.name));
      var why = f.error ? f.error
        : f.tooBig ? ('파일이 너무 큽니다 — ' + size(f.size) + ' (한도 ' + size(state.limits.maxBytesPerFile) + ')')
        : f.data ? size(f.size) : '읽는 중…';
      left.appendChild(el('div', 'row__m', why));
      r.appendChild(left);
      var x = el('button', 'btn2', '빼기');
      x.type = 'button';
      x.addEventListener('click', function () { state.picked.splice(i, 1); render(); });
      r.appendChild(x);
      out.appendChild(r);
    });
    return out;
  }

  /** 진행 바 한 칸. **모르는 값은 막대가 아니라 빗금이다** */
  function progressBar(pct) {
    var bar = el('div', 'up__bar' + (pct === null || pct === undefined ? ' up__bar--none' : ''));
    if (pct !== null && pct !== undefined) {
      var i = el('i');
      i.style.width = Math.max(0, Math.min(100, pct)) + '%';
      bar.appendChild(i);
    }
    return bar;
  }

  /** 올리는 중·끝난 뒤. **거절된 것을 숨기지 않는다** */
  function uploadCard() {
    var u = state.upload;
    if (!u) return null;
    var box = el('div', 'up' + (u.phase === 'done' ? ' up--done' : u.phase === 'error' ? ' up--error' : ''));
    var h = el('div', 'up__h');
    h.appendChild(el('b', null,
      u.phase === 'sending' ? '보내는 중'
        : u.phase === 'reading' ? '서버가 읽는 중'
        : u.phase === 'done' ? '올렸습니다' : '올리지 못했습니다'));
    h.appendChild(el('span', 'up__v' + (u.pct === null || u.pct === undefined ? ' up__v--none' : ''),
      (u.pct === null || u.pct === undefined) ? '진행률을 알 수 없습니다' : (u.pct + '%')));
    box.appendChild(h);
    if (u.phase === 'sending' || u.phase === 'reading') box.appendChild(progressBar(u.pct));

    if (u.phase === 'reading') {
      box.appendChild(el('p', 'up__d',
        '다 보냈습니다. 서버가 파일을 열어 읽는 중입니다 — 스캔본이면 더 걸립니다.'));
    } else if (u.phase === 'error') {
      box.appendChild(el('p', 'up__d', u.error));
    } else if (u.phase === 'done' && state.result) {
      box.appendChild(el('p', 'up__d', UP.summary(state.result)));
      // ★ 거절 사유를 접어 두지 않는다. 「올렸습니다」만 보면 다 올라간 줄 안다
      (state.result.rejected || []).forEach(function (r) {
        box.appendChild(el('p', 'up__d', '· ' + r.name + ' — ' + r.reason));
      });
      if (state.result.replaced && state.result.replaced.length) {
        box.appendChild(el('p', 'up__d',
          '같은 이름이 있어 이전 판은 휴지통으로 보냈습니다: ' + state.result.replaced.join(' · ')));
      }
    }
    return box;
  }

  /** 실제로 보낸다. 갈래마다 **주소가 다르다** */
  function doUpload() {
    var ready = state.picked.filter(function (f) { return f.data && !f.tooBig; });
    if (!ready.length || !state.projectId || state.busy) return;
    var path = state.way === 'oneshot' ? '/oneshot' : '/sources';

    state.busy = true; state.result = null; state.error = null;
    UP.send({
      url: C.api + '/projects/' + state.projectId + path,
      files: ready.map(function (f) { return { name: f.name, contentBase64: f.data }; }),
      onUpdate: function (u) { state.upload = u; render(); },
      onDone: function (j) {
        state.busy = false; state.result = j; state.picked = [];
        // 올린 뒤 목록을 다시 읽는다 — 안 읽으면 방금 올린 것이 안 보인다
        loadOne(state.projectId).then(render);
      },
      onFail: function (why, status) {
        state.busy = false;
        // 401·403 은 **오류가 아니라 게이트**다 (빨간 상자로 그리면 고장으로 읽힌다)
        if (status === 401 || status === 403) state.gate = why;
        render();
      },
    });
  }

  /**
   * 첨부 — **한 자리에서 고르고, 그 자리에서 올린다.**
   *
   * ★ 갈래마다 할 수 있는 것이 다르다. 연결은 여기서 올리는 것이 아니라
   *   **가리키는 것**이라 파일 고르기가 없다 — 본체가 함수를 넘겨야 열린다.
   */
  function attachCard() {
    var card = el('section', 'card');
    add(card, el('h2', 'card__t', '자료 붙이기'),
      el('p', 'card__d', '어떻게 둘지 먼저 고릅니다. 셋은 되돌릴 수 있는 정도가 다릅니다.'));
    card.appendChild(ways());

    var w = wayOf(state.way);

    if (!state.projectId) {
      card.appendChild(el('p', 'note', '프로젝트를 먼저 고르면 여기서 바로 올릴 수 있습니다.'));
      return card;
    }

    // 연결 — 여기서 올리는 것이 아니다
    if (state.way === 'linked') {
      if (state.closed.linked) {
        card.appendChild(waitBox('연결 갈래가 아직 열려 있지 않습니다', state.closed.linked));
      } else {
        var pv = providerNames();
        card.appendChild(el('p', 'note',
          '연결은 파일을 올리는 것이 아니라 저장소의 파일을 가리키는 것입니다.'
          + (pv ? ' 붙일 수 있는 곳: ' + pv + ' — 폴더 하나까지만 권한을 받습니다.' : '')));
      }
      return card;
    }

    // 보관 — Pro 다. **파일을 고르게 한 뒤 거절하지 않는다**
    var G = window.LinkPilotGate;
    if (state.way === 'kept' && G) {
      var a = G.access(C.session, w.plan);
      if (!a.allowed) {
        var m = G.accessMessage(a, (C.planNames || {})[w.plan] || w.plan, '올려서 보관');
        card.appendChild(waitBox((m && m.title) || '이 갈래는 쓸 수 없습니다', (m && m.body) || ''));
        card.appendChild(el('p', 'note',
          '「1회성으로 올리기」는 무료입니다 — 다만 읽고 바로 버리므로 다시 쓸 수 없습니다.'));
        return card;
      }
    }

    // 1회성 — **올리기 전에** 무엇을 잃는지 말한다
    if (state.way === 'oneshot') {
      card.appendChild(add(el('div', 'note'),
        el('b', null, '올리기 전에 확인해 주세요'),
        document.createTextNode(
          '1회성 자료는 읽은 뒤 서버에서 지워집니다. 보관하지 않으므로 다시 쓸 수 없고, '
          + '원본이 그대로인지 나중에 확인할 수도 없습니다. 계속 쓸 자료라면 「올려서 보관」을 쓰십시오.')));
    }

    // ★★ 올린 자료가 **어디에 쓰이는지** 말한다. 여기서 넣은 것이 4단계 생성에서
    //   값을 뽑는 자료가 된다 — 그걸 모르면 사용자는 자료를 두 번 넣는다
    card.appendChild(el('p', 'note',
      '여기서 올린 자료는 「보고서 생성」 4단계에서 그대로 읽힙니다. '
      + '뽑은 값에는 어느 파일 몇 쪽에서 나왔는지가 함께 기록됩니다.'));

    // ★★ 스캔본·사진은 **글자로 옮겨야** 읽힌다. 그 기능이 꺼져 있으면
    //   올리기 **전에** 말한다 — 올리고 나서 알면 늦다 (1단계는 말하는데
    //   이 화면은 안 말하고 있었다)
    if (state.limits && state.limits.ocrReady === false) {
      card.appendChild(add(el('div', 'note'),
        el('b', null, '스캔본·사진은 지금 수치가 안 뽑힙니다'),
        document.createTextNode(
          '글자로 옮기는 기능이 서버에서 꺼져 있습니다. 지금 올리면 보관은 되지만 '
          + '값은 뽑히지 않습니다 — 글자가 들어 있는 PDF·한글·엑셀로 올리십시오.')));
    }

    card.appendChild(dropZone());
    // ★ 한도를 **모르면 적지 않는다.** 모르는 값을 0 으로 그리면 「못 올린다」로 읽힌다
    if (state.limits && state.limits.maxBytesPerFile > 0) {
      card.appendChild(el('p', 'note',
        '파일 하나 ' + size(state.limits.maxBytesPerFile)
        + ' · 한 번에 ' + size(state.limits.maxBytesPerRequest) + ' 까지 올릴 수 있습니다.'));
    }
    card.appendChild(pickedList());

    var ready = state.picked.filter(function (f) { return f.data && !f.tooBig; });
    var go = el('button', 'btn', state.way === 'oneshot' ? '1회성으로 올리기' : '올려서 보관');
    go.type = 'button';
    go.disabled = !ready.length || state.busy;
    go.addEventListener('click', doUpload);
    card.appendChild(go);

    var up = uploadCard();
    if (up) card.appendChild(up);
    return card;
  }

  /** 아직 안 붙은 길. **오류가 아니라 상태**로 그린다 */
  function waitBox(title, why) {
    var b = el('div', 'wait');
    b.appendChild(el('div', 'wait__t', title));
    b.appendChild(el('div', 'wait__d', why));
    return b;
  }

  /**
   * 보관 목록. **비어 있으면 아무것도 그리지 않는다** 〈2026-08-20〉.
   *
   * ★ 전에는 「보관된 자료가 없습니다」·「차지하는 용량 0 B」를 늘 그렸다.
   *   자료를 넣으러 온 화면에서 **아직 아무것도 없다는 말 셋이 화면을 덮었다**
   *   (실서버 실측). 없다는 것은 붙이기 칸이 이미 말하고 있다.
   *
   * ★ 「아직 안 열렸다」는 그대로 말한다 — 그건 없는 것과 다르다.
   */
  function keptBlock() {
    if (state.closed.kept) {
      var w = document.createDocumentFragment();
      w.appendChild(el('div', 'grp', '올려서 보관'));
      w.appendChild(waitBox('보관 경로가 아직 열려 있지 않습니다', state.closed.kept));
      return w;
    }
    var files = (state.kept && state.kept.files) || [];
    var trashN = ((state.kept && state.kept.trash) || []).length;
    if (!files.length && !trashN) return null;   // 없으면 절 자체를 만들지 않는다

    var out = document.createDocumentFragment();
    out.appendChild(el('div', 'grp', '올려서 보관'));
    files.forEach(function (f) {
      var b = el('div', 'row__b');
      b.appendChild(el('div', 'row__n', f.name));
      b.appendChild(el('div', 'row__m',
        size(f.size) + (f.sha256 ? ' · sha256 ' + String(f.sha256).slice(0, 12) : '')
        + (f.at ? ' · ' + String(f.at).slice(0, 10) + ' 올림' : '')));
      out.appendChild(add(el('div', 'row'), b));
    });

    var trash = state.kept.trash || [];
    if (trash.length) {
      var n = el('p', 'note');
      n.appendChild(el('b', null, '휴지통 ' + trash.length + '건'));
      n.appendChild(document.createTextNode(' — 버린 자료는 보고서에 실리지 않습니다. 되살릴 수 있습니다.'));
      out.appendChild(n);
    }
    // ★ 용량은 **찰 때만** 말한다. 0 B 를 늘 적으면 알림이 아니라 잡음이다
    var u = state.kept.usage;
    if (u && u.billableBytes > 0) {
      out.appendChild(el('p', 'note', '차지하는 용량 ' + size(u.billableBytes)
        + ' (버린 자료도 지우기 전까지 함께 셉니다)'));
    }
    return out;
  }

  /** 연결 목록. 비어 있으면 그리지 않는다 — 어디에 붙일 수 있는지는 붙이기 칸이 말한다 */
  function linkedBlock() {
    if (state.closed.linked) {
      var w = document.createDocumentFragment();
      w.appendChild(el('div', 'grp', '연결해서 쓰기 — 사본을 만들지 않습니다'));
      w.appendChild(waitBox('저장소 연결이 아직 열려 있지 않습니다', state.closed.linked));
      return w;
    }
    var items = (state.linked && state.linked.items) || [];
    if (!items.length) return null;

    var out = document.createDocumentFragment();
    out.appendChild(el('div', 'grp', '연결해서 쓰기 — 사본을 만들지 않습니다'));
    items.forEach(function (it) {
      var b = el('div', 'row__b');
      b.appendChild(el('div', 'row__n', it.name));
      b.appendChild(el('div', 'row__m',
        (it.path || '') + ' · 판 ' + String(it.rev).slice(0, 12)
        + (it.readAt ? ' · ' + String(it.readAt).slice(0, 10) + ' 읽음' : ' · 아직 읽지 않음')));
      out.appendChild(add(el('div', 'row'), b));
    });

    var unread = (state.linked.unread || []).length;
    if (unread) {
      out.appendChild(el('p', 'note',
        '아직 한 번도 읽지 않은 자료 ' + unread + '건 — 읽어야 지문이 생기고, 그래야 값의 근거가 됩니다.'));
    }
    return out;
  }

  /**
   * 붙일 수 있는 저장소 이름. **서버가 알려 준다** — 화면에 적어 두면 늘어날 때 갈린다.
   * 연결 갈래를 골랐을 때만 쓴다 (목록 아래에 늘 깔아 두면 잡음이 된다).
   */
  function providerNames() {
    return ((state.linked && state.linked.providers) || []).map(function (p) { return p.name; }).join(' · ');
  }

  /**
   * 1회성 기록. 비어 있으면 그리지 않는다.
   *
   * ★ 「올리기 전에 확인해 주세요」는 **붙이기 칸**에 있다 — 고르는 그 자리에서
   *   말해야 늦지 않는다. 여기에 또 두면 같은 경고가 화면에 두 번 나온다.
   */
  function oneshotBlock() {
    if (state.closed.oneshot) {
      var w = document.createDocumentFragment();
      w.appendChild(el('div', 'grp', '1회성으로 올리기 — 읽고 바로 버립니다'));
      w.appendChild(waitBox('1회성 자료 경로가 아직 열려 있지 않습니다', state.closed.oneshot));
      return w;
    }
    var items = (state.oneshot && state.oneshot.items) || [];
    if (!items.length) return null;

    var out = document.createDocumentFragment();
    out.appendChild(el('div', 'grp', '1회성으로 올리기 — 읽고 바로 버립니다'));
    items.forEach(function (it) {
      var b = el('div', 'row__b');
      b.appendChild(el('div', 'row__n', it.name));
      b.appendChild(el('div', 'row__m',
        size(it.bytes) + ' · sha256 ' + String((it.fingerprint && it.fingerprint.value) || '').slice(0, 12)
        + (it.readAt ? ' · ' + String(it.readAt).slice(0, 10) + ' 읽음' : '')
        + ' · 파일 없음(지웠습니다)'));
      out.appendChild(add(el('div', 'row row--gone'), b));
    });
    return out;
  }

  function render() {
    view.innerHTML = '';
    if (!C.inTab) view.appendChild(el('h1', null, '자료 업로드'));

    // 토큰이 안 실리면 화면이 색 없이 뜨는데 오류는 안 난다 — 화면이 스스로 말한다
    if (F && F.tokensLoaded() === false) view.appendChild(el('div', 'nostyle', F.TOKENS_MISSING));

    // ★ 등급·로그인 판정을 **화면이 먼저** 말한다. 판정 자체는 서버가 하지만,
    //   화면이 아무 말도 안 하고 목록만 비어 있으면 「자료가 없다」로 읽힌다
    var G = window.LinkPilotGate;
    var a = G ? G.access(C.session, C.requiredPlan) : { allowed: true };
    if (!a.allowed) {
      var m = G.accessMessage(a, (C.planNames || {})[C.requiredPlan] || C.requiredPlan, '자료 업로드');
      var g = el('section', 'card');
      add(g, el('h2', 'card__t', (m && m.title) || '사용할 수 없습니다'),
        el('p', 'card__d', (m && m.body) || ''));
      view.appendChild(g);
      return;
    }
    if (state.gate) {
      var sg = el('section', 'card');
      add(sg, el('h2', 'card__t', state.gate),
        el('p', 'card__d', '로그인하거나 멤버십을 확인한 뒤 다시 열어 주십시오.'));
      view.appendChild(sg);
      return;
    }

    if (state.error) view.appendChild(el('div', 'err', state.error));

    // ★ 프로젝트를 **먼저** 고르게 한다. 자료는 프로젝트에 붙는 것이라
    //   고르기 전에 파일부터 고르게 하면 올릴 곳이 없다
    // 프로젝트 고르기
    var pick = el('div', 'pick');
    pick.appendChild(el('label', null, '프로젝트'));
    var sel = el('select');
    // 없을 때 「고르세요」라고 하면 어딘가 있는 줄 알고 찾는다 (outputs.html 과 같은 문구)
    var none = el('option', null,
      (state.projects && state.projects.length) ? '— 고르세요 —' : '프로젝트가 없습니다');
    none.value = '';
    sel.appendChild(none);
    (state.projects || []).forEach(function (p) {
      var o = el('option', null, p.name ? (p.name + ' · ' + p.id) : p.id);
      o.value = p.id;
      if (p.id === state.projectId) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function () { pickProject(sel.value); });
    pick.appendChild(sel);
    view.appendChild(add(el('div', 'card'), pick));

    view.appendChild(attachCard());

    if (!state.projectId) {
      view.appendChild(el('p', 'card__d', '프로젝트를 고르면 그 프로젝트의 자료가 여기 뜹니다.'));
      return;
    }

    // ★ 빈 절은 아예 만들지 않는다. `null` 을 그대로 넣으면 예외가 난다
    [keptBlock(), linkedBlock(), oneshotBlock()].forEach(function (b) {
      if (b) view.appendChild(b);
    });
  }

  render();
  // 한도는 **서버가 정한다.** 화면에 숫자를 박아 두면 서버가 바뀌는 날 화면만 옛말을 한다.
  // ★ `call()` 은 `{ok, body}` 를 준다 — 껍데기째 넣으면 값이 `undefined` 가 되고
  //   화면에는 **「0 B」가 그럴듯하게 찍힌다.** 실제로 그렇게 한 번 나왔다
  if (state.projectId) announce(state.projectId);   // 미리 정해져 열렸을 때도 알린다
  call('GET', '/intake').then(function (r) {
    if (r && r.ok && r.body) { state.limits = r.body; render(); }
  }, function () {});
  loadProjects().then(function () {
    render();
    if (state.projectId) return loadOne(state.projectId).then(render);
    return null;
  });
})();
</script>
</body>
</html>
