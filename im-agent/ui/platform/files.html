<!doctype html>
<html lang="ko" data-lp-build="35ce34b2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자료 업로드 · LINKPILOT</title>
<!--
  자료 업로드 — 보고서에 쓸 자료를 넣는 곳. 세 번째 탭 (2026-08-18).

  ★★ **탭 이름은 「자료 업로드」지만 하는 일은 넷이고, 그중 둘은 업로드가 아니다.**
    ① LinkPilot 프로젝트에서 가져오기  앱 딜이 가진 것을 끌어온다 (2026-08-21)
    ② 폴더를 연결해서                  **사본을 안 만든다.** 읽을 때만 잠깐 가져와 버린다
    ③ 파일업로드 (보관)                프로젝트에 저장한다. **다시 만들 때 다시 읽는다**
    ④ 파일업로드 (1회성)               읽고 **바로 버린다.** 다시 만들면 안 실린다

  ★★★ **③ 이 없어서 사고가 났다** 〈2026-08-23 사장님: 「자료를 업로드 했는데
    전혀 반영이 안되었음」〉. 「올려서 보관」(Pro)을 2026-08-20 에 화면에서 뺐고,
    그 뒤로 **모든 업로드가 1회성**이었다. 1회성은 읽고 파일을 버리므로
    `02_Source_Data` 가 언제나 비었고, 보고서를 만들 때 `02_extraction` 이
    「원본자료가 없다」로 끝났다 — **숫자가 전부 통상치로 나갔다.**
    ★ 화면에서 길 하나를 빼면 **서버 API 가 살아 있어도 그 기능은 없는 것**이다.
      그리고 없어진 것이 「품질」이면 아무도 오류를 안 본다.
    ★ 그래서 ③ 을 되돌리고 **기본으로** 둔다. ④ 는 남긴다(D-65) — 사본을
      남기기 싫은 사람의 길이다.
    ★ 셋(①②④)은 무료, ③ 은 Pro 다.
    ②를 업로드로 읽으면 사본이 우리 쪽에 남는 줄 안다 — 그 오해를 막으려고
    만든 것이 ② 다(D-65). 그래서 **화면이 셋의 차이를 먼저 말한다.**

  ★ 무엇이 붙어 있고 무엇이 아직인지는 **서버가 말한다.** 화면이 짐작하지 않는다.
    연결·1회성은 본체가 함수를 넘겨야 열리고, 안 넘어왔으면 서버가 501 과 함께
    **사람이 읽을 문장**을 준다 (플랫폼-연결-지시서 §2).

  ★★ **501 을 오류로 그리지 않는다.** 빨간 「서버 오류」로 뜨면 고장으로 읽혀
    문의가 온다. 「아직 안 붙었습니다」와 「무엇을 하면 열립니다」로 그린다 —
    닫혀 있는 것은 사실이고, 그 이유가 사용자 잘못이 아니기 때문이다.

  ★ 목록·한도·제공자는 **전부 서버 응답에서 온다.** 화면에 적어 두면
    한도가 바뀌는 날 화면만 옛말을 한다.

  붙이는 법은 window.LINKPILOT_FILES 만 채운다. 다른 곳에 값을 박지 않는다.
-->
<script>
/* ★★ **오래 걸리면 말한다** 〈2026-08-21〉. 뼈대만 두고 끝나면 그것도 흰 화면과
 *   다를 바 없다 — 「채워지는 중」이 영원히 채워지지 않는 것을 사용자가 알
 *   방법이 없기 때문이다. 뼈대가 그대로 남아 있으면 무엇을 해야 하는지 적는다.
 *   ★ 화면이 떴으면 `#boot` 이 통째로 사라지므로 이 글은 나오지 않는다. */
(function () {
  setTimeout(function () {
    var w = document.getElementById('lp-boot-why');
    if (!w || !document.getElementById('lp-boot')) return;
    w.hidden = false;
    w.textContent = '아직 화면이 안 떴습니다. 연결이 느리거나 화면 파일을 못 받은 것입니다 — '
      + '새로고침해 보시고, 그래도 그대로면 알려 주십시오.';
  }, 8000);
})();
</script>
<script>
/* ★★★ **빈 화면으로 끝나지 않는다** 〈2026-08-24 사장님: 데스크탑에서 흰 화면〉.
 *
 *   화면이 통째로 비어 뜬 일이 있었다. 소스는 멀쩡했고 헤드리스로 열면
 *   정상이었다 — 즉 **그 순간의 브라우저에서만** 무언가가 안 왔다.
 *
 *   ★ 가장 흔한 자리: 배포가 파일을 하나씩 갈아 끼우는 동안(70초쯤) 화면은
 *     새 판인데 형제 스크립트가 **아직 안 올라와 404** 인 순간이 있다.
 *     그러면 전역이 아예 안 생기고, 첫 줄에서 예외가 나고, **화면은 흰 채로
 *     아무 말도 안 한다.**
 *   ★ 아래쪽 **짝 확인 조각**은 옛 스크립트는 잡지만 **없는 스크립트**는
 *     못 잡는다 — 견줄 전역 자체가 없기 때문이다. 여기가 그 구멍이다.
 *     (그 조각의 표시 이름을 여기 글자로 적지 않는다. 그것을 찾는 검사가
 *      이 주석을 코드로 오해한다 — CLAUDE.md §8 에서 세 번째로 당한 자리다.)
 *
 * ★ 그래서 ① 파일이 안 온 것과 ② 코드가 던진 것을 **둘 다** 사람 말로 띄운다.
 * ★ 이 조각은 **형제 스크립트보다 먼저** 있어야 한다. 뒤에 두면 이미 난
 *   불러오기 실패를 못 듣는다.
 * ★ 검사 자신이 죽으면 안 된다 — 전부 try 로 감싼다. */
(function () {
  /* ★★★★ **자리를 「고치는」 것이 아니라 「틀리지 않게」 한다**
   *   〈2026-08-26 · 같은 고장 **네 번째** · M-56〉.
   *
   *   앱이 이 화면을 어디에 얹느냐에 따라 형제 파일 주소가 두 가지로 틀렸다 —
   *
   *     겹침    /im-flow/im-flow/embed-bridge.js   (앞을 두 번 붙인다)
   *     빠짐    /embed-bridge.js                   (앞을 아예 안 붙인다)
   *
   *   ★ 3판은 **겹침만** 고쳤다. 그래서 빠짐이 나자 또 빨간 띠가 떴다.
   *     **한 증상만 보고 고치면 남은 증상이 다음 주에 온다.**
   *
   * ★★ 그래서 「무엇이 틀렸나」를 고치지 않고 **「어디가 맞나」를 정한다.**
   *   형제 파일들은 늘 **한 폴더에 함께** 있다. 그 폴더를 세 가지로 찾는다 —
   *
   *     ① 앱이 알려 준 자리      `<meta name="lp:base">` 또는 window.LP_BASE
   *     ② 주소에 `im-flow` 가 있으면 **첫 번째** 것까지  (겹침이 여기서 풀린다)
   *     ③ 뿌리(`/`)에서 열렸으면 `/im-flow/`             (빠짐이 여기서 풀린다)
   *
   *   ①이 있는 이유: 앱이 다른 자리에 얹게 되는 날 **코드를 안 고치고**
   *   알려 줄 길을 남겨 둔다. 없으면 그날 또 이 파일을 고치게 된다.
   *
   * ★★★ **파일로 열었을 때(file:)는 손대지 않는다.** 미리보기가 그 길이다 —
   *   거기서 자리를 바꾸면 멀쩡한 화면이 깨진다 (늑대야).
   *
   * ★ 이 조각은 형제 파일들보다 **위**에 있으므로, 여기서 `<base>` 를 세우면
   *   아래 상대 경로들이 **처음부터 옳은 자리**를 본다 — 실패가 아예 안 난다.
   *   실패한 뒤에 다시 부르는 것으로는 부족했다(실측: 파일 17개를 다시 받았는데
   *   **버튼이 5개에서 0개**가 되었다 — 이미 초기화가 끝난 뒤였다).
   */
  try {
    var FOLDER = 'im-flow';                  /* 형제 파일들이 함께 사는 폴더 이름 */
    var base = null;
    var why = null;

    /* ① 앱이 알려 준 자리 */
    try {
      var meta = document.querySelector('meta[name="lp:base"]');
      var told = (meta && meta.getAttribute('content')) || window.LP_BASE || null;
      if (told) { base = String(told).replace(/\/*$/, '') + '/'; why = '앱이 알려 줌'; }
    } catch (_) { /* 무시 */ }

    if (!base && /^https?:$/.test(location.protocol)) {
      var pathname = String(location.pathname);
      var at = pathname.indexOf('/' + FOLDER + '/');
      if (at >= 0) {
        /* ② 첫 번째 `/im-flow/` 까지가 그 폴더다. 두 번 이어져 있어도 여기서 풀린다 */
        base = pathname.slice(0, at + FOLDER.length + 2);
        why = '주소에서 찾음';
      } else if (pathname.lastIndexOf('/') === 0) {
        /* ③ 뿌리에서 열렸다 — 형제 파일이 뿌리에 있을 리 없다 */
        base = '/' + FOLDER + '/';
        why = '뿌리에서 열려 폴더를 붙임';
      }
    }

    /* 지금 자리와 같으면 아무것도 하지 않는다 — 멀쩡한 화면을 건드리지 않는다 */
    var now = String(location.pathname).slice(0, String(location.pathname).lastIndexOf('/') + 1);
    if (base && base !== now && !document.querySelector('base[data-lp-base]')) {
      var b = document.createElement('base');
      b.setAttribute('data-lp-base', why);
      b.href = location.origin + base;
      (document.head || document.documentElement).insertBefore(
        b, (document.head || document.documentElement).firstChild);
      /* ★★ **조용히 넘어가지는 않는다.** 화면은 살렸지만 **근본은 앱 쪽**이다
       *   (앞을 붙이는 쪽). 사장님 화면에 빨간 띠를 띄우면 멀쩡히 도는 화면을
       *   고장으로 읽으시게 되므로, 개발자 콘솔과 표시로만 남긴다 —
       *   사람은 안 놀라고, 기계는 셀 수 있다. */
      try {
        console.warn('[LinkPilot] 형제 파일 자리를 바로잡았다 (' + why + '): '
          + now + ' → ' + base
          + ' — 화면은 정상이지만 **앞부분을 붙이는 앱 쪽**이 근본이다.');
      } catch (_) { /* 콘솔이 없어도 죽지 않는다 */ }
    }
  } catch (_) { /* 자리를 못 고쳐도 죽지 않는다 — 아래 띠가 받는다 */ }

  var shown = false;
  /**
   * ★★★ **고쳤다는 말과 못 고쳤다는 말을 같은 색으로 하지 않는다**
   *   〈2026-08-26 · 자가치유를 넣으면서〉.
   *
   *   빨강은 「화면이 안 뜬다」는 뜻이어야 한다. 스스로 고쳐서 화면이
   *   멀쩡히 뜬 경우까지 빨강으로 적으면, 사장님은 **멀쩡한 화면을 보며
   *   고장이라고 읽으신다** — 그러면 다음부터 빨간 띠를 안 믿게 된다.
   *
   * ★★ 그리고 **빗장(shown)을 경고에는 걸지 않는다.** 앞 판은 한 번 뜨면
   *   끝이라, 자가치유 알림이 먼저 뜨면 **뒤에 오는 진짜 실패가 통째로
   *   조용해졌다.** 조용한 실패가 이 저장소에서 가장 비쌌다.
   */
  function say(msg, kind) {
    var warn = kind === 'warn';
    if (shown) return;
    if (!warn) shown = true;          /* 치명만 빗장을 건다 */
    try {
      var n = document.createElement('div');
      n.setAttribute('data-lp-fail', warn ? 'warn' : '');
      n.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:99999;'
        + 'background:' + (warn ? '#8A6100' : '#C00000')
        + ';color:#fff;padding:14px 18px;font:700 14px/1.5 system-ui,sans-serif');
      n.textContent = msg;
      var put = function () { if (document.body) document.body.appendChild(n); };
      if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
    } catch (_) { /* 알리다 죽지 않는다 */ }
  }
  /* 불러오기 실패는 거품이 안 올라온다 — 잡기 단계(true)에서 들어야 한다 */
  window.addEventListener('error', function (e) {
    try {
      var t = e && e.target;
      if (!t || !t.tagName) return;
      var tag = String(t.tagName).toUpperCase();
      if (tag !== 'SCRIPT' && tag !== 'LINK') return;
      /* ★★★ **이름만으로는 갈라 낼 수 없다** 〈2026-08-25 · 실제로 못 갈랐다〉.
       *   앱 안에서 이 띠가 떴을 때 「그 파일이 NAS 에 없다」와 「앱이 엉뚱한
       *   자리에서 찾는다」가 **똑같이 파일 이름 하나로만** 보였다. 파일은
       *   NAS 에 있었고 HTTP 200 이었는데도 그랬다 — 갈랐어야 할 것은
       *   **어느 경로로 찾았나**이고, 그것이 이름을 자르면서 사라졌다.
       * ★ 호스트는 뗀다 (CLAUDE.md §2). 경로만 있으면 갈린다. */
      var raw = String(t.src || t.href || '');
      var where = raw;
      try { var u = new URL(raw, location.href); where = u.pathname + u.search; } catch (_) {}
      /* ★★★ **경로가 겹쳤으면 그렇다고 말한다** 〈2026-08-26 · 실제로 났다〉.
       *   앱 안에서 `/im-flow/im-flow/tokens.css` 로 찾다가 못 받았다.
       *   이 화면들의 링크는 **전부 상대 경로**(`tokens.css`)라 앞을 붙이지
       *   않는다 — 즉 앞부분을 **덧붙이는 쪽은 앱**이다.
       *
       *   ★ 그런데 띠는 「못 받았습니다」만 말했다. 그러면 「파일이 없다」와
       *     「엉뚱한 자리에서 찾는다」가 **같은 문장으로 보인다.** 사장님은
       *     새로고침을 하시고, 그래도 그대로면 그때부터 원인을 못 찾는다.
       *   ★ 같은 토막이 두 번 이어지는 것은 **새로고침으로 안 없어진다.**
       *     그것은 배포가 도는 중이라서가 아니라 **주소를 만드는 코드**의 일이다. */
      var dup = null;
      try {
        var segs = String(where).split('?')[0].split('/').filter(Boolean);
        for (var i = 0; i + 1 < segs.length; i++) {
          if (segs[i] === segs[i + 1]) { dup = segs[i]; break; }
        }
      } catch (_) { /* 무시 */ }
      if (dup) {
        /* ★★★ **띠는 진단만 했다 — 그래서 같은 일이 계속 났다** 〈2026-08-26 · 세 번째〉.
         *
         *   앞 판 둘은 **메시지를 좋게 만드는 일**이었다. 「못 받았습니다」에
         *   경로를 붙이고, 다시 「두 번 들어 있습니다」를 붙였다. 그런데
         *   **화면은 여전히 안 떴다.** 사장님이 보시는 것은 같은 빨간 띠다.
         *
         * ★ 잘 설명하는 고장은 **고장이다.** 여기서 스스로 고친다 —
         *   겹친 토막을 하나 지우고 **그 파일을 다시 부른다.**
         *
         * ★★ 앞을 덧붙이는 것은 앱 쪽이지만, **고치는 것은 이쪽이 할 수 있다.**
         *   저쪽 저장소에 쓰지 않기로 한 경계(§8-2)를 지키면서 화면은 살린다.
         *
         * ★★★ **한 번만 고친다.** 고친 주소가 또 실패하면 그때는 진짜로
         *   파일이 없는 것이다 — 무한히 다시 부르면 그 사실이 사라진다. */
        var fixed = null;
        try {
          var u2 = new URL(raw, location.href);
          var ss = u2.pathname.split('/');
          for (var k = 0; k + 1 < ss.length; k++) {
            if (ss[k] && ss[k] === ss[k + 1]) { ss.splice(k, 1); break; }
          }
          u2.pathname = ss.join('/');
          fixed = u2.href;
        } catch (_) { fixed = null; }

        if (fixed && fixed !== raw && !t.getAttribute('data-lp-healed')) {
          var el = tag === 'LINK'
            ? document.createElement('link')
            : document.createElement('script');
          el.setAttribute('data-lp-healed', '1');
          if (tag === 'LINK') { el.rel = 'stylesheet'; el.href = fixed; }
          else {
            el.src = fixed;
            /* 원래 태그가 지녔던 표시를 그대로 옮긴다 — 이것이 없으면
               `embed-bridge.js` 가 어느 전역에 붙을지 모른다 */
            var g = t.getAttribute('data-lp-global');
            if (g) el.setAttribute('data-lp-global', g);
            el.async = false;   /* 순서를 지킨다 — 뒤 파일이 앞 파일을 쓴다 */
          }
          t.setAttribute('data-lp-healed', '1');
          (document.head || document.documentElement).appendChild(el);
          say('경로에 「' + dup + '」가 두 번 들어 있어 **한 번 고쳐서 다시 불렀습니다** — '
            + where + ' → ' + (function () {
              try { var v = new URL(fixed); return v.pathname + v.search; } catch (_) { return fixed; }
            }()) + '. 화면이 뜨면 그대로 쓰셔도 됩니다. 앞부분을 덧붙이는 것은 **앱 쪽**이라 '
            + '근본은 그쪽에서 고쳐야 합니다 — 이 경로를 그대로 알려 주십시오.', 'warn');
          return;
        }
        say('화면에 필요한 파일을 못 받았습니다: ' + (where || '(이름 모름)')
          + ' — 경로에 「' + dup + '」가 **두 번** 들어 있습니다.'
          + ' 고쳐서 다시 불러 봤지만 그것도 실패했습니다 — 파일이 정말 없는 자리입니다.'
          + ' 위 경로를 그대로 알려 주십시오.');
      } else {
        say('화면에 필요한 파일을 못 받았습니다: ' + (where || '(이름 모름)')
          + ' — 배포가 도는 중이면 30초 뒤 새로고침(Mac ⌘⇧R · Windows Ctrl+Shift+R)으로 사라집니다.'
          + ' 한 번 하고도 그대로면 그것은 **다른 일**입니다 — 위 경로를 그대로 알려 주십시오.');
      }
    } catch (_) { /* 무시 */ }
  }, true);
  /* ★★★ **헛울음을 내지 않는다** 〈2026-08-24 · 실측에서 걸렸다〉.
   *   `report-flow.html` 은 창을 품고 있어서 브라우저가 막는 읽기가 하나 난다
   *   (`SecurityError: Location.pathname`). 화면은 **멀쩡히 뜬다.**
   *   그것까지 빨간 띠로 띄우면 **멀쩡한 화면에 고장 딱지**가 붙는다.
   * ★ 그래서 코드가 던진 것은 **화면이 실제로 비었을 때만** 알린다.
   *   빈 화면이 이 장치가 막으려는 것이고, 그 밖은 알릴 일이 아니다. */
  var lastErr = null;
  function noteErr(m) {
    lastErr = m;
    setTimeout(function () {
      try {
        var b = document.body;
        var n = b ? (b.innerText || '').trim().length : 0;
        if (n < 40) {
          say('화면을 그리다 멈췄습니다: ' + lastErr
            + ' — 이 글이 보이면 고장입니다. 이대로 알려 주십시오.');
        }
      } catch (_) { /* 무시 */ }
    }, 1200);
  }
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target.tagName) return;   // 위에서 이미 다뤘다
    noteErr((e && e.message) || '알 수 없는 오류');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    noteErr((r && r.message) || r || '알 수 없는 오류');
  });
}());
</script>

<style>
/* 색·간격·반경 토큰은 tokens.css 하나가 정한다 (LinkPilot Design System v1.1) */

.card { background: var(--surface); border: 1px solid var(--line);

/* ── 번호 붙은 칸 — **어디까지가 모으는 일이고 어디부터가 읽는 일인가**
   〈2026-08-21 사용자 지시 — 「1번 … 2번 … 재구성해줘」〉

   ★★ 사용자가 화면을 찍어 손으로 상자를 그리고 「여기가 1번, 여기가 2번」이라고
     알려 줬다. 그 말이 화면에 없었다는 뜻이다. 앞 판은 드롭 자리·목록·단추가
     이름 없이 이어졌고, 그 아래 「자료 스캔」이 또 이어져서 **두 일이 한 덩어리로**
     보였다. 번호와 이름을 주면 둘이 갈라지고, 같은 꼴을 쓰면 한 줄기로 이어진다.
   ★ 번호는 동그라미가 아니라 **네모**다. 동그라미는 이 화면에서 이미
     진행 그래프의 점(`.fx__dot`)이 쓰고 있다 — 같은 모양이면 진행 상태로 읽힌다. */
.sub { margin-top: 18px; }
.sub__h { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.sub__n { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 7px;

  display: flex; align-items: center; justify-content: center; margin-top: 1px; }
.sub__t { font-size: 15px; font-weight: 800; }
.sub__d { font-size: 12.5px; color: var(--ink2); margin-top: 3px; line-height: 1.6; }

/* ── 프로젝트 고르기 — **가로 폭을 다 쓴다** 〈2026-08-21 사용자 지시〉 ──
   ★★ 이름이 긴 프로젝트가 실제로 있다. 좁은 칸에 두면 **세 줄로 접히고**,
     모바일 기본 고르기 창은 그 접힘을 우리가 손댈 수 없다(브라우저가 그린다).
     그래서 ① 칸을 넓게 쓰고 ② 글씨를 화면 폭에 맞추고 ③ **이름 자체를 줄인다.**
     셋을 다 해야 한다 — CSS 만으로는 모바일에서 안 먹는다. */
.pick { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pick label { flex: 0 0 auto; font-weight: 700; font-size: 12px; line-height: 1; font-family: inherit; color: var(--ink2);
  letter-spacing: .06em; text-transform: uppercase; }
select {
  /* 남는 폭을 전부 가져간다. `min-width:240px` 만 두면 좁은 화면에서 넘친다 */
  flex: 1 1 240px;
  width: 100%; max-width: 100%; min-width: 0;
  /* 화면이 좁으면 글씨도 같이 줄인다 — 큰 글씨 + 긴 이름이 접힘의 원인이다 */
  font-weight: 400; font-size: clamp(13px, 3.6vw, 15px); line-height: 1.3; font-family: inherit;
  padding: 10px 11px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  /* 넘치는 글자는 말줄임으로 — 창을 밀어내지 않는다 */
  text-overflow: ellipsis;
}
/* 아주 좁으면 라벨을 위로 올리고 칸이 한 줄을 다 쓴다 */
@media (max-width: 560px) {
  .pick { flex-direction: column; align-items: stretch; gap: 6px; }
  .pick label { letter-spacing: .04em; }
  /* ★★ **`flex-basis` 를 반드시 되돌린다** 〈2026-08-21 실측으로 잡음〉.
     위에서 준 `flex: 1 1 240px` 의 240px 는 **주축 방향** 크기다. 가로로 놓였을
     때는 너비였는데, 여기서 세로로 바꾸는 순간 그것이 **높이**가 된다 —
     고르기 칸 하나가 세로 240px 로 부풀었다.
     오류는 안 난다. 넓은 화면에서는 멀쩡하고 **좁은 화면에서만** 그런다. */
  .pick select { flex: 0 0 auto; }
  /* ★ 좁은 화면일수록 답답하다 — 손가락이 닿는 곳이라 더 그렇다 (2026-08-21) */
  .pick { gap: 8px; }
}
select:focus-visible, button:focus-visible { outline: 2px solid var(--lime-deep); outline-offset: 2px; }

/* 세 갈래를 먼저 갈라 보여 준다 — 이름만 보고 다 같은 업로드로 읽지 않게 */
.ways { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin-bottom: 22px; }
.way { border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 17px; background: var(--surface); }
.way__t { font-weight: 800; font-size: 14px; line-height: 1.4; font-family: inherit; }
.way__k { display: inline-block; font-weight: 700; font-size: 11px; line-height: 1; font-family: inherit; border-radius: 999px;
  padding: 4px 8px; margin-left: 6px; vertical-align: middle; }
.way__k--free { background: var(--lime-soft); color: var(--lime-deep); }
.way__k--pro { background: var(--panel); color: var(--ink2); }
.way__d { font-size: 12.5px; color: var(--ink2); margin: 6px 0 0; line-height: 1.65; }
.way__d b { color: var(--ink); }

.grp { font-weight: 700; font-size: 11.5px; line-height: 1; font-family: inherit; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink2); margin: 22px 0 9px; }

.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  margin-bottom: 8px; background: var(--surface); }
.row__b { flex: 1 1 220px; min-width: 0; }
.row__n { font-weight: 700; font-size: 14px; line-height: 1.4; font-family: inherit; word-break: break-all; }
.row__m { font-size: 12px; color: var(--ink2); margin-top: 3px;
  font-variant-numeric: tabular-nums; word-break: break-all; }
.row--gone { background: var(--panel); border-style: dashed; }

.btn { font-weight: 700; font-size: 13px; line-height: 1; font-family: inherit; padding: 10px 15px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn--go { background: var(--lime); border-color: var(--lime); color: var(--lp-brand-ink); }
.btn:disabled, .btn[aria-disabled="true"] { background: var(--panel); color: var(--ink2);
  border-color: var(--line); cursor: not-allowed; }

/* 아직 안 붙은 길 — 오류가 아니라 상태다 */
.wait { border: 1px solid #F0DEBE; background: var(--warn-soft); color: var(--warn-ink);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
.wait__t { font-weight: 800; font-size: 14px; line-height: 1.45; font-family: inherit; margin-bottom: 5px; }
.wait__d { font-size: 13px; line-height: 1.7; }

.err { border: 1px solid #F3C6C6; background: var(--bad-soft); color: var(--bad-ink);

.note { font-size: 12.5px; color: var(--ink2); margin-top: 9px; line-height: 1.7; }

/* 한도 표기 — **늘 보인다** 〈2026-08-22 사용자 지시〉.
   ★ 숫자를 문장에 숨기지 않는다 (§6-3 ②). 딱지는 작게, 값은 크게, 세로를 맞춘다.
   ★ 라임으로 면을 채우지 않는다 (§6-3) — 테두리와 활자로만 세운다. 빨강은
     넘었을 때 **한 칸에만** 쓴다 (대비는 한 곳에). */
.lim { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; background: var(--surface); }
.lim__r { display: flex; flex-wrap: wrap; gap: 8px 26px; }
.lim__c { display: flex; flex-direction: column; gap: 2px; }
.lim__l { font-size: 11.5px; color: var(--ink2); letter-spacing: .01em; }
.lim__v { font-size: 17px; font-weight: 700; color: var(--ink);
  font-variant-numeric: tabular-nums; line-height: 1.15; }
.lim__c--bad .lim__v { color: var(--bad, #c00000); }
.lim__n { font-size: 12px; color: var(--ink2); margin-top: 8px; line-height: 1.6; }
/* 판 지문 — 고치는 사람을 위한 값이다. 작고 흐리게 둔다 */
.lim__b { font-size: 10.5px; color: var(--ink2); opacity: .6; margin-top: 8px;
  font-variant-numeric: tabular-nums; letter-spacing: .04em; }

.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 22px 16px;
  text-align: center; background: var(--panel); cursor: pointer; }
.drop:focus-visible { outline: 2px solid var(--lime-deep); outline-offset: 2px; }
.drop__t { font-weight: 700; font-size: 14.5px; line-height: 1.4; font-family: inherit; }
.drop__s { font-size: 12.5px; color: var(--ink2); margin-top: 6px; }
.drop input { display: none; }
.drop.over { border-color: var(--lime); background: var(--lime-soft); }

/* 갈래 고르기 — 세 장을 나란히 두고 **고를 수 있게** 한다 (전에는 설명만이었다) */
/* ── 셋과 고르기를 **테두리 하나 안에** 〈2026-08-22 사용자 지시 —
     「데스크탑에서도 라인을 구분하지 말고 하나로 통합, 선택고르기를 하나의
     통합된 박스라인 안에」〉 ──
   ★★ 이 자리는 판이 네 번 바뀌었다 (files.html 의 `WAY_ROWS` 주석 참고).
     전 판은 칸마다 테두리가 있고 고르기 칸이 **또 하나의 테두리**로 아래에
     붙었다. 테두리가 둘이면 고르기가 갈래에 **딸린 것**인지 **다음 단계**인지가
     갈린다 — 실제로 사용자가 「넣어주기」로 그 선을 지워 달라고 했다.
   ★★ 그래서 **테두리는 바깥 상자(`.pickway`) 하나만** 남긴다. 안쪽 칸들은
     테두리를 갖지 않고, 고른 칸과 고르기 칸이 **같은 바탕색으로 이어진다.**
   ★ 칸 사이 실선은 **고른 칸에 닿는 쪽만 지운다.** 전부 지우면 안 고른 두 칸이
     한 덩어리 글자로 뭉쳐 어디까지가 한 칸인지 안 보인다.
   ★ `auto-fit` 으로 되돌아가지는 **않는다.** 그것이 첫 판의 문제였다 — 창 너비에
     따라 2+1 도 되고 1+1+1 도 되어서 어느 것이 한 벌인지가 그때그때 달라졌다.
     **열은 셋으로 고정**하고, 좁아지면 흘리지 말고 **세로로 세운다.**
   ★ 고른 갈래의 칸(`.wayin`)은 여전히 토글 **아래**에서 열린다. 토글 안(=버튼
     안)에 끼우면 셋의 키가 어긋나고, 무엇보다 `<select>` 는 `<button>` 안에서
     열리지 않는다. 상자를 하나로 만드는 것으로 「안에 있음」을 보인다. */
.pickway { display: grid; gap: 0; overflow: hidden;
  border: 1px solid var(--line); border-radius: 14px;
  background: var(--surface); margin-bottom: 20px; }
.pwrow { display: grid; gap: 0; grid-template-columns: repeat(3, 1fr); align-items: stretch; }
/* ── 좁으면 **세로로 세우고, 고르기 칸을 고른 칸 바로 밑으로 옮긴다** ──
   ★ 셋을 억지로 밀어 넣으면 글자가 두세 줄로 접혀 키가 제각각이 된다.
   ★★ 그런데 세로로 세우기만 하면 **고른 칸과 고르기 칸 사이에 나머지 두 칸이
     끼어든다.** 초록 · 흰 · 흰 · 초록 이 되어, 넓은 화면에서는 붙어 있던 둘이
     휴대폰에서만 갈린다. 실측 218px 이었다.
   ★ 그래서 줄(`.pwrow`)을 **투명하게 만들어**(`display: contents`) 네 칸을
     상자의 직계 칸으로 세우고, `order` 로 고르기 칸을 고른 칸 뒤에 꽂는다.
     DOM 은 그대로 둔다 — 넓은 화면의 3열 배치가 그것에 기대고 있다. */
@media (max-width: 620px) {
  .pickway { grid-template-columns: 1fr; }
  .pwrow { display: contents; }
  .pwrow .pw:nth-child(1) { order: 0; }
  .pwrow .pw:nth-child(2) { order: 2; }
  .pwrow .pw:nth-child(3) { order: 4; }
  .pickway--app .wayin { order: 1; }
  .pickway--linked .wayin { order: 3; }
  .pickway--oneshot .wayin { order: 5; }
}
/* 고른 갈래의 칸이 들어올 자리. 안 쓰면 지운다 — 빈 자리도 여백이 된다 */
.pwslot { display: none; }
.pw { text-align: left; font: inherit; cursor: pointer; background: transparent;
  border: 0; border-radius: 0; padding: 14px 15px; }
/* 칸 사이 실선 — 테두리가 아니라 **상자 안쪽 칸막이**다 (가로: 왼쪽 / 세로: 위쪽) */
.pw + .pw { box-shadow: inset 1px 0 0 var(--line); }
@media (max-width: 620px) { .pw + .pw { box-shadow: inset 0 1px 0 var(--line); } }
.pw:hover:not(:disabled):not(.on) { background: var(--panel); }
.pw.on { background: var(--lime-soft); }
/* ★ 칸막이는 고른 칸에도 그대로 둔다. 그것은 **칸과 칸 사이**를 나누는 선이라
   고른 칸과 **아래** 고르기 칸의 이어짐을 끊지 않는다. 지웠더니 안 고른 두 칸이
   한 덩어리 글자로 뭉쳐 어디까지가 한 칸인지가 안 보였다 */
.pw:disabled { cursor: not-allowed; background: var(--panel); color: var(--ink2); }

/* ── 고른 갈래에 **이어 붙은 칸** 〈2026-08-21 사용자 지시 — 고르기를 갈래로 이동배치〉 ──
   ★★ 고르기를 갈래 안으로 옮겼는데, 그냥 아래에 두니 **갈래에 속한 것으로 안 보였다.**
     자리는 맞고 눈에는 안 맞는 상태다 — 사용자는 「옮겨졌나?」를 화면으로 확인할 수
     없다. 그래서 고른 갈래와 **같은 색으로 칠하고 위쪽을 붙여** 한 덩어리로 보이게 한다.
   ★ 갈래 칸(.pw.on)과 같은 테두리·바탕을 쓴다. 색을 여기서 새로 정하면
     갈래 색을 바꾸는 날 둘이 갈린다 — 토큰 하나를 같이 본다. */
/* ★ 여백 〈2026-08-21 사용자 지시 — 「위아래 여백을 넉넉히」〉
   ★★ 전 판의 **위쪽 `-6px`** 는 없앴다 〈2026-08-22〉. 그것은 테두리가 둘일 때
     둘을 겹쳐 붙이던 이음매였는데, 지금은 테두리가 **바깥 상자 하나**뿐이라
     겹칠 것이 없다. 이어져 보이는 것은 **같은 바탕색**이 맡는다.
   ★ 아래 여백은 `.pickway` 로 옮겼다 — `.wayin` 에 두면 상자 안쪽에 바탕색이
     다른 띠가 생긴다 (상자가 `overflow: hidden` 이라 밖으로 나가지 못한다). */
/* ── 진행 미터 — 진행률과 걸린 시간 〈2026-08-22〉 ─────────────────
   ★ 숫자를 **크게, 세로를 맞춰서** 둔다 (tabular-nums). 이 화면에서 잰 값은
     걸린 시간 하나뿐이라 그것이 제일 커야 한다.
   ★ 라임으로 큰 면을 채우지 않는다 (디자인 시스템 §11) — 막대만 라임이다. */
.mtr { margin-top: 12px; padding: 13px 14px 14px; border-radius: 12px;
  background: var(--panel); }
.mtr__h { display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; margin-bottom: 9px; }

/* 관련자료 제공 — 카드 안의 차례표 ①②③ 〈2026-08-23〉 */
.ah { display: flex; align-items: flex-start; gap: 10px; margin: 22px 0 11px; }
.ah:first-of-type { margin-top: 14px; }
.ah__n { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%; background: var(--lime);
  color: var(--lp-brand-ink); font-weight: 800; font-size: 12px; font-variant-numeric: tabular-nums; }
.ah__b { min-width: 0; flex: 1 1 auto; }
.ah__t { font-weight: 800; font-size: 14.5px; letter-spacing: -.01em; }
.ah__w { margin: 3px 0 0; font-size: 12.5px; color: var(--ink2); line-height: 1.6; }
.ah--idle .ah__n { background: var(--line); color: var(--ink2); }
.ah__idle { margin: 0; font-size: 12.5px; color: var(--ink2); line-height: 1.65; }
.mtr__pct { font-size: 25px; font-weight: 800; letter-spacing: -.03em;
  font-variant-numeric: tabular-nums; line-height: 1; }
.mtr__r { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  justify-content: flex-end; }
.mtr__t { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.mtr__s { font-size: 12px; color: var(--ink2); }
.mtr__bar { height: 7px; border-radius: 999px; background: var(--surface);
  overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.mtr__bar i { display: block; height: 100%; border-radius: 999px;
  background: var(--lime); transition: width .25s linear; }
.mtr--done .mtr__bar i { background: var(--lime-deep); }
.mtr__n { font-size: 11.5px; color: var(--ink2); margin: 9px 0 0; line-height: 1.6; }
@media (prefers-reduced-motion: reduce) { .mtr__bar i { transition: none; } }

/* ① 프로젝트 지정 — **갈래 상자 밖**이다 〈2026-08-23〉. 안쪽 칸(`.wayin`)과
   같은 여백을 쓰되, 테두리로 묶지 않는다 — 갈래에 딸린 것이 아니기 때문이다 */
/* ② 자료 넣는 방법 — **둘을 한 테두리 안에** 〈2026-08-23 사장님 지시 「병합」〉.
   ★ 테두리는 바깥 하나만. 안쪽 둘에 또 두르면 「고르는 것」으로 보인다 —
     고르는 단계를 없애려고 합친 것이라 뜻이 뒤집힌다 (§6-3 「대비는 한 곳에만」) */
.ways2 { border: 1px solid var(--line); border-radius: 16px;
  background: var(--surface); overflow: hidden; }
.ways2__b { padding: 17px 16px 19px; }
.ways2__t { font-weight: 800; font-size: 14.5px; letter-spacing: -.01em; }
.ways2__d { margin: 5px 0 13px; font-size: 12.5px; color: var(--ink2); line-height: 1.65; }
/* 「또는」 — 붙여만 두면 아래쪽이 위쪽에 딸린 것으로 읽힌다 */
/* 보관 / 1회성 고르기 — 올리기 칸 **안**에 둔다 (고르는 단계를 새로 만들지 않는다) */
.keepway { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; margin: 0 0 14px; }
.keepway__b { text-align: left; font-family: inherit; cursor: pointer;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  padding: 11px 13px; display: grid; gap: 4px; }
.keepway__b.on { border-color: var(--lime-deep); background: var(--lime-soft); }
.keepway__t { font-size: 13.5px; font-weight: 800; color: var(--ink); }
.keepway__b.on .keepway__t { color: var(--lime-deep); }
.keepway__d { font-size: 11.5px; line-height: 1.6; color: var(--ink2); }
@media (max-width: 560px) { .keepway { grid-template-columns: 1fr; } }
.ways2__or { display: flex; align-items: center; gap: 10px;
  margin: 0 16px; font-size: 11.5px; font-weight: 700; color: var(--ink2);
  letter-spacing: .06em; }
.ways2__or::before, .ways2__or::after { content: ''; flex: 1 1 auto;
  height: 1px; background: var(--line); }
@media (max-width: 560px) {
  .ways2__b { padding: 17px 15px 19px; }
}

.pickone { margin: 0; padding: 18px 16px 20px;
  border-radius: 14px; background: var(--lime-soft); }
.pickone .pick { margin-top: 0; }
.pickone > .note { margin-top: 13px; margin-bottom: 0; }

.wayin { margin: 0; padding: 18px 16px 20px;
  border: 0; border-radius: 0; background: var(--lime-soft); }
.wayin .pick { margin-top: 0; }
/* ★ 안내 한 줄이 고르기 칸에 붙어 있었다 — 한 숨 띄운다 */
.wayin > .note { margin-top: 13px; margin-bottom: 0; }

/* ★★ **좁은 화면 규칙은 기본 규칙 「뒤」에 둔다** 〈2026-08-21 · 재서 잡았다〉.
   앞쪽 미디어 블록에 적었더니 **아래의 기본 규칙이 그대로 덮어썼다** — 힘이
   같으면 나중에 쓴 것이 이긴다. 화면은 멀쩡히 뜨고 오류도 없어서, 재 보기
   전에는 「적용됐다」와 구분되지 않았다. (실측: 22px 를 줬는데 20px 이 나왔다) */
@media (max-width: 560px) {
  .ways { gap: 12px; }
  .wayin { padding: 18px 15px 22px; }
  /* ★ ① 도 같은 규칙을 받는다 — 좁은 화면에서 글자가 테두리에 붙지 않게 */
  .pickone { padding: 18px 15px 22px; }
  .pickway { margin-bottom: 22px; }
}
.pw__t { font-weight: 800; font-size: 14.5px; }
.pw__d { font-size: 12.5px; color: var(--ink2); margin-top: 6px; line-height: 1.6; }

.up { margin-top: 12px; padding: 13px 15px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface); }
.up--done { border-color: var(--lime); background: var(--lime-soft); }
.up--error { border-color: var(--bad); background: var(--bad-soft); }
.up__h { display: flex; align-items: baseline; gap: 10px; }
.up__h b { font-size: 14.5px; }
.up__v { margin-left: auto; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.up__v--none { font-size: 13.5px; font-weight: 400; color: var(--ink2); }
.up__bar { height: 10px; border-radius: 999px; background: #E1E4E8; margin: 10px 0 8px; overflow: hidden; }
.up__bar i { display: block; height: 100%; background: var(--lime); border-radius: 999px; }
.up__bar--none { background: repeating-linear-gradient(135deg, #E1E4E8 0 5px, #F3F4F6 5px 10px); }
.up__d { margin: 0; font-size: 12.5px; color: var(--ink2); line-height: 1.65; }
.up--error .up__d { color: var(--bad-ink); }
/* 「올렸습니다」 안에 섞인 **나쁜 소식**. 초록 칸 안에서도 눈에 걸려야 한다 */
.up__d--bad { color: var(--bad-ink); font-weight: 700; }

/* ── 이관 칸 — **떠나는 일**이라 머무는 칸과 색을 달리한다 〈2026-08-22〉 ──
   ★ 라임으로 채우지 않는다. 큰 면을 브랜드색으로 채우지 않는 것이 이 시스템의
     규칙이고(§11), 여기서 채우면 「완료」로 읽혀 넘어간다는 뜻이 흐려진다. */
.card--handoff { border-color: var(--lime); }
.hand__b { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.hand__b .btn { margin-top: 0; }
.hand__b .btn2 { padding: 12px 18px; font-size: 13.5px; }
.btn { padding: 12px 22px; font-weight: 700; font-size: 14px; line-height: 1; font-family: inherit; border: 0; border-radius: 12px;
  background: var(--lime); color: var(--ink); cursor: pointer; margin-top: 12px; }
.btn:disabled { background: var(--panel); color: var(--ink2); cursor: not-allowed; }

/* ── 활동 그래프 — 올리는 동안 **어디까지 갔는지** 보여 준다 ─────────
   ★ 막대 하나만 있으면 「멈춘 것 같은데 어디서 멈췄나」에 답할 수 없다.
     보내는 중과 서버가 읽는 중은 걸리는 이유가 다르다 — 앞은 회선, 뒤는 파일.
   ★ 움직임을 싫어하는 설정(prefers-reduced-motion)에서는 **색으로만** 말한다. */
.fx { margin-top: 12px; border: 1px solid var(--line); border-radius: 14px;
  background: var(--surface); padding: 15px 16px 11px; }
.fx--done { border-color: var(--lime); background: var(--lime-soft); }
.fx--dead { border-color: var(--bad); background: var(--bad-soft); }
.fx__g { display: flex; align-items: flex-start; }
.fx__n { flex: 0 0 auto; width: 76px; text-align: center; }
.fx__dot { position: relative; width: 30px; height: 30px; margin: 0 auto 7px;
  border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.fx__dot::after { content: ''; position: absolute; inset: 7px; border-radius: 50%;
  background: transparent; transition: background .2s; }
.fx__n--done .fx__dot { border-color: var(--lime); }
.fx__n--done .fx__dot::after { background: var(--lime); }
.fx__n--now .fx__dot { border-color: var(--lime); animation: fxPulse 1.2s ease-in-out infinite; }
.fx__n--now .fx__dot::after { background: var(--lime); }
.fx__n--dead .fx__dot { border-color: var(--bad); }
.fx__n--dead .fx__dot::after { background: var(--bad); }
.fx__t { font-size: 11.5px; color: var(--ink2); line-height: 1.35; word-break: keep-all; }
.fx__n--now .fx__t, .fx__n--done .fx__t { color: var(--ink); font-weight: 700; }
.fx__n--dead .fx__t { color: var(--bad-ink); font-weight: 700; }
.fx__l { position: relative; flex: 1 1 auto; height: 3px; margin-top: 15px;
  border-radius: 3px; background: var(--line); overflow: hidden; }
.fx__l--past { background: var(--lime); }
.fx__l--dead { background: var(--bad); }
.fx__l i { position: absolute; top: 0; bottom: 0; left: 0; width: 45%;
  background: linear-gradient(90deg, transparent, var(--lime), transparent); }
.fx__l--run i { animation: fxRun 1.05s linear infinite; }
@keyframes fxRun { from { transform: translateX(-110%); } to { transform: translateX(240%); } }
@keyframes fxPulse { 0%, 100% { box-shadow: 0 0 0 0 var(--lime-soft); }
  50% { box-shadow: 0 0 0 7px var(--lime-soft); } }

/* ── 좁은 화면에서는 **세로로 세운다** 〈2026-08-21 사용자 지시〉 ──
 *
 * ★★ 가로로 늘어놓으면 칸이 넷일 때 마지막이 **화면 밖으로 잘린다.** 실제로
 *   「보고서 생성으로」가 반만 보였다. 잘린 칸은 **없는 것처럼 보이므로**
 *   사용자는 단계가 셋인 줄 안다 — 다음에 무엇이 오는지가 사라진다.
 * ★ 줄여서 넣지 않는다. 글씨를 더 줄이면 읽히지 않고, 가로로 밀면 밀린 것을
 *   본 사람만 안다. **세로는 아무것도 잃지 않는다.**
 * ★★ 이 블록은 기본 규칙 **뒤에** 둔다 — 앞에 두면 힘이 같아 덮인다
 *   (2026-08-21 실측으로 한 번 당했다).
 */
@media (max-width: 560px) {
  .fx__g { flex-direction: column; align-items: stretch; }
  /* 점과 이름을 한 줄에 — 이름을 점 아래에 두면 세로가 두 배로 길어진다 */
  .fx__n { width: auto; text-align: left; display: flex; align-items: center; gap: 11px; }
  .fx__dot { margin: 0; flex: 0 0 auto; }
  .fx__t { font-size: 13px; }
  /* 잇는 선도 세로로. 점 한가운데(30px 의 절반 − 선 두께의 절반)에 맞춘다 */
  .fx__l { flex: 0 0 auto; width: 3px; height: 20px; margin: 3px 0 3px 13.5px; }
  .fx__l i { left: 0; right: 0; top: 0; bottom: auto; width: auto; height: 45%;
    background: linear-gradient(180deg, transparent, var(--lime), transparent); }
  .fx__l--run i { animation: fxRunV 1.05s linear infinite; }
}
@keyframes fxRunV { from { transform: translateY(-110%); } to { transform: translateY(240%); } }
/* 흘러온 자취 — 진행률을 **시간축으로** 그린다. 멈춘 구간이 평평하게 남는다 */
.fx__c { margin-top: 11px; }
.fx__c svg { display: block; width: 100%; height: 56px; }
.fx__cap { margin: 5px 0 0; font-size: 11.5px; color: var(--ink2);
  font-variant-numeric: tabular-nums; line-height: 1.6; }
.fx__cap b { color: var(--ink); }

/* 끌어다 놓는 동안 — **붙일 자리를 눈에 띄게** 한다 */
.card--attach.dragover { border-color: var(--lime); box-shadow: 0 0 0 3px var(--lime-soft); }
.card--attach.dragover .drop { border-color: var(--lime); background: var(--lime-soft); }

/* 새 프로젝트 만들기 — 고르는 자리에서 바로 */
.new { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 11px; }
.new input { flex: 1 1 320px; min-width: 0; font-weight: 400; font-size: 14px; line-height: 1.4; font-family: inherit;
  padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); }
.new input:focus-visible { outline: 2px solid var(--lime-deep); outline-offset: 2px; }
.new .btn { margin-top: 0; }

@media (prefers-reduced-motion: reduce) {
  .fx__l--run i { animation: none; opacity: .5; }
  .fx__n--now .fx__dot { animation: none; }
}

/* ── 원본이 그대로인가 〈2026-08-21 · D-72〉 ────────────────────────
   폴더를 지켜보지 않기로 했으므로(토큰을 보관하지 않는다) **사람이 눌러서** 본다 */
.chk { margin-top: 12px; }
.chk__b { font-weight: 700; font-size: 13px; line-height: 1; font-family: inherit; padding: 10px 15px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chk__b:hover:not(:disabled) { border-color: var(--lime-deep); color: var(--lime-deep); }
.chk__b:disabled { background: var(--panel); color: var(--ink2); cursor: not-allowed; }
.chk__r { margin-top: 10px; border-radius: 14px; padding: 13px 15px;
  border: 1px solid var(--line); background: var(--surface); }
.chk__r--ok { border-color: var(--lime); background: var(--lime-soft); }
.chk__r--no { border-color: #F0DEBE; background: var(--warn-soft); color: var(--warn-ink); }
.chk__t { font-weight: 800; font-size: 13.5px; line-height: 1.45; font-family: inherit; }
.chk__l { margin: 8px 0 0; padding: 0; list-style: none; }
.chk__l li { font-size: 12.5px; line-height: 1.7; padding: 3px 0; word-break: break-all; }
.chk__at { font-size: 11.5px; color: var(--ink2); margin: 8px 0 0;
  font-variant-numeric: tabular-nums; }

/* ── 같은 문서의 여러 판 — **고르는 것은 사람이다** 〈2026-08-21〉 ────── */
.vc { border: 1px solid #F0DEBE; background: var(--warn-soft); color: var(--warn-ink);
  border-radius: 14px; padding: 14px 16px; margin-top: 12px; }
.vc__t { font-weight: 800; font-size: 14px; line-height: 1.45; font-family: inherit; }
.vc__d { font-size: 12.5px; line-height: 1.7; margin: 5px 0 0; }
.vc__g { margin-top: 11px; padding-top: 10px; border-top: 1px solid #F0DEBE; }
.vc__n { font-weight: 700; font-size: 13px; line-height: 1.4; font-family: inherit; }
.vc__w { font-size: 12px; margin: 3px 0 7px; }
.vc__l { margin: 0; padding: 0; list-style: none; }
.vc__l li { display: flex; gap: 9px; align-items: baseline; font-size: 12.5px;
  padding: 5px 0; line-height: 1.6; }
.vc__i { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
  width: 19px; height: 19px; border-radius: 50%; background: #F0DEBE;
  font-weight: 700; font-size: 11px; line-height: 1; font-family: inherit; color: var(--warn-ink); }
.vc__f { font-weight: 700; word-break: break-all; }
.vc__b { color: var(--ink2); }

/* 토큰이 안 실렸을 때의 경고는 토큰 없이도 보여야 한다 — 색을 직접 칠한다 */
.nostyle { border: 1px solid #F3C6C6; background: #FDECEC; color: #8F1D1D;
  border-radius: 12px; padding: 13px 15px; margin-bottom: 12px; font-size: 13.5px; line-height: 1.7; }
</style>

<script>
/**

 *   api      '/api/linkpilot'
 *   session  { name, planId, status }
 *   inTab    탭 안이면 true — 제목을 그리지 않는다 (탭 바가 이미 이름을 말한다)
 */
window.LINKPILOT_FILES = {
  api: null,
  session: null,
  projectId: null,
  inTab: false,
  preload: null,
  // 자료를 넣는 길은 **무료**다 — 유료면 Pro 를 살지 판단할 자료조차 못 넣는다
  requiredPlan: 'free',

  /**
   * ★★ **501 을 예외로 던지지 않는다.** 던지면 화면이 빨간 「서버 오류」를 그리는데,
   *   그건 고장이 아니라 **아직 안 붙은 상태**다. 상태와 고장을 같은 색으로
   *   칠하면 사용자는 고쳐 달라고 문의한다.
   * @returns {{ok:true, body}|{ok:false, closed:string}|throws}
   */
  /**
   * @param {{localGate?:boolean}} [opt2] `localGate` 면 401·403 을 **화면 전체
   *   게이트로 올리지 않고** 부른 쪽에 돌려준다. 한 칸에서 등급이 모자란 것
   *   때문에 탭 전체가 잠겨 버리면, 열려 있는 나머지 길까지 못 쓴다.
   */
  function call(method, path, body, opt2) {
    /* ★★★ **서버 주소가 없으면 부르지 않는다** 〈2026-08-23 · 사장님 화면에서 잡혔다〉.
     *
     *   앞 판은 `C.api` 가 `null` 이어도 그대로 이어 붙였다. 그러면 주소가
     *   **`"null/projects"`** 가 되고, 그건 지금 페이지 옆의 없는 파일이라
     *   웹서버가 **404** 를 준다. 화면에는 「서버 오류 (404)」 한 줄만 뜬다.
     *
     *   ★ 그 404 는 **서버가 라우트를 잃은 것과 똑같이 보인다** — 그래서
     *     원인을 서버에서 찾게 된다. 실제로 그랬다: 「＋ 신규프로젝트 → 만들기」가
     *     404 로 죽었고, 나는 NAS 엔진의 라우팅 표를 의심했다.
     *   ★ 부르는 자리마다 막지 않는다. **여기 한 곳에서 막는다** — 자리마다
     *     막으면 새로 생긴 자리가 조용히 빠진다 (`loadProjects` 만 막고 있었다).
     */
    /* ★ 위에서 못 받으면 `/api/linkpilot` 로 채운다. 그래도 비면 **부르지 않는다** —
     *   빈 값을 이어 붙이면 `"undefined/projects"` 같은 주소가 되고, 그 404 는
     *   서버가 길을 잃은 것과 똑같이 보인다 (M-28). */
    if (!C.api) {
      return Promise.reject(new Error(
        '서버 주소가 비어 있습니다 — 부르지 않았습니다'
        + (bridgeReason() ? ' (' + bridgeReason() + ')' : '')));
    }
    var opt = { method: method, credentials: 'same-origin' };
    if (body) { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
    /* ★★ **닿지도 못한 것을 서버 오류로 적지 않는다** 〈2026-08-23〉.
     *   `fetch` 가 던지는 것은 「Failed to fetch」 한 줄뿐이라, 그대로 그리면
     *   사용자는 서버가 고장 났다고 읽는다. 실제로는 주소가 틀렸거나 망이
     *   안 닿은 것이고, **짐작으로 부른 판이면 그 짐작이 원인일 확률이 가장 크다.** */
    return fetch(C.api + path, opt).catch(function (e) {
      throw new Error(whyBlocked('서버에 닿지 못했습니다 — 요청이 아예 나가지 못했습니다'
        + (e && e.message ? ' (' + e.message + ')' : '')));
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) {
        /* ★★ **두 404 를 가른다** 〈2026-08-23 · M-12 가 적어 둔 구분〉.
         *   엔진이 주는 404 는 JSON 이고 `error` 가 있다. 길이 없어 나는 404 는
         *   웹서버가 주는 HTML 이라 `error` 가 없다 — 안 가르면 「서버 오류(404)」
         *   한 줄이 되어 **어디를 봐야 하는지** 알 수가 없다. */
        if (r.status === 404 && !(b && b.error)) {
          throw new Error(whyBlocked('그 주소가 서버에 없습니다 (404) — 이 주소로는 API 가 '
            + '안 열립니다. 앱이 부르는 것과 다른 주소일 수 있습니다.'));
        }
        if (r.status === 501) return { ok: false, closed: (b && b.error) || '아직 붙어 있지 않습니다' };
        if ((r.status === 401 || r.status === 403) && opt2 && opt2.localGate) {
          return { ok: false, gated: true, msg: (b && b.error) || '사용할 수 없습니다' };
        }
        // ★★ 401·403 도 **고장이 아니다.** 로그인하지 않았거나 등급이 모자란 것은
        //   상태이지 오류가 아닌데, 빨간 오류로 그리면 고장으로 읽혀 문의가 온다.
        //   (501 은 조심했는데 이건 놓쳤었다 — 2026-08-18)
        if (r.status === 401 || r.status === 403) {
          state.gate = (b && b.error) || '사용할 수 없습니다';
          /* ★★★ **어느 부름이 잠갔는지 적어 둔다** 〈2026-08-23 · 이걸 몰라서 헤맸다〉.
           *   칸 전체가 「로그인이 필요합니다」로 덮였는데, **어느 길이 그랬는지가
           *   화면 어디에도 없었다.** 그래서 코드를 뒤져 후보를 셋으로 좁히고
           *   사장님께 지문을 여쭤 보는 데까지 갔다 — 화면이 한 줄만 적어 줬으면
           *   그 자리에서 끝났다.
           *   ★ 주소만 적는다. 본문·토큰은 안 적는다 (§2). */
          state.gateWhere = method + ' ' + path;
          return { ok: false, gated: true };
        }
        if (!r.ok) throw new Error((b && b.error) || ('서버 오류 (' + r.status + ')'));
        return { ok: true, body: b };
      });
    });
  }

  /* ── 불러오기 ─────────────────────────────────────────── */

  function loadProjects() {
    if (C.preload && C.preload.projects) { state.projects = C.preload.projects; return Promise.resolve(); }
    if (!C.api) { state.projects = []; return Promise.resolve(); }
    /* ★★★ **목록이 잠겼다고 카드 전체를 잠그지 않는다** 〈2026-08-23 · 사장님 화면〉.
     *
     *   앞 판은 그냥 `call('GET','/projects')` 였다. 그 길은 **로그인을 묻는다** —
     *   남의 프로젝트에 무엇이 들었는지가 나가는 자리라서 일부러 그렇게 뒀다.
     *   그런데 401 이 오면 `call()` 이 `state.gate` 를 세우고, `paint()` 는
     *   **카드를 통째로 「로그인이 필요합니다」로 바꿔** 버린다.
     *
     *   ★ 그래서 **열려 있는 길까지 못 쓰게 됐다.** ＋ 신규프로젝트 만들기도,
     *     파일업로드도 무인증으로 열려 있는데(D-82 · D-94) 화면이 먼저 닫혔다.
     *     실제로 사장님이 그 화면을 보셨다.
     *
     *   ★★ `localGate` 는 이런 자리를 위해 이미 있던 손잡이다 — 401·403 을
     *     **부른 쪽에 돌려주고** 화면 전체 게이트로 올리지 않는다.
     *     「한 칸이 잠겼다고 방 전체를 잠그지 않는다.」
     */
    return call('GET', '/projects', null, { localGate: true }).then(function (r) {
      state.projects = (r.ok && r.body && r.body.projects) || [];
      // ★ 잠긴 것을 **잠겼다고 말한다.** 빈 목록으로 두면 「내 프로젝트가 왜
      //   없나」를 사용자가 혼자 고민한다 (§2 — 조용히 넘어가지 않는다)
      state.listLocked = !!(r && r.gated);
    }).catch(function (e) { state.error = e.message; state.projects = []; });
  }

  /**
   * 세 갈래를 **각각** 부른다. 하나가 닫혀도 나머지는 그린다.
   *
   * ★★★ **이 둘도 `localGate` 로 간다** 〈2026-08-23 · 두 번째로 같은 자리에 걸렸다〉.
   *   `GET …/linked` 와 `…/oneshot` 은 **일부러 로그인을 묻는다** — 남의
   *   프로젝트에 무엇이 들었는지가 나가는 자리다(D-82 표). 그런데 그 401 이
   *   `state.gate` 를 세우면 **칸 전체가 「로그인이 필요합니다」로 덮인다.**
   *   ★ 앞서 목록 조회(`GET /projects`) 하나만 고쳤는데 **여기가 남아 있었다.**
   *     한 곳만 고치면 다음 자리가 조용히 같은 일을 한다 (M-24).
   */
  function loadOne(id) {
    if (!C.api || !id) return Promise.resolve();
    var base = '/projects/' + encodeURIComponent(id);
    var LG = { localGate: true };
    var jobs = [
      call('GET', base + '/linked', null, LG).then(function (r) {
        if (r.ok) { state.linked = r.body; state.closed.linked = null; state.locked.linked = null; }
        else if (r.gated) { state.linked = null; state.closed.linked = null; state.locked.linked = r.msg; }
        else { state.linked = null; state.closed.linked = r.closed; state.locked.linked = null; }
      }, function (e) { state.closed.linked = e.message; }),
      call('GET', base + '/oneshot', null, LG).then(function (r) {
        if (r.ok) { state.oneshot = r.body; state.closed.oneshot = null; state.locked.oneshot = null; }
        else if (r.gated) { state.oneshot = null; state.closed.oneshot = null; state.locked.oneshot = r.msg; }
        else { state.oneshot = null; state.closed.oneshot = r.closed; state.locked.oneshot = null; }
      }, function (e) { state.closed.oneshot = e.message; }),
    ];
    return Promise.all(jobs);
  }

  /**
   * 프로젝트를 고른다. **부모(앱)에게도 알린다.**
   *
   * ★★ 왜 알리나: 이 탭에는 앱이 얹는 것이 하나 더 있다 —
   *   「외부 분석 AGENT 로 만들기(기반정보 내보내기)」. 그쪽이 프로젝트를 따로
   *   고르게 하면 **같은 탭에 프로젝트 고르기가 둘**이 되고, 둘이 다른 것을
   *   가리키는 순간 사용자는 **어느 프로젝트의 기반정보를 받았는지 모른다.**
   *   그래서 고르는 곳은 여기 하나로 두고, 앱은 이 알림을 따라간다.
   *
   * ★ 같은 출처로만 보낸다. 다른 출처면 브라우저가 막고, 그건 정상이다.
   */
  function announce(id) {
    var detail = { projectId: id || null };
    // ① iframe 으로 얹혔을 때 — 부모 창에 보낸다 (같은 출처로만)
    try {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'lp-files-project', projectId: detail.projectId },
          window.location.origin);
      }
    } catch (_) { /* 막혀 있으면 그만 — 이 화면의 동작은 그대로다 */ }
    // ② iframe 없이 앱 안에 바로 얹혔을 때 — 부모가 곧 같은 문서다.
    //    창 너머로 보낼 것이 없으므로 **문서 이벤트**로 알린다. 두 방식 중
    //    어느 쪽으로 얹든 앱이 받는 이름은 하나다 — 둘로 갈리면 한쪽만 고쳐진다
    try {
      document.dispatchEvent(new CustomEvent('lp-files-project', { detail: detail }));
    } catch (_) { /* 오래된 브라우저 */ }
  }

  function pickProject(id) {
    // ★ 「+ 새 프로젝트」를 고른 것은 **고르기가 아니라 만들기**다.
    //   여기서 몰래 만들지 않는다 — 무엇을 만들지 사람이 한 줄 적어야
    //   자산군이 정해진다. 안 적고 만들면 GEN 으로 굳는다 (§4)
    if (id === NEW_OPT) {
      state.newProj = { text: '', busy: false, error: null };
      return render();
    }
    state.newProj = null;
    state.dropMsg = null;
    // ★★ 앱 꾸러미를 **반드시 버린다.** 남겨 두면 다른 프로젝트를 고른 뒤에도
    //   앞 딜의 첨부가 「가져오기」에 남아 있고, 누르면 **엉뚱한 프로젝트에 붙는다**
    state.appBundle = null; state.appStage = -1; state.appReport = null;
    // ★★ 스캔 결과도 **반드시 버린다** 〈2026-08-21〉. 남겨 두면 다른 프로젝트를
    //   고른 뒤에도 앞 프로젝트의 「값 12개를 만들었습니다」가 그대로 떠 있다 —
    //   그럴듯하게 틀린 화면이라 아무도 눈치채지 못한다
    state.scan = { busy: false, stage: -1, dead: false, result: null, msg: null, auto: false, moved: null, prog: null };
    // ★ 작업 폴더가 없는 딜을 고른 경우 — 붙일 곳이 없다는 것을 말한다
    if (id && id.indexOf('ext:') === 0) {
      state.projectId = null;
      state.noFolder = true;
      state.linked = state.oneshot = null;
      announce(null);
      return render();
    }
    state.noFolder = false;
    state.restored = false;      // 사람이 직접 골랐으면 「이어서」라고 말하지 않는다
    state.projectId = id || null;
    state.linked = state.oneshot = null;
    state.closed = { kept: null, linked: null, oneshot: null };
    announce(state.projectId);
    remember({ projectId: state.projectId });   // 다음에 열면 이 프로젝트로 시작한다
    render();
    if (id) loadOne(id).then(render);
  }

  /**
   * 앱 프로젝트를 골랐다 — 엔진 프로젝트로 잇는다.
   * 이미 이어져 있으면 그 프로젝트를 연다. 처음이면 만들어 잇고 **부모에게 알린다**
   * (짝의 저장은 앱 몫 — 여기 저장하면 앱 데이터의 정본이 둘이 된다).
   * ★ 실패는 조용히 두지 않는다 — 셀렉트 아래 한 줄로 사유를 말한다.
   */
  function pickAppProject(appId) {
    var apps = Array.isArray(C.appProjects) ? C.appProjects : [];
    var a = null;
    for (var i = 0; i < apps.length; i++) if (apps[i] && String(apps[i].id) === String(appId)) { a = apps[i]; break; }
    if (!a) { state.appMsg = '앱 프로젝트를 찾지 못했습니다 — 탭을 닫았다 다시 여세요.'; render(); return; }
    var linkedTo = (C.appLinks || {})[String(appId)] || null;
    if (linkedTo) {
      var known = (state.projects || []).some(function (p) { return p.id === linkedTo; });
      if (known) {
        state.appMsg = null;
        pickProject(linkedTo);
        return void pullBundle(appId);
      }
      /* 짝은 있는데 엔진에 그 프로젝트가 없다(지워졌다) — 아래에서 새로 만든다. 말없이 만들면
         "전에 올린 자료가 사라졌다"로 읽히므로 사유를 남긴다 */
      state.appMsg = '이어져 있던 보고서 프로젝트(' + linkedTo + ')가 엔진에 없어 새로 만듭니다.';
    }
    if (state.busy) return;
    state.busy = true;
    state.appMsg = '『' + (a.title || appId) + '』 보고서 프로젝트를 만드는 중…';
    render();
    call('POST', '/projects', {
      // ★★ **이름과 요청문을 갈라 보낸다** 〈2026-08-21〉. 전에는 `request` 만
      //   보냈고 엔진이 그 문장에서 이름을 뽑았다 — 그래서 프로젝트 이름이
      //   「『서창산업 / CB발행』((주)서창산업) — LinkPilot 앱 프로젝트에서
      //   가져와 만든 보고서 프로젝트」가 됐다. 고르기 목록이 세 줄로 접혔다.
      //   `projectName` 을 주면 엔진이 그것을 쓴다.
      projectName: a.title || ('앱 프로젝트 ' + appId),
      name: a.title || ('앱 프로젝트 ' + appId),
      // 요청문은 자산군을 정하는 데 쓰인다 — 여기에는 맥락이 있어야 한다
      request: '『' + (a.title || appId) + '』'
        + (a.client ? ' (' + a.client + ')' : '')
        + ' — LinkPilot 앱 프로젝트에서 가져와 만든 보고서 프로젝트',
    }).then(function (r) {
      state.busy = false;
      if (r.gated) { state.appMsg = null; render(); return; }       // 로그인·플랜 안내는 gate 가 말한다
      if (!r.ok || !r.body || !r.body.projectId) {
        state.appMsg = '보고서 프로젝트를 만들지 못했습니다: ' + ((r.body && r.body.error) || r.closed || '사유 없음');
        render(); return;
      }
      var imId = r.body.projectId;
      state.projects = state.projects || [];
      state.projects.unshift({ id: imId, name: a.title || imId });
      state.appMsg = null;
      /* 짝을 앱에 알린다 — announce() 와 같은 두 갈래(같은 출처 postMessage + 문서 이벤트) */
      var detail = { appProjectId: String(appId), imProjectId: imId };
      try {
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'lp-app-project-linked', appProjectId: detail.appProjectId, imProjectId: imId },
            window.location.origin);
        }
      } catch (_) { }
      try { document.dispatchEvent(new CustomEvent('lp-app-project-linked', { detail: detail })); } catch (_) { }
      if (!C.appLinks) C.appLinks = {};
      C.appLinks[String(appId)] = imId;
      pickProject(imId);
      pullBundle(appId);
    }, function (e) {
      state.busy = false;
      state.appMsg = '보고서 프로젝트를 만들지 못했습니다: ' + e.message;
      render();
    });
  }

  /**
   * 앱이 가진 셋을 읽어 둔다. **읽기와 가져오기를 나눈다** — 읽자마자 넣으면
   * 무엇이 들어오는지 보기 전에 들어와 있다.
   */
  function pullBundle(appId) {
    state.appBundle = null;
    state.appStage = -1; state.appDead = false; state.appReport = null;
    // ★ 앱 딜을 고른 순간 갈래도 「앱에서 가져오기」로 맞춘다 〈2026-08-21〉.
    //   맞추지 않으면 고른 것은 앱인데 화면은 연결 갈래를 그리고 있어,
    //   가져오기 칸이 어디 있는지 사용자가 찾아야 한다
    state.way = 'app';
    return loadAppBundle(appId).then(function (b) {
      state.appBundle = b ? { appId: String(appId), content: b.content,
        files: b.files, images: b.images } : null;
      render();
    }, function (e) {
      // 못 읽었으면 그렇다고 말한다 — 조용히 빈 화면을 두면 「자료가 없다」로 읽힌다
      state.appMsg = '앱에서 자료 목록을 읽지 못했습니다: ' + (e && e.message ? e.message : '사유 없음');
      render();
    });
  }

  /* ── 그리기 ───────────────────────────────────────────── */

  /**
   * 세 갈래 — **설명이자 고르는 자리다.**
   *
   * ★ 이름만 보면 셋 다 「업로드」로 읽힌다. 무엇이 다른지를 **고르기 전에** 말한다.
   *   연결은 사본을 만들지 않고, 1회성은 읽고 버린다 — 올린 뒤에 알면 늦다.
   *
   * ★ 전에는 이 셋이 **설명만**이었다. 그래서 차이는 알려 주는데 정작 여기서
   *   올릴 수는 없었고, 자료를 넣으려면 1단계로 되돌아가야 했다. 지금은 고르면
   *   그 자리에서 붙인다.
   */
  // ★ 「올려서 보관」은 뺐다 〈2026-08-20 사용자 결정 — 불필요〉.
  //   서버 API(`POST /sources`)는 그대로 있다. 화면에서 그 길로 들어가지 않을 뿐이다.
  // ★★ **셋이다** 〈2026-08-21 사용자 지시〉. 전에 앱에서 가져오는 길은 프로젝트
  //   고르기 목록 안에 숨어 있었다 — 자료를 넣으러 온 사람이 「자료 붙이기」에서
  //   두 갈래만 보고 **앱 자료는 못 가져오는 줄** 알았다. 셋을 나란히 둔다.
  // ★ 순서는 사용자가 준 순서 그대로다. 앞의 둘은 이미 있는 자료를 **가리키고**,
  //   마지막 하나만 실제로 올린다.
  var WAYS = [
    /* ★ 앱 갈래는 **설명을 달지 않는다** 〈2026-08-22 사용자 지시 — 「아래 내용
     *   설명은 삭제」〉. 이름만으로 뜻이 서고, 고르면 바로 아래에서 프로젝트를
     *   고르게 되므로 설명이 한 번 더 말할 것이 없다.
     *   ★ `d` 를 **빈 문자열로 둔다** — 지우면 `wayTile` 이 `undefined` 를 그린다. */
    /* ★★ **`app` 은 이제 갈래가 아니다** 〈2026-08-23 사장님 지시〉. 프로젝트를
     *   고르는 일은 **자료를 넣는 방법 중 하나가 아니라 그 앞의 일**이다. 그래서
     *   ①로 올려 카드 맨 위에 늘 둔다 — 앞 판은 셋 중 하나로 숨어 있어서,
     *   프로젝트가 없으면 「고르는 자리로 가기」 단추를 한 번 더 눌러야 했다.
     *   ★ 목록에는 남긴다 — 안내 문장들이 `wayName('app')` 으로 이 이름을 부른다. */
    { id: 'app', t: 'LinkPilot 프로젝트에서 가져오기', free: true, plan: 'free', d: '' },
    { id: 'linked', t: '폴더 지정', free: true, plan: 'free',
      d: 'Dropbox·Box·구글·원드라이브의 파일을 가리킵니다. 사본을 만들지 않습니다 — 읽을 때만 잠깐 가져와 버립니다.' },
    /* ★★★ **보관하는 길이 화면에 없었다** 〈2026-08-23 사장님: 「자료를 업로드
     *   했는데 전혀 반영이 안되었음」〉.
     *
     *   3단계의 「파일업로드」는 `/oneshot` 한 곳으로만 갔다. 1회성은 **읽고
     *   파일을 버린다.** 그래서 `02_Source_Data` 가 언제나 비었고, 보고서를
     *   만들 때 `02_extraction` 이 「원본자료가 없다」로 끝났다 —
     *   **숫자가 전부 통상치로 나갔다.**
     *
     *   ★ 보관하는 길(`POST /projects/:id/sources`)은 **서버에 이미 있었다.**
     *     화면에서 부르는 곳만 없었다. 1단계에 남아 있었는데 그 자리가
     *     3단계로 옮겨지면서 같이 오지 않았다.
     *   ★ 1회성은 **지우지 않는다** (D-65) — 사본을 남기기 싫은 사람의 길이다.
     *     다만 **기본을 보관으로** 바꾼다. 다시 만들 수 있는 쪽이 기본이어야 한다. */
    { id: 'keep', t: '파일업로드 (보관)', free: false, plan: 'pro',
      d: '프로젝트에 저장합니다. 보고서를 다시 만들 때 이 자료를 다시 읽고, 나중에 원본과 대조할 수 있습니다.' },
    { id: 'oneshot', t: '파일업로드 (1회성)', free: true, plan: 'free',
      d: '읽고 바로 버립니다. 보관하지 않으므로 **보고서를 다시 만들면 이 자료는 안 실립니다** — 그때 다시 올려야 합니다.' },
  ];

  function wayOf(id) {
    for (var i = 0; i < WAYS.length; i++) if (WAYS[i].id === id) return WAYS[i];
    return WAYS[0];
  }

  /**
   * 갈래 이름을 **문장 안에 손으로 적지 않는다** 〈2026-08-21〉.
   *
   * ★★ 실제로 갈렸다. 갈래 제목에서 괄호를 떼었더니 안내 문장만 옛 이름을
   *   말했다 — 사용자는 화면에 없는 단추 이름을 찾게 된다.
   * ★ 옛 이름을 **이 주석에도 적지 않는다.** 적으면 그것을 찾는 검사가 주석에
   *   걸려 통과하고, 막는 장치가 조용히 죽는다 (M-08 · 이미 두 번 당했다).
   */
  function wayName(id) {
    return wayOf(id).t;
  }

  /**
   * 갈래 셋을 **한 벌의 토글로** 그린다 〈2026-08-22 사용자 지시 —
   * 「라인을 구분하지 않는 통합 토글로 만들어줘」〉.
   *
   *     [LinkPilot 프로젝트에서 가져오기] [폴더를 연결해서] [파일업로드]
   *      └─ 고른 갈래의 칸이 **셋 아래**에서 열린다
   *
   * ★★ 이 자리는 판이 세 번 바뀌었다. 그 내력을 적어 둔다 — 안 적으면
   *   다음 사람이 「왜 이렇게 되어 있지」로 되돌린다.
   *
   *     ① 처음: 셋을 `auto-fit` 으로 **흘렸다.** 창 너비에 따라 2+1 도 되고
   *        1+1+1 도 되어서 **어느 것이 한 벌인지가 그때그때 달라졌다.**
   *     ② 2026-08-21: 단을 손으로 나눴다(1단 앱 / 2단 연결·업로드).
   *        고르기가 앱 갈래에 딸린 것임을 보이려고 1단과 한 겹으로 묶었다.
   *     ③ 2026-08-22 **지금**: 단을 없애고 **셋을 한 줄로** 둔다.
   *
   * ★ ②에서 ③으로 온 이유: 단이 둘이면 앱 갈래만 **한 칸을 통째로 차지해**
   *   나머지 둘보다 커 보이고, 셋이 **같은 층위의 선택지**라는 것이 흐려진다.
   *   지시의 「라인을 구분하지 않는」이 가리키는 것이 그 선이다.
   * ★ ①로 되돌아가는 것은 **아니다.** 열은 `auto-fit` 이 아니라 **셋으로
   *   고정**한다 — 좁아지면 흘리지 않고 세로로 세운다. ①의 「그때그때
   *   달라진다」는 거기서 나왔다.
   */
  /* ★ 〈2026-08-23 사장님 지시〉 「2.[파일업로드] → 파일선택 + 파일 끌어다 놓기
   *    / [폴더 지정] → 폴더선택 지정」 — **둘**이다. 적으신 차례를 그대로 쓴다. */
  var WAY_ROWS = [['oneshot', 'linked']];

  function wayTile(w) {
    var b = el('button', 'pw' + (state.way === w.id ? ' on' : ''));
    b.type = 'button';
    var t = el('div', 'pw__t', w.t);
    // ★ 「무료」 배지를 **그리지 않는다** 〈2026-08-22 사용자 지시〉. 셋이 다 무료라
    //   셋 다에 같은 글자가 붙어 아무것도 가르지 못했다. 무료인지 아닌지는
    //   `free`·`plan` 이 그대로 들고 있다 — **판정은 남고 잡음만 뗀 것이다.**
    //   ★ `w.k` 가 있으면 그때만 그린다. 유료 갈래가 생기면 거기서만 붙는다.
    if (w.k) t.appendChild(el('span', 'way__k way__k--' + (w.free ? 'free' : 'pro'), w.k));
    b.appendChild(t);
    // ★ 설명이 없으면 **빈 칸을 만들지 않는다.** 빈 `p` 는 높이를 남겨서
    //   세 칸의 키가 어긋나 보인다 (통합 토글에서는 그게 바로 눈에 띈다)
    if (w.d) b.appendChild(el('p', 'pw__d', w.d));
    b.addEventListener('click', function () {
      // 갈래를 바꾸면 고른 파일을 버린다 — 보관하려던 것이 1회성으로
      // 넘어가면 **되돌릴 수 없다.** 그 실수는 조용하고 되돌리기도 없다
      if (state.way !== w.id) { state.picked = []; state.upload = null; state.result = null; }
      state.way = w.id;
      remember({ way: w.id });   // 다음에 열면 이 갈래로 시작한다
      /* ★★ **파일업로드는 누르는 그 자리에서 고르기 창을 연다** 〈사용자 지시〉.
       *   창을 여는 것은 **사람이 누른 그 순간**에만 허용된다 — 그리고 난 뒤에
       *   열려고 하면 브라우저가 조용히 막는다. 그래서 `render()` 뒤로 미루지
       *   않고 여기서 표시만 남기고, 그리기가 끝나는 자리에서 곧바로 연다.
       *   ★ 프로젝트가 없으면 열지 않는다 — 골라 봐야 올릴 데가 없다. */
      state.openPicker = (w.id === 'oneshot' || w.id === 'keep');
      render();
    });
    return b;
  }

  function ways() {
    /* ★ 고른 갈래를 **상자에 적어 둔다.** 좁은 화면에서 고르기 칸을 고른 칸
     *   바로 밑으로 옮기는 데 쓴다 (CSS `order` — files.html 의 `.pickway--*`).
     *   자바스크립트로 자리를 옮기지 않는 이유: 넓은 화면에서는 옮기면 안 되는데
     *   화면 폭을 JS 가 다시 재기 시작하면 CSS 와 두 곳에서 같은 판단을 한다 */
    var box = el('div', 'pickway pickway--' + state.way);
    WAY_ROWS.forEach(function (ids) {
      var row = el('div', 'pwrow');
      ids.forEach(function (id) { row.appendChild(wayTile(wayOf(id))); });
      box.appendChild(row);
    });
    /* ★ 고른 갈래의 칸은 **토글 바로 아래**에서 열린다. 토글 안(=`<button>` 안)에
     *   끼우면 셋의 키가 서로 달라지고, 무엇보다 `<select>` 는 버튼 안에서 열리지
     *   않는다 — 버튼이 클릭을 먼저 먹는다.
     *   ★ 「안에 들어 있다」로 보이는 것은 **테두리 하나(`.pickway`)와 같은
     *     바탕색**이 맡는다. 둘 다 `.pwslot` 자리 안에서 벌어진다 */
    box.appendChild(el('div', 'pwslot'));
    return box;
  }

  /**
   * 한 번에 보낼 **합계**가 한도를 넘었는가 〈2026-08-22 · D-81〉.
   *
   * ★★ 전에는 **파일 하나씩만** 재고 합계는 아무도 안 쟀다. 화면은 「한 번에
   *   N MB 까지」라고 적어 두기만 하고 **그대로 보냈다.** 그러면 서버가 본문을
   *   받다가 중간에 연결을 끊는데, 응답이 아예 없어서 화면에는 「전송이
   *   끊겼습니다」밖에 뜰 수가 없다 — 사용자는 **왜 끊겼는지 알 방법이 없다.**
   * ★ 그래서 **보내기 전에 여기서 막는다.** 막는 것이 목적이 아니라 **이유를
   *   말할 수 있는 자리에서 막는 것**이 목적이다.
   * ★ 재는 것은 **읽을 수 있는 것들의 합**이다. 너무 큰 파일과 못 읽은 파일은
   *   어차피 안 실리므로 합계에 넣으면 엉뚱하게 막힌다.
   */
  /**
   * **한도를 늘 보이게 둔다** 〈2026-08-22 사용자 지시 — 「제한 용량표기를 업로드
   * 탭에 노출해줘」〉.
   *
   * ★★ 앞 판은 한도를 **알 때만** 적었다. 그런데 실패는 대개 **모를 때** 난다 —
   *   `/intake` 가 아직 안 왔거나 못 왔으면 줄이 통째로 사라지고, 화면은
   *   「한도 같은 건 없다」처럼 보인다. 그러면 3MB 가 막혀도 크기 때문이라는
   *   생각 자체를 못 한다.
   * ★ 그래서 **모르면 모른다고 적는다.** 0 으로 그리지 않는다 — 0 은 「못 올린다」로
   *   읽힌다 (그 구분이 이 저장소에서 여러 번 문제였다).
   * ★ **지금 고른 합계를 나란히 둔다.** 한도만 있으면 넘었는지 사람이 세야 한다.
   */
  function limitBox() {
    var lim = state.limits || {};
    var per = lim.maxBytesPerFile > 0 ? size(lim.maxBytesPerFile) : null;
    var req = lim.maxBytesPerRequest > 0 ? size(lim.maxBytesPerRequest) : null;

    var wrap = el('div', 'lim');
    var row = el('div', 'lim__r');
    row.appendChild(limCell('파일 하나', per || '확인 중'));
    row.appendChild(limCell('한 번에', req || '확인 중'));

    /* ★ **첨부한 파일의 합계를 나란히 둔다** 〈2026-08-22 사용자 지시〉.
     *   한도만 있으면 넘었는지를 사람이 세어야 한다 — 줄이 다섯이면 아무도 안 센다.
     *   ★ 합계는 **고른 것 전부**로 낸다(아직 읽는 중인 것 포함). 그것이 사용자가
     *     화면에서 보고 있는 목록과 같은 수다. 다르면 「내가 붙인 건 5개인데
     *     합계는 3개치」가 되어 숫자를 못 믿는다.
     *   ★ 고른 것이 없으면 이 칸을 안 만든다. 0 B 를 늘 띄우면 잡음이다. */
    var sum = state.picked.reduce(function (n, f) { return n + (f.size || 0); }, 0);
    if (state.picked.length) {
      row.appendChild(limCell('첨부한 파일 ' + state.picked.length + '개', '총 ' + size(sum),
        (lim.maxBytesPerRequest > 0 && sum > lim.maxBytesPerRequest)));
    }
    wrap.appendChild(row);

    if (!per || !req) {
      wrap.appendChild(el('p', 'lim__n',
        '한도를 서버에서 아직 못 받았습니다 — 올려 보기 전에는 확실하지 않습니다.'));
    }

    /* ★★★ **판 지문을 화면에 박아 둔다** 〈2026-08-22 · 세 번 헤맨 뒤〉.
     *
     *   같은 신고가 왔을 때 셋 중 무엇인지 알 수가 없었다:
     *     ① 안 올라갔다 ② 브라우저가 옛것을 들고 있다 ③ 코드가 틀렸다
     *   **셋은 화면에서 똑같이 보인다.** 그래서 「새로고침해 보십시오」를
     *   반복했고, 사용자는 같은 화면을 다시 찍어 보냈다.
     *
     *   ★ 이 여덟 글자가 있으면 **사진 한 장으로 판이 갈린다.** 작게, 흐리게
     *     둔다 — 쓰는 사람에게 필요한 값이 아니라 **고치는 사람에게** 필요한
     *     값이다 (§6-3 「대비는 한 곳에만」).
     *   ★ 값은 `build-stamp.js` 가 **묶음 전체 내용**에서 만든다. 한 파일만
     *     재면 옆 파일이 바뀐 것을 못 잡는다 — 실제로 틀렸던 것은
     *     `embed-bridge.js` 였는데 사용자가 보는 것은 이 화면이었다. */
    /* ★★ **여기서는 안 그린다** 〈2026-08-23〉. 이 자리(한도 상자)는 서버에서
       한도를 받아야 그려진다 — 그래서 서버가 닫혀 있을 때, 즉 **판을 가장
       알고 싶은 그때** 지문이 사라졌다. 실제로 검사가 그렇게 잡았다.
       화면 맨 아래에 **조건 없이** 그린다 (`F.stampInto`) */

    return wrap;
  }

  function limCell(label, value, bad) {
    var c = el('div', 'lim__c' + (bad ? ' lim__c--bad' : ''));
    c.appendChild(el('span', 'lim__l', label));
    c.appendChild(el('span', 'lim__v', value));
    return c;
  }

  function overRequest() {
    var cap = (state.limits && state.limits.maxBytesPerRequest) || 0;
    if (!cap) return null;
    var ready = state.picked.filter(function (f) { return f.data && !f.tooBig; });
    var total = ready.reduce(function (n, f) { return n + (f.size || 0); }, 0);
    return total > cap ? { total: total, cap: cap, files: ready.length } : null;
  }

  /** 고른 파일을 읽어 둔다. 읽기·보내기는 upload-core.js 한 곳에 있다 */
  function addFiles(list) {
    var max = (state.limits && state.limits.maxBytesPerFile) || 0;
    Array.prototype.forEach.call(list, function (f) {
      if (state.picked.some(function (x) { return x.name === f.name; })) return;
      var rec = { name: f.name, size: f.size, data: null, error: null,
        tooBig: UP.tooBig(f, max) };
      state.picked.push(rec);
      UP.readOne(f, function (err, data) {
        if (err) rec.error = err.message; else rec.data = data;
        render();
      });
    });
    render();
  }

  /**
   * **지난번에 고른 것을 기억한다** 〈2026-08-22 사용자 지시 —
   * 「사용자가 파일선택을 하면 다음번에도 기억하고 연이어 편리 사용하도록」〉.
   *
   * ★★ **기억하는 것은 「어느 갈래·어느 프로젝트」뿐이다.** 파일 내용도,
   *   파일 이름도 담지 않는다 — 딜 자료가 브라우저에 남는다.
   * ★ 이 기기의 이 브라우저에만 남는다. 서버로 가지 않는다.
   * ★ 저장이 막힌 곳이 있다(사생활 보호 창·설정으로 막아 둔 경우). 그때는
   *   **조용히 기억하지 않을 뿐** 화면은 그대로 돈다 — try 로 감싸는 이유다.
   *
   * ★★ **안드로이드의 「작업 선택」 시트는 우리가 기억할 수 없다.** 그것은 웹이
   *   아니라 운영체제 것이다. 우리가 할 수 있는 것은 `accept` 로 **고를 것을
   *   좁혀 시트를 짧게** 만드는 것까지다 (acceptList 참고). 시트에서 매번 같은
   *   앱으로 가고 싶으면 시트의 「항상」을 한 번 눌러 두시면 된다.
   */
  var MEM_KEY = 'lp.files.last';

  function remember(patch) {
    try {
      var was = recall();
      var now2 = { way: was.way || null, projectId: was.projectId || null };
      Object.keys(patch || {}).forEach(function (k) { now2[k] = patch[k]; });
      window.localStorage.setItem(MEM_KEY, JSON.stringify(now2));
    } catch (_) { /* 못 적어도 화면은 그대로 돈다 */ }
  }

  function recall() {
    try {
      var raw = window.localStorage.getItem(MEM_KEY);
      var o = raw ? JSON.parse(raw) : null;
      return (o && typeof o === 'object') ? o : {};
    } catch (_) { return {}; }
  }

  /**
   * 파일 고르기 창에 **읽을 수 있는 형식만** 알려 준다 〈2026-08-22 사용자 지시〉.
   *
   * ★★ 왜: `accept` 가 없으면 안드로이드가 **「작업 선택」 시트를 가장 넓게**
   *   띄운다 — 카메라·캠코더까지 나온다. 사용자는 매번 그 중에서 「사진 및
   *   동영상」을 골라야 했다. 읽을 수 있는 형식을 적어 주면 그 시트가 짧아지고,
   *   대개 파일 고르기로 바로 간다.
   *
   * ★★ **확장자를 여기 적지 않는다.** 목록은 서버(`GET /intake`)가 준다 —
   *   추출기가 아는 것이 단일 출처다(§4). 여기 베껴 두면 형식이 하나 늘 때
   *   화면만 옛 목록을 들고 있게 되고, 그때 증상은 「되는 파일인데 안 골라진다」다.
   * ★ **못 읽는 형식(`convert`)은 뺀다.** 골라 봐야 거절할 것을 고르게 하지 않는다.
   * ★ 목록을 아직 못 받았으면 **아무것도 걸지 않는다.** 빈 accept 는 「고를 수
   *   있는 파일이 없습니다」가 되어, 모르는 것이 못 고르는 것으로 바뀐다.
   */
  function acceptList() {
    var groups = (state.limits && state.limits.formats) || null;
    if (!groups || !groups.length) return '';
    var out = [];
    groups.forEach(function (g) {
      if (!g || g.id === 'convert') return;
      (g.ext || []).forEach(function (e) { if (out.indexOf(e) === -1) out.push(e); });
    });
    return out.join(',');
  }

  /** 파일을 고르는 자리. 끌어다 놓는 것도 받는다 */
  function dropZone() {
    var z = el('div', 'drop');
    z.tabIndex = 0;
    z.setAttribute('role', 'button');
    add(z, el('div', 'drop__t', '파일을 끌어다 놓거나 눌러서 고르세요'),
      el('div', 'drop__s', '여러 개를 한 번에 올릴 수 있습니다'));
    var inp = el('input');
    inp.type = 'file';
    inp.multiple = true;
    // ★ 읽을 수 있는 형식만 — 안드로이드 「작업 선택」 시트가 짧아진다
    var acc = acceptList();
    if (acc) inp.accept = acc;
    inp.addEventListener('change', function () { addFiles(inp.files); inp.value = ''; });
    /* ★★ **창이 두 번 열렸다** 〈2026-08-21 · 재다가 잡았다〉.
     *   `inp` 는 `z` 안에 있다. `inp.click()` 을 부르면 그 click 이 `z` 까지
     *   올라가고, `z` 의 손잡이가 **또** `inp.click()` 을 부른다.
     *   브라우저가 재귀를 한 번은 막아 주어 두 번에서 멈추지만, 사용자에게는
     *   **창을 닫으면 또 뜨는** 것으로 보인다. 올라가는 것을 여기서 끊는다.
     *   (실측: 눌렀을 때 input.click 이 2회 → 1회) */
    inp.addEventListener('click', function (ev) { ev.stopPropagation(); });
    z.appendChild(inp);
    z.addEventListener('click', function () { inp.click(); });
    z.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); inp.click(); }
    });
    z.addEventListener('dragover', function (ev) { ev.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', function () { z.classList.remove('over'); });
    z.addEventListener('drop', function (ev) {
      ev.preventDefault(); z.classList.remove('over');
      addFiles(ev.dataTransfer && ev.dataTransfer.files);
    });
    z._lpInput = inp;    // 그리기가 끝난 뒤 여기서 창을 연다 (render 참고)
    return z;
  }

  /** 고른 파일 목록. **못 올릴 것은 올리기 전에 그렇다고 적는다** */
  function pickedList() {
    var out = document.createDocumentFragment();
    state.picked.forEach(function (f, i) {
      var r = el('div', 'row');
      var left = el('div');
      left.appendChild(el('div', 'row__n', f.name));
      var why = f.error ? f.error
        : f.tooBig ? ('파일이 너무 큽니다 — ' + size(f.size) + ' (한도 ' + size(state.limits.maxBytesPerFile) + ')')
        : f.data ? size(f.size) : '읽는 중…';
      left.appendChild(el('div', 'row__m', why));
      r.appendChild(left);
      var x = el('button', 'btn2', '빼기');
      x.type = 'button';
      x.addEventListener('click', function () { state.picked.splice(i, 1); render(); });
      r.appendChild(x);
      out.appendChild(r);
    });
    return out;
  }

  /* ── 활동 그래프 ─────────────────────────────────────────
   *
   * ★★ 왜 만들었나: 막대 하나로는 **어디서 걸렸는지** 알 수 없다. 「보내는 중」이
   *   오래 걸리는 것과 「서버가 읽는 중」이 오래 걸리는 것은 원인이 다르다 —
   *   앞은 회선, 뒤는 파일(스캔본이면 오래 걸린다). 둘을 같은 막대로 그리면
   *   사용자는 고장으로 읽고 창을 닫는다. 실제로 닫으면 올린 것이 없다.
   *
   * ★ 두 가지를 함께 그린다:
   *     ① **칸** — 지금 어느 단계인가 (지난 칸·도는 칸·죽은 칸)
   *     ② **자취** — 진행률을 시간축으로. 멈춘 구간이 **평평하게 남는다**
   *
   * ★ 자취는 **잰 것만** 그린다. 진행률을 모르는 순간은 담지 않는다 —
   *   모르는 값을 0 으로 이으면 그래프가 뚝 떨어지고 「되돌아갔다」로 읽힌다.
   */

  var SVGNS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k)) n.setAttribute(k, attrs[k]);
    return n;
  }

  /**
   * 자취 그림. 점이 둘 미만이면 **그리지 않는다** — 점 하나로 그은 선은
   * 아무 뜻이 없는데 그럴듯해 보인다.
   */
  function traceChart(pts) {
    if (!pts || pts.length < 2) return null;
    var W = 300, H = 56, PAD = 3;
    var last = pts[pts.length - 1].ms || 1;
    var x = function (p) { return PAD + (W - PAD * 2) * (last ? (p.ms / last) : 0); };
    var y = function (p) { return PAD + (H - PAD * 2) * (1 - Math.max(0, Math.min(100, p.pct)) / 100); };
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(p).toFixed(1) + ' ' + y(p).toFixed(1); }).join(' ');

    var box = el('div', 'fx__c');
    var g = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none',
      role: 'img', 'aria-label': '올린 양이 시간에 따라 어떻게 늘었는지' });
    // 바탕 눈금 — 50% 자리 하나만. 여럿 그으면 자취가 안 보인다
    g.appendChild(svg('line', { x1: 0, y1: (H / 2).toFixed(1), x2: W, y2: (H / 2).toFixed(1),
      stroke: 'var(--line)', 'stroke-width': 1, 'stroke-dasharray': '3 4' }));
    g.appendChild(svg('path', { d: line + ' L' + x(pts[pts.length - 1]).toFixed(1) + ' ' + (H - PAD)
      + ' L' + x(pts[0]).toFixed(1) + ' ' + (H - PAD) + ' Z',
      fill: 'var(--lime-soft)', stroke: 'none' }));
    g.appendChild(svg('path', { d: line, fill: 'none', stroke: 'var(--lime-deep)',
      'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
      'vector-effect': 'non-scaling-stroke' }));
    g.appendChild(svg('circle', { cx: x(pts[pts.length - 1]).toFixed(1),
      cy: y(pts[pts.length - 1]).toFixed(1), r: 3, fill: 'var(--lime-deep)' }));
    box.appendChild(g);
    box.appendChild(el('p', 'fx__cap',
      '지난 ' + (last / 1000).toFixed(1) + '초 · ' + pts.length + '번 쟀습니다'));
    return box;
  }

  /**
   * 칸 + 자취. `at` 은 **지금 도는 칸**, `dead` 면 그 칸에서 멈춘 것이다.
   * @param {{stages:string[], at:number, dead?:boolean, pct?:number, note?:string, pts?:Array}} o
   */
  function activityGraph(o) {
    var done = !o.dead && o.at >= o.stages.length - 1;
    var box = el('div', 'fx' + (done ? ' fx--done' : o.dead ? ' fx--dead' : ''));

    var g = el('div', 'fx__g');
    o.stages.forEach(function (t, i) {
      if (i) {
        // 칸 사이의 선: 지나온 곳은 채우고, **지금 건너는 곳만** 흐른다.
        // 다 흐르게 두면 끝난 뒤에도 도는 것처럼 보인다
        var crossing = !o.dead && !done && i === o.at + 1;
        var past = i <= o.at;
        var l = el('div', 'fx__l' + (past ? ' fx__l--past' : '')
          + (o.dead && i === o.at + 1 ? ' fx__l--dead' : '')
          + (crossing ? ' fx__l--run' : ''));
        if (crossing) l.appendChild(el('i'));
        g.appendChild(l);
      }
      var state2 = o.dead && i === o.at ? 'dead' : i < o.at ? 'done' : i === o.at ? (done ? 'done' : 'now') : '';
      var n = el('div', 'fx__n' + (state2 ? ' fx__n--' + state2 : ''));
      n.appendChild(el('div', 'fx__dot'));
      n.appendChild(el('div', 'fx__t', t));
      g.appendChild(n);
    });
    box.appendChild(g);

    var chart = traceChart(o.pts);
    if (chart) box.appendChild(chart);
    else if (o.note) box.appendChild(el('p', 'fx__cap', o.note));
    return box;
  }

  /**
   * 진행 미터 — **진행률과 걸린 시간을 눈에 보이게** 〈2026-08-22 사용자 지시〉.
   *
   * ★★ 왜 필요했나: 스캔을 누르면 단추가 「읽는 중…」으로 바뀌고 **그대로 멈춰**
   *   있었다. 칸은 첫 자리에 그대로 있고 숫자도 시간도 없었다. 실제로는 돌고
   *   있는데 화면이 **아무 말도 안 해서** 고장으로 읽힌다.
   *
   * ★★ **없는 것을 그럴듯하게 그리지 않는다.** 서버는 중간 상태를 알려 주지
   *   않는다 — 그러니 진행률은 **잰 값이 아니라 걸린 시간으로 어림한 것**이다.
   *   그래서 ① 화면에 「예상」이라고 적고 ② **끝나기 전에는 100% 를 만들지
   *   않는다**(90% 에서 멈춘다). 100% 는 서버가 답한 뒤에만 나온다.
   *   가짜 100% 는 「끝났는데 화면이 안 넘어간다」로 읽혀서 더 나쁘다.
   *
   * ★ **걸린 시간은 진짜다.** 그것만이 여기서 유일하게 잰 값이라 크게 둔다.
   */
  function meter(o) {
    var box = el('div', 'mtr' + (o.done ? ' mtr--done' : ''));

    var head = el('div', 'mtr__h');
    head.appendChild(el('span', 'mtr__pct', Math.round(o.pct) + '%'));
    var right = el('div', 'mtr__r');
    right.appendChild(el('span', 'mtr__t', o.secs));
    if (o.sub) right.appendChild(el('span', 'mtr__s', o.sub));
    head.appendChild(right);
    box.appendChild(head);

    var bar = el('div', 'mtr__bar');
    var fill = el('i');
    fill.style.width = Math.max(2, Math.min(100, o.pct)) + '%';
    bar.appendChild(fill);
    box.appendChild(bar);

    if (o.note) box.appendChild(el('p', 'mtr__n', o.note));
    return box;
  }

  /** 초를 사람 말로. 1분을 넘으면 분까지 — 「94.3초」는 안 읽힌다 */
  function secsText(ms) {
    var s = ms / 1000;
    if (s < 60) return s.toFixed(1) + '초';
    var m = Math.floor(s / 60);
    return m + '분 ' + Math.round(s - m * 60) + '초';
  }

  /** 올리는 갈래의 칸 이름 — 한 곳에서 정한다 */
  var UP_STAGES = ['고른 파일', '보내는 중', '서버가 읽는 중', '붙었습니다'];

  function uploadStage(u) {
    if (!u) return 0;
    if (u.phase === 'sending') return 1;
    if (u.phase === 'reading') return 2;
    if (u.phase === 'done') return 3;
    return -1;   // 'error' — 어느 칸에서 죽었는지는 부르는 쪽이 안다
  }

  /** 진행 바 한 칸. **모르는 값은 막대가 아니라 빗금이다** */
  function progressBar(pct) {
    var bar = el('div', 'up__bar' + (pct === null || pct === undefined ? ' up__bar--none' : ''));
    if (pct !== null && pct !== undefined) {
      var i = el('i');
      i.style.width = Math.max(0, Math.min(100, pct)) + '%';
      bar.appendChild(i);
    }
    return bar;
  }

  /** 올리는 중·끝난 뒤. **거절된 것을 숨기지 않는다** */
  function uploadCard() {
    var u = state.upload;
    if (!u) return null;
    var box = el('div', 'up' + (u.phase === 'done' ? ' up--done' : u.phase === 'error' ? ' up--error' : ''));

    // ★ 그래프를 **맨 위에** 둔다. 「어디까지 갔나」가 먼저 보여야 한다 —
    //   숫자만 먼저 보면 멈춘 것인지 도는 것인지 알 수 없다
    var at = uploadStage(u);
    box.appendChild(activityGraph({
      stages: UP_STAGES,
      at: at < 0 ? state.failStage : at,
      dead: u.phase === 'error',
      pts: state.trace,
      note: '진행률을 잴 수 없는 회선입니다 — 자취를 그리지 않습니다.',
    }));

    var h = el('div', 'up__h');
    h.appendChild(el('b', null,
      u.phase === 'sending' ? '보내는 중'
        : u.phase === 'reading' ? '서버가 읽는 중'
        : u.phase === 'done' ? '올렸습니다' : '올리지 못했습니다'));
    h.appendChild(el('span', 'up__v' + (u.pct === null || u.pct === undefined ? ' up__v--none' : ''),
      (u.pct === null || u.pct === undefined) ? '진행률을 알 수 없습니다' : (u.pct + '%')));
    box.appendChild(h);
    if (u.phase === 'sending' || u.phase === 'reading') box.appendChild(progressBar(u.pct));

    /* ★★ **멈춘 것을 멈췄다고 말한다** 〈2026-08-22 · 실제 신고〉.
     *   신고 화면은 「보내는 중」에서 자취가 평평한 채로 6.1초를 있었다.
     *   화면은 아무 말도 안 했고, 그래서 기다릴지 다시 누를지 정할 수가 없었다.
     *   ★ 빨간 칸으로 그리지 않는다 — 아직 실패한 것이 아니다. 계속 보내는 중이다. */
    if (u.stalled && (u.phase === 'sending' || u.phase === 'reading')) {
      box.appendChild(el('p', 'up__d up__d--bad', u.stallWhy || '진행이 멈췄습니다.'));
    }

    if (u.phase === 'reading') {
      box.appendChild(el('p', 'up__d',
        '다 보냈습니다. 서버가 파일을 열어 읽는 중입니다 — 스캔본이면 더 걸립니다.'));
    } else if (u.phase === 'error') {
      box.appendChild(el('p', 'up__d', u.error));
      /* ★★ **401 을 「로그인하세요」로 옮기지 않는다** 〈2026-08-22〉.
       *   목록이 떴다는 것은 **이미 로그인이 되어 있다**는 뜻이다. 그런데도
       *   올리기만 401 이면 로그인 문제가 아니라 **이 요청이 서버까지 온전히
       *   못 갔다**는 뜻일 가능성이 높다 — 큰 본문이 앞단에서 잘리면 서버가
       *   세션을 못 읽고 401 을 돌려준다.
       *   ★ 그래서 **둘 다 적는다.** 하나로 단정하면 반대쪽을 고치러 간다. */
      var uf = state.uploadFail;
      /* ★★★ **5xx 는 「내가 뭘 잘못했나」가 아니다** 〈2026-08-27 · 실제 신고 HTTP 502〉.
       *
       *   사장님 화면에 「올리지 못했습니다 · HTTP 502」만 떴다. 502 는
       *   **앞단(역프록시)이 엔진에 못 붙었다**는 뜻이다 — 보낸 파일이 크거나
       *   틀려서가 아니다. 그런데 화면이 그 말을 안 하니 **같은 파일을 다시
       *   고르고 처음부터 다시 올리셨다.** 「2번이나 올려야 하는 번거로움」이
       *   그것이다.
       *
       *   ★ 그래서 셋을 한다: ① 일시적이라고 **말하고** ② 고른 파일을 그대로
       *     둔 채 **[다시 보내기]** 를 그 자리에 두고 ③ 같은 일이 이어지면
       *     무엇을 전하면 되는지 적는다.
       *   ★★ **자동으로 다시 보내지 않는다.** 502 는 엔진이 이미 받아서 읽다가
       *     끊겼을 수도 있다 — 그때 자동 재시도는 **같은 자료를 두 벌** 만든다.
       *     누르는 것은 사람이 정한다. */
      if (uf && uf.status >= 500 && uf.status <= 599) {
        box.appendChild(el('p', 'up__d',
          '이것은 **잠깐 나는 고장**입니다 (HTTP ' + uf.status + '). '
          + '보내신 파일이 크거나 틀려서가 아니라, 서버 앞단이 엔진에 못 붙은 것입니다.'));
        box.appendChild(el('p', 'up__d',
          '고른 파일은 그대로 두었습니다 — 다시 고르실 필요가 없습니다. '
          + '아래 [다시 보내기]를 눌러 주십시오. 대개 한 번이면 됩니다.'));
        var again = el('button', 'btn btn--go', '다시 보내기');
        again.type = 'button';
        again.onclick = function () { state.uploadFail = null; doUpload(); };
        box.appendChild(again);
        box.appendChild(el('p', 'up__d',
          '세 번을 눌러도 같으면 — 「보고서 만들기에서 올리기만 HTTP ' + uf.status
          + ', 목록 읽기는 됨」이라고 그대로 전해 주십시오. 그 한 줄이 자리를 좁힙니다.'));
      } else if (uf && (uf.status === 401 || uf.status === 403)) {
        /* ★★★ **되는 것과 안 되는 것을 나눠 적는다** 〈2026-08-22 사용자 지시〉.
         *
         *   앞 판은 한 문단에 추측을 몰아 적었다. 그러면 읽는 사람이 무엇이
         *   **사실**이고 무엇이 **짐작**인지 가를 수가 없고, 결국 「로그인이
         *   필요합니다」라는 제목만 기억에 남아 엉뚱한 데를 고치러 간다.
         *   ★ 그래서 ① 지금 되는 것 ② 안 되는 것 ③ 그래서 할 일 순으로 적는다.
         *   ★ **추측은 추측이라고 적는다.** 「…일 수 있습니다」로 남긴다. */
        var loggedIn = !!(state.projects || (state.kept || state.linked || state.oneshot));
        var sent = uf.bytes > 0 ? size(uf.bytes) : null;

        box.appendChild(el('p', 'up__d',
          '되는 것 — ' + (loggedIn
            ? '로그인·목록 읽기는 됩니다. 프로젝트 목록이 실제로 떴습니다.'
            : '아직 로그인 상태를 확인하지 못했습니다.')));
        box.appendChild(el('p', 'up__d up__d--bad',
          '안 되는 것 — 이 올리기 요청만 서버가 거절했습니다 (HTTP ' + (uf.status || '?') + ').'
          + (sent ? ' 보낸 본문은 ' + sent + ' 입니다.'
                  : ' 보낸 양은 재지 못했습니다 — 0 이라는 뜻이 아닙니다.')));

        if (loggedIn) {
          /* ★★★ **여기서 크기를 먼저 의심하게 만들지 않는다** 〈2026-08-22 · 실제로 틀렸다〉.
           *
           *   앞 판은 「큰 본문이 앞단에서 잘렸을 수 있다」고 적었다. 그래서
           *   본문 한도를 며칠 뒤졌는데, **실제 원인은 크기가 아니라 헤더**였다 —
           *   목록은 `fetch` 로 가서 토큰이 붙고, 올리기는 `XMLHttpRequest` 로
           *   가서 안 붙었다 (`embed-bridge.js` 가 fetch 만 덮고 있었다).
           *   3.8MB 를 올려도 401 이 났다. 크기와는 아무 상관이 없었다.
           *
           *   ★ 화면이 짐작을 적으면 사람은 그 짐작부터 판다. 그러니 **틀린 짐작을
           *     적느니 아무 짐작도 안 적는 편이 낫다.** 대신 **가른 사실**을 준다 —
           *     같은 화면에서 목록은 됐고 이 요청만 안 됐다는 것. */
          box.appendChild(el('p', 'up__d',
            '가른 사실 — 같은 화면에서 목록 읽기는 통과했고 이 올리기만 거절당했습니다. '
            + '즉 로그인 자체가 아니라 **이 요청 하나가** 서버에 사람을 못 밝힌 것입니다.'));
          box.appendChild(el('p', 'up__d',
            '할 일 — 화면을 새로고침한 뒤 한 번 더 올려 보십시오. 같으면 관리자에게 '
            + '「목록은 되는데 올리기만 401」이라고 그대로 전해 주십시오 — 그 한 줄이 자리를 좁힙니다.'));
        } else {
          box.appendChild(el('p', 'up__d',
            '할 일 — 로그인하거나 멤버십을 확인한 뒤 다시 시도해 주십시오.'));
        }
      }
    } else if (u.phase === 'done' && state.result) {
      box.appendChild(el('p', 'up__d', UP.summary(state.result)));
      // ★ 거절 사유를 접어 두지 않는다. 「올렸습니다」만 보면 다 올라간 줄 안다
      (state.result.rejected || []).forEach(function (r) {
        box.appendChild(el('p', 'up__d', '· ' + r.name + ' — ' + r.reason));
      });
      /* ★★ **받은 것과 읽은 것은 다르다** 〈2026-08-22 · 실제 신고 「올리면 깨진다」〉.
       *
       *   서버는 세 가지를 따로 알려 준다:
       *     `rejected`             — 아예 안 받았다 (빈 파일·용량 초과)
       *     `read.unsupported`     — **받았는데 못 읽었다** (xlsx·hwpx·손상된 ZIP …)
       *     `read.facts`           — 읽어서 값이 됐다
       *
       *   그런데 화면은 `rejected` 만 그리고 **가운데를 통째로 빼먹고 있었다.**
       *   그래서 xlsx·hwpx 를 올린 사용자는 초록 칸에 「2개를 올렸습니다」만 보고,
       *   다음 칸이 텅 빈 것을 **고장으로 읽었다.** 실제로는 고장이 아니라
       *   「못 읽었다」였는데 그 말을 아무 데서도 안 했다.
       *
       *   ★ 1회성(파일업로드)은 여기서 한 겹 더 나쁘다 — 서버가 읽어 보고
       *     **원본을 이미 지웠다.** 못 읽었다는 말을 이 자리에서 안 하면
       *     사용자는 자료가 사라진 것조차 모른 채 다음 칸을 누른다. */
      var un = (state.result.read && state.result.read.unsupported) || [];
      if (un.length) {
        box.appendChild(el('p', 'up__d up__d--bad',
          '이 중 ' + un.length + '건은 받았지만 읽지 못했습니다 — 값이 만들어지지 않았습니다.'));
        un.forEach(function (r) {
          box.appendChild(el('p', 'up__d up__d--bad', '· ' + r.name + ' — ' + r.reason));
        });
        // ★ 무엇을 해야 하는지까지 말한다. 사유만 주면 사용자는 같은 파일을 또 올린다
        box.appendChild(el('p', 'up__d',
          state.way === 'oneshot'
            ? ('「' + wayName('oneshot') + '」는 읽고 나서 원본을 지웁니다 — 이 '
              + un.length + '건은 남아 있지 않습니다. PDF 로 바꿔 다시 올리거나, '
              + '원본을 남겨 두려면 「' + wayName('linked') + '」로 넣으십시오.')
            : 'PDF 로 바꿔 다시 올리면 읽을 수 있습니다.'));
      }
      if (state.result.replaced && state.result.replaced.length) {
        box.appendChild(el('p', 'up__d',
          '같은 이름이 있어 이전 판은 휴지통으로 보냈습니다: ' + state.result.replaced.join(' · ')));
      }
    }
    return box;
  }

  /** 실제로 보낸다. 갈래마다 **주소가 다르다** */
  function doUpload() {
    var ready = state.picked.filter(function (f) { return f.data && !f.tooBig; });
    if (!ready.length || !state.projectId || state.busy) return;
    // ★ 합계가 넘으면 **보내지 않는다.** 보내고 나서 끊기면 이유를 말할 수 없다
    if (overRequest()) return;
    /* ★ 보관·1회성 **둘 다** 여기로 온다. 보내는 주소만 다르다 —
     *   길이 둘로 갈라지면 한쪽만 고쳐지는 날이 온다 (M-24) */
    if (state.way !== 'oneshot' && state.way !== 'keep') return;
    /* ★★ **올리기는 `fetch` 가 아니라 XHR 로 간다** — 그래서 `call()` 의 문지기를
     *   안 거친다. 같은 일을 하는 길이 둘이면 **둘 다 막아야 한다** (M-24).
     *   막지 않으면 주소가 `"null/projects/…"` 가 되어 404 로 죽고, 화면에는
     *   「전송이 끊겼습니다」 비슷한 말만 남는다 〈2026-08-23〉. */
    if (!C.api) {
      state.uploadFail = '서버 주소가 비어 있습니다 — 보내지 않았습니다'
        + (bridgeReason() ? ' (' + bridgeReason() + ')' : '');
      return render();
    }
    /* ★ 보관은 `/sources`, 1회성은 `/oneshot`. **이 한 줄이 품질을 가른다** —
     *   `/oneshot` 은 읽고 버리므로 보고서를 다시 만들 때 아무것도 안 실린다 */
    var path = state.way === 'keep' ? '/sources' : '/oneshot';

    state.busy = true; state.result = null; state.error = null; state.uploadFail = null;
    // 자취는 **이번 올리기 것만** 모은다. 안 비우면 지난 판이 앞에 붙어
    // 「예전에 한 번 갔다가 되돌아왔다」처럼 보인다
    state.trace = []; state.traceAt0 = now(); state.failStage = 1;
    UP.send({
      url: C.api + '/projects/' + state.projectId + path,
      files: ready.map(function (f) { return { name: f.name, contentBase64: f.data }; }),
      onUpdate: function (u) {
        state.upload = u;
        var at = uploadStage(u);
        if (at > 0) state.failStage = at;   // 죽으면 **여기서** 죽은 것이다
        // ★ 모르는 값은 담지 않는다. 0 으로 이으면 선이 뚝 떨어져
        //   「되돌아갔다」로 읽힌다 — 실제로는 못 잰 것뿐이다
        if (u.pct !== null && u.pct !== undefined) {
          state.trace.push({ ms: now() - state.traceAt0, pct: u.pct });
          if (state.trace.length > 240) state.trace.shift();
        }
        render();
      },
      onDone: function (j) {
        state.busy = false; state.result = j; state.picked = [];
        // 올린 뒤 목록을 다시 읽는다 — 안 읽으면 방금 올린 것이 안 보인다
        loadOne(state.projectId).then(function () {
          render();
          /* ★★★ **보관은 올린 것만으로는 값이 안 생긴다** 〈2026-08-23〉.
           *   `/sources` 는 파일을 저장할 뿐 읽지 않는다 — 읽는 것은 스캔이다.
           *   여기서 안 돌리면 **올렸는데 값이 0개**이고, 사람은 「반영이 안
           *   된다」고 말한다. 연결 자료가 이미 같은 자리에서 그렇게 하고 있다. */
          if (state.way === 'keep') return scanNow({ auto: true });
          // ★ 1회성은 **서버가 올리는 그 자리에서 이미 읽었다.** 다시 읽을 원본이
          //   우리에게 없다. 그래서 스캔을 또 돌리지 않고 **바로 넘긴다** —
          //   값이 실제로 들어갔을 때만 (안 들어갔으면 빈 칸만 보게 된다)
          var got = j && j.read && ((j.read.facts || []).length || j.read.factCount || 0);
          if (got) {
            state.scan = { busy: false, stage: 3, dead: false, auto: true, moved: null,
              result: { scanned: [], unread: [], facts: got,
                documents: (j.read.documents || []).length,
                empty: false,
                note: '1회성으로 올린 자료는 올리는 그 자리에서 읽었습니다.' },
              msg: null };
            /* ★★★ **넘기기 전에 넘긴다는 것을 보여 준다** 〈2026-08-22 · 사용자 지시〉.
             *
             *   앞 판은 여기서 곧바로 `goReport()` 를 불렀다. 실측하면 이렇다:
             *     올리기 누름 → 905ms 에 이관 신호 발사
             *                 → 931ms 에 「올렸습니다」 카드가 처음 그려짐
             *   **신호가 카드보다 26ms 먼저 나간다.** 그리고 카드는 366ms 만
             *   보이고 탭이 넘어가면서 사라진다. 사람 눈에는 「올렸더니 화면이
             *   사라졌다」다 — 실제로 사용자가 그렇게 신고했다.
             *
             *   ★ 넘어가는 것 자체는 맞다. 값이 들어갔으니 다음 칸으로 가는 게
             *     옳다. 틀린 것은 **말없이 즉시**라는 점이다. 그래서 이관을
             *     한 칸씩 그려서 보여 주고, 다 그린 뒤에 넘긴다.
             *   ★ 사람이 멈출 수 있어야 한다 — 「여기 그대로 있기」를 함께 둔다.
             *     자동으로만 움직이면 무엇이 일어났는지 볼 시간이 없다. */
            startHandoff(got, (j.read.documents || []).length);
          }
        });
      },
      onFail: function (why, status) {
        state.busy = false;
        /* ★★★ **올리기가 실패했다고 화면을 통째로 갈아치우지 않는다**
         *   〈2026-08-22 · 실제 신고 「화면이 사라지는 오류」〉.
         *
         *   앞 판은 401·403 이면 `state.gate` 를 세웠다. 그런데 `paint()` 는
         *   게이트가 서면 **거기서 return 한다** — 고른 파일 목록도, 진행
         *   그래프도, 방금까지 보던 것이 **전부 사라지고** 「로그인이
         *   필요합니다」 카드 하나만 남는다. 사용자가 본 그대로다.
         *
         *   ★ 그리고 그 말이 **틀렸을 수 있다.** 신고 화면의 순서는
         *     「8.7MB 를 보내다 멈춤 → 잠시 뒤 로그인이 필요하다는 문구」였다.
         *     목록·프로젝트는 그 직전까지 멀쩡히 떴다 — 로그인은 되어 있었다.
         *     큰 본문이 거절되어 서버가 세션을 못 읽으면 **401 이 나온다.**
         *     그것을 「로그인하세요」로 옮기면 사용자는 멀쩡한 로그인을
         *     의심하며 엉뚱한 데를 고치러 간다.
         *
         *   ★ 그래서 올리기 실패는 **올리기 칸 안에서** 말한다. 화면은 그대로
         *     둔다 — 무엇을 고르고 있었는지가 남아 있어야 다시 시도할 수 있다.
         */
        state.uploadFail = { why: why, status: status || 0,
          bytes: (state.upload && state.upload.bodyBytes) || 0 };
        render();
      },
    });
  }

  /**
   * 첨부 — **한 자리에서 고르고, 그 자리에서 올린다.**
   *
   * ★ 갈래마다 할 수 있는 것이 다르다. 연결은 여기서 올리는 것이 아니라
   *   **가리키는 것**이라 파일 고르기가 없다 — 본체가 함수를 넘겨야 열린다.
   */
  /**
   * 카드 안의 작은 차례표 〈2026-08-23 사장님 지시 — ①②③〉.
   *
