<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자료 업로드 · LINKPILOT</title>
<!--
  자료 업로드 — 보고서에 쓸 자료를 넣는 곳. 세 번째 탭 (2026-08-18).

  ★★ **탭 이름은 「자료 업로드」지만 하는 일은 셋이고, 그중 둘은 업로드가 아니다.**
    ① 올려서 보관    (Pro)  우리 서버에 둔다. 지우기·되살리기·대조가 있다
    ② 폴더를 연결해서   (무료) **사본을 안 만든다.** 읽을 때만 잠깐 가져와 버린다
    ③ 파일업로드(1회성) (무료) 읽고 **바로 버린다.** 다시 못 쓴다
    ②를 업로드로 읽으면 사본이 우리 쪽에 남는 줄 안다 — 그 오해를 막으려고
    만든 것이 ② 다(D-65). 그래서 **화면이 셋의 차이를 먼저 말한다.**

  ★ 무엇이 붙어 있고 무엇이 아직인지는 **서버가 말한다.** 화면이 짐작하지 않는다.
    연결·1회성은 본체가 함수를 넘겨야 열리고, 안 넘어왔으면 서버가 501 과 함께
    **사람이 읽을 문장**을 준다 (플랫폼-연결-지시서 §2).

  ★★ **501 을 오류로 그리지 않는다.** 빨간 「서버 오류」로 뜨면 고장으로 읽혀
    문의가 온다. 「아직 안 붙었습니다」와 「무엇을 하면 열립니다」로 그린다 —
    닫혀 있는 것은 사실이고, 그 이유가 사용자 잘못이 아니기 때문이다.

  ★ 목록·한도·제공자는 **전부 서버 응답에서 온다.** 화면에 적어 두면
    한도가 바뀌는 날 화면만 옛말을 한다.

  붙이는 법은 window.LINKPILOT_FILES 만 채운다. 다른 곳에 값을 박지 않는다.
-->
<link rel="stylesheet" href="tokens.css">
<style>
/* 색·간격·반경 토큰은 tokens.css 하나가 정한다 (LinkPilot Design System v1.1) */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.55 var(--lp-font);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
.wrap { max-width: 900px; margin: 0 auto; padding: 22px 20px 60px; }
h1 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; margin-bottom: 14px; }

.card { background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 18px 20px; margin-bottom: 14px; }
.card__t { font-size: 16px; font-weight: 800; }
.card__d { font-size: 13px; color: var(--ink2); margin: 5px 0 0; line-height: 1.65; }

.pick { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pick label { font: 700 12px/1 inherit; color: var(--ink2); letter-spacing: .06em; text-transform: uppercase; }
select { font: 400 14px/1 inherit; padding: 9px 11px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 240px; }
select:focus-visible, button:focus-visible { outline: 2px solid var(--lime-deep); outline-offset: 2px; }

/* 세 갈래를 먼저 갈라 보여 준다 — 이름만 보고 다 같은 업로드로 읽지 않게 */
.ways { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin-bottom: 16px; }
.way { border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px; background: var(--surface); }
.way__t { font: 800 14px/1.4 inherit; }
.way__k { display: inline-block; font: 700 11px/1 inherit; border-radius: 999px;
  padding: 4px 8px; margin-left: 6px; vertical-align: middle; }
.way__k--free { background: var(--lime-soft); color: var(--lime-deep); }
.way__k--pro { background: var(--panel); color: var(--ink2); }
.way__d { font-size: 12.5px; color: var(--ink2); margin: 6px 0 0; line-height: 1.65; }
.way__d b { color: var(--ink); }

.grp { font: 700 11.5px/1 inherit; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink2); margin: 22px 0 9px; }

.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  margin-bottom: 8px; background: var(--surface); }
.row__b { flex: 1 1 220px; min-width: 0; }
.row__n { font: 700 14px/1.4 inherit; word-break: break-all; }
.row__m { font-size: 12px; color: var(--ink2); margin-top: 3px;
  font-variant-numeric: tabular-nums; word-break: break-all; }
.row--gone { background: var(--panel); border-style: dashed; }

.btn { font: 700 13px/1 inherit; padding: 10px 15px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn--go { background: var(--lime); border-color: var(--lime); color: var(--lp-brand-ink); }
.btn:disabled, .btn[aria-disabled="true"] { background: var(--panel); color: var(--ink2);
  border-color: var(--line); cursor: not-allowed; }

/* 아직 안 붙은 길 — 오류가 아니라 상태다 */
.wait { border: 1px solid #F0DEBE; background: var(--warn-soft); color: var(--warn-ink);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
.wait__t { font: 800 14px/1.45 inherit; margin-bottom: 5px; }
.wait__d { font-size: 13px; line-height: 1.7; }

.err { border: 1px solid #F3C6C6; background: var(--bad-soft); color: var(--bad-ink);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; font-size: 13.5px; line-height: 1.7; }
.empty { font-size: 13.5px; color: var(--ink2); padding: 6px 0; }
.note { font-size: 12.5px; color: var(--ink2); margin-top: 9px; line-height: 1.7; }
.note b { color: var(--ink); }

.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 22px 16px;
  text-align: center; background: var(--panel); cursor: pointer; }
.drop:focus-visible { outline: 2px solid var(--lime-deep); outline-offset: 2px; }
.drop__t { font: 700 14.5px/1.4 inherit; }
.drop__s { font-size: 12.5px; color: var(--ink2); margin-top: 6px; }
.drop input { display: none; }
.drop.over { border-color: var(--lime); background: var(--lime-soft); }

/* 갈래 고르기 — 세 장을 나란히 두고 **고를 수 있게** 한다 (전에는 설명만이었다) */
.pickway { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.pw { text-align: left; font: inherit; cursor: pointer; background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; }
.pw:hover:not(:disabled) { border-color: var(--lime); }
.pw.on { border-color: var(--lime); background: var(--lime-soft); box-shadow: inset 0 0 0 1px var(--lime); }
.pw:disabled { cursor: not-allowed; background: var(--panel); color: var(--ink2); }
.pw__t { font-weight: 800; font-size: 14.5px; }
.pw__d { font-size: 12.5px; color: var(--ink2); margin-top: 6px; line-height: 1.6; }

.up { margin-top: 12px; padding: 13px 15px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface); }
.up--done { border-color: var(--lime); background: var(--lime-soft); }
.up--error { border-color: var(--bad); background: var(--bad-soft); }
.up__h { display: flex; align-items: baseline; gap: 10px; }
.up__h b { font-size: 14.5px; }
.up__v { margin-left: auto; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.up__v--none { font-size: 13.5px; font-weight: 400; color: var(--ink2); }
.up__bar { height: 10px; border-radius: 999px; background: #E1E4E8; margin: 10px 0 8px; overflow: hidden; }
.up__bar i { display: block; height: 100%; background: var(--lime); border-radius: 999px; }
.up__bar--none { background: repeating-linear-gradient(135deg, #E1E4E8 0 5px, #F3F4F6 5px 10px); }
.up__d { margin: 0; font-size: 12.5px; color: var(--ink2); line-height: 1.65; }
.up--error .up__d { color: var(--bad-ink); }
.btn { padding: 12px 22px; font: 700 14px/1 inherit; border: 0; border-radius: 12px;
  background: var(--lime); color: var(--ink); cursor: pointer; margin-top: 12px; }
.btn:disabled { background: var(--panel); color: var(--ink2); cursor: not-allowed; }

/* ── 활동 그래프 — 올리는 동안 **어디까지 갔는지** 보여 준다 ─────────
   ★ 막대 하나만 있으면 「멈춘 것 같은데 어디서 멈췄나」에 답할 수 없다.
     보내는 중과 서버가 읽는 중은 걸리는 이유가 다르다 — 앞은 회선, 뒤는 파일.
   ★ 움직임을 싫어하는 설정(prefers-reduced-motion)에서는 **색으로만** 말한다. */
.fx { margin-top: 12px; border: 1px solid var(--line); border-radius: 14px;
  background: var(--surface); padding: 15px 16px 11px; }
.fx--done { border-color: var(--lime); background: var(--lime-soft); }
.fx--dead { border-color: var(--bad); background: var(--bad-soft); }
.fx__g { display: flex; align-items: flex-start; }
.fx__n { flex: 0 0 auto; width: 76px; text-align: center; }
.fx__dot { position: relative; width: 30px; height: 30px; margin: 0 auto 7px;
  border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.fx__dot::after { content: ''; position: absolute; inset: 7px; border-radius: 50%;
  background: transparent; transition: background .2s; }
.fx__n--done .fx__dot { border-color: var(--lime); }
.fx__n--done .fx__dot::after { background: var(--lime); }
.fx__n--now .fx__dot { border-color: var(--lime); animation: fxPulse 1.2s ease-in-out infinite; }
.fx__n--now .fx__dot::after { background: var(--lime); }
.fx__n--dead .fx__dot { border-color: var(--bad); }
.fx__n--dead .fx__dot::after { background: var(--bad); }
.fx__t { font-size: 11.5px; color: var(--ink2); line-height: 1.35; word-break: keep-all; }
.fx__n--now .fx__t, .fx__n--done .fx__t { color: var(--ink); font-weight: 700; }
.fx__n--dead .fx__t { color: var(--bad-ink); font-weight: 700; }
.fx__l { position: relative; flex: 1 1 auto; height: 3px; margin-top: 15px;
  border-radius: 3px; background: var(--line); overflow: hidden; }
.fx__l--past { background: var(--lime); }
.fx__l--dead { background: var(--bad); }
.fx__l i { position: absolute; top: 0; bottom: 0; left: 0; width: 45%;
  background: linear-gradient(90deg, transparent, var(--lime), transparent); }
.fx__l--run i { animation: fxRun 1.05s linear infinite; }
@keyframes fxRun { from { transform: translateX(-110%); } to { transform: translateX(240%); } }
@keyframes fxPulse { 0%, 100% { box-shadow: 0 0 0 0 var(--lime-soft); }
  50% { box-shadow: 0 0 0 7px var(--lime-soft); } }
/* 흘러온 자취 — 진행률을 **시간축으로** 그린다. 멈춘 구간이 평평하게 남는다 */
.fx__c { margin-top: 11px; }
.fx__c svg { display: block; width: 100%; height: 56px; }
.fx__cap { margin: 5px 0 0; font-size: 11.5px; color: var(--ink2);
  font-variant-numeric: tabular-nums; line-height: 1.6; }
.fx__cap b { color: var(--ink); }

/* 끌어다 놓는 동안 — **붙일 자리를 눈에 띄게** 한다 */
.card--attach.dragover { border-color: var(--lime); box-shadow: 0 0 0 3px var(--lime-soft); }
.card--attach.dragover .drop { border-color: var(--lime); background: var(--lime-soft); }

/* 새 프로젝트 만들기 — 고르는 자리에서 바로 */
.new { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 11px; }
.new input { flex: 1 1 320px; min-width: 0; font: 400 14px/1.4 inherit;
  padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); }
.new input:focus-visible { outline: 2px solid var(--lime-deep); outline-offset: 2px; }
.new .btn { margin-top: 0; }

@media (prefers-reduced-motion: reduce) {
  .fx__l--run i { animation: none; opacity: .5; }
  .fx__n--now .fx__dot { animation: none; }
}

/* 토큰이 안 실렸을 때의 경고는 토큰 없이도 보여야 한다 — 색을 직접 칠한다 */
.nostyle { border: 1px solid #F3C6C6; background: #FDECEC; color: #8F1D1D;
  border-radius: 12px; padding: 13px 15px; margin-bottom: 12px; font-size: 13.5px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap" id="view"></div>

<script src="gate-core.js"></script>
<script src="flow-core.js"></script>
<script src="upload-core.js"></script>
<script>
/**
 * 붙이는 쪽이 채우는 유일한 값.
 *   api      '/api/linkpilot'
 *   session  { name, planId, status }
 *   inTab    탭 안이면 true — 제목을 그리지 않는다 (탭 바가 이미 이름을 말한다)
 */
window.LINKPILOT_FILES = {
  api: null,
  session: null,
  projectId: null,
  inTab: false,
  preload: null,
  // 자료를 넣는 길은 **무료**다 — 유료면 Pro 를 살지 판단할 자료조차 못 넣는다
  requiredPlan: 'free',
  /* ── 앱 프로젝트 가져오기 (2026-08-20 요청) ──────────────────────────
     앱(LinkPilot)에 등록된 프로젝트에서 골라 엔진 프로젝트로 잇는다.
     appProjects  [{id, title, client, owner}]  — 앱이 자기 목록을 내려준다 (이 화면은 앱 데이터를 못 읽는다)
     appLinks     { <앱 프로젝트 id>: <엔진 프로젝트 id> } — 이미 이어진 짝. **저장은 앱이 한다**
     이 화면은 처음 잇는 순간 부모에게 postMessage { type:'lp-app-project-linked',
     appProjectId, imProjectId } 로 알리고, 앱이 그 짝을 기억해 다음에 내려준다.
     — 매핑을 여기(엔진 쪽)에 저장하면 앱 데이터의 정본이 둘이 된다. */
  appProjects: null,
  appLinks: null,
  /* ── 앱에서 가져오는 자료 셋 (2026-08-20 요청) ───────────────────────
     앱 프로젝트 하나가 들고 있는 것을 **셋으로 나눠** 받는다. 셋은 가는 곳이
     다르고, 되돌릴 수 있는 정도도 다르다.

       ① 프로젝트 내용  content  { summary, facts:[{key,value,unit,quote}], notes }
       ② 첨부파일       files    [{ name, bytes, mime, ref, access }]
       ③ 이미지파일     images   [{ name, bytes, mime, ref, access }]

     목록(appProjects)에는 **개수만** 실어도 된다. 실제 내용은 고른 그때
     `fetchAppProject(appId)` 로 받는다 — 딜 54건의 첨부를 처음부터 다 내려받으면
     탭 여는 데만 한참 걸린다.

       fetchAppProject: (appId) => Promise<{ content, files, images }>

     `ref`·`access` 의 뜻은 pickFrom 과 **같다** (§2-1) — `ref` 는 장부에 남고
     `access` 는 안 남는다. 같은 규칙을 두 벌로 만들지 않는다. */
  fetchAppProject: null,
  planNames: { free: 'Free', basic: 'Basic', pro: 'Pro', business: 'Business' },
};
</script>
<!-- 부모(앱)가 채운 설정을 받아 병합한다. 단독으로 열면 아무 일도 하지 않는다 -->
<script src="embed-bridge.js" data-lp-global="LINKPILOT_FILES"></script>
<script>
(function () {
  'use strict';
  var C = window.LINKPILOT_FILES;
  var F = window.LinkPilotFlow;
  var UP = window.LinkPilotUpload;
  var view = document.getElementById('view');

  var state = {
    projects: null,
    projectId: C.projectId || null,
    kept: null,        // 보관 목록 (GET /sources)
    linked: null,      // 연결 목록 (GET /linked)
    oneshot: null,     // 1회성 기록 (GET /oneshot)
    // 「아직 안 붙었다」를 길별로 따로 들고 있는다 — 하나가 닫혔다고 셋 다
    // 닫힌 것처럼 그리면 열려 있는 길까지 못 쓴다
    closed: { kept: null, linked: null, oneshot: null },
    error: null,
    // 서버가 「로그인이 필요합니다 / 플랜이 모자랍니다」라고 한 경우 — 오류와 구분한다
    gate: null,
    busy: false,
    linkMsg: null,   // 연결 갈래에서 사용자가 볼 한 줄
    appMsg: null,    // 앱 프로젝트 가져오기의 진행·실패 한 줄
    appBundle: null, // 앱이 준 셋 — { appId, content, files, images }
    appPick: { content: true, files: true, images: true },  // 무엇을 가져올까
    appStage: -1,    // 가져오는 중 어느 칸인지 (-1 = 안 하는 중)
    appDead: false,
    appReport: null, // 가져온 결과 — **거절된 것을 숨기지 않는다**
    noFolder: false, // 앱 딜은 있는데 작업 폴더가 없는 경우
    // ── 첨부 (2026-08-20) ─────────────────────────────────────────────
    // 전에는 세 갈래가 **설명만**이었다. 무엇이 다른지는 알려 주는데 정작
    // 여기서 올릴 수는 없어서, 자료를 넣으려면 1단계로 되돌아가야 했다.
    way: 'linked',     // 'linked' | 'oneshot'  (보관은 뺐다 — 2026-08-20)
    picked: [],        // 고른 파일 — { name, size, data, error }
    upload: null,      // 올리는 중 상태 (upload-core 가 준 그대로)
    result: null,      // 서버 응답
    limits: null,      // GET /intake 가 준 한도 — 화면에 박아 두지 않는다
    // ── 활동 그래프 (2026-08-20) ─────────────────────────────────────
    // 진행률을 **시간축으로** 모아 둔다. 막대만 있으면 「멈춘 것 같은데
    // 어디서 멈췄나」에 답할 수 없다 — 평평한 구간이 그 답이다.
    trace: [],         // [{ ms, pct }] — pct 를 모르는 순간은 담지 않는다
    traceAt0: 0,       // 시작 시각 (성능 시계, 벽시계가 아니다)
    failStage: 1,      // 올리다 죽었다면 **어느 칸에서** 죽었나
    linkStage: -1,     // 연결 갈래가 지금 어느 칸인지 (-1 = 안 하는 중)
    linkDead: false,   // 연결이 그 칸에서 멈췄나
    dropMsg: null,     // 끌어다 놓았는데 받을 수 없을 때 하는 말
    newProj: null,     // { text, busy, error } — 새 프로젝트 만들기
  };

  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (x !== undefined && x !== null && x !== '') n.textContent = String(x);
    return n;
  }
  function add(p) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) p.appendChild(arguments[i]); return p; }

  /** 흐른 시간을 재는 시계. 벽시계가 아니라 **단조 시계**다 — 자정·시간대에 안 흔들린다 */
  function now() {
    return (window.performance && performance.now) ? performance.now() : Date.now();
  }

  function size(b) {
    if (!(b > 0)) return '0 B';
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
    return (b / (1024 * 1024)).toFixed(1) + ' MB';
  }

  /**
   * ★★ **501 을 예외로 던지지 않는다.** 던지면 화면이 빨간 「서버 오류」를 그리는데,
   *   그건 고장이 아니라 **아직 안 붙은 상태**다. 상태와 고장을 같은 색으로
   *   칠하면 사용자는 고쳐 달라고 문의한다.
   * @returns {{ok:true, body}|{ok:false, closed:string}|throws}
   */
  /**
   * @param {{localGate?:boolean}} [opt2] `localGate` 면 401·403 을 **화면 전체
   *   게이트로 올리지 않고** 부른 쪽에 돌려준다. 한 칸에서 등급이 모자란 것
   *   때문에 탭 전체가 잠겨 버리면, 열려 있는 나머지 길까지 못 쓴다.
   */
  function call(method, path, body, opt2) {
    var opt = { method: method, credentials: 'same-origin' };
    if (body) { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
    return fetch(C.api + path, opt).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) {
        if (r.status === 501) return { ok: false, closed: (b && b.error) || '아직 붙어 있지 않습니다' };
        if ((r.status === 401 || r.status === 403) && opt2 && opt2.localGate) {
          return { ok: false, gated: true, msg: (b && b.error) || '사용할 수 없습니다' };
        }
        // ★★ 401·403 도 **고장이 아니다.** 로그인하지 않았거나 등급이 모자란 것은
        //   상태이지 오류가 아닌데, 빨간 오류로 그리면 고장으로 읽혀 문의가 온다.
        //   (501 은 조심했는데 이건 놓쳤었다 — 2026-08-18)
        if (r.status === 401 || r.status === 403) {
          state.gate = (b && b.error) || '사용할 수 없습니다';
          return { ok: false, gated: true };
        }
        if (!r.ok) throw new Error((b && b.error) || ('서버 오류 (' + r.status + ')'));
        return { ok: true, body: b };
      });
    });
  }

  /* ── 불러오기 ─────────────────────────────────────────── */

  function loadProjects() {
    if (C.preload && C.preload.projects) { state.projects = C.preload.projects; return Promise.resolve(); }
    if (!C.api) { state.projects = []; return Promise.resolve(); }
    return call('GET', '/projects').then(function (r) {
      state.projects = (r.ok && r.body && r.body.projects) || [];
    }).catch(function (e) { state.error = e.message; state.projects = []; });
  }

  /** 세 갈래를 **각각** 부른다. 하나가 닫혀도 나머지는 그린다 */
  function loadOne(id) {
    if (!C.api || !id) return Promise.resolve();
    var base = '/projects/' + encodeURIComponent(id);
    var jobs = [
      call('GET', base + '/linked').then(function (r) {
        if (r.ok) { state.linked = r.body; state.closed.linked = null; }
        else { state.linked = null; state.closed.linked = r.closed; }
      }, function (e) { state.closed.linked = e.message; }),
      call('GET', base + '/oneshot').then(function (r) {
        if (r.ok) { state.oneshot = r.body; state.closed.oneshot = null; }
        else { state.oneshot = null; state.closed.oneshot = r.closed; }
      }, function (e) { state.closed.oneshot = e.message; }),
    ];
    return Promise.all(jobs);
  }

  /**
   * 프로젝트를 고른다. **부모(앱)에게도 알린다.**
   *
   * ★★ 왜 알리나: 이 탭에는 앱이 얹는 것이 하나 더 있다 —
   *   「외부 분석 AGENT 로 만들기(기반정보 내보내기)」. 그쪽이 프로젝트를 따로
   *   고르게 하면 **같은 탭에 프로젝트 고르기가 둘**이 되고, 둘이 다른 것을
   *   가리키는 순간 사용자는 **어느 프로젝트의 기반정보를 받았는지 모른다.**
   *   그래서 고르는 곳은 여기 하나로 두고, 앱은 이 알림을 따라간다.
   *
   * ★ 같은 출처로만 보낸다. 다른 출처면 브라우저가 막고, 그건 정상이다.
   */
  function announce(id) {
    var detail = { projectId: id || null };
    // ① iframe 으로 얹혔을 때 — 부모 창에 보낸다 (같은 출처로만)
    try {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'lp-files-project', projectId: detail.projectId },
          window.location.origin);
      }
    } catch (_) { /* 막혀 있으면 그만 — 이 화면의 동작은 그대로다 */ }
    // ② iframe 없이 앱 안에 바로 얹혔을 때 — 부모가 곧 같은 문서다.
    //    창 너머로 보낼 것이 없으므로 **문서 이벤트**로 알린다. 두 방식 중
    //    어느 쪽으로 얹든 앱이 받는 이름은 하나다 — 둘로 갈리면 한쪽만 고쳐진다
    try {
      document.dispatchEvent(new CustomEvent('lp-files-project', { detail: detail }));
    } catch (_) { /* 오래된 브라우저 */ }
  }

  function pickProject(id) {
    // ★ 「+ 새 프로젝트」를 고른 것은 **고르기가 아니라 만들기**다.
    //   여기서 몰래 만들지 않는다 — 무엇을 만들지 사람이 한 줄 적어야
    //   자산군이 정해진다. 안 적고 만들면 GEN 으로 굳는다 (§4)
    if (id === NEW_OPT) {
      state.newProj = { text: '', busy: false, error: null };
      return render();
    }
    state.newProj = null;
    state.dropMsg = null;
    // ★★ 앱 꾸러미를 **반드시 버린다.** 남겨 두면 다른 프로젝트를 고른 뒤에도
    //   앞 딜의 첨부가 「가져오기」에 남아 있고, 누르면 **엉뚱한 프로젝트에 붙는다**
    state.appBundle = null; state.appStage = -1; state.appReport = null;
    // ★ 작업 폴더가 없는 딜을 고른 경우 — 붙일 곳이 없다는 것을 말한다
    if (id && id.indexOf('ext:') === 0) {
      state.projectId = null;
      state.noFolder = true;
      state.linked = state.oneshot = null;
      announce(null);
      return render();
    }
    state.noFolder = false;
    state.projectId = id || null;
    state.linked = state.oneshot = null;
    state.closed = { kept: null, linked: null, oneshot: null };
    announce(state.projectId);
    render();
    if (id) loadOne(id).then(render);
  }

  /**
   * 앱 프로젝트를 골랐다 — 엔진 프로젝트로 잇는다.
   * 이미 이어져 있으면 그 프로젝트를 연다. 처음이면 만들어 잇고 **부모에게 알린다**
   * (짝의 저장은 앱 몫 — 여기 저장하면 앱 데이터의 정본이 둘이 된다).
   * ★ 실패는 조용히 두지 않는다 — 셀렉트 아래 한 줄로 사유를 말한다.
   */
  function pickAppProject(appId) {
    var apps = Array.isArray(C.appProjects) ? C.appProjects : [];
    var a = null;
    for (var i = 0; i < apps.length; i++) if (apps[i] && String(apps[i].id) === String(appId)) { a = apps[i]; break; }
    if (!a) { state.appMsg = '앱 프로젝트를 찾지 못했습니다 — 탭을 닫았다 다시 여세요.'; render(); return; }
    var linkedTo = (C.appLinks || {})[String(appId)] || null;
    if (linkedTo) {
      var known = (state.projects || []).some(function (p) { return p.id === linkedTo; });
      if (known) {
        state.appMsg = null;
        pickProject(linkedTo);
        return void pullBundle(appId);
      }
      /* 짝은 있는데 엔진에 그 프로젝트가 없다(지워졌다) — 아래에서 새로 만든다. 말없이 만들면
         "전에 올린 자료가 사라졌다"로 읽히므로 사유를 남긴다 */
      state.appMsg = '이어져 있던 보고서 프로젝트(' + linkedTo + ')가 엔진에 없어 새로 만듭니다.';
    }
    if (state.busy) return;
    state.busy = true;
    state.appMsg = '『' + (a.title || appId) + '』 보고서 프로젝트를 만드는 중…';
    render();
    call('POST', '/projects', {
      name: a.title || ('앱 프로젝트 ' + appId),
      request: '『' + (a.title || appId) + '』' + (a.client ? ' (' + a.client + ')' : '') + ' — LinkPilot 앱 프로젝트에서 가져와 만든 보고서 프로젝트',
    }).then(function (r) {
      state.busy = false;
      if (r.gated) { state.appMsg = null; render(); return; }       // 로그인·플랜 안내는 gate 가 말한다
      if (!r.ok || !r.body || !r.body.projectId) {
        state.appMsg = '보고서 프로젝트를 만들지 못했습니다: ' + ((r.body && r.body.error) || r.closed || '사유 없음');
        render(); return;
      }
      var imId = r.body.projectId;
      state.projects = state.projects || [];
      state.projects.unshift({ id: imId, name: a.title || imId });
      state.appMsg = null;
      /* 짝을 앱에 알린다 — announce() 와 같은 두 갈래(같은 출처 postMessage + 문서 이벤트) */
      var detail = { appProjectId: String(appId), imProjectId: imId };
      try {
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'lp-app-project-linked', appProjectId: detail.appProjectId, imProjectId: imId },
            window.location.origin);
        }
      } catch (_) { }
      try { document.dispatchEvent(new CustomEvent('lp-app-project-linked', { detail: detail })); } catch (_) { }
      if (!C.appLinks) C.appLinks = {};
      C.appLinks[String(appId)] = imId;
      pickProject(imId);
      pullBundle(appId);
    }, function (e) {
      state.busy = false;
      state.appMsg = '보고서 프로젝트를 만들지 못했습니다: ' + e.message;
      render();
    });
  }

  /**
   * 앱이 가진 셋을 읽어 둔다. **읽기와 가져오기를 나눈다** — 읽자마자 넣으면
   * 무엇이 들어오는지 보기 전에 들어와 있다.
   */
  function pullBundle(appId) {
    state.appBundle = null;
    state.appStage = -1; state.appDead = false; state.appReport = null;
    return loadAppBundle(appId).then(function (b) {
      state.appBundle = b ? { appId: String(appId), content: b.content,
        files: b.files, images: b.images } : null;
      render();
    }, function (e) {
      // 못 읽었으면 그렇다고 말한다 — 조용히 빈 화면을 두면 「자료가 없다」로 읽힌다
      state.appMsg = '앱에서 자료 목록을 읽지 못했습니다: ' + (e && e.message ? e.message : '사유 없음');
      render();
    });
  }

  /* ── 그리기 ───────────────────────────────────────────── */

  /**
   * 세 갈래 — **설명이자 고르는 자리다.**
   *
   * ★ 이름만 보면 셋 다 「업로드」로 읽힌다. 무엇이 다른지를 **고르기 전에** 말한다.
   *   연결은 사본을 만들지 않고, 1회성은 읽고 버린다 — 올린 뒤에 알면 늦다.
   *
   * ★ 전에는 이 셋이 **설명만**이었다. 그래서 차이는 알려 주는데 정작 여기서
   *   올릴 수는 없었고, 자료를 넣으려면 1단계로 되돌아가야 했다. 지금은 고르면
   *   그 자리에서 붙인다.
   */
  // ★ 「올려서 보관」은 뺐다 〈2026-08-20 사용자 결정 — 불필요〉.
  //   서버 API(`POST /sources`)는 그대로 있다. 화면에서 그 길로 들어가지 않을 뿐이다.
  var WAYS = [
    { id: 'linked', t: '폴더를 연결해서', k: '무료', free: true, plan: 'free',
      d: 'Dropbox·Box·구글·원드라이브의 파일을 가리킵니다. 사본을 만들지 않습니다 — 읽을 때만 잠깐 가져와 버립니다.' },
    { id: 'oneshot', t: '파일업로드(1회성)', k: '무료', free: true, plan: 'free',
      d: '읽고 바로 버립니다. 보관하지 않으므로 다시 쓸 수 없고, 원본이 그대로인지도 확인할 수 없습니다.' },
  ];

  function wayOf(id) {
    for (var i = 0; i < WAYS.length; i++) if (WAYS[i].id === id) return WAYS[i];
    return WAYS[0];
  }

  function ways() {
    var box = el('div', 'pickway');
    WAYS.forEach(function (w) {
      var b = el('button', 'pw' + (state.way === w.id ? ' on' : ''));
      b.type = 'button';
      var t = el('div', 'pw__t', w.t);
      t.appendChild(el('span', 'way__k way__k--' + (w.free ? 'free' : 'pro'), w.k));
      add(b, t, el('p', 'pw__d', w.d));
      b.addEventListener('click', function () {
        // 갈래를 바꾸면 고른 파일을 버린다 — 보관하려던 것이 1회성으로
        // 넘어가면 **되돌릴 수 없다.** 그 실수는 조용하고 되돌리기도 없다
        if (state.way !== w.id) { state.picked = []; state.upload = null; state.result = null; }
        state.way = w.id;
        render();
      });
      box.appendChild(b);
    });
    return box;
  }

  /** 고른 파일을 읽어 둔다. 읽기·보내기는 upload-core.js 한 곳에 있다 */
  function addFiles(list) {
    var max = (state.limits && state.limits.maxBytesPerFile) || 0;
    Array.prototype.forEach.call(list, function (f) {
      if (state.picked.some(function (x) { return x.name === f.name; })) return;
      var rec = { name: f.name, size: f.size, data: null, error: null,
        tooBig: UP.tooBig(f, max) };
      state.picked.push(rec);
      UP.readOne(f, function (err, data) {
        if (err) rec.error = err.message; else rec.data = data;
        render();
      });
    });
    render();
  }

  /** 파일을 고르는 자리. 끌어다 놓는 것도 받는다 */
  function dropZone() {
    var z = el('div', 'drop');
    z.tabIndex = 0;
    z.setAttribute('role', 'button');
    add(z, el('div', 'drop__t', '파일을 끌어다 놓거나 눌러서 고르세요'),
      el('div', 'drop__s', '여러 개를 한 번에 올릴 수 있습니다'));
    var inp = el('input');
    inp.type = 'file';
    inp.multiple = true;
    inp.addEventListener('change', function () { addFiles(inp.files); inp.value = ''; });
    z.appendChild(inp);
    z.addEventListener('click', function () { inp.click(); });
    z.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); inp.click(); }
    });
    z.addEventListener('dragover', function (ev) { ev.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', function () { z.classList.remove('over'); });
    z.addEventListener('drop', function (ev) {
      ev.preventDefault(); z.classList.remove('over');
      addFiles(ev.dataTransfer && ev.dataTransfer.files);
    });
    return z;
  }

  /** 고른 파일 목록. **못 올릴 것은 올리기 전에 그렇다고 적는다** */
  function pickedList() {
    var out = document.createDocumentFragment();
    state.picked.forEach(function (f, i) {
      var r = el('div', 'row');
      var left = el('div');
      left.appendChild(el('div', 'row__n', f.name));
      var why = f.error ? f.error
        : f.tooBig ? ('파일이 너무 큽니다 — ' + size(f.size) + ' (한도 ' + size(state.limits.maxBytesPerFile) + ')')
        : f.data ? size(f.size) : '읽는 중…';
      left.appendChild(el('div', 'row__m', why));
      r.appendChild(left);
      var x = el('button', 'btn2', '빼기');
      x.type = 'button';
      x.addEventListener('click', function () { state.picked.splice(i, 1); render(); });
      r.appendChild(x);
      out.appendChild(r);
    });
    return out;
  }

  /* ── 활동 그래프 ─────────────────────────────────────────
   *
   * ★★ 왜 만들었나: 막대 하나로는 **어디서 걸렸는지** 알 수 없다. 「보내는 중」이
   *   오래 걸리는 것과 「서버가 읽는 중」이 오래 걸리는 것은 원인이 다르다 —
   *   앞은 회선, 뒤는 파일(스캔본이면 오래 걸린다). 둘을 같은 막대로 그리면
   *   사용자는 고장으로 읽고 창을 닫는다. 실제로 닫으면 올린 것이 없다.
   *
   * ★ 두 가지를 함께 그린다:
   *     ① **칸** — 지금 어느 단계인가 (지난 칸·도는 칸·죽은 칸)
   *     ② **자취** — 진행률을 시간축으로. 멈춘 구간이 **평평하게 남는다**
   *
   * ★ 자취는 **잰 것만** 그린다. 진행률을 모르는 순간은 담지 않는다 —
   *   모르는 값을 0 으로 이으면 그래프가 뚝 떨어지고 「되돌아갔다」로 읽힌다.
   */

  var SVGNS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k)) n.setAttribute(k, attrs[k]);
    return n;
  }

  /**
   * 자취 그림. 점이 둘 미만이면 **그리지 않는다** — 점 하나로 그은 선은
   * 아무 뜻이 없는데 그럴듯해 보인다.
   */
  function traceChart(pts) {
    if (!pts || pts.length < 2) return null;
    var W = 300, H = 56, PAD = 3;
    var last = pts[pts.length - 1].ms || 1;
    var x = function (p) { return PAD + (W - PAD * 2) * (last ? (p.ms / last) : 0); };
    var y = function (p) { return PAD + (H - PAD * 2) * (1 - Math.max(0, Math.min(100, p.pct)) / 100); };
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(p).toFixed(1) + ' ' + y(p).toFixed(1); }).join(' ');

    var box = el('div', 'fx__c');
    var g = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none',
      role: 'img', 'aria-label': '올린 양이 시간에 따라 어떻게 늘었는지' });
    // 바탕 눈금 — 50% 자리 하나만. 여럿 그으면 자취가 안 보인다
    g.appendChild(svg('line', { x1: 0, y1: (H / 2).toFixed(1), x2: W, y2: (H / 2).toFixed(1),
      stroke: 'var(--line)', 'stroke-width': 1, 'stroke-dasharray': '3 4' }));
    g.appendChild(svg('path', { d: line + ' L' + x(pts[pts.length - 1]).toFixed(1) + ' ' + (H - PAD)
      + ' L' + x(pts[0]).toFixed(1) + ' ' + (H - PAD) + ' Z',
      fill: 'var(--lime-soft)', stroke: 'none' }));
    g.appendChild(svg('path', { d: line, fill: 'none', stroke: 'var(--lime-deep)',
      'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
      'vector-effect': 'non-scaling-stroke' }));
    g.appendChild(svg('circle', { cx: x(pts[pts.length - 1]).toFixed(1),
      cy: y(pts[pts.length - 1]).toFixed(1), r: 3, fill: 'var(--lime-deep)' }));
    box.appendChild(g);
    box.appendChild(el('p', 'fx__cap',
      '지난 ' + (last / 1000).toFixed(1) + '초 · ' + pts.length + '번 쟀습니다'));
    return box;
  }

  /**
   * 칸 + 자취. `at` 은 **지금 도는 칸**, `dead` 면 그 칸에서 멈춘 것이다.
   * @param {{stages:string[], at:number, dead?:boolean, pct?:number, note?:string, pts?:Array}} o
   */
  function activityGraph(o) {
    var done = !o.dead && o.at >= o.stages.length - 1;
    var box = el('div', 'fx' + (done ? ' fx--done' : o.dead ? ' fx--dead' : ''));

    var g = el('div', 'fx__g');
    o.stages.forEach(function (t, i) {
      if (i) {
        // 칸 사이의 선: 지나온 곳은 채우고, **지금 건너는 곳만** 흐른다.
        // 다 흐르게 두면 끝난 뒤에도 도는 것처럼 보인다
        var crossing = !o.dead && !done && i === o.at + 1;
        var past = i <= o.at;
        var l = el('div', 'fx__l' + (past ? ' fx__l--past' : '')
          + (o.dead && i === o.at + 1 ? ' fx__l--dead' : '')
          + (crossing ? ' fx__l--run' : ''));
        if (crossing) l.appendChild(el('i'));
        g.appendChild(l);
      }
      var state2 = o.dead && i === o.at ? 'dead' : i < o.at ? 'done' : i === o.at ? (done ? 'done' : 'now') : '';
      var n = el('div', 'fx__n' + (state2 ? ' fx__n--' + state2 : ''));
      n.appendChild(el('div', 'fx__dot'));
      n.appendChild(el('div', 'fx__t', t));
      g.appendChild(n);
    });
    box.appendChild(g);

    var chart = traceChart(o.pts);
    if (chart) box.appendChild(chart);
    else if (o.note) box.appendChild(el('p', 'fx__cap', o.note));
    return box;
  }

  /** 올리는 갈래의 칸 이름 — 한 곳에서 정한다 */
  var UP_STAGES = ['고른 파일', '보내는 중', '서버가 읽는 중', '붙었습니다'];

  function uploadStage(u) {
    if (!u) return 0;
    if (u.phase === 'sending') return 1;
    if (u.phase === 'reading') return 2;
    if (u.phase === 'done') return 3;
    return -1;   // 'error' — 어느 칸에서 죽었는지는 부르는 쪽이 안다
  }

  /** 진행 바 한 칸. **모르는 값은 막대가 아니라 빗금이다** */
  function progressBar(pct) {
    var bar = el('div', 'up__bar' + (pct === null || pct === undefined ? ' up__bar--none' : ''));
    if (pct !== null && pct !== undefined) {
      var i = el('i');
      i.style.width = Math.max(0, Math.min(100, pct)) + '%';
      bar.appendChild(i);
    }
    return bar;
  }

  /** 올리는 중·끝난 뒤. **거절된 것을 숨기지 않는다** */
  function uploadCard() {
    var u = state.upload;
    if (!u) return null;
    var box = el('div', 'up' + (u.phase === 'done' ? ' up--done' : u.phase === 'error' ? ' up--error' : ''));

    // ★ 그래프를 **맨 위에** 둔다. 「어디까지 갔나」가 먼저 보여야 한다 —
    //   숫자만 먼저 보면 멈춘 것인지 도는 것인지 알 수 없다
    var at = uploadStage(u);
    box.appendChild(activityGraph({
      stages: UP_STAGES,
      at: at < 0 ? state.failStage : at,
      dead: u.phase === 'error',
      pts: state.trace,
      note: '진행률을 잴 수 없는 회선입니다 — 자취를 그리지 않습니다.',
    }));

    var h = el('div', 'up__h');
    h.appendChild(el('b', null,
      u.phase === 'sending' ? '보내는 중'
        : u.phase === 'reading' ? '서버가 읽는 중'
        : u.phase === 'done' ? '올렸습니다' : '올리지 못했습니다'));
    h.appendChild(el('span', 'up__v' + (u.pct === null || u.pct === undefined ? ' up__v--none' : ''),
      (u.pct === null || u.pct === undefined) ? '진행률을 알 수 없습니다' : (u.pct + '%')));
    box.appendChild(h);
    if (u.phase === 'sending' || u.phase === 'reading') box.appendChild(progressBar(u.pct));

    if (u.phase === 'reading') {
      box.appendChild(el('p', 'up__d',
        '다 보냈습니다. 서버가 파일을 열어 읽는 중입니다 — 스캔본이면 더 걸립니다.'));
    } else if (u.phase === 'error') {
      box.appendChild(el('p', 'up__d', u.error));
    } else if (u.phase === 'done' && state.result) {
      box.appendChild(el('p', 'up__d', UP.summary(state.result)));
      // ★ 거절 사유를 접어 두지 않는다. 「올렸습니다」만 보면 다 올라간 줄 안다
      (state.result.rejected || []).forEach(function (r) {
        box.appendChild(el('p', 'up__d', '· ' + r.name + ' — ' + r.reason));
      });
      if (state.result.replaced && state.result.replaced.length) {
        box.appendChild(el('p', 'up__d',
          '같은 이름이 있어 이전 판은 휴지통으로 보냈습니다: ' + state.result.replaced.join(' · ')));
      }
    }
    return box;
  }

  /** 실제로 보낸다. 갈래마다 **주소가 다르다** */
  function doUpload() {
    var ready = state.picked.filter(function (f) { return f.data && !f.tooBig; });
    if (!ready.length || !state.projectId || state.busy) return;
    // ★ 화면에 남은 올리는 길은 **1회성 하나뿐**이다 (보관은 뺐다).
    //   그런데도 갈래를 확인하고 보낸다 — 나중에 길이 늘 때 조용히 엉뚱한 곳으로
    //   가지 않게 한다
    if (state.way !== 'oneshot') return;
    var path = '/oneshot';

    state.busy = true; state.result = null; state.error = null;
    // 자취는 **이번 올리기 것만** 모은다. 안 비우면 지난 판이 앞에 붙어
    // 「예전에 한 번 갔다가 되돌아왔다」처럼 보인다
    state.trace = []; state.traceAt0 = now(); state.failStage = 1;
    UP.send({
      url: C.api + '/projects/' + state.projectId + path,
      files: ready.map(function (f) { return { name: f.name, contentBase64: f.data }; }),
      onUpdate: function (u) {
        state.upload = u;
        var at = uploadStage(u);
        if (at > 0) state.failStage = at;   // 죽으면 **여기서** 죽은 것이다
        // ★ 모르는 값은 담지 않는다. 0 으로 이으면 선이 뚝 떨어져
        //   「되돌아갔다」로 읽힌다 — 실제로는 못 잰 것뿐이다
        if (u.pct !== null && u.pct !== undefined) {
          state.trace.push({ ms: now() - state.traceAt0, pct: u.pct });
          if (state.trace.length > 240) state.trace.shift();
        }
        render();
      },
      onDone: function (j) {
        state.busy = false; state.result = j; state.picked = [];
        // 올린 뒤 목록을 다시 읽는다 — 안 읽으면 방금 올린 것이 안 보인다
        loadOne(state.projectId).then(render);
      },
      onFail: function (why, status) {
        state.busy = false;
        // 401·403 은 **오류가 아니라 게이트**다 (빨간 상자로 그리면 고장으로 읽힌다)
        if (status === 401 || status === 403) state.gate = why;
        render();
      },
    });
  }

  /**
   * 첨부 — **한 자리에서 고르고, 그 자리에서 올린다.**
   *
   * ★ 갈래마다 할 수 있는 것이 다르다. 연결은 여기서 올리는 것이 아니라
   *   **가리키는 것**이라 파일 고르기가 없다 — 본체가 함수를 넘겨야 열린다.
   */
  function attachCard() {
    var card = el('section', 'card card--attach');
    add(card, el('h2', 'card__t', '자료 붙이기'),
      el('p', 'card__d',
        '기존 프로젝트 보고서를 만들거나 또는 신규 프로젝트로 만들 때, '
        + '관련자료를 올리는 방법 2가지입니다.'));
    card.appendChild(ways());
    // 끌어다 놓았는데 받을 수 없었던 이유를 **그 자리에서** 말한다.
    // ★ 갈래보다 먼저 그린다 — 그 말이 가장 필요한 때가 「연결」 갈래에서
    //   떨어뜨린 때인데, 갈래 안쪽에 두면 그때 안 보인다
    if (state.dropMsg) card.appendChild(el('p', 'note', state.dropMsg));

    var w = wayOf(state.way);

    if (!state.projectId) {
      card.appendChild(el('p', 'note', state.noFolder
        // ★ 화면이 몰래 만들지 않는다 — 번호가 소모되고 자산군이 GEN 으로 굳는다 (§4)
        ? '이 프로젝트는 작업 폴더가 아직 없습니다. 「보고서 생성」 1단계에서 먼저 만드십시오.'
        : '프로젝트를 먼저 고르면 여기서 바로 올릴 수 있습니다.'));
      return card;
    }

    // 연결 — 여기서 올리는 것이 아니라 **가리키는** 것이다
    if (state.way === 'linked') {
      card.appendChild(linkPicker());
      // 연결도 **과정이 있다.** 창을 열고, 권한을 확인하고, 장부에 적는다.
      //   그 사이 아무 말이 없으면 눌러도 안 되는 줄 안다
      if (state.linkStage >= 0) {
        card.appendChild(activityGraph({
          stages: LINK_STAGES, at: state.linkStage, dead: state.linkDead,
          note: state.linkDead ? '이 칸에서 멈췄습니다.' : '고른 파일을 가리키는 중입니다 — 사본을 만들지 않습니다.',
        }));
      }
      return card;
    }

    card.appendChild(dropZone());
    // ★ 한도를 **모르면 적지 않는다.** 모르는 값을 0 으로 그리면 「못 올린다」로 읽힌다
    if (state.limits && state.limits.maxBytesPerFile > 0) {
      card.appendChild(el('p', 'note',
        '파일 하나 ' + size(state.limits.maxBytesPerFile)
        + ' · 한 번에 ' + size(state.limits.maxBytesPerRequest) + ' 까지 올릴 수 있습니다.'));
    }
    card.appendChild(pickedList());

    var ready = state.picked.filter(function (f) { return f.data && !f.tooBig; });
    var go = el('button', 'btn', state.way === 'oneshot' ? '파일업로드(1회성)' : '올려서 보관');
    go.type = 'button';
    go.disabled = !ready.length || state.busy;
    go.addEventListener('click', doUpload);
    card.appendChild(go);

    var up = uploadCard();
    if (up) card.appendChild(up);
    return card;
  }

  /** 아직 안 붙은 길. **오류가 아니라 상태**로 그린다 */
  function waitBox(title, why) {
    var b = el('div', 'wait');
    b.appendChild(el('div', 'wait__t', title));
    b.appendChild(el('div', 'wait__d', why));
    return b;
  }

  /**
   * 연결 — 제공자 창을 열어 **고른 파일을 가리킨다** 〈2026-08-20〉.
   *
   * ★★ 제공자 창(Dropbox·Box·구글·원드라이브)은 **앱이 연다.** 그쪽에 계정과
   *   SDK 가 있고, 엔진은 어느 계정인지 모른다. 앱이 넘겨 주는 함수는 하나다:
   *
   *     window.LINKPILOT_FILES.pickFrom(provider)
   *        → Promise<{ ref:{provider,fileId,name,rev,path?,bytes?}, access:{url,expiresAt?} }>
   *
   * ★ `ref` 는 **장부에 남는다.** `access` 는 **남지 않는다** — 서버가 잠깐
   *   들고 있다가 시간이 지나면 스스로 버린다 (`core/handoff.js`).
   *   장부에 열쇠를 두지 않는다는 규칙은 그대로다.
   */
  function linkPicker() {
    var box = document.createDocumentFragment();
    var names = ((state.linked && state.linked.providers) || []);

    // ★★ **누를 수 없는 것을 누를 수 있게 두지 않는다** 〈2026-08-20 실측〉.
    //   전에는 넷을 다 그려 놓고, 누르면 **브라우저 탓을 하는 문장**이 떴다.
    //   브라우저는 아무 잘못이 없었다 — 앱이 고르기 창을 넘기지 않았거나 제공자
    //   콘솔 등록이 안 된 것이다. 사용자는 그 문장을 읽고 브라우저를 바꾸러 간다.
    //   원인을 틀리게 말하는 것이 아무 말도 안 하는 것보다 나쁘다.
    //   ★ 그 문장을 **여기 주석에도 적지 않는다** — 적으면 그것을 찾는 검사가
    //     주석에 걸려 통과하고, 막는 장치가 조용히 죽는다 (M-08 · 실제로 두 번)
    var canOpen = typeof C.pickFrom === 'function';

    var row = el('div', 'ext');
    row.style.display = 'flex';
    row.style.gap = '8px';
    row.style.flexWrap = 'wrap';
    row.style.marginTop = '12px';

    var blocked = [];
    names.forEach(function (p) {
      // `configured` 가 아예 안 오면(옛 서버) **막지 않는다** — 모르는 것을
      // 「안 된다」로 그리면 되는 것까지 못 쓰게 된다
      var registered = (p.configured === undefined) ? true : !!p.configured;
      var open = canOpen && registered;
      var b = el('button', 'btn2', p.name);
      b.type = 'button';
      b.disabled = !open;
      b.style.cssText = 'font:700 13px/1 inherit;padding:10px 14px;border-radius:10px;'
        + 'border:1px solid var(--line);color:var(--ink);'
        + (open ? 'background:var(--surface);cursor:pointer'
          : 'background:var(--panel);color:var(--ink2);cursor:not-allowed');
      if (open) b.addEventListener('click', function () { pickFrom(p.id, b); });
      else if (!registered) blocked.push(p.name);
      row.appendChild(b);
    });
    box.appendChild(row);

    // ★ **무엇이 빠졌는지**를 말한다. 둘은 고치는 사람이 다르다 —
    //   고르기 창은 앱이 붙이고, 등록은 제공자 콘솔에서 한다
    if (!canOpen) {
      box.appendChild(el('p', 'note',
        '파일 고르기 창이 아직 연결되지 않았습니다 — 준비되면 위 단추가 열립니다. '
        + '지금 자료를 넣으려면 「파일업로드(1회성)」를 쓰십시오.'));
    } else if (blocked.length) {
      box.appendChild(el('p', 'note',
        blocked.join(' · ') + ' 는 아직 등록되지 않았습니다 — 관리자에게 저장소 등록을 요청하십시오.'));
    }

    if (state.linkMsg) box.appendChild(el('p', 'note', state.linkMsg));
    return box;
  }

  /**
   * 새 프로젝트 만들기 — **고르는 자리에서 바로** 〈2026-08-20 사용자 지시〉.
   *
   * ★★ 화면이 몰래 만들지 않는다. 무엇을 만들지 **사람이 한 줄 적는다** —
   *   그 문장에서 자산군이 정해지기 때문이다. 빈 채로 만들면 자산군이 GEN 으로
   *   굳고, 굳은 뒤에는 보고서 목차가 통째로 어긋난다 (프로젝트-연결-규칙 §4).
   *
   * ★ 만드는 것은 **Pro 부터**다. 등급이 모자라면 그 말을 **이 칸에서** 한다 —
   *   화면 전체를 잠그면 이미 있는 프로젝트에 자료 붙이는 것까지 막힌다.
   */
  var NEW_OPT = 'new:';

  function newProjectCard() {
    var n = state.newProj;
    if (!n) return null;
    var card = el('section', 'card');
    add(card, el('h2', 'card__t', '신규프로젝트'),
      el('p', 'card__d', '무엇을 만들지 한 줄로 적어 주십시오. '
        + '이 문장에서 자산군과 목차가 정해집니다 — 비워 두면 정할 수 없습니다.'));

    var row = el('div', 'new');
    var inp = el('input');
    inp.type = 'text';
    inp.value = n.text;
    inp.placeholder = '예: 인천 남동공단 6.5MW 데이터센터 IM 작성';
    inp.disabled = !!n.busy;
    inp.addEventListener('input', function () { n.text = inp.value; b.disabled = n.busy || inp.value.trim().length < 5; });
    var b = el('button', 'btn', n.busy ? '만드는 중…' : '만들기');
    b.type = 'button';
    b.disabled = n.busy || n.text.trim().length < 5;
    b.addEventListener('click', function () { createProject(n.text); });
    inp.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !b.disabled) { ev.preventDefault(); createProject(n.text); }
    });
    add(row, inp, b);
    card.appendChild(row);

    if (n.busy) {
      card.appendChild(activityGraph({
        stages: NEW_STAGES, at: 1, note: '요청문에서 자산군과 목차를 정하는 중입니다.',
      }));
    }
    if (n.error) card.appendChild(el('p', 'note', n.error));
    return card;
  }

  var NEW_STAGES = ['적은 문장', '자산군 정하기', '작업 폴더', '만들었습니다'];

  function createProject(text) {
    var n = state.newProj;
    if (!n || n.busy) return;
    n.busy = true; n.error = null;
    render();
    // ★ 등급 부족을 **화면 전체 게이트로 올리지 않는다** (localGate).
    //   올리면 이미 있는 프로젝트에 자료 붙이는 것까지 같이 막힌다
    call('POST', '/projects', { request: String(text).trim() }, { localGate: true })
      .then(function (r) {
        n.busy = false;
        if (r && r.gated) { n.error = r.msg; return render(); }
        if (!r || !r.ok || !r.body || !r.body.projectId) {
          n.error = '만들지 못했습니다.'; return render();
        }
        var id = r.body.projectId;
        state.newProj = null;
        // 목록을 **다시 읽는다.** 안 읽으면 방금 만든 것이 고르기에 없다
        return loadProjects().then(function () {
          pickProject(id);
        });
      })
      .catch(function (e) {
        n.busy = false;
        n.error = (e && e.message) || '만들지 못했습니다.';
        render();
      });
  }

  /* ── 앱에서 가져오기 — 셋 ────────────────────────────────
   *
   * ★★ 앱 프로젝트 하나가 들고 있는 것을 **셋으로 나눠** 가져온다. 한 덩어리로
   *   받으면 무엇이 들어왔는지 사람이 모르고, **틀린 것 하나 때문에 전부를
   *   되돌려야 한다.**
   *
   *     ① 프로젝트 내용 → 값(fact)이 된다      `PUT /facts`
   *     ② 첨부파일      → 연결 장부에 적는다   `POST /linked`
   *     ③ 이미지파일    → 〃 (그림으로 표시)
   *
   * ★★ **엔진 라우트를 새로 내지 않았다.** 셋 다 이미 있는 길로 간다 —
   *   길을 새로 내면 인증·한도·거절 규칙이 두 벌이 되고, 한쪽만 고치는 날이 온다.
   *
   * ★★ **값에는 출처가 붙는다.** 앱에서 왔다는 것 자체가 출처다 —
   *   「LinkPilot 앱 · <딜 id> · <갱신일>」. 출처 없이 넣으면 서버가 거절하고,
   *   그게 맞다 (「출처 없는 숫자는 들어오지 못한다」).
   *
   * ★ **사전에 없는 항목은 값이 되지 않는다.** 앱의 자유 입력을 억지로 사전 항목에
   *   끼워 맞추지 않는다 — 맞춰 넣으면 문서에는 「출처 있는 값」으로 실린다.
   *   그런 것은 `notes` 로 받아 **보여만 준다.**
   */
  var APP_STAGES = ['앱에서 읽기', '프로젝트 내용', '자료 잇기', '가져왔습니다'];

  /**
   * 앱이 내부로 넘기는 출처 이름 — **서버가 알려 주지 않는 옛 판을 위한 대비값.**
   * 정본은 `GET /linked` 의 `appProvider` 다. 둘이 같은 값인지는 검사가 지킨다.
   */
  var APP_PROVIDER = 'linkpilot-app';

  /** 앱 목록에서 딜 하나를 찾는다 */
  function appEntry(appId) {
    var apps = Array.isArray(C.appProjects) ? C.appProjects : [];
    for (var i = 0; i < apps.length; i++) {
      if (apps[i] && String(apps[i].id) === String(appId)) return apps[i];
    }
    return null;
  }

  /**
   * 셋을 받아 온다. 앱이 함수를 주면 그것으로, 안 주면 목록에 실린 것으로.
   *
   * ★ 목록에 개수만 실어도 되게 둘 다 받는다 — 딜 54건의 첨부를 탭 열 때
   *   전부 내려받으면 여는 데만 한참 걸린다.
   */
  function loadAppBundle(appId) {
    var a = appEntry(appId) || {};
    var inline = { content: a.content || null, files: a.files || null, images: a.images || null };
    if (typeof C.fetchAppProject !== 'function') return Promise.resolve(inline);
    return Promise.resolve()
      .then(function () { return C.fetchAppProject(appId); })
      .then(function (got) {
        if (!got) return inline;
        return {
          content: got.content || inline.content,
          files: got.files || inline.files,
          images: got.images || inline.images,
        };
      });
  }

  function countOf(b) {
    if (!b) return { content: 0, files: 0, images: 0, notes: 0 };
    var c = b.content || {};
    return {
      content: (c.facts || []).length,
      notes: (c.notes || []).length,
      files: (b.files || []).length,
      images: (b.images || []).length,
    };
  }

  /**
   * 무엇을 가져올지 고르는 칸. **개수를 먼저 보여 준다** — 눌러 놓고 나서
   * 「이만큼이나 들어왔나」를 알면 늦다.
   */
  function appImportCard() {
    var b = state.appBundle;
    if (!b || !state.projectId) return null;
    var n = countOf(b);
    if (!n.content && !n.files && !n.images && !n.notes && !(b.content && b.content.summary)) return null;

    var card = el('section', 'card');
    add(card, el('h2', 'card__t', '앱에서 가져오기'),
      el('p', 'card__d', '앱 프로젝트가 들고 있는 것입니다. '
        + '가져올 것만 고르십시오 — 나중에 다시 가져올 수 있습니다.'));

    var rows = [
      { id: 'content', t: '프로젝트 내용', c: n.content,
        d: n.content ? (n.content + '개 항목이 값으로 들어갑니다 (출처는 앱으로 적힙니다)')
          : '값으로 넣을 항목이 없습니다' },
      { id: 'files', t: '첨부파일', c: n.files,
        d: n.files ? (n.files + '개를 가리킵니다 — 사본을 만들지 않습니다') : '첨부가 없습니다' },
      { id: 'images', t: '이미지파일', c: n.images,
        d: n.images ? (n.images + '개를 가리킵니다') : '이미지가 없습니다' },
    ];
    rows.forEach(function (r) {
      var row = el('div', 'row');
      var left = el('div', 'row__b');
      var lab = el('label');
      lab.style.cssText = 'display:flex;gap:9px;align-items:center;cursor:pointer';
      var cb = el('input');
      cb.type = 'checkbox';
      cb.checked = !!state.appPick[r.id] && r.c > 0;
      cb.disabled = !r.c || state.busy;
      cb.addEventListener('change', function () { state.appPick[r.id] = cb.checked; });
      lab.appendChild(cb);
      lab.appendChild(el('div', 'row__n', r.t + (r.c ? ' · ' + r.c + '개' : '')));
      left.appendChild(lab);
      left.appendChild(el('div', 'row__m', r.d));
      row.appendChild(left);
      card.appendChild(row);
    });

    // ★ 사전에 없어 값이 될 수 없는 것 — **숨기지 않고 그렇다고 적는다**
    if (n.notes) {
      card.appendChild(el('p', 'note',
        '값으로 넣을 수 없는 메모 ' + n.notes + '건은 가져오지 않습니다 — '
        + '사전에 없는 항목을 값으로 넣으면 문서에 「출처 있는 값」으로 실립니다.'));
    }

    var go = el('button', 'btn', state.busy ? '가져오는 중…' : '가져오기');
    go.type = 'button';
    go.disabled = state.busy || !(state.appPick.content || state.appPick.files || state.appPick.images);
    go.addEventListener('click', importFromApp);
    card.appendChild(go);

    if (state.appStage >= 0) {
      card.appendChild(activityGraph({
        stages: APP_STAGES, at: state.appStage, dead: state.appDead,
        note: state.appDead ? '이 칸에서 멈췄습니다.' : '앱이 가진 것을 이 프로젝트로 옮기는 중입니다.',
      }));
    }
    if (state.appReport) card.appendChild(appReportBox(state.appReport));
    return card;
  }

  /** 가져온 결과. **거절된 것을 접어 두지 않는다** */
  function appReportBox(rep) {
    var box = el('div', 'up' + (rep.failed ? ' up--error' : ' up--done'));
    box.appendChild(el('p', 'up__d',
      '값 ' + rep.facts + '개 · 첨부 ' + rep.files + '개 · 이미지 ' + rep.images + '개를 가져왔습니다.'));
    (rep.rejected || []).forEach(function (r) {
      box.appendChild(el('p', 'up__d', '· ' + r.what + ' — ' + r.why));
    });
    return box;
  }

  /**
   * 실제로 가져온다. **하나가 실패해도 나머지는 간다** — 한 건 때문에 전부를
   * 되돌리면 사용자는 무엇이 들어왔는지 모르는 채 처음부터 다시 한다.
   */
  function importFromApp() {
    var b = state.appBundle;
    if (!b || state.busy || !state.projectId) return;
    var base = '/projects/' + encodeURIComponent(state.projectId);
    var rep = { facts: 0, files: 0, images: 0, rejected: [], failed: false };

    state.busy = true; state.appReport = null; state.appDead = false;
    state.appStage = 0; render();

    // ① 프로젝트 내용 → 값. **출처를 붙여 보낸다**
    var step1 = Promise.resolve();
    var facts = (state.appPick.content && b.content && b.content.facts) || [];
    if (facts.length) {
      state.appStage = 1; render();
      var src = 'LinkPilot 앱 · ' + (b.appId || '딜')
        + ((b.content && b.content.updatedAt) ? ' · ' + b.content.updatedAt : '');
      step1 = call('PUT', base + '/facts', {
        facts: facts.map(function (f) {
          return { key: f.key, value: f.value, unit: f.unit || null,
            quote: f.quote || null, source: f.source || src };
        }),
      }, { localGate: true }).then(function (r) {
        if (r && r.ok && r.body) {
          rep.facts = (r.body.saved || []).length;
          (r.body.rejected || []).forEach(function (x) {
            rep.rejected.push({ what: x.key, why: x.reason });
          });
        } else {
          rep.failed = true;
          rep.rejected.push({ what: '프로젝트 내용', why: (r && (r.msg || r.closed)) || '넣지 못했습니다' });
        }
      }, function (e) {
        rep.failed = true;
        rep.rejected.push({ what: '프로젝트 내용', why: e.message });
      });
    }

    // ② 첨부 · ③ 이미지 → 연결 장부. **하나씩** 보낸다 (한 건이 죽어도 나머지가 간다)
    return step1.then(function () {
      var jobs = [];
      var push = function (list, kind) {
        (list || []).forEach(function (f) {
          jobs.push(function () {
            // ★★ 출처 이름은 **서버가 정한다** 〈2026-08-21〉. 여기 손으로 적어 두었더니
            //   검증기만 그 이름을 몰라 첨부가 전부 거절됐고, 화면에는 「첨부 0개」가
            //   떴다. 서버가 안 알려 주는 옛 판을 위해 같은 값을 뒤에 두되,
            //   **둘이 같은 값인지는 검사가 지킨다**
            var prov = (state.linked && state.linked.appProvider) || APP_PROVIDER;
            var ref = f.ref || { provider: prov, fileId: f.id || f.name, name: f.name,
              rev: f.rev || null, bytes: f.bytes || null, kind: kind };
            // 앱이 ref 를 통째로 줬어도 출처 이름은 **서버가 아는 것**으로 맞춘다
            if (f.ref && !f.ref.provider) ref.provider = prov;
            return call('POST', base + '/linked', { ref: ref, access: f.access || null },
              { localGate: true }).then(function (r) {
              if (r && r.ok) { rep[kind === 'image' ? 'images' : 'files'] += 1; return; }
              rep.failed = true;
              rep.rejected.push({ what: f.name || '(이름 없음)',
                why: (r && (r.msg || r.closed)) || '잇지 못했습니다' });
            }, function (e) {
              rep.failed = true;
              rep.rejected.push({ what: f.name || '(이름 없음)', why: e.message });
            });
          });
        });
      };
      if (state.appPick.files) push(b.files, 'file');
      if (state.appPick.images) push(b.images, 'image');
      if (!jobs.length) return null;
      state.appStage = 2; render();
      return jobs.reduce(function (p, job) { return p.then(job); }, Promise.resolve());
    }).then(function () {
      state.busy = false;
      state.appStage = 3;
      state.appDead = rep.failed;
      state.appReport = rep;
      return loadOne(state.projectId).then(render);
    }, function (e) {
      state.busy = false;
      state.appDead = true;
      rep.failed = true;
      rep.rejected.push({ what: '가져오기', why: e.message });
      state.appReport = rep;
      render();
    });
  }

  /** 연결 갈래의 칸 이름 — 한 곳에서 정한다 */
  var LINK_STAGES = ['저장소 열기', '파일 고르기', '장부에 적기', '붙었습니다'];

  /** 앱이 연 창에서 고른 결과를 서버에 넘긴다 */
  function pickFrom(provider, btn) {
    if (state.busy) return;
    var open = C.pickFrom;
    if (typeof open !== 'function') {
      // ★ 앱이 창을 안 넘겨 주면 **여기서 멈춘다.** 되는 척하지 않는다.
      //   ★★ 브라우저 탓을 하지 않는다 — 브라우저는 아무 상관이 없다.
      //     틀린 원인을 말하면 사용자가 엉뚱한 것을 고치러 간다 (2026-08-20 실측)
      state.linkMsg = '파일 고르기 창이 아직 연결되지 않았습니다 — '
        + '지금은 「파일업로드(1회성)」로 넣을 수 있습니다.';
      state.linkStage = 0; state.linkDead = true;
      return render();
    }
    state.busy = true; state.linkMsg = null;
    state.linkStage = 0; state.linkDead = false;
    if (btn) btn.disabled = true;
    render();

    Promise.resolve()
      .then(function () { state.linkStage = 1; render(); return open(provider); })
      .then(function (picked) {
        // 고르기 창을 그냥 닫은 경우 — 오류가 아니다. 칸을 되돌린다
        if (!picked || !picked.ref) {
          state.busy = false; state.linkStage = -1; return render();
        }
        state.linkStage = 2; render();
        // ★ ref 와 access 를 **따로** 보낸다. 섞어 보내면 장부에 열쇠가 들어간다
        return call('POST', '/projects/' + state.projectId + '/linked',
          { ref: picked.ref, access: picked.access || null })
          .then(function (r) {
            state.busy = false;
            if (r && r.ok) { state.linkStage = 3; return loadOne(state.projectId).then(render); }
            state.linkDead = true;
            if (r && r.closed) state.linkMsg = r.closed;
            if (r && r.gated) state.linkMsg = r.msg;
            render();
          });
      })
      .catch(function (e) {
        state.busy = false;
        state.linkDead = true;
        state.linkMsg = e && e.message ? e.message : '파일을 고르지 못했습니다.';
        render();
      });
  }

  /**
   * 붙일 수 있는 저장소 이름. **서버가 알려 준다** — 화면에 적어 두면 늘어날 때 갈린다.
   * 연결 갈래를 골랐을 때만 쓴다 (목록 아래에 늘 깔아 두면 잡음이 된다).
   */
  function providerNames() {
    return ((state.linked && state.linked.providers) || []).map(function (p) { return p.name; }).join(' · ');
  }

  /**
   * 1회성 기록. 비어 있으면 그리지 않는다.
   *
   * ★ 「올리기 전에 확인해 주세요」는 **붙이기 칸**에 있다 — 고르는 그 자리에서
   *   말해야 늦지 않는다. 여기에 또 두면 같은 경고가 화면에 두 번 나온다.
   */
  function oneshotBlock() {
    if (state.closed.oneshot) {
      var w = document.createDocumentFragment();
      w.appendChild(el('div', 'grp', '파일업로드(1회성) — 읽고 바로 버립니다'));
      w.appendChild(waitBox('1회성 자료 경로가 아직 열려 있지 않습니다', state.closed.oneshot));
      return w;
    }
    var items = (state.oneshot && state.oneshot.items) || [];
    if (!items.length) return null;

    var out = document.createDocumentFragment();
    out.appendChild(el('div', 'grp', '파일업로드(1회성) — 읽고 바로 버립니다'));
    items.forEach(function (it) {
      var b = el('div', 'row__b');
      b.appendChild(el('div', 'row__n', it.name));
      b.appendChild(el('div', 'row__m',
        size(it.bytes) + ' · sha256 ' + String((it.fingerprint && it.fingerprint.value) || '').slice(0, 12)
        + (it.readAt ? ' · ' + String(it.readAt).slice(0, 10) + ' 읽음' : '')
        + ' · 파일 없음(지웠습니다)'));
      out.appendChild(add(el('div', 'row row--gone'), b));
    });
    return out;
  }

  function render() {
    view.innerHTML = '';
    if (!C.inTab) view.appendChild(el('h1', null, '자료 업로드'));

    // 토큰이 안 실리면 화면이 색 없이 뜨는데 오류는 안 난다 — 화면이 스스로 말한다
    if (F && F.tokensLoaded() === false) view.appendChild(el('div', 'nostyle', F.TOKENS_MISSING));

    // ★ 등급·로그인 판정을 **화면이 먼저** 말한다. 판정 자체는 서버가 하지만,
    //   화면이 아무 말도 안 하고 목록만 비어 있으면 「자료가 없다」로 읽힌다
    var G = window.LinkPilotGate;
    var a = G ? G.access(C.session, C.requiredPlan) : { allowed: true };
    if (!a.allowed) {
      var m = G.accessMessage(a, (C.planNames || {})[C.requiredPlan] || C.requiredPlan, '자료 업로드');
      var g = el('section', 'card');
      add(g, el('h2', 'card__t', (m && m.title) || '사용할 수 없습니다'),
        el('p', 'card__d', (m && m.body) || ''));
      view.appendChild(g);
      return;
    }
    if (state.gate) {
      var sg = el('section', 'card');
      add(sg, el('h2', 'card__t', state.gate),
        el('p', 'card__d', '로그인하거나 멤버십을 확인한 뒤 다시 열어 주십시오.'));
      view.appendChild(sg);
      return;
    }

    if (state.error) view.appendChild(el('div', 'err', state.error));

    // ★ 프로젝트를 **먼저** 고르게 한다. 자료는 프로젝트에 붙는 것이라
    //   고르기 전에 파일부터 고르게 하면 올릴 곳이 없다
    // 프로젝트 고르기
    var pick = el('div', 'pick');
    pick.appendChild(el('label', null, '프로젝트'));
    var sel = el('select');
    // 없을 때 「고르세요」라고 하면 어딘가 있는 줄 알고 찾는다 (outputs.html 과 같은 문구)
    var apps = Array.isArray(C.appProjects) ? C.appProjects : [];
    var none = el('option', null,
      ((state.projects && state.projects.length) || apps.length) ? '— 고르세요 —' : '프로젝트가 없습니다');
    none.value = '';
    sel.appendChild(none);
    // ★★ **만들기를 맨 위에 둔다** 〈2026-08-20 사용자 지시〉.
    //   전에는 「1단계에서 먼저 만드십시오」라고만 했는데, 그 1단계가 다른 탭이라
    //   자료를 손에 든 채 탭을 옮겨야 했다 — 옮기면 고른 파일이 사라진다.
    // ★ 목록 **맨 아래**가 아니라 맨 위다. 프로젝트가 수십 개면 아래 것은
    //   끝까지 굴려야 보이는데, 새로 만드는 사람은 목록에 볼 것이 없는 사람이다
    var mk = el('option', null, '＋ 신규프로젝트');
    mk.value = NEW_OPT;
    if (state.newProj) mk.selected = true;
    sel.appendChild(mk);
    /* 엔진에 이미 있는 프로젝트 */
    // ★ 앱 딜 중에는 **작업 폴더가 아직 없는 것**이 있다. 그때 `id` 가 비어 있다 —
    //   목록에서 빼지 않는다. 빼면 사용자는 자기 딜이 왜 없는지 모른다.
    //   대신 고르면 「먼저 만드십시오」라고 말한다 (프로젝트-연결-규칙 §4).
    var gEng = el('optgroup'); gEng.label = '보고서 프로젝트';
    (state.projects || []).forEach(function (p) {
      var label = p.name || p.id || '(이름 없음)';
      if (p.id) label += ' · ' + p.id;
      else label += ' — 작업 폴더가 아직 없습니다';
      var o = el('option', null, label);
      // 폴더가 없는 딜은 **키로** 고른다. 이름으로 이으면 이름 바꾸는 날 끊긴다
      o.value = p.id || ('ext:' + (p.externalId || label));
      if (p.id && p.id === state.projectId) o.selected = true;
      gEng.appendChild(o);
    });
    if (gEng.children.length) sel.appendChild(gEng);
    /* ★ 앱에 등록된 프로젝트 — 고르면 엔진 프로젝트로 잇는다(이미 이어진 것은 그쪽으로 간다).
       앱 목록은 부모가 내려준다(C.appProjects). 단독으로 열면 이 그룹은 없다 — 그게 정직하다 */
    if (apps.length) {
      var linked = C.appLinks || {};
      var gApp = el('optgroup'); gApp.label = '앱 프로젝트에서 가져오기';
      apps.forEach(function (a) {
        if (!a || !a.id) return;
        var tail = a.client ? (' · ' + a.client) : (a.owner ? (' · ' + a.owner) : '');
        var mark = linked[String(a.id)] ? ' (이어짐)' : '';
        var o = el('option', null, (a.title || '(제목 없음)') + tail + mark);
        o.value = 'app:' + a.id;
        gApp.appendChild(o);
      });
      sel.appendChild(gApp);
    }
    sel.addEventListener('change', function () {
      var v = sel.value;
      if (v && v.indexOf('app:') === 0) pickAppProject(v.slice(4));
      else pickProject(v);
    });
    pick.appendChild(sel);
    if (state.appMsg) pick.appendChild(el('div', 'card__d', state.appMsg));
    view.appendChild(add(el('div', 'card'), pick));

    var mkCard = newProjectCard();
    if (mkCard) { view.appendChild(mkCard); return; }

    // ★ 앱에서 가져오는 것을 **붙이기보다 먼저** 그린다. 앱 프로젝트로 들어온
    //   사람에게는 손으로 붙이기 전에 이미 있는 것을 끌어오는 쪽이 먼저다
    var appCard = appImportCard();
    if (appCard) view.appendChild(appCard);

    view.appendChild(attachCard());

    if (!state.projectId) {
      view.appendChild(el('p', 'card__d', '프로젝트를 고르면 그 프로젝트의 자료가 여기 뜹니다.'));
      return;
    }

    // ★ 빈 절은 아예 만들지 않는다. `null` 을 그대로 넣으면 예외가 난다
    [oneshotBlock()].forEach(function (b) {
      if (b) view.appendChild(b);
    });
  }

  /**
   * 끌어다 놓기 — **화면 아무 데나** 받는다 〈2026-08-20〉.
   *
   * ★★ 왜: 점선 상자를 조금만 빗나가면 브라우저가 그 파일을 **탭에 열어 버린다.**
   *   화면은 통째로 사라지고 올린 것은 없다. 「끌어다 놓기가 안 된다」의 대부분이
   *   이것이다 — 아무 오류도 안 나므로 사용자는 기능이 없는 줄 안다.
   *   그래서 문서 전체에서 `preventDefault()` 를 걸어 **먼저 브라우저를 막고**,
   *   받을 수 있으면 받고 못 받으면 **왜 못 받는지 말한다.**
   *
   * ★ 갈래를 대신 바꾸지 않는다. 떨어뜨렸다고 1회성으로 넘겨 버리면 그 파일은
   *   읽고 **버려진다** — 되돌릴 수 없는 것을 화면이 정하면 안 된다.
   */
  function hasFiles(ev) {
    var t = ev.dataTransfer && ev.dataTransfer.types;
    if (!t) return false;
    for (var i = 0; i < t.length; i++) if (t[i] === 'Files') return true;
    return false;
  }
  var dragDepth = 0;
  function dragPaint(on) {
    var c = view.querySelector('.card--attach');
    if (c) { if (on) c.classList.add('dragover'); else c.classList.remove('dragover'); }
  }
  document.addEventListener('dragenter', function (ev) {
    if (!hasFiles(ev)) return;
    ev.preventDefault(); dragDepth++; dragPaint(true);
  });
  document.addEventListener('dragover', function (ev) {
    if (!hasFiles(ev)) return;
    ev.preventDefault();
    try { ev.dataTransfer.dropEffect = 'copy'; } catch (_) {}
  });
  document.addEventListener('dragleave', function (ev) {
    if (!hasFiles(ev)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) dragPaint(false);
  });
  document.addEventListener('drop', function (ev) {
    if (!hasFiles(ev)) return;
    ev.preventDefault();          // ★ 이것을 빼면 브라우저가 파일을 열고 화면이 사라진다
    dragDepth = 0; dragPaint(false);
    var f = ev.dataTransfer && ev.dataTransfer.files;
    if (!f || !f.length) return;
    if (!state.projectId) {
      state.dropMsg = '프로젝트를 먼저 고르십시오 — 붙일 곳이 없습니다.';
      return render();
    }
    if (state.way !== 'oneshot') {
      state.dropMsg = '떨어뜨린 파일은 「파일업로드(1회성)」로만 올릴 수 있습니다 — '
        + '그 갈래를 고른 뒤에 놓아 주십시오.';
      return render();
    }
    state.dropMsg = null;
    addFiles(f);
  });

  render();
  // 한도는 **서버가 정한다.** 화면에 숫자를 박아 두면 서버가 바뀌는 날 화면만 옛말을 한다.
  // ★ `call()` 은 `{ok, body}` 를 준다 — 껍데기째 넣으면 값이 `undefined` 가 되고
  //   화면에는 **「0 B」가 그럴듯하게 찍힌다.** 실제로 그렇게 한 번 나왔다
  if (state.projectId) announce(state.projectId);   // 미리 정해져 열렸을 때도 알린다
  call('GET', '/intake').then(function (r) {
    if (r && r.ok && r.body) { state.limits = r.body; render(); }
  }, function () {});
  loadProjects().then(function () {
    render();
    if (state.projectId) return loadOne(state.projectId).then(render);
    return null;
  });
})();
</script>
</body>
</html>
