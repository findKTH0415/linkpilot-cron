   * ★ 번호를 **글자로 적지 않는다** — 동그라미 하나로 둔다. 「1.」 처럼 적으면
   *   바깥 단계 번호(3. 관련자료 업로드)와 섞여 어느 번호인지 흐려진다.
   * ★ 라임으로 큰 면을 채우지 않는다 (§6-3) — 동그라미만 라임이다.
   */
  function stepHead(no, title, why) {
    var h = el('div', 'ah');
    h.appendChild(el('span', 'ah__n', String(no)));
    var b = el('div', 'ah__b');
    b.appendChild(el('div', 'ah__t', title));
    if (why) b.appendChild(el('p', 'ah__w', why));
    h.appendChild(b);
    return h;
  }

  function attachCard() {
    var card = el('section', 'card card--attach');
    /* ★★★ 〈2026-08-23 사장님 지시〉 세 칸으로 세운다:
     *     ① 앱 프로젝트에서 호출 또는 신규 프로젝트 지정
     *     ② [파일업로드] 파일선택 + 끌어다 놓기 / [폴더 지정] 폴더선택
     *     ③ 첨부 진행율
     *   ★ 앞 판은 ①이 ②의 갈래 셋 중 하나로 숨어 있었다. 그래서 프로젝트가
     *     없으면 「고르는 자리로 가기」 단추를 한 번 더 눌러야 했고, 그 단추가
     *     있다는 것 자체가 자리가 틀렸다는 표시였다. */
    add(card, el('h2', 'card__t', '관련자료 제공'),
      el('p', 'card__d',
        '어느 쪽으로 넣든 관련자료를 분석하고 읽어서 「' + F.SECTION.tab + '」으로 보냅니다.'));

    /* ── ① 프로젝트 지정 — **늘 맨 위에 있다** ───────────────── */
    card.appendChild(stepHead(1, '프로젝트 지정',
      '앱 프로젝트에서 불러오거나, 새로 만듭니다.'));
    /* ★ 클래스를 `wayin` 으로 쓰지 않는다 — 그 이름은 **갈래 상자 안쪽 칸**을
       뜻하고, 검사가 「그것이 상자 안에 있는가」를 잰다. ①은 상자 밖이다 */
    var pick = el('div', 'pickone');
    pick.appendChild(projectPicker());
    /* ★ 되살렸으면 **그렇다고 말한다.** 안 말하면 왜 골라져 있는지 몰라서
     *   「내가 고른 게 맞나」를 확인하러 목록을 다시 연다 */
    if (state.restored && state.projectId) {
      pick.appendChild(el('p', 'note',
        '지난번에 쓰던 프로젝트로 이어서 열었습니다 — 바꾸시려면 위에서 고르십시오.'));
    }
    var mk0 = newProjectCard();
    if (mk0) pick.appendChild(mk0);
    else if (!state.projectId && state.noFolder) {
      /* 안내가 아니라 **경고**다 — 화면이 몰래 만들지 않으므로 사람이 만들어야 한다 */
      pick.appendChild(el('p', 'note',
        '이 프로젝트는 작업 폴더가 아직 없습니다. 위에서 「＋ 신규프로젝트」로 만들어 주십시오.'));
    }
    var appBody = state.projectId ? appImportCard() : null;
    if (appBody) pick.appendChild(appBody);
    card.appendChild(pick);

    /* ── ② 자료 넣는 방법 — **둘을 한 칸에 병합** 〈2026-08-23 사장님 지시〉 ──
     *
     * ★★ 앞 판은 [파일업로드] [폴더 지정] 두 칸의 **토글**이었다. 그런데 둘은
     *   **고르는 문제가 아니다** — 한 딜에서 사업계획서는 파일로 올리고 실사자료는
     *   폴더로 가리키는 일이 그냥 있다. 토글로 두면 한쪽을 쓰는 동안 다른 쪽이
     *   **안 보이고**, 그래서 「그건 못 하나 보다」가 된다.
     * ★ 그래서 둘을 **한 테두리 안에 위아래로** 편다. 고르는 단계가 사라진다.
     * ★ 사이에 「또는」을 둔다 — 붙여만 두면 아래쪽이 위쪽에 딸린 것으로 읽힌다.
     */
    card.appendChild(stepHead(2, '자료 넣는 방법',
      '파일을 올리거나, 폴더를 가리킵니다. 한 프로젝트에서 둘 다 쓸 수 있습니다.'));

    // 끌어다 놓았는데 받을 수 없었던 이유를 **그 자리에서** 말한다
    if (state.dropMsg) card.appendChild(el('p', 'note', state.dropMsg));

    /* ★ 프로젝트가 없으면 여기서 멈춘다. **어디로 가라고 하지 않는다** —
       고르는 자리(①)가 바로 위에 있다 〈2026-08-23〉 */
    if (!state.projectId) {
      card.appendChild(el('p', 'note', '위 ① 에서 프로젝트를 먼저 지정해 주십시오.'));
      putProgress(card);
      return card;
    }

    /* ★★★ **다 올린 뒤에는 접는다** 〈2026-08-27 사장님 지시 — 「2번이나 올려야 하는
     *   번거로움」 · D-146〉.
     *
     *   앞 판은 올리기가 끝나도 이 칸이 **그대로 펼쳐진 채** 남았다. 위 단계는
     *   「완료」라고 적혀 있는데 아래에는 파일 고르기가 그대로 있으니, 읽는 사람에게는
     *   **「또 올려야 하나」**로 보인다. 실제로 같은 자료를 두 번 올리셨다.
     *
     * ★ 접는 것은 ② 하나뿐이다. ①(어느 프로젝트인지)과 ③(무엇이 올라갔는지)은
     *   그대로 둔다 — 그 둘은 **끝난 뒤에 더 봐야 하는 것**이다.
     * ★ **되돌릴 수 있게 둔다.** [자료 더 올리기]가 없으면 접는 것이 곧 막는 것이 된다.
     * ★ 새로 고른 파일이 있으면 접지 않는다 — 올리려던 참인데 칸이 사라지면 안 된다. */
    var didUpload = !!(state.result && !(state.picked || []).length);
    if (didUpload && !state.addMore) {
      var done = el('div', 'ways2__b');
      /* ★★★ **접어도 「1 자료 수집」 머리는 남긴다** 〈2026-08-27 · 검사가 잡았다〉.
       *   이 1 은 이 칸의 번호가 아니라 **카드 셋에 걸친 줄기**다:
       *     1 자료 수집 → 2 자료 스캔(다음 카드) → 3 보고서로 이관(그다음).
       *   접으면서 같이 떼었더니 줄기가 **2 부터 시작**했고, 눌러 보는 검사가
       *   바로 빨개졌다. 접는 것이 **뜻을 지우는 것**이 되면 안 된다 (§8). */
      var keep = el('div', 'sub__h');
      keep.appendChild(el('span', 'sub__n', '1'));
      var kt = el('div');
      kt.appendChild(el('div', 'sub__t', '자료 수집'));
      kt.appendChild(el('div', 'sub__d', '넣은 자료는 다음 칸에서 읽습니다.'));
      keep.appendChild(kt);
      done.appendChild(keep);
      done.appendChild(el('div', 'ways2__t', '자료를 넣었습니다'));
      done.appendChild(el('p', 'ah__w',
        (typeof UP.summary === 'function' ? UP.summary(state.result) : '올렸습니다')
        + ' — 더 넣으실 것이 없으면 다음 단계로 가시면 됩니다.'));
      var more = el('button', 'btn', '＋ 자료 더 올리기');
      more.type = 'button';
      more.onclick = function () { state.addMore = true; render(); };
      done.appendChild(more);
      card.appendChild(done);
      putProgress(card);
      return card;
    }

    var both = el('div', 'ways2');
    both.appendChild(uploadBlock());
    both.appendChild(el('div', 'ways2__or', '또는'));
    both.appendChild(linkedBlock());
    card.appendChild(both);

    putProgress(card);
    return card;
  }

  /** 폴더 지정 — 여기서 올리는 것이 아니라 **가리키는** 것이다 */
  function linkedBlock() {
    var box = el('div', 'ways2__b');
    box.appendChild(el('div', 'ways2__t', wayName('linked')));
    box.appendChild(el('p', 'ways2__d', wayOf('linked').d));
    box.appendChild(linkPicker());
    /* 연결도 **과정이 있다.** 창을 열고, 권한을 확인하고, 장부에 적는다.
       그 사이 아무 말이 없으면 눌러도 안 되는 줄 안다 */
    if (state.linkStage >= 0) {
      box.appendChild(activityGraph({
        stages: LINK_STAGES, at: state.linkStage, dead: state.linkDead,
        note: state.linkDead ? '이 칸에서 멈췄습니다.' : '고른 파일을 가리키는 중입니다 — 사본을 만들지 않습니다.',
      }));
    }
    // ★ 연결한 것이 있으면 **그대로인지 물어볼 수 있어야 한다** (D-72)
    var chk = checkBox();
    if (chk) box.appendChild(chk);
    return box;
  }

  /** 파일업로드 — 고른 파일이 모이고, 올린다 */
  function uploadBlock() {
    /* ── ① 모이는 자리 〈2026-08-21 사용자 지시 — 「재구성해줘」〉 ──────────
     *
     * ★★ 앞 판은 **이름이 없었다.** 갈래를 고르면 드롭 자리와 목록과 올리기
     *   단추가 그냥 이어서 나왔고, 그 아래에 「자료 스캔」이 또 이어졌다.
     *   그래서 **어디까지가 모으는 일이고 어디부터가 읽는 일인지**를 화면이
     *   말하지 않았다 — 사용자가 손으로 상자를 그려 「여기가 1번, 여기가 2번」
     *   이라고 알려 줘야 했다. 그것이 곧 화면이 못 한 말이다.
     *
     * ★ 그래서 번호와 이름을 준다. 다음 자리(② 자료 스캔)도 같은 꼴로 부른다 —
     *   둘이 한 줄기임을 번호가 이어 준다.
     */
    var box = el('div', 'ways2__b');
    box.appendChild(el('div', 'ways2__t', '파일업로드'));
    box.appendChild(el('p', 'ways2__d', '파일을 고르거나 아래에 끌어다 놓습니다.'));

    /**
     * ★★★ **올린 자료를 남길 것인가** 〈2026-08-23 사장님: 「자료를 업로드
     *   했는데 전혀 반영이 안되었음. 매우 중요함. 최종결과물 품질이 달라짐」〉.
     *
     *   앞 판은 이 칸이 **1회성 한 길뿐**이었다. 1회성은 읽고 파일을 버리므로
     *   `02_Source_Data` 가 언제나 비었고, 보고서를 만들 때 추출기가
     *   「원본자료가 없다」로 끝났다 — **숫자가 전부 통상치로 나갔다.**
     *   보관하는 길(`POST /projects/:id/sources`)은 **서버에 살아 있었는데**
     *   2026-08-20 에 화면에서 뺀 뒤로 부르는 곳이 없었다.
     *
     * ★ 고르는 단계를 새로 만들지 않는다 — **이 칸 안에서** 고른다.
     * ★ 기본은 **보관**이다. 다시 만들 수 있는 쪽이 기본이어야 한다.
     * ★ 1회성은 남긴다 (D-65) — 사본을 남기기 싫은 사람의 길이다.
     */
    var KEEPS = [
      { id: 'keep', t: '보관합니다', d: '보고서를 다시 만들 때 이 자료를 다시 읽습니다. 나중에 원본과 대조할 수 있습니다.' },
      { id: 'oneshot', t: '읽고 버립니다', d: '사본을 남기지 않습니다. 보고서를 다시 만들면 이 자료는 안 실립니다 — 그때 다시 올려야 합니다.' },
    ];
    var kb = el('div', 'keepway');
    KEEPS.forEach(function (k) {
      var b = el('button', 'keepway__b' + (state.way === k.id ? ' on' : ''));
      b.type = 'button';
      b.appendChild(el('span', 'keepway__t', k.t));
      b.appendChild(el('span', 'keepway__d', k.d));
      b.setAttribute('aria-pressed', state.way === k.id ? 'true' : 'false');
      b.addEventListener('click', function () {
        if (state.way === k.id) return;
        state.way = k.id;
        remember({ way: k.id });
        render();
      });
      kb.appendChild(b);
    });
    box.appendChild(kb);

    /* ★★ 「1 자료 수집」 머리를 **남긴다** 〈2026-08-23〉. 카드 안의 ①②③ 과
     *   번호가 겹쳐 보이지만, 이 1 은 **카드 셋에 걸친 줄기**다:
     *     1 자료 수집(이 칸) → 2 자료 스캔(다음 카드) → 3 보고서로 이관(그다음)
     *   떼면 그 줄기가 2 부터 시작해 **1 이 어디 갔는지** 모르게 된다.
     *   사용자가 손으로 상자를 그려 「여기가 1번」이라고 알려 준 그 번호다. */
    var h = el('div', 'sub__h');
    h.appendChild(el('span', 'sub__n', '1'));
    var ht = el('div');
    ht.appendChild(el('div', 'sub__t', '자료 수집'));
    ht.appendChild(el('div', 'sub__d', '고른 파일이 여기 모입니다. 올려야 다음 칸에서 읽습니다.'));
    h.appendChild(ht);
    box.appendChild(h);

    box.appendChild(dropZone());
    box.appendChild(limitBox());
    box.appendChild(pickedList());

    var ready = state.picked.filter(function (f) { return f.data && !f.tooBig; });

    /* ★★★ **아직 읽는 중인 파일이 있으면 단추를 잠근다** 〈2026-08-22 · 실제로 잃었다〉.
     *
     *   파일을 고르면 줄은 **바로** 생기지만 내용은 `FileReader` 가 **나중에**
     *   채운다. 앞 판은 `ready`(내용이 찬 것)만 보고 단추를 열었다. 그래서
     *   둘을 골라 곧바로 누르면 **덜 읽힌 하나가 조용히 빠진 채로** 올라갔다.
     *   화면은 「1개를 올렸습니다」라고 맞는 말을 하고, 사용자는 2개를 골랐다.
     *
     *   ★ 실측으로 잡았다: 미리보기 빌드가 45번에 한 번쯤 「이관 칸이 없다」로
     *     멎었는데, 발자국을 찍어 보니 pdf 가 빠져 값이 0이었다. 기계가 바쁘면
     *     읽기가 늦고, 그때만 재현된다 — **사람 손으로는 거의 안 잡힌다.**
     *   ★ 조용히 빼는 대신 **기다리게 한다.** 몇 개를 기다리는지도 적는다. */
    var reading = state.picked.filter(function (f) {
      return !f.data && !f.error && !f.tooBig;
    });

    /* ★ 합계가 넘으면 **그 자리에서 말하고 단추를 잠근다.** 얼마나 넘었는지와
     *   무엇을 하면 되는지를 함께 적는다 — 「너무 큽니다」만으로는 몇 개를 빼야
     *   하는지 알 수 없다 */
    var over = overRequest();
    if (over) {
      box.appendChild(el('p', 'up__d up__d--bad',
        '고른 ' + over.files + '개의 합이 ' + size(over.total)
        + ' 입니다 — 한 번에 ' + size(over.cap) + ' 까지 보낼 수 있습니다. '
        + size(over.total - over.cap) + ' 만큼 덜어 내거나, 나눠서 두 번 올려 주십시오.'));
    }

    if (reading.length) {
      box.appendChild(el('p', 'note',
        '고른 파일 ' + reading.length + '개를 아직 읽는 중입니다 — 다 읽으면 올릴 수 있습니다.'));
    }

    var go = el('button', 'btn',
      state.way === 'oneshot' ? '파일업로드 — 읽고 버리기' : '파일업로드 — 보관');
    go.type = 'button';
    go.disabled = !ready.length || state.busy || !!over || !!reading.length;
    go.addEventListener('click', doUpload);
    box.appendChild(go);
    return box;
  }

  /**
   * ③ 첨부 진행율 〈2026-08-23 사장님 지시 — 「첨부과정 진행율 % 그래프 바 노출해줘」〉.
   *
   * ★★ **어느 길로 끝나든 붙인다.** 앞 판은 카드 끝에만 뒀는데, 프로젝트가
   *   없을 때는 그 앞에서 되돌아가서 ③이 통째로 사라졌다 — 번호가 ①②로 끝나면
   *   사람은 ③이 없어진 줄 안다.
   * ★ **없는 진행을 그리지 않는다** (§8). 올리는 중이 아니면 막대를 0% 로 그리지
   *   않고 어디에 뜨는지만 한 줄로 알린다 — 0% 막대는 「멈춰 있다」로 읽힌다.
   */
  function putProgress(card) {
    var up = uploadCard();
    if (up) {
      card.appendChild(stepHead(3, '첨부 진행율',
        '보내는 중 · 서버가 읽는 중 · 끝남 — 지금 어디인지 % 와 그래프로 보입니다.'));
      card.appendChild(up);
      return;
    }
    var idle = stepHead(3, '첨부 진행율', null);
    idle.className = 'ah ah--idle';
    card.appendChild(idle);
    card.appendChild(el('p', 'ah__idle',
      '자료를 올리기 시작하면 여기에 % 와 진행 그래프가 뜹니다.'));
  }

  /** 아직 안 붙은 길. **오류가 아니라 상태**로 그린다 */
  function waitBox(title, why) {
    var b = el('div', 'wait');
    b.appendChild(el('div', 'wait__t', title));
    b.appendChild(el('div', 'wait__d', why));
    return b;
  }

  /**
   * 연결 — 제공자 창을 열어 **고른 파일을 가리킨다** 〈2026-08-20〉.
   *
   * ★★ 제공자 창(Dropbox·Box·구글·원드라이브)은 **앱이 연다.** 그쪽에 계정과
   *   SDK 가 있고, 엔진은 어느 계정인지 모른다. 앱이 넘겨 주는 함수는 하나다:
   *
   *     window.LINKPILOT_FILES.pickFrom(provider)
   *        → Promise<{ ref:{provider,fileId,name,rev,path?,bytes?}, access:{url,expiresAt?} }>
   *
   * ★ `ref` 는 **장부에 남는다.** `access` 는 **남지 않는다** — 서버가 잠깐
   *   들고 있다가 시간이 지나면 스스로 버린다 (`core/handoff.js`).
   *   장부에 열쇠를 두지 않는다는 규칙은 그대로다.
   */
  function linkPicker() {
    var box = document.createDocumentFragment();
    var names = ((state.linked && state.linked.providers) || []);

    // ★★ **누를 수 없는 것을 누를 수 있게 두지 않는다** 〈2026-08-20 실측〉.
    //   전에는 넷을 다 그려 놓고, 누르면 **브라우저 탓을 하는 문장**이 떴다.
    //   브라우저는 아무 잘못이 없었다 — 앱이 고르기 창을 넘기지 않았거나 제공자
    //   콘솔 등록이 안 된 것이다. 사용자는 그 문장을 읽고 브라우저를 바꾸러 간다.
    //   원인을 틀리게 말하는 것이 아무 말도 안 하는 것보다 나쁘다.
    //   ★ 그 문장을 **여기 주석에도 적지 않는다** — 적으면 그것을 찾는 검사가
    //     주석에 걸려 통과하고, 막는 장치가 조용히 죽는다 (M-08 · 실제로 두 번)
    var canOpen = typeof C.pickFrom === 'function';

    var row = el('div', 'ext');
    row.style.display = 'flex';
    row.style.gap = '8px';
    row.style.flexWrap = 'wrap';
    row.style.marginTop = '12px';

    var blocked = [];
    names.forEach(function (p) {
      // `configured` 가 아예 안 오면(옛 서버) **막지 않는다** — 모르는 것을
      // 「안 된다」로 그리면 되는 것까지 못 쓰게 된다
      var registered = (p.configured === undefined) ? true : !!p.configured;
      var open = canOpen && registered;
      var b = el('button', 'btn2', p.name);
      b.type = 'button';
      b.disabled = !open;
      b.style.cssText = 'font-weight: 700; font-size: 13px; line-height: 1; font-family: inherit;padding:10px 14px;border-radius:10px;'
        + 'border:1px solid var(--line);color:var(--ink);'
        + (open ? 'background:var(--surface);cursor:pointer'
          : 'background:var(--panel);color:var(--ink2);cursor:not-allowed');
      if (open) b.addEventListener('click', function () { pickFrom(p.id, b); });
      else if (!registered) blocked.push(p.name);
      row.appendChild(b);
    });
    box.appendChild(row);

    // ★ **무엇이 빠졌는지**를 말한다. 둘은 고치는 사람이 다르다 —
    //   고르기 창은 앱이 붙이고, 등록은 제공자 콘솔에서 한다
    if (!canOpen) {
      box.appendChild(el('p', 'note',
        '파일 고르기 창이 아직 연결되지 않았습니다 — 준비되면 위 단추가 열립니다. '
        // ★ 조사를 이름 뒤에 붙이지 않는다 — 이름이 바뀌면 「…」을/를 이 어긋난다.
        //   갈래 이름은 사람이 정하는 값이라 받침을 미리 알 수 없다
        + '지금 자료를 넣으려면 「' + wayName('oneshot') + '」 갈래를 쓰십시오.'));
    } else if (blocked.length) {
      box.appendChild(el('p', 'note',
        blocked.join(' · ') + ' 는 아직 등록되지 않았습니다 — 관리자에게 저장소 등록을 요청하십시오.'));
    }

    if (state.linkMsg) box.appendChild(el('p', 'note', state.linkMsg));
    return box;
  }

  /**
   * 새 프로젝트 만들기 — **고르는 자리에서 바로** 〈2026-08-20 사용자 지시〉.
   *
   * ★★ 화면이 몰래 만들지 않는다. 무엇을 만들지 **사람이 한 줄 적는다** —
   *   그 문장에서 자산군이 정해지기 때문이다. 빈 채로 만들면 자산군이 GEN 으로
   *   굳고, 굳은 뒤에는 보고서 목차가 통째로 어긋난다 (프로젝트-연결-규칙 §4).
   *
   * ★ 만드는 것은 **Pro 부터**다. 등급이 모자라면 그 말을 **이 칸에서** 한다 —
   *   화면 전체를 잠그면 이미 있는 프로젝트에 자료 붙이는 것까지 막힌다.
   */
  var NEW_OPT = 'new:';

  function newProjectCard() {
    var n = state.newProj;
    if (!n) return null;
    // ★ `section.card` 가 아니라 **조각**이다 〈2026-08-21〉. 「자료 붙이기」 카드
    //   안쪽 갈래에 들어가므로, 카드를 또 두르면 테두리가 겹친다
    var card = document.createDocumentFragment();
    add(card, el('div', 'card__t', '신규프로젝트'),
      el('p', 'card__d', '무엇을 만들지 한 줄로 적어 주십시오. '
        + '이 문장에서 자산군과 목차가 정해집니다 — 비워 두면 정할 수 없습니다.'));

    var row = el('div', 'new');
    var inp = el('input');
    inp.type = 'text';
    inp.value = n.text;
    inp.placeholder = '예: 인천 남동공단 6.5MW 데이터센터 IM 작성';
    inp.disabled = !!n.busy;
    inp.addEventListener('input', function () { n.text = inp.value; b.disabled = n.busy || inp.value.trim().length < 5; });
    var b = el('button', 'btn', n.busy ? '만드는 중…' : '만들기');
    b.type = 'button';
    b.disabled = n.busy || n.text.trim().length < 5;
    b.addEventListener('click', function () { createProject(n.text); });
    inp.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !b.disabled) { ev.preventDefault(); createProject(n.text); }
    });
    add(row, inp, b);
    card.appendChild(row);

    if (n.busy) {
      card.appendChild(activityGraph({
        stages: NEW_STAGES, at: 1, note: '요청문에서 자산군과 목차를 정하는 중입니다.',
      }));
    }
    if (n.error) card.appendChild(el('p', 'note', n.error));
    return card;
  }

  var NEW_STAGES = ['적은 문장', '자산군 정하기', '작업 폴더', '만들었습니다'];

  function createProject(text) {
    var n = state.newProj;
    if (!n || n.busy) return;
    n.busy = true; n.error = null;
    render();
    // ★ 등급 부족을 **화면 전체 게이트로 올리지 않는다** (localGate).
    //   올리면 이미 있는 프로젝트에 자료 붙이는 것까지 같이 막힌다
    call('POST', '/projects', { request: String(text).trim() }, { localGate: true })
      .then(function (r) {
        n.busy = false;
        if (r && r.gated) { n.error = r.msg; return render(); }
        if (!r || !r.ok || !r.body || !r.body.projectId) {
          n.error = '만들지 못했습니다.'; return render();
        }
        var id = r.body.projectId;
        state.newProj = null;
        // 목록을 **다시 읽는다.** 안 읽으면 방금 만든 것이 고르기에 없다
        return loadProjects().then(function () {
          pickProject(id);
        });
      })
      .catch(function (e) {
        n.busy = false;
        n.error = (e && e.message) || '만들지 못했습니다.';
        render();
      });
  }

  /* ── 앱에서 가져오기 — 셋 ────────────────────────────────
   *
   * ★★ 앱 프로젝트 하나가 들고 있는 것을 **셋으로 나눠** 가져온다. 한 덩어리로
   *   받으면 무엇이 들어왔는지 사람이 모르고, **틀린 것 하나 때문에 전부를
   *   되돌려야 한다.**
   *
   *     ① 프로젝트 내용 → 값(fact)이 된다      `PUT /facts`
   *     ② 첨부파일      → 연결 장부에 적는다   `POST /linked`
   *     ③ 이미지파일    → 〃 (그림으로 표시)
   *
   * ★★ **엔진 라우트를 새로 내지 않았다.** 셋 다 이미 있는 길로 간다 —
   *   길을 새로 내면 인증·한도·거절 규칙이 두 벌이 되고, 한쪽만 고치는 날이 온다.
   *
   * ★★ **값에는 출처가 붙는다.** 앱에서 왔다는 것 자체가 출처다 —
   *   「LinkPilot 앱 · <딜 id> · <갱신일>」. 출처 없이 넣으면 서버가 거절하고,
   *   그게 맞다 (「출처 없는 숫자는 들어오지 못한다」).
   *
   * ★ **사전에 없는 항목은 값이 되지 않는다.** 앱의 자유 입력을 억지로 사전 항목에
   *   끼워 맞추지 않는다 — 맞춰 넣으면 문서에는 「출처 있는 값」으로 실린다.
   *   그런 것은 `notes` 로 받아 **보여만 준다.**
   */
  var APP_STAGES = ['앱에서 읽기', '프로젝트 내용', '자료 잇기', '가져왔습니다'];

  /**
   * 앱이 내부로 넘기는 출처 이름 — **서버가 알려 주지 않는 옛 판을 위한 대비값.**
   * 정본은 `GET /linked` 의 `appProvider` 다. 둘이 같은 값인지는 검사가 지킨다.
   */
  var APP_PROVIDER = 'linkpilot-app';

  /** 앱 목록에서 딜 하나를 찾는다 */
  function appEntry(appId) {
    var apps = Array.isArray(C.appProjects) ? C.appProjects : [];
    for (var i = 0; i < apps.length; i++) {
      if (apps[i] && String(apps[i].id) === String(appId)) return apps[i];
    }
    return null;
  }

  /**
   * 셋을 받아 온다. 앱이 함수를 주면 그것으로, 안 주면 목록에 실린 것으로.
   *
   * ★ 목록에 개수만 실어도 되게 둘 다 받는다 — 딜 54건의 첨부를 탭 열 때
   *   전부 내려받으면 여는 데만 한참 걸린다.
   */
  function loadAppBundle(appId) {
    var a = appEntry(appId) || {};
    var inline = { content: a.content || null, files: a.files || null, images: a.images || null };
    if (typeof C.fetchAppProject !== 'function') return Promise.resolve(inline);
    return Promise.resolve()
      .then(function () { return C.fetchAppProject(appId); })
      .then(function (got) {
        if (!got) return inline;
        return {
          content: got.content || inline.content,
          files: got.files || inline.files,
          images: got.images || inline.images,
        };
      });
  }

  function countOf(b) {
    if (!b) return { content: 0, files: 0, images: 0, notes: 0 };
    var c = b.content || {};
    return {
      content: (c.facts || []).length,
      notes: (c.notes || []).length,
      files: (b.files || []).length,
      images: (b.images || []).length,
    };
  }


  /**
   * **프로젝트를 고르거나 만드는 자리 — 화면에 하나뿐이다** 〈2026-08-21 사용자 지시〉.
   *
   * ★★ 전에는 **둘**이었다. 화면 맨 위에 고르기가 있고, 「＋ 앱 프로젝트에서
   *   가져오기」 갈래 안에 앱 딜 고르기가 또 있었다. 같은 앱 딜이 두 곳에 뜨고
   *   두 곳이 같은 함수를 부르니 **어느 쪽이 진짜인지** 화면만 봐서는 모른다.
   *   사용자가 「상단을 지우고 갈래로 병합」이라고 정했다. 지금은 여기 하나다.
   *
   * ★ 한 목록에 셋이 들어간다. **무리(optgroup)로 갈라서** 무엇이 무엇인지
   *   보이게 한다 — 뭉쳐 놓으면 앱 딜과 보고서 프로젝트가 구분이 안 된다:
   *     ① ＋ 신규프로젝트          맨 위 (새로 만드는 사람은 목록에 볼 것이 없다)
   *     ② 보고서 프로젝트          엔진에 이미 있는 것
   *     ③ LinkPilot 프로젝트에서 가져오기  앱 딜 — 고르면 엔진 프로젝트로 잇는다
   *
   * ★ 자리가 여기뿐이므로 **다른 갈래에서도 여기로 올 수 있어야 한다.**
   *   프로젝트가 없을 때 다른 갈래는 이 갈래로 오는 단추를 띄운다 (attachCard).
   */
  function projectPicker() {
    var box = document.createDocumentFragment();
    var apps = Array.isArray(C.appProjects) ? C.appProjects : [];

    var pick = el('div', 'pick');
    pick.style.marginTop = '12px';
    // ★ 「프로젝트」 딱지를 **달지 않는다** 〈2026-08-22 사용자 지시〉. 바로 위 갈래
    //   제목이 이미 「LinkPilot 프로젝트에서 가져오기」라서 같은 말을 두 번 한다.
    //   ★ 딱지를 떼도 고르는 자리가 무엇인지는 목록 첫 줄(「— 고르세요 —」)이 말한다.
    var sel = el('select');
    // 없을 때 「고르세요」라고 하면 어딘가 있는 줄 알고 찾는다 (outputs.html 과 같은 문구)
    var none = el('option', null,
      ((state.projects && state.projects.length) || apps.length) ? '— 고르세요 —' : '＋ 신규프로젝트 로 시작하십시오');
    none.value = '';
    sel.appendChild(none);

    // ★★ **만들기를 맨 위에 둔다** 〈2026-08-20 사용자 지시〉.
    //   프로젝트가 수십 개면 아래 것은 끝까지 굴려야 보이는데,
    //   새로 만드는 사람은 목록에 볼 것이 없는 사람이다
    var mk = el('option', null, '＋ 신규프로젝트');
    mk.value = NEW_OPT;
    if (state.newProj) mk.selected = true;
    sel.appendChild(mk);

    /* ② 엔진에 이미 있는 프로젝트 */
    // ★ 앱 딜 중에는 **작업 폴더가 아직 없는 것**이 있다. 그때 `id` 가 비어 있다 —
    //   목록에서 빼지 않는다. 빼면 사용자는 자기 딜이 왜 없는지 모른다.
    //   대신 고르면 「먼저 만드십시오」라고 말한다 (프로젝트-연결-규칙 §4).
    var gEng = el('optgroup'); gEng.label = '보고서 프로젝트';
    (state.projects || []).forEach(function (p) {
      var full = p.name || p.id || '(이름 없음)';
      var label = p.id ? shortLabel(full, p.id)
        : (shortLabel(full, null) + ' — 작업 폴더가 아직 없습니다');
      var o = el('option', null, label);
      // 잘린 이름을 **어디선가는 온전히** 볼 수 있어야 한다
      o.title = full + (p.id ? (' · ' + p.id) : '');
      // 폴더가 없는 딜은 **키로** 고른다. 이름으로 이으면 이름 바꾸는 날 끊긴다
      o.value = p.id || ('ext:' + (p.externalId || full));
      if (p.id && p.id === state.projectId) o.selected = true;
      gEng.appendChild(o);
    });
    if (gEng.children.length) sel.appendChild(gEng);

    /* ③ 앱에 등록된 딜 — 고르면 엔진 프로젝트로 잇는다(이미 이어진 것은 그쪽으로 간다).
       앱 목록은 부모가 내려준다(C.appProjects). 단독으로 열면 이 무리는 없다 — 그게 정직하다 */
    if (apps.length) {
      var linkedPairs = C.appLinks || {};
      var gApp = el('optgroup'); gApp.label = '앱 프로젝트에서 가져오기';
      apps.forEach(function (a) {
        if (!a || !a.id) return;
        var tail = a.client ? (' · ' + a.client) : (a.owner ? (' · ' + a.owner) : '');
        var mark = linkedPairs[String(a.id)] ? ' (이어짐)' : '';
        var o = el('option', null, shortLabel(a.title || '(제목 없음)', null, 24) + tail + mark);
        o.title = (a.title || '(제목 없음)') + tail + mark;
        o.value = 'app:' + a.id;
        if (state.appBundle && String(state.appBundle.appId) === String(a.id)) o.selected = true;
        gApp.appendChild(o);
      });
      sel.appendChild(gApp);
    }

    sel.disabled = state.busy;
    sel.addEventListener('change', function () {
      var v = sel.value;
      if (v && v.indexOf('app:') === 0) pickAppProject(v.slice(4));
      else pickProject(v);
    });
    pick.appendChild(sel);
    box.appendChild(pick);

    // ★ 앱이 목록을 안 넘겼으면 **그렇다고 말한다.** 빈 무리를 그려 놓으면
    //   「내 딜이 왜 없나」를 사용자가 혼자 고민한다
    /* ★★ **「앱 밖에서 열었다」고 단정하지 않는다** 〈2026-08-23 · 사장님 화면에서 잡혔다〉.
     *   사장님은 **앱 안에** 계셨는데 이 문구가 「앱 안에서 열었을 때만 뜹니다」라고
     *   말했다. 그러면 읽는 사람은 자기가 어디 있는지부터 의심하게 된다 —
     *   실제 이유는 **앱이 목록을 안 넘긴 것**이고, 그 이유는 다리가 알고 있다. */
    if (!apps.length) {
      var why = bridgeReason();
      box.appendChild(el('p', 'note',
        '앱 프로젝트 목록을 못 받았습니다 — 이 화면은 앱 데이터를 직접 읽지 못하고 앱이 넘겨줘야 합니다'
        + (why ? ' (' + why + ')' : '') + '. '
        + '여기서는 「＋ 신규프로젝트」로 만들거나 이미 있는 보고서 프로젝트를 고를 수 있습니다.'));
    }
    /* ★ 보고서 프로젝트 목록이 잠겼으면 **잠겼다고 말한다.** 빈 목록으로 두면
       「내 프로젝트가 왜 없나」를 사용자가 혼자 고민한다. 그리고 **여기서 할 수
       있는 일**을 함께 적는다 — 막다른 길처럼 읽히지 않게 */
    if (state.listLocked) {
      box.appendChild(el('p', 'note',
        '이미 있는 보고서 프로젝트 목록은 로그인해야 보입니다 — 「＋ 신규프로젝트」로 '
        + '새로 만들고 자료를 올리는 것은 지금 그대로 됩니다.'));
    }
    if (state.appMsg) box.appendChild(el('p', 'note', state.appMsg));
    if (state.appStage >= 0 && !state.appBundle) {
      box.appendChild(el('p', 'note', '앱에서 읽는 중입니다…'));
    }
    return box;
  }

  /**
   * 무엇을 가져올지 고르는 칸. **개수를 먼저 보여 준다** — 눌러 놓고 나서
   * 「이만큼이나 들어왔나」를 알면 늦다.
   */
  function appImportCard() {
    var b = state.appBundle;
    if (!b || !state.projectId) return null;
    var n = countOf(b);
    if (!n.content && !n.files && !n.images && !n.notes && !(b.content && b.content.summary)) return null;

    // ★ `section.card` 가 아니라 **조각**이다 〈2026-08-21〉. 「자료 붙이기」 카드
    //   안쪽 「앱 프로젝트에서 가져오기」 갈래에 들어가므로, 카드를 또 두르면
    //   테두리가 겹치고 갈래 밖에 있는 것처럼 보인다
    var card = document.createDocumentFragment();
    add(card, el('p', 'card__d', '앱 프로젝트가 들고 있는 것입니다. '
      + '가져올 것만 고르십시오 — 나중에 다시 가져올 수 있습니다.'));

    var rows = [
      { id: 'content', t: '프로젝트 내용', c: n.content,
        d: n.content ? (n.content + '개 항목이 값으로 들어갑니다 (출처는 앱으로 적힙니다)')
          : '값으로 넣을 항목이 없습니다' },
      { id: 'files', t: '첨부파일', c: n.files,
        d: n.files ? (n.files + '개를 가리킵니다 — 사본을 만들지 않습니다') : '첨부가 없습니다' },
      { id: 'images', t: '이미지파일', c: n.images,
        d: n.images ? (n.images + '개를 가리킵니다') : '이미지가 없습니다' },
    ];
    rows.forEach(function (r) {
      var row = el('div', 'row');
      var left = el('div', 'row__b');
      var lab = el('label');
      lab.style.cssText = 'display:flex;gap:9px;align-items:center;cursor:pointer';
      var cb = el('input');
      cb.type = 'checkbox';
      cb.checked = !!state.appPick[r.id] && r.c > 0;
      cb.disabled = !r.c || state.busy;
      cb.addEventListener('change', function () { state.appPick[r.id] = cb.checked; });
      lab.appendChild(cb);
      lab.appendChild(el('div', 'row__n', r.t + (r.c ? ' · ' + r.c + '개' : '')));
      left.appendChild(lab);
      left.appendChild(el('div', 'row__m', r.d));
      row.appendChild(left);
      card.appendChild(row);
    });

    // ★ 사전에 없어 값이 될 수 없는 것 — **숨기지 않고 그렇다고 적는다**
    if (n.notes) {
      card.appendChild(el('p', 'note',
        '값으로 넣을 수 없는 메모 ' + n.notes + '건은 가져오지 않습니다 — '
        + '사전에 없는 항목을 값으로 넣으면 문서에 「출처 있는 값」으로 실립니다.'));
    }

    var go = el('button', 'btn', state.busy ? '가져오는 중…' : '가져오기');
    go.type = 'button';
    go.disabled = state.busy || !(state.appPick.content || state.appPick.files || state.appPick.images);
    go.addEventListener('click', importFromApp);
    card.appendChild(go);

    if (state.appStage >= 0) {
      card.appendChild(activityGraph({
        stages: APP_STAGES, at: state.appStage, dead: state.appDead,
        note: state.appDead ? '이 칸에서 멈췄습니다.' : '앱이 가진 것을 이 프로젝트로 옮기는 중입니다.',
      }));
    }
    if (state.appReport) card.appendChild(appReportBox(state.appReport));
    return card;
  }

  /** 가져온 결과. **거절된 것을 접어 두지 않는다** */
  function appReportBox(rep) {
    var box = el('div', 'up' + (rep.failed ? ' up--error' : ' up--done'));
    box.appendChild(el('p', 'up__d',
      '값 ' + rep.facts + '개 · 첨부 ' + rep.files + '개 · 이미지 ' + rep.images + '개를 가져왔습니다.'));
    (rep.rejected || []).forEach(function (r) {
      box.appendChild(el('p', 'up__d', '· ' + r.what + ' — ' + r.why));
    });
    return box;
  }

  /**
   * 저장된 값의 **개수**를 센다.
   *
   * ★★ 서버(`PUT /facts`)는 개수를 **숫자로** 준다 (`saved: 3`). 목록이 아니다.
   *   그런데 여기서 `.length` 로 세고 있었다 — 숫자에 `.length` 는 `undefined` 라
   *   화면에 「값 undefined개를 가져왔습니다」가 떴다. 값은 **실제로 들어갔는데**
   *   화면만 못 셌다. 실측으로 잡았다 (2026-08-22 · 실제 서버 응답 `saved: 1`).
   * ★ 다른 응답(`POST /sources`)은 목록으로 준다. 그래서 **둘 다** 받는다 —
   *   한쪽만 맞춰 두면 다음에 응답 모양이 바뀌는 날 같은 자리가 다시 빈다.
   */
  function savedCount(v) {
    if (typeof v === 'number') return v;
    return (v && v.length) || 0;
  }

  /**
   * 실제로 가져온다. **하나가 실패해도 나머지는 간다** — 한 건 때문에 전부를
   * 되돌리면 사용자는 무엇이 들어왔는지 모르는 채 처음부터 다시 한다.
   */
  function importFromApp() {
    var b = state.appBundle;
    if (!b || state.busy || !state.projectId) return;
    var base = '/projects/' + encodeURIComponent(state.projectId);
    var rep = { facts: 0, files: 0, images: 0, rejected: [], failed: false };

    state.busy = true; state.appReport = null; state.appDead = false;
    state.appStage = 0; render();

    // ① 프로젝트 내용 → 값. **출처를 붙여 보낸다**
    var step1 = Promise.resolve();
    var facts = (state.appPick.content && b.content && b.content.facts) || [];
    if (facts.length) {
      state.appStage = 1; render();
      var src = 'LinkPilot 앱 · ' + (b.appId || '딜')
        + ((b.content && b.content.updatedAt) ? ' · ' + b.content.updatedAt : '');
      step1 = call('PUT', base + '/facts', {
        facts: facts.map(function (f) {
          return { key: f.key, value: f.value, unit: f.unit || null,
            quote: f.quote || null, source: f.source || src };
        }),
      }, { localGate: true }).then(function (r) {
        if (r && r.ok && r.body) {
          rep.facts = savedCount(r.body.saved);
          (r.body.rejected || []).forEach(function (x) {
            rep.rejected.push({ what: x.key, why: x.reason });
          });
        } else {
          rep.failed = true;
          rep.rejected.push({ what: '프로젝트 내용', why: (r && (r.msg || r.closed)) || '넣지 못했습니다' });
        }
      }, function (e) {
        rep.failed = true;
        rep.rejected.push({ what: '프로젝트 내용', why: e.message });
      });
    }

    // ② 첨부 · ③ 이미지 → 연결 장부. **하나씩** 보낸다 (한 건이 죽어도 나머지가 간다)
    return step1.then(function () {
      var jobs = [];
      var push = function (list, kind) {
        (list || []).forEach(function (f) {
          jobs.push(function () {
            // ★★ 출처 이름은 **서버가 정한다** 〈2026-08-21〉. 여기 손으로 적어 두었더니
            //   검증기만 그 이름을 몰라 첨부가 전부 거절됐고, 화면에는 「첨부 0개」가
            //   떴다. 서버가 안 알려 주는 옛 판을 위해 같은 값을 뒤에 두되,
            //   **둘이 같은 값인지는 검사가 지킨다**
            var prov = (state.linked && state.linked.appProvider) || APP_PROVIDER;
            var ref = f.ref || { provider: prov, fileId: f.id || f.name, name: f.name,
              rev: f.rev || null, bytes: f.bytes || null, kind: kind };
            // 앱이 ref 를 통째로 줬어도 출처 이름은 **서버가 아는 것**으로 맞춘다
            if (f.ref && !f.ref.provider) ref.provider = prov;
            return call('POST', base + '/linked', { ref: ref, access: f.access || null },
              { localGate: true }).then(function (r) {
              if (r && r.ok) { rep[kind === 'image' ? 'images' : 'files'] += 1; return; }
              rep.failed = true;
              rep.rejected.push({ what: f.name || '(이름 없음)',
                why: (r && (r.msg || r.closed)) || '잇지 못했습니다' });
            }, function (e) {
              rep.failed = true;
              rep.rejected.push({ what: f.name || '(이름 없음)', why: e.message });
            });
          });
        });
      };
      if (state.appPick.files) push(b.files, 'file');
      if (state.appPick.images) push(b.images, 'image');
      if (!jobs.length) return null;
      state.appStage = 2; render();
      return jobs.reduce(function (p, job) { return p.then(job); }, Promise.resolve());
    }).then(function () {
      state.busy = false;
      state.appStage = 3;
      state.appDead = rep.failed;
      state.appReport = rep;
      return loadOne(state.projectId).then(function () {
        render();
        // ★ 앱 첨부·이미지는 **연결 장부에 적힌 것**이라 아직 안 읽혔다.
        //   앱이 준 「프로젝트 내용」은 이미 값이지만, 첨부는 여기서 읽는다.
        //   ★ 하나라도 실패했으면 자동으로 넘기지 않는다 — 무엇이 빠졌는지
        //     먼저 봐야 한다 (2026-08-21 사용자 지시)
        if (rep.failed) return null;
        return scanNow({ auto: true });
      });
    }, function (e) {
      state.busy = false;
      state.appDead = true;
      rep.failed = true;
      rep.rejected.push({ what: '가져오기', why: e.message });
      state.appReport = rep;
      render();
    });
  }


  /* ── 자료 스캔 → 보고서 생성으로 ─────────────────────────────────────
     〈2026-08-21 사용자 지시 — 「모두 업로드된 자료는 OCR 스캔을 통해 새보고서
       생성으로 전달되도록」 · 「2단계 [새보고서 생성]탭으로 자동 이동」〉

     ★★ 왜 필요했나: 셋 중 무엇으로 넣든 자료는 **넣기만** 되고 읽히지 않았다.
       읽는 것은 보고서를 만드는 순간이었다. 그래서 자료를 넣은 사람이 2단계에
       가면 **빈 칸만** 보였다 — 값이 없는 것이 아니라 아직 안 읽은 것인데,
       화면은 그 둘을 구분해 말하지 못했다.

     ★ 「OCR 스캔」은 **이미지·스캔본에만** 걸린다. 글자가 들어 있는 PDF·워드·
       엑셀을 굳이 옮겨 적으면 신뢰도만 깎인다 (core/ocr.js). 그래서 「전부
       OCR 했다」고 말하지 않고 **파일마다 어떻게 읽었는지** 그대로 보여 준다.

     ★★ 값이 하나도 안 나왔으면 **옮기지 않는다.** 옮기면 사용자는 빈 칸을 보고
       자기가 뭘 잘못한 줄 안다. 여기서 「무엇을 못 읽었는지」를 먼저 본다. */
  var SCAN_STAGES = ['자료 모으기', '읽기 · OCR', '값으로 만들기', '보고서 생성으로'];

  /**
   * 스캔이 도는 동안 **시계를 돌린다** 〈2026-08-22 사용자 지시 — 「진행율, 시간 표기」〉.
   *
   * ★★ 앞 판은 서버가 답할 때까지 `stage` 가 **0 에 그대로** 있었다. 단추만
   *   「읽는 중…」으로 바뀌고 칸도 숫자도 그대로라, 도는 중인지 멈춘 건지
   *   화면만 봐서는 알 수 없었다.
   *
   * ★ 칸은 **「읽기 · OCR」에서 멈춘다.** 그 뒤 칸(값으로 만들기)은 서버가
   *   답해야 아는 것이라, 미리 넘기면 **하지도 않은 일을 했다고 그리는 것**이다.
   * ★ 진행률은 걸린 시간으로 어림하되 **90% 를 넘기지 않는다** (meter 주석 참고).
   */
  var SCAN_TICK_MS = 200;
  /** 어림의 기준. 실측 감각치다 — 대개 이 안에 끝난다 */
  var SCAN_TYPICAL_MS = 20000;

  function stopScanClock() {
    if (state.scan && state.scan.timer) clearInterval(state.scan.timer);
    if (state.scan) state.scan.timer = null;
  }

  /**
   * ★★★ **어림 대신 센 수를 받아 온다** 〈2026-08-24 사장님: 「서버가 읽고,
   *   스캔하는데 너무 오래걸림 / 그런데 결국 읽은 값은 0」〉.
   *
   *   스캔 요청은 **다 읽어야 답한다.** 그래서 앞 판은 진행률을 걸린 시간으로
   *   어림했고, 자료가 30개든 1개든 같은 속도로 차올랐다. 이제 서버가 파일
   *   하나를 끝낼 때마다 적어 두고, 여기서 **다른 문으로** 물어본다.
   *
   * ★ 겹쳐 묻지 않는다. 앞의 물음이 안 왔으면 건너뛴다 — 느린 서버에 물음만
   *   쌓이면 그것이 다시 느려지는 원인이 된다.
   * ★ **못 물어본 것을 실패로 그리지 않는다.** 진행을 모르는 것은 불편이고,
   *   스캔이 죽는 것은 사고다. 물음이 실패하면 그냥 앞의 값을 둔다.
   */
  var SCAN_ASK_MS = 700;

  function askProgress() {
    var sc = state.scan;
    if (!sc || !sc.busy || sc.asking) return;
    if (now() - (sc.askAt || 0) < SCAN_ASK_MS) return;
    sc.asking = true;
    sc.askAt = now();
    call('GET', '/projects/' + encodeURIComponent(state.projectId) + '/scan/progress', null,
      { localGate: true }).then(function (r) {
      var cur = state.scan;
      if (cur) cur.asking = false;
      if (!cur || !cur.busy) return;
      if (r && r.ok && r.body && r.body.known) { cur.prog = r.body; render(); }
    }, function () {
      if (state.scan) state.scan.asking = false;
    });
  }

  function scanNow(opts) {
    if (!state.projectId || state.scan.busy) return Promise.resolve(null);
    var auto = !!(opts && opts.auto);
    stopScanClock();
    state.scan = { busy: true, stage: 0, dead: false, result: null, msg: null, auto: auto, moved: null,
      t0: now(), ms: 0, tookMs: null, timer: null, prog: null, asking: false, askAt: 0 };
    render();

    state.scan.timer = setInterval(function () {
      var sc = state.scan;
      if (!sc || !sc.busy) return stopScanClock();
      sc.ms = now() - sc.t0;
      // 모으기는 실제로 곧 끝난다. 그 뒤 읽기 칸에서 **머문다** — 그게 사실이다
      if (sc.stage < 1 && sc.ms > 700) sc.stage = 1;
      askProgress();
      render();
    }, SCAN_TICK_MS);

    return call('POST', '/projects/' + encodeURIComponent(state.projectId) + '/scan', {},
      { localGate: true }).then(function (r) {
      state.scan.busy = false;
      state.scan.tookMs = now() - state.scan.t0;
      stopScanClock();
      if (r && r.gated) { state.scan.stage = -1; state.scan.msg = r.msg; return render(); }
      if (r && r.closed) {
        // 501 — 아직 안 붙은 길이다. **오류로 그리지 않는다** (화면 전체가 그 규칙이다)
        state.scan.stage = -1;
        state.scan.msg = r.closed;
        return render();
      }
      if (!r || !r.ok || !r.body) {
        state.scan.dead = true;
        state.scan.stage = 1;
        state.scan.msg = (r && r.body && r.body.error) || '자료를 읽지 못했습니다.';
        return render();
      }
      state.scan.result = r.body;
      state.scan.stage = r.body.facts > 0 ? 3 : 2;
      // 값이 하나도 안 나왔으면 **여기서 멈춘다.** 넘어가면 빈 칸만 보게 된다
      if (!r.body.facts) { render(); return null; }
      // ★ 아직 안 읽은 것이 남았으면 **자동으로 넘기지 않는다** 〈2026-08-21〉.
      //   반만 읽은 값으로 2단계에 가면, 왜 어떤 칸만 비었는지 알 수가 없다.
      //   사람이 한 번 더 눌러 다 읽은 뒤에 넘어가는 쪽이 싸다
      if (r.body.remaining) { render(); return null; }
      goReport();
      return null;
    }, function (e) {
      state.scan.busy = false;
      state.scan.tookMs = now() - state.scan.t0;
      stopScanClock();
      state.scan.dead = true;
      state.scan.stage = 1;
      state.scan.msg = e && e.message ? e.message : '자료를 읽지 못했습니다.';
      render();
      return null;
    });
  }

  /* ══════════ 이관 — **넘어가는 것을 눈으로 보여 준다** 〈2026-08-22〉 ══════════
   *
   * ★★ 왜 칸을 따로 두는가: 올리기(`UP_STAGES`)와 스캔(`SCAN_STAGES`)은 **여기서
   *   일어나는 일**이고, 이관은 **여기를 떠나는 일**이다. 같은 그래프에 이어
   *   붙이면 「아직 이 화면에서 뭔가 하는 중」으로 읽혀서, 탭이 바뀌는 순간이
   *   또 갑작스러워진다. 떠난다는 것은 떠나기 전에 말해야 한다.
   */
  var HANDOFF_STAGES = ['올린 자료', '읽어서 값으로', '값을 넘김', '「' + F.SECTION.tab + '」에서 이어서'];

  /** 칸 하나를 몇 ms 씩 보여 주는가. 짧으면 못 읽고, 길면 기다리게 된다 */
  var HANDOFF_STEP_MS = 520;

  function startHandoff(facts, documents) {
    stopHandoff();
    state.handoff = {
      stage: 0, facts: facts, documents: documents,
      moving: true, held: false, movedAt: null,
    };
    render();
    state.handoff.timer = setInterval(function () {
      var h = state.handoff;
      if (!h || h.held) return;
      h.stage += 1;
      if (h.stage >= HANDOFF_STAGES.length - 1) {
        stopHandoff();
        h.stage = HANDOFF_STAGES.length - 1;
        h.moving = false;
        goReport();          // ★ 다 그린 **뒤에** 넘긴다
        return;
      }
      render();
    }, HANDOFF_STEP_MS);
  }

  function stopHandoff() {
    if (state.handoff && state.handoff.timer) clearInterval(state.handoff.timer);
    if (state.handoff) state.handoff.timer = null;
  }

  /** 「여기 그대로 있기」 — 사람이 멈출 수 있어야 자동이 무섭지 않다 */
  function holdHandoff() {
    stopHandoff();
    if (state.handoff) { state.handoff.held = true; state.handoff.moving = false; }
    render();
  }

  function handoffCard() {
    var h = state.handoff;
    if (!h) return null;
    var card = el('section', 'card card--handoff');

    var hh = el('div', 'sub__h');
    hh.appendChild(el('span', 'sub__n', '3'));
    var ht = el('div');
    ht.appendChild(el('div', 'sub__t', '「' + F.SECTION.tab + '」으로 넘기기'));
    ht.appendChild(el('div', 'sub__d',
      '문서 ' + h.documents + '건에서 값 ' + h.facts + '개를 만들었습니다. '
      + '값을 넣고 확인하는 자리는 이 탭이 아니라 「' + F.SECTION.tab + '」입니다.'));
    hh.appendChild(ht);
    card.appendChild(hh);

    card.appendChild(activityGraph({
      stages: HANDOFF_STAGES,
      at: h.stage,
      dead: false,
      note: h.held
        ? '여기 멈춰 있습니다 — 아래 단추로 언제든 넘어갈 수 있습니다.'
        : '값은 이미 저장되어 있습니다. 넘어가도 다시 올릴 필요가 없습니다.',
    }));

    /* ★ **어디로 가는지**와 **왜 거기인지**를 적는다. 도착 화면이 「값은 앱 안에서
     *   받습니다」로 시작하는데, 어디서 왜 왔는지를 모르면 그 문장이 뜬금없다. */
    card.appendChild(el('p', 'note',
      '출처 없는 숫자를 막는 검사(출처 필수 · 계산 항목 입력 금지 · 사양 확정)가 '
      + '「' + F.SECTION.tab + '」 단계 안에 있습니다. 그래서 값 넣기를 그쪽에서 합니다.'));

    var row = el('div', 'hand__b');
    if (h.moving) {
      var stay = el('button', 'btn2', '여기 그대로 있기');
      stay.type = 'button';
      stay.addEventListener('click', holdHandoff);
      row.appendChild(stay);
    }
    var go = el('button', 'btn', '「' + F.SECTION.tab + '」으로 가기');
    go.type = 'button';
    go.addEventListener('click', function () { stopHandoff(); h.moving = false; goReport(); });
    row.appendChild(go);
    card.appendChild(row);

    /* 넘겼는데 **아무도 안 받았으면** 그렇다고 말한다. 되는 척하지 않는다 */
    if (h.movedAt === false) {
      card.appendChild(el('p', 'note',
        '이 화면은 탭 하나라 스스로 옮길 수 없습니다 — 위 탭에서 「'
        + F.SECTION.tab + '」을 눌러 주십시오. 값은 이미 들어가 있습니다.'));
    } else if (h.movedAt === true) {
      card.appendChild(el('p', 'note', '「' + F.SECTION.tab + '」으로 넘겼습니다.'));
    }
    return card;
  }

  /**
   * 2단계 「보고서 생성」으로 옮긴다 — **옮기는 방법은 flow-core 한 곳에 있다.**
   *
   * ★ 이 화면은 탭 하나라 스스로 갈 수 없다. 앱이 옮긴다. 그래서 **받았는지**를
   *   확인하고, 아무도 안 받았으면 「탭을 눌러 주십시오」라고 말한다.
   *   되는 척하면 사용자는 아무 일도 안 일어나는 화면을 본다.
   */
  function goReport() {
    var r = F.openSection({
      projectId: state.projectId,
      section: F.SECTION.id,
      step: 'fields',        // 값이 들어간 곳이 2단계 「가이드 필드」다
      why: 'scan',
    });
    state.scan.moved = r.sent;
    if (state.handoff) state.handoff.movedAt = r.sent;   // 이관 칸도 같은 답을 쓴다
    render();
  }

  /** 스캔 칸. **무엇을 어떻게 읽었는지 파일마다** 보여 준다 */
  function scanCard() {
    if (!state.projectId) return null;
    var card = el('section', 'card');
    /* ★ 앞 칸(① 자료 수집)과 **같은 꼴로** 부른다. 번호가 둘을 한 줄기로 잇는다
     *   — 「모으는 곳」과 「읽어서 보내는 곳」이 따로 보이면 어느 것을 먼저
     *   해야 하는지가 화면에 없다 〈2026-08-21 사용자 지시〉. */
    var sh = el('div', 'sub__h');
    sh.appendChild(el('span', 'sub__n', '2'));
    var sht = el('div');
    sht.appendChild(el('h2', 'card__t sub__t', '자료 스캔'));
    sht.appendChild(el('div', 'sub__d',
      '① 에서 모은 자료를 읽어 「' + F.SECTION.tab + '」으로 보냅니다.'));
    sh.appendChild(sht);
    card.appendChild(sh);
    card.appendChild(el('p', 'card__d',
      '넣은 자료를 읽어 값으로 만듭니다. 이미지·스캔본은 글자로 옮겨서(OCR) 읽고, '
      + '그 값은 신뢰도를 낮춰 표시합니다. 읽고 나면 「'
      + F.SECTION.tab + '」으로 넘어갑니다.'));

    /* ★★ **여기서 읽을 수 있는 것과 없는 것을 미리 가른다** 〈2026-08-21 · 실제 신고〉.
       「파일업로드」(1회성)는 **올리는 그 자리에서 읽고 파일을 버린다.** 그래서
       이 단추로는 다시 읽을 원본이 없다 — 그런데 화면은 단추를 그대로 열어 두고,
       누르면 「자료를 먼저 넣어 주십시오」라고 **사용자를 탓했다.**
       ★ 단추를 없애지는 않는다. 보관·연결 자료가 함께 있을 수 있고, 그때는
         눌러야 한다. 대신 **무엇이 스캔 대상인지 먼저 말한다.** */
    var keptN = ((state.kept && state.kept.files) || []).length;
    var linkN = ((state.linked && state.linked.items) || []).length;
    var shotN = ((state.oneshot && state.oneshot.items) || []).length;
    if (!keptN && !linkN && shotN) {
      card.appendChild(el('p', 'note',
        '「' + wayName('oneshot') + '」로 넣은 ' + shotN + '건은 여기 오지 않습니다 — '
        + '올리는 그 자리에서 이미 읽었고, 보관하지 않으므로 원본이 남아 있지 않습니다. '
        + '다시 읽어야 하면 「' + wayName('linked') + '」로 넣으십시오.'));
    }
    // ★ 아직 안 올린 파일을 손에 든 채 스캔을 누르면 **그것부터 말한다.**
    //   「자료가 없다」로 답하면 사용자는 고른 파일이 안 보이는 줄 안다
    var waiting = state.picked.filter(function (f) { return f.data && !f.tooBig; }).length;
    if (waiting) {
      card.appendChild(el('p', 'note',
        // ★ 조사를 이름 뒤에 붙이지 않는다 — 갈래 이름은 사람이 정하는 값이라
        //   받침을 미리 알 수 없다 (「파일업로드」을 → 를 이 어긋났다)
        '고른 파일 ' + waiting + '개가 아직 안 올라갔습니다 — 위에서 「'
        + wayName('oneshot') + '」 단추를 먼저 누르십시오. 스캔은 올라간 자료만 읽습니다.'));
    }

    var go = el('button', 'btn', state.scan.busy ? '읽는 중…' : '자료 스캔');
    go.type = 'button';
    go.disabled = state.scan.busy || state.busy;
    go.addEventListener('click', function () { scanNow({ auto: false }); });
    card.appendChild(go);

    if (state.scan.stage >= 0) {
      card.appendChild(activityGraph({
        stages: SCAN_STAGES, at: state.scan.stage, dead: state.scan.dead,
        note: state.scan.dead ? '이 칸에서 멈췄습니다.'
          : '자료를 읽어 값으로 만드는 중입니다 — 이미지는 글자로 옮깁니다.',
      }));

      /* ── 진행률 · 걸린 시간 〈2026-08-22 사용자 지시〉 ──────────────
       *  ★ 도는 동안엔 **어림값**(90% 상한), 끝나면 **잰 값**을 그대로 보여 준다.
       *  ★ 읽을 건수는 아는 값이라 함께 적는다 — 「몇 건을 읽는 중인지」가
       *    보이면 오래 걸리는 것이 고장이 아니라는 것이 설명된다. */
      var sc = state.scan;
      /* ★ 보관은 `files`, 연결은 `items` 다 — 이름이 다르다. 한쪽 이름으로 둘 다
         읽으면 **조용히 0** 이 되고, 화면에는 건수만 빠진 채 멀쩡히 뜬다.
         (같은 카드 위쪽 `keptN`·`linkN` 과 같은 이름을 쓴다) */
      var nRead = keptN + linkN;
      /* ★★★ **센 수가 있으면 그것이 이긴다** 〈2026-08-24〉. 서버가 파일 하나를
       *   끝낼 때마다 적어 두고 우리가 물어본 값이다. 어림과 섞어 쓰지 않는다 —
       *   섞으면 화면이 두 수를 말하고, 어느 쪽이 사실인지 알 수 없게 된다.
       * ★ 분모를 모르면(`pct === null`) **모른다고 적는다.** 0% 로 적으면
       *   「돌고 있는데 안 는다」로 읽힌다. */
      var pg = sc.prog;
      var counted = !!(pg && pg.total > 0 && pg.pct !== null && pg.pct !== undefined);
      if (sc.busy && counted) {
        card.appendChild(meter({
          pct: pg.pct,
          secs: secsText(sc.ms),
          sub: pg.done + '/' + pg.total + '건 읽음',
          note: '**센 수입니다** — 자료 ' + pg.total + '건 중 ' + pg.done + '건을 읽었습니다'
            + (pg.failed ? ' (' + pg.failed + '건은 못 읽었습니다)' : '')
            + (pg.last && pg.last.name ? ' · 방금 「' + pg.last.name + '」' : '') + '.',
        }));
        /* ★ 값이 몇 개 나왔는지도 **읽는 중에** 보여 준다. 다 끝나고 0 을 보는
         *   것과, 도는 동안 0 인 것을 보는 것은 대응이 다르다 */
        card.appendChild(el('p', 'up__d',
          '지금까지 값 ' + (pg.facts || 0) + '개'
          + (pg.ocr ? ' · 글자로 옮겨 읽은 것 ' + pg.ocr + '건' : '')));
      } else if (sc.busy) {
        var pct = Math.min(90, (sc.ms / SCAN_TYPICAL_MS) * 90);
        card.appendChild(meter({
          pct: pct,
          secs: secsText(sc.ms),
          sub: nRead ? nRead + '건 읽는 중' : null,
          note: '진행률은 **어림값**입니다 — 서버가 아직 중간 상태를 안 알려 줘 '
            + '걸린 시간으로 셈합니다. 끝나면 100% 가 됩니다.',
        }));
      } else if (sc.tookMs !== null && sc.tookMs !== undefined) {
        card.appendChild(meter({
          pct: sc.dead ? Math.min(90, (sc.tookMs / SCAN_TYPICAL_MS) * 90) : 100,
          secs: secsText(sc.tookMs),
          done: !sc.dead,
          sub: sc.dead ? '멈춤' : (sc.result ? (sc.result.documents || 0) + '건 읽음' : null),
          note: sc.dead ? '여기까지 걸린 시간입니다.' : null,
        }));
      }
    }
    if (state.scan.msg) card.appendChild(el('p', 'note', state.scan.msg));

    var res = state.scan.result;
    if (res) {
      // ★★ **읽을 것이 없는 것은 오류가 아니다** 〈2026-08-21 · 실제 신고로 고침〉.
      //   빨간 상자로 그리면 고장으로 읽힌다. 실제로 「파일업로드」로 넣고
      //   스캔을 누른 사용자가 빨간 칸과 「자료를 먼저 넣어 주십시오」를 봤다 —
      //   방금 넣은 사람에게 안 넣었다고 말한 셈이다.
      //   읽었는데 값이 0 인 것만 빨갛게 둔다 (그건 확인이 필요한 상태다)
      var nothingToRead = res.empty && !(res.scanned || []).length;
      var okBox = el('div', 'up' + (res.facts ? ' up--done' : (nothingToRead ? '' : ' up--error')));
      okBox.appendChild(el('p', 'up__d', nothingToRead
        ? (res.note || '읽을 자료가 없습니다.')
        : ('문서 ' + res.documents + '건에서 값 ' + res.facts + '개를 만들었습니다.')));
      // ★ 파일마다 **어떻게 읽었는지**. 「OCR 했다」로 뭉뚱그리지 않는다.
      // ★★ **한 파일에 한 줄이다** 〈2026-08-21 · 실제로 돌려 보고 잡았다〉.
      //   전에는 「읽을 작정」과 「실제 결과」를 따로 그려서, 같은 파일이
      //   「OCR 로 읽음」과 「못 읽음」 두 줄로 떴다. 둘 다 화면에 있으면
      //   사용자는 어느 쪽이 사실인지 알 방법이 없다
      (res.scanned || []).forEach(function (f) {
        // 서버가 `read` 를 안 주는 옛 판이면 `readable` 로 본다 (모르면 막지 않는다)
        var got = (f.read === undefined) ? f.readable : f.read;
        var how = got ? (f.ocr ? 'OCR — 글자로 옮겨 읽음' : '본문을 읽음')
          : ('못 읽었습니다 — ' + (f.why || f.note || '사유 없음'));
        okBox.appendChild(el('p', 'up__d', '· ' + f.name + ' — ' + how));
      });
      (res.unread || []).forEach(function (u) {
        okBox.appendChild(el('p', 'up__d', '· ' + u.name + ' — 못 읽었습니다: ' + u.why));
      });
      if (!res.facts && (res.scanned || []).length) {
        okBox.appendChild(el('p', 'up__d',
          '값이 하나도 안 나와서 「' + F.SECTION.tab + '」으로 넘어가지 않았습니다 — '
          + '넘어가도 빈 칸만 보입니다. 위 목록에서 못 읽은 것을 먼저 보십시오.'));
      }
      // ★★ 양이 넘쳐 **남은 것**이 있으면 그 자리에서 말한다 〈2026-08-21〉.
      //   안 말하면 화면에는 「읽었다」만 남고, 빠진 자료는 아무도 모른다.
      //   ★ 남았으면 **넘어가지 않는다** — 반만 읽은 값으로 2단계에 가면
      //     빈 칸을 보고 「왜 이것만 없지」를 혼자 찾게 된다
      if (res.remaining) {
        okBox.appendChild(el('p', 'up__d',
          '양이 많아 ' + res.remaining + '개를 아직 안 읽었습니다 — '
          + '「자료 스캔」을 다시 누르면 이어서 읽습니다.'));
      }
      if (res.oneshotNote) okBox.appendChild(el('p', 'up__d', res.oneshotNote));
      card.appendChild(okBox);
    }

    if (state.scan.moved === true) {
      card.appendChild(el('p', 'note', '「' + F.SECTION.tab + '」으로 넘겼습니다.'));
    } else if (state.scan.moved === false) {
      card.appendChild(el('p', 'note',
        '이 화면은 탭 하나라 스스로 옮길 수 없습니다 — 위 탭에서 「'
        + F.SECTION.tab + '」을 눌러 주십시오. 값은 이미 들어가 있습니다.'));
    }
    return card;
  }

  /** 연결 갈래의 칸 이름 — 한 곳에서 정한다 */
  var LINK_STAGES = ['저장소 열기', '파일 고르기', '장부에 적기', '붙었습니다'];

  /** 앱이 연 창에서 고른 결과를 서버에 넘긴다 */
  function pickFrom(provider, btn) {
    if (state.busy) return;
    var open = C.pickFrom;
    if (typeof open !== 'function') {
      // ★ 앱이 창을 안 넘겨 주면 **여기서 멈춘다.** 되는 척하지 않는다.
      //   ★★ 브라우저 탓을 하지 않는다 — 브라우저는 아무 상관이 없다.
      //     틀린 원인을 말하면 사용자가 엉뚱한 것을 고치러 간다 (2026-08-20 실측)
      state.linkMsg = '파일 고르기 창이 아직 연결되지 않았습니다 — '
        + '지금은 「' + wayName('oneshot') + '」 갈래로 넣을 수 있습니다.';
      state.linkStage = 0; state.linkDead = true;
      return render();
    }
    state.busy = true; state.linkMsg = null;
    state.linkStage = 0; state.linkDead = false;
    if (btn) btn.disabled = true;
    render();

    Promise.resolve()
      .then(function () { state.linkStage = 1; render(); return open(provider); })
      .then(function (picked) {
        // 고르기 창을 그냥 닫은 경우 — 오류가 아니다. 칸을 되돌린다
        if (!picked || !picked.ref) {
          state.busy = false; state.linkStage = -1; return render();
        }
        state.linkStage = 2; render();
        // ★ ref 와 access 를 **따로** 보낸다. 섞어 보내면 장부에 열쇠가 들어간다
        return call('POST', '/projects/' + state.projectId + '/linked',
          { ref: picked.ref, access: picked.access || null })
          .then(function (r) {
            state.busy = false;
            if (r && r.ok) {
              state.linkStage = 3;
              // ★ 연결한 자료는 **아직 안 읽힌 상태**다 — 장부에 적혔을 뿐이다.
              //   여기서 읽어 값으로 만들고 2단계로 넘긴다 (2026-08-21 사용자 지시)
              return loadOne(state.projectId).then(function () {
                render();
                return scanNow({ auto: true });
              });
            }
            state.linkDead = true;
            if (r && r.closed) state.linkMsg = r.closed;
            if (r && r.gated) state.linkMsg = r.msg;
            render();
          });
      })
      .catch(function (e) {
        state.busy = false;
        state.linkDead = true;
        state.linkMsg = e && e.message ? e.message : '파일을 고르지 못했습니다.';
        render();
      });
  }

  /**
   * 붙일 수 있는 저장소 이름. **서버가 알려 준다** — 화면에 적어 두면 늘어날 때 갈린다.
   * 연결 갈래를 골랐을 때만 쓴다 (목록 아래에 늘 깔아 두면 잡음이 된다).
   */
  function providerNames() {
    return ((state.linked && state.linked.providers) || []).map(function (p) { return p.name; }).join(' · ');
  }

  /**
   * **원본이 그대로인가** 〈2026-08-21 · D-72 결정〉.
   *
   * ★★ 왜 사람이 눌러야 하나: 「그때그때 고르기」로 가기로 했다. 남의 저장소
   *   열쇠를 **보관하지 않는다** — 보관하지 않는 열쇠는 샐 수 없다. 대신
   *   **폴더를 지켜볼 수가 없다.** 새 파일이 생기거나 원본이 바뀌어도 우리는
   *   모른다. 그래서 「지금 확인해 줘」를 사람이 누른다.
   *
   * ★★ **서버 길은 처음부터 있었는데 화면이 한 번도 안 불렀다.** 만들어 놓고
   *   아무도 안 부르는 것이었다 — 그 상태는 아무 오류도 내지 않고, 기능이
   *   「있다」고 적혀 있는데 실제로는 안 도는 것이 전부다 (M-08 계열).
   *
   * ★ **접근권이 만료되면 「다시 골라 주세요」가 나온다.** 그것이 고장이 아니라
   *   이 선택의 값이라는 것을 화면이 말한다 — 안 그러면 사용자는 고장으로 읽는다.
   */
  function checkLinked() {
    if (state.checking || !state.projectId) return;
    state.checking = true; state.checked = null; render();
    call('POST', '/projects/' + encodeURIComponent(state.projectId) + '/linked/verify',
      {}, { localGate: true })
      .then(function (r) {
        state.checking = false;
        if (r && r.ok) state.checked = r.body;
        else state.checked = { error: (r && (r.msg || r.closed)) || '확인하지 못했습니다' };
        render();
      }, function (e) {
        state.checking = false;
        state.checked = { error: e && e.message ? e.message : '확인하지 못했습니다' };
        render();
      });
  }

  /** 확인 결과. **바뀐 것·사라진 것을 접어 두지 않는다** */
  function checkBox() {
    var items = (state.linked && state.linked.items) || [];
    if (!items.length) return null;

    var box = el('div', 'chk');
    var b = el('button', 'chk__b', state.checking ? '확인하는 중…' : '원본이 그대로인지 확인');
    b.type = 'button';
    b.disabled = state.checking;
    b.addEventListener('click', checkLinked);
    box.appendChild(b);
    box.appendChild(el('p', 'note',
      '폴더를 계속 지켜보지 않습니다 — 남의 저장소 열쇠를 보관하지 않기 때문입니다. '
      + '대신 필요할 때 눌러서 확인합니다.'));

    var c = state.checked;
    if (!c) return box;

    if (c.error) {
      var e1 = el('div', 'chk__r chk__r--no');
      e1.appendChild(el('div', 'chk__t', '확인하지 못했습니다'));
      e1.appendChild(el('p', 'chk__l', c.error));
      box.appendChild(e1);
      return box;
    }

    var bad = (c.changed || []).length + (c.missing || []).length
      + (c.errors || []).length + (c.unread || []).length;
    var r = el('div', 'chk__r ' + (bad ? 'chk__r--no' : 'chk__r--ok'));
    r.appendChild(el('div', 'chk__t', bad
      ? ('확인이 필요한 것이 ' + bad + '건 있습니다')
      : ('연결한 ' + (c.ok_ || []).length + '건이 모두 그대로입니다')));

    var ul = el('ul', 'chk__l');
    // ★ 종류마다 **할 일이 다르다.** 뭉쳐서 「확인 필요」로 내면 무엇을 해야 할지 모른다
    (c.changed || []).forEach(function (x) {
      ul.appendChild(el('li', null, '· ' + x.name
        + ' — 원본이 바뀌었습니다 (읽은 판 ' + String(x.was).slice(0, 8)
        + ' → 지금 ' + String(x.now).slice(0, 8) + '). 다시 읽어야 합니다'));
    });
    (c.missing || []).forEach(function (x) {
      ul.appendChild(el('li', null, '· ' + x.name + ' — 원본이 없습니다 (지웠거나 옮겼습니다)'));
    });
    /* ★★ 「확인 못 함」은 **두 가지**다 〈2026-08-22〉.
     *     ① 아직 한 번도 안 읽었다 — 견줄 지문이 없다
     *     ② 읽기는 읽었는데 **제공자가 판(rev)을 안 알려 준다** — 견줄 값이 없다
     *   ②를 ①의 말로 그리면 **방금 읽은 사람에게 「안 읽었다」고 말하게 된다**
     *   (M-14 와 같은 종류다). 서버가 사유를 주면 그것을 그대로 쓴다. */
    (c.unread || []).forEach(function (x) {
      ul.appendChild(el('li', null, '· ' + x.name + ' — '
        + (x.reason || '아직 한 번도 읽지 않아 견줄 것이 없습니다')));
    });
    (c.errors || []).forEach(function (x) {
      ul.appendChild(el('li', null, '· ' + x.name + ' — ' + x.reason));
    });
    if (ul.childNodes.length) r.appendChild(ul);

    if (c.at) r.appendChild(el('p', 'chk__at', c.at + ' 확인'));
    box.appendChild(r);
    return box;
  }

  /**
   * **같은 문서의 여러 판** 〈2026-08-21 · 클라우드 폴더 지시 §7〉.
   *
   * ★★ 폴더에서 자료를 고르면 `IM_v1.pdf` · `IM_v2.pdf` · `IM_Final.pdf` 가 함께
   *   들어온다. 사람은 「Final 이 최신이겠지」로 넘어가는데 **그 짐작이 자주
   *   틀린다.** 틀린 판으로 보고서를 만들면 숫자는 멀쩡해 보이고 출처도 붙어서
   *   **문서만 봐서는 안 잡힌다.**
   *
   * ★★ **화면이 고르지 않는다.** 순서와 근거만 보여 주고 고르는 것은 사람이다.
   *   근거 종류가 다르면(번호 vs 날짜) 「못 가렸다」고 그대로 말한다.
   *
   * ★ 출처를 가리지 않는다 — 연결한 것도, 1회성으로 올린 것도 함께 본다.
   *   같은 문서가 두 길로 들어오는 경우가 실제로 있다.
   */
  function versionBox() {
    var V = window.LinkPilotVersions;
    if (!V) return null;
    /* ★★★ **보관 자료가 빠져 있었다** 〈2026-08-23 사장님: 「이중으로 과거 앞서
     *   올렸던 자료와 겹쳐서 중복으로 보임」〉.
     *
     *   앞 판은 연결·1회성만 봤다. 그때는 보관 업로드가 화면에 없었으니 맞는
     *   목록이었다. 그런데 오늘 보관을 되살리면서 **같은 문서가 「보관」과
     *   「1회성 기록」 양쪽에 남게** 되었고, 화면은 그것을 두 자료로 보여 줬다.
     *
     * ★ 어디 있는 것인지를 함께 담는다(`where`) — 「같은 이름이 둘」과
     *   「올린 기록이 남아 있을 뿐」은 사람이 할 일이 다르다. */
    var tag = function (list, where) {
      return (list || []).map(function (it) { return Object.assign({}, it, { where: where }); });
    };
    var all = []
      .concat(tag((state.kept && state.kept.files) || [], 'kept'))
      .concat(tag((state.linked && state.linked.items) || [], 'linked'))
      .concat(tag((state.oneshot && state.oneshot.items) || [], 'oneshot'));
    if (all.length < 2) return null;

    var r = V.group(all);
    if (!r.conflicts) return null;

    /* ★★ **「기록만 겹친 것」과 「진짜 판이 둘인 것」을 가른다** 〈2026-08-23〉.
     *   1회성으로 올렸다가 다시 보관으로 올린 경우는 **같은 문서 하나**다 —
     *   그것을 「골라야 합니다」로 말하면 고를 것이 없는데 고르라는 말이 된다. */
    var onlyRecord = r.groups.filter(function (g) {
      var kinds = {};
      g.items.forEach(function (it) { kinds[it.where] = true; });
      /* 보관본이 있고 나머지가 1회성 기록뿐이면, 겹친 것이 아니라 기록이 남은 것이다 */
      return kinds.kept && !kinds.linked
        && g.items.filter(function (it) { return it.where === 'kept'; }).length === 1;
    }).length;

    var box = el('div', 'vc');
    box.appendChild(el('div', 'vc__t', '같은 이름의 자료가 ' + r.conflicts + '묶음 있습니다'));
    box.appendChild(el('p', 'vc__d',
      onlyRecord === r.conflicts
        /* ★ **없는 길을 있다고 적지 않는다.** 1회성 기록을 지우는 길은 아직
         *   없다(서버에 DELETE 가 없다) — 「지우실 수 있습니다」라고 적으면
         *   찾다가 못 찾고 고장으로 읽는다 */
        ? '전에 1회성으로 올린 **기록**이 남아 있어 두 번 보이는 것입니다 — '
          .replace(/\*\*/g, '')
          + '자료가 두 벌인 것이 아닙니다. 보고서에 쓰이는 것은 보관 중인 한 벌뿐이고, '
          + '스캔도 그것만 읽습니다. (1회성 기록은 아직 지우는 길이 없습니다 — '
          + '남아 있어도 보고서에는 영향이 없습니다.)'
        : '어느 판으로 보고서를 만들지 사람이 골라야 합니다. 화면이 대신 고르지 않습니다 — '
          + '틀린 판으로 만들면 숫자도 출처도 멀쩡해 보여서 문서만으로는 잡히지 않습니다.'));

    r.groups.forEach(function (g) {
      var sec = el('div', 'vc__g');
      sec.appendChild(el('div', 'vc__n', g.items.length + '개 · ' + (g.stem || '(이름 없음)') + g.ext));
      sec.appendChild(el('div', 'vc__w', g.why));
      var ul = el('ul', 'vc__l');
      /* ★ **어디 있는 것인지**를 함께 적는다 〈2026-08-23〉. 「보관본과 1회성
       *   기록이 같은 문서」인지 「진짜 판이 둘」인지가 여기서 갈린다 —
       *   사람이 할 일이 다르다 */
      var WHERE = {
        kept: '보관 중',
        linked: '연결된 자료',
        oneshot: '올린 기록만 (원본은 남아 있지 않습니다)',
      };
      g.items.forEach(function (it, i) {
        var li = el('li');
        li.appendChild(el('span', 'vc__i', i + 1));
        var b = el('div');
        b.appendChild(el('div', 'vc__f', it.name));
        var meta = el('div', 'vc__b');
        meta.textContent = (WHERE[it.where] || '') + (it.basis ? ' · ' + it.basis : '')
          + ((it.copies || 1) > 1 ? ' · 같은 파일 ' + it.copies + '번' : '')
          + (it.alsoNamed && it.alsoNamed.length
            ? ' · 다른 이름: ' + it.alsoNamed.join(' · ') : '');
        b.appendChild(meta);
        li.appendChild(b);
        ul.appendChild(li);
      });
      sec.appendChild(ul);
      box.appendChild(sec);
    });
    return box;
  }

  /**
   * 1회성 기록. 비어 있으면 그리지 않는다.
   *
   * ★ 「올리기 전에 확인해 주세요」는 **붙이기 칸**에 있다 — 고르는 그 자리에서
   *   말해야 늦지 않는다. 여기에 또 두면 같은 경고가 화면에 두 번 나온다.
   */
  function oneshotBlock() {
    /* ★★★ **「길이 막혔다」와 「기록만 안 보인다」는 다른 말이다** 〈2026-08-23〉.
     *
     *   사장님 화면에 **「1회성 자료 경로가 아직 열려 있지 않습니다 / 로그인이
     *   필요합니다」**가 떴다. **그런데 그 바로 위에서 문서 5건이 실제로 올라가
     *   값 18개가 나왔다.** 길은 열려 있었다.
     *
     *   ★ 막힌 것은 **올리는 길이 아니라 「무엇을 올렸는지 되읽는 길」**이다
     *     (`GET …/oneshot` — 남의 프로젝트에 무엇이 들었는지가 나가는 자리라
     *     일부러 로그인을 묻는다). 그것을 「경로가 안 열렸다」로 적으면
     *     **되는 일을 안 된다고 말하는 것**이다 — 사용자는 쓰기를 그만둔다.
     *   ★ 원인은 내가 401 을 501(아직 안 붙었다) 자리에 그대로 부어 넣은 것이다.
     */
    if (state.locked.oneshot) {
      var lk = document.createDocumentFragment();
      lk.appendChild(el('div', 'grp', wayName('oneshot') + ' — 읽고 바로 버립니다(1회성)'));
      lk.appendChild(el('p', 'note',
        '올린 기록은 로그인해야 보입니다 — **올리는 것은 지금 그대로 됩니다.**'
          .replace(/\*\*/g, '')));
      return lk;
    }
    if (state.closed.oneshot) {
      var w = document.createDocumentFragment();
      w.appendChild(el('div', 'grp', wayName('oneshot') + ' — 읽고 바로 버립니다(1회성)'));
      w.appendChild(waitBox('1회성 자료 경로가 아직 열려 있지 않습니다', state.closed.oneshot));
      return w;
    }
    var items = (state.oneshot && state.oneshot.items) || [];
    if (!items.length) return null;

    var out = document.createDocumentFragment();
    out.appendChild(el('div', 'grp', wayName('oneshot') + ' — 읽고 바로 버립니다(1회성)'));
    /* ★★★ **같은 파일을 다시 올리면 줄이 쌓였다** 〈2026-08-23 사장님:
     *   「중복파일 쌓이는 문제 해결해줘」〉. OCR 이 꺼져 있던 동안 같은 자료를
     *   여러 번 올려 보셨고, 그때마다 장부에 줄이 붙어 **같은 이름이 여덟 줄**이
     *   되었다. 이제 지문이 같으면 서버가 한 줄로 접는다 (`core/oneshot.js`).
     * ★ **접은 것이지 지운 것이 아니다.** 몇 줄을 접었는지 여기서 말한다 —
     *   말 없이 줄이 줄면 「기록이 사라졌다」로 읽힌다 */
    /* ★★★ **화면에서도 접는다** 〈2026-08-23 · 「중복 오류 버그잡아줘」〉.
     *   서버가 접어 주지만, **서버 판이 옛것일 수 있다.** 그때도 화면은
     *   맞아야 한다 — 사장님 화면에 같은 그림이 여덟 줄 떴던 자리다. */
    var VS = window.LinkPilotVersions;
    var raw = items.length;
    if (VS && VS.sameFile) items = VS.sameFile(items);
    var folded = Math.max((state.oneshot && state.oneshot.collapsed) || 0, 0)
      + (raw - items.length);
    if (folded > 0) {
      out.appendChild(el('p', 'note',
        '같은 파일을 다시 올린 기록 ' + folded + '줄을 한 줄로 접었습니다 — '
        + '지문(sha256)이 같으므로 같은 파일입니다. 몇 번 올렸는지는 줄에 적혀 있습니다.'));
    }
    items.forEach(function (it) {
      var b = el('div', 'row__b');
      b.appendChild(el('div', 'row__n', it.name));
      b.appendChild(el('div', 'row__m',
        size(it.bytes) + ' · sha256 ' + String((it.fingerprint && it.fingerprint.value) || '').slice(0, 12)
        + (it.readAt ? ' · ' + String(it.readAt).slice(0, 10) + ' 읽음' : '')
        + ((it.copies || it.times || 1) > 1
          ? ' · ' + (it.copies || it.times) + '번 올림'
            + (it.firstReadAt ? ' (처음 ' + String(it.firstReadAt).slice(0, 10) + ')' : '')
          : '')
        + ' · 파일 없음(지웠습니다)'));
      /* ★ 같은 파일이 다른 이름으로도 들어왔으면 그 이름을 적는다 — 맥이
       *   같은 파일을 두 번 내려받으며 붙인 `(1)`·`(2)` 가 실제로 그랬다 */
      if (it.alsoNamed && it.alsoNamed.length) {
        b.appendChild(el('div', 'row__m', '다른 이름으로도 올라왔습니다: ' + it.alsoNamed.join(' · ')));
      }
      out.appendChild(add(el('div', 'row row--gone'), b));
    });
    return out;
  }

  /**
   * ★★ **고르기 창은 사람이 누른 그 순간에만 열린다** 〈2026-08-21 사용자 지시〉.
   *   브라우저는 사용자 동작에서 이어지지 않은 `input.click()` 을 **조용히
   *   무시한다** — 오류도 안 난다. 그래서 「눌렀다」는 표시를 남기고, 다시
   *   그리기가 **같은 흐름 안에서** 끝나는 이 자리에서 연다.
   *   ★ 표시는 열고 나서 **바로 지운다.** 안 지우면 화면이 갱신될 때마다
   *     창이 또 열려 사용자가 창을 닫을 수가 없다.
   */
  function openPickerIfAsked() {
    if (!state.openPicker) return;
    state.openPicker = false;
    var z = view.querySelector('.drop');
    if (z && z._lpInput) z._lpInput.click();
  }

  /* ★ 그리기에는 빠져나가는 자리가 여럿이다(등급·오류·프로젝트 없음). 창 여는
   *   일을 그 안에 두면 **어느 한 길에서만 열리고 나머지에서는 조용히 안 열린다.**
   *   그래서 그리기는 `paint()` 로 두고, `render()` 가 그 뒤를 책임진다. */
  function paint() {
    view.innerHTML = '';
    /* ★★★ **품어졌으면 제 이름을 말하지 않는다** 〈2026-08-23 사장님 지시 —
     *   「자료 업로드 타이틀 중복 표기」〉.
     *
     *   이 화면은 1단계 안에 창으로 들어간다. 그때 바깥이 이미 「자료 업로드」를
     *   말하고 있는데 여기서 또 그리면 **같은 말이 세 번** 나온다(머리 · 카드 ·
     *   이 제목). 앞 판은 `inTab` 만 봤는데, 그 값은 **앱이 탭으로 얹을 때만**
     *   들어온다 — 창 안에 품어진 경우는 아무도 안 알려 줬다.
     *   ★ 그래서 **부모가 우리 화면인지**로도 가른다 (`flow-core` 의 판단을 쓴다). */
    var embedded = C.inTab || !!(F && F.insideLinkPilot && F.insideLinkPilot());
    if (!embedded) view.appendChild(el('h1', null, '자료 업로드'));

    // 토큰이 안 실리면 화면이 색 없이 뜨는데 오류는 안 난다 — 화면이 스스로 말한다
    if (F && F.tokensLoaded() === false) view.appendChild(el('div', 'nostyle', F.TOKENS_MISSING));

    // ★ 등급·로그인 판정을 **화면이 먼저** 말한다. 판정 자체는 서버가 하지만,
    //   화면이 아무 말도 안 하고 목록만 비어 있으면 「자료가 없다」로 읽힌다
    var G = window.LinkPilotGate;
    /* ★★★ **「안 알려 줬다」와 「로그아웃 상태다」는 다른 말이다** 〈2026-08-23 사장님 지시〉.
     *
     *   이 화면은 1단계 안에 iframe 으로 들어간다. 그때 붙이는 쪽이 `session` 을
     *   안 넘기면 `null` 이 오는데, 앞 판은 그것을 **「로그인 안 했다」로 읽고
     *   화면 전체를 막았다.** 그래서 앱에 로그인해서 쓰고 계신 사장님이
     *   「로그인이 필요합니다 / 자료 업로드은 로그인한 사용자만 쓸 수 있습니다」를
     *   보셨다 — 올릴 칸은 아예 안 나왔다.
     *
     *   ★ 모르면 모른다고 두고 **화면을 연다.** 진짜 판정은 어차피 서버가 한다
     *     (401 이 오면 그때 아래에서 갈라 말한다). 지어낸 판정으로 막는 쪽이
     *     훨씬 비싸다 — 막힌 사람은 자기가 왜 막혔는지 알 길이 없다 (§4.9).
     *   ★ **알려 준 경우는 그대로 잰다.** `session` 이 들어왔는데 로그아웃이거나
     *     플랜이 모자라면 여전히 막는다.
     */
    var told = C.session !== null && C.session !== undefined;
    var a = (G && told) ? G.access(C.session, C.requiredPlan) : { allowed: true };
    if (!a.allowed) {
      var m = G.accessMessage(a, (C.planNames || {})[C.requiredPlan] || C.requiredPlan, '자료 업로드');
      var g = el('section', 'card');
      add(g, el('h2', 'card__t', (m && m.title) || '사용할 수 없습니다'),
        el('p', 'card__d', (m && m.body) || ''));
      view.appendChild(g);
      return;
    }
    if (state.gate) {
      var sg = el('section', 'card');
      add(sg, el('h2', 'card__t', state.gate),
        el('p', 'card__d', '로그인하거나 멤버십을 확인한 뒤 다시 열어 주십시오.'));
      /* ★ 어느 길에서 막혔는지 **화면에 적는다.** 없으면 코드를 뒤져야 한다 */
      if (state.gateWhere) {
        add(sg, el('p', 'note', '막힌 자리: ' + state.gateWhere));
      }
      view.appendChild(sg);
      return;
    }

    if (state.error) view.appendChild(el('div', 'err', state.error));

    // ★ 앱에서 가져오기는 이제 **「자료 붙이기」 안쪽 갈래**다 〈2026-08-21 사용자 지시〉.
    //   따로 카드를 하나 더 그리지 않는다 — 두 곳에 있으면 어느 쪽이 진짜인지 모른다
    view.appendChild(attachCard());

    if (!state.projectId) {
      view.appendChild(el('p', 'card__d', '프로젝트를 고르면 그 프로젝트의 자료가 여기 뜹니다.'));
      return;
    }

    // ★ 스캔은 **붙이기 바로 다음**이다. 넣었으면 읽는 것이 다음 할 일이고,
    //   목록 아래에 두면 자료를 다 훑어본 뒤에야 보인다
    var sc = scanCard();
    if (sc) view.appendChild(sc);

    /* ★ 이관 칸은 **스캔 바로 다음**이다 — ① 모으고 ② 읽고 ③ 넘긴다 의 차례다.
     *   목록 아래에 두면 화면 밖으로 밀려 나가고, 그러면 「말없이 넘어갔다」로
     *   되돌아간다 (이 칸을 만든 이유가 그것이었다) */
    var hc = handoffCard();
    if (hc) view.appendChild(hc);

    // ★ 여러 판 경고는 **목록보다 위**에 둔다. 아래에 두면 목록에서 아무거나
    //   골라 쓴 뒤에 보게 된다 — 그때는 이미 늦다
    // ★ 빈 절은 아예 만들지 않는다. `null` 을 그대로 넣으면 예외가 난다
    [versionBox(), oneshotBlock()].forEach(function (b) {
      if (b) view.appendChild(b);
    });
  }

  function render() {
    paint();
    openPickerIfAsked();
  }

  /**
   * 끌어다 놓기 — **화면 아무 데나** 받는다 〈2026-08-20〉.
   *
   * ★★ 왜: 점선 상자를 조금만 빗나가면 브라우저가 그 파일을 **탭에 열어 버린다.**
   *   화면은 통째로 사라지고 올린 것은 없다. 「끌어다 놓기가 안 된다」의 대부분이
   *   이것이다 — 아무 오류도 안 나므로 사용자는 기능이 없는 줄 안다.
   *   그래서 문서 전체에서 `preventDefault()` 를 걸어 **먼저 브라우저를 막고**,
   *   받을 수 있으면 받고 못 받으면 **왜 못 받는지 말한다.**
   *
   * ★ 갈래를 대신 바꾸지 않는다. 떨어뜨렸다고 1회성으로 넘겨 버리면 그 파일은
   *   읽고 **버려진다** — 되돌릴 수 없는 것을 화면이 정하면 안 된다.
   */
  function hasFiles(ev) {
    var t = ev.dataTransfer && ev.dataTransfer.types;
    if (!t) return false;
    for (var i = 0; i < t.length; i++) if (t[i] === 'Files') return true;
    return false;
  }
  var dragDepth = 0;
  function dragPaint(on) {
    var c = view.querySelector('.card--attach');
    if (c) { if (on) c.classList.add('dragover'); else c.classList.remove('dragover'); }
  }
  document.addEventListener('dragenter', function (ev) {
    if (!hasFiles(ev)) return;
    ev.preventDefault(); dragDepth++; dragPaint(true);
  });
  document.addEventListener('dragover', function (ev) {
    if (!hasFiles(ev)) return;
    ev.preventDefault();
    try { ev.dataTransfer.dropEffect = 'copy'; } catch (_) {}
  });
  document.addEventListener('dragleave', function (ev) {
    if (!hasFiles(ev)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) dragPaint(false);
  });
  document.addEventListener('drop', function (ev) {
    if (!hasFiles(ev)) return;
    ev.preventDefault();          // ★ 이것을 빼면 브라우저가 파일을 열고 화면이 사라진다
    dragDepth = 0; dragPaint(false);
    var f = ev.dataTransfer && ev.dataTransfer.files;
    if (!f || !f.length) return;
    if (!state.projectId) {
      state.dropMsg = '프로젝트를 먼저 고르십시오 — 붙일 곳이 없습니다.';
      return render();
    }
    /* ★ 보관·1회성 **둘 다** 떨어뜨려 올릴 수 있다 〈2026-08-23〉 */
    if (state.way !== 'oneshot' && state.way !== 'keep') {
      state.dropMsg = '떨어뜨린 파일은 「' + wayName('keep') + '」·「' + wayName('oneshot')
        + '」 갈래에서만 올릴 수 있습니다 — 그 갈래를 고른 뒤에 놓아 주십시오.';
      return render();
    }
    state.dropMsg = null;
    addFiles(f);
  });

  render();
  // 한도는 **서버가 정한다.** 화면에 숫자를 박아 두면 서버가 바뀌는 날 화면만 옛말을 한다.
  // ★ `call()` 은 `{ok, body}` 를 준다 — 껍데기째 넣으면 값이 `undefined` 가 되고
  //   화면에는 **「0 B」가 그럴듯하게 찍힌다.** 실제로 그렇게 한 번 나왔다
  if (state.projectId) announce(state.projectId);   // 미리 정해져 열렸을 때도 알린다
  /* ★★ **한도 하나 못 받았다고 화면을 잠그지 않는다** 〈2026-08-23〉.
     이건 「한 번에 몇 MB 까지」를 물어보는 것뿐이다. 401 이 와도 `state.gate` 로
     올리면 **칸 전체가 로그인 안내로 덮인다** — 못 받은 것은 숫자 하나인데. */
  call('GET', '/intake', null, { localGate: true }).then(function (r) {
    if (r && r.ok && r.body) { state.limits = r.body; render(); }
  }, function () {});
  loadProjects().then(function () {
    /* ── 지난번에 고른 것으로 이어서 시작한다 〈2026-08-22 사용자 지시〉 ──
     *
     * ★★ **목록을 받은 뒤에 되살린다.** 먼저 되살리면 **지금은 없는 프로젝트**를
     *   고른 채로 시작할 수 있고, 그러면 「자료가 없습니다」만 뜨는 화면에서
     *   왜 그런지 알 수가 없다. 있는 것 중에 있을 때만 고른다.
     * ★ 앱이 프로젝트를 정해 열었으면(`state.projectId`) **그쪽이 이긴다.**
     *   기억보다 지금 지시가 세다.
     * ★ 갈래는 목록과 무관하니 그냥 되살린다. 단, 아는 이름일 때만 —
     *   옛 판이 남긴 모르는 값이면 기본값으로 둔다.
     */
    var last = recall();
    if (last.way && WAYS.some(function (w) { return w.id === last.way; })) state.way = last.way;
    if (!state.projectId && last.projectId
        && (state.projects || []).some(function (p) { return p.id === last.projectId; })) {
      state.projectId = last.projectId;
      state.restored = true;      // 화면이 「이어서」라고 말할 수 있게
      announce(state.projectId);
    }
    render();
    if (state.projectId) return loadOne(state.projectId).then(render);
    return null;
  });

  /* ★★★ **품어졌으면 제 바탕을 칠하지 않는다** 〈2026-08-23 사장님 지시 —
   *   「쓸데없이 박스라인을 만들면서 발생된 것 같음 … 빼줘 삭제해」〉.
   *
   *   이 화면은 단독으로 열릴 때를 위해 제 바탕색(`--bg`)과 바깥 여백을 갖는다.
   *   그런데 1단계 안에 창으로 들어가면 그 바탕이 **카드 안의 회색 띠**로
   *   보인다 — 아무 뜻도 없는 상자가 하나 더 생기는 것이다.
   *   ★ 바깥이 고쳐 주기를 기다리지 않는다. **이 화면이 스스로 안다** —
   *     부모가 우리 화면이면 바탕을 비우고 여백을 0 으로 둔다. */
  if (F && F.insideLinkPilot && F.insideLinkPilot()) {
    try {
      document.documentElement.style.background = 'transparent';
      document.body.style.background = 'transparent';
      /* `.wrap` 의 바깥 여백도 뺀다 — 품은 카드가 이미 여백을 갖고 있어서
         두 벌이 되면 화면이 안쪽으로 한 번 더 밀린다 */
      var wrap = document.querySelector('.wrap');
      if (wrap) { wrap.style.background = 'transparent'; wrap.style.padding = '0'; wrap.style.maxWidth = 'none'; }
    } catch (_) {}
  }

  /* ★ **판 지문을 화면에 보이게 남긴다** (CLAUDE.md §8) — 조건 없이.
     서버가 닫혀 있을 때야말로 판을 알고 싶은 때다 */
  if (F && F.stampInto) { try { F.stampInto(document); } catch (_) {} }
})();
</script>
</body>
</html>
