<title>가이드 필드 입력 · LINKPILOT</title>
<!--
  가이드 필드 입력값 — 보고서 생성 1단계.

  ★ 이 화면의 전제 하나: **출처 없는 값은 저장되지 않는다.**
    facts.js 가 source 없는 Fact 생성을 예외로 막는다. 화면에서 먼저 막지 않으면
    저장 버튼을 누른 뒤에야 알게 되고, 그때는 무엇이 빠졌는지 찾아야 한다.
    그래서 출처 칸이 비면 그 줄이 빨갛게 서고 저장 버튼이 열리지 않는다.

  ★ 필드 목록을 이 파일에 적어 두지 않는다. core/dictionary.js 가 단일 출처이고
    GET /fields 로 받아 그린다. 복사해 두면 사전이 바뀐 날부터 조용히 갈린다.

  ★ 계산 항목(IRR·NPV·DSCR·감정평가액)은 입력란을 아예 만들지 않는다.
    사람이 IRR 을 적어 넣는 순간 "숫자는 만들지 않고 계산한다"가 무너진다.

  ★ 범위를 벗어난 값은 막지 않고 경고만 한다. 여기서 막으면 05 Validation 이
    RED FLAG 로 잡아야 할 이상값이 화면에서 사라진다.
-->
<link rel="stylesheet" href="tokens.css">
<style>
:root {
  --side: 248px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.55 var(--lp-font);
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
.app { display: flex; min-height: 100%; }

.side { width: var(--side); flex: none; background: var(--surface);
  border-right: 1px solid var(--line); padding: 18px 12px 24px;
  display: flex; flex-direction: column; gap: 4px; }
.side__brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 12px; }
.side__mark { width: 34px; height: 34px; border-radius: 50%; flex: none;
  border: 2.5px solid var(--ink); display: grid; place-items: center;
  color: var(--lime); font-size: 15px; }
.side__name { font-size: 15px; font-weight: 800; }
.side__user { font-size: 12px; color: var(--ink2); }
.side__group { margin: 14px 8px 6px; font-size: 12px; font-weight: 700; color: var(--ink2); }
.nav { display: flex; align-items: center; gap: 11px; padding: 10px 12px;
  border-radius: 12px; text-decoration: none; color: var(--ink); font-size: 14.5px; }
.nav:hover { background: var(--panel); }
.nav.on { background: var(--lime-soft); color: var(--lime-deep); font-weight: 700; }
.nav__ic { width: 20px; text-align: center; font-size: 15px; opacity: .8; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 16px 26px; display: flex; align-items: center; }
.logo { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 900; }
.logo em { font-style: normal; color: var(--lime); }
.logo__mark { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--ink);
  display: grid; place-items: center; color: var(--lime); font-size: 16px; }
.head { background: var(--surface); padding: 16px 26px 14px; }
.head__row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.head__ic { width: 40px; height: 40px; border-radius: 12px; background: var(--panel);
  display: grid; place-items: center; font-size: 18px; }
.head__t { font-size: 22px; font-weight: 800; }
.head__meta { margin-left: auto; text-align: right; font-size: 13px; color: var(--ink2); }
.head__meta b { display: block; color: var(--ink); font-weight: 700; margin-top: 2px; }
.rule { height: 3px; background: var(--lime); }
.body { padding: 20px 26px 130px; max-width: 1080px; }

.gate { max-width: 560px; margin: 60px auto; background: var(--surface);
  border-radius: var(--r); padding: 40px 32px; text-align: center; }
.gate__ic { font-size: 40px; line-height: 1; }
.gate__t { font-size: 21px; font-weight: 800; margin-top: 18px; }
.gate__b { font-size: 14.5px; color: var(--ink2); margin-top: 12px; line-height: 1.7; }
.gate__cta { display: inline-block; margin-top: 24px; padding: 14px 32px;
  font-weight: 700; font-size: 15px; line-height: 1; font-family: inherit; border: 0; border-radius: 12px;
  background: var(--lime); color: var(--ink); cursor: pointer; }
.gate__fine { font-size: 12.5px; color: var(--ink2); margin-top: 16px; }

.steps { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; padding: 9px 14px;
  border-radius: 999px; background: var(--panel); color: var(--ink2); font-size: 13px; font-weight: 600; }
.step.on { background: var(--ink); color: #fff; }
.step__n { width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(0,0,0,.09); font-size: 11px; font-weight: 800; }
.step.on .step__n { background: rgba(255,255,255,.22); }

.card { background: var(--surface); border-radius: var(--r); padding: 22px; margin-bottom: 16px; }
.card__t { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
.card__s { font-size: 13px; color: var(--ink2); margin: 0 0 16px; }

.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.f { display: flex; flex-direction: column; gap: 6px; }
.f label { font-size: 12.5px; font-weight: 700; color: var(--ink2); }
.f select, .f input { font-weight: 400; font-size: 14px; line-height: 1.5; font-family: inherit; padding: 11px 13px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
.f select:disabled, .f input:disabled { background: var(--panel); color: var(--ink2); }

/* 진행률 */
.prog { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.prog__bar { flex: 1; min-width: 180px; height: 10px; border-radius: 999px;
  background: var(--panel); overflow: hidden; }
.prog__fill { height: 100%; background: var(--lime); transition: width .25s; }
.prog__n { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.prog__d { font-size: 12.5px; color: var(--ink2); }

/* 도구 막대 */
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.tools input[type=search] { flex: 1; min-width: 170px; font-weight: 400; font-size: 14px; line-height: 1.5; font-family: inherit;
  padding: 10px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink2); font-weight: 600; font-size: 13px; line-height: 1; font-family: inherit; cursor: pointer; }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip:focus-visible, .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* 필드 옵션 */
.optrow { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.seg { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg__b { flex: 1; padding: 11px 12px; border: 0; background: var(--surface);
  font-weight: 600; font-size: 14px; line-height: 1; font-family: inherit; color: var(--ink2); cursor: pointer; }
.seg__b + .seg__b { border-left: 1px solid var(--line); }
.seg__b.on { background: var(--ink); color: #fff; }
.seg__b:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }

/* 자동 채움 */
.auto__h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; width: 100%;
  background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font: inherit; }
.auto__t { font-size: 15px; font-weight: 800; color: var(--lime-deep); }
.auto__s { font-size: 13px; color: var(--ink2); }
.auto__x { margin-left: auto; font-size: 12.5px; font-weight: 700; color: var(--ink2); }
.auto__h:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.auto__g { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.auto__gl { font-size: 13px; font-weight: 800; }
.auto__gw { font-size: 12.5px; color: var(--ink2); margin: 3px 0 7px; }
.row__auto { font-size: 11px; font-weight: 700; color: var(--lime-deep);
  background: var(--lime-soft); padding: 2px 8px; border-radius: 999px; }

/* 필드 행 */
.cat { font-size: 13px; font-weight: 800; color: var(--lime-deep); background: var(--lime-soft);
  padding: 8px 13px; border-radius: 9px; margin: 18px 0 10px; }
.row { border-top: 1px solid var(--line); padding: 13px 0; }
.row:first-of-type { border-top: 0; }
.row.err { background: var(--bad-soft); border-radius: 10px; padding-left: 12px; padding-right: 12px; }
.row.warn { background: var(--warn-soft); border-radius: 10px; padding-left: 12px; padding-right: 12px; }
.row__h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.row__l { font-size: 14px; font-weight: 700; }
.row__k { font-size: 11.5px; color: var(--ink2); font-family: ui-monospace, Menlo, Consolas, monospace; }
.row__u { font-size: 11.5px; font-weight: 800; color: var(--lime-deep);
  background: var(--lime-soft); padding: 2px 8px; border-radius: 999px; }
.row__req { font-size: 11px; font-weight: 800; color: var(--bad-ink);
  background: var(--bad-soft); padding: 2px 8px; border-radius: 999px; }
/* 칸 수는 항목마다 다르다 — 페이지·출처일은 필요한 항목에만 붙는다.
   고정 4열로 두면 2칸짜리 줄에 빈 열이 남아 뭔가 빠진 것처럼 보인다 */
.row__in { display: grid; gap: 8px; grid-template-columns: 1.1fr 1.4fr .6fr .9fr; }
.row__in.n1 { grid-template-columns: minmax(0, 300px); }
.row__in.n2 { grid-template-columns: 1.1fr 1.7fr; }
.row__in.n3 { grid-template-columns: 1.1fr 1.5fr .8fr; }
.row__in input, .row__in select { font-weight: 400; font-size: 13.5px; line-height: 1.5; font-family: inherit; padding: 9px 11px; min-width: 0;
  border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); }
.row__in input::placeholder { color: #B6BBC1; }
.row__in .miss { border-color: var(--bad); }
.row__msg { font-size: 12.5px; margin-top: 7px; }
.row__msg.e { color: var(--bad-ink); font-weight: 600; }
.row__msg.w { color: var(--warn-ink); }
.row__conv { font-weight: 600; font-size: 12px; line-height: 1; font-family: inherit; margin-top: 7px; padding: 7px 11px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink2); cursor: pointer; }

.computed { display: flex; flex-wrap: wrap; gap: 7px; }
.computed span { font-size: 12.5px; padding: 6px 11px; border-radius: 8px;
  background: var(--panel); color: var(--ink2); }

/* 계산 항목 목록 — 한글·영문을 나란히 둔다.
   영문만 두면 실무자가 못 찾고, 한글만 두면 IM 본문(영문 표기)과 이어지지 않는다 */
.cmp { display: grid; gap: 6px; margin-top: 12px; }
.cmp__r { display: grid; gap: 4px 12px; align-items: baseline;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto;
  padding: 8px 11px; border-radius: 9px; background: var(--panel); }
.cmp__ko { font-size: 13px; font-weight: 600; color: var(--ink); }
.cmp__en { font-size: 12.5px; color: var(--ink2); }
.cmp__u  { font-size: 12px; color: var(--ink2); text-align: right; white-space: nowrap; }
@media (max-width: 640px) {
  .cmp__r { grid-template-columns: minmax(0, 1fr) auto; }
  .cmp__en { grid-column: 1 / -1; }
}

.note { padding: 13px 16px; border-radius: 12px; font-size: 13.5px;
  background: var(--warn-soft); color: var(--warn-ink); margin-top: 14px; }
.note--bad { background: var(--bad-soft); color: var(--bad-ink); }
.note--ok { background: var(--lime-soft); color: var(--lime-deep); }
.empty { font-size: 13.5px; color: var(--ink2); padding: 10px 0; }

/* 저장 막대 */
.save { position: fixed; left: var(--side); right: 0; bottom: 0; z-index: 40;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 13px 26px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.btn { padding: 13px 26px; font-weight: 700; font-size: 14.5px; line-height: 1; font-family: inherit; border: 0; border-radius: 12px;
  background: var(--lime); color: var(--ink); cursor: pointer; }
.btn:disabled { background: var(--panel); color: var(--ink2); cursor: not-allowed; }
.btn--ghost { background: var(--surface); border: 1px solid var(--line); color: var(--ink2); }
.save__why { font-size: 13px; color: var(--bad-ink); font-weight: 600; }
.save__ok { font-size: 13px; color: var(--ink2); }

@media (max-width: 900px) {
  .side { display: none; }
  .save { left: 0; }
  .top, .head { padding-left: 16px; padding-right: 16px; }
  .body { padding: 16px 16px 150px; }
  .head__t { font-size: 19px; }
  .row__in, .row__in.n2, .row__in.n3 { grid-template-columns: 1fr 1fr; }
  .row__in.n1 { grid-template-columns: 1fr; }
  .btn { flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>

<script>
/**
 * 설정 — 서버가 세션을 보고 이 블록을 만들어 내려주는 것이 정석이다.
 * 화면에 박아 두면 사람이 바뀔 때마다 파일을 고쳐야 하고,
 * 브라우저에서 값을 바꿔 유료 기능을 흉내낼 수도 있다.
 */
window.LINKPILOT_FIELDS_CFG = {
  api: null,                       // 예: '/api/linkpilot'
  projectId: null,                 // 예: 'LP-DC-2026-001'
  docType: 'im',                   // im | teaser | summary | validation
  session: { authenticated: true, planId: 'pro', status: 'active', name: '' },
};
</script>
<!-- 부모(앱)가 채운 설정을 받아 병합한다. 단독으로 열면 아무 일도 하지 않는다 -->
<script src="embed-bridge.js" data-lp-global="LINKPILOT_FIELDS_CFG"></script>
<script>
(function () {
  'use strict';

  var C = window.LINKPILOT_FIELDS_CFG;
  var Gate = window.LinkPilotGate;
  var F = window.LinkPilotFields;
  if (!Gate) throw new Error('gate-core.js 가 필요하다');
  if (!F) throw new Error('fields-core.js 가 필요하다');

  var body = document.getElementById('body');
  var meta = document.getElementById('meta');

  var state = {
    fields: null, computedKeys: [], computedFields: {}, sources: [],
    assetClasses: [], assetClass: null,   // 자산군 — 필수 항목의 분모가 달라진다
    industries: [],      // 서버가 준 산업분야 정의
    plan: null,          // 채움 계획 (어떤 항목이 자동으로 채워지는가)
    publicData: null,    // 공공데이터 키가 서버에 있는가 (null = 모름)
    industryId: '',      // 빈 값 = 전체 (거르지 않는다)
    level: 'manual',     // manual | basic | expert — 기본은 '직접 입력'
    showAuto: false,     // 자동으로 채워지는 항목 펼치기
    showComputed: false, // 자동 계산으로 만들어지는 항목 펼치기
    values: {},          // key → {value, source, sourceDate, page}
    server: {},          // 서버에 저장돼 있는 값 (되돌리기용)
    filter: 'required',  // required | all | empty
    q: '',
    loadError: null, saving: false, result: null,
  };

  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (x !== undefined && x !== null) n.textContent = String(x);
    return n;
  }

  /* ── 서버 ─────────────────────────────────────────────── */

  /**
   * 다음 단계 주소. **지금 화면이 받은 `api` 를 그대로 물려준다.**
   * 안 물려주면 다음 화면이 서버를 모르는 채로 열리고, `reports.html` 은
   * api 가 없으면 데모 데이터를 쓰므로 가짜 산출물이 진짜처럼 보인다.
   */
  /**
   * 이 프로젝트의 자산군이 더 요구하는 키. **못 찾으면 null 이다** —
   * 아무 자산군이나 기본값으로 고르면 엉뚱한 값을 필수라고 말하게 된다.
   */
  function classKeys() {
    if (!state.assetClass) return null;
    for (var i = 0; i < state.assetClasses.length; i++) {
      if (state.assetClasses[i].id === state.assetClass) {
        return state.assetClasses[i].requires.map(function (r) { return r.key; });
      }
    }
    return null;
  }

  function stepUrl(file) {
    var here = new URLSearchParams(window.location.search);
    var qs = [];
    var api = here.get('api') || (typeof C.api === 'string' ? C.api : null);
    if (api) qs.push('api=' + encodeURIComponent(api));
    if (C.projectId) qs.push('project=' + encodeURIComponent(C.projectId));
    return file + (qs.length ? '?' + qs.join('&') : '');
  }

  function call(method, path, payload) {
    if (!C.api) return Promise.reject(new Error('API 주소가 설정되지 않았습니다'));
    var opt = { method: method, headers: {}, credentials: 'same-origin' };
    if (payload) { opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(payload); }
    return fetch(C.api + path, opt).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  function load() {
    // 미리보기: 서버 없이 화면을 보기 위해 필드 정의를 미리 심어 둔 경우.
    // ★ 값을 지어내지 않는다 — 사전(core/dictionary.js)에서 그대로 가져온 것이다
    if (C.preload) {
      state.fields = C.preload.fields || {};
      state.computedKeys = C.preload.computedKeys || [];
      state.computedFields = C.preload.computedFields || {};
      state.assetClasses = C.preload.assetClasses || [];
      state.industries = C.preload.industries || [];
      state.plan = C.preload.plan || null;
      state.publicData = C.preload.publicData === undefined ? null : C.preload.publicData;
      state.loadError = null;
      return render();
    }
    if (!C.api) { state.loadError = 'API 주소가 설정되지 않았습니다'; return render(); }
    // 필드 정의는 프로젝트와 무관하다. 값은 프로젝트별이다
    var jobs = [call('GET', '/fields')];
    if (C.projectId) jobs.push(call('GET', '/projects/' + C.projectId + '/facts'));

    Promise.all(jobs).then(function (res) {
      state.fields = res[0].fields || {};
      state.computedKeys = res[0].computedKeys || [];
      state.computedFields = res[0].computedFields || {};
      state.assetClasses = res[0].assetClasses || [];
      state.industries = res[0].industries || [];
      state.plan = res[0].plan || null;
      state.publicData = res[0].publicData === undefined ? null : res[0].publicData;
      if (res[1]) {
        state.server = res[1].values || {};
        state.sources = res[1].sources || [];
        state.assetClass = res[1].assetClass || null;
        // 서버 값을 편집 상태로 복사한다 (원본은 되돌리기용으로 둔다)
        Object.keys(state.server).forEach(function (k) {
          var v = state.server[k];
          state.values[k] = {
            value: v.value, source: v.source,
            sourceDate: v.sourceDate || '', page: v.page === null ? '' : v.page,
          };
        });
      }
      state.loadError = null;
      render();
    }).catch(function (e) {
      // ★ 못 가져온 것과 없는 것을 구분한다. 빈 화면을 그리지 않는다
      state.loadError = e.message;
      render();
    });
  }

  function save() {
    var v = F.validateAll(state.fields, state.values, state.computedKeys);
    if (!v.canSave || state.saving) return;
    state.saving = true; state.result = null; render();

    call('PUT', '/projects/' + C.projectId + '/facts', { facts: F.changedEntries(state.values) })
      .then(function (r) {
        state.saving = false;
        state.result = { ok: true, saved: r.saved, rejected: r.rejected || [], warnings: r.warnings || [], at: r.at };
        render();
      })
      .catch(function (e) {
        state.saving = false;
        state.result = { ok: false, message: e.message };
        render();
      });
  }

  /* ── 그리기 ───────────────────────────────────────────── */

  function entry(key) {
    if (!state.values[key]) state.values[key] = { value: '', source: '', sourceDate: '', page: '' };
    return state.values[key];
  }

  function set(key, prop, val) {
    entry(key)[prop] = val;
    renderFooter();          // 진행률·저장 버튼만 다시 그린다 (입력 중 포커스를 잃지 않게)
  }

  /** 지금 고른 산업분야 정의 (빈 값이면 null — 산업으로 거르지 않는다) */
  function currentIndustry() {
    if (!state.industryId) return null;
    for (var i = 0; i < state.industries.length; i++) {
      if (state.industries[i].id === state.industryId) return state.industries[i];
    }
    return null;
  }

  /**
   * 채움 계획 — 산업과 무관하다 (네 템플릿이 같은 기본값 집합을 쓴다).
   * 그래서 산업을 고르기 전에도 입력란을 줄일 수 있다.
   */
  function currentPlan() { return state.plan; }

  /**
   * 다시 그린 뒤 값 칸으로 커서를 되돌린다.
   * 자동 행은 첫 글자를 치는 순간 출처 칸이 생기며 줄이 다시 그려진다 —
   * 그때 포커스를 안 돌려주면 **두 번째 글자가 어디에도 안 들어간다.**
   */
  function focusValue(key) {
    var el2 = document.querySelector('#list input[data-k="' + key + '"]');
    if (!el2) return;
    el2.focus();
    try { el2.setSelectionRange(el2.value.length, el2.value.length); } catch (_) {}
  }

  // 판정은 fields-core 가 한다 (테스트가 이 규칙을 지킨다)
  function visibleItems(group) {
    var opts = {
      filter: state.filter, q: state.q, docType: C.docType,
      level: state.level, industry: currentIndustry(), plan: currentPlan(),
    };
    return group.items.filter(function (it) {
      return F.isVisible(it.key, state.fields, state.values, state.computedKeys, opts);
    });
  }

  function fieldRow(key, def, required) {
    var e = entry(key);
    var v = F.validateEntry(key, def, e, state.computedKeys);
    var row = el('div', 'row' + (v.errors.length ? ' err' : (v.warnings.length ? ' warn' : '')));

    var h = el('div', 'row__h');
    h.appendChild(el('span', 'row__l', def.label));
    if (def.unit) h.appendChild(el('span', 'row__u', def.unit));
    if (required.indexOf(key) !== -1) h.appendChild(el('span', 'row__req', '필수'));
    var pl = currentPlan();
    if (pl && pl[key] && F.isAuto(key, pl)) {
      var badge = el('span', 'row__auto', '자동 · ' + pl[key].label);
      badge.title = pl[key].why;
      h.appendChild(badge);
    }
    h.appendChild(el('span', 'row__k', key));
    row.appendChild(h);

    var box = el('div', 'row__in');

    // ★ 자동으로 채워지는 줄에는 **출처를 묻지 않는다.**
    //   그 값의 출처는 이미 정해져 있다 (요청문 · 공공데이터 · 산업 통상치 · 계산).
    //   시스템이 채울 값의 근거를 사람에게 물으면, 사람은 자기가 모르는 것을
    //   적어 넣는다 — 출처 강제가 오히려 거짓 출처를 만든다.
    //
    //   단 **사람이 값을 치는 순간** 이야기가 달라진다. 그건 자동값을 덮어쓰는
    //   것이므로 근거가 있어야 한다. 그때 출처 칸이 나타나고 저장이 잠긴다.
    var isAuto = F.isAuto(key, pl);
    var typed = e.value !== '' && e.value !== null && e.value !== undefined;
    var askSource = F.asksSource(key, e, pl);

    var val = el('input');
    val.type = 'text';
    val.value = e.value === null || e.value === undefined ? '' : String(e.value);
    val.placeholder = isAuto && !typed
      ? '자동 — ' + pl[key].label
      : (def.type === 'number' ? '숫자만' : '값');
    val.setAttribute('aria-label', def.label + ' 값');
    val.setAttribute('data-k', key);
    // 값이 처음 들어오는 순간 출처 칸이 생겨야 하므로 다시 그린다
    val.addEventListener('input', function () {
      var had = typed;
      set(key, 'value', val.value);
      var now = val.value !== '';
      if (isAuto && had !== now) { render(); focusValue(key); }
    });
    box.appendChild(val);

    // 출처 — 업로드된 자료 중에서 고르게 한다. 자유 입력만 두면 추적이 끊긴다
    var src;
    if (askSource) {
    if (state.sources.length) {
      src = el('select');
      src.setAttribute('aria-label', def.label + ' 출처');
      var opt0 = el('option', null, '출처 선택 —');
      opt0.value = '';
      src.appendChild(opt0);
      state.sources.forEach(function (s) {
        var o = el('option', null, s); o.value = s; src.appendChild(o);
      });
      var other = el('option', null, '직접 입력…'); other.value = '__other__';
      src.appendChild(other);
      if (e.source && state.sources.indexOf(e.source) === -1) {
        var cur = el('option', null, e.source); cur.value = e.source;
        src.insertBefore(cur, other);
      }
      src.value = e.source || '';
      src.addEventListener('change', function () {
        if (src.value === '__other__') {
          var typed = window.prompt('출처를 입력하세요 (자료명 또는 API명)', e.source || '');
          set(key, 'source', typed ? typed.trim() : '');
          render();
          return;
        }
        set(key, 'source', src.value);
        render();
      });
    } else {
      src = el('input');
      src.type = 'text';
      src.value = e.source || '';
      src.placeholder = '출처 (필수)';
      src.setAttribute('aria-label', def.label + ' 출처');
      src.addEventListener('input', function () { set(key, 'source', src.value); });
    }
    if (e.value !== '' && !e.source) src.className = 'miss';
    box.appendChild(src);
    }

    // ★ 페이지는 **출처가 올린 문서일 때만** 뜻이 있다. 공공데이터나 직접 입력에
    //   페이지를 물으면 사람은 빈칸으로 두거나 아무 숫자나 적는다.
    //   이미 값이 있으면 조건과 무관하게 보여준다 — 감추면 고칠 방법이 없다
    var hasPage = e.page !== '' && e.page !== null && e.page !== undefined;
    if (hasPage || (askSource && e.source && state.sources.indexOf(e.source) !== -1)) {
      var page = el('input');
      page.type = 'text';
      page.value = hasPage ? String(e.page) : '';
      page.placeholder = 'p.';
      page.setAttribute('aria-label', def.label + ' 페이지');
      page.addEventListener('input', function () { set(key, 'page', page.value); });
      box.appendChild(page);
    }

    // ★ 출처일은 **값이 시점에 따라 달라지는 항목**에만 묻는다 (사전의 def.dated).
    //   시행사명은 언제 조회했든 같다 — 거기에 날짜를 물으면 사람은 오늘 날짜를
    //   적고, 그 날짜는 아무것도 뜻하지 않는다
    if ((askSource && def.dated) || e.sourceDate) {
      var date = el('input');
      date.type = 'text';
      date.value = e.sourceDate || '';
      date.placeholder = '출처일 YYYY-MM-DD';
      date.setAttribute('aria-label', def.label + ' 출처일');
      date.addEventListener('input', function () { set(key, 'sourceDate', date.value); });
      box.appendChild(date);
    }

    // 붙은 칸 수를 CSS 에 알려 준다 (빈 열이 남지 않게)
    box.className = 'row__in n' + box.childNodes.length;
    row.appendChild(box);

    // 억원 필드는 단위 실수가 재무모델을 통째로 틀리게 만든다. 환산을 도와주되
    // 자동으로 바꾸지는 않는다 — 바뀐 값을 사람이 보고 누른다
    if (def.unit === '억원') {
      var conv = el('button', 'row__conv', '단위 환산 (원 · 만원 · 백만원 → 억원)');
      conv.type = 'button';
      conv.addEventListener('click', function () {
        var raw = window.prompt(def.label + ' — 환산할 금액을 입력하세요', '');
        if (!raw) return;
        var unit = window.prompt('입력한 단위는? (원 / 만원 / 백만원 / 천만원)', '원');
        var got = F.toEokwon(raw, unit && unit.trim());
        if (got === null) { window.alert('환산할 수 없습니다 — 숫자와 단위를 확인하세요'); return; }
        if (window.confirm(raw + ' ' + unit + ' = ' + got + ' 억원 — 이 값으로 넣을까요?')) {
          set(key, 'value', got);
          render();
        }
      });
      row.appendChild(conv);
    }

    v.errors.forEach(function (m) { row.appendChild(el('div', 'row__msg e', '⛔ ' + m)); });
    v.warnings.forEach(function (m) { row.appendChild(el('div', 'row__msg w', '⚠ ' + m)); });

    // 서버에 이미 있던 값이면 출처를 함께 보여준다 (누가 넣은 값인지 알아야 고친다)
    var s = state.server[key];
    if (s) {
      var cite = s.source + (s.page ? ' p.' + s.page : '') + (s.verified ? ' · 검증됨' : '');
      row.appendChild(el('div', 'row__msg', '저장됨: ' + cite));

      // ★ 다른 출처가 다른 값을 말하고 있으면 여기서 보여준다.
      //   이긴 값만 보여주면 화면에서는 멀쩡해 보이고 검증 단계에 가서야 드러난다
      if (s.alternatives && s.alternatives.length) {
        var alt = s.alternatives.map(function (a) {
          return a.value + ' (' + (a.sources || []).join(', ') + ')';
        }).join(' · ');
        row.appendChild(el('div', 'row__msg e', '⛔ 출처마다 값이 다릅니다 — ' + alt));
      }
    }
    return row;
  }

  /** 지금 설정에서 기본 노출되는 항목 수 */
  function scopeCount() {
    var o = { level: state.level, industry: currentIndustry(), plan: currentPlan(), docType: C.docType };
    var n = 0;
    Object.keys(state.fields || {}).forEach(function (k) {
      if (F.inScope(k, state.fields, o)) n++;
    });
    return n;
  }

  function renderFooter() {
    var old = document.querySelector('.save');
    if (old) old.remove();
    document.body.appendChild(footer());
    var bar = document.getElementById('prog-fill');
    var num = document.getElementById('prog-n');
    if (bar && num && state.fields) {
      var c = F.completeness(state.fields, state.values, C.docType);
      bar.style.width = c.percent + '%';
      num.textContent = c.percent + '%';
      var d = document.getElementById('prog-d');
      if (d) d.textContent = '필수 ' + c.total + '개 중 ' + c.filled + '개 입력 (값과 출처가 모두 있어야 셉니다)';
    }
  }

  function footer() {
    var f = el('div', 'save');
    if (!state.fields) { f.appendChild(el('span', 'save__ok', '필드 정의를 불러오는 중입니다')); return f; }

    var v = F.validateAll(state.fields, state.values, state.computedKeys);
    var btn = el('button', 'btn', state.saving ? '저장 중…' : '저장');
    btn.type = 'button';
    btn.disabled = !v.canSave || state.saving || !C.projectId || !C.api;
    btn.addEventListener('click', save);
    f.appendChild(btn);

    var reset = el('button', 'btn btn--ghost', '되돌리기');
    reset.type = 'button';
    reset.addEventListener('click', function () {
      state.values = {};
      Object.keys(state.server).forEach(function (k) {
        var s = state.server[k];
        state.values[k] = { value: s.value, source: s.source, sourceDate: s.sourceDate || '', page: s.page === null ? '' : s.page };
      });
      state.result = null;
      render();
    });
    f.appendChild(reset);

    if (!C.projectId) f.appendChild(el('span', 'save__why', '프로젝트를 지정해야 저장할 수 있습니다'));
    else if (!C.api) f.appendChild(el('span', 'save__why', 'API 주소가 없어 저장할 수 없습니다'));
    else if (v.errors.length) f.appendChild(el('span', 'save__why', '입력을 고쳐야 저장됩니다 — ' + v.errors.length + '건'));
    else if (v.warnings.length) f.appendChild(el('span', 'save__ok', '경고 ' + v.warnings.length + '건 — 저장은 됩니다'));
    return f;
  }

  function render() {
    body.textContent = '';
    meta.textContent = '';

    // 접근 판정 — 실제 차단은 서버가 한다
    var acc = Gate.access(C.session, 'pro');
    if (!acc.allowed) {
      var g = el('div', 'gate');
      g.appendChild(el('div', 'gate__ic', Gate.gateIcon(acc.reason)));
      g.appendChild(el('div', 'gate__t', '가이드 필드 입력'));
      g.appendChild(el('div', 'gate__b', Gate.accessMessage(acc)));
      var cta = el('button', 'gate__cta', acc.reason === 'unauthenticated' ? '로그인' : '플랜 보기');
      g.appendChild(cta);
      g.appendChild(el('div', 'gate__fine', '보고서에 들어갈 수치를 출처와 함께 관리하는 화면입니다.'));
      body.appendChild(g);
      var old = document.querySelector('.save'); if (old) old.remove();
      return;
    }

    // reports.html 과 같은 4단계를 쓴다. 화면마다 단계가 다르면 어디쯤인지 알 수 없다
    var steps = el('div', 'steps');
    ['대상·종류 선택', '가이드 필드 (자동입력 + 직접입력)', '출력조건', '생성'].forEach(function (label, i) {
      var d = el(i === 0 ? 'a' : 'div', 'step' + (i === 1 ? ' on' : (i === 0 ? ' done' : '')));
      if (i === 0) {
        d.href = 'reports.html';
        d.style.textDecoration = 'none';
      }
      d.appendChild(el('span', 'step__n', String(i + 1)));
      d.appendChild(el('span', null, label));
      steps.appendChild(d);
    });
    body.appendChild(steps);

    if (state.loadError) {
      var e1 = el('div', 'card');
      e1.appendChild(el('div', 'card__t', '필드 정의를 불러오지 못했습니다'));
      var n = el('div', 'note note--bad', state.loadError);
      e1.appendChild(n);
      e1.appendChild(el('p', 'card__s',
        '항목 목록은 서버의 데이터 사전에서 받아옵니다. 화면에 복사본을 두지 않기 때문에, '
        + '불러오지 못하면 입력란을 그리지 않습니다 — 옛 항목으로 입력받아 저장하면 더 큰 문제가 됩니다.'));
      body.appendChild(e1);
      renderFooter();
      return;
    }
    if (!state.fields) {
      body.appendChild(el('div', 'card')).appendChild(el('div', 'empty', '불러오는 중입니다…'));
      renderFooter();
      return;
    }

    meta.textContent = '프로젝트';
    var b = el('b', null, C.projectId || '미지정');
    meta.appendChild(b);

    var required = F.requiredKeys(state.fields, C.docType);

    // 진행률
    var pc = el('div', 'card');
    pc.appendChild(el('div', 'card__t', '입력 진행률'));
    var p = el('div', 'prog');
    var pn = el('div', 'prog__n', '0%'); pn.id = 'prog-n';
    var pb = el('div', 'prog__bar');
    var pf = el('div', 'prog__fill'); pf.id = 'prog-fill'; pf.style.width = '0%';
    pb.appendChild(pf);
    p.appendChild(pn); p.appendChild(pb);
    pc.appendChild(p);
    var pd = el('div', 'prog__d'); pd.id = 'prog-d';
    pc.appendChild(pd);
    body.appendChild(pc);

    // 필드 옵션 — 무엇을 보여줄지 정한다
    var opt = el('div', 'card');
    opt.appendChild(el('div', 'card__t', '필드 옵션'));
    opt.appendChild(el('p', 'card__s',
      '산업분야와 판을 고르면 입력란이 그에 맞게 줄어듭니다. '
      + '값이 들어 있거나 문제가 있는 항목은 어떤 설정에서도 계속 보입니다.'));

    var og = el('div', 'optrow');

    var f1 = el('div', 'f');
    f1.appendChild(el('label', null, '산업분야'));
    var isel = el('select');
    isel.setAttribute('aria-label', '산업분야');
    var all = el('option', null, '전체 (거르지 않음)');
    all.value = '';
    isel.appendChild(all);
    state.industries.forEach(function (x) {
      var o = el('option', null, x.label + ' (' + x.own.length + '개)');
      o.value = x.id;
      isel.appendChild(o);
    });
    isel.value = state.industryId;
    isel.addEventListener('change', function () { state.industryId = isel.value; render(); });
    f1.appendChild(isel);
    var ind = currentIndustry();
    f1.appendChild(el('div', 'prog__d', ind && ind.foreign.length
      ? '다른 산업 전용 ' + ind.foreign.length + '개를 감춥니다 ('
        + ind.foreign.map(function (k) { return (state.fields[k] || {}).label || k; }).join(' · ') + ')'
      : '산업을 고르면 그 산업에 없는 항목을 감춥니다'));
    og.appendChild(f1);

    var f2 = el('div', 'f');
    f2.appendChild(el('label', null, '판'));
    var lv = el('div', 'seg');
    ['manual', 'basic', 'expert'].forEach(function (id) {
      var L = F.LEVELS[id];
      var b = el('button', 'seg__b' + (state.level === id ? ' on' : ''), L.label);
      b.type = 'button';
      b.setAttribute('aria-pressed', state.level === id ? 'true' : 'false');
      b.addEventListener('click', function () { state.level = id; render(); });
      lv.appendChild(b);
    });
    f2.appendChild(lv);
    // ★ '기본'이라고 분명히 적는다. 값이 있는 항목은 설정과 무관하게 더 보이므로,
    //   그냥 '지금 N개'라고 하면 화면의 줄 수와 달라 보이고 버그처럼 읽힌다
    f2.appendChild(el('div', 'prog__d', F.LEVELS[state.level].hint
      + ' — 기본 ' + scopeCount() + '개 (값이 있거나 문제가 있는 항목은 설정과 무관하게 더 보입니다)'));
    og.appendChild(f2);

    opt.appendChild(og);
    body.appendChild(opt);

    // ★ 자동으로 채워지는 항목을 근거와 함께 보여준다.
    //   그냥 감추면 "왜 필수인데 안 보이지" 하고 다른 데서 찾는다
    var plan = currentPlan();
    if (plan) {
      var b = F.autoBreakdown(state.fields, plan, C.docType);
      var ac = el('div', 'card');
      var head = el('button', 'auto__h');
      head.type = 'button';
      head.setAttribute('aria-expanded', state.showAuto ? 'true' : 'false');
      head.appendChild(el('span', 'auto__t',
        '자동으로 채워지는 항목 ' + (b.total - b.manual.length) + '개'));
      head.appendChild(el('span', 'auto__s',
        '필수 ' + b.total + '개 중 직접 넣을 것은 ' + b.manual.length + '개입니다'));
      head.appendChild(el('span', 'auto__x', state.showAuto ? '접기 ▲' : '펼치기 ▼'));
      head.addEventListener('click', function () { state.showAuto = !state.showAuto; render(); });
      ac.appendChild(head);

      // ★ 남은 것들도 '아무도 못 채운다'는 뜻은 아니다. 대부분은 올린 자료에서
      //   뽑히고, 못 뽑은 것만 여기 남는다. 그 말을 안 하면 자료를 올려 놓고도
      //   같은 값을 손으로 다시 친다
      var byExtract = b.manual.filter(function (k) {
        return (plan[k] || {}).fill === 'extract';
      });
      if (byExtract.length) {
        ac.appendChild(el('p', 'card__s',
          '남은 ' + b.manual.length + '개 중 ' + byExtract.length + '개는 '
          + plan[byExtract[0]].label + ' 대상입니다 — ' + plan[byExtract[0]].why));
      }

      // ★ 키가 없으면 공공데이터 경로가 통째로 죽는다. 그 사실을 말하지 않으면
      //   "왜 물어보는 게 늘었지" 하고 화면을 의심한다 — 화면이 아니라 설정 문제다
      if (state.publicData === false) {
        var note = el('p', 'card__s',
          '공공데이터 인증키가 서버에 없어 공부(公簿) 조회가 꺼져 있습니다. '
          + '대지면적·공시지가·용도지역처럼 자동으로 채울 수 있었던 값이 직접 입력으로 내려와 있습니다.');
        note.style.color = 'var(--warn-ink)';
        ac.appendChild(note);
      }

      if (state.showAuto) {
        b.groups.forEach(function (g) {
          var row = el('div', 'auto__g');
          row.appendChild(el('div', 'auto__gl', g.label + ' · ' + g.keys.length + '개'));
          row.appendChild(el('div', 'auto__gw', g.why));
          var chips = el('div', 'ext');
          g.keys.forEach(function (k) {
            chips.appendChild(el('span', null, (state.fields[k] || {}).label || k));
          });
          row.appendChild(chips);
          ac.appendChild(row);
        });
        ac.appendChild(el('p', 'card__s',
          '자동으로 채워진 값도 화면에서 고칠 수 있습니다 — [일반용]이나 [전문가용]으로 바꾸면 나옵니다. '
          + '산업 통상치는 가정치로 표시되고, 문서에서 값이 나오면 그것이 이깁니다.'));
      }
      body.appendChild(ac);
    }

    // 도구
    var tools = el('div', 'tools');
    [['required', '필수만'], ['all', '전체'], ['empty', '미입력만']].forEach(function (t) {
      var c = el('button', 'chip' + (state.filter === t[0] ? ' on' : ''), t[1]);
      c.type = 'button';
      c.addEventListener('click', function () { state.filter = t[0]; render(); });
      tools.appendChild(c);
    });
    var q = el('input');
    q.type = 'search';
    q.value = state.q;
    q.placeholder = '항목명·별칭 검색 (예: 연면적, GFA)';
    q.setAttribute('aria-label', '항목 검색');
    q.addEventListener('input', function () {
      state.q = q.value;
      renderList();
      q.focus();                 // 다시 그려도 커서를 잃지 않는다
      try { q.setSelectionRange(q.value.length, q.value.length); } catch (_) {}
    });
    tools.appendChild(q);
    body.appendChild(tools);

    var list = el('div'); list.id = 'list';
    body.appendChild(list);

    // 결과
    if (state.result) {
      var r = state.result;
      var box = el('div', r.ok ? 'note note--ok' : 'note note--bad');
      if (r.ok) {
        box.textContent = r.saved + '건 저장했습니다 (' + (r.at || '') + ')';
        (r.rejected || []).forEach(function (x) {
          box.appendChild(el('div', null, '거부: ' + x.key + ' — ' + x.reason));
        });
        (r.warnings || []).forEach(function (w) { box.appendChild(el('div', null, '경고: ' + w)); });

        // ★ 저장하고 나면 **다음 단계로 가는 길을 그 자리에 낸다.**
        //   위쪽 단계 칩으로 돌아가 찾게 하면, 저장은 됐는데 멈춘 것으로 읽는다.
        //   ★ 필수가 남아 있으면 그렇다고 적는다 — 사양을 확정하면 되돌리기 어렵다
        var c = F.completeness(state.fields, state.values, C.docType, classKeys());
        var go = el('a', 'btn', '출력조건으로 →');
        go.href = stepUrl('reports.html');
        go.style.marginTop = '10px';
        go.style.display = 'inline-block';
        box.appendChild(go);
        if (c.total && c.filled < c.total) {
          box.appendChild(el('div', null,
            '필수 ' + c.total + '개 중 ' + (c.total - c.filled) + '개가 아직 비어 있습니다 — '
            + '지금 넘어가도 되지만, 사양을 확정하면 되돌리기 어렵습니다'));
        }
      } else {
        box.textContent = '저장하지 못했습니다 — ' + r.message;
      }
      body.appendChild(box);
    }

    // 계산 항목 — 입력란을 만들지 않는다
    //
    // ★ 목록은 접어 두지만 **이유는 항상 펼쳐 둔다.** 목록은 19줄이라 접는 게 낫고,
    //   "왜 못 치는가"를 같이 접으면 입력란이 없는 것을 화면 오류로 읽는다
    if (state.computedKeys.length) {
      var cc = el('div', 'card');
      var ch = el('button', 'auto__h');
      ch.type = 'button';
      ch.setAttribute('aria-expanded', state.showComputed ? 'true' : 'false');
      ch.appendChild(el('span', 'auto__t',
        '자동 계산으로 만들어지는 항목 ' + state.computedKeys.length + '개'));
      ch.appendChild(el('span', 'auto__s', '입력란을 만들지 않습니다'));
      ch.appendChild(el('span', 'auto__x', state.showComputed ? '접기 ▲' : '펼치기 ▼'));
      ch.addEventListener('click', function () { state.showComputed = !state.showComputed; render(); });
      cc.appendChild(ch);

      cc.appendChild(el('p', 'card__s',
        'IRR·NPV·DSCR·감정평가액은 입력받지 않습니다. 사람이 적어 넣으면 그 숫자가 어디서 왔는지 '
        + '추적할 수 없게 되고, 계산 결과와 다를 때 어느 쪽이 맞는지 판단할 근거가 사라집니다.'));

      if (state.showComputed) {
        var cl = el('div', 'cmp');
        state.computedKeys.forEach(function (k) {
          // ★ 이름은 서버(사전)가 준 것만 쓴다. 화면에 적어 두면 사전이 바뀐 날 갈린다.
          //   못 받았으면 key 를 그대로 보인다 — 빈 줄로 감추지 않는다
          var d = state.computedFields[k] || {};
          var row = el('div', 'cmp__r');
          row.appendChild(el('div', 'cmp__ko', d.ko || d.label || k));
          row.appendChild(el('div', 'cmp__en', d.en || ''));
          row.appendChild(el('div', 'cmp__u', d.unit ? '단위 ' + d.unit : ''));
          cl.appendChild(row);
        });
        cc.appendChild(cl);
        cc.appendChild(el('p', 'card__s',
          '이 값들은 [3단계 사양 확정] 뒤 생성할 때 재무 Agent 가 계산해 넣습니다. '
          + '문서에 같은 이름의 숫자가 있어도 그 값을 그대로 옮기지 않고, 다르면 값 충돌로 표시합니다.'));
      }
      body.appendChild(cc);
    }

    renderList();
    renderFooter();
  }

  function renderList() {
    var list = document.getElementById('list');
    if (!list) return;
    list.textContent = '';

    var required = F.requiredKeys(state.fields, C.docType);
    var groups = F.groupByCategory(state.fields);
    var shown = 0;

    groups.forEach(function (g) {
      var items = visibleItems(g);
      if (!items.length) return;
      shown += items.length;
      var card = el('div', 'card');
      card.appendChild(el('div', 'cat', g.category + ' · ' + items.length + '개'));
      items.forEach(function (it) { card.appendChild(fieldRow(it.key, it.def, required)); });
      list.appendChild(card);
    });

    if (!shown) {
      var e2 = el('div', 'card');
      e2.appendChild(el('div', 'empty',
        state.q ? '"' + state.q + '" 에 해당하는 항목이 없습니다' : '표시할 항목이 없습니다'));
      list.appendChild(e2);
    }
  }

  /* ── 시작 ─────────────────────────────────────────────── */

  var params = new URLSearchParams(location.search);
  if (params.get('api')) C.api = params.get('api');
  if (params.get('project')) C.projectId = params.get('project');
  if (params.get('doc')) C.docType = params.get('doc');

  var su = document.getElementById('side-user');
  if (su) su.textContent = (C.session && C.session.name) || '';

  if (window.LinkPilotInApp && window.LinkPilotInApp.mount) {
    try { window.LinkPilotInApp.mount(); } catch (_) {}
  }

  render();
  load();
}());
</script>
</body>
</html>
