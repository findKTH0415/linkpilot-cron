<!doctype html>
<html lang="ko" data-lp-build="0eae87ae">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>완성 보고서 · LINKPILOT</title>
<!--
  완성 보고서 — 만들어진 산출물 목록. 「새 보고서 생성」 탭의 짝이다.

  ★ 목록을 **화면이 만들지 않는다.** `GET /projects/:id/reports` 가 주는 것을 그린다.
    산출물이 하나 늘 때 화면도 같이 고쳐야 하면, 한쪽만 고치는 날 갈린다
    (PDF·탁상검토·법인가치가 실제로 그렇게 빠져 있었다 — 2026-08-17 발견).

  ★★ **진행률도 서버가 준다.** 분모를 화면이 계산하면 규칙이 두 벌이 된다.
    분모는 「이 프로젝트에서 나와야 하는 것」이지 「나올 수 있는 전부」가 아니다 —
    조건부 산출물(탁상검토·법인가치)을 분모에 넣으면 어떤 딜도 100% 가 되지 않아
    다 끝났는데도 덜 된 것처럼 보인다.

  ★★★ **100% 는 「만들어졌다」이지 「보내도 된다」가 아니다.**
    배포 차단(distribution.blocked)을 목록보다 **위에** 띄운다. 아래에 두면
    파일 목록만 보고 내보낸다.

  ★ 안 나온 것을 **이유와 함께** 보여준다. 목록에서 빠지면 「없는 기능」이 되고,
    이유 없이 회색이면 고장으로 읽힌다.

  ★ 이름에 「감정평가서」·「평가의견서」를 쓰지 않는다 — 목록에서 그렇게 보이면
    받는 사람이 정식 평가로 읽는다. 이름은 서버(OUTPUTS)가 정한다.

  붙이는 법은 window.LINKPILOT_OUTPUTS 만 채운다. 다른 곳에 값을 박지 않는다.
-->
<script>
/* ★★ **오래 걸리면 말한다** 〈2026-08-21〉. 뼈대만 두고 끝나면 그것도 흰 화면과
 *   다를 바 없다 — 「채워지는 중」이 영원히 채워지지 않는 것을 사용자가 알
 *   방법이 없기 때문이다. 뼈대가 그대로 남아 있으면 무엇을 해야 하는지 적는다.
 *   ★ 화면이 떴으면 `#boot` 이 통째로 사라지므로 이 글은 나오지 않는다. */
(function () {
  setTimeout(function () {
    var w = document.getElementById('lp-boot-why');
    if (!w || !document.getElementById('lp-boot')) return;
    w.hidden = false;
    w.textContent = '아직 화면이 안 떴습니다. 연결이 느리거나 화면 파일을 못 받은 것입니다 — '
      + '새로고침해 보시고, 그래도 그대로면 알려 주십시오.';
  }, 8000);
})();
</script>
<script>
/* ★★★ **빈 화면으로 끝나지 않는다** 〈2026-08-24 사장님: 데스크탑에서 흰 화면〉.
 *
 *   화면이 통째로 비어 뜬 일이 있었다. 소스는 멀쩡했고 헤드리스로 열면
 *   정상이었다 — 즉 **그 순간의 브라우저에서만** 무언가가 안 왔다.
 *
 *   ★ 가장 흔한 자리: 배포가 파일을 하나씩 갈아 끼우는 동안(70초쯤) 화면은
 *     새 판인데 형제 스크립트가 **아직 안 올라와 404** 인 순간이 있다.
 *     그러면 전역이 아예 안 생기고, 첫 줄에서 예외가 나고, **화면은 흰 채로
 *     아무 말도 안 한다.**
 *   ★ 아래쪽 **짝 확인 조각**은 옛 스크립트는 잡지만 **없는 스크립트**는
 *     못 잡는다 — 견줄 전역 자체가 없기 때문이다. 여기가 그 구멍이다.
 *     (그 조각의 표시 이름을 여기 글자로 적지 않는다. 그것을 찾는 검사가
 *      이 주석을 코드로 오해한다 — CLAUDE.md §8 에서 세 번째로 당한 자리다.)
 *
 * ★ 그래서 ① 파일이 안 온 것과 ② 코드가 던진 것을 **둘 다** 사람 말로 띄운다.
 * ★ 이 조각은 **형제 스크립트보다 먼저** 있어야 한다. 뒤에 두면 이미 난
 *   불러오기 실패를 못 듣는다.
 * ★ 검사 자신이 죽으면 안 된다 — 전부 try 로 감싼다. */
(function () {
  /* ★★★★ **자리를 「고치는」 것이 아니라 「틀리지 않게」 한다**
   *   〈2026-08-26 · 같은 고장 **네 번째** · M-56〉.
   *
   *   앱이 이 화면을 어디에 얹느냐에 따라 형제 파일 주소가 두 가지로 틀렸다 —
   *
   *     겹침    /im-flow/im-flow/embed-bridge.js   (앞을 두 번 붙인다)
   *     빠짐    /embed-bridge.js                   (앞을 아예 안 붙인다)
   *
   *   ★ 3판은 **겹침만** 고쳤다. 그래서 빠짐이 나자 또 빨간 띠가 떴다.
   *     **한 증상만 보고 고치면 남은 증상이 다음 주에 온다.**
   *
   * ★★ 그래서 「무엇이 틀렸나」를 고치지 않고 **「어디가 맞나」를 정한다.**
   *   형제 파일들은 늘 **한 폴더에 함께** 있다. 그 폴더를 세 가지로 찾는다 —
   *
   *     ① 앱이 알려 준 자리      `<meta name="lp:base">` 또는 window.LP_BASE
   *     ② 주소에 `im-flow` 가 있으면 **첫 번째** 것까지  (겹침이 여기서 풀린다)
   *     ③ 뿌리(`/`)에서 열렸으면 `/im-flow/`             (빠짐이 여기서 풀린다)
   *
   *   ①이 있는 이유: 앱이 다른 자리에 얹게 되는 날 **코드를 안 고치고**
   *   알려 줄 길을 남겨 둔다. 없으면 그날 또 이 파일을 고치게 된다.
   *
   * ★★★ **파일로 열었을 때(file:)는 손대지 않는다.** 미리보기가 그 길이다 —
   *   거기서 자리를 바꾸면 멀쩡한 화면이 깨진다 (늑대야).
   *
   * ★ 이 조각은 형제 파일들보다 **위**에 있으므로, 여기서 `<base>` 를 세우면
   *   아래 상대 경로들이 **처음부터 옳은 자리**를 본다 — 실패가 아예 안 난다.
   *   실패한 뒤에 다시 부르는 것으로는 부족했다(실측: 파일 17개를 다시 받았는데
   *   **버튼이 5개에서 0개**가 되었다 — 이미 초기화가 끝난 뒤였다).
   */
  try {
    var FOLDER = 'im-flow';                  /* 형제 파일들이 함께 사는 폴더 이름 */
    var base = null;
    var why = null;

    /* ① 앱이 알려 준 자리 */
    try {
      var meta = document.querySelector('meta[name="lp:base"]');
      var told = (meta && meta.getAttribute('content')) || window.LP_BASE || null;
      if (told) { base = String(told).replace(/\/*$/, '') + '/'; why = '앱이 알려 줌'; }
    } catch (_) { /* 무시 */ }

    if (!base && /^https?:$/.test(location.protocol)) {
      var pathname = String(location.pathname);
      var at = pathname.indexOf('/' + FOLDER + '/');
      if (at >= 0) {
        /* ② 첫 번째 `/im-flow/` 까지가 그 폴더다. 두 번 이어져 있어도 여기서 풀린다 */
        base = pathname.slice(0, at + FOLDER.length + 2);
        why = '주소에서 찾음';
      } else if (pathname.lastIndexOf('/') === 0) {
        /* ③ 뿌리에서 열렸다 — 형제 파일이 뿌리에 있을 리 없다 */
        base = '/' + FOLDER + '/';
        why = '뿌리에서 열려 폴더를 붙임';
      }
    }

    /* 지금 자리와 같으면 아무것도 하지 않는다 — 멀쩡한 화면을 건드리지 않는다 */
    var now = String(location.pathname).slice(0, String(location.pathname).lastIndexOf('/') + 1);
    if (base && base !== now && !document.querySelector('base[data-lp-base]')) {
      var b = document.createElement('base');
      b.setAttribute('data-lp-base', why);
      b.href = location.origin + base;
      (document.head || document.documentElement).insertBefore(
        b, (document.head || document.documentElement).firstChild);
      /* ★★ **조용히 넘어가지는 않는다.** 화면은 살렸지만 **근본은 앱 쪽**이다
       *   (앞을 붙이는 쪽). 사장님 화면에 빨간 띠를 띄우면 멀쩡히 도는 화면을
       *   고장으로 읽으시게 되므로, 개발자 콘솔과 표시로만 남긴다 —
       *   사람은 안 놀라고, 기계는 셀 수 있다. */
      try {
        console.warn('[LinkPilot] 형제 파일 자리를 바로잡았다 (' + why + '): '
          + now + ' → ' + base
          + ' — 화면은 정상이지만 **앞부분을 붙이는 앱 쪽**이 근본이다.');
      } catch (_) { /* 콘솔이 없어도 죽지 않는다 */ }
    }
  } catch (_) { /* 자리를 못 고쳐도 죽지 않는다 — 아래 띠가 받는다 */ }

  var shown = false;
  /**
   * ★★★ **고쳤다는 말과 못 고쳤다는 말을 같은 색으로 하지 않는다**
   *   〈2026-08-26 · 자가치유를 넣으면서〉.
   *
   *   빨강은 「화면이 안 뜬다」는 뜻이어야 한다. 스스로 고쳐서 화면이
   *   멀쩡히 뜬 경우까지 빨강으로 적으면, 사장님은 **멀쩡한 화면을 보며
   *   고장이라고 읽으신다** — 그러면 다음부터 빨간 띠를 안 믿게 된다.
   *
   * ★★ 그리고 **빗장(shown)을 경고에는 걸지 않는다.** 앞 판은 한 번 뜨면
   *   끝이라, 자가치유 알림이 먼저 뜨면 **뒤에 오는 진짜 실패가 통째로
   *   조용해졌다.** 조용한 실패가 이 저장소에서 가장 비쌌다.
   */
  function say(msg, kind) {
    var warn = kind === 'warn';
    if (shown) return;
    if (!warn) shown = true;          /* 치명만 빗장을 건다 */
    try {
      var n = document.createElement('div');
      n.setAttribute('data-lp-fail', warn ? 'warn' : '');
      n.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:99999;'
        + 'background:' + (warn ? '#8A6100' : '#C00000')
        + ';color:#fff;padding:14px 18px;font:700 14px/1.5 system-ui,sans-serif');
      n.textContent = msg;
      var put = function () { if (document.body) document.body.appendChild(n); };
      if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
    } catch (_) { /* 알리다 죽지 않는다 */ }
  }
  /* 불러오기 실패는 거품이 안 올라온다 — 잡기 단계(true)에서 들어야 한다 */
  window.addEventListener('error', function (e) {
    try {
      var t = e && e.target;
      if (!t || !t.tagName) return;
      var tag = String(t.tagName).toUpperCase();
      if (tag !== 'SCRIPT' && tag !== 'LINK') return;
      /* ★★★ **이름만으로는 갈라 낼 수 없다** 〈2026-08-25 · 실제로 못 갈랐다〉.
       *   앱 안에서 이 띠가 떴을 때 「그 파일이 NAS 에 없다」와 「앱이 엉뚱한
       *   자리에서 찾는다」가 **똑같이 파일 이름 하나로만** 보였다. 파일은
       *   NAS 에 있었고 HTTP 200 이었는데도 그랬다 — 갈랐어야 할 것은
       *   **어느 경로로 찾았나**이고, 그것이 이름을 자르면서 사라졌다.
       * ★ 호스트는 뗀다 (CLAUDE.md §2). 경로만 있으면 갈린다. */
      var raw = String(t.src || t.href || '');
      var where = raw;
      try { var u = new URL(raw, location.href); where = u.pathname + u.search; } catch (_) {}
      /* ★★★ **경로가 겹쳤으면 그렇다고 말한다** 〈2026-08-26 · 실제로 났다〉.
       *   앱 안에서 `/im-flow/im-flow/tokens.css` 로 찾다가 못 받았다.
       *   이 화면들의 링크는 **전부 상대 경로**(`tokens.css`)라 앞을 붙이지
       *   않는다 — 즉 앞부분을 **덧붙이는 쪽은 앱**이다.
       *
       *   ★ 그런데 띠는 「못 받았습니다」만 말했다. 그러면 「파일이 없다」와
       *     「엉뚱한 자리에서 찾는다」가 **같은 문장으로 보인다.** 사장님은
       *     새로고침을 하시고, 그래도 그대로면 그때부터 원인을 못 찾는다.
       *   ★ 같은 토막이 두 번 이어지는 것은 **새로고침으로 안 없어진다.**
       *     그것은 배포가 도는 중이라서가 아니라 **주소를 만드는 코드**의 일이다. */
      var dup = null;
      try {
        var segs = String(where).split('?')[0].split('/').filter(Boolean);
        for (var i = 0; i + 1 < segs.length; i++) {
          if (segs[i] === segs[i + 1]) { dup = segs[i]; break; }
        }
      } catch (_) { /* 무시 */ }
      if (dup) {
        /* ★★★ **띠는 진단만 했다 — 그래서 같은 일이 계속 났다** 〈2026-08-26 · 세 번째〉.
         *
         *   앞 판 둘은 **메시지를 좋게 만드는 일**이었다. 「못 받았습니다」에
         *   경로를 붙이고, 다시 「두 번 들어 있습니다」를 붙였다. 그런데
         *   **화면은 여전히 안 떴다.** 사장님이 보시는 것은 같은 빨간 띠다.
         *
         * ★ 잘 설명하는 고장은 **고장이다.** 여기서 스스로 고친다 —
         *   겹친 토막을 하나 지우고 **그 파일을 다시 부른다.**
         *
         * ★★ 앞을 덧붙이는 것은 앱 쪽이지만, **고치는 것은 이쪽이 할 수 있다.**
         *   저쪽 저장소에 쓰지 않기로 한 경계(§8-2)를 지키면서 화면은 살린다.
         *
         * ★★★ **한 번만 고친다.** 고친 주소가 또 실패하면 그때는 진짜로
         *   파일이 없는 것이다 — 무한히 다시 부르면 그 사실이 사라진다. */
        var fixed = null;
        try {
          var u2 = new URL(raw, location.href);
          var ss = u2.pathname.split('/');
          for (var k = 0; k + 1 < ss.length; k++) {
            if (ss[k] && ss[k] === ss[k + 1]) { ss.splice(k, 1); break; }
          }
          u2.pathname = ss.join('/');
          fixed = u2.href;
        } catch (_) { fixed = null; }

        if (fixed && fixed !== raw && !t.getAttribute('data-lp-healed')) {
          var el = tag === 'LINK'
            ? document.createElement('link')
            : document.createElement('script');
          el.setAttribute('data-lp-healed', '1');
          if (tag === 'LINK') { el.rel = 'stylesheet'; el.href = fixed; }
          else {
            el.src = fixed;
            /* 원래 태그가 지녔던 표시를 그대로 옮긴다 — 이것이 없으면
               `embed-bridge.js` 가 어느 전역에 붙을지 모른다 */
            var g = t.getAttribute('data-lp-global');
            if (g) el.setAttribute('data-lp-global', g);
            el.async = false;   /* 순서를 지킨다 — 뒤 파일이 앞 파일을 쓴다 */
          }
          t.setAttribute('data-lp-healed', '1');
          (document.head || document.documentElement).appendChild(el);
          say('경로에 「' + dup + '」가 두 번 들어 있어 **한 번 고쳐서 다시 불렀습니다** — '
            + where + ' → ' + (function () {
              try { var v = new URL(fixed); return v.pathname + v.search; } catch (_) { return fixed; }
            }()) + '. 화면이 뜨면 그대로 쓰셔도 됩니다. 앞부분을 덧붙이는 것은 **앱 쪽**이라 '
            + '근본은 그쪽에서 고쳐야 합니다 — 이 경로를 그대로 알려 주십시오.', 'warn');
          return;
        }
        say('화면에 필요한 파일을 못 받았습니다: ' + (where || '(이름 모름)')
          + ' — 경로에 「' + dup + '」가 **두 번** 들어 있습니다.'
          + ' 고쳐서 다시 불러 봤지만 그것도 실패했습니다 — 파일이 정말 없는 자리입니다.'
          + ' 위 경로를 그대로 알려 주십시오.');
      } else {
        say('화면에 필요한 파일을 못 받았습니다: ' + (where || '(이름 모름)')
          + ' — 배포가 도는 중이면 30초 뒤 새로고침(Mac ⌘⇧R · Windows Ctrl+Shift+R)으로 사라집니다.'
          + ' 한 번 하고도 그대로면 그것은 **다른 일**입니다 — 위 경로를 그대로 알려 주십시오.');
      }
    } catch (_) { /* 무시 */ }
  }, true);
  /* ★★★ **헛울음을 내지 않는다** 〈2026-08-24 · 실측에서 걸렸다〉.
   *   `report-flow.html` 은 창을 품고 있어서 브라우저가 막는 읽기가 하나 난다
   *   (`SecurityError: Location.pathname`). 화면은 **멀쩡히 뜬다.**
   *   그것까지 빨간 띠로 띄우면 **멀쩡한 화면에 고장 딱지**가 붙는다.
   * ★ 그래서 코드가 던진 것은 **화면이 실제로 비었을 때만** 알린다.
   *   빈 화면이 이 장치가 막으려는 것이고, 그 밖은 알릴 일이 아니다. */
  var lastErr = null;
  function noteErr(m) {
    lastErr = m;
    setTimeout(function () {
      try {
        var b = document.body;
        var n = b ? (b.innerText || '').trim().length : 0;
        if (n < 40) {
          say('화면을 그리다 멈췄습니다: ' + lastErr
            + ' — 이 글이 보이면 고장입니다. 이대로 알려 주십시오.');
        }
      } catch (_) { /* 무시 */ }
    }, 1200);
  }
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target.tagName) return;   // 위에서 이미 다뤘다
    noteErr((e && e.message) || '알 수 없는 오류');

  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    noteErr((r && r.message) || r || '알 수 없는 오류');

}());

  ★★★ 짝 확인 — **화면과 스크립트가 같은 판인가** 〈2026-08-23 · D-93 사고〉.

  사장님 화면이 「F.readEvidence is not a function」으로 죽었다. 배포는 초록이었고

    **캐시가 원인이라는 생각 자체가 안 든다.**

  ★ 그래서 여기서 **먼저 잡는다.** 표를 두지 않는다 — `window` 의 LinkPilot* 전역을
    훑어 자기 판을 말하는 것만 골라 문서 지문과 댄다. 스크립트가 늘어도 안 갈린다.
  ★ 이 조각은 **화면 안에** 있어야 한다. 따로 파일로 빼면 그 파일도 옛것일 수 있다.
-->
<script>
(function () {
  var want = document.documentElement.getAttribute('data-lp-build');
  if (!want) return;                       /* 지문이 없는 판 — 잴 것이 없다 */
  var bad = [];
  try {
    Object.keys(window).forEach(function (k) {
      if (k.indexOf('LinkPilot') !== 0) return;
      var v = window[k];
      if (v && typeof v === 'object' && typeof v.BUILD === 'string'
        && v.BUILD !== want) bad.push(k + ' (' + v.BUILD + ')');
    });
  } catch (_) { return; }                  /* 훑다 막히면 조용히 — 검사가 화면을 죽이지 않는다 */
  if (!bad.length) return;

  /* ★★★ **한 번은 화면이 스스로 고친다** 〈2026-08-27 · D-149〉.
   *
   *   앞 판은 빨간 띠로 「새로고침해 주십시오」라고만 했다. 그 말은 맞지만
   *   **고치는 일을 사람에게 떠넘긴다** — 사장님이 폰에서 강제 새로고침을
   *   하시는 것은 쉬운 일이 아니다 (M-58 과 같은 결: 「잠깐 나는 고장을
   *   사람에게 떠넘기지 않는다」).
   *
   *   ★ 그래서 주소에 표를 하나 붙여 **다시 받는다.** 브라우저는 주소가 다르면
   *     캐시를 안 쓴다. 화면이 새로 오면 스크립트와 판이 맞는다.
   *   ★★ **세션당 한 번만.** 서버에 정말 두 판이 섞여 있으면 다시 받아도 같다 —
   *     그때 또 다시 받으면 **끝없이 돈다.** 한 번 해 보고 안 되면 띠를 띄운다.
   *   ★ 표는 다음 새로고침에서 사라지도록 `replace` 로 바꾼다 (뒤로가기에 안 쌓인다). */
  try {
    var KEY = 'lp-pair-retried';
    if (!sessionStorage.getItem(KEY)) {
      sessionStorage.setItem(KEY, want);
      var u = location.href.replace(/[?&]lpfix=\d+/, '');
      location.replace(u + (u.indexOf('?') < 0 ? '?' : '&') + 'lpfix=' + Date.now());
      return;
    }
  } catch (_) { /* 저장소가 막힌 자리도 있다 — 그때는 띠만 띄운다 */ }

  var n = document.createElement('div');
  n.setAttribute('data-lp-pair', '');
  n.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:99999;'
    + 'background:#C00000;color:#fff;padding:14px 18px;font:700 14px/1.5 system-ui,sans-serif');
  /* ★★★ **어느 쪽이 옛것인지 아는 척하지 않는다 — 다만 구조가 답을 준다**
   *   〈2026-08-27 · D-149 · 실제 화면에서 거꾸로 말했다〉.
   *
   *   앞 판은 「옛 판 <스크립트 이름들>」이라고 **스크립트를 옛것으로 지목**했다.
   *   그런데 사장님 화면은 반대였다 — 화면 479c745f(옛), 스크립트 64478fa1(새).
   *
   *   ★ 지문은 해시라 **그 자체로는 앞뒤가 없다.** 하지만 자리 관계가 답을 준다:
   *     · 배포는 **자산 먼저 · HTML 나중**으로 올린다 (deploy-nas 「Upload」).
   *     · 화면은 형제 파일을 **판 표시를 붙여** 부르는데, 서버는 그 표를
   *       무시하고 **지금 있는 파일**을 준다.
   *       (표 이름을 여기 글자로 적지 않는다 — 검사가 주석을 코드로 읽는다. §8)
   *   → 그래서 어긋나면 **거의 언제나 화면(HTML)이 옛것**이다. 스크립트는
   *     서버의 지금 판이다. 그 말을 그대로 적는다.
   *   ★ 그래도 단정하지 않는다 — 「대개」라고 적고, 새로고침해도 같으면
   *     **서버에 두 판이 섞인 것**이니 알려 달라고 한다. */
  n.textContent = '화면과 스크립트의 판이 다릅니다 — 화면(HTML)이 옛 판일 가능성이 큽니다. '
    + '한 번 다시 받아 봤는데도 그대로입니다. '
    + '화면 ' + want + ' · 스크립트 ' + bad.join(', ')
    + ' · 어느 쪽인지 지금 확인하고 있습니다 — 잠시 뒤 이 자리에 무엇을 하면 되는지 적힙니다. '
    + '그대로면 이 여덟 글자 두 개를 알려 주시면 저희가 봅니다.';

  /* ★★★ **「둘 중 하나」로 끝내지 않는다 — 물어봐서 가른다** 〈2026-08-27 · 사장님 화면〉.
   *
   *   앞 판은 「서버에 두 판이 섞여 있을 수 있습니다」로 끝났다. 그런데 그 말은
   *   **읽는 사람이 할 수 있는 일이 없다** — 캐시를 지워야 하는지, 배포가 안
   *   된 것인지 갈리지 않기 때문이다. 오늘 그 갈림에서 세 번 헤맸다.
   *
   *   ★ 가르는 법은 간단하다. **이 화면의 주소를 캐시를 쓰지 말고 다시 받아**
   *     거기 적힌 판을 본다. 받은 것이
   *       · 지금 그려진 것과 **같으면** → 서버가 정말 옛 화면을 준다
   *       · **다르면**               → 서버는 새 판이고 브라우저가 옛것을 들고 있다
   *   ★ 못 받으면 **못 쟀다고 적는다.** 「둘 중 하나」로 되돌아가지 않는다.
   *   ★ 판 표시는 문서 뿌리의 속성에 있다 — 받은 글에서 그 속성을 찾는다.
   */
  try {
    var url = location.href.replace(/[?&]lpcheck=\d+/, '');
    url += (url.indexOf('?') < 0 ? '?' : '&') + 'lpcheck=' + Date.now();
    fetch(url, { cache: 'no-store', credentials: 'same-origin' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var m = /data-lp-build="([0-9a-f]+)"/.exec(t);
        var fresh = m && m[1];
        if (!fresh) {
          n.textContent += ' — 다시 받아 봤지만 판을 읽지 못했습니다. 알려 주시면 저희가 봅니다.';
          return;
        }
        if (fresh === want) {
          n.textContent = '서버가 옛 화면을 주고 있습니다 — 브라우저 탓이 아닙니다. '
            + '화면 ' + want + ' · 스크립트 ' + bad.join(', ')
            + ' · 캐시를 지우셔도 그대로입니다. 이 두 글자묶음을 알려 주십시오.';
        } else {
          n.textContent = '브라우저가 옛 화면을 들고 있습니다 — 서버는 새 판(' + fresh + ')입니다. '
            + '앱을 완전히 껐다 켜시고, 그래도 그대로면 앱 설정에서 **캐시 삭제**를 하십시오. '
            + '(화면 ' + want + ' · 스크립트 ' + bad.join(', ') + ')';
        }
      })
      .catch(function () {
        n.textContent += ' — 다시 받아 보지 못했습니다(연결). 알려 주시면 저희가 봅니다.';
      });
  } catch (_) { /* fetch 가 없는 자리도 있다 — 그때는 위 문장으로 둔다 */ }
  var put = function () { if (document.body) document.body.appendChild(n); };
  if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
}());
</script>
<script>
(function () {
  'use strict';
  var C = window.LINKPILOT_OUTPUTS;

  /* ★★ 서버 주소는 `flow-core.js` 한 곳에서 정한다 〈2026-08-27 · D-148〉.
   *   앱이 화면을 **통째로** 열면 다리가 설정을 못 넘긴다. 그때 화면마다 다르게
   *   굴면 「어느 화면은 되고 어느 화면은 안 된다」가 되어 원인이 안 보인다. */
  (function () {
    var F0 = window.LinkPilotFlow;
    if (!C.api && F0 && F0.resolveApi) {
      var r0 = F0.resolveApi(C);
      if (r0 && r0.api) C.api = r0.api;
    }
  }());
  var G = window.LinkPilotGate;
  var F = window.LinkPilotFlow;
  var view = document.getElementById('view');

  var state = {
    projects: null,       // null = 아직 안 불러옴
    /* ★ 접힌 것을 잠깐 펴서 보는 중인가 〈2026-08-24〉 */
    showFolded: false,
    projectId: C.projectId || null,
    data: null,           // GET /projects/:id/reports 응답 그대로
    error: null,
    loading: false,
    // ── 네 갈래 (2026-08-20) ────────────────────────────────────
    // 고른 문서 하나가 대상이다. 없으면 단추를 **누를 수 있게 두지 않는다** —
    // 대상 없이 눌리면 무엇에 대고 눌렀는지 아무도 모른다
    pickedPath: null,
    preview: null,   // 지금 펴 놓은 문서 { path, name }
    said: null,      // 방금 한 일을 한 줄로 (복사했다 · 앱이 안 받았다 …)
  };

  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (x !== undefined && x !== null && x !== '') n.textContent = String(x);
    return n;
  }
  function add(p) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) p.appendChild(arguments[i]); return p; }

  /** 바이트를 사람이 읽는 크기로. 0 은 '0 B' 로 — 빈칸으로 두면 못 잰 것과 구분이 안 된다 */
  function size(b) {
    if (!(b > 0)) return '0 B';
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
    return (b / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function get(url) {
    /* ★★ **서버 주소가 없으면 부르지 않는다** 〈2026-08-23〉. `C.api` 가 `null`
     *   이면 주소가 `"null/projects"` 가 되어 지금 페이지 옆의 없는 파일을
     *   찾고, 웹서버가 404 를 준다 — 화면에는 「서버 오류 (404)」만 뜬다.
     *   그 404 는 **서버가 라우트를 잃은 것과 똑같이 보인다.** */
    if (/^null\//.test(String(url)) || String(url).indexOf('null/') === 0) {
      return Promise.reject(new Error(
        '서버가 연결되어 있지 않습니다 — 앱 안에서 열어 주십시오.'));
    }
    return fetch(url, { credentials: 'same-origin' }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) {
        if (!r.ok) throw new Error((b && b.error) || ('서버 오류 (' + r.status + ')'));
        return b;
      });
    });
  }

  /** 값을 바꿔 달라고 보낸다. 실패는 부르는 쪽이 다룬다 */
  function put(url, body) {
    if (String(url).indexOf('null/') === 0) {
      return Promise.reject(new Error('서버가 연결되어 있지 않습니다'));
    }
    return fetch(url, {
      method: 'PUT', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body || {}),
    }).then(function (r) {
      if (!r.ok) throw new Error('서버 오류 (' + r.status + ')');
      return r.json().catch(function () { return {}; });
    });
  }

  /* ── 불러오기 ─────────────────────────────────────────── */

  function loadProjects() {
    if (C.preload && C.preload.projects) {
      state.projects = C.preload.projects;
      return Promise.resolve();
    }
    if (!C.api) { state.projects = []; return Promise.resolve(); }
    return get(C.api + '/projects').then(function (b) {
      state.projects = (b && b.projects) || [];
    }).catch(function (e) { state.error = e.message; state.projects = []; });
  }

  function loadReports() {
    if (!state.projectId) { state.data = null; return Promise.resolve(); }
    if (C.preload && C.preload.reports) {
      state.data = C.preload.reports;
      return Promise.resolve();
    }
    if (!C.api) { state.data = null; return Promise.resolve(); }
    state.loading = true;
    return get(C.api + '/projects/' + encodeURIComponent(state.projectId) + '/reports')
      .then(function (b) { state.data = b; state.error = null; })
      .catch(function (e) { state.error = e.message; state.data = null; })
      .then(function () { state.loading = false; });
  }

  /* ── 조각 ─────────────────────────────────────────────── */

  /* ══════════ 목록 접기 〈2026-08-24 사장님 지시〉 ══════════
   *
   * ★★ **지운 것이 아니다.** 폴더·자료·보고서는 그대로 있다. 화면이 그 말을
   *   해야 한다 — 안 하면 사라진 줄 알고 다시 만든다.
   * ★ 서버가 접힘을 기억한다(`PUT /projects/:id/hidden`). 서버에 못 닿아도
   *   **이 브라우저에서는 접힌 채로** 둔다 — 안 그러면 눌러도 아무 일이 안 난다.
   */
  var LOCAL_FOLD = 'lp.folded.projects';

  function localFolded() {
    try { return JSON.parse(localStorage.getItem(LOCAL_FOLD) || '{}') || {}; }
    catch (_) { return {}; }
  }
  function setLocalFold(id, on) {
    try {
      var m = localFolded();
      if (on) m[id] = 1; else delete m[id];
      localStorage.setItem(LOCAL_FOLD, JSON.stringify(m));
    } catch (_) { /* 못 적어도 화면은 돈다 */ }
  }
  /** 접혀 있는가 — 서버가 말한 것이 먼저, 없으면 이 브라우저의 기억 */
  function folded(p) {
    if (p && p.hidden === true) return true;
    return !!localFolded()[p && p.id];
  }

  function fold(id, on) {
    setLocalFold(id, on);
    if (state.projectId === id && on) { state.projectId = null; state.data = null; }
    draw();
    if (!C.api) return;
    put(C.api + '/projects/' + encodeURIComponent(id) + '/hidden', { hidden: on })
      .then(loadProjects)
      .then(draw)
      .catch(function () { /* 이 브라우저에서는 이미 접혔다 */ });
  }

  /** 「지난 것 N개를 접어 두었습니다 · 보기」 줄 */
  function foldBar() {
    var all = state.projects || [];
    var n = all.filter(folded).length;
    var bar = el('div', 'foldbar');
    bar.setAttribute('style', 'display:flex;gap:10px;align-items:center;'
      + 'flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink2)');

    if (n) {
      bar.appendChild(el('span', null, '지난 것 ' + n + '개를 접어 두었습니다 — '
        + '지운 것이 아닙니다. 자료와 보고서는 그대로 있습니다.'));
      var t = el('button', 'btn2');
      t.type = 'button';
      t.textContent = state.showFolded ? '접힌 것 감추기' : '지난 것 보기';
      t.addEventListener('click', function () { state.showFolded = !state.showFolded; draw(); });
      bar.appendChild(t);
    }

    var cur = all.filter(function (p) { return p.id === state.projectId; })[0];
    if (cur) {
      var b = el('button', 'btn2');
      b.type = 'button';
      b.textContent = folded(cur) ? '목록에 다시 펴기' : '이 프로젝트를 목록에서 숨기기';
      b.addEventListener('click', function () { fold(cur.id, !folded(cur)); });
      bar.appendChild(b);
    }
    return bar;
  }

  function picker() {
    var card = el('section', 'card');
    var row = el('div', 'pick');
    add(row, el('label', null, '프로젝트'));

    var sel = document.createElement('select');
    sel.setAttribute('aria-label', '프로젝트 고르기');
    var none = document.createElement('option');
    none.value = '';
    none.textContent = state.projects && state.projects.length ? '— 고르세요 —' : '프로젝트가 없습니다';
    sel.appendChild(none);
    /* ★★★ **지난 것은 접어 둔다** 〈2026-08-24 사장님: 「지난 리스트는 삭제해줘
     *   목록에서 혼란스러움」〉. 고르는 목록에 스무 개가 넘게 쌓여 시험용과
     *   앱에서 가져온 실제 딜이 **섞여** 있었다.
     * ★ **지우지 않는다.** 지우면 그 안의 자료와 만든 보고서까지 사라지고
     *   되돌릴 수 없다. 목록에서만 접고, 「지난 것 보기」로 되돌아온다. */
    var shown = (state.projects || []).filter(function (p) {
      return state.showFolded || !folded(p);
    });
    shown.forEach(function (p) {
      var o = document.createElement('option');
      o.value = p.id;
      o.textContent = (p.name ? (p.name + ' · ' + p.id) : p.id)
        + (folded(p) ? '   (접어 둠)' : '');
      if (p.id === state.projectId) o.selected = true;
      sel.appendChild(o);
    });
    sel.disabled = !shown.length;
    sel.addEventListener('change', function () {
      state.projectId = sel.value || null;
      state.data = null;
      draw();
      loadReports().then(draw);
    });
    add(row, sel);
    card.appendChild(row);
    card.appendChild(foldBar());

    if (state.projects && !state.projects.length) {
      card.appendChild(el('p', 'card__d',
        '아직 만든 프로젝트가 없습니다. 「' + F.SECTION.tab + '」에서 시작하세요.'));
    }
    return card;
  }

  /**
   * 진행 — **서버가 준 분모를 그대로 쓴다.**
   * 여기서 다시 계산하면 산출물이 하나 늘 때 한쪽만 고치는 날 조용히 틀린다.
   */
  function progress(d) {
    var p = d.progress || {};
    var card = el('section', 'card');
    var head = el('div', 'prog__h');

    // ★ 분모가 없으면 % 를 만들지 않는다. 0/0 을 100% 로 적으면
    //   아무것도 안 만든 프로젝트가 「다 됐다」로 보인다
    var hasPct = p.percent !== null && p.percent !== undefined;
    add(head,
      el('b', 'pct', hasPct ? (p.percent + '%') : '—'),
      el('span', 'cnt', (p.done || 0) + ' / ' + (p.total || 0) + '종'),
      el('span', 'of', p.countsWhat || ''));
    card.appendChild(head);

    var bar = el('div', 'bar');
    var fill = el('span', 'bar__f' + (p.done ? '' : ' none'));
    fill.style.width = (hasPct ? p.percent : 0) + '%';
    bar.appendChild(fill);
    card.appendChild(bar);

    card.appendChild(say(d, p, hasPct));

    // 사양을 못 읽었으면 분모가 흔들린다 — 조용히 넘기지 않는다
    if (d.specKnown === false) {
      card.appendChild(el('p', 'card__d',
        '출력 사양을 읽지 못해 형식에 따라 갈리는 산출물(PDF 등)은 세지 않았습니다.'));
    }
    return card;
  }

  /** 진행율에 따라 다른 말을 한다. **100% 는 「보내도 된다」가 아니다** */
  function say(d, p, hasPct) {
    var n = el('p', 'say');
    var blocked = d.distribution && d.distribution.blocked;

    if (!p.total) {
      n.textContent = '아직 만들 것이 정해지지 않았습니다. 「' + F.SECTION.tab
        + '」에서 출력 사양을 확정하면 여기에 목록이 생깁니다.';
      return n;
    }
    if (!p.done) {
      n.textContent = '아직 나온 문서가 없습니다. 「' + F.SECTION.tab + '」 4단계에서 생성을 시작하세요.';
      return n;
    }
    if (p.done < p.total) {
      n.innerHTML = '<b>' + (p.total - p.done) + '종이 아직 안 나왔습니다.</b> '
        + '아래 목록에서 무엇이 남았는지와 그 이유를 볼 수 있습니다.';
      return n;
    }
    // 다 나왔다 — 여기서 「끝났다」로 끝내지 않는다
    n.innerHTML = blocked
      ? '<b>사양에 담은 것은 모두 나왔지만 배포가 막혀 있습니다.</b> 위의 사유를 해소해야 내보낼 수 있습니다.'
      : '<b>사양에 담은 것이 모두 나왔습니다.</b> 100% 는 「만들어졌다」이지 「보내도 된다」가 아닙니다 — '
        + '내보내기 전에 배포 전 교차검증을 지나세요.';
    return n;
  }

  /* ── 네 갈래 ─────────────────────────────────────────────
   *
   * [미리보기] [다운로드] [공유하기] [프로젝트 이동]  〈2026-08-20 사용자 지시〉
   *
   * ★★ 넷 다 **대상이 있어야 뜻이 있다.** 그래서 목록에서 고른 문서 하나를
   *   대고 누른다. 아무것도 안 골랐으면 **누를 수 있게 두지 않는다** — 눌리면
   *   무엇에 대고 눌렀는지 아무도 모르고, 그 상태로 파일이 나가면 되돌릴 수 없다.
   *
   * ★★ **배포가 막혔으면 셋이 다 잠긴다** (미리보기·다운로드·공유하기).
   *   목록에서는 「차단」인데 미리보기로는 열린다면 검증 게이트가 아무 의미도 없다.
   *   「프로젝트 이동」만 열어 둔다 — 그건 파일을 내보내는 일이 아니다.
   *
   * ★ **공유하기는 주소를 복사하는 것까지다.** 남에게 열어 주는 링크를 만들지
   *   않는다 — 그런 길이 서버에 없다. 없는 것을 있는 척하면 사용자는 보냈다고
   *   믿고, 받는 쪽은 열지 못한다. 그래서 무엇을 복사했는지 그대로 말한다.
   */

  /** 미리보기로 펼 수 있는 것 — **열어 보이지 못할 것을 열겠다고 하지 않는다** */
  function canPreview(path) {
    return /\.(html?|md|txt|json|csv|pdf|svg|png|jpe?g)$/i.test(String(path || ''));
  }

  function fileUrl(path) {
    if (!C.api || !state.projectId) return null;
    return C.api + '/projects/' + encodeURIComponent(state.projectId)
      + '/file?rel=' + encodeURIComponent(path);
  }

  /** 지금 고른 문서. 안 골랐으면 **나온 문서 중 첫 번째**를 기본으로 삼는다 */
  function pickedDoc(d) {
    var out = (d.all || d.files || []).filter(function (f) { return f.exists; });
    if (!out.length) return null;
    for (var i = 0; i < out.length; i++) if (out[i].path === state.pickedPath) return out[i];
    return out[0];
  }

  /**
   * 「프로젝트 이동」 — **앱이 옮긴다.** 이 화면은 탭 하나일 뿐이라 스스로
   * 다른 탭으로 갈 수 없다. 그래서 앱에 알리고, **앱이 안 받으면 그렇다고 말한다.**
   * 되는 척하면 사용자는 눌러 놓고 아무 일도 안 일어나는 것을 본다.
   */
  function goProject() {
    // ★ 옮기는 방법은 flow-core 한 곳에 있다 — 화면마다 복사하지 않는다 (2026-08-21)
    var sent = F.openSection({ projectId: state.projectId, section: F.SECTION.id }).sent;
    state.said = sent
      ? '「' + F.SECTION.tab + '」으로 넘겼습니다.'
      : '이 화면은 탭 하나라 스스로 옮길 수 없습니다 — 위 탭에서 「'
        + F.SECTION.tab + '」을 눌러 주십시오.';
    draw();
  }

  /** 「공유하기」 — 주소를 복사한다. **무엇을 복사했는지 그대로 말한다** */
  function share(f) {
    var url = fileUrl(f.path);
    if (!url) return;
    var abs = url;
    try { abs = new URL(url, window.location.href).href; } catch (_) {}
    var done = function (ok) {
      state.said = ok
        ? '주소를 복사했습니다 — 이 주소는 **로그인한 사람만** 열 수 있습니다. '
          + '바깥으로 보내려면 파일을 내려받아 보내십시오.'
        : '주소를 복사하지 못했습니다 (브라우저가 막았습니다). 「다운로드」로 받아 보내십시오.';
      draw();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(abs).then(function () { done(true); }, function () { done(false); });
    } else {
      done(false);
    }
  }

  /**
   * 네 갈래 줄. **설명 바로 아래**에 둔다 — 무엇을 할 수 있는지가 목록보다 먼저다.
   */
  function actions(d) {
    var blocked = !!(d.distribution && d.distribution.blocked);
    var f = pickedDoc(d);
    var box = el('section', 'card');

    var row = el('div', 'acts');

    // ① 미리보기 — 이 자리에서 편다 (새 창을 열면 인앱 브라우저에서 돌아오지 못한다)
    var open = state.preview && f && state.preview.path === f.path;
    var prev = el('button', 'act' + (open ? ' on' : ''), open ? '미리보기 닫기' : '미리보기');
    prev.type = 'button';
    prev.disabled = !f || blocked || !C.api || !canPreview(f && f.path);
    prev.addEventListener('click', function () {
      state.said = null;
      state.preview = open ? null : { path: f.path, name: f.name };
      draw();
    });
    row.appendChild(prev);

    // ② 다운로드 — 목록의 것과 **같은 주소**다. 두 벌로 만들지 않는다
    var dl = document.createElement('a');
    dl.className = 'act';
    dl.textContent = '다운로드';
    if (!f || blocked || !C.api) {
      dl.setAttribute('aria-disabled', 'true');
      dl.href = '#';
    } else {
      dl.href = fileUrl(f.path);
      dl.setAttribute('download', '');
    }
    row.appendChild(dl);

    // ③ 공유하기 — 주소 복사까지다 (§ 위 주석)
    var sh = el('button', 'act', '공유하기');
    sh.type = 'button';
    sh.disabled = !f || blocked || !C.api;
    sh.addEventListener('click', function () { share(f); });
    row.appendChild(sh);

    // ④ 프로젝트 이동 — **막혀 있어도 열어 둔다** (파일을 내보내는 일이 아니다)
    var go = el('button', 'act', '프로젝트 이동');
    go.type = 'button';
    go.disabled = !state.projectId;
    go.addEventListener('click', goProject);
    row.appendChild(go);

    box.appendChild(row);

    // ★ **무엇에 대고 누르는지**를 적는다. 안 적으면 어느 문서인지 모른 채 누른다
    if (f) {
      box.appendChild(add(el('p', 'acts__on'),
        document.createTextNode('고른 문서 '), el('b', null, f.name),
        document.createTextNode(' · ' + f.path)));
    } else {
      box.appendChild(el('p', 'acts__on', '아직 나온 문서가 없어 고를 것이 없습니다.'));
    }

    // ★ 잠근 이유를 **적는다.** 이유 없이 회색이면 고장으로 읽힌다
    var why = blocked ? '배포가 막혀 있어 미리보기·다운로드·공유가 잠겼습니다. 위의 사유를 먼저 해소하십시오.'
      : !C.api ? '서버가 연결되어 있지 않아 파일을 열 수 없습니다.'
      : (f && !canPreview(f.path)) ? ('이 형식(' + String(f.path).split('.').pop()
          + ')은 브라우저에서 펴 볼 수 없습니다 — 내려받아서 여십시오.')
      : null;
    if (why) box.appendChild(el('p', 'acts__why', why));
    if (state.said) box.appendChild(el('p', 'acts__on', state.said));

    var pv = previewBox(f, blocked);
    if (pv) box.appendChild(pv);
    return box;
  }

  /** 펴 놓은 문서. **새 창을 열지 않는다** — 인앱 브라우저에서는 돌아오지 못한다 */
  function previewBox(f, blocked) {
    if (!state.preview || !f || state.preview.path !== f.path) return null;
    if (blocked || !C.api) return null;
    var box = el('div', 'pv');
    var h = el('div', 'pv__h');
    h.appendChild(el('span', null, f.name));
    var x = el('button', 'pv__x', '닫기');
    x.type = 'button';
    x.addEventListener('click', function () { state.preview = null; draw(); });
    h.appendChild(x);
    box.appendChild(h);

    if (!canPreview(f.path)) {
      box.appendChild(el('p', 'pv__no', '이 형식은 브라우저에서 펴 볼 수 없습니다.'));
      return box;
    }
    var fr = document.createElement('iframe');
    fr.src = fileUrl(f.path);
    fr.setAttribute('title', f.name);
    // ★ 산출물 안의 스크립트를 이 화면 권한으로 돌리지 않는다
    fr.setAttribute('sandbox', '');
    box.appendChild(fr);
    return box;
  }

  /** 배포 차단 — **목록보다 위**에 둔다. 아래에 두면 파일만 보고 내보낸다 */
  function blocker(d) {
    if (!(d.distribution && d.distribution.blocked)) return null;
    var box = el('div', 'block');
    add(box, el('div', 'block__t', '배포가 막혀 있습니다'));
    box.appendChild(el('p', null,
      '파일은 만들어졌지만 검증을 통과하지 못했습니다. 내려받기도 열리지 않습니다.'));
    var ul = el('ul');
    (d.distribution.reasons || []).forEach(function (r) {
      ul.appendChild(el('li', null, typeof r === 'string' ? r : (r && (r.message || r.id)) || ''));
    });
    if (ul.childNodes.length) box.appendChild(ul);
    return box;
  }

  function docRow(f, blocked, picked) {
    var row = el('div', 'doc ' + (f.exists ? 'doc--out' : 'doc--wait')
      + (picked ? ' doc--on' : ''));
    if (f.exists) {
      // ★ 줄을 눌러 고른다. 위 네 갈래가 **이 문서**에 대고 동작한다
      row.setAttribute('role', 'button');
      row.tabIndex = 0;
      row.setAttribute('aria-pressed', picked ? 'true' : 'false');
      var pick = function (ev) {
        // 내려받기 링크를 누른 것은 고르기가 아니다 — 그대로 내려받게 둔다
        if (ev.target && ev.target.closest && ev.target.closest('a')) return;
        state.pickedPath = f.path;
        state.said = null;
        state.preview = null;   // 다른 문서를 골랐는데 앞 문서가 펴져 있으면 헷갈린다
        draw();
      };
      row.addEventListener('click', pick);
      row.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick(ev); }
      });
    }
    var b = el('div', 'doc__b');
    add(b, el('div', 'doc__n', f.name));

    if (f.exists) {
      add(b, el('div', 'doc__m', f.path + ' · ' + size(f.bytes) + (f.at ? ' · ' + f.at.slice(0, 16).replace('T', ' ') : '')));
    } else {
      add(b, el('div', 'doc__m', f.path));
      // ★ 이유 없이 회색이면 고장으로 읽힌다
      if (f.why) add(b, el('div', 'doc__w', f.why));
    }
    row.appendChild(b);

    if (!f.exists) {
      // ★★ **「아직」과 「여기서는 못 만든다」는 다른 말이다** 〈2026-08-21〉.
      //   운영 서버에 브라우저가 없으면 PDF 는 기다려도 안 나온다. 그것을
      //   「아직」으로 그리면 사용자는 **나올 때까지 기다린다.**
      //   서버가 `impossible` 로 말해 주면 그대로 갈라 그린다 (옛 서버는 안 준다 —
      //   그때는 지금까지처럼 둘로만 나눈다. 모르는 것을 지어내지 않는다)
      row.appendChild(f.impossible
        ? el('span', 'tag tag--maybe', '여기서는 못 만듦')
        : el('span', 'tag ' + (f.expected ? 'tag--wait' : 'tag--maybe'),
          f.expected ? '아직' : '나올 수도'));
      return row;
    }

    var a = document.createElement('a');
    a.className = 'btn';
    a.textContent = '내려받기';
    if (blocked || !C.api) {
      // 목록에서는 「차단」인데 파일은 열린다면 검증 GATE 가 아무 의미도 없다
      a.setAttribute('aria-disabled', 'true');
      a.setAttribute('title', blocked ? '배포가 막혀 있습니다' : '서버가 연결되어 있지 않습니다');
      a.href = '#';
    } else {
      a.href = C.api + '/projects/' + encodeURIComponent(state.projectId)
        + '/file?rel=' + encodeURIComponent(f.path);
      a.setAttribute('download', '');
    }
    row.appendChild(a);
    return row;
  }

  function list(d) {
    var box = document.createDocumentFragment();
    var all = d.all || d.files || [];
    var blocked = !!(d.distribution && d.distribution.blocked);

    var out = all.filter(function (f) { return f.exists; });
    var wait = all.filter(function (f) { return !f.exists && f.expected && !f.impossible; });
    // ★ 이 서버가 원리상 못 만드는 것 — 「아직」 무리에 섞지 않는다 (기다려도 안 나온다)
    var cant = all.filter(function (f) { return !f.exists && f.impossible; });
    var maybe = all.filter(function (f) { return !f.exists && !f.expected && !f.impossible; });

    if (out.length) {
      var on = pickedDoc(d);
      box.appendChild(el('div', 'grp', '나온 문서 ' + out.length + '종'));
      out.forEach(function (f) {
        box.appendChild(docRow(f, blocked, !!(on && on.path === f.path)));
      });
    }
    if (wait.length) {
      box.appendChild(el('div', 'grp', '아직 안 나온 것 ' + wait.length + '종'));
      wait.forEach(function (f) { box.appendChild(docRow(f, blocked)); });
    }
    // ★★ 못 만드는 것을 **지우지 않는다.** 지우면 「나올 수 있었다」는 사실까지
    //   사라져서, 다른 서버로 옮기면 나온다는 것을 아무도 모른다
    if (cant.length) {
      box.appendChild(el('div', 'grp', '이 서버에서는 못 만드는 것 ' + cant.length + '종'));
      cant.forEach(function (f) { box.appendChild(docRow(f, blocked)); });
    }
    // ★ 조건부는 분모 밖이지만 **목록에서 빼지 않는다** — 빼면 「없는 기능」이 된다
    if (maybe.length) {
      box.appendChild(el('div', 'grp', '이 딜에서는 안 나오는 것 ' + maybe.length + '종'));
      maybe.forEach(function (f) { box.appendChild(docRow(f, blocked)); });
    }
    return box;
  }

  /* ── 그리기 ───────────────────────────────────────────── */

  function draw() {
    view.textContent = '';
    if (!C.inTab) view.appendChild(el('h1', null, '완성 보고서'));

    // ★ 토큰이 안 실리면 색·글꼴이 통째로 빠지는데 **오류는 안 난다.**
    //   「화면이 이상하다」로 끝나지 않게 원인을 화면이 말한다
    if (F.tokensLoaded() === false) {
      var tw = el('div', 'nostyle', F.TOKENS_MISSING);
      tw.setAttribute('role', 'alert');
      // 토큰이 없는 상황이므로 var() 를 쓰지 않는다 — 인라인으로 칠한다
      tw.setAttribute('style', 'margin:0 0 14px;padding:12px 14px;border-radius:10px;background:#FFF4E5;color:#8A5A10;border:1px solid #F0DEBE;font-size:13.5px;line-height:1.6');
      view.appendChild(tw);
    }

    var a = G.access(C.session, C.requiredPlan);
    if (!a.allowed) {
      var m = G.accessMessage(a, (C.planNames || {})[C.requiredPlan] || C.requiredPlan, '완성 보고서');
      var g = el('section', 'card');
      add(g, el('h2', 'card__t', (m && m.title) || '사용할 수 없습니다'),
        el('p', 'card__d', (m && m.body) || ''));
      view.appendChild(g);
      return;
    }

    if (!C.api && !C.preload) {
      var s = el('section', 'card');
      add(s, el('h2', 'card__t', '서버가 연결되어 있지 않습니다'),
        el('p', 'card__d', '산출물 목록은 서버에서 받아 옵니다. 화면만으로는 만들 수 없습니다 — '
          + '「생성됨」을 화면이 기억해 두면 파일이 없어져도 있다고 말하기 때문입니다.'));
      view.appendChild(s);
      return;
    }

    if (!C.projectId) view.appendChild(picker());

    if (state.error) {
      view.appendChild(add(el('section', 'card'), el('p', 'msg msg--bad', state.error)));
      return;
    }
    if (!state.projectId) {
      view.appendChild(add(el('section', 'card'),
        el('p', 'msg', '프로젝트를 고르면 그 프로젝트에서 나온 문서가 여기 뜹니다.')));
      return;
    }
    if (state.loading || !state.data) {
      view.appendChild(add(el('section', 'card'),
        el('p', 'msg', state.loading ? '목록을 불러오는 중입니다…' : '목록이 없습니다.')));
      return;
    }

    var d = state.data;
    var b = blocker(d);
    if (b) view.appendChild(b);          // ★ 목록보다 위 — 파일만 보고 내보내지 않게
    // ★ 네 갈래는 **차단 안내 다음, 목록보다 먼저**다 〈2026-08-20 사용자 지시〉.
    //   차단보다 위에 두면 잠긴 단추를 먼저 보고 왜 잠겼는지를 나중에 읽는다
    view.appendChild(actions(d));
    view.appendChild(progress(d));
    view.appendChild(list(d));

    view.appendChild(el('p', 'note',
      '목록은 파일이 실제로 있는지로 판정합니다 — 「생성됨」 표시를 믿지 않습니다. '
      + '내려받기는 검증을 통과한 산출물만 열립니다.'));
  }

  /* ★ **판 지문을 화면에 보이게 남긴다** (CLAUDE.md §8). 속성만 있으면
     사진에 안 찍히고, 그러면 「이것이 그 판인가」를 가릴 수가 없다 */
  if (window.LinkPilotFlow && window.LinkPilotFlow.stampInto) {
    try { window.LinkPilotFlow.stampInto(document); } catch (_) {}
  }

  draw();
  loadProjects().then(function () {
    draw();
    return loadReports();
  }).then(draw);
})();
</script>
</body>
</html>
