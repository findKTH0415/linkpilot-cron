<title>보고서 생성 입력 · LINKPILOT</title>
<!--
  보고서 생성 입력 — 1단계. 요청문과 원본 자료를 받는다.

  ★ 지원 형식을 **올리기 전에** 알려준다. 목록은 화면에 적어 두지 않고
    GET /intake 로 받는다 (추출기가 아는 목록이 단일 출처다). 복사해 두면
    되는 줄 알고 올렸다가 추출 단계에서야 안 된다는 걸 알게 된다.

  ★ 요청문에서 뽑은 값은 '미확인'으로 표시한다. 사용자가 말했다는 것은
    문서로 확인됐다는 뜻이 아니다 — 그 구분이 이 시스템의 전부다.

  ★ 여기서 파이프라인을 돌리지 않는다. 프로젝트만 만든다.
    자료가 없는 채로 돌리면 빈 값으로 산출물이 만들어지고 비용만 나간다.
-->
<link rel="stylesheet" href="tokens.css">
<style>
:root {
  --side: 248px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.55 var(--lp-font);
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { margin: 0; }
.app { display: flex; min-height: 100%; }

.side { width: var(--side); flex: none; background: var(--surface);
  border-right: 1px solid var(--line); padding: 18px 12px 24px;
  display: flex; flex-direction: column; gap: 4px; }
.side__brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 12px; }
.side__mark { width: 34px; height: 34px; border-radius: 50%; flex: none;
  border: 2.5px solid var(--ink); display: grid; place-items: center;
  color: var(--lime); font-size: 15px; }
.side__name { font-size: 15px; font-weight: 800; }
.side__user { font-size: 12px; color: var(--ink2); }
.side__group { margin: 14px 8px 6px; font-size: 12px; font-weight: 700; color: var(--ink2); }
.nav { display: flex; align-items: center; gap: 11px; padding: 10px 12px;
  border-radius: 12px; text-decoration: none; color: var(--ink); font-size: 14.5px; }
.nav:hover { background: var(--panel); }
.nav.on { background: var(--lime-soft); color: var(--lime-deep); font-weight: 700; }
.nav__ic { width: 20px; text-align: center; font-size: 15px; opacity: .8; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 16px 26px; display: flex; align-items: center; }
.logo { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 900; }
.logo em { font-style: normal; color: var(--lime); }
.logo__mark { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--ink);
  display: grid; place-items: center; color: var(--lime); font-size: 16px; }
.head { background: var(--surface); padding: 16px 26px 14px; }
.head__row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.head__ic { width: 40px; height: 40px; border-radius: 12px; background: var(--panel);
  display: grid; place-items: center; font-size: 18px; }
.head__t { font-size: 22px; font-weight: 800; }
.head__s { font-size: 13px; color: var(--ink2); margin-top: 2px; }
.head__meta { margin-left: auto; text-align: right; font-size: 13px; color: var(--ink2); }
.head__meta b { display: block; color: var(--ink); font-weight: 700; margin-top: 2px; }
.rule { height: 3px; background: var(--lime); }
.body { padding: 20px 26px 110px; max-width: 940px; }

.gate { max-width: 560px; margin: 60px auto; background: var(--surface);
  border-radius: var(--r); padding: 40px 32px; text-align: center; }
.gate__ic { font-size: 40px; line-height: 1; }
.gate__t { font-size: 21px; font-weight: 800; margin-top: 18px; }
.gate__b { font-size: 14.5px; color: var(--ink2); margin-top: 12px; line-height: 1.7; }
.gate__cta { display: inline-block; margin-top: 24px; padding: 14px 32px;
  font-weight: 700; font-size: 15px; line-height: 1; font-family: inherit; border: 0; border-radius: 12px;
  background: var(--lime); color: var(--ink); cursor: pointer; }

.steps { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; padding: 9px 14px;
  border-radius: 999px; background: var(--panel); color: var(--ink2);
  font-size: 13px; font-weight: 600; text-decoration: none; }
.step.on { background: var(--ink); color: #fff; }
.step.done { background: var(--lime-soft); color: var(--lime-deep); }
.step__n { width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(0,0,0,.09); font-size: 11px; font-weight: 800; }
.step.on .step__n { background: rgba(255,255,255,.22); }

.card { background: var(--surface); border-radius: var(--r); padding: 22px; margin-bottom: 16px; }
.card__t { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
.card__s { font-size: 13px; color: var(--ink2); margin: 0 0 16px; line-height: 1.6; }

.f { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.f label { font-size: 12.5px; font-weight: 700; color: var(--ink2); }
.f textarea, .f select, .f input {
  font-weight: 400; font-size: 14.5px; line-height: 1.6; font-family: inherit; padding: 12px 13px; width: 100%;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
.f textarea { min-height: 92px; resize: vertical; }
.f .hint { font-size: 12.5px; color: var(--ink2); }
.f .ex { font-size: 12.5px; color: var(--lime-deep); background: var(--lime-soft);
  padding: 8px 11px; border-radius: 8px; }

/* 지원 형식 */
.fmt { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.fmt__b { border: 1px solid var(--line); border-radius: 12px; padding: 13px; }
.fmt__b.no { border-color: #F3D8D8; background: var(--bad-soft); }
.fmt__b.warn { border-color: #F0DEBE; background: var(--warn-soft); }
.fmt__t { font-size: 12.5px; font-weight: 800; margin-bottom: 7px; }
.fmt__b.no .fmt__t { color: var(--bad-ink); }
.fmt__b.warn .fmt__t { color: var(--warn-ink); }
.fmt__w { font-size: 12px; color: var(--ink2); margin: 0 0 9px; line-height: 1.55; }
.fmt__b.no .fmt__w { color: var(--bad-ink); }
.fmt__b.warn .fmt__w { color: var(--warn-ink); }
.fmt__b.warn .ext span { background: #F3E2C4; color: var(--warn-ink); }
.fmt__hint { font-size: 12px; color: var(--warn-ink); margin-top: 9px; }
.ext { display: flex; flex-wrap: wrap; gap: 5px; }
.ext span { font: 600 11.5px/1 ui-monospace, Menlo, Consolas, monospace;
  padding: 5px 8px; border-radius: 6px; background: var(--panel); color: var(--ink2); }
.fmt__b.no .ext span { background: #F7C9C9; color: var(--bad-ink); }

/* 드롭존 */
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 26px 18px;
  text-align: center; background: var(--panel); cursor: pointer; }
.drop.over { border-color: var(--lime); background: var(--lime-soft); }
.drop__t { font-size: 14.5px; font-weight: 700; }
.drop__s { font-size: 12.5px; color: var(--ink2); margin-top: 6px; }
.drop input { display: none; }

/* ── 업로드 진행 ──────────────────────────────────────────
   ★ 「다 보냈다」와 「서버가 다 읽었다」는 다른 일이다. 100%% 를 찍고 멈춰
     있으면 고장으로 읽힌다 — 단계를 나누고, 모르는 구간은 빗금으로 둔다 */
.up { margin-top: 14px; padding: 13px 15px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface); }
.up--done { border-color: var(--lime); background: var(--lime-soft); }
.up--error { border-color: var(--bad); background: var(--bad-soft); }
.up__h { display: flex; align-items: baseline; gap: 10px; }
.up__h b { font-size: 14.5px; }
.up__v { margin-left: auto; font-size: 18px; font-weight: 800;
  font-variant-numeric: tabular-nums; }
.up__v--none { font-size: 14px; font-weight: 400; color: var(--ink2); }
.up__bar { height: 10px; border-radius: 999px; background: #E1E4E8;
  margin: 10px 0 8px; overflow: hidden; }
.up__bar i { display: block; height: 100%; background: var(--lime);
  border-radius: 999px; transition: width .15s linear; }
.up__bar--none {
  background: repeating-linear-gradient(135deg, #E1E4E8 0 5px, #F3F4F6 5px 10px);
}
.up__d { margin: 0; font-size: 12.5px; color: var(--ink2); line-height: 1.6; }
.up--error .up__d { color: var(--bad-ink); }

.file { display: flex; align-items: center; gap: 11px; padding: 11px 0;
  border-top: 1px solid var(--line); }
.file:first-of-type { border-top: 0; }
.file__ic { width: 30px; height: 30px; border-radius: 8px; background: var(--panel);
  display: grid; place-items: center; font-size: 13px; flex: none; }
.file__n { font-size: 13.5px; font-weight: 600; word-break: break-all; }
.file__m { font-size: 12px; color: var(--ink2); margin-top: 2px; font-variant-numeric: tabular-nums; }
.file__m.no { color: var(--warn-ink); }
.file__x { margin-left: auto; font-weight: 600; font-size: 12px; line-height: 1; font-family: inherit; padding: 7px 11px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink2); cursor: pointer; }

/* 1단계가 품는 자료 업로드 화면. 테두리는 한 겹만 — 카드 안이라 두 겹이면 답답하다 */
.sub-frame { margin-top: 4px; }
.sub-frame__f { width: 100%; height: 720px; border: 0; display: block; }
/* 조각(주소로 여는 페이지)에서 iframe 자리에 들어가는 안내. 앱에서는 안 쓴다 */
.sub-frame__na { border: 1px dashed var(--line); border-radius: 12px; padding: 16px 14px;
  font-size: 13px; line-height: 1.75; color: var(--ink2); background: var(--panel); }
.sub-frame__na b { color: var(--ink); }

/* 발행 주체 */
.iss-mark { width: 46px; height: 46px; border-radius: 50%; background: var(--panel);
  border: 1px solid var(--line); display: grid; place-items: center;
  font: 600 13px/1 'Times New Roman', serif; color: var(--bad-ink); overflow: hidden; }
.iss-mark img { max-width: 44px; max-height: 44px; object-fit: contain; display: block; }
.iss-logo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.iss-logo .btn2 { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.iss-logo .btn2:disabled { opacity: .5; cursor: default; }
.chk { display: flex; align-items: center; gap: 9px; font-size: 13.5px;
  color: var(--ink2); cursor: pointer; margin-top: 4px; }
.chk input { width: 16px; height: 16px; accent-color: var(--lime); }

/* 뽑힌 값 */
.seed { display: flex; align-items: baseline; gap: 9px; padding: 10px 0;
  border-top: 1px solid var(--line); flex-wrap: wrap; }
.seed:first-of-type { border-top: 0; }
.seed__k { font: 600 11.5px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--ink2); }
.seed__v { font-size: 14px; font-weight: 700; }
.seed__q { font-size: 12.5px; color: var(--ink2); }
.tag { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px;
  background: var(--warn-soft); color: var(--warn-ink); }

.note { padding: 13px 16px; border-radius: 12px; font-size: 13.5px; line-height: 1.65; margin-top: 14px; }
.note--warn { background: var(--warn-soft); color: var(--warn-ink); }
.note--bad { background: var(--bad-soft); color: var(--bad-ink); }
.note--ok { background: var(--lime-soft); color: var(--lime-deep); }
.empty { font-size: 13.5px; color: var(--ink2); padding: 8px 0; }

.actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.btn { padding: 13px 26px; font-weight: 700; font-size: 14.5px; line-height: 1; font-family: inherit; border: 0; border-radius: 12px;
  background: var(--lime); color: var(--ink); cursor: pointer; text-decoration: none;
  display: inline-block; }
.btn:disabled { background: var(--panel); color: var(--ink2); cursor: not-allowed; }
.btn--ghost { background: var(--surface); border: 1px solid var(--line); color: var(--ink2); }
.btn:focus-visible, .drop:focus-visible, .file__x:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.why { font-size: 13px; color: var(--ink2); }

@media (max-width: 900px) {
  .side { display: none; }
  .top, .head { padding-left: 16px; padding-right: 16px; }
  .body { padding: 16px 16px 110px; }
  .head__t { font-size: 19px; }
  .btn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
/**
 * 설정 — 서버가 로그인 세션을 보고 내려주는 것이 정석이다.
 * 화면에 박아 두면 사람이 바뀔 때마다 파일을 고쳐야 한다.
 */
window.LINKPILOT_INTAKE = {
  api: null,                       // 예: '/api/linkpilot'
  session: { authenticated: true, planId: 'pro', status: 'active', name: '' },
};
</script>
<!-- 부모(앱)가 채운 설정을 받아 병합한다. 단독으로 열면 아무 일도 하지 않는다 -->
<script src="embed-bridge.js" data-lp-global="LINKPILOT_INTAKE"></script>
<script>
(function () {
  'use strict';

  var UP = window.LinkPilotUpload;

  var C = window.LINKPILOT_INTAKE;
  var Gate = window.LinkPilotGate;
  if (!Gate) throw new Error('gate-core.js 가 필요하다');

  var body = document.getElementById('body');
  var meta = document.getElementById('meta');

  /**
   * ★★★ **어느 칸을 펴는가** 〈2026-08-22 사용자 지시 — 단계 다섯〉.
   *
   *   1 제작 기본정보 입력(`issuer`) · 2 무엇을 만들까요?(`ask`) ·
   *   3 관련자료 업로드(`files`) 는 **이 한 화면의 서로 다른 칸**이다.
   *   `?part=` 가 없으면(따로 열었을 때) 셋을 다 편다.
   *
   * ★ 셋을 오갈 때 화면이 다시 실린다. 그래서 **적어 둔 것을 브라우저에
   *   저장**한다 — 없으면 2단계를 보고 온 사이에 요청문이 사라지고,
   *   사용자는 **자기가 지운 줄 안다.** 파일은 저장하지 못하지만(브라우저가
   *   파일 자체를 넘겨주지 않는다) 파일은 3단계에서 고르고 그 자리에서 올리므로
   *   오가는 일이 없다.
   */
  var PART = null;
  var DRAFT = 'lp.intake.draft';

  function saveDraft() {
    try {
      window.localStorage.setItem(DRAFT, JSON.stringify({
        request: state.request, assetType: state.assetType,
        issuerAsDefault: state.issuerAsDefault,
      }));
    } catch (_) { /* 사생활 창·저장 차단 — 초안만 못 남길 뿐 화면은 그대로 돈다 */ }
  }

  function loadDraft() {
    try {
      var d = JSON.parse(window.localStorage.getItem(DRAFT) || 'null');
      if (!d) return;
      if (typeof d.request === 'string') state.request = d.request;
      if (typeof d.assetType === 'string') state.assetType = d.assetType;
      if (typeof d.issuerAsDefault === 'boolean') state.issuerAsDefault = d.issuerAsDefault;
    } catch (_) {}
  }

  function clearDraft() {
    try { window.localStorage.removeItem(DRAFT); } catch (_) {}
  }

  var state = {
    info: null,          // GET /intake 응답 (자산유형·지원 형식·한도)
    loadError: null,
    request: '',
    assetType: '',       // 빈 값 = 자동 판별
    issuer: null,        // 발행 주체 (GET /intake 로 채운다)
    issuerAsDefault: false,
    files: [],           // { name, size, readable, note, data }
    created: null,       // POST /projects 응답
    uploaded: null,      // POST /sources 응답
    upload: null,        // { phase, sent, total, pct, files, error } — 진행 바
    busy: false,
    error: null,
  };

  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (x !== undefined && x !== null && x !== '') n.textContent = String(x);
    return n;
  }
  function add(p) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) p.appendChild(arguments[i]); return p; }
  function mb(n) { return Math.round(n / (1024 * 1024) * 10) / 10; }
  /** 사람이 읽는 크기 — 작은 파일이 전부 '0MB' 로 보이면 올라갔는지 알 수 없다 */
  function size(n) {
    if (n < 1024) return n + 'B';
    if (n < 1024 * 1024) return Math.round(n / 1024) + 'KB';
    return mb(n) + 'MB';
  }

  /**
   * 다음 단계 주소. **지금 화면이 받은 `api` 를 그대로 물려준다.**
   *
   * ★ 안 물려주면 다음 화면이 서버를 모르는 채로 열린다. 그리고 `reports.html`
   *   은 api 가 없으면 **데모 데이터**를 쓰므로, 앱 안에서 가짜 산출물이
   *   진짜처럼 보일 수 있다.
   */
  function stepUrl(file, projectId, part) {
    var here = new URLSearchParams(window.location.search);
    var qs = [];
    if (part) qs.push('part=' + encodeURIComponent(part));
    var api = here.get('api') || (typeof C.api === 'string' ? C.api : null);
    if (api) qs.push('api=' + encodeURIComponent(api));
    if (projectId) qs.push('project=' + encodeURIComponent(projectId));
    return file + (qs.length ? '?' + qs.join('&') : '');
  }

  /* ── 서버 ─────────────────────────────────────────────── */

  function call(method, p, payload) {
    if (!C.api) return Promise.reject(new Error('API 주소가 설정되지 않았습니다'));
    var o = { method: method, headers: {}, credentials: 'same-origin' };
    if (payload) { o.headers['content-type'] = 'application/json'; o.body = JSON.stringify(payload); }
    return fetch(C.api + p, o).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  function load() {
    // 미리보기: 서버 없이 화면을 보기 위해 접수 정보를 미리 심어 둔 경우.
    // ★ 값을 지어내지 않는다 — 빌드 시점에 서버가 보낼 것과 같은 값을 넣는다
    if (C.preload) { state.info = C.preload; adoptIssuer(); state.loadError = null; return render(); }
    if (!C.api) { state.loadError = 'API 주소가 설정되지 않았습니다'; return render(); }
    call('GET', '/intake').then(function (j) {
      state.info = j; adoptIssuer(); state.loadError = null; render();
    }).catch(function (e) {
      // ★ 못 가져온 것과 없는 것을 구분한다. 지원 형식을 모르는 채로 올리게 두지 않는다
      state.loadError = e.message; render();
    });
  }

  /**
   * 서버가 준 발행 주체를 폼에 채운다.
   * ★ 미설정이면 '발행 주체 미설정'이라는 문구를 회사명 칸에 넣지 않는다 —
   *   그대로 저장하면 그 문구가 회사명이 되어 IM 에 찍힌다
   */
  function adoptIssuer() {
    var i = (state.info && state.info.issuer) || null;
    state.issuer = (i && !i.unset)
      ? { en: i.en || '', kr: i.kr || '', tag: i.tag || '', mark: i.mark || '', logo: i.logo || '' }
      : { en: '', kr: '', tag: '', mark: '', logo: '' };
  }

  /**
   * 확장자로 읽을 수 있는지 판정.
   *
   * ★ **서버가 준 `formats` 묶음만 본다.** 전에는 `supported.text`·`supported.office`
   *   둘만 봤는데, 그 둘에는 pdf·hwp·doc·이미지가 없다 — 읽을 수 있는 파일까지
   *   전부 「처음 보는 형식입니다」로 표시됐다 (앱 실측: PDF·PNG 가 그렇게 떴다).
   *   읽히는 파일을 못 읽는다고 말하면 사용자는 아예 안 올린다.
   * ★ 묶음 목록을 화면에 적어 두지 않는다 — 형식이 늘면 서버만 고치면 된다.
   */
  function readableOf(name) {
    var i = String(name).lastIndexOf('.');
    var ext = i === -1 ? '' : String(name).slice(i).toLowerCase();
    var groups = state.info && state.info.formats;
    if (!groups || !groups.length) return { readable: null, note: null };

    for (var g = 0; g < groups.length; g++) {
      if ((groups[g].ext || []).indexOf(ext) === -1) continue;
      var grp = groups[g];
      if (grp.id === 'convert') {
        return {
          readable: false,
          note: (grp.hint && grp.hint[ext]) || '변환해서 올려야 합니다',
        };
      }
      // 읽는 방법이 정해져 있으면 읽는 것이다. 방법 이름을 그대로 보여 준다
      return {
        readable: true,
        note: grp.id === 'direct' ? null : grp.label,
        needsKey: grp.needsKey || null,
      };
    }
    return { readable: false, note: '처음 보는 형식입니다 — 본문을 읽지 못할 수 있습니다' };
  }

  function addFiles(list) {
    var max = (state.info && state.info.maxBytesPerFile) || Infinity;
    Array.prototype.forEach.call(list, function (f) {
      if (state.files.some(function (x) { return x.name === f.name; })) return;
      var v = readableOf(f.name);
      var rec = { name: f.name, size: f.size, readable: v.readable, note: v.note, data: null, tooBig: f.size > max };
      state.files.push(rec);
      // ★ 읽기·보내기는 upload-core.js 한 곳에 있다 — 화면마다 따로 쓰면 갈린다
      UP.readOne(f, function (err, data) {
        if (err) { rec.error = err.message; } else { rec.data = data; }
        render();
      });
    });
    render();
  }

  function createProject() {
    if (state.busy) return;
    state.busy = true; state.error = null; render();
    call('POST', '/projects', {
      request: state.request,
      assetType: state.assetType || undefined,
      // 회사명을 적었을 때만 보낸다. 빈 값을 보내면 서버가 거부한다
      issuer: (state.issuer && state.issuer.en.trim()) ? state.issuer : undefined,
      issuerAsDefault: state.issuerAsDefault || undefined,
    }).then(function (j) {
      state.created = j; state.busy = false; clearDraft(); render();
      /* ★ 2026-08-16 — 부모(report-flow)에 알린다. 부모는 자식 URL 의 ?project= 로만 프로젝트를
         알아채는데, 여기서 만든 프로젝트는 URL 에 없다 → 2~4단계가 영원히 「1단계에서 프로젝트를
         먼저 만듭니다」로 잠겨 있었다(앱 실측). 같은 출처에만 보낸다. */
      try {
        if (window.parent !== window && j && j.projectId)
          window.parent.postMessage({ type: 'lp-flow-project', projectId: j.projectId }, window.location.origin);
      } catch (_) {}
      if (state.files.length) uploadFiles();
    }).catch(function (e) {
      state.busy = false; state.error = e.message; render();
    });
  }

  /**
   * 자료를 올린다.
   *
   * ★ 올리는 방법 자체는 `upload-core.js` 에 있다 — 「자료 업로드」탭도 같은 것을
   *   쓴다. 화면마다 따로 쓰면 한쪽만 고쳐지는 날이 오고, 그때 다른 쪽은
   *   **옛 방식으로 조용히 계속 돈다.**
   *
   * ★ 여기서는 그 결과를 **이 화면의 말로** 옮기기만 한다.
   */
  function uploadFiles() {
    var ready = state.files.filter(function (f) { return f.data && !f.tooBig; });
    if (!ready.length || !state.created) return;

    state.busy = true;
    UP.send({
      url: C.api + '/projects/' + state.created.projectId + '/sources',
      files: ready.map(function (f) { return { name: f.name, contentBase64: f.data }; }),
      onUpdate: function (u) { state.upload = u; render(); },
      onDone: function (j) { state.busy = false; state.uploaded = j; render(); },
      onFail: function (why) { state.busy = false; state.error = why; render(); },
    });
  }

  /** 진행 바 한 칸. 모르는 값은 막대가 아니라 빗금이다 */
  function progressBar(pct) {
    var bar = el('div', 'up__bar' + (pct === null || pct === undefined ? ' up__bar--none' : ''));
    if (pct !== null && pct !== undefined) {
      var i = el('i');
      i.style.width = Math.max(0, Math.min(100, pct)) + '%';
      bar.appendChild(i);
    }
    return bar;
  }

  /** 올리는 중 화면. 단계마다 **무엇을 기다리는지** 적는다 */
  function uploadCard() {
    var u = state.upload;
    if (!u) return null;
    var box = el('div', 'up up--' + u.phase);
    var head = el('div', 'up__h');
    head.appendChild(el('b', null,
      u.phase === 'sending' ? '자료를 올리는 중입니다'
        : u.phase === 'reading' ? '서버가 자료를 읽는 중입니다'
          : u.phase === 'done' ? '자료를 다 올렸습니다' : '올리지 못했습니다'));
    head.appendChild(el('span', 'up__v' + (u.pct === null || u.pct === undefined ? ' up__v--none' : ''),
      u.pct === null || u.pct === undefined ? '—' : u.pct + '%'));
    box.appendChild(head);
    box.appendChild(progressBar(u.pct));
    box.appendChild(el('p', 'up__d',
      u.phase === 'sending'
        ? ('파일 ' + u.files + '건'
          + (u.total ? ' · ' + size(u.sent) + ' / ' + size(u.total) : ' · 크기를 알 수 없습니다'))
        : u.phase === 'reading'
          ? '다 보냈습니다. 이제 서버가 파일을 열어 글자를 꺼냅니다 — 스캔본이면 더 걸립니다. '
            + '얼마나 걸릴지 알 수 없어 진행률을 만들지 않습니다.'
          : u.phase === 'done'
            ? '파일 ' + u.files + '건이 저장되었습니다.'
            : (u.error || '사유를 알 수 없습니다')));
    return box;
  }

  /* ── 그리기 ───────────────────────────────────────────── */

  /**
   * ★★★ **단계 이름을 여기서 적지 않는다** 〈2026-08-22〉. 앞 판은 넷을 손으로
   *   적어 두었는데, 단계가 다섯이 된 날 **이 줄만 옛말**이 됐다. 화면은 새
   *   차례로 도는데 레일만 옛 차례를 말하는 상태는 오류가 안 나서 안 잡힌다.
   *   `flow-core.js` 가 단일 출처다.
   */
  function steps() {
    var row = el('div', 'steps');
    var F = window.LinkPilotFlow;
    if (!F) return row;                      // 코어가 안 실렸으면 지어내지 않는다
    F.STEPS.forEach(function (st) {
      var mine = st.file === 'intake.html';
      var here = mine && (!PART || st.part === PART);
      var open = state.created ? !mine : mine;
      var n = el(open && !here ? 'a' : 'div',
        'step' + (here ? ' on' : (state.created && mine ? ' done' : '')));
      if (open && !here) n.href = stepUrl(st.file, st.needsProject ? projectId() : null, st.part);
      add(n, el('span', 'step__n', String(st.no)), el('span', null, st.name));
      row.appendChild(n);
    });
    return row;
  }

  function projectId() {
    return (state.created && state.created.projectId) || null;
  }

  /**
   * 올릴 수 있는 자료.
   *
   * ★ 목록을 여기 적지 않는다. 서버(02-extraction)가 아는 것을 그대로 그린다 —
   *   적어 두면 읽는 방법이 늘어난 날부터 화면만 옛말을 한다.
   */
  function formatCard() {
    var box = el('section', 'card');
    box.appendChild(el('h2', 'card__t', '올릴 수 있는 자료'));
    /* (요청 2026-08-17) 부제 문구 삭제 — 세 카드가 각각 "그대로 읽음/옮겨 읽음/변환 필요" 로 이미 말한다 */

    var i = state.info;
    var groups = i.formats || [];
    var g = el('div', 'fmt');

    groups.forEach(function (grp) {
      if (!grp.ext || !grp.ext.length) return;
      var cls = 'fmt__b' + (grp.id === 'convert' ? ' no' : (grp.id === 'scan' ? ' warn' : ''));
      var b = el('div', cls);

      var title = grp.label;
      // ★ 키가 없으면 이 묶음은 지금 동작하지 않는다. 그 사실을 제목에 적는다 —
      //   본문 어딘가에 적으면 안 읽고 올린다
      if (grp.needsKey && i.ocrReady === false) title += ' — 지금은 꺼져 있습니다';
      b.appendChild(el('div', 'fmt__t', title));
      b.appendChild(el('p', 'fmt__w', grp.why));

      var list = el('div', 'ext');
      grp.ext.forEach(function (e) { list.appendChild(el('span', null, e)); });
      b.appendChild(list);

      if (grp.hint) {
        var lines = grp.ext.map(function (e) { return grp.hint[e] ? e + ' → ' + grp.hint[e] : null; })
          .filter(Boolean);
        // 같은 안내가 여러 확장자에 붙으면 한 번만 적는다
        var seen = {};
        lines = lines.filter(function (t) {
          var body = t.slice(t.indexOf('→'));
          if (seen[body]) return false;
          seen[body] = 1; return true;
        });
        lines.forEach(function (t) { b.appendChild(el('div', 'fmt__hint', t)); });
      }
      if (grp.needsKey && i.ocrReady === false) {
        b.appendChild(el('div', 'fmt__hint',
          '서버에 ' + grp.needsKey + ' 가 없어 옮겨 적기가 꺼져 있습니다. '
          + '지금 올리면 보관만 되고 수치는 뽑히지 않습니다.'));
      }
      g.appendChild(b);
    });

    box.appendChild(g);
    box.appendChild(el('div', 'note note--warn',
      'PDF·한글(HWP)은 본문을 그대로 읽습니다. 글자가 없는 스캔본은 글자로 옮겨서 읽고, '
      + '그렇게 뽑은 값은 신뢰도를 낮춰 「원본 확인」 표시를 붙입니다. '
      + '파일 하나 ' + mb(i.maxBytesPerFile) + 'MB · 한 번에 ' + mb(i.maxBytesPerRequest) + 'MB 까지.'));
    return box;
  }

  function requestCard() {
    var box = el('section', 'card');
    box.appendChild(el('h2', 'card__t', '무엇을 만들까요'));
    box.appendChild(el('p', 'card__s',
      '한 줄로 적어 주세요. 용량·지역·자산유형을 알아서 뽑아내지만, '
      + '뽑은 값은 문서로 확인된 것이 아니라 미확인으로 표시됩니다.'));

    var f1 = el('div', 'f');
    f1.appendChild(el('label', null, '요청문'));
    var ta = el('textarea');
    ta.value = state.request;
    ta.placeholder = '예: 인천 남동공단 6.5MW 데이터센터 개발사업 IM 작성';
    ta.setAttribute('aria-label', '요청문');
    ta.disabled = !!state.created;
    ta.addEventListener('input', function () {
      state.request = ta.value;
      saveDraft();   /* ★ 단계를 오가도 남아 있어야 한다 */
      var b = document.getElementById('go');
      if (b) b.disabled = !canGo();
    });
    f1.appendChild(ta);
    box.appendChild(f1);

    var f2 = el('div', 'f');
    f2.appendChild(el('label', null, '자산유형'));
    var sel = el('select');
    sel.setAttribute('aria-label', '자산유형');
    sel.disabled = !!state.created;
    var auto = el('option', null, '자동 판별 (요청문에서 정합니다)');
    auto.value = '';
    sel.appendChild(auto);
    (state.info.assetTypes || []).forEach(function (t) {
      var o = el('option', null, t.label); o.value = t.id; sel.appendChild(o);
    });
    sel.value = state.assetType;
    sel.addEventListener('change', function () { state.assetType = sel.value; saveDraft(); });
    f2.appendChild(sel);
    f2.appendChild(el('div', 'hint', '자산유형에 따라 재무모델 템플릿과 프로젝트 번호가 정해집니다 (예: LP-DC-2026-001).'));
    box.appendChild(f2);
    return box;
  }

  /**
   * 발행 주체 — IM 서명부·표지에 찍히는 회사다.
   *
   * ★ 사전(dictionary) 항목이 아니라 설정이다. 그래서 [가이드 필드 입력]이 아니라
   *   여기에 있다 — 사전에 없는 key 는 보고서 본문에 들어가지 못한다.
   * ★ 안 넣으면 문서에 '발행 주체 미설정'이 찍히고 승인 게이트가 배포를 막는다.
   *   비워 두고 넘어갈 수는 있지만, 그 상태로는 대외 배포가 안 된다.
   */
  function issuerCard() {
    var box = el('section', 'card');
    box.appendChild(el('h2', 'card__t', '발행 주체'));
    box.appendChild(el('p', 'card__s',
      'IM 표지와 서명부에 찍히는 회사입니다. 비워 두면 문서에 「발행 주체 미설정」이 '
      + '표시되고 대외 배포가 막힙니다.'));

    var lim = (state.info && state.info.issuerLimits) || {};
    var cur = (state.info && state.info.issuer) || {};
    var iss = state.issuer;

    function field(key, label, hint, ph) {
      var f = el('div', 'f');
      f.appendChild(el('label', null, label));
      var inp = el('input');
      inp.type = 'text';
      inp.value = iss[key] || '';
      inp.placeholder = ph || '';
      if (lim[key]) inp.maxLength = lim[key];
      inp.setAttribute('aria-label', label);
      inp.disabled = !!state.created;
      inp.addEventListener('input', function () {
        iss[key] = inp.value;
        // 이니셜은 회사명에서 자동으로 만든다 (직접 적으면 그것을 쓴다)
        var m = document.getElementById('iss-mark');
        if (m && !iss.logo) m.textContent = autoMark(iss.en) || '—';
        var w = document.getElementById('iss-warn');
        if (w) w.hidden = !!iss.en.trim();
      });
      f.appendChild(inp);
      if (hint) f.appendChild(el('div', 'hint', hint));
      return f;
    }

    box.appendChild(field('en', '회사명 (영문) *', '서명부 첫 줄. 대외 문서에 그대로 나갑니다.',
      '예: Acme Capital Partners Co.,Ltd'));
    box.appendChild(field('kr', '국문 상호', '없으면 그 줄을 만들지 않습니다.', '예: (주)에이스캐피탈파트너스'));
    box.appendChild(field('tag', '태그라인', '대문자로 표시됩니다.', '예: REAL ASSET INVESTMENT'));
    /* ★ 로고 업로드 (요청 2026-08-16) — 이니셜 입력란을 없애고 **제출자 로고 이미지**를 받는다.
       보고서 표지·서명부의 로고 자리에 이 그림이 찍힌다. 로고가 없으면 회사명 이니셜로 폴백(자동, 입력 안 받음).
       PNG·JPG·SVG · 200KB — 규칙은 서버 core/issuer.js(logoFrom) 와 같고, 서버가 최종 판정한다.
       파일이 아니라 data URL 로 보내는 이유: issuer.json 하나에 남아 프로젝트 폴더와 함께 움직인다. */
    var prev = el('div', 'f');
    prev.appendChild(el('label', null, '로고 (보고서 표지·서명부에 찍힙니다)'));
    var row = el('div', 'iss-logo');
    var mark = el('div', 'iss-mark');
    mark.id = 'iss-mark';
    var drawMark = function () {
      mark.textContent = '';
      if (iss.logo) { var im = document.createElement('img'); im.src = iss.logo; im.alt = '로고'; mark.appendChild(im); }
      else mark.textContent = autoMark(iss.en) || '—';
    };
    drawMark();
    row.appendChild(mark);
    /* ★ 로고 자동 정규화 (요청 2026-08-17) — 사용자마다 로고 파일이 제각각이다(4000px 원본, HEIC, WebP,
       여백 큰 캔버스, 5MB JPG). 형식·크기 밖이면 거부하던 것을 **받아서 맞춘다**로 바꿨다:
         ① 브라우저가 디코드할 수 있는 모든 이미지를 받는다(HEIC 등 못 읽는 것만 사유와 함께 거부)
         ② 투명/흰 여백을 자동으로 잘라 로고 자체가 꽉 차게(스캔·캔버스 여백 제거)
         ③ 긴 변 512px 로 축소(표지·서명부 44px 자리에 충분, 인쇄 2x 도 여유)
         ④ 투명이 있으면 PNG, 없으면 JPEG — 200KB 이하가 될 때까지 품질을 낮춘다
         ⑤ 서버 규칙(core/issuer.js: PNG/JPG/SVG · 200KB)은 그대로 — 여기서 맞춰 보내므로 거부될 일이 없다
       SVG 는 벡터라 그대로 둔다(200KB 넘으면 거부 — 그런 SVG 는 로고가 아니라 도면이다).
       실패는 사유를 말한다 — "읽지 못했습니다" 하나로 뭉치면 무엇을 고쳐야 할지 모른다. */
    var file = el('input'); file.type = 'file'; file.accept = 'image/*'; file.hidden = true;
    var up = el('button', 'btn2', iss.logo ? '로고 바꾸기' : '로고 업로드'); up.type = 'button'; up.disabled = !!state.created;
    var rm = el('button', 'btn2', '제거'); rm.type = 'button'; rm.disabled = !!state.created || !iss.logo;
    var msg = el('div', 'hint', iss.logo ? '로고가 들어 있습니다.' : '없으면 회사명 이니셜(' + (autoMark(iss.en) || '—') + ')이 대신 찍힙니다. 어떤 크기든 올리면 자동으로 맞춥니다.');
    up.addEventListener('click', function () { file.click(); });

    var LOGO_MAX_BYTES = 200 * 1024, LOGO_MAX_EDGE = 512;
    function readAsDataUrl(f) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result || '')); }; r.onerror = function () { rej(new Error('파일을 읽을 수 없습니다 (권한·손상 여부 확인)')); }; r.readAsDataURL(f); }); }
    function loadImage(src) { return new Promise(function (res, rej) { var im = new Image(); im.onload = function () { res(im); }; im.onerror = function () { rej(new Error('이 브라우저가 디코드할 수 없는 이미지입니다 (HEIC·TIFF 등은 PNG/JPG 로 바꿔 올리세요)')); }; im.src = src; }); }
    /* 여백 트림 — 알파 0 이거나 거의 흰색(RGB 모두 245 이상)인 테두리를 잘라낸다. 여백이 곧 로고인 경우를 대비해 8px 는 남긴다 */
    function trimBox(ctx, w, h) {
      var d = ctx.getImageData(0, 0, w, h).data, minX = w, minY = h, maxX = -1, maxY = -1;
      for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
        var i = (y * w + x) * 4, a = d[i + 3];
        var blank = a < 8 || (d[i] > 245 && d[i + 1] > 245 && d[i + 2] > 245);
        if (!blank) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
      }
      if (maxX < 0) return null;                          // 전부 여백 = 빈 이미지
      var pad = 8;
      return { x: Math.max(0, minX - pad), y: Math.max(0, minY - pad), w: Math.min(w, maxX + pad + 1) - Math.max(0, minX - pad), h: Math.min(h, maxY + pad + 1) - Math.max(0, minY - pad) };
    }
    function hasAlpha(ctx, w, h) { var d = ctx.getImageData(0, 0, w, h).data; for (var i = 3; i < d.length; i += 4 * 7) if (d[i] < 250) return true; return false; }
    async function normalizeLogo(f) {
      if (f.type === 'image/svg+xml' || /\.svg$/i.test(f.name)) {
        if (f.size > LOGO_MAX_BYTES) throw new Error('SVG 가 ' + Math.round(f.size / 1024) + 'KB 입니다 — 200KB 이하 SVG 또는 PNG 로 올려 주세요');
        return { dataUrl: await readAsDataUrl(f), note: 'SVG · ' + Math.round(f.size / 1024) + 'KB (벡터 그대로)' };
      }
      var im = await loadImage(await readAsDataUrl(f));
      var w = im.naturalWidth, h = im.naturalHeight;
      if (!w || !h) throw new Error('이미지 크기를 알 수 없습니다');
      var c = document.createElement('canvas'), ctx = c.getContext('2d');
      c.width = w; c.height = h; ctx.drawImage(im, 0, 0);
      var box = trimBox(ctx, w, h);
      if (!box) throw new Error('빈 이미지입니다 (전부 여백)');
      var scale = Math.min(1, LOGO_MAX_EDGE / Math.max(box.w, box.h));
      var ow = Math.max(1, Math.round(box.w * scale)), oh = Math.max(1, Math.round(box.h * scale));
      var o = document.createElement('canvas'), octx = o.getContext('2d');
      o.width = ow; o.height = oh; octx.imageSmoothingQuality = 'high';
      octx.drawImage(c, box.x, box.y, box.w, box.h, 0, 0, ow, oh);
      var alpha = hasAlpha(octx, ow, oh);
      var out = alpha ? o.toDataURL('image/png') : o.toDataURL('image/jpeg', 0.92);
      var bytes = function (u) { return Math.floor((u.split(',')[1] || '').length * 3 / 4); };
      var q = 0.92, edge = LOGO_MAX_EDGE;
      /* 200KB 넘으면: 사진형은 품질을, 투명형은 변 길이를 줄여 가며 맞춘다 */
      while (bytes(out) > LOGO_MAX_BYTES && (q > 0.4 || edge > 128)) {
        if (!alpha && q > 0.4) { q -= 0.1; out = o.toDataURL('image/jpeg', q); continue; }
        edge = Math.round(edge * 0.8); var s2 = Math.min(1, edge / Math.max(box.w, box.h));
        o.width = Math.max(1, Math.round(box.w * s2)); o.height = Math.max(1, Math.round(box.h * s2));
        octx = o.getContext('2d'); octx.imageSmoothingQuality = 'high'; octx.drawImage(c, box.x, box.y, box.w, box.h, 0, 0, o.width, o.height);
        out = alpha ? o.toDataURL('image/png') : o.toDataURL('image/jpeg', q);
      }
      if (bytes(out) > LOGO_MAX_BYTES) throw new Error('200KB 로 줄이지 못했습니다 — 더 단순한 로고 파일로 올려 주세요');
      var trimmed = (box.w < w - 16 || box.h < h - 16);
      return { dataUrl: out, note: f.name + ' → ' + o.width + '×' + o.height + (alpha ? ' PNG' : ' JPG') + ' · ' + Math.round(bytes(out) / 1024) + 'KB' + (trimmed ? ' · 여백 자동 제거' : '') + (scale < 1 ? ' · 자동 축소' : '') };
    }
    file.addEventListener('change', function () {
      var f = file.files && file.files[0]; file.value = '';
      if (!f) return;
      msg.textContent = '읽는 중… (' + Math.round(f.size / 1024) + 'KB)';
      up.disabled = true;
      normalizeLogo(f).then(function (r) {
        iss.logo = r.dataUrl; drawMark(); up.textContent = '로고 바꾸기'; rm.disabled = false; msg.textContent = r.note;
      }).catch(function (e) {
        msg.textContent = (e && e.message) || '로고를 처리하지 못했습니다';
      }).then(function () { up.disabled = !!state.created; });
    });
    rm.addEventListener('click', function () { iss.logo = ''; drawMark(); up.textContent = '로고 업로드'; rm.disabled = true; msg.textContent = '없으면 회사명 이니셜(' + (autoMark(iss.en) || '—') + ')이 대신 찍힙니다.'; });
    row.appendChild(up); row.appendChild(rm); row.appendChild(file);
    prev.appendChild(row); prev.appendChild(msg);
    box.appendChild(prev);

    var chk = el('label', 'chk');
    var cb = el('input');
    cb.type = 'checkbox';
    cb.checked = !!state.issuerAsDefault;
    cb.disabled = !!state.created;
    cb.addEventListener('change', function () { state.issuerAsDefault = cb.checked; saveDraft(); });
    chk.appendChild(cb);
    chk.appendChild(el('span', null, '앞으로 만드는 보고서에도 이 주체를 씁니다'));
    box.appendChild(chk);

    if (state.info && state.info.issuerError) {
      box.appendChild(el('div', 'note note--bad',
        '저장된 발행 주체 설정을 읽지 못했습니다 — ' + state.info.issuerError));
    } else if (cur.unset) {
      var w = el('div', 'note note--warn', '아직 설정된 발행 주체가 없습니다. 지금 넣어 두면 다음부터 자동으로 채워집니다.');
      w.id = 'iss-warn';
      w.hidden = !!(iss.en && iss.en.trim());
      box.appendChild(w);
    } else {
      box.appendChild(el('div', 'note note--ok',
        '현재 설정: ' + cur.en + (cur.source ? ' (' + cur.source + ')' : '')));
    }
    return box;
  }

  /** 화면에서도 이니셜을 미리 보여준다 (규칙은 서버 core/issuer.js 와 같다) */
  function autoMark(name) {
    var s = String(name || '').trim();
    if (!s) return '';
    var words = s.replace(/[(주)㈜]/g, ' ').split(/[\s,.]+/).filter(Boolean);
    if (words.length === 1) return words[0].slice(0, 4).toUpperCase();
    return words.slice(0, 4).map(function (w) { return w[0]; }).join('').toUpperCase();
  }

  /**
   * **자료 업로드 — 탭이 아니라 여기 있다** 〈2026-08-22 사용자 지시〉.
   *
   * ★★ 화면을 **베끼지 않는다.** `files.html` 을 그대로 품는다. 세 갈래
   *   (LinkPilot 프로젝트에서 가져오기 · 폴더를 연결해서 · 파일업로드)와 한도·
   *   합계·스캔이 전부 그 화면에 있다. 베끼면 한쪽만 고치는 날이 오고, 그때
   *   사용자는 **같은 기능이 자리마다 다르게 도는 것**을 본다.
   *
   * ★ 높이는 안쪽이 알려 준다(`embed-bridge.js` 의 `lp-embed-height`). 안 들으면
   *   iframe 이 잘린 채로 남는다 — 목록이 길어질수록 더 잘린다.
   * ★ 못 품는 자리가 있다(파일로 열었을 때 등). 그때는 **조용히 비우지 않고**
   *   그 화면으로 가는 길을 글자로 준다.
   */
  function filesFrame() {
    var FLOW = window.LinkPilotFlow;
    var file = (FLOW && FLOW.FILES_SECTION && FLOW.FILES_SECTION.file) || 'files.html';
    var wrap = el('div', 'sub-frame');
    var fr = document.createElement('iframe');
    fr.className = 'sub-frame__f';
    fr.title = '자료 업로드';
    fr.loading = 'lazy';
    var q = [];
    if (C.api) q.push('api=' + encodeURIComponent(C.api));
    if (state.created && state.created.projectId) {
      q.push('project=' + encodeURIComponent(state.created.projectId));
    }
    fr.src = file + (q.length ? '?' + q.join('&') : '');
    wrap.appendChild(fr);

    /* 안쪽이 알려 주는 높이에 맞춘다 — 한 번만 듣는다 */
    if (!filesFrame.wired) {
      filesFrame.wired = true;
      window.addEventListener('message', function (ev) {
        var d = ev.data;
        if (!d || d.type !== 'lp-embed-height' || !(d.height > 0)) return;
        var f = document.querySelector('.sub-frame__f');
        if (f) f.style.height = Math.max(320, d.height + 8) + 'px';
      });
    }
    return wrap;
  }

  function dropCard() {
    var box = el('section', 'card');
    box.appendChild(el('h2', 'card__t', '자료 업로드'));
    box.appendChild(el('p', 'card__s',
      '사업계획서·기술제안서·재무자료 등. 모든 수치는 여기서 뽑고 출처로 기록됩니다. '
      + '나중에 추가로 올릴 수도 있습니다.'));
    box.appendChild(filesFrame());
    return box;
  }

  /** 예전 판의 1회성 올리기 칸. 자료 업로드 화면이 같은 일을 더 잘 한다 */
  function dropCardLegacy() {
    var box = el('section', 'card');
    box.appendChild(el('h2', 'card__t', '자료 업로드'));
    box.appendChild(el('p', 'card__s',
      '사업계획서·기술제안서·재무자료 등. 모든 수치는 여기서 뽑고 출처로 기록됩니다. '
      + '나중에 추가로 올릴 수도 있습니다.'));

    var drop = el('div', 'drop');
    drop.tabIndex = 0;
    drop.setAttribute('role', 'button');
    drop.setAttribute('aria-label', '자료 선택 또는 끌어다 놓기');
    add(drop,
      el('div', 'drop__t', '파일을 끌어다 놓거나 눌러서 고르세요'),
      el('div', 'drop__s', '여러 개를 한 번에 올릴 수 있습니다'));
    var input = el('input');
    input.type = 'file';
    input.multiple = true;
    input.addEventListener('change', function () { addFiles(input.files); input.value = ''; });
    drop.appendChild(input);
    drop.addEventListener('click', function () { input.click(); });
    drop.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); input.click(); }
    });
    ['dragenter', 'dragover'].forEach(function (t) {
      drop.addEventListener(t, function (ev) { ev.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (t) {
      drop.addEventListener(t, function (ev) { ev.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (ev) {
      if (ev.dataTransfer && ev.dataTransfer.files) addFiles(ev.dataTransfer.files);
    });
    box.appendChild(drop);

    if (state.files.length) {
      var list = el('div');
      list.style.marginTop = '14px';
      state.files.forEach(function (f, idx) {
        var row = el('div', 'file');
        row.appendChild(el('div', 'file__ic', f.readable ? '✓' : '!'));
        var mid = el('div');
        mid.appendChild(el('div', 'file__n', f.name));
        var m = size(f.size);
        if (f.tooBig) m += ' · 한도를 넘어 올릴 수 없습니다';
        else if (!f.data) m += ' · 읽는 중…';
        else if (f.note) m += ' · ' + f.note;
        mid.appendChild(el('div', 'file__m' + (f.readable ? '' : ' no'), m));
        row.appendChild(mid);
        if (!state.created) {
          var x = el('button', 'file__x', '빼기');
          x.type = 'button';
          x.addEventListener('click', function () { state.files.splice(idx, 1); render(); });
          row.appendChild(x);
        }
        list.appendChild(row);
      });
      box.appendChild(list);
    }
    return box;
  }

  function canGo() {
    return !!C.api && state.request.trim().length >= 5 && !state.busy && !state.created;
  }

  function actionsRow() {
    var row = el('div', 'actions');
    var go = el('button', 'btn', state.busy ? '올리는 중…' : '자료올리기 완료');   /* (요청 2026-08-17) '프로젝트 만들기' → 사용자 관점 동사로 */
    go.id = 'go';
    go.type = 'button';
    go.disabled = !canGo();
    go.addEventListener('click', createProject);
    row.appendChild(go);

    if (!C.api) row.appendChild(el('span', 'why', 'API 주소가 없어 만들 수 없습니다'));
    else if (state.request.trim().length < 5) row.appendChild(el('span', 'why', '요청문을 한 줄 적어 주세요'));
    return row;
  }

  function resultCard() {
    var box = el('section', 'card');
    box.appendChild(el('h2', 'card__t', '만들어졌습니다'));

    var c = state.created;
    box.appendChild(el('div', 'note note--ok',
      c.projectId + ' · ' + c.name + ' (' + c.templateId + ') — ' + c.at));

    if (c.seeded && c.seeded.length) {
      box.appendChild(el('p', 'card__s',
        '요청문에서 아래 값을 뽑았습니다. 문서로 확인된 값이 아니므로 전부 미확인입니다 — '
        + '가이드 필드 입력에서 출처를 붙이거나 고칠 수 있습니다.'));
      var list = el('div');
      c.seeded.forEach(function (f) {
        var row = el('div', 'seed');
        row.appendChild(el('span', 'seed__v', f.value + (f.unit ? ' ' + f.unit : '')));
        row.appendChild(el('span', 'seed__k', f.key));
        row.appendChild(el('span', 'tag', '미확인'));
        if (f.quote) row.appendChild(el('span', 'seed__q', '"' + f.quote + '"'));
        list.appendChild(row);
      });
      box.appendChild(list);
    }

    var iss = c.issuer || {};
    box.appendChild(el('div', iss.unset ? 'note note--bad' : 'note note--ok',
      iss.unset
        ? '발행 주체 미설정 — 이대로는 대외 배포가 막힙니다. 접수 화면에서 회사명을 넣으세요.'
        : '발행 주체: ' + iss.en + (c.issuerSaved ? ' (이 프로젝트에 저장됨)' : ' (기존 설정)')));

    if (state.uploaded) {
      var u = state.uploaded;
      var okN = u.saved.length;
      var noRead = u.saved.filter(function (f) { return !f.readable; }).length;
      box.appendChild(el('div', 'note note--ok',
        '자료 ' + okN + '건 저장 (' + u.at + ')'
        + (noRead ? ' · 이 중 ' + noRead + '건은 본문을 읽지 못합니다' : '')));
      (u.rejected || []).forEach(function (r) {
        box.appendChild(el('div', 'note note--bad', r.name + ' — ' + r.reason));
      });
    }
    // 「올리는 중」은 위의 진행 바가 말한다 — 두 곳에서 말하면 어느 쪽이 최신인지 모른다

    var row = el('div', 'actions');
    // ★ **api 를 함께 넘긴다.** 안 넘기면 다음 화면이 api:null 로 열려
    //   「API 주소가 설정되지 않았습니다」가 뜬다 — 부모가 열어 준 문이
    //   안에서 잠기는 셈이다 (flow-core.urlFor 이 같은 이유로 넘긴다)
    var next = el('a', 'btn', '가이드 필드 입력으로 →');
    next.href = stepUrl('fields.html', c.projectId);
    // 올리는 중에는 못 넘어간다. 넘어가면 업로드가 중간에 끊긴다
    if (state.busy) { next.setAttribute('aria-disabled', 'true'); next.removeAttribute('href'); }
    row.appendChild(next);
    var again = el('button', 'btn btn--ghost', '새로 만들기');
    again.type = 'button';
    again.addEventListener('click', function () {
      state.created = null; state.uploaded = null; state.files = [];
      state.request = ''; state.assetType = ''; state.error = null;
      render();
    });
    row.appendChild(again);
    box.appendChild(row);
    return box;
  }

  function render() {
    body.textContent = '';
    meta.textContent = '';

    var acc = Gate.access(C.session, 'pro');
    if (!acc.allowed) {
      var g = el('div', 'gate');
      add(g,
        el('div', 'gate__ic', Gate.gateIcon(acc.reason)),
        el('div', 'gate__t', '보고서 생성 입력'),
        el('div', 'gate__b', Gate.accessMessage(acc)),
        el('button', 'gate__cta', acc.reason === 'unauthenticated' ? '로그인' : '플랜 보기'));
      body.appendChild(g);
      return;
    }

    body.appendChild(steps());

    if (state.loadError) {
      var e1 = el('section', 'card');
      e1.appendChild(el('h2', 'card__t', '접수 정보를 불러오지 못했습니다'));
      e1.appendChild(el('div', 'note note--bad', state.loadError));
      e1.appendChild(el('p', 'card__s',
        '올릴 수 있는 형식과 용량 한도를 서버에서 받아옵니다. 화면에 복사본을 두지 않기 때문에, '
        + '불러오지 못하면 입력을 받지 않습니다 — 되는 줄 알고 올렸다가 나중에 안 된다는 걸 알면 더 나쁩니다.'));
      body.appendChild(e1);
      return;
    }
    if (!state.info) {
      body.appendChild(el('div', 'card')).appendChild(el('div', 'empty', '불러오는 중입니다…'));
      return;
    }

    if (state.created) {
      meta.textContent = '프로젝트';
      meta.appendChild(el('b', null, state.created.projectId));
    }

    if (state.error) body.appendChild(el('div', 'note note--bad', state.error));

    // ★ 진행 바를 **여기**서 그린다. 자료 칸 안에 두었더니 프로젝트가 만들어지는
    //   순간 그 칸이 사라져 — 업로드가 시작되는 바로 그때 — 진행 바가 함께
    //   사라졌다. 무엇을 기다리는지 화면이 말하지 않는 상태가 된다
    var up = uploadCard();
    if (up) body.appendChild(up);

    if (state.created) {
      body.appendChild(resultCard());
      return;
    }

    /* ★★ **차례는 사용자가 정한 그대로다** 〈2026-08-22 지시〉:
     *     ① 발행 주체 ② 무엇을 만들까요 ③ 자료 업로드
     *   앞 판은 「무엇을 만들까요」가 먼저였다. 발행 주체를 앞에 두는 쪽이
     *   맞다 — **누가 내는 문서인지**가 정해져야 나머지가 그 회사 것이 된다.
     *   (안 넣으면 문서에 「발행 주체 미설정」이 찍히고 승인이 막힌다) */
    /* ★ `part` 가 있으면 **그 칸만** 편다. 없으면(따로 열었을 때) 다 편다 */
    var show = function (p) { return !PART || PART === p; };
    if (show('issuer')) body.appendChild(issuerCard());
    if (show('ask')) { body.appendChild(requestCard()); body.appendChild(formatCard()); }
    if (show('files')) { body.appendChild(dropCard()); body.appendChild(actionsRow()); }

    /* ★★ **만드는 버튼이 없는 칸에서는 그렇다고 말한다** 〈2026-08-22〉.
     *   1·2단계만 보고 있으면 [프로젝트 만들기] 가 화면에 없다. 아무 말도 안
     *   해 두면 사용자는 **여기서 끝난 줄 알고 기다린다** — 기다릴 것이 없다. */
    if (PART && PART !== 'files') {
      body.appendChild(el('p', 'card__s',
        '여기 적은 것은 이 브라우저에 저장됩니다. 3단계 「관련자료 업로드」에서 '
        + '[프로젝트 만들기] 를 눌러야 1·2·3단계가 함께 서버로 갑니다.'));
    }
  }

  /* ── 시작 ─────────────────────────────────────────────── */

  var params = new URLSearchParams(location.search);
  if (params.get('api')) C.api = params.get('api');
  PART = params.get('part') || null;
  loadDraft();

  var su = document.getElementById('side-user');
  if (su) su.textContent = (C.session && C.session.name) || '';

  if (window.LinkPilotInApp && window.LinkPilotInApp.auto) {
    try { window.LinkPilotInApp.auto(); } catch (_) {}
  }

  render();
  load();
}());
</script>
</body>
</html>
