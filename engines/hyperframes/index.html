<!doctype html>
<html lang="ko" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script><!-- 워크플로가 engines/node_modules/gsap 에서 이 자리로 복사한다 (CDN 을 안 쓴다) -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0A1419; }
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px;
        font-family: Paperlogy, 'NanumGothic', sans-serif; color: #fff; }
      #big { font-size: 180px; font-weight: 700; color: #AAE106; }
      #cap { font-size: 64px; font-weight: 700; text-align: center; line-height: 1.3; padding: 0 110px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="big" class="clip" data-start="0" data-duration="3" data-track-index="0">1968</div>
      <div id="cap" class="clip" data-start="0" data-duration="3" data-track-index="1">엔진 설치 시험 — HyperFrames</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#big', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6 }, 0);
      tl.fromTo('#cap', { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.3);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
